thesis: "爭點是 2.5 倍自我擴產之後，57% 的毛利率還撐不撐得住多波長的溢價"
thesis_since: 2026-09-10
# ⚠ 只留爭點，前提移入 key_variables 與 notes（LITE 那輪的教訓，AXTI 起沿用）。
#   前提（已確立、不是爭點）：**量是真的，而且沒有基期助力** ——
#   月營收年增率單調上升（3 月 +89.35% → 8 月 +180.90%），
#   **而 2025 年同期每月都在 1.81–1.85 億元之間、幾乎是平的，所以加速不是基期造成的。**
#   ⚠ **為什麼爭點是率不是量**：**本檔自己就是新供給的主要來源。**
#   **2027 產能 2.5 倍意味著市場上多波長 CW 雷射的供給主要由它自己增加 ——
#   若需求跟得上，是規模效益；若跟不上，壓價的人就是它自己。**

