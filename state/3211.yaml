    ⚠ **層級軸未跨（淨現金未取得）—— 本日第六檔。六次之後這不再是 gaps，是流程缺陷。**
    **而本檔的淨現金特別重要：A7 土地若有對應負債，選擇權拆分的淨值會完全不同。**
    ⚠ **明文禁用台達電 2308 作為估值錨** —— 清單內、且在 BBU 上競爭，
    **理由用的是 6805 那一檔收斂寫定的通則。**
    ｜三情境**刻意不建立**：主錨的土地那一半只有一個沒有佐證的數字；
    檢查器要在 13.8% 與 20.0% 之間選，而那正是 thesis 押的東西；
    兩家清單外同業倍數一家都沒取得；**且 TTM EPS 被壓縮，任何以它為分母的倍數
    都會讓本檔看起來貴。**
    ｜評級**中性／信心低**。位階**整理**（價格在季線之下 4.93%）。
    ⚠ **invalidation 留空 —— 已經跌破的線不能當失效價位；季線在這裡是壓力不是支撐。**
    ⚠⚠ **但本檔是本輪第一檔「均線的距離本身沒有問題」的標的**：
    **季線距現價 +5.19%，且高於一個日振幅 4.39% —— 兩端都不越界。**
    **那條雙邊規則的「可用」定義，在本檔身上第一次得到一個正面的樣本。**
    ｜⚠⚠ **本檔為「先看去年那條線的形狀」補上了第三種情況，而它是最麻煩的一種**：
    **平的（3081）可以直接讀年增率；單調斜的（3017／6805／8299）改用絕對金額；
    本檔是不規則的，而本檔 2026 年的月營收同樣不規則 ——
    兩年形狀都不規則時年增率與月增率都不可讀，只有累計或季度有訊號。**
    **第一條 falsifier 因此不用月營收，改用季度的 BBU 占比 ——
    本輪十二檔中第一次月營收完全不能當 falsifier 的錨。**
    ｜⚠ **rank_metrics 第五次執行「確認不到就換掉」，但拒絕理由是新類型**：
    **前四次是「同業頻率不對等」，本次是「兩年都不規則」——
    指標取得得到，但讀不出訊號。兩種失效應該分開記。**
    ｜⚠ **刻意不引用 `accelerator-roadmap`**：BBU 的單位價值取決於機櫃功率密度，
    真正的傳導變數確實住在那裡，**但本檔的產品規格與機櫃功率的對應關係完全未取得，
    引用它會是一個我無法驗證的宣稱。**

