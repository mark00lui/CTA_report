notes: 本檔與其他覆蓋標的的關係不對稱 —— NVDA 的資料中心營收「同時是」drivers/ai-accelerator-demand
  的主要成分，也就是說它既是被研究的個股，也是驅動 TSM／3324／6442 模型的上游資料源。因此本檔的
  key_variables 刻意避開資料中心營收（那住在 driver），只放 NVDA 自己的毛利率、費用、中國曝險與估值。
  ｜該 driver 的 why_shared 目前寫「NVDA 與 AMD 不在覆蓋清單內，正因如此它們的數字只能住在這一層」——
  這句話的前提在 2026-08-27 起不成立，但結論仍成立（理由是它驅動三檔硬體端，與是否被覆蓋無關）。
  下次 /driver 時應修正該句措辭，不要因為前提失效就把數值搬進 state。
  ｜估值口徑注意：Q2 FY27 的 GAAP EPS 高於 non-GAAP，與多數公司相反，做三情境前必須先釐清原因。

