    的單一 3 奈米專案，而客戶隨時可能把下一代轉給別家或自建團隊。**
    **需求全對，這條仍可能單獨發生。**
    **CEG 那一輪教會的事是：一檔標的若只有一條失效模式，通常是我只找到一條。**
    ⚠ 另記一個同類但無法設門檻的：**本檔是台積電的 VCA 夥伴，
    先進製程與先進封裝的產能配置不由它決定** —— 營收上限可能由代工產能而非需求決定。

