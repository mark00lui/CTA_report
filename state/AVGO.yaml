    → **thesis「持續期」那一問的核心風險**
    ｜`自身歷史 forward PE 區間 | 有無 | 取得即執行 | 需限 VMware 併購後的期間 | stockanalysis 歷史頁或月度序列`
    → **錨 A 目前是空的**
    ｜`NVDA 與 MRVL 的最新單季年化營收 | 有無 | 取得即執行 | 以財報認列為準 | 各自 8-K／10-Q`
