notes: 本檔在覆蓋清單中的角色是不對稱的 —— 它既是 AI 需求的受惠者（HBM），也是清單其餘標的的成本來源。
  記憶體漲價正是 Meta 與 Amazon 上修 2026 capex 時各自明確點名的原因（見 drivers/hyperscaler-capex.yaml
  的 components 註記）。換句話說：MU 的營收，就是平台端的成本，也可能是加速器端的毛利壓力。
  ｜NVDA Q3 FY27 毛利率指引由 75.0% 降至 74.0%，本倉庫先前將其歸因於 Vera Rubin 換代爬坡。
  HBM 成本上漲是第二個候選解釋，兩者意涵不同（前者暫時、後者結構性）。目前無證據區分，
  已列入 NVDA 的觀察事項，不在此下結論。
  ｜循環股的估值陷阱要寫在最前面：6.53x 遠期本益比配上 84.6% 毛利率，是教科書式的「峰值假便宜」。
  真正該問的不是「幾倍便不便宜」，而是「這個毛利率還能維持幾季」—— 而 86% 的毛利率本身
  就是全產業最強的擴產誘因，Micron 自己 FY2027 每一季都在調高資本支出。

