driver_refs:
- driver: hyperscaler-capex
  direction: '+'
  note: >
    CSP 資本支出 → AI 資料中心機櫃 → **BBU（電池備援模組）**。
    一手佐證：管理層稱「AI 資料中心持續擴建驅動下，以 BBU 為核心的非 IT 業務占比
    **今年首度突破整體營收五成**」；2026-07-29 法說稱「**BBU 需求強勁，下半年營收雙位數成長，
    毛利率重回正軌**」。
    ⚠⚠ **但本 driver 的扇出必須連同一個矛盾一起讀，否則會把敘事當成事實**：
    **Q2 2026 的非 IT 產品營收占比實際上降到 25%–30%，而 Q2 的營收成長來自 IT 產品。**
    **管理層的說法與該季的數字方向相反 —— 這是本檔的 thesis 本身。**
    ⚠ **且 Q2 利潤率收縮的原因由管理層自己指名為「BBU 某一機種客戶拉貨低於預期」——
    亦即 BBU 這條線目前是塊狀的、由單一機種主導，不是一條平滑的成長曲線。**
    **扇出時不可把 driver 上修直接換算成該檔的營收或毛利率。**
- driver: ai-accelerator-demand
  direction: '+'
  note: >
    加速器出貨 → 機櫃數 → 每櫃的 BBU 數量。
    ⚠ **敏感度記「中」而非「高」，理由是占比**：**非 IT 占比在 Q2 僅 25%–30%，
    另外七成仍是 IT（筆電等）電池模組，不受本 driver 影響。**
    ⚠⚠ **而本檔對本 driver 有一個與其餘硬體標的不同的性質：BBU 的單位價值取決於機櫃功率，
    不取決於加速器顆數。** **同一批加速器裝進不同功率密度的機櫃，BBU 的需求量差很多 ——
    真正的傳導變數住在 `accelerator-roadmap`（功率密度）而不是本 driver（出貨量）。**
    **本檔刻意不引用 `accelerator-roadmap`，理由見 notes：其產品規格與機櫃功率的對應關係
    本輪完全未取得，引用它會是一個我無法驗證的宣稱。**

valuation_frame:
