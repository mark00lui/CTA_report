      **「LITE 在虧損」曾被我當成壓低 COHR base 可信度的理由之一 —— 該理由不成立。**
      **但 base 的方法缺陷未被推翻，只是理由換成「LITE 是族群上緣」——那條規則只看位置。**
      ⚠ **對比兩檔的營運與估值，序位分析要回答的正是這個交換比率**：
