driver_refs:
- driver: ai-accelerator-demand
  direction: '+'
  note: >
    加速器出貨 → AI 資料中心的儲存需求 → NAND 供需吃緊 → 現貨價上行。
    ⚠⚠ **但本檔在這條傳導上的位置與 MU／SNDK 相反，扇出時最容易讀錯的就是這一點**：
    **NAND 漲價對上游是售價，對本檔是原料成本。**
    **本檔目前的高毛利（Q2 2026 為 65.31%，去年同期 29.06%）有相當部分來自
    低價庫存與現貨價之間的時間差 —— 那是一次性的價差利益，不是議價能力。**
    **時間差會結束，而結束的時點取決於庫存周轉，不取決於 AI 需求。**
    ⚠ **敏感度記「中」而非「高」**：**方向為正是因為短期的存貨利益與模組定價，
    但同一個變數在庫存消化完之後會轉為負向。這是本清單唯一一檔對同一個 driver
    短期與中期方向相反的標的。**
  # ⚠⚠ 這正是 CLAUDE.md 說的「同一則消息對不同標的方向可能相反」，
  #   而本檔把它推進了一步：**同一則消息對同一檔標的，在不同時間軸上方向也相反。**
- driver: hyperscaler-capex
  direction: '+'
  note: >
    CSP 資本支出 → 資料中心儲存容量 → 企業級 SSD 與 NAND 需求。
    ⚠⚠ **敏感度低，而且理由必須寫死，否則下一輪會被當成保守而調高**：
    **本檔的營收爆發（2026 前 8 月累計年增 278.99%）主要是 NAND 價格循環，
    而不是可驗證的 AI 出貨量。**
    **企業級／AI 相關的營收占比本輪完全未取得（列 gaps），
    因此無法斷言這條傳導有多少實質內容。**
    ⚠ **這也是本檔刻意不標 `ai_capex_hw` 的直接理由** ——
    **與 MU／SNDK（兩者皆標）的差別在於：它們賣的是位元，價格上漲時量價齊揚；
    本檔賺的有相當部分是價差，那是一筆從客戶手上轉移過來的錢，不是 AI 需求創造出來的。**

