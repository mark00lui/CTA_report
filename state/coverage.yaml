  ai_capex_hw:    {count: 19, pct: 73.1, note: "⚠⚠ **2026-09-10 同日第八度新增（3081），自 72.0% 升至 73.1%，第十一次刷新歷來最高。** **本日一天之內這一格自 68.4% 走到 73.1%（13 檔 → 19 檔）。**原註：⚠⚠ **2026-09-10 同日第七度新增（3017），自 70.8% 升至 72.0%，第十次刷新歷來最高。** **本日一天之內這一格自 68.4% 走到 72.0%，中間還經歷過一次下降（3533 使其降至 69.6%）。** ⚠ **本日對這一格學到的東西不是那個百分比，是它終於有了邊界**：**3533 拒絕標（伺服器 55.36% 但那是 CPU 插槽，AI 直接曝險僅約 1%）、2345 與 3017 標（白牌交換器與散熱模組直接對應 CSP 建置）。** **如果沒有 3533 那個拒絕，72.0% 只是「看起來像 AI 的東西佔七成」，那不是資訊。**原註：⚠⚠ **2026-09-10 同日第六度新增（2345），自 69.6% 回升至 70.8%。** **但這一次的上升與本日前四次的性質完全不同，而那個差別是這一格今天真正學到的東西：** **同一天，同一個標籤，我對兩檔做了相反的判斷，而兩邊的理由都可查。** **3533：伺服器佔營收 55.36%（年增 +71%）卻不標 —— 那是一般用途伺服器的 CPU 插槽，直接 AI 相關的 QDS 僅約營收 1%，且管理層自己說 GPU 專案時程不確定。** **2345：標 —— 白牌交換器直接賣給超大型 CSP，FY2025 營收 +125%、2026 前 8 月 +61.86%，近六個月單月年增率沒有一個低於 +44%。那條曲線與四大 CSP 的資本支出曲線是同一條。** ⚠⚠ **標籤的價值全部來自這種區分。如果兩檔都標，這個因子就只是「看起來像 AI」的同義詞，而 70.8% 這個數字也就不再是資訊。** ⚠ **因此本次的正確讀法不是「集中度又惡化了」，是「這一格今天第一次有了明確的邊界」。**原註：⚠⚠ **2026-09-10 納入 3533 後，這一格自 72.7% 降為 69.6% —— 本日第一次下降，也是自 CEG／AVGO 之後第一次下降。分子沒動（維持 16 檔），只有分母增加。** ⚠⚠ **而它之所以能下降，是因為 3533 刻意不標這個因子，而那是一個需要辯護的判斷**：3533 的伺服器營收佔 55.36%（年增 +71%），**但那主要是一般用途伺服器的 CPU 插槽**（動能來自 Intel Oak Stream 與 AMD Venice 平台世代切換），**直接 AI 相關的 QDS 目前僅佔營收約 1%（下半年估 2–3%），SOCAMM 剛量產，且管理層明言 GPU／AI 晶片專案「採用與導入時間不確定」。** **標上去會讓這個模型說一句我沒有證據的話。** ⚠ **已在 state/3533.yaml 的 changes_if 寫定重新分類規則：QDS ＋ SOCAMM 合計營收占比 > 15% 則加上本標籤並重估 —— 讓分類本身可被否證。** ⚠⚠ **同時要誠實記下：連續四次失效之後的這一次下降，是靠「找到一檔性質不同的標的」達成的，不是靠稀釋。前一格的結論（「我目前的搜尋範圍本身就落在 AI 硬體鏈裡」）因此被修正了一半 ——範圍是可以走出去的，只是要刻意去做。**原註：⚠⚠ **2026-09-10 同日第四度新增（AAOI），自 71.4% 升至 72.7%，第九次刷新歷來最高。** **稀釋機制連續第四次失效 —— 本日納入的四檔（2308、LITE、AXTI、AAOI）全部落在這一格內。** ⚠ **前一次已把結論寫成「我目前的搜尋範圍本身就落在 AI 硬體鏈裡」，本次沒有推翻它，是再確認一次。** **下一次要降低這一格，唯一的辦法仍是刻意去找一個我平常不會看的東西 —— 而連續四次沒做到，說明那不是待辦事項，是一個需要改變做法的問題。**原註：⚠⚠ **2026-09-10 同日第三度新增（AXTI），自 70.0% 升至 71.4%，第八次刷新歷來最高。** ⚠⚠ **而值得記的不是又創新高，是稀釋機制連續第三次失效** —— CEG 與 AVGO 曾各自把這一格拉低，**但本日連續納入的三檔（2308、LITE、AXTI）全部落在這一格內**。**「靠新增標的分散」這個做法在本日被證明無效：我挑得到的新標的都在同一格。** ⚠ **這件事本身就是結論** —— 它說的不是清單失衡，而是**我目前的搜尋範圍本身就落在 AI 硬體鏈裡**。下一次要降低這一格，唯一的辦法是刻意去找一個我平常不會看的東西。原註：⚠⚠ **2026-09-10 同日再納入 LITE，自 68.4% 升至 **70.0%**，第七次刷新歷來最高，且首度達到七成。** 序列 58.3 → 61.5 → 64.3 → 66.7 → 68.8 →（CEG／AVGO 稀釋回 64.7／66.7）→ 68.4 → **70.0%**。⚠ **值得單獨記的是稀釋失效了**：CEG 與 AVGO 曾各自把這一格拉低，**而本日連續納入的兩檔（2308、LITE）都在這一格內，沒有任何稀釋作用。** 原註：⚠⚠ **2026-09-10 納入 2308 台達電，自 66.7% 升至 68.4%，刷新歷來最高（第六次）** —— 序列為 58.3% → 61.5% → 64.3% → 66.7% → 68.8% →（CEG／AVGO 稀釋回 64.7%／66.7%）→ **68.4%**。**逾三分之二的覆蓋標的共用同一條需求鏈。** ⚠ **但 2308 在本因子內的傳導性質與其餘十二檔不同，扇出時不可套用同一個強度**：其餘標的受惠於**機櫃出貨台數**，2308 同時受惠於**單櫃功率密度**（54V → ±400V → 800VDC 的換代由功率密度驅動，不由台數驅動）。**這是本因子內第一檔與出貨量部分脫鉤的標的** —— 即使 AI 伺服器出貨量成長減速，只要單櫃功耗續升，這條鏈仍有量。⚠ **也因此它對 hyperscaler-capex 的 sensitivity 記為「中」而非「高」**：capex 金額只打到它一半的曝險，另一半住在 accelerator-roadmap 的 power_architecture。原註：⚠ **2026-09-08 同日再納入 AVGO，自 64.7% 回升至 66.7%。** ⚠⚠ **但 AVGO 在因子層帶進一件此前不存在的事：清單內部第一次出現方向相反的兩檔。** AVGO 的 AI 營收**就是**超大規模業者自研加速器的採購金額（FY2026 Q3 為 16.7B、Q4 指引 21.7B），**若某家 CSP 自研轉外購（改買 NVDA），對 AVGO 是營收減項而對 NVDA 是利多**。此前本因子內十一檔雖深淺不一但方向一致。⚠ **這使「ai_capex_hw 66.7%」第一次不能被讀成「66.7% 同向曝險」。** 原註：⚠ **2026-09-08 納入 CEG 後自 68.8% 降至 64.7% —— 這是連續五次刷新新高之後的第一次下降，也是本清單第一檔真正稀釋這個因子的新增標的。** 原註：TSM + NVDA + MU + SNDK + 3324 + 6442 + COHR + 3037 + 8046 + 6239 + 3030 — 同一條需求鏈。⚠ **2026-09-08 納入 3030 後自 66.7% 升至 68.8%，連五次刷新歷來最高**（58.3% → 61.5% → 64.3% → 66.7% → 68.8%）。**逾三分之二的覆蓋標的共用同一條需求鏈**，任何 common_premise 層級的變動會同時打到十一檔。⚠ **但 3030 的曝險性質與其餘十檔不同，扇出時不可套用同一個傳導強度**：它做的是組裝電路板自動檢測設備（AOI），客戶為 EMS、PCB 與封測廠 —— **對 AI 資本支出的曝險是間接的（經由客戶的設備投資），而非直接出貨給 CSP 或加速器廠**。對照 6239 直接服務 AMD／Broadcom，兩者差一層"}
