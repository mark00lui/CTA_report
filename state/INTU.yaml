# 公開研究檔 — 本倉庫不含任何倉位資訊：無成本、無張數、無權重、無 Kelly、無損益、無持倉揭露。
# 未知值一律留 __ 並寫進 gaps，不要填看起來合理的數字。
#
# 估值口徑注意：自 2026-08-01（FY2027 起）Intuit 的 non-GAAP 已「含」股權薪酬，
# FY27 指引內含每股 $5.81。scenarios 的 eps 與 exit_multiple 均為新口徑。
# 歷史 30–40x 為舊口徑（排除 SBC），換算新口徑約 38–50x。跨年度 EPS 比較前務必先還原。
ticker: INTU
name: Intuit
market: US
factor_tags:
- ai_application
- saas
thesis: 護城河同時被 agentic AI 與低價競爭測試；管理層以自願降價重建漏斗換取更大付費基數，估值已定價轉型失敗，驗證要等 2027 報稅季
thesis_since: 2026-08-26
valuation_base_year: FY2027
scenarios:
  bear:
    p: 0.30
    p_basis: 機率由使用者於 2026-08-26 全量重估指定。AI 替代風險在 2027 報稅季前無法否證，屬不對稱的無知不可低估；但管理層連五季超預期，且本次侵蝕經證實來自價格而非 AI，故壓在三成而非更高
    key_assumption: 降價未換回件數；agentic AI 對 DIY 與記帳的替代真實發生；FY28 營收成長跌破 8%
    eps: 22.88
    exit_multiple: 10
    multiple_basis: "錨在「SaaS 護城河被證偽」後的結構性衰退定價（9–11x forward），非本檔歷史 —— 歷史區間在此情境下依定義不適用，因為該情境的前提正是這家公司不再是歷史上那家公司"
    tp: 229
    narrative: 「自願重置」事後被證實是被迫，市場給結構性衰退倍數
  base:
    p: 0.45
    p_basis: FY27 減速是管理層自選而非被動下修，達成機率高於一般情形；QuickBooks Free/Lite 首月逾 20,000 戶與 Mid-Market Q4 +39% 證明漏斗運作中
    key_assumption: FY27 指引達成；件數止穩但以 ARPU 讓利換取，成長維持 9–10%
    eps: 23.00
    exit_multiple: 15
    multiple_basis: "錨 C（reverse-DCF，2026-08-27 完成，本檔自「無獨立估值基礎」升級）。錨 A 仍失效：自身歷史 forward 5 年平均 31.22x 跨越 AI 顛覆疑慮前後，且 FY2026 起 non-GAAP 納入 SBC 使口徑不可比（歷史換算為新口徑約 39x）。錨 B 同業同樣被 AI 疑慮重評價，無乾淨可比。改用錨 C：TTM 自由現金流 8.62B，扣除 SBC 約 1.59B（FY27 舊口徑 EPS 28.81 對新口徑 23.00，差額 5.81×2.7354 億股）後為 7.03B；市值 94.61B（現價 345.88）。以永續成長模型反推，折現率 8%／9%／10% 對應市場隱含永續成長率 0.53%／1.46%／2.39% —— 亦即市場付的價格假設 INTU 的自由現金流永遠只能跟上通膨甚至更慢，而公司 FY27 guidance 是營收 +9~10%、non-GAAP EPS +23~24%。這個落差就是 AI 顛覆風險的定價，且它可否證。交叉檢查：本檔三情境 10x／15x／22x 對應的市值在 r=9% 下隱含永續成長 -2.0%／+1.4%／+3.9%，與 PE 框架內部一致，兩種方法未互相矛盾"
    tp: 345
    narrative: 15x ⇔ DCF 隱含永續成長約 +1.4%（r=9%）。⚠ 循環性檢查：base 345 與 8/27 現價 345.88 僅差 0.25%，但這是結論不是產物 —— 15x 訂於 8/26（當時現價 315.6，隱含 13.7x），是價格事後漲上來與模型會合
  bull:
    p: 0.25
    p_basis: 需要件數回正與倍數修復同時發生，而件數要到 2027-05 才看得到，時間上不允許更高權重
    key_assumption: 2027 報稅季付費件數回到 +5% 以上；Mid-Market 維持 30%+；市場承認 AI 恐慌過度
    eps: 24.00
    exit_multiple: 22
    multiple_basis: "錨在自身歷史但明確打折：5 年 forward 平均 31.22x 換算為新（含 SBC）口徑約 39x。取 22x 等於假設 AI 顛覆造成的折損有一半是永久的 —— 即使 bull 也不回到歷史區間"
    tp: 528
    narrative: 倍數向歷史區間下緣修復，但即使 bull 也假設永久折損未完全消失（22x 仍遠低於歷史換算後的 38–50x）
  weighted_tp: 356
