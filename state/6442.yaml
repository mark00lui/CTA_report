- date: 2026-09-12
  level: L2
  summary: 台股基準年修正連續作業第二十三檔（台股佇列最後一檔） — ⚠⚠⚠ §9b(a) 的代數恆等第二次出現（3324 之後，故為建模習慣）：目標價 = trailing 錨 x TTM EPS，+2.4% 的變動 100% 來自 TTM EPS。bull 的辯護詞重算後反向（真 trailing 等值 73.85x 超過 2025 高點 72.97x）。本檔是唯一一個兩個不可滾動的理由同時成立的
  delta: >
    ⚠⚠⚠ **(1) §9b(a) 的代數恆等第二次出現（3324 之後），確認它是這個倉庫的一種建模習慣而非個案。**
    **本檔三個倍數與 3324 一樣，都是「自身 trailing 歷史分位 ÷ 成長率」換算的 forward 等值，
    而成長率含 EPS，故 `目標價 ＝ trailing 錨 × TTM EPS`。
    由 state 自己的三個目標價反推（TP ÷ 其 TTM 33.80）得 trailing 錨
    bear **32.31x**／base **49.53x**／bull **73.85x**，加權 **51.31x**。
    驗證：51.31 × 33.80 ＝ 1,734.3 ✓；以更新後的 TTM EPS 34.59 重算 ＝ **1,775.0**。
    → 本輪 +2.4% 的變動 100% 來自 TTM EPS（33.80 → 34.59，+2.3%），
    與三個情境的 EPS、與基準年全都無關。**
    ✓ **但它不是循環引用**：trailing 錨來自 2024–2026 的自身 trailing 本益比觀測
    （2026 迄今 109.89／47.78、2025 72.97／25.50、2024 122.00／30.83），不來自現價 ——
    **循環性通過，失效的是 EPS 的獨立性。**
    **→ 回填：以自身歷史 trailing 分位當錨時，若用成長率換算成 forward 倍數，
    則三情境的 EPS 不參與輸出；要讓 EPS 參與，倍數必須有一個不引用 EPS 的來源。**
    ｜⚠⚠⚠ **(2) state 標的 trailing 等值同樣對兩翼算錯（用 base 的 +37.6% 換算全部三格），
    而其中 bull 的錯誤使一句結論反向。**
    **bull 自己的成長率是 +53.8%，真 trailing 等值 ＝ 48 × 1.538 ＝ **73.85x**；
    而 state 稱「取 48x **遠低於** 2024 的 122.00x 與 2025 的 72.97x ——
    本情境不需要市場付出它 2024 或 2025 付過的價」。
    73.85x **超過 2025 年的 trailing 高點 72.97x（高 1.2%）**，所以那句話對 2025 是錯的。
    ✓ 對 2024（122.00x）與 2026 迄今（109.89x）仍然成立。
    數字不動（它是 trailing 錨的函數），辯護詞必須改。**
    **bear 的方向正確而幅度被低報**：真 trailing 等值 32.31x，
    **高於 2025 年的低點 25.50x 達 26.7%、高於 2024 年的低點 30.83x 達 4.8%** ——
    亦即 bear 的倍數比 AI 期間任何一年的觀測低點都高，在倍數這一側相當溫和。
    **→ 這是「trailing → forward 的換算必須用該情境自己的成長率」的第二次實證（3324、本檔）。**
    ｜⚠⚠ **(3) 基準年維持 2026，而本檔是二十三檔裡唯一一個兩個不可滾動的理由同時成立的：**
    **(i) 無覆蓋 —— 鉅亨兩次不同關鍵字搜尋皆無 EPS 型亦無目標價型；
    stockanalysis 的 analyst target 與 analyst count 都是 n/a；state 原記的 2 家已低於 5 位門檻。
    (ii) 代數恆等 —— 滾動基準年不會改變任何數字。**
    **前面三檔各只有一個：2337（FY2027 是循環的頂）、3030（無覆蓋）、3324（代數恆等）。**
    ✓✓ **但 2026 這個基準年在本檔是合格的，而那一點與 3030 正好相反：
    以盈餘計殘餘度 **0.59**（H1 EPS 19.07 ÷ FY2026E 46.5 ＝ 41.0% 已實現），通過 0.5 門檻；
    以曆日計約 0.33（不通過）。兩者結論相反，差別來自 H2 遠強於 H1
    （FY2026E 需要 H2 做到 27.4，是 H1 的 1.44 倍）。
    → 門檻應該用盈餘基礎，因為它要測的是「基準年的 EPS 還有多少是未知的」。
    對照 3030：那一檔兩種基礎都是 0.33，所以看不出差別；本檔才看得出來。**
    ｜⚠⚠ **(4) 「完全未覆蓋」的第三個實例（3363／3030／本檔），而它推翻我在 3030 寫的一個佐證：**
    **本檔的 analyst count ＝ n/a 卻同時報出 forward PE 17.39 ——
    亦即 forward PE 的存在不是覆蓋的證據，兩個欄位可以互相矛盾。
    判準（analyst count ＝ n/a）仍然正確，但不要再把 forward PE 當佐證。**
    ⚠ **而該 forward PE 隱含 EPS 96.03（＝ 1,670 ÷ 17.39），是 FY2026E 46.5 的 2.07 倍、
    TTM 的 2.78 倍，是十六個資料點裡最極端的一個而來源不明 ——
    本檔正是「不得由 forward PE 反推 EPS」這條禁令為什麼存在。**
    ⚠⚠ **唯一的外部 FY2026 數字（理財周刊／YesMedia 的 46.5）經 3211／6187 那套檢出法驗過：
    H1 19.07 ÷ 46.5 ＝ 41.0%，即 H2 須為 H1 的 1.44 倍；
    而訂單能見度已至 2026 年底、產能滿載兩班制、菲律賓廠已投產、高芯數產品下半年小量出貨 ——
    1.44 倍不離譜，未被實績推翻，base 沿用。**
    **⚠ 但同一篇的估值路徑含一個必須禁用的錨：「以 55x PE 對標**聯亞**」——
    而聯亞 3081 在覆蓋清單內，依 3583 細化後的規則不可作為本檔的錨。已記為明文禁用項。**
    ｜⚠⚠⚠ **(5) 本輪推翻我自己兩個推論，並使「52 週振幅 ÷ beta」這個指標降級。**
    **本檔 Beta(5Y) 1.27、52 週區間 753.00–2,540.00 ＝ 3.37 倍 → 比值 2.65，相稱。
    而把十一檔的兩欄離散度算出來：beta 自 0.24 到 1.70（7.1 倍），
    52 週振幅（排除 2337 的 9.65 倍與 2317 的 1.675 倍）九檔落在 2.27–3.84（1.7 倍的帶內）——
    比值的離散幾乎全部來自 beta，所以這個指標大致上只是一個 beta 的倒數排序。**
    **被推翻的兩個推論：(i) 2317／2337 的「中小型 AI 題材股的問題」——
    本檔是 AI 光通訊、市值 1,340 億而 beta 相稱；
    (ii) 3030 的「標的在 beta 窗口內經歷一次未重複的重評價」——
    本檔自 753 漲到 2,540 再回到 1,670 也是一次單向重評價，而 beta 抓得到。
    → 正確的問法是「為什麼在幾乎所有標的的年振幅都落在 2.3–3.8 倍的情況下，
    有幾檔的 beta 只有 0.24–0.62」，那更可能是 beta 估計量本身的性質
    （窗口／頻率／流動性／市場代理），不是個股特性。降級為覆蓋層問題，留給收尾報告。**
    ｜⚠⚠⚠ **(6) 「≥2 個日振幅」這條規則在本檔直接失效，而它是 2317 的鏡像。**
    **本檔日振幅極大（09-10 +5.88%、09-11 -7.22%），以 7.2% 計該規則要求 ≥14.4%；
    而在價格正確一側最遠的 MA240 只在 -9.0%（比值 1.25）、MA60 在 -7.8%（1.08）、
    MA20 在 -2.7%（0.38）—— 三條全部不滿足。失效價位因此無法從均線組設定，
    而那是波動度的性質不是價格位置的問題。✓ ±20% 上界本身沒問題。**
    **⚠ 2317 那一檔日振幅 1.59%（最低），要求只有 3.2%，在單日雜訊範圍內，太鬆；
    本檔要求 14.4%，太嚴。同一條相對規則在兩端之間要求的距離相差 4.5 倍。
    → 規則需要的不只是 2317 那輪提出的絕對下界，還需要一個上界。
    兩個相反的極端各揭露一半，合起來才看得見完整的缺陷。
    而 ATR 會大幅收斂這個問題 —— 本檔是它造成實質後果的最清楚案例。**
    ｜⚠⚠ **(7) base 前一版修掉的「現價隱含值」問題，已經在數字上看不出來了。**
    前一版 base 35x 就是現價隱含值（1,630 ÷ 46.5 ＝ 35.05x），2026-08-31 改成獨立推導的 36x；
    **而以本輪的現價重算隱含值是 35.91x，新倍數 36.85x 只高 2.6% —— 整個系列最小的差距。
    → 「不是現價隱含值」是關於推導的陳述，不是持久的性質；
    價格會動，獨立推導出的倍數可以再次落回隱含值附近。
    這個檢查必須每輪重跑，而當它再次重合時要說那是巧合，不是故態復萌。**
    ｜**錨定價 1,700 → 1,670（-1.76%）。路徑：1,630（08-31）→ 1,700（09-07 與 09-09）
    → 1,800（09-10，+5.88%）→ 1,670（09-11，-7.22%）。**
    ✓ **`price_note` 已主動記下「09-10 盤中一度達 1,790，台股當日尚未收盤，不入 price 欄」——
    本系列少見的、在當下就做對的紀律（對照 3583 把盤中讀數標成收盤）。**
    ⚠⚠ **而通道規則再確認一次而我又錯一次**：本檔是**上市**，stockanalysis 可用，
    **但我在 3211 那輪把它預測為上櫃／會 404。規則本身 7/7 成立
    （3363／3081／8299／3131／3211／3324 皆上櫃且 404；2337／3030／本檔皆上市且可用），
    錯的是我對個股上市／上櫃的記憶 —— 而且連續兩輪錯、方向相反
    （3324 說上市實為上櫃；本檔說上櫃實為上市）。
    → 「用規則做預測之前先確認分類那個事實」這條在 3324 那輪寫過一次而我仍然犯了，
