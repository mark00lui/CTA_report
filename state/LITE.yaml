- date: 2026-09-10
  level: '—'
  summary: 建檔。⚠ 同時修正 COHR 檔對本檔「虧損公司」的錯誤判讀；⚠ 並記下一個結構問題：本檔原本是 COHR 的錨，納入後形成循環引用
  delta: >
    新增 state/LITE.yaml。**三情境刻意不建立**（主錨所需的分部別終端市場拆分未取得），
    signal 為中性／信心低，下一步為 `/revalue LITE`。
    **valuation_frame 判定 Q4，判準逐項指名數值**：
    X 軸低代表性且是最極端的一種（**GAAP EPS -92.96，分母為負，trailing 本益比數學上無定義**；
    營收 FY26 +83.22%、Q4 +109%；營業利益自 -192.2 轉為 +536.2）；
    ⚠⚠ **Y 軸恰好卡在門檻上：capex／營收 14.97%，距 15% 僅 0.03pp**
    （FY25 為 14.04%，同樣貼線）—— **下一輪 capex 若再增即落入 Q3，整套方法要換，須每輪重問。**
    其餘判準指向低資本密集：D&A／營收 8.78%、淨現金 +10.7 億、FCF +3.001 億（自 -1.047 億轉正）。
    ⚠ **與 COHR 同象限，而這是應該的** —— 直接同業、同一條需求鏈；若判進不同象限才需要解釋。
    **基準年 FY2027 以算術鎖定**：現價 988.98 ÷ forward PE 45.70 ＝ **21.64**，
    與 FY2027 共識 EPS 21.64（21 位）**分毫不差**。殘餘度 1.00（Q1 FY27 未公告）。
    ⚠⚠ **建檔當日修正本倉庫既有的一個錯誤判讀**：COHR 檔於 2026-09-07 與 09-10 兩度把本檔
    描述為「虧損公司」「forward PE 建立在虧轉盈的預估上」「虧損公司的高轉換率是算術不是品質」——
    **但本檔 FY2026 的 GAAP 淨損 -69.35 億是一次性非現金的債務清償費用，
    同期營業利益為 +5.362 億、Q4 調整後 EPS +3.23 優於預期、非 GAAP 毛利率 50.4%（+1,260bps）。**
    **把 GAAP 淨損直接讀成營運惡化，是本輪第一次犯，而它影響的是另一檔的 base 錨。** 已一併更正 COHR 檔。
    ⚠ **但 EV/EBITDA 109.46 未被推翻** —— 它用真實 EBITDA（營業利益 536.2 ＋ D&A 264.5 ＝ 800.7M）算得，
    不受該筆費用影響。**「淨損是假的」與「倍數是貴的」兩件事同時為真。**
    ⚠⚠ **納入本檔造成一個結構問題：本檔原本是 COHR 的錨。** COHR 的三個情境倍數全部掛在
    FN 與本檔的 forward PE 上，**本檔成為覆蓋標的後，我對它的判斷會直接移動 COHR 的目標價 ——
    那是循環引用。** 處置：兩檔的錨各自獨立，但每次重估其一時必須檢查另一檔是否連動並明寫。
    ⚠⚠ **錨寬度 70.7%（目標價 820–1,400，26 位），是本清單至今最寬的一檔**
    （對照 GOOG 39.7%、CEG 5.78%）—— 建檔即以此壓住信心上限。**錨寬度寬本身就是資訊。**
    **三條 falsifier 全部設定，第一條（Q1 FY2027 營收低於指引下緣 12.3 億）在 6 個月內可驗證，
    且門檻直接取自公司自己給的指引 —— 不需要我另外假設一個水準。**
    ⚠ **技術面完全未建立**：50／200DMA 未取得，`invalidation` 與 `confirm_trigger` 皆為 `__`。
    **後果是本檔目前沒有任何技術面失效價位，在取得均線之前不得因任何理由升為偏多** ——
    即使 52 週報酬達 +561.97%（清單第三高，僅次於 SNDK +2,402%、MU +682%）。
    ⚠ **第四次遇到「事先寫定的排序指標當下取不到」**（CPO 料號進度；前三次為 3324、CEG、3030）
