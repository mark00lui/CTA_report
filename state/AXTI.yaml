    ⚠⚠ **但 Y 軸是本清單至今最不穩定的一格，且性質與 LITE 不同**：LITE 是貼線（14.97%），
    **本檔距門檻尚遠卻有公司自己公告的前瞻證據說它會越過** —— 6.325 億美元募資專供擴產，
    **對 FY2026 共識營收 2.1798 億是 290%**。**處置：依已發生數判 Q4，不拿計畫值當已發生，
    但列為每輪必問的第一題，並在 changes_if 明寫「已支出算數、宣告的計畫不算數」。**
    ｜方法組合跨**三軸**（分母／層級／參照）：主錨 EV/Sales（forward 18.9x）、
    副錨為**上下游層級交叉**（以 COHR／LITE 的出貨量與時程反推基板需求）、
    檢查器為合約鎖定覆蓋率（**4,770 萬 ÷ 130 = 36.7% 單季**）。
    ⚠⚠ **副錨的界線事先寫死：借下游的「出貨量與時程」可以，借下游的「倍數」不可以** ——
