notes: >
  ⚠ **本檔是第一檔在建檔階段就跑完 valuation_frame 的標的**（2026-09-08 起 /new-ticker 新增的步驟 5）。
  而它立刻顯示出這個順序的價值：**因為先決定了要用哪幾把尺，才知道去查同業與自身歷史 PE 區間** ——
  若照舊流程「查到什麼用什麼」，最可能的結果是只拿到一個 trailing PE 21.36 就停。
  ｜⚠ **但同一步驟也立刻暴露一個本檔無法克服的限制：沒有分析師覆蓋。**
  forecast 頁 404、forward PE 為 n/a、無目標價、無共識分布。
  **錨寬度算不出來不是資料還沒查，是這個標的沒有那個東西。**
  依 SKILL.md，錨寬度未知時信心不得因缺口減少而升等 ——
  **這意味著即使補上毛利率與資本支出，本檔的信心上限仍在「低」。**
  ｜⚠ **與覆蓋清單既有標的的一個關鍵差別**：本清單多數台股（6239、3037、8046、3008）
  都有分析師覆蓋，而 6442、3324 與本檔沒有。**這三檔的估值方法組合天生比其他檔少一把尺**，
  應視為同一類處理，而非個別的資料缺口。
  ｜⚠ **thesis 的爭點是估值折價本身，這在本清單中是第一次。** 其餘標的的 thesis 都關於
  營運（滲透率、產能、現金流、路徑），而本檔的 thesis 是「62.5% 的同業折價是否過頭」。
  這種 thesis 有一個特有的風險：**折價可能因同業下修而收斂，那不等於本檔被重評價** ——
  已寫進第三條 falsifier 的但書。
  ｜業務：組裝電路板自動檢測設備（AOI）與相關治具自動檢測設備。
  客戶為 EMS、PCB 與封測廠，故對 AI 資本支出的曝險是**間接的**（經由客戶的設備投資），
  而非直接出貨給 CSP 或加速器廠。⚠ 這與 6239（直接服務 AMD／Broadcom）不同，
  扇出時不可套用同一個傳導強度。
  ｜⚠ **2026-09-08 事件後補記 —— 本輪最該記的是三件關於流程的事，不是關於德律的事。**
  **(1) 我漏了一則八天前就已刊出、直接回答我所列缺口的報導。**
  建檔日是 9/8，這則工商時報報導的日期是 **8/31**，而它揭露的
  「半導體應用占比約 1 成、7 成研發人力投在先進封裝檢測」
  **正是我在 gaps 第四項寫下「未揭露」的那個數字**。
  它不是新資訊，是**既有資訊而我沒找到**。
  ⚠ 這與本session 稍早已承認的同一個病灶一致：我的「公司行動掃描」實際上是讀報價頁的
  news sidebar，**它有效，但那是運氣，不是設計**。單一入口漏掉了台灣的平面媒體。
  **(2) 建檔當日的 state 混了兩天的價格口徑，六個衍生值因此全錯。**
  price 用 9/8 收盤 270，但 PE／市值／P/S／PB／每股淨值／ROE 全部沿用報價頁上
  9/7 收盤 282 口徑的比率。**沒有任何腳本會擋下這件事** ——
  它是被「市值 ÷ 股價 的股數對不上 EPS 反推的股數」這個算術交叉檢查抓到的，
  與 3037 的 GDR 十倍錯誤、以及更早的 capex「4 billion 對 400 億」是**同一個家族**：
  **口徑或量級沒對齊，而且都只能靠把數字印出來自己看才抓得到。**
  **(3) 象限判錯，錯在 X 軸餵了一個價格輸入。**
  建檔時我用「52 週振幅 3.3 倍、距高點 -41%」論證「當期盈餘代表性低」——
  **但那是價格的波動，不是盈餘的波動。**
  取得利潤率序列後看到的是毛利率三年帶寬僅 1.17pp、營益率單調上升、無虧損年 ——
  **一組相當有代表性的盈餘。** 象限自 Q4 改判 Q1。
  ⚠ **而這件事有一個更值得記的推論**：thesis 講的是「本益比折價」，
  那**本來就是一個盈餘倍數（Q1）的論證**。**框架與論點從第一天就不一致，而我沒發現。**
  下次 /new-ticker 的步驟 5 應多問一句：**thesis 用的是哪一把尺？它和我宣告的象限一致嗎？**
  ｜⚠ **建檔時寫「選擇權拆分對本檔不適用」也是錯的。**
  1 成營收對 7 成研發，正是一條資源投入遠超營收貢獻的業務線。
  但在 Q1 裡它的處理方式與 Q4 不同：當期盈餘撐得住估值，
  **所以它是 bull 的來源，不併入 base。**
  ⚠ **且它有兩種完全相反的解讀，在當下的財報上長得一樣**：
  先投入後收成的**選擇權**，或**投資效率不佳**。
  分辨方式已寫進 changes_if 與 checkpoints：**看那個占比未來幾季會不會動。**
  ｜⚠ **thesis 本輪明顯變強，而信心刻意不動。**
  營益率 36.25% 對致茂 36.84%，**差僅 0.59pp**，兩家在營業獲利能力上近乎同級；
  而致茂的淨利率 41.12% 反而**高於**其營益率，代表其 EPS 被業外墊高 ——
  換成市值／營業利益口徑，折價自 64.1% 擴大為 **70.9%**。
  **但信心不升等，因為錨寬度仍算不出來（無分析師覆蓋）。**
  **關掉四個缺口而信心不動，是規則按設計運作。**
event_log:
- date: 2026-09-12
  level: L2
  summary: 台股基準年修正連續作業第二十一檔 — ⚠⚠⚠ 基準年仍滾不動而本輪驗證了為什麼：取不到是真的（stockanalysis 的 analyst count 標示 n/a），並導出「基準年規則預設了分析師覆蓋的存在」；但「沒試過自己建」那一半是真的，自營收端建得 FY2026 EPS 15.24-16.02 而 base 的 15.5 落在區間內。另把「風險集中在倍數」量化為倍數段佔對數全距 84.1%
  delta: >
    ⚠⚠⚠ **(1) 「基準年滾不動」這句話本輪被驗證，而它一半是真的。**
    **取不到是真的，而且本輪取得硬證據：stockanalysis 的 analyst price target 與
    analyst count **都標示 n/a**（不是搜不到，是站上明確標示沒有），forward PE 亦為 n/a；
    鉅亨兩型速報（EPS 型、目標價型）皆無；唯一的外部數字是一篇網誌的「EPS 預估逾 12 元」，
    而 TTM 已是 13.18 —— 該值已被實績超過。**
    **→ 「站上明確標示 n/a」與「我搜不到」是兩件不同的證據，前者強得多。
    這是「完全未覆蓋」型阻塞的第二個確認實例（第一個是 3363，而那次是推論的）。**
    **⚠⚠⚠ 並導出一條新規則：基準年規則預設了分析師覆蓋的存在。
    「市場通常改看次年 EPS」對一檔沒有任何人發布估計的股票沒有指稱對象 ——
    市場並沒有在看任何一年。規則的前提不成立，不是規則被違反。**
    **對照 2337：那一檔是規則與循環股規則衝突（FY2027 是循環的頂，
    滾過去會得到禁用的「峰值 EPS × 正常倍數」）。
    二十一檔裡只有這兩個例外，而它們的例外理由完全不同 —— 並列寫比各自記一條有用。**
    ｜⚠⚠ **(2) 但「沒試過自己建」那一半是真的，而本輪建出來了。**
    **以 8 月營收 9.97 億元（年增 31.88%、月減 3.49%）→ 7 月 10.33 億元；
    1–8 月累計 74.19 億元（年增 27.42%）→ 1–6 月 53.89 億元。
    以 2026 H1 EPS 7.35 × 2.3622 億股 ÷ 53.89 億元得 H1 淨利率 32.2%；7 月為 34.8%。
    Sep–Dec 以年增法（2025 同期 26.95 億 × 1.28 ＝ 34.5 億）與 run-rate 法（9.97 × 4 ＝ 39.9 億）
    各算一次 → FY2026 營收 108.7–114.1 億元；以 34% 下半年淨利率套用 →
    **FY2026 EPS 15.24–16.02**。**
    **✓✓ base 的 15.5 落在該區間內（距下界 +1.7%），而兩條路徑完全不同源 ——
    一條走營收與利潤率、一條走 EPS 的年增率。這是本檔第一次有這樣的交叉驗證。**
    **⚠ bear 的 14.4 落在自建區間的下界之下，而那是應該的：
    它要求 Sep–Dec 的 EPS 月均 1.015（對 7 月實績 1.52 減 33%），與其敘述一致。**
    **⚠⚠ 但 FY2027 仍建不出來，理由很具體：上面的推導成立是因為 FY2026 的 12 個月裡
    有 8 個已經是事實；FY2027 全部是未來，需要一個 2027 年的成長率而沒有任何外部來源提供它 ——
    自己給一個就是編造。基準年因此維持 2026 且仍不合格。**
    ｜⚠⚠⚠ **(3) 把 state 自己寫的「風險集中在倍數而非 EPS」量化了。**
    **目標價全距 492 ÷ 216 ＝ 2.28 倍 ＝ EPS 段 1.14 倍 × 倍數段 2.00 倍；
    以對數分解，**倍數段佔 84.1%**、EPS 段只佔 15.9% ——
    二十一檔裡最偏向倍數的一檔（次高為 3017 的 50.2%、3665 的 50.5%，最低為 6187 的 26.8%）。**
    **⚠⚠ 而它是不合格基準年的直接後果：一個 67% 已實現的年度
    （前八月 EPS 約 10.34 ÷ FY2026E 15.5 ＝ 66.7%），EPS 的三個情境必然互相貼近 ——
