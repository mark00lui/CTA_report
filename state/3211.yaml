  **建議把那一條補成雙向的：分母被膨脹與被壓縮都會讓 trailing PE 說謊，方向相反而已。**
  ｜⚠⚠ **敘事與季度數字互相矛盾，而這就是 thesis**：
  **管理層說「以 BBU 為核心的非 IT 業務占比今年首度突破整體營收五成」，
  但 Q2 的實際非 IT 占比降到 25%–30%，且 Q2 的成長來自 IT 產品。**
