#       **這裡是證據支持。同一個標籤，兩個相反的判斷，理由都寫在各自的檔案裡。**
#   (2) ⚠⚠ **判 Q4 而非 Q1，理由不是盈餘有問題，是成長率遠離穩態。**
#       EPS 序列 FY2025 **47.13** → 2026 共識 **73.8**（Factset），營收兩年內近三倍。
