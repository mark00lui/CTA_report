  accelerator:    {count: 3, pct: 7.7,  note: "⚠⚠ **2026-09-10 納入 3661 後自 2 檔變 3 檔（7.7% → 11.1%），而它帶來的是一個新的商業模式**：**NVDA 與 AVGO 都是「設計並銷售自己的晶片」；3661 是「依客戶規格設計、產品由客戶擁有」。** **兩者都不蓋廠，但營收認列、客戶關係、利潤率結構完全不同 ——故 3661 刻意不標 `fabless`（AVGO 有），另立 `design_service`。** ⚠⚠ **且 3661 與 AVGO 在同一批 AI ASIC 專案上是零和競爭關係，已於 state/3661.yaml 明文禁用 AVGO 作為估值錨。** **AVGO 的同業是 NVDA 與 MRVL 並未列入 3661，目前沒有循環引用；但單向依賴＋互為競爭是最壞的組合，故從一開始就擋掉。** **這是本日第三組「覆蓋清單內互為競爭」的配對**（前兩組：3324／3017、散熱鏈上的 2308）。（歷史沿革 2 段已移入 reports/2026/09/2026-09-11-coverage-note-history.md）"}
  memory:         {count: 6, pct: 15.4, note: "⚠⚠⚠ **2026-09-10 納入 2337 旺宏後自 5 檔變 6 檔（13.5% → 15.8%），而 2337 是這一格第一檔與 MU／SNDK **同機制**的台股標的：有廠製造、賣位元、量價齊揚。** **這一格現在有六檔而只有三種機制 —— 6239 是封測、8299 是模組價差、6531 是無廠客製化設計、MU／SNDK／2337 是有廠製造。** **納入 2337 之後，這一格第一次可以在「同機制」內部做序位比較。** ⚠⚠ **但借 MU／SNDK 要打折**：**它們做標準型 DRAM／NAND（大宗商品），2337 做專業型記憶體（NOR、SLC NAND、ROM、車規 eMMC）—— 循環幅度與客戶結構不同。** **借它們的**循環位置判讀**比借倍數有用。** ⚠⚠ **並記下 2337 與 8299 的差別，因為兩檔的漲價故事看起來一樣**：**8299 是模組廠，賺的是現貨價與存貨成本的時間差 —— 那筆利益會隨庫存周轉結束；** **2337 有自己的廠，漲價利益會持續到供需反轉，但代價是產能一旦建好就撤不掉。** **兩者的時間結構不同 —— 而那正是「全年自由現金流為負」這條 falsifier 只對 2337 有意義的原因。**（歷史沿革 4 段已移入 reports/2026/09/2026-09-11-coverage-note-history.md）"}
  cyclical:       {count: 8, pct: 20.5, note: "⚠⚠⚠ **2026-09-10 納入 2337 旺宏後自 7 檔變 8 檔（18.9% → 21.1%），而 2337 是本清單第一檔真正的「循環型 Q3」。** **本輪此前的三檔 Q3（AAOI 128.97%、3081 217.8%、3363 87.8%）全部是靠**擴建**進來的，沒有一檔是因為循環位置。** ⚠⚠⚠ **而 2337 為那個提了三次的拆分建議提供了對照組**：**Q3 的兩個預設錨（PB／重置成本、中週期正常化 EPS）在三檔擴建型身上全部失效（3081 的股價淨值比 56.17、3363 的 14.13，且兩檔都沒有正常盈餘可正常化）；** **在 2337 身上**兩個都能用** —— 股價淨值比 4.04，而它有完整的循環歷史可以正常化。** **拆分不再只是三個個案的並列。** ⚠⚠ **並記下 2337 帶來的一個對 references 直接可用的範例**：**同一個價格 126.50 算得出三個本益比 —— TTM 29.98 倍、H1 年化約 13.1 倍、Q2 年化約 8.1 倍，差 3.7 倍，因為 TTM 的分母裡還含著 2025 下半年約 -0.60 元的虧損。** **valuation-map 對 trailing PE 只寫了「⚠ 說謊時：循環頂（低 PE 看似便宜）」——那是 8.1 倍那一端；29.98 倍那一端是鏡像（循環底剛翻正，高 PE 反而是便宜的訊號）。** **本輪第三次要求把那條警語做成雙邊（前兩次 8299、3211），而 2337 是第一個三個數字全部算得出來的。**（歷史沿革 3 段已移入 reports/2026/09/2026-09-11-coverage-note-history.md）"}
  cpo:            {count: 5, pct: 12.8, note: "⚠⚠⚠ **2026-09-10 納入 3363 上詮後自 11.4% 升至 13.9% —— 而關鍵不是百分比，是分子第一次自 4 變 5。** **這一格在此之前連續六次下降（20.0 → 19.0 → 18.2 → 17.4 → 16.7 → 16.0 → 15.4 → 11.4%），六次全部是分母效應：AXTI、AAOI、2345、3017、3081 五檔光互連相關新增全部拒標 cpo。** ⚠⚠ **3363 是第一檔標上的，而理由必須寫死，否則下一輪會被當成寬鬆**： **它的 thesis 直接押在 CPO 上 —— ReLFACon™ 是把高密度光纖陣列（FAU）封裝到 PIC／COUPE 的專利技術；2025 年以 1.6T 光學引擎切入可插拔與 CPO 交換器、2026 年直上 6.4T；已向全球超過 5 家潛在巨頭客戶交付多款 CPO 樣品；FAU 三年累計 70 億元的自估就是這件事的價格。** **前五檔拒標的共同理由是「不依賴 CPO 這個特定前提成立」；3363 正好相反 —— 它的整個上檔都建立在那個前提上。** ⚠⚠ **而 3363 還帶進一個此前沒有的層次：機櫃內（Scale-up，XPU 與 HBM 互連）。** **這一格原有的四檔全部對應機櫃之間或伺服器之間的連結。** **Scale-up 的節點數遠大於 Scale-out，但它也更依賴 CPO 如期放量 —— 因為 Scale-up 的光連結幾乎不存在可插拔的替代路徑。** ⚠⚠⚠ **並記下這一格內部第一次出現的零和關係：3363 與 3008 大立光。** **兩檔的 CPO 選擇權內容是同一個市場（FAU），而兩檔都在清單內 —— 本清單第一次「循環引用」與「零和競爭」同時發生。詳見 correlation_watch。**（歷史沿革 8 段已移入 reports/2026/09/2026-09-11-coverage-note-history.md）"}
  thermal:        {count: 3, pct: 7.7,  note: "⚠⚠ **2026-09-10 納入 6805 後自 2 檔變 3 檔（7.1% → 10.3%），而它是這一格第一檔「不是直接同業」的成員。** **3324 與 3017 做水冷板、分歧管（Manifold）、機殼，兩者互為替代且零和；6805 做快接頭（Quick Disconnect）—— 同一個液冷迴路上的相鄰零件，不是替代品。** **液冷滲透率上修對三檔同向，而三檔之間不是零和的 —— 扇出時 3324／3017 那一組必須談份額，6805 這一組不必。** ⚠⚠ **但 6805 同樣明文禁用 3324 與 3017 作為估值錨，而理由不是競爭關係** —— **是 6805 建檔時收斂寫定的那條通則：清單內的標的不作為估值錨，因為錨的價值在於它獨立於我的判斷，而清單內的標的不獨立。** **6805 這個案例正是那條通則的證明：它與 3324／3017 不競爭，處置卻相同。** ⚠ **本格的標籤在 6805 身上有一個保留**：**其伺服器營收占比 55.7%，但那 55.7% 的內部組成（液冷快接頭／其他）完全未取得 —— `thermal` 這個標籤目前建立在「液冷快接頭產能已逼近滿載」這句定性陳述上，若快接頭其實只佔一小部分，標籤就誇大了。已列該檔 gaps 並設為每輪重問。**（歷史沿革 1 段已移入 reports/2026/09/2026-09-11-coverage-note-history.md）"}
  optical:        {count: 8, pct: 20.5, note: "⚠⚠ **2026-09-10 納入 3363 後自 20.0% 升至 22.2%（7 檔 → 8 檔）。本日一天之內自 4 檔變 8 檔。** ⚠⚠ **而 3363 補上的是這條鏈最後一個缺的環節：封裝與光纖對接。** **這一格現在的層級結構是：InP 基板（AXTI）→ 磊晶片與 CW 雷射（3081）→ **FAU 與封裝（3363、3008）** → 收發器模組（COHR／LITE／AAOI／6442）→ 交換器（2345，同一個埠的另一端）。** **八檔，五個層級 —— 這一格已經不是八個押同一件事的人，而是一條可以互相驗證的鏈。** ⚠ **但 3363 這一層有一個前面幾層沒有的性質：它有兩檔，而且兩檔是零和的。** **AXTI 與 3081 是上下游（一個賣基板給另一個）；3363 與 3008 是同一層的競爭者。** **判讀時不可混用這兩種關係。**（歷史沿革 6 段已移入 reports/2026/09/2026-09-11-coverage-note-history.md）"}
  foundry:        {count: 2, pct: 5.1,  note: "⚠⚠⚠ **本格於 2026-09-11 納入 INTC 時**新建**，而它揭露了一個此前沒被發現的漏洞：TSM 自始就帶著 `foundry` 標籤，但這一節從來沒有對應的因子格 —— 亦即這個曝險在因子分布裡一直是隱形的。** **稽核同時發現另外四個標籤也沒有格（`advertising` 2 檔、`saas` 2 檔、`single_customer` 1 檔、`tw_fx` 19 檔），本次刻意不一併補 —— 它們與 INTC 無關，且 `tw_fx`（19 檔）與 `tw_market`（24 檔）的數量不一致本身就是另一個要先釐清的問題。** ⚠ **教訓：標籤與因子格是兩份清單，而沒有任何腳本檢查它們是否一致。漂移不會報錯，只會讓因子分析安靜地少算一格。** ｜⚠⚠⚠ **本格一成立就是本清單第二組「循環引用 ＋ 零和競爭」同時發生的配對**（第一組是 3363／3008 的 FAU）。 **兩檔搶的是同一批先進製程訂單 —— Apple 已收到 Intel 18A-P 的初始設計套件評估。** ⚠⚠⚠ **但本組比第一組多一個必須保留的可能性，這是「零和」這個標記第一次需要附帶條件**：**代工訂單可能是**新增**的（整體晶圓需求擴大）而非**轉移**的。** **若是新增，兩檔同向；若是轉移，兩檔零和。** **FAU 那一組的市場規模相對固定，轉移的成分高得多；先進製程不是 —— AI 帶動的晶圓需求本身還在擴大。在分不清之前不可預設其中一種。** ⚠⚠ **而兩檔的結構差異極大，序位比較必須分部處理**：**TSM 的營收 100% 是外部的；INTC 的 Foundry 部門 2026 Q2 營收 $5.8B 裡只有 $293M（5%）是外部的，其餘是內部轉撥。** **因此 INTC 的 Foundry 那一半刻意不用 EV/Sales —— 拿 $5.8B 乘代工同業的 EV/Sales 會把 Intel 自己賣給自己的晶圓算成市場營收。** **正確的分母是產能與重置成本：INTC 的市值 ÷ PP&E ＝ 4.99 倍（$527.13B ÷ $105.74B）。** ⚠ **TSM 的市值／PP&E 倍數本輪未取得，而它是 INTC 主錨唯一的尺。**"}
  substrate:      {count: 2, pct: 5.1, note: "⚠⚠ **2026-09-10 新增的 AXTI 刻意不計入這一格，這是一個判斷不是疏漏，寫在這裡以免日後被當成錯誤修掉。** **本格的 `substrate` 指的是 3037／8046 的 ABF 載板（封裝載板）；AXTI 做的是化合物半導體晶圓基板（InP／GaAs／Ge 單晶）。中文都叫「基板」，但客戶、循環、物理全都不同。** **同名不同物混進同一格，會讓因子分析安靜地說謊 —— 而它不會報錯。** 故另立 `compound_semi`。（歷史沿革 1 段已移入 reports/2026/09/2026-09-11-coverage-note-history.md）"}
  consumer_optics: {count: 1, pct: 2.6,  note: "3008 — 清單中唯一營收基礎在消費性電子（手機鏡頭）而非 AI 的標的"}
  semi_equipment: {count: 3, pct: 7.7,  note: "⚠⚠ **2026-09-10 納入 3583 辛耘後自 2 檔變 3 檔（6.3% → 9.1%），而它一納入就迫使我修正一條前一檔（6187）才剛用過的通則。** **辛耘同時是 3131 與 6187 的同業 —— 依「清單內的標的不作為估值錨」那條禁令，納入它會同時抽掉兩檔的錨，而那兩檔的同業倍數當時一個都還沒取得。** ⚠⚠ **決定性的理由不是「不方便」，是那條禁令有一個壞的尺度性質：覆蓋清單越大，可用的同業越少。一條「讓清單變大時自己變得更沒用」的規則，多半是規格寫錯了。** **細化後：錨可以是觀測值，不可以是我的判斷值 —— 清單內標的的「市場觀測倍數」可用於序位對照（須明寫日期與「不得因我的判斷而調整」），其「目標價、應有倍數、情境倍數」一律不可用。** ⚠ **回頭檢查最初的 LITE／COHR，這個細化更接近當時的原始處置，亦即 6805 的禁令版本才是偏離。** 詳見 correlation_watch。 ⚠⚠ **而細化的第一個正面回報立刻出現：三檔的序位現在可以用觀測值做，不必再全部留空。** **本益比 44.79（3583）／46.65（3131）／71.80（6187）；股價淨值比 6.09／23.97／15.83；市營比 5.11／10.09／17.73。** **3583 三項都最便宜，而它的 TTM 淨利率也最低（約 11.4% 對約 21.6%、約 24.7%）——因為代理業務營收大而毛利低。市營比的三倍半差距主要是商業模式差異而非估值差異。** ⚠⚠ **本格的第二個發現是把「設備商都是塊狀的」推翻了**：**3131 的月營收與累計都不規則、季利潤率掉 10.6pp；6187 的月營收單調加速、季利潤率升 12.2pp；3583 的月營收極平（八個月全距僅約 10%），而單季淨利率四季全距 16.3 個百分點（24.5% → 8.2% → 11.1% → 14.0%）。** **塊狀是真的，但塊狀的位置在不同的地方 —— 3583 的塊狀完全在組合裡，一點都不在量裡。** ⚠ **三檔連缺口也高度重疊**：毛利率、合約負債、營業利益率三項的現值三檔全缺 —— **這說明我對這個族群的建檔查詢清單仍未建立。**（歷史沿革 2 段已移入 reports/2026/09/2026-09-11-coverage-note-history.md）"}
  test_equipment: {count: 1, pct: 2.6,  note: "3030 — 2026-09-08 新增。檢測與量測設備，是清單中**第一檔賣設備給供應鏈、而非身在供應鏈裡**的標的。⚠ 由此導出一個與其餘十檔不同的傳導：它受惠的是**客戶的資本支出決策**，而非客戶的出貨量 —— 客戶擴產時它先受惠，客戶滿載但不擴產時它不受惠。**這使它在同一條 AI 需求鏈上的時序與其餘標的錯開。** ⚠ 同業致茂 2360 的 PE 為 57.02，而本檔為 21.36（折價 62.5%）—— 折價的具名成分為規模差 14.2 倍、營收成長 +28.2% 對 +61.6%、且**本檔無分析師覆蓋**"}
  osat:           {count: 1, pct: 2.6,  note: "6239 — 2026-09-01 新增。專業封測（OSAT）與 TSM 的晶圓級先進封裝是**不同層級**，不直接競爭 —— TSM 做 CoWoS，6239 做面板級與記憶體封裝。⚠ 本因子真正的價值在於：它是清單中**唯一受惠於量而非價**的 AI 供應鏈曝險，也是唯一在納入當下估值未處於延伸狀態的台股（PB 3.58x 位於三年區間 1.43–4.80 的 64% 處）"}
  fabless:        {count: 2, pct: 5.1,  note: "⚠⚠ **2026-09-10 納入 6531 後自 1 檔變 2 檔（3.0% → 5.9%）。** **本格的定義在 3661 那一檔寫定：「設計並銷售自己的晶片」—— AVGO 與 6531 都符合，而 3661 世芯不符合（它依客戶規格設計、產品由客戶擁有），故 3661 另立 `design_service`。** ⚠ **兩檔的差別很大，但都在定義之內**：AVGO 是加速器與網通晶片的綜合廠；6531 是無廠客製化記憶體 IC 設計。**共同點是「產品是自己的」，那正是本格要標的東西。**（歷史沿革 1 段已移入 reports/2026/09/2026-09-11-coverage-note-history.md）"}
  infra_software: {count: 1, pct: 2.6,  note: "AVGO — 基礎設施軟體（VMware 為主體），FY2026 Q3 營收 8,752M、占總營收 30%、年增 29%。⚠ **清單中第一個「同一檔內部有兩種完全不同成長性質」的業務組合**：半導體分部年增 127%（其中 AI +221%），軟體分部年增 29%。**它使 AVGO 成為清單第一檔選擇權拆分真的做得出來的標的** —— 年化後 AI 66.8B／非 AI 半導體 16.6B／軟體 35.0B。⚠ **但只完成一半：分部別營益率未取得，還不能給各部分不同倍數**"}
  ai_power:       {count: 1, pct: 2.6,  note: "CEG — 2026-09-08 新增。⚠ **本清單第一檔「賣電給 AI，而不是賣硬體給 AI」的標的，而它帶進來的最重要的東西不是新產業，是新的傳導性質：存量 vs 流量。** 其餘 16 檔中有 15 檔曝險於「AI 資料中心**資本支出**」——那是流量；**本檔曝險的是資料中心的用電量，那是資本支出落成之後的存量。一座已建成的資料中心即使 capex 歸零仍然耗電。** ⚠ **它不免疫** —— 新的 PPA 仍要等新的資料中心蓋起來；**但既有合約的現金流不隨 capex 減速而消失，這是清單上其餘十五檔都沒有的性質。** ⚠⚠ **2026-09-08 補正：建檔當日這句話只說了一半。** CEG 在**需求軸**上確實是分散，**但它在折現率軸上帶進一個清單其餘十六檔都沒有的集中曝險** —— 公用事業是市場公認的「債券替代品」，2026 年 8 月 XLU **-4.78%** 而 S&P500 **+2.62%**（差 **7.40pp**），**公用事業為今年以來 S&P500 唯一下跌的族群**。⚠ **更值得記的是這兩件事同源**：推升殖利率的原因之一正是「**AI 相關企業債券大量發行與公債競爭資金**」（二手轉述，見 notes/2026-09.md）。**同一筆 AI 資本支出，對 CEG 既是需求順風（PPA），又是估值逆風（折現率）—— 這是覆蓋清單第一檔兩個方向同時發生在一檔身上的標的。** 前者是它被納入的理由，後者是它 52 週報酬 -3.09%、距高點 -27.6% 的可能解釋之一。**分散與集中同時上升，這在本清單是第二次**（第一次是 COHR 使 cpo 因子的集中度與可檢驗性同時上升）。 ⚠ **也因此它沒有 driver_refs**：現有三個 driver 記的是資本支出承諾／加速器出貨／平台時程，**沒有一個記的是用電量**。正確做法是新增 `datacenter-power-demand` driver，而非硬掛既有的三個"}
  nuclear:        {count: 1, pct: 2.6,  note: "CEG — ⚠ **裝置容量與燃料結構本輪未取得**，故本標籤目前描述的是業務性質，**不作為任何估值論證使用**（重置成本論證因此也做不出來）。取得途徑：10-K 的 Item 2 Properties、EIA-860"}
  us_utility:     {count: 1, pct: 2.6,  note: "CEG — ⚠ 但它不是受管制的公用事業，**盈餘與電價及避險部位連動**：GAAP EPS 5.01／11.89／7.40／10.33（高低差 2.37 倍），且 FY2023／FY2024 營運現金流為負。**不可套用一般公用事業的低波動假設**"}
  merchant_power: {count: 1, pct: 2.6,  note: "CEG — 批發／零售電力供應。⚠ **這一格解釋了為何本檔不用 EV/Sales**：營收含大量轉手性質的交易量，EBITDA 利潤率僅 25.4%；FY2026 共識的**營收錨寬度 36.2% 是 EPS 錨寬度 5.78% 的 6.3 倍** —— 分析師對它賺多少高度一致、對它營收多少嚴重分歧"}
  power_electronics: {count: 1, pct: 2.6, note: "2308 — **2026-09-10 新增，關閉本檔記錄過三次的結構缺口：「清單中沒有任何一檔屬電力或電源，而 NVIDIA 已點名兩家台廠（台達電、光寶科）」。** ⚠⚠ **本標籤與 CEG 的 `ai_power` 是完全不同的東西，這個分辨比新增標的本身更重要**：**CEG 賣的是電**（曝險於資料中心用電量，是 capex 落成之後的**存量** —— 一座已建成的資料中心即使 capex 歸零仍然耗電，故對 capex 減速**部分免疫**）；**2308 賣的是電源轉換與配電設備**（曝險於機櫃出貨與功率密度，是 capex 的**流量**，**不免疫**）。**兩者都叫「電力」，若合併成同一格會產生一個假的分散。** ⚠ **它帶進來的真正分散在別處**：它是清單中第一檔受惠於**單櫃功率密度**而非**出貨量**的標的（54V → ±400V → 800VDC 由功耗驅動，800VDC 排定 2027Q2 放量），也就是本檔先前記的「唯一一條與出貨量部分脫鉤的 AI 受惠路徑」。⚠ **納入當下的估值位置與前幾檔台股相反：它在回檔而非延伸狀態** —— 距 52 週高 **-30.6%**、收盤 1,795 低於月／季／半年線、**僅年線 1,482.84 未破**，且近期兩度單日重挫（2026-09-02 **-7.24%**、2026-09-10 盤中 **-5.85%**）。對照 3008 納入當日是連續第二根漲停、8046 與 3037 納入時 PB 都在三年區間頂部。**但「跌很多」不是便宜**：forward PE 仍 **35.17x**、P/FCF 約 **73x**（現金口徑比盈餘口徑 57.22x 更貴），相對最純同業 Vertiv（forward 33.55x／EV-EBITDA 37.87x）僅小幅折價，**而本檔營益率 16.70% 與 ROE 29.97% 都低於 VRT 的 19.96% 與 43.94%，且還揹著一個非 AI 本體 —— 折價幅度小於組合差異所應有的幅度**"}
  ems:            {count: 1, pct: 2.6,  note: "2317 — 2026-09-10 新增。電子製造服務與系統組裝（AI 機櫃整機）。 ⚠⚠⚠ **本清單第一檔「清單的客戶」，而這不是一個新產業，是一個新的結構位置。** **3017／3324（散熱）、3533（連接器）、3665（線材）、6805（樞紐）、2308（電源）賣的東西，最後都裝進 2317 組的機櫃裡。** **本清單此前的標的都在鏈上的某一格；2317 是那些格子匯流的地方。** ⚠⚠⚠ **它一納入就產生了一種本清單此前沒有的交叉驗證：買賣雙方一手互證。** **2317 的法說說「上修資本支出年增三成以上，提前擴充伺服器機櫃、**液冷**及測試產能」—— 而 3324 與 3017 的整個 thesis 就是液冷滲透率。** **那句話來自買它們東西的人嘴裡，不是來自它們自己。** ⚠ **並記下時序的用法**：**組裝廠「提前」擴充液冷產能，代表液冷零件的拉貨會早於機櫃出貨 —— 3324 與 3017 的營收應領先 2317 的雲端網路營收。若觀察到同步或落後，其中一邊的數字要重新檢查。** ⚠⚠ **但本格與 `optical`、`connector`、`thermal` 的獲利結構完全不同，比較倍數時絕不可跨格套用**：**2317 的 Q2 毛利率 6.12%、營業利益率 3.75%、淨利率約 2.37%，而股東權益週轉率約 5.28 倍（本清單最高）、市營比 0.35（本清單最低）。** **與同日建檔的 3363 上詮（市營比 45.92）相差 131 倍 —— 市營比在跨商業模式時完全沒有意義，這是最好的證明。** ⚠ **本格與 `networking`（2345 白牌交換器 ODM）最接近，兩檔都是 ODM 經濟結構；但 2345 的毛利率 19.7% 是 2317 的三倍，序位價值有限。**"}
  networking:     {count: 1, pct: 2.6,  note: "2345 — 2026-09-10 新增。資料中心網通硬體（白牌交換器 ODM）。⚠⚠ **本清單第一檔賣「交換器」而非「連到交換器的東西」的標的，而它補上的是 driver 層的第三個層次。** 既有的三個 driver 記的是：**capex 承諾（hyperscaler-capex）與加速器出貨（ai-accelerator-demand）**；**2345 的交換器出貨補上第三層 —— 資料中心真的通電了的證據，不是承諾。** 這正對應 hyperscaler-capex 的 `deployment_friction` 記的「承諾與落地之間的摩擦」。 ⚠ **另記它在本清單的傳導時滯是最短的**（落後 1–2 季）——交換器與伺服器同批部署，不像基板（AXTI 領先 2–4 季）或載板（3037／8046）那樣隔著數個環節。 ⚠⚠ **但它是 ODM，毛利率僅 19.7%（2026 Q2，連三季成長、五季新高）** —— **營收每多一塊錢只有兩毛留在公司。這一格與 `optical`、`connector` 的獲利結構完全不同，比較倍數時絕不可跨格套用。**"}
  storage_module: {count: 1, pct: 2.6,  note: "8299 — 2026-09-10 新增。NAND 控制器與儲存模組。⚠⚠ **與 `memory`（MU／SNDK 的晶圓製造）刻意分開的理由與 `epitaxy`／`compound_semi` 同：買賣關係不是同一門生意。** **MU 與 SNDK 製造 NAND 晶圓；8299 買晶圓做成控制器與模組。** ⚠⚠ **本格帶進一個本清單此前沒有的獲利機制：價差而非價值增加。** **模組廠在漲價循環中的超額獲利 ＝（現貨價 − 存貨成本）× 存貨量，那是一筆從客戶手上轉移過來的錢，會隨存貨周轉而結束。** **8299 的 2026 Q2 毛利率 65.31%（去年同期約 29.06%），毛利年增 752.8% 遠高於營收年增 279.5% —— 獲利的增幅主要來自率不是量。** ⚠ **後果：這一格的標的，「毛利率創高」不代表競爭力提升，只代表庫存買得便宜；真正要看的是存貨周轉天數。** ⚠ 同業樣本（皆在清單外）：**慧榮 SIMO（更接近純控制器）、威剛 3260 與宜鼎 5289（更接近純模組）。8299 夾在中間，因此兩端同期的毛利率變化可以用來拆解它的 65.31% 裡有多少是存貨利益 —— 這是不需要公司揭露就能拆解 thesis 的一條路。** 三家倍數本輪皆未取得"}
  design_service: {count: 1, pct: 2.6,  note: "3661 — 2026-09-10 新增。IC 設計服務（ASIC design service：委託設計 NRE ＋ 量產 MP）。⚠⚠ **與 `fabless`（AVGO）刻意分開：兩者都不蓋廠，但 AVGO 設計並銷售自己的晶片，3661 依客戶規格設計、產品由客戶擁有。營收認列、客戶關係、利潤率結構完全不同。** ⚠⚠ **本格帶進一個本清單此前沒有的損益形態：營收與毛利率反向移動。** **NRE 階段是低營收、高毛利（3661 的 2026 Q1：營收年減約 60%、毛利率 50.16% 創歷史新高）；量產階段是高營收、低毛利（Q2 營收季增 +82.6% 而稅後淨利只季增 +14.9%）。** **後果是這一格的標的其 trailing 數字特別不可讀 —— 它可能正好落在兩段之間，同時抓錯營收與利潤率兩件事。** ⚠ 同業樣本（皆在清單外、皆為台股、逐月逐季公告，頻率完全對等）：**創意 3443（2026 年 8 月營收 58.40 億元、年增 +111.02%；本益比 142.01x）與智原 3035（本益比 55.48x，日期未確認）。** ⚠ **對照 3661 的 trailing 本益比 59.11x —— 看起來明顯便宜，但兩家落在專案週期的不同相位，在調到同一相位之前這個差距分不出是估值還是相位。**"}
  hinge:          {count: 1, pct: 2.6,  note: "6805 — 2026-09-10 新增。轉軸與鉸鍊（手機摺疊鉸鍊、筆電轉軸）。⚠⚠ **這是 6805 那約 44.3% 的另一半生意，也是本清單第一個純消費電子的需求線。** **管理層提及華為三折與左右折新機轉軸備貨順利、價格平穩，以及大尺寸柔性螢幕催生可撓式 PC 與電子書的新應用（年底至明年陸續貢獻）。** ⚠⚠ **而現有三個 driver 沒有任何一個記摺疊裝置循環 —— 這已是同一個結構問題的第四個實例**（前三次：CEG 的用電量、AAOI 的 DOCSIS 升級循環、3533 的 CPU 平台世代）。**建議新增 `foldable-device-cycle` driver，與先前建議的 `datacenter-power-demand`、`broadband-access-capex`、`server-platform-cycle` 一併排程 —— 四個建議已經排了一整天，該當成一件事處理。** ⚠ **本格對 6805 的估值有一個直接用途**：**純轉軸廠新日興 3376 與兆利 3548 的伺服器占比接近零，因此它們的倍數就是「6805 那 44.3% 值多少」的直接參照 —— 分部拆解的消費那一半，錨是現成的，缺的只是去查。**"}
  battery:        {count: 1, pct: 2.6,  note: "3211 順達科技 — 2026-09-10 新增。電池模組（IT 電池 ＋ BBU 電池備援模組）。⚠ **代號註記**：**指令原給「3221 順達」，但 3221 是台嘉碩、順達科技是 3211，依名稱更正。****valuation-map 已記過一次同類錯誤（「不是 3413，3413 是京鼎」）—— 這是第二次。** ⚠⚠ **本格帶進本清單至今唯一一檔盈餘在下滑的標的，而它的本益比是 49.46 倍**（Q2 EPS 1.35 元、年減 65%；H1 累計 3.4 元、年減 31%；TTM 7.41 元）。 **對照同日納入的 8299：本益比 9.55 倍而 EPS 創 40 季新高。** ⚠⚠ **兩者是同一個陷阱的兩端，而 valuation-map 只寫了一半** —— 原文對 trailing PE 的警告是「⚠ 說謊時：循環頂（低 PE 看似便宜）」，**3211 是另一半：轉型谷（高 PE 看似昂貴）。建議把那一條補成雙向的。** ⚠ **本格與 2308 台達電在 BBU 上競爭，已明文禁用 2308 作為 3211 的估值錨**（用的是 6805 那一檔收斂寫定的通則）。⚠ 同業樣本（皆在清單外、皆為台股、頻率對等）：**新普 6121、加百裕 3323**，兩家倍數本輪皆未取得"}
  connector:      {count: 2, pct: 5.1,  note: "⚠⚠ **2026-09-10 納入 3665 貿聯後自 1 檔變 2 檔（2.9% → 5.7%），而兩檔互為同業但商業模式差很遠。** **3533 嘉澤 —— 連接器與插槽，毛利率 45.47%（2026 Q2）、TTM 淨利率約 24.5%；** **3665 貿聯 —— 線束與高速線材，毛利率 28.77%（2026 Q1）、TTM 淨利率約 12.2%。** ⚠⚠ **兩檔的市營比幾乎相同（4.42 對 4.72）而本益比差了 1.8 倍（約 35.53 對 19.81）—— 差別全在淨利率。** **3665 用兩倍的營收換到一半的利潤率。那是商業模式的差異，不是估值的差異 —— 而序位分析要回答的正是市場該為這個差異付多少。** ⚠ **也因此本格的 rank_metric 以毛利率最有鑑別力（兩檔差 17pp）。**（歷史沿革 1 段已移入 reports/2026/09/2026-09-11-coverage-note-history.md）"}
  pc_client:      {count: 1, pct: 2.6,  note: "INTC — 2026-09-11 新增。個人電腦與用戶端運算（Client Computing & Physical AI）。 ⚠⚠⚠ **本格存在的理由不是它是一個新產業，是為了讓一個反覆出現的盲點在因子分布裡看得見。** **「某一塊營收沒有任何 driver 解釋它」已出現七次：CEG 的用電量、AAOI 的 DOCSIS 升級循環、3533 的 CPU 平台世代、6805 的摺疊裝置循環、3665 的電動車與工業、2317 的消費智能產品、以及本格的個人電腦。** **前六次都只記在 notes 裡；本次給它一個格子，因為 INTC 的 CCG 是一個具名且巨大的區塊。** ⚠ **而 `non_ai` 那一格按慣例維持 0（標的層級的二元標籤表達不了「某檔有一半營收不在 AI 上」）—— 本格是那個限制的正面寫法：不寫「它有多少不是 AI」，寫「它是什麼」。** ⚠⚠ **實務用途**：**PC 循環與 AI 資本支出循環不同步，而 INTC 的 X 軸之所以低，有一部分是這兩個循環疊在同一張損益表上。** **判讀 INTC 的單季盈餘時必須把這一格的貢獻分開 —— 而三個部門各自的營收金額本輪未取得（只有成長率 +13%），已列其 gaps。** ⚠ **本格目前只有一檔，不構成集中；但若日後再納入 PC 鏈標的，它與 `ai_capex_hw` 的重疊必須重新檢查。**"}
  server_platform: {count: 1, pct: 2.6, note: "3533 — 2026-09-10 新增。⚠⚠ **本清單第一個「一般用途伺服器 CPU 平台世代切換」的曝險，而它與 ai_capex_hw 是兩回事，這正是設立這一格的理由。** 動能來自 **Intel Oak Stream 與 AMD Venice**（管理層估 2026 Q4 或 2027 初放量），出資者是伺服器 OEM 與企業／CSP 的一般伺服器汰換，**不是 AI 加速器的建置預算**。⚠⚠ **而現有三個 driver 沒有任何一個記這件事** —— 這已是同一個結構問題的**第三個實例**（CEG：沒有 driver 記用電量；AAOI：沒有 driver 記 DOCSIS 升級循環；本檔：沒有 driver 記 CPU 平台世代）。**三次就是模式不是巧合：三個現有 driver 全部只記「AI 資本支出的流量」，而清單正在納入越來越多不由那個流量驅動的標的。** 建議新增 `server-platform-cycle`，與先前建議的 `datacenter-power-demand`（CEG）、`broadband-access-capex`（AAOI）一併排程"}
  catv:           {count: 1, pct: 2.6,  note: "AAOI — 2026-09-10 新增。有線電視寬頻接取（CATV／DOCSIS）。⚠⚠ **本清單第一個與 AI 無關的終端需求，而且它不是一個小角落：AAOI 2026 年 Q2 的 CATV 分部營收 8,060 萬美元，佔該檔總營收 42.0%（年增 44%）。** ⚠⚠ **而現有三個 driver（hyperscaler-capex／ai-accelerator-demand／accelerator-roadmap）沒有任何一個記它** —— 它的出資者是有線電視業者（Charter／Comcast 等），循環是 DOCSIS 4.0 升級週期，時程與超大型 CSP 資本支出無關。⚠ **這與 CEG 建檔時的結構問題同型**（那次是「沒有一個 driver 記用電量」，處置是建議新增 `datacenter-power-demand`）。**正確做法同樣是新增 `broadband-access-capex` driver，而不是硬掛在超大型 CSP 資本支出上。在補上之前，AAOI 的 42% 在 driver 層是失明的。** ⚠ **且升級循環是有終點的** —— AAOI 那 42% 的營收正靠著它的上升段，故已在該檔設為第四條 falsifier（CATV 單季營收年減超過 20%）。⚠ 同業觀測點：Harmonic（NASDAQ:HLIT），CATV／DOCSIS 純業，2026-09-09 P/S 2.91x、營收 TTM +11.2% —— **它同時是 AAOI 分部估值的錨，也是這個循環的獨立觀測點**"}
  epitaxy:        {count: 1, pct: 2.6,  note: "3081 — 2026-09-10 新增。化合物半導體磊晶片（InP／GaAs 雷射與檢光器磊晶）。⚠⚠ **與 `compound_semi`（AXTI 的 InP／GaAs／Ge 單晶基板）刻意分開：兩者是買賣關係不是同一門生意。****AXTI 長單晶、切成基板；3081 買基板、在上面長磊晶層做成雷射與檢光器磊晶片。毛利率結構與資本投入位置都不同（3081 Q2 2026 毛利率 57%、營業利益率 47%）。** ⚠ **同名易混的三個「基板／晶圓」層在本清單現在各有一格**：`substrate`（3037／8046 的 ABF 載板）、`compound_semi`（AXTI 的化合物半導體單晶基板）、`epitaxy`（3081 的磊晶片）。**中文都可以叫「基板」或「晶圓」，但客戶、循環、物理全都不同。** ⚠⚠ **本格帶進本清單至今最極端的資本密集度**：3081 的 capex／營收 約 **217.8%**（近三季 CAPEX 近 60 億元 ÷ 近三季營收約 27.55 億元），**是 15% 門檻的 14.5 倍**，**而同期折舊僅占營收 6.14% —— 相差 35 倍，正在蓋的資產尚未投入服務。** ⚠ 同業樣本：**IQE plc（LSE）與全新光電 2455**，兩家倍數本輪皆未取得。**且 IQE 已是 AXTI 列的同業之一 —— 它現在同時錨住兩檔覆蓋標的，屬「共用錨」，與 COHR／AAOI 共用 Fabrinet 同科。**"}
  compound_semi:  {count: 1, pct: 2.6,  note: "AXTI — 2026-09-10 新增。化合物半導體晶圓基板（InP／GaAs／Ge 單晶）。⚠⚠ **與 `substrate`（3037／8046 的 ABF 載板）刻意分開，理由見該格。** ⚠ 本格與 `optical` 的差別值得記：optical 記的是「賣給誰」（光通訊終端），compound_semi 記的是「做什麼」（單晶生長與晶圓加工）。**AXTI 的 GaAs 與 Ge 產品線服務工業機器人與太空太陽能，不在 AI 鏈上** —— 那部分目前佔比小（Q2 為 6.87 ÷ 47.6 = 14.4%），但它是本檔唯一非 AI 的營收來源"}
  china_ops:      {count: 1, pct: 2.6,  note: "AXTI — 2026-09-10 新增。⚠⚠ **本清單第一檔以中國為主要生產地的標的，而這是一個全新的失效路徑，不是既有風險的變體。** 全部產能在北京同美（Tongmei）；**Q3 2026 營收指引明文限定於「已取得出口許可或不需許可」的部分 —— 中國的鎵／鍺／銦出口許可是營收的閘門，不是背景風險**；同美科創板 IPO 已於 2026-06-26 撤回轉赴香港，觸發人民幣 3.244 億元（約 4,900 萬美元）的贖回權。⚠ **不要把它與 tw_market 或 TSM 的地緣曝險混為一談** —— 台灣是「客戶與產能所在地的地緣風險」，中國是「出口管制與子公司治理的直接營運閘門」，**兩者的傳導機制與可觀測訊號完全不同**"}
  tw_market:      {count: 24, pct: 61.5, note: "⚠ **2026-09-11 納入 INTC（美股）後自 63.2% 降為 61.5% —— 分子沒動（維持 24 檔），純分母效應，也是 2026-09-10 那一整天之後第一次下降。** **那天這一格自 36.4% 走到 63.2%（8 檔 → 24 檔），二十檔新增裡有十六檔是台股。** ⚠ **另記一個稽核發現**：**本格是由 `market: TW` 算出來的（24 檔），而標籤 `tw_fx` 只有 19 檔 —— 兩者不一致，亦即有五檔台股沒有標 `tw_fx`。** **本次不動它（與 INTC 無關），但它是一個要釐清的漂移。**（歷史沿革 18 段已移入 reports/2026/09/2026-09-11-coverage-note-history.md）"}
  non_ai:         {count: 0, pct: 0.0,  note: "⚠⚠ **2026-09-10 納入 AAOI 後仍記為 0，但這一次「仍記為 0」揭露的是方法本身的限制，不只是一個判斷。** AAOI 的 thesis 是 AI 驅動的（資料中心佔營收 56%），故不標 `non_ai`；**但它有 42% 的營收是 CATV（有線電視寬頻接取），掛在有線電視業者的 DOCSIS 升級循環上，與 AI 完全無關。** ⚠⚠ **`factor_tags` 是標的層級的二元標籤，表達不了「這檔有 42% 的營收不在 AI 上」；等權因子分布數的是標的數，不是營收。** **結果是：清單的實際非 AI 曝險大於 0，但這個模型看不見它。** ⚠ **這是本清單第一次這個限制變得重要**（CEG 那次是「最接近填上它」，但 CEG 的營收本身並沒有一大塊在 AI 之外的獨立循環上）。**處置：暫不改動標籤語意（那會讓歷史數列失去可比性），但在此明記模型的這個盲點，並在讀 optical 的 27.3% 時記得它高估了實際的 AI 光通訊曝險。**（歷史沿革 2 段已移入 reports/2026/09/2026-09-11-coverage-note-history.md）"}

common_premise: "⚠ **2026-09-10 納入 2308 台達電後：19 檔中有 17 檔共用同一前提 —— AI 資料中心資本支出在未來 8 個季度不會出現實質減速。例外仍是 INTU 與 CEG 兩檔，2308 不構成第三個例外（它曝險於 capex 流量，不免疫）。** ⚠ **但 2308 帶進一個前提內部的新結構，值得與 AVGO 那次並列**：AVGO 那次改變的是**方向一致性**（清單第一次出現同一則消息對兩檔方向相反）；**2308 這次改變的是「什麼東西在驅動它」** —— 其餘 12 檔 ai_capex_hw 受惠於**機櫃出貨台數**，**2308 有一半受惠於單櫃功率密度**（54V → ±400V → 800VDC 由功耗驅動）。**即使 AI 伺服器出貨量成長減速，只要單櫃功耗續升，這條鏈仍有量。** 這使它在共同前提失效時的**受傷順序**與其餘標的不同 —— 不是免疫，是**時序與幅度都不同**。⚠ **不可據此把它讀成避風港**：功率密度續升的前提本身也建立在新機櫃持續出貨上，只是脫鉤的那一半讓它的衰退較淺。（歷史沿革 1 段已移入 reports/2026/09/2026-09-11-coverage-note-history.md）"


# ⚠ 6239 力成：**清單中第一檔「受惠於量而非價」的標的，也是唯一未處於延伸狀態的台股。**
# 它同時加深了 ai_capex_hw（64.3% → 66.7%，連四次刷新新高，三分之二的標的共用同一條需求鏈），
# 但它帶進來的東西與前幾次的加深性質不同，三點值得記：
#
# (1) **memory 因子內部第一次出現方向分歧。** MU／SNDK 賺記憶體**價格**，6239 賺封測
#     **服務費、按顆計價** —— 漲價進不了它的損益，它受惠的是**量**。
#     ⚠ 若記憶體漲價的機制是「減產挺價」而非需求成長，對 MU／SNDK 是利多、對 6239 是**利空**。
#     此前 memory 這一格的警告只是「同向但不等深」，現在是**可能反向**。
#     這是清單中第一次在同一因子內部出現方向相反的兩檔。
#
# (2) **六檔台股中唯一未處於延伸狀態的一檔。** 對照：
#       PB 對三年區間：8046 為 16.13x／1.40–16.39（頂部）、3037 為 14.0x／1.51–14.99（近頂部）、
#                      6239 為 3.58x／1.43–4.80（**64% 處**）
