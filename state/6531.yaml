driver_refs:
- driver: ai-accelerator-demand
  direction: '+'
  note: >
    加速器出貨 → 高頻寬記憶體需求 → **VHM™（客製化記憶體）與 VHMStack™（給 AI 加速器）**。
    ⚠⚠ **但這條傳導目前的實質內容接近零，必須寫死，否則下一輪會被當成已經在發生**：
    **法說明言 VHM 與 VHMStack 的全面量產時程延伸至 2027–2028，
    而現在的營收成長由 IoTRAM 撐（Q1 2026 營收年增 115%，管理層歸因於 IoTRAM 強勁需求）。**
    **亦即本 driver 對本檔是一個 18–30 個月之後的故事，不是當期的損益項目。**
    ⚠ **也因此本檔刻意不標 `ai_capex_hw`** —— 見 notes 的說明與重新分類規則。
    ⚠ **扇出時應明寫「時程未到」而非「無影響」，這兩者不同：
    前者可以被時間否證，後者不能。**
- driver: hyperscaler-capex
  direction: '+'
  note: >
    CSP 資本支出 → AI 加速器建置 → 高頻寬記憶體的規格與採用。
    ⚠ **敏感度記「低」，而且理由是時程不是幅度**：**同上，VHMStack 要到 2027–2028。**
    ⚠⚠ **而本檔與覆蓋清單內三檔記憶體相關標的的關係要分清楚，否則會誤判**：
    **MU 與 SNDK 是有廠的記憶體製造商（賣位元）；8299 群聯是控制器與模組廠（賺價差）；
    本檔是無廠的客製化記憶體 IC 設計（賣設計與規格）。**
    **三種商業模式完全不同 —— 同一則記憶體漲價的消息，對三者的方向與幅度都不一樣，
    扇出時不可套用同一個結論。**

