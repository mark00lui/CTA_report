      **這是四檔中唯一有完整同業序位支撐的負空間。**

  ⚠⚠_零檔偏多: >
    **19 檔的評級分布：中性 16、偏空 3（2308／CEG／3008）、偏多 0。**
    ⚠ **連續兩輪全清單重估都沒有出現任何一檔偏多。**
    **成因不是基本面全面轉壞** —— 多數標的的 falsifier 全數未觸發、營收與獲利仍在成長。
    **成因是 CTA 紀律的兩隻腳很少同時成立**：
    ・**有空間但技術面不支持**：**3030（+28.4% 但站上 0／4 條均線）**、
      AVGO（+15.3% 但價格在兩條均線之下）、INTU（+13.4% 但已跌破 50DMA）
    ・**技術面支持但沒有空間**：**META（右側確認 2／3 但空間 -1.8%）**、
      MSFT（黃金交叉完成但空間 +4.1% 未達 +5% 門檻）
    ⚠ **META 與 MSFT 這兩檔本輪剛好把「兩隻腳」演示完整**：
    META 的兩隻腳在九天內**完全對調**（前次 +12.2%／0-3 段，本次 -1.8%／2-3 段），
    **兩次都是中性而理由相反**；MSFT 的黃金交叉完成，**只差 0.9pp 的空間**。
    **這不是模型過於保守，是紀律在正常運作 —— 但若連續四輪都零偏多，就該回頭檢查門檻本身。**

  ⚠_52週報酬的離散度: >
    **已取得的 11 檔：SNDK +2,402.55%／MU +681.81%／COHR +207.57%／TSM +76.12%／
    GOOG +40.24%／NVDA +32.89%／AVGO +5.42%／MSFT -1.31%／CEG -1.64%／META -13.11%／
    INTU -53.26%。全距 2,456 個百分點。**
    ⚠⚠ **這個離散度對「等權覆蓋」這個分析基準有直接含意，必須寫明**：
    coverage 的因子分析以等權為基準，**而等權假設隱含「各檔的重要性相當」**。
    在一年報酬相差 24 倍的清單裡，**等權因子占比（如 ai_capex_hw 68.4%）
    描述的是「我看了多少檔」，不是「這些檔對結果的影響有多大」。**
    **這個區別此前沒有寫下來，本輪補上。它不改變等權的正當性
    （這是研究覆蓋不是投資組合），但它限制了因子占比能被讀成什麼。**
    ⚠ **另記：平台三檔（MSFT -1.31%、META -13.11%、GOOG +40.24%）過去一年的表現
    與硬體端（SNDK +2403%、MU +682%、COHR +208%）差了一個量級** ——
    **「支出方 vs 受惠方」這條在 common_premise 裡的分野，在報酬上已經實現了。**

  ⚠⚠_INTU_分散生效了但方向不是預期的那個: >
    **INTU 52 週 -53.26%，是覆蓋清單中過去一年跌幅最大的一檔 ——
    而它正是清單裡唯一與 AI capex 因子低相關的標的。**
    ⚠ **納入它的目的寫在 common_premise 裡：「完全不在這條鏈上」，用來分散單一失效點。**
    **結果是：它確實沒有跟著 AI 鏈走，但它用「與 AI 無關的方式」跌了一半。**
    ⚠⚠ **這對 correlation_watch 的「INTU / 其餘 — 應為低相關，每季實測一次，
    若相關性上升代表這個假設失效」是一個必須正面處理的結果**：
    **低相關的假設沒有失效 —— 它成立了，而成立本身沒有保護任何東西。**
    **「低相關」與「下檔保護」是兩件事，此前這一格把它們寫得像同一件事。**
    ⚠ **本輪不改 INTU 的因子標籤或評級**（其 falsifier 未觸發、估值上檔反而擴大至 +13.4%），
    **但把這個區別記下來，並列為下次 quarterly thesis 重審時該回答的問題**：
    **這個清單需要的是「低相關」還是「下檔保護」？兩者要的標的不同。**

  ⚠_本輪未完成的事: >
    ・**8046 的 MA60／120／240、3030 的 MA120／240、TSM 的現行 50／200DMA 本輪未取得** ——
      三檔的中期均線結構或 confirm_trigger 因此無法完整機械判定。
    ・**位移測試在多數檔做不到**：次年度或再次年度共識未取得者包括
      TSM、MSFT、META、GOOG、MU、SNDK、COHR、AVGO、3324、6442、3030 ——
      **十一檔。這是全清單最普遍的單一缺口，且它直接決定循環性檢查能否結案。**
    ・**錨寬度（共識高低分布）僅 GOOG 與 CEG 兩檔取得**，其餘十七檔皆缺。
    ・**四檔台股（3324／6442／3030 與部分時點的 8046）無分析師覆蓋**，
      錨寬度與位移測試對它們是**結構性**不可得，不是「還沒查」。

