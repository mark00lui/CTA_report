notes: 本檔在覆蓋清單中的作用是與 AI capex 因子低相關。2026-08-26 的證據支持這個假設，且更進一步 —
  壓垮 INTU 的是低價競爭與 agentic AI 對應用層的替代疑慮，方向與 capex 鏈相反（capex 越強、agentic
  AI 能力越強，應用層護城河壓力越大），因此某種程度上是 AI capex 主題的反向曝險。若股價開始與 TSM／3324／6442
  同向，代表假設失效，應觸發覆蓋層 review。｜機率敏感度低：另兩組候選機率得出 341 與 362，全距僅 ±3%，
  Base 情境主導。真正的槓桿在 exit multiple — 未來若調高倍數來維持結論，那是論點漂移，應標 L3。
event_log:
- date: 2026-08-27
  level: L2
  summary: 重估 — 完成 reverse-DCF，錨自「無」升級為錨 C，信心度低 → 中；目標價不變 356
  delta: 以 TTM 自由現金流 8.62B（扣 SBC 約 1.59B 後 7.03B）對市值 94.61B 反推，市場隱含永續成長率僅 0.53%／1.46%／2.39%（r=8%／9%／10%），而 FY27 guidance 是營收 +9~10%、EPS +23~24%。三情境 10x／15x／22x 對應隱含永續成長 -2.0%／+1.4%／+3.9%，與 PE 框架內部一致。key_variable「AI功能貨幣化證據」（質性、無門檻）換成「自由現金流與FCF殖利率」：FY26 OCF 8.838B、capex 僅 221M（占營收 1.0%）、FCF 8.617B、FCF 利潤率 40.2%、P/FCF 10.98x。現價自 315.6 更新為 345.88（+9.6%），加權目標價相對現價自 +12.7% 收斂為 +2.9%。⚠ 循環性檢查觸發：base 345 與現價 345.88 僅差 0.25%，但 15x 訂於 8/26（當時隱含 13.7x），是價格漲上來與模型會合，屬結論非產物。機率沿用前值
- date: 2026-08-27
  level: L1
  summary: 重錨估值 — 目標價不變（加權 356），但信心度自「中」下修至「低」
  delta: base 15x 數值未動，但確認本檔【無獨立估值基礎】：歷史 forward 5 年平均 31.22x 雙重失效 —— AI 顛覆造成的重評價跨越該期間，且 FY2026 起 non-GAAP 納入 SBC 使口徑不可比（歷史換算為新口徑約 39x）。依 valuation.md，無獨立估值基礎者 signal.conviction 上限為低。這是承認估值判斷缺乏依據，非基本面看法轉差
- date: 2026-08-26
  level: L3
  summary: 手動全量重估（適逢 FY26 Q4 財報）。當季雙超預期（$4.4B +14%／non-GAAP EPS $4.03），FY27 指引主動減速至 +9–10%；管理層承認 DIY 稅務在低價端輸掉市佔
  delta: 論點層首次建立；基準年設為 FY2027；三情境寫定，加權目標價 356（無前值）；訊號中性／信心中。既有兩條 falsifier 均未觸發，但 TurboTax 總件數 -2% 已為先行指標。發現 FY27 起 non-GAAP 含 SBC，還原後 EPS 指引實為超前而非落後
