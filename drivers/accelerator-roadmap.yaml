# ⚠ 本檔最容易被誤讀的一點，寫在最前面：
# 「CPO 已量產」成立的是 **scale-out 交換器**（Spectrum-X／Quantum-X Photonics），
# 不是 GPU 機櫃內的 scale-up 互連 —— Rubin 的 NVLink 6 仍是銅。
# 兩者的埠數量級、供應商結構、驗證門檻都不同。
# 引用本檔支撐任何 CPO 論點前，先確認你指的是哪一層；混用會高估可及市場。
rubin_ultra_spec:   # 2026-08-31 新增 —— 此前本 driver 對 Rubin Ultra 只有「排定 2027、約 600kW」
  as_of: 2026-08-31
  tier: 推論
  platform: Vera Rubin Ultra NVL576（Kyber 機櫃架構）
  timing: 2027 下半（較前記的「排定 2027」更精確；相對最近一次官方時程未遞延，第一條 falsifier 不觸發）
  scale_up_domain: >
    自 Rubin NVL144 的 144 顆擴大至 **576 顆**單一 NVLink domain（相對 GB300 NVL72 為 8 倍）。
    由 8 個 MGX NVL 機櫃（各 72 顆）組成，採兩層 all-to-all NVLink 拓撲。
  power_and_rack: >
    600kW／櫃（與前記一致）。Kyber 架構將運算刀鋒旋轉 90 度改為垂直配置，
    4 個 pod × 18 刀鋒，每刀 8 顆 Rubin Ultra GPU 搭配 Vera CPU。
    供電自機房到機櫃改為 800 VDC，同一銅線可多傳 150% 功率。
  compute_and_memory: >
    15 EF FP4 推論／5 EF FP8 訓練，較 GB300 NVL72 提升 14 倍；HBM 頻寬 4.6 PB/s、
    fast memory 365TB。單 GPU 為 4 顆光罩尺寸晶片、最高 100 PFLOPs FP4、
    1TB HBM4 跨 16 個 HBM sites。
  nvhbm: >
    NVIDIA 自訂記憶體 NVHBM：將記憶體控制器移入 HBM base die，騰出 XPU 面積，
    相對標準 HBM4E 可達 +30% 頻寬、−15% 功耗。首次實作即在 Rubin Ultra。
    三星電子取得早期領先，正開發 8 層 HBM4E，NVIDIA 訂的速度規格為 17–18 Gbps
    （較三星初期 HBM4E 樣品的 14.4 Gbps 高約 20%）。
  memory_config_options: >
    ⚠ 這一項的因果關係，引發本次更新的二手中文報導寫反了，必須記正確。
    NVIDIA 將 Rubin Ultra 的 HBM 配置自原本單一的 12-high HBM4E，擴大為多個備案：
    8-high HBM4E、12-high HBM4、8-high HBM4，測試中的組態低至 192GB。
    該中文報導把它寫成設計哲學選擇（「優先提升傳輸速度而非堆疊層數，接受單 GPU 容量下降，
    靠多 GPU 互連補回算力」）。但一手英文報導（Tom's Hardware）的標題是
    as memory shortage bites back —— 原因是記憶體短缺，不是設計偏好。
    兩種框架的投資含意相反：
    設計選擇 → NVIDIA 主動選擇少用記憶體 → 單 GPU 記憶體含量結構性下降 → 對記憶體廠偏空；
    供給受限 → NVIDIA 買不到足夠記憶體 → 需求大於供給 → 對記憶體價格偏多，但壓抑 NVIDIA 出貨。
    採後者。理由：它與 2026-08-26 NVIDIA 法說的三項揭露互相印證 —— 採購承諾自 119 增至
    279 bn 且 primarily memory、毛利率因記憶體成本自 74% 滑至 Q4 觸底 71–72%、
    黃仁勳明言 FY2028 +70% 是供給受限。四件事放在一起，
    「NVIDIA 的供給瓶頸有相當部分就是記憶體」這個推論才成立。
  thermal_architecture: >
    ⚠ 2026-08-31 補入 —— 此前本 driver 只有 600kW 這個數字，沒有**散熱方案**。
    Kyber 600kW 機櫃要求**完全液冷、零風扇**（complete elimination of air cooling），
    這與現行世代不同：GB300 雖已強制液冷，輔助元件仍保留氣冷。
    機房端的要求為**溫水直接晶片冷卻迴路**（warm-water direct-to-chip loops），
    CDU 容量成為第一階設計參數，水系統需按每機櫃位數百 kW 規模設計。
    ⚠ **方案別的判讀，對 3324 是關鍵**：該檔 gaps 一直記著「Rubin Ultra 的 600kW 對應何種
    散熱方案（單相／兩相／浸沒）。若為浸沒，供應商結構與現行水冷板不同，對本檔是另一個故事」。
    目前證據指向 **direct-to-chip（冷板）路線延續**而非改採浸沒 —— 機房端明載 warm-water
    direct-to-chip loops + CDU。⚠ 但來源措辭有歧義：有報導用 complete liquid immersion
    with zero fans 描述，該句可能指「完全液冷」而非字面的「浸沒式」，因其後文才把
    direct-to-chip 與 immersion 並列為兩種方案。**故判定為「指向冷板延續，但未完全排除浸沒」**，
    不寫成定論。這個歧義本身就是 3324 下一步該查證的東西。
  power_architecture: >
    ⚠ 2026-08-31 補入 —— 800 VDC 不只是規格細節，是一條本覆蓋清單完全沒有曝險的產業鏈。
    NVIDIA 明載 **800 VDC 資料中心的全面量產與 Kyber 機櫃同步落在 2027**。
    物理原因：1 MW 機櫃若沿用 54 V 機內配電，單櫃需高達 **200 公斤銅匯流排**，
    1 GW 資料中心的機櫃匯流排銅用量可達 20 萬公斤；改用 800 VDC 後**同一銅線可多傳 150% 功率**，
    TCO 最多降 30%。GTC 2025 已展示為單一 Kyber 機櫃供電 576 顆 Rubin Ultra 的 800V sidecar。
    ⚠ **NVIDIA 點名的生態夥伴**（這是可追溯的供應鏈線索，非推測）：
      矽元件：Analog Devices、Infineon、Innoscience、MPS、Navitas、OnSemi、Renesas、
              ROHM、STMicroelectronics、Texas Instruments
      **電源系統元件：Delta（台達電）、Flex Power、Lead Wealth、LiteOn（光寶科）、Megmeet**
      機房電力系統：Eaton、Schneider Electric、Vertiv
    另透過 OCP 與逾 80 家生態企業合作。
    ⚠ **覆蓋層含意**：本清單十三檔中沒有任何一檔屬電力／電源，而 NVIDIA 已點名兩家台廠
    （台達電、光寶科）。這是 common_premise 成立時的一條受惠路徑，目前完全沒有覆蓋 ——
    已記入 state/coverage.yaml。本 driver 不為此新增 transmission，因為沒有對應的 state 檔。
  gaps: >
    ⚠ 576 顆 domain 的「銅纜 + 直接光連接」中，光連接占多少比例未揭露 ——
    這決定 CPO 在 scale-up 的實際 BOM 價值量。
    ⚠ 8 層與 12 層的最終選擇未定，NVIDIA 仍在測試多個備案。
    ⚠ 三星「早期領先」不等於獨家；SK 海力士與美光的 NVHBM 進度未取得。

foplp_layer_note:   # 2026-09-01 新增 —— 此前本 driver 完全沒有 FOPLP 內容，只有 CoWoS／CPO／機櫃功耗
  as_of: 2026-09-01
  tier: 事實＋推論（逐項標示）
  what_and_why: >
    FOPLP（扇出型面板級封裝）改採方形面板取代 300mm 圓晶圓。它是**跨標的**的封裝格式變數：
    OSAT 端是 6239，載板端是 8046／3037，晶圓級端是 TSM。
    產業級數字（面板尺寸、產能倍數、降本幅度、時間常數）住在這裡；
    個股自己的規格與產能（如 6239 為 510×515mm、P11 月產 6,000 片面板）住在各自的 state。
  panel_formats: >
    【事實】主流為 **510×515mm 與 600×600mm** 兩種方形面板。
    600×600mm 有效產能可達 300mm 晶圓的**數倍**；面板製程具**最高約一成**的降本潛力。
    【推論】各廠格式對照：台積電 310×310、力成 515×510（另記 510×515，同一規格的兩種寫法）、
    日月光 600×600、群創 700×700。產業專家認為 **600×600 最可能成為主流**。
    ⚠ 此對照表為二手摘要所得，直接抓取原頁未取回該表，故列推論。
    其中力成 510×515 與日月光 600×600 已由工商時報 2025-05-31 獨立佐證，可視為事實。
  packaging_trajectory: >
    【事實】封裝面積由約 **1.2 倍光罩尺寸朝 10 倍以上**發展；架構由 2.5D 走向多晶粒及 3D 整合；
    功耗自 **100W 提升至 1,000W 等級**。
    ⚠ **這個 1,000W 是「單封裝」口徑，不要與本檔 current 的「單機櫃」功耗混用。**
    且本 driver 的 components 已記 B300 單顆最高 **1,400W** —— 本則的 1,000W 是較粗的產業泛稱，
    **低於**已在檔內的數字，對 3324 不構成新資訊。口徑不同的兩個功耗數字並列時，
    先確認講的是同一個東西再拿去更新模型。
  time_constants: >
    【事實】聯發科投入面板級封裝**約 7 年**，**約花 3 年完成首項產品量產**，
    既有產品良率已達與晶圓級製程相當水準。單一新產品導入周期**約 8 至 9 個月**。
    ⚠ 這組數字的用途是**校準各家的量產時程宣稱**。例如力成 2025-05 已「小量出貨」、
    目標 2027 年中量產 AI 應用 —— 約 2 年，落在聯發科 3 年的經驗值之內，是可達的時程。
  ecosystem_structure: >
    【事實，引述】「FOPLP 無法由單一業者完成，需由**晶片設計公司整合**晶圓代工、封測、材料、
    設備及 EDA 供應商共同開發。」
    ⚠ 對 OSAT 端（6239）的含意要寫清楚：**封測廠是被整合的五方之一，不是整合者。**
    這與 6239 state 已記的「OSAT 是服務業、定價權有限」一致，是同一件事的外部佐證。
    【假設】「具量產經驗的封測廠…將成為新一波先進封裝投資焦點」—— 這是預測不是事實。
  osat_race: >
    【事實，工商時報 2025-05-31】兩家台系 OSAT 的 FOPLP 進度差約一年：
    力成 2025-05 已「面板級扇出型封裝開始小量出貨」，且有重量級客戶高階產品進入驗證
    （該產品為 2nm SoC 搭配 12 顆 HBM，整體封裝造價高達 25,000 美元／顆）；
    同期日月光為 2025 下半設備進駐、年底試產、2026 開始送樣客戶認證。
    ⚠ 但方向相反的一項是**面板尺寸**：力成 510×515 小於日月光 600×600，
    而產業預期 600×600 成主流 —— **時程領先、格式落後**，兩者量級相當，不宜只取一邊。
    ⚠ 該報導距今約 15 個月，後續進度未知。
  gaps: >
    ⚠ **FOPLP 是否侵蝕 ABF 載板用量？這是 8046／3037 與 6239 之間可能方向相反的一條路徑。**
    扇出型封裝以 RDL 重佈線層取代部分傳統載板功能，機制上存在替代可能。
    但本次**沒有證據支持該侵蝕**：事件文把「矽橋、載板、客製化記憶體架構」並列為所需技術，
    載板仍在其中；且力成 P12 三樓明載為「AI 晶片與 **ABF 載板**結合」——
    力成自己的 AI 產線是**用**載板而非取代它。
    **故列為未證實的疑問，不是結論。** 取得途徑：載板廠法說對 FOPLP 的評論；
    FOPLP 產品的實際 BOM 拆解。
    ⚠ 600×600 是否真的成為主流，以及各廠是否會換線 —— 目前只有產業專家看法，無廠商承諾。

cpo_layer_note:
  scale_out: {status: 已量產, detail: "Spectrum-X Ethernet Photonics 全面量產、2026 秋出貨；Quantum-X InfiniBand 2026 年內", tier: 推論}
  scale_up:  {status: "⚠ 2026-08-31 修正：自「仍為銅」改為「銅光並用，光學開始進入」", detail: "現行 Rubin 採 NVLink 6 銅纜，該部分不變。但下一代 Rubin Ultra NVL576（2027 下半）的 576 顆單一 NVLink domain 明載為 copper and direct optical connections —— 光學已進入 scale-up 域，非仍為純銅。前一版寫「CPO 尚未進入 scale-up 域」在 Rubin 世代成立、在 Rubin Ultra 世代不成立，時點必須分開講。", tier: 推論}
  implication: "產業 CPO 放量 ≠ 任一供應商進入 BOM。五家 CPO 供應鏈的成員名單未公開，是本檔對 6442 傳導的最大斷點。⚠ 2026-08-31 新增一條交叉驗證：COHR 管理層稱 scale-up 型 CPO 自曆年 2027 下半開始貢獻營收，而 Rubin Ultra NVL576（需要光學進入 scale-up）排定 2027 下半 —— 兩個獨立來源的時點吻合。這是覆蓋清單中 cpo 三檔（6442／3008／COHR）第一次拿到來自客戶端 roadmap 的外部座標，而非只有各自管理層的說法。"

transmission:
  - ticker: '6239'
    direction: '+'
    path: >
      先進封裝規格世代 → FOPLP 與 DDR5 TSV 的導入時點。
      公司目標 2027 年中前成為全球第一家量產面板級扇出型封裝 AI 應用的專業封測廠；
      DDR5 的 TSV 互連已完成試產、2026 Q4 量產，為 HBM 技術累積基礎。
      ⚠ 與 TSM 在先進封裝上是**不同層級**：TSM 做 CoWoS 等晶圓級，本檔是 OSAT 的
      面板級與記憶體封裝，兩者不直接競爭。
    lag: 領先 3–4 季
    sensitivity: 高（FOPLP 與 TSV 是本檔 thesis 的核心路徑）
    affects: ['FOPLP與DDR5_TSV進度', '資本支出強度', 'FOPLP競爭格局與規格']
  - ticker: '8046'
