    p: 0.50
    p_basis: 需求面本季沒有可爭論處，Q1 FY27 指引（Azure +45% cc）還高於共識 41.4%。共識達成是最可能的路徑
    key_assumption: FY27 共識達成；Azure 維持 40%+，營益率大致持平；倍數自 24.89x 小幅修復
    eps: 19.75
    exit_multiple: 26
    multiple_basis: "⚠ **2026-09-01 補上錨 B（同業），倍數維持 26x —— 而「維持」本身是本次的結論，不是沒做事。** 平台三檔的現金指標：本檔 P/FCF 56.3x／失真 2.19x／FCF-OCF 轉換 **36.6%**；GOOG 77.5x／3.11x／26.2%；META 35.6x／2.02x／31.4%。**本檔的轉換率是族群最高**，且為四大中唯一被預期 2026 年 FCF 仍成長（+5%）的一家 —— **遷入 Q2 對本檔是相對利多而非利空**，故不因資本密集度調降倍數。⚠ EPS 交叉檢查：現價 507.29 ÷ 遠期本益比 25.68 = **19.75**，與本檔 FY2027 EPS 假設完全相同 —— 我用的就是市場的遠期 EPS。｜錨 A（自身歷史，經 trailing→forward 換算）。5 年平均 trailing 31.26x，依約 15–18% 的 EPS 年增率換算 forward ≈ 31.26/1.18 ≈ 26.5x → 取 26x。現況 forward 24.96x 較之折價僅 8%，是清單中偏離歷史最小的一檔。判斷為【部分合理】：折價反映 15→25 年伺服器耐用年限變更後折舊節奏的不確定，但 8% 幅度小且該變更本身不改變現金支出（CFO Hood 明言 useful life 影響之外 2026 capex 預期不變）。⚠ 非現價隱含值 —— 26x 由歷史換算得出，事後檢查才發現與現況接近，這個順序很重要。⚠ 2026-08-27 新增 DCF 交叉檢查，結果與本益比框架【不一致，且本次未予調和】：以 TTM 自由現金流 66.99B 對市值 3.69T 反推，市場隱含的永續自由現金流成長率為 5.1%／6.1%／7.1%（折現率 7%／8%／9%）—— 對一個永續期而言相當進取。若 capex 見頂後 FCF 正常化回到 100B，隱含成長率降為 4.2%／5.2%／6.1%，仍不低。換言之：本益比說 MSFT 相對自身歷史便宜 8%，自由現金流說它需要永續 5–7% 的現金流成長才撐得住。本次不因此調整倍數 —— 兩者的分歧點是「capex 是投資還是消耗」，那要 FY2027–28 折舊入帳後才知道。但這個分歧已寫成 falsifier，不再是隱形的"
    tp: 514
    narrative: 26x = 5 年 trailing 平均 31.26x 換算後的 forward 值，與現況 24.96x 接近屬巧合非抄襲
  bull:
    p: 0.25
    p_basis: 需要 Copilot 席次動能延續與折舊晚於預期同時成立；前者有本季實績（20M→30M）支撐，後者未經驗證。與 bear 對稱
