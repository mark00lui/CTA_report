    **恢復技術面可判定性**：`半年線與年線 | 有無 | 取得即執行 |
      需與現價同源計算 | 日 K 序列` → ⚠ **在此之前 invalidation 無法填。**
    **偏多的必要條件（非充分）**：`收盤價 | 季線約 2,260.82 | > |
      需連續站穩，單日不算數 | 日 K`。
    **偏空**：`單月營收年增率 | 30% | < | 公告值算數 | 公開資訊觀測站`。
    **偏空**：`季毛利率 | 18% | < | 財報認列算數 | 季報`。
    **論點確立（thesis 成立方向）**：`季毛利率 | 22% | > |
      財報認列算數，法人對 1.6T／OCS 的預期不算數 | 季報`
      —— ⚠ **這一條是 thesis 本身：19.7% 已是五季新高，再上 2.3pp 才算「結構往上推」而非波動。**

