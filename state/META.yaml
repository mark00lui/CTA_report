notes: 本檔的風險與報酬幾乎都繫於『支出成長 vs 營收成長』的相對速度，其他都是次要。
  ｜2026-08-27 實測：這句預判被 Q2 數據證實且幅度更極端 —— 營收 +28% 而總費用 +55%，
  TTM 營收 +27.7% 而 TTM EPS -3.7%。營收接近三成成長、獲利卻在衰退。2026 共識營收 +26.48%、
  EPS 僅 +4.99%。廣告引擎本身沒問題，問題全在費用側（RL 年化虧損約 18B、Q2 capex 31.08B）。
  ｜本檔是覆蓋清單中最極端的「支出方」案例：MSFT 有 Azure、GOOG 有 Cloud 可把 capex 直接變現，
  三家營收成長相近（+18%／+24%／+28%）但只有 META 的獲利在衰退。這使它成為共同前提失效時的
  第二震央 —— 第一震央是 NVDA（最純粹的受惠者），META 則是最純粹的支出者且沒有對沖。
  ｜「何時收斂」而非「會不會收斂」：5 月裁員（Q2 認列 1.18B 遣散費）與 capex 指引收窄
  （下緣上抬、上緣未再抬高）都是收斂的動作，只是尚未反映在損益上。
