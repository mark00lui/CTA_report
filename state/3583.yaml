notes: >
  ⚠⚠ **本檔迫使我修正一條昨天才寫定的通則，而修正的理由與本檔的好壞無關 ——
  這一段是本檔最重要的產出。**
  **昨日於 6805 收斂寫定的版本是：「清單內的標的不作為估值錨 ——
  不論它是競爭者還是鄰居，因為錨的價值在於它獨立於我的判斷，而清單內的標的不獨立。」**
  **而辛耘同時是 3131 弘塑與 6187 萬潤的同業。依那條禁令，把它納入清單
  就會同時抽掉兩檔的錨 —— 而那兩檔的同業倍數目前一個都還沒取得，
  等於在它們最需要錨的時候把錨拿走。**
  ⚠⚠ **決定性的理由不是「這樣很不方便」，是那條禁令有一個壞的尺度性質**：
  **覆蓋清單越大，落在清單內的同業就越多；一條「讓清單變大時自己變得更沒用」的規則，
  多半是規格寫錯了。**
  ｜⚠⚠ **細化後的版本**：
  **錨可以是觀測值，不可以是我的判斷值。**
  **清單內標的的「市場觀測倍數」可用於序位對照，但必須在報告裡明寫
  「用的是哪一天的觀測值，且不得因我對該檔的判斷而調整」；
  其「目標價、應有倍數、情境倍數」一律不可用。**
  **且每次重估其中一檔時，必須檢查另一檔是否連動並明寫。**
  ｜⚠ **回頭檢查最初的 LITE／COHR 那一組，這個細化是相容的，而且更接近當時的原始處置**：
  **那次記下的做法本來就是「兩檔的錨各自獨立，但每次重估其一時必須檢查另一檔是否連動並明寫」
  —— 那正是細化後的版本，不是禁令。**
  **亦即 6805 的禁令版本才是偏離，本檔是回到原本的處置並把理由講清楚。**
  ⚠ **實務後果**：**`state/3131.yaml` 與 `state/6187.yaml` 的 peers 章節
  應在下次 /revalue 時依此加註。本檔不逕行修改它們的 state ——
  依本倉庫規則，state 變動須有對應報告。**
  ｜⚠⚠ **而細化的第一個正面回報立刻出現了：三檔設備商的序位現在可以用觀測值做，
  不必再全部留空。**
  **本益比 —— 本檔 44.79 ／ 3131 46.65 ／ 6187 71.80；**
  **股價淨值比 —— 本檔 6.09 ／ 3131 23.97 ／ 6187 15.83；**
  **市營比 —— 本檔 5.11 ／ 3131 10.09 ／ 6187 17.73。**
  **本檔在三項上都最便宜，而它的 TTM 淨利率也最低（約 11.4% 對約 21.6%、約 24.7%）——
  因為代理業務的營收大而毛利低。市營比 5.11 對 17.73 的三倍半差距，
  主要是商業模式差異而不是估值差異。**
  ｜⚠⚠ **本檔的第二個重要產出是把「設備商都是塊狀的」這句話推翻了。**
  **三檔設備商，三種「營收平滑度」與「獲利平滑度」的組合**：
  **3131 —— 月營收與累計都不規則，季利潤率掉 10.6pp；**
  **6187 —— 月營收單調加速（本輪最乾淨的兩檔之一），季利潤率升 12.2pp；**
  **本檔 —— 月營收極平穩（八個月全距僅 10%），而單季淨利率四季全距 16.3 個百分點
  （24.5% → 8.2% → 11.1% → 14.0%）。**
  **塊狀是真的，但塊狀的位置在不同的地方 —— 本檔的塊狀完全在組合裡，一點都不在量裡。**
  ⚠ **實務後果：本檔已明文禁用月營收判斷獲利動能，
  而第一條 falsifier 也標明「只測量，不測 thesis」。**
  ｜⚠⚠ **本檔是連續七檔以來第一次拿到客戶集中度的真實錨點**：
  **2024 年對台積電的機台銷貨收入 20.36 億元（2023 年 9.29 億元，+119%）。**
  **前六檔的第四條 falsifier 都因為這個數字取不到而標「未驗證」，
  6187 是改用管理層給的能見度繞開，本檔是第一次有硬數字。**
  ⚠ **而該客戶（台積電）也在覆蓋清單內 —— 本檔與 3131 都賣設備給它。**
  ｜⚠ **本檔是三檔設備商中象限判定最不穩的一檔**：
  **再生晶圓月產能 21 萬片 → 25 萬片是實質資本支出，而 capex／營收 未取得；
  若 > 15% 則本檔應為 Q3 而非 Q4。**
  **且股價淨值比 6.09（三檔最低、僅 3131 的四分之一）暗示的方向與 Y 軸判低相反 ——
  間接證據與判定不一致時，判定就必須被標成暫定的。**
  ｜⚠ **另記兩件小事**：**本檔為上市（TWSE），而 3131 與 6187 皆為上櫃 ——
  記下來以免日後查錯資料源。**
  **另，本檔的月營收為本輪第五種基期形狀（兩年都很平）——
  平的線可讀，但本檔證明了「可讀」不等於「有訊息」。**

