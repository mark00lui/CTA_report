    「上修資本支出年增三成以上，提前擴充伺服器機櫃、**液冷**及測試產能」——
    而 3324 與 3017 的整個 thesis 就是液冷滲透率。**
    **這是「買賣雙方一手互證」在本清單的第一個實例，與此前三種交叉驗證都不同。**
    ⚠ **明文禁用把供應商的倍數當本檔的錨，反之亦然。**
    ｜⚠⚠⚠ **市營比 0.35 —— 本清單最低，而同日建檔的 3363 是 45.92，相差 131 倍。**
    **同一天、同一條 AI 鏈上 —— 這是「市營比跨商業模式時毫無意義」最好的證明。**
    ｜⚠⚠⚠ **本檔與 3363 同日建檔，正好把「哪一條營收序列有訊息」的兩個極端佔滿了。**
    **本檔月增率不可讀（消費電子季節性，3 月跳 +34.90%）但年增率與累計都可讀
    （去年基期全距僅 19.1%，累計年增率 2 月觸底 21.63% 後單調上升六個月至 39.73%）；
    3363 則相反（去年基期全距 103%，只有月增率可讀）。**
    **這證明「哪一條序列有訊息」不是標的的屬性，是基期形狀與季節性共同決定的 ——
    判斷順序應是：先看去年那條線的形狀 → 再看今年有沒有季節性 → 最後才選序列。**
    **本輪此前只做了第一步。**
    ｜三情境**刻意不建立**：那 19 個百分點還沒有解釋；淨負債未取得使 EV/EBIT 只是宣告；
    四大產品線的個別營收與營業利益率全缺；六家清單外同業倍數全缺。
    ｜評級**中性／信心低**。位階**整理**，**invalidation 留空**。
    ⚠⚠⚠ **比值 0.04 倍（季線距現價 0.06% ÷ 日振幅 1.59%）—— 本輪第二極端，
    僅次於 8299 的 0.008。**
    **而本檔揭露了那條規則缺的第四個條件：本檔日振幅僅 1.59%、Beta 0.96，
    兩者都是本輪最低 —— 對這樣一檔市值 3.5 兆元的大型股，
    「2 個日振幅」只需要距離 3.2% 就滿足，而 3.2% 在單日新聞與盤中雜訊的範圍內。**
    **亦即規則需要的不只是相對下界，還要一個**絕對下界**。**
    **現有三條件（≤±20% 的絕對上界、≥2 個日振幅的相對下界、在正確的一側）
    加上本檔的第四條。**
    ⚠ **並記下十個樣本的通過率只有 20% —— 這件事本身應回填 references，
    而更可能的解釋是「季線」對多數標的本來就不是好的失效參考（本輪只查了季線一條線）。**
    ｜四條 falsifier。⚠⚠ **本檔有兩條與 AI 需求無關的（第二條營業利益率、
    第三條稅後淨利對營業利益的轉換率）—— 兩者都可以在需求全對時觸發。**
    **這在本輪是少見的：3665 那一檔一條都沒有。**
    ⚠ **第四條錨在管理層自己的話（全年 AI 機櫃出貨量倍數以上成長，已上修），
    本輪連續第五檔如此。**
    **但它的弱點已記下：公司未逐季揭露機櫃出貨台數，只能以口徑驗收。**

