  level: L2
  summary: 手動全量重估（建檔後首次）— 首次建立三情境與加權目標價 805，相對 2026-09-10 收盤 1,030 為 -21.8%
  delta: >
    ⚠⚠⚠ **本次最重要的發現：溢價與 ROE 的方向是相反的。**
    **本檔股價淨值比 **12.78**（1,030 ÷ 每股淨值 80.59）是同業區間 4.59–5.26 的 **2.5 倍**，
    而隱含 ROE **21.6%** 是四家中**最低**的（晶豪科 3006 為 47.5%／鈺創 5351 為 29.4%／
    華邦電 2344 為 24.8%）。**
    **依本次建立的三步判準：盈餘皆正非趨零故 PE／PB 可用 → 同業 PB 離散僅 **1.15 倍**，
    是十四個族群中最緊的 → 而離散**完全沒有被 ROE 解釋**，方向是相反的。**
    **→ 這個溢價不是獲利能力撐起來的，它的全部內容是 VHM／VHMStack 那個選擇權。**
    **而族群之所以緊正好讓這個判讀可靠：若族群本身離散，2.5 倍可以被說成噪音；
    緊到 1.15 倍，它就不能。**
    ⚠ **對照同日重估的 8299 群聯**：**那一檔的倍數在族群內的位置「結構上完全正確」
    （模組 5.36–7.17 ＜ 群聯 9.46 ＜ 控制器 31.07）；本檔相反 —— 位置就是異常本身。**
    ｜⚠⚠ **象限維持 Q4，但 X 軸低的理由本次更精確了。**
    **序列 FY2022 12.10 → FY2023 8.93 → FY2024 9.73 → FY2025 **7.73** 是震盪且緩降的，
    2026 才跳升（H1 8.33）—— 那是「低基期之後的回升」，不是複利成長。**
    **⚠ 並補一個今天從 3017 奇鋐學到的判準：「TTM ÷ 四年平均」單獨不夠，
    還要看序列是單調還是震盪 —— 對單調序列做正常化會把成長誤判成週期
    （3017 的序列 11.78 → 14.19 → 21.25 → 49.26 是單調的，本檔不是）。**
    **⚠ 且 FY2025 裡有一個 **Q2 -3.36** 的單季虧損，其餘十九季皆正 ——
    單季虧損在一條否則平穩的序列裡，是 X 軸判低的獨立理由。**
    ｜⚠⚠⚠ **主錨（選擇權拆分）本次仍不能定量，而這使 base 倍數成為三情境裡
    唯一沒有第一性依據的部分。**
    **上下界都是觀測值（同業最高 19.79 與現價隱含 46.8 倍），但 35 這個點是區間內插，不是估值。**
    **對照 2337 旺宏的 base 倍數 10 倍有一條可檢驗的理由（同業 19.79 打五折，
    因峰值 EPS 不配峰值倍數）—— 本檔沒有。誠實標示。**
    ｜⚠⚠⚠ **交叉檢查：PB 框架給出完全不同的答案。**
    **同業 PB 區間 4.59–5.26 × 每股淨值 80.59 ＝ **370 至 424**（-64.1% 至 -58.8%），
    對 base 的 770（-25.2%）差約 2 倍。**
    **差距的全部內容就是那個選擇權 —— PB 框架把它當成零，PE 框架保留了一部分。**
    **若 VHMStack 的時程延後，估值會往 PB 框架那一端移動。**
    ｜⚠⚠ **三個口徑問題必須記下**：
    **① TTM EPS 有三個值 —— 建檔時 18.14（1,045 ÷ 57.61）、09-11 的 16.56（984 ÷ 59.4）、
    季度加總 **17.38**。三者相差 8.7%，而價格效應只能解釋一小部分 ——
    來源的 EPS 欄位在兩天之間被改過。本次採季度加總。**
    **② ⚠⚠ 同一個來源自我矛盾（本週第八個來源問題，而性質是新的）：
    09-11 顯示 現價 984 與股淨比 13.37 → 反推每股淨值 73.60，
    但建檔時同一來源明確列每股淨值 **80.59**（且 1,045 ÷ 12.97 ＝ 80.57 自洽）。
    984 ÷ 80.59 ＝ 12.21，不是 13.37。採每股淨值 80.59。**
    **前七次是寫錯或單位錯，這次是欄位之間不一致。**
    **③ 09-11 價格跌至 984（-4.47%）後失效價位重算：距 MA120（857.96）12.81%、
    日振幅 3.88% → 比值 **3.30 倍**，仍四條件全過（09-10 時為 2.25 倍）。維持 857.96。**
    ｜**新增第五條 falsifier**（單季年化 ROE 低於 25%）——
    **既有四條全部測營收與毛利率；本條測「獲利能力能不能配得上帳面值的倍數」，
    那是 PB 溢價唯一的基本面支撐，也是本次那個反向關係的直接檢驗。**
    ｜評級**維持中性／信心低**。
    ⚠⚠ **技術面是過關的**（價格在六條均線全部之上，完美多頭排列；
    失效價位 MA120 857.96，比值 3.30 倍）。
    ⚠⚠⚠ **所以不升等的理由完全在估值面，而它有三層**：主錨不能定量；
    溢價與 ROE 方向相反（而族群緊到 1.15 倍使它不能被當成噪音）；兩個框架差 2 倍。
    ⚠ **要公平記下的**：營收成長是真的且幅度很大（前 8 月累計年增 109.13%、
    8 月單月年增 150.82%、Q3 前兩月月均比 Q2 高 35.5%）。
    **卡住的是「這個價格在為一個還沒有金額的選擇權付多少」。**
    ｜⚠ **本次未做到**：VHM／VHMStack 的市場規模與單價（主錨仍不能定量）；
    淨負債（第十七次，而本檔股東權益週轉率僅 0.69 倍，若有大額現金須先扣除）；
    研發費用率與營業利益率；Q2 毛利率；20 日平均振幅；
    **以及兩件建檔時列為「未查證故不得推論」的事 —— 與鈺創 5351 的淵源
    （⚠ 本次 base 的上界正錨在同業上，所以這件事現在更重要了）、報價頁的「愛普*」星號註記。**
