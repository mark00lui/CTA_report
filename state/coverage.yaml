  memory:         {count: 3, pct: 11.5, note: "MU + SNDK + 6239 — ⚠ 2026-09-01 納入 6239 後，本因子內部**第一次出現方向分歧**：MU／SNDK 賺記憶體**價格**，6239 賺封測**服務費、按顆計價** —— 漲價進不了 6239 的損益，它受惠的是**量**。若漲價機制是「減產挺價」而非需求成長，對 MU／SNDK 是利多、對 6239 是利空。此前本格的警告只是「同向但不等深」，現在是**可能反向**。原註： 記憶體供應端。⚠ 清單內唯一「營收即他檔成本」的一組。⚠ 2026-08-27 SNDK 重估後修正：兩檔同向但不等深 —— NAND 上一輪谷底毛利率為負（WD Flash −11.9%），DRAM 為 2.7%，且 MU 有 HBM 的先進封裝瓶頸、SNDK 無對等結構"}
  cyclical:       {count: 6, pct: 23.1, note: "MU + SNDK + 3037 + 8046 + 6239 + 3030 — 循環股。⚠ 2026-09-08 納入 3030：檢測設備需求跟隨**客戶的資本支出循環**，是本因子內第四種不同源的循環（記憶體商品循環／載板產能循環／封測稼動率循環／設備資本支出循環）。**四者的供給側決策者與前置期都不同，不可視為同一個賭注的四種寫法。**原註：其餘標的的風險來自論點，這三檔的風險來自循環位置。⚠ 2026-08-31 納入 3037（ABF 載板為典型產能循環，52 週區間 129.50–1,230，上緣為下緣的 9.5 倍）。但它與記憶體兩檔的循環**不同源**：MU／SNDK 是記憶體商品循環，3037 是載板產能循環，兩者的供給側決策者、擴產前置期與客戶結構都不同 —— 不可視為同一個賭注的三種寫法"}
  cpo:            {count: 4, pct: 15.4, note: "⚠ **2026-09-10 納入 3081 後自 16.0% 再降為 15.4% —— 連續第六次下降**（20.0 → 19.0 → 18.2 → 17.4 → 16.7 → 16.0 → 15.4%）。 ⚠⚠ **3081 是本日第四檔新增光互連鏈曝險卻刻意不標 cpo 的（前三檔 AXTI、AAOI、2345），而它是四檔中最接近該標的一檔** —— **外部連續波雷射源本來就是 CPO 架構的必要元件。** **不標的理由是：它今天的 CW 雷射需求主要來自可插拔矽光模組（地區營收中國佔 70–80%，因全球約 75% 模組產能在中國，而那些產能今天做的絕大多數是可插拔）。亦即 3081 的 thesis 不依賴「CPO 是否如期放量」，CPO 是額外的上檔而非前提。** **已於該檔寫定重新分類規則：CPO 相關 CW 雷射營收占比 > 15% 則加標籤並重估。** ⚠ **分子始終是 4** —— 六次下降全部是分母效應，那四檔的依賴一分未減。原註：⚠ **2026-09-10 納入 3017 後自 16.7% 再降為 16.0% —— 連續第五次下降**（20.0 → 19.0 → 18.2 → 17.4 → 16.7 → 16.0%）。**本次為分母效應，3017 與光通訊無關。** ⚠ **分子始終是 4，那四檔的依賴一分未減。**原註：⚠ **2026-09-10 納入 2345 後自 17.4% 再降為 16.7% —— 連續第四次下降**（20.0 → 19.0 → 18.2 → 17.4 → 16.7%）。**本次為分母效應。** ⚠⚠ **但 2345 與這一格的關係比分母效應複雜，必須寫下來**：**它是交換器廠，與 cpo 那四檔（6442／3008／COHR／LITE）在物理上是綁定的 ——一個 800G 埠同時需要交換器端的埠與光模組端的收發器。****若 CPO 真的取代可插拔，改變的是光模組那一端的形態，而交換器端的埠數不變。****亦即 2345 對「CPO 對可插拔誰贏」中性，但對「埠數成長」高度敏感 ——這與 AXTI、AAOI 未標 cpo 的理由是同一種，本清單今天第三次出現。**原註：⚠ **2026-09-10 納入 3533 後自 18.2% 再降為 17.4% —— 連續第三次下降**（20.0 → 19.0 → 18.2 → 17.4%）。**本次純粹是分母效應，3533 與光通訊無關。**原註：⚠⚠ **2026-09-10 納入 AAOI 後，這一格自 19.0% 再降為 18.2% —— 連續第二次下降。** 序列 20.0 →（AXTI）19.0 →（AAOI）18.2%。**AAOI 是可插拔收發器廠，產能目標明寫為「800G 與 1.6T 產品」，故同樣未標 `cpo`。** ⚠ **連續兩檔新增光通訊曝險卻不加深 cpo 前提依賴，這在本清單是新的模式，值得記** —— **它說明光通訊這條鏈裡有一大塊價值不押 CPO 的勝負。** ⚠ **但同樣不要誤讀**：分子仍是 4，那四檔（6442／3008／COHR／LITE）對「CPO 是否如期放量」的依賴一分未減；**變的只有分母。** ⚠ **也不要因此以為 AXTI 與 AAOI 對規格路線免疫** —— AAOI 在「1.6T 何時放量」上高度敏感，**只是在「CPO 對可插拔誰贏」上中性。兩者不是同一件事。**原註：⚠⚠ **2026-09-10 新增 AXTI 後，這一格自 20.0% 降為 19.0% —— 本清單成立以來第一次下降，而且是在同時新增一檔光通訊標的的情況下降的。** **理由：AXTI 的磷化銦基板同時供給可插拔光模組與 CPO 兩條路徑，它不依賴 CPO 這個特定前提成立**，因此刻意未標 `cpo`。**這是清單裡第一次新增光通訊曝險卻沒有加深 cpo 前提的依賴。** ⚠ **不要把 19.0% 讀成 cpo 曝險減輕了** —— 分子沒變，四檔（6442／3008／COHR／LITE）對「CPO 是否如期放量」的依賴一分未減；**變的是分母，也就是清單裡多了一個不押這個前提的人。**原註：⚠⚠ **2026-09-10 納入 LITE，自 3 檔變 4 檔（15.8% → 20.0%）。****而這一次的加深帶有一個此前不存在的性質：新增的那一檔原本是既有標的的錨。**COHR 的三個情境倍數全部掛在 FN 與 LITE 的 forward PE 上，**LITE 成為覆蓋標的後，我對它的判斷會直接移動 COHR 的目標價 —— 循環引用。**⚠ **對照 COHR 當年納入時的性質（集中度與可檢驗性同時上升），本次是集中度上升而「錨的獨立性」下降 —— 方向相反。** 詳見 correlation_watch。原註：6442 + 3008 + COHR — ⚠ 2026-08-27 當日自 0 檔成長到 3 檔。三者切入點不同（6442 光通訊產品、3008 自 FA／PMLA／FAU 光學元件端、COHR 自磷化銦雷射與收發器垂直整合）但共用同一個「CPO 是否如期放量」前提。⚠ 但 COHR 的加入同時帶來反向效果：它是三者中唯一給出第一手時程（初期營收 2026 年 12 月當季、scale-up 曆年 2027 下半）的標的，因此雖然加深了因子集中，卻讓這個共同前提第一次變得可外部檢驗。集中度與可檢驗性同時上升，這在本清單是第一次"}
  thermal:        {count: 2, pct: 7.7,  note: "3324 + 3017 — ⚠⚠ **本格於 2026-09-10 才建立，而 3324 自建檔起就帶著 thermal 標籤 —— 亦即這一格此前一直漏記。發現的原因是新增 3017 時要更新它，才注意到它不存在。** **這說明等權因子分布的維護是被動的：只有在某一格「動了」的時候才會被檢查，而一直是 1 檔的格子可能從來沒被建立過。** 已補。 ⚠⚠ **兩檔是直接同業，而且構成本清單第二組循環引用**（第一組為 LITE／COHR）：**`state/3324.yaml` 的 `methods.secondary`（錨 B）用的正是 3017 的 forward PE 26.26x。** **處置：3017 的錨一律取自清單外（健策 3653、建準 2421），明文禁用 3324 的倍數；兩檔互為份額觀察對象而非估值錨。** ⚠ **差別是這一組在建檔前就被看見**，而 LITE／COHR 那組是建到一半才發現 —— **不是我變聰明了，是 correlation_watch 裡已經寫著那條教訓。** ⚠⚠ **且查證錨 B 時發現一個會回頭影響 3324 的口徑問題**：**3,285 ÷ 26.26 = 隱含 forward EPS 125.1，而台灣法人 2026 共識區間為 87.78–106.8（均值約 101.1）—— 高出上緣 17%。以同一個 2026 共識口徑重算，3017 的 forward PE 約 32.5x，對照 3324 自身的 21.80x，同業溢價是 49% 而非 3324 檔裡記的 20%。** **未確認 stockanalysis 的 forward 是 NTM 還是曆年 2026，故只陳述算術不斷言原因；依本倉庫規則不逕行修改 3324 的 state，建議下次 /revalue 3324 優先處理。**"}
  optical:        {count: 7, pct: 26.9, note: "⚠⚠ **2026-09-10 納入 3081 後自 24.0% 升至 26.9%（6 檔 → 7 檔）。本日一天之內自 4 檔變 7 檔。** ⚠⚠ **而 3081 帶來的不是又一檔，是把這條鏈補完整了。本清單至此第一次擁有一條完整的供應鏈：** **InP 基板（AXTI）→ 磊晶片與 CW 雷射（3081）→ 收發器模組（COHR／LITE／AAOI／6442／3008）→ 交換器（2345）。** **3081 正好卡在 AXTI 與收發器族群之間 —— 它買 AXTI 那一層的東西，賣給收發器那一層。** ⚠⚠ **而它一納入就立刻產生了本清單第一個「下游用一手說法證實上游」的實例**：**3081 的法說明言「InP 基板 4 吋以上大基板供給比重極低，為隱形瓶頸」，而 AXTI 的整個 thesis 就是 InP 基板產能 —— 那句話來自它的客戶那一層，不是來自 AXTI 自己。** **這正是 state/AXTI.yaml 的副錨想做卻做不到的層級交叉驗證，現在做得到了。**原註：⚠ **2026-09-10 納入 2345 後自 26.1% 降為 25.0%（分母效應，2345 不標本格）。** ⚠⚠ **但 2345 為這一格帶來一個此前沒有的東西：同一個埠的另一端。****一個 800G 埠同時需要交換器這一端的埠與光模組那一端的收發器 ——兩邊的出貨量在物理上必須對得起來。若長期背離，其中一邊的數字是錯的，或是庫存在某一層堆積。** **這使 2345 成為本格六檔的獨立交叉驗證節點，而且與 AXTI 的角色不同：AXTI 是上游（基板 → 雷射 → 收發器），2345 是同一層的另一端（交換器埠 ↔ 收發器）。兩種交叉驗證性質不同，判讀時不可混用。**原註：⚠⚠ **2026-09-10 納入 AAOI，自 5 檔變 6 檔（23.8% → 27.3%）。本日一天之內自 4 檔變 6 檔。** **這一格現在是本清單第二大的因子，僅次於 ai_capex_hw。** ⚠ **六檔的分層值得寫下來，因為它們不再是同一種東西**：**上游基板 AXTI ／ 收發器與模組 COHR、LITE、AAOI、6442 ／ 光學元件 3008。** **這是清單第一次在單一因子內部有了真正的層級結構，而不是六個押同一件事的人。** ⚠⚠ **但 AAOI 帶進一個此前沒有的性質：它有 42% 的營收（CATV）根本不在光通訊 AI 這條鏈上。** **等權因子分布數的是標的數不是營收，所以這一格的 27.3% 高估了實際的 AI 光通訊曝險。** 詳見 non_ai 那一格記的方法限制。原註：⚠⚠ **2026-09-10 納入 AXTI，自 4 檔變 5 檔（20.0% → 23.8%）。而這一次的加深性質與同日的 LITE 正好相反。** LITE 是**同一層**（收發器與模組）的直接同業，集中度上升而錨的獨立性下降（它原本是 COHR 的錨）；**AXTI 在另一層（上游 InP 基板），而且時序領先下游數個季度 —— 集中度上升，可檢驗性同時上升。** **這是本清單第三次「集中與分散同時上升」**（第一次 COHR、第二次 CEG）。⚠ **具體的可檢驗性是什麼，要寫死才不會變成空話**：本清單原有的四檔光通訊曝險全在收發器與模組那一層，**AXTI 是它們共同的上游，且已與其中兩家（COHR、LITE）簽長期供貨合約並收取預付款。****基板出貨在下游收發器之前，所以它是那個共用光通訊前提的早期預警。** ⚠ **代價同時記下：最上游節點的長鞭效應最強，需求轉折時它也會最早、最劇烈地反映。**原註：⚠ 2026-09-10 納入 LITE，自 3 檔變 4 檔（15.8% → 20.0%）。原註：6442 + 3008 + COHR"}
  substrate:      {count: 2, pct: 7.7, note: "⚠⚠ **2026-09-10 新增的 AXTI 刻意不計入這一格，這是一個判斷不是疏漏，寫在這裡以免日後被當成錯誤修掉。** **本格的 `substrate` 指的是 3037／8046 的 ABF 載板（封裝載板）；AXTI 做的是化合物半導體晶圓基板（InP／GaAs／Ge 單晶）。中文都叫「基板」，但客戶、循環、物理全都不同。** **同名不同物混進同一格，會讓因子分析安靜地說謊 —— 而它不會報錯。** 故另立 `compound_semi`。原註：3037 + 8046 — 2026-09-01 納入 8046 後**一個月內自 0 檔變 2 檔**。ABF 載板在 AI 供應鏈上與 TSM 互補而非替代（TSM 做晶片與 CoWoS，載板廠做承載它的載板），故不是對 foundry 曝險的分散。⚠ **更重要的是這兩檔彼此也不是分散** —— 同一種產品、同一個漲價循環、PB 同樣位於各自三年區間頂部（3037 為 14.0x 對區間 1.51–14.99；8046 為 16.13x 對區間 1.40–16.39），連三年平均都幾乎相同（5.5 對 5.47）。這一格的 14.3% 應視為**一個循環的兩種寫法**"}
  consumer_optics: {count: 1, pct: 3.8,  note: "3008 — 清單中唯一營收基礎在消費性電子（手機鏡頭）而非 AI 的標的"}
  test_equipment: {count: 1, pct: 3.8,  note: "3030 — 2026-09-08 新增。檢測與量測設備，是清單中**第一檔賣設備給供應鏈、而非身在供應鏈裡**的標的。⚠ 由此導出一個與其餘十檔不同的傳導：它受惠的是**客戶的資本支出決策**，而非客戶的出貨量 —— 客戶擴產時它先受惠，客戶滿載但不擴產時它不受惠。**這使它在同一條 AI 需求鏈上的時序與其餘標的錯開。** ⚠ 同業致茂 2360 的 PE 為 57.02，而本檔為 21.36（折價 62.5%）—— 折價的具名成分為規模差 14.2 倍、營收成長 +28.2% 對 +61.6%、且**本檔無分析師覆蓋**"}
  osat:           {count: 1, pct: 3.8,  note: "6239 — 2026-09-01 新增。專業封測（OSAT）與 TSM 的晶圓級先進封裝是**不同層級**，不直接競爭 —— TSM 做 CoWoS，6239 做面板級與記憶體封裝。⚠ 本因子真正的價值在於：它是清單中**唯一受惠於量而非價**的 AI 供應鏈曝險，也是唯一在納入當下估值未處於延伸狀態的台股（PB 3.58x 位於三年區間 1.43–4.80 的 64% 處）"}
  fabless:        {count: 1, pct: 3.8,  note: "AVGO — 2026-09-08 新增。⚠ **本標籤存在的理由是防一個具體的誤判**：AVGO 的 D&A／營收為 9.8%，看起來像資本密集，**但那幾乎全是 VMware 併購的無形資產攤銷，不是實體資產折舊**。實際 **capex／營收 TTM 僅 1.40%**（Q3 單季 1.80%）。⚠ 同族群對照：NVDA 2.4%、MRVL 5.0% —— **三家都是無廠，Y 軸在本族群不具區辨力**"}
  infra_software: {count: 1, pct: 3.8,  note: "AVGO — 基礎設施軟體（VMware 為主體），FY2026 Q3 營收 8,752M、占總營收 30%、年增 29%。⚠ **清單中第一個「同一檔內部有兩種完全不同成長性質」的業務組合**：半導體分部年增 127%（其中 AI +221%），軟體分部年增 29%。**它使 AVGO 成為清單第一檔選擇權拆分真的做得出來的標的** —— 年化後 AI 66.8B／非 AI 半導體 16.6B／軟體 35.0B。⚠ **但只完成一半：分部別營益率未取得，還不能給各部分不同倍數**"}
  ai_power:       {count: 1, pct: 3.8,  note: "CEG — 2026-09-08 新增。⚠ **本清單第一檔「賣電給 AI，而不是賣硬體給 AI」的標的，而它帶進來的最重要的東西不是新產業，是新的傳導性質：存量 vs 流量。** 其餘 16 檔中有 15 檔曝險於「AI 資料中心**資本支出**」——那是流量；**本檔曝險的是資料中心的用電量，那是資本支出落成之後的存量。一座已建成的資料中心即使 capex 歸零仍然耗電。** ⚠ **它不免疫** —— 新的 PPA 仍要等新的資料中心蓋起來；**但既有合約的現金流不隨 capex 減速而消失，這是清單上其餘十五檔都沒有的性質。** ⚠⚠ **2026-09-08 補正：建檔當日這句話只說了一半。** CEG 在**需求軸**上確實是分散，**但它在折現率軸上帶進一個清單其餘十六檔都沒有的集中曝險** —— 公用事業是市場公認的「債券替代品」，2026 年 8 月 XLU **-4.78%** 而 S&P500 **+2.62%**（差 **7.40pp**），**公用事業為今年以來 S&P500 唯一下跌的族群**。⚠ **更值得記的是這兩件事同源**：推升殖利率的原因之一正是「**AI 相關企業債券大量發行與公債競爭資金**」（二手轉述，見 notes/2026-09.md）。**同一筆 AI 資本支出，對 CEG 既是需求順風（PPA），又是估值逆風（折現率）—— 這是覆蓋清單第一檔兩個方向同時發生在一檔身上的標的。** 前者是它被納入的理由，後者是它 52 週報酬 -3.09%、距高點 -27.6% 的可能解釋之一。**分散與集中同時上升，這在本清單是第二次**（第一次是 COHR 使 cpo 因子的集中度與可檢驗性同時上升）。 ⚠ **也因此它沒有 driver_refs**：現有三個 driver 記的是資本支出承諾／加速器出貨／平台時程，**沒有一個記的是用電量**。正確做法是新增 `datacenter-power-demand` driver，而非硬掛既有的三個"}
  nuclear:        {count: 1, pct: 3.8,  note: "CEG — ⚠ **裝置容量與燃料結構本輪未取得**，故本標籤目前描述的是業務性質，**不作為任何估值論證使用**（重置成本論證因此也做不出來）。取得途徑：10-K 的 Item 2 Properties、EIA-860"}
  us_utility:     {count: 1, pct: 3.8,  note: "CEG — ⚠ 但它不是受管制的公用事業，**盈餘與電價及避險部位連動**：GAAP EPS 5.01／11.89／7.40／10.33（高低差 2.37 倍），且 FY2023／FY2024 營運現金流為負。**不可套用一般公用事業的低波動假設**"}
  merchant_power: {count: 1, pct: 3.8,  note: "CEG — 批發／零售電力供應。⚠ **這一格解釋了為何本檔不用 EV/Sales**：營收含大量轉手性質的交易量，EBITDA 利潤率僅 25.4%；FY2026 共識的**營收錨寬度 36.2% 是 EPS 錨寬度 5.78% 的 6.3 倍** —— 分析師對它賺多少高度一致、對它營收多少嚴重分歧"}
  power_electronics: {count: 1, pct: 3.8, note: "2308 — **2026-09-10 新增，關閉本檔記錄過三次的結構缺口：「清單中沒有任何一檔屬電力或電源，而 NVIDIA 已點名兩家台廠（台達電、光寶科）」。** ⚠⚠ **本標籤與 CEG 的 `ai_power` 是完全不同的東西，這個分辨比新增標的本身更重要**：**CEG 賣的是電**（曝險於資料中心用電量，是 capex 落成之後的**存量** —— 一座已建成的資料中心即使 capex 歸零仍然耗電，故對 capex 減速**部分免疫**）；**2308 賣的是電源轉換與配電設備**（曝險於機櫃出貨與功率密度，是 capex 的**流量**，**不免疫**）。**兩者都叫「電力」，若合併成同一格會產生一個假的分散。** ⚠ **它帶進來的真正分散在別處**：它是清單中第一檔受惠於**單櫃功率密度**而非**出貨量**的標的（54V → ±400V → 800VDC 由功耗驅動，800VDC 排定 2027Q2 放量），也就是本檔先前記的「唯一一條與出貨量部分脫鉤的 AI 受惠路徑」。⚠ **納入當下的估值位置與前幾檔台股相反：它在回檔而非延伸狀態** —— 距 52 週高 **-30.6%**、收盤 1,795 低於月／季／半年線、**僅年線 1,482.84 未破**，且近期兩度單日重挫（2026-09-02 **-7.24%**、2026-09-10 盤中 **-5.85%**）。對照 3008 納入當日是連續第二根漲停、8046 與 3037 納入時 PB 都在三年區間頂部。**但「跌很多」不是便宜**：forward PE 仍 **35.17x**、P/FCF 約 **73x**（現金口徑比盈餘口徑 57.22x 更貴），相對最純同業 Vertiv（forward 33.55x／EV-EBITDA 37.87x）僅小幅折價，**而本檔營益率 16.70% 與 ROE 29.97% 都低於 VRT 的 19.96% 與 43.94%，且還揹著一個非 AI 本體 —— 折價幅度小於組合差異所應有的幅度**"}
  networking:     {count: 1, pct: 3.8,  note: "2345 — 2026-09-10 新增。資料中心網通硬體（白牌交換器 ODM）。⚠⚠ **本清單第一檔賣「交換器」而非「連到交換器的東西」的標的，而它補上的是 driver 層的第三個層次。** 既有的三個 driver 記的是：**capex 承諾（hyperscaler-capex）與加速器出貨（ai-accelerator-demand）**；**2345 的交換器出貨補上第三層 —— 資料中心真的通電了的證據，不是承諾。** 這正對應 hyperscaler-capex 的 `deployment_friction` 記的「承諾與落地之間的摩擦」。 ⚠ **另記它在本清單的傳導時滯是最短的**（落後 1–2 季）——交換器與伺服器同批部署，不像基板（AXTI 領先 2–4 季）或載板（3037／8046）那樣隔著數個環節。 ⚠⚠ **但它是 ODM，毛利率僅 19.7%（2026 Q2，連三季成長、五季新高）** —— **營收每多一塊錢只有兩毛留在公司。這一格與 `optical`、`connector` 的獲利結構完全不同，比較倍數時絕不可跨格套用。**"}
  connector:      {count: 1, pct: 3.8,  note: "3533 — 2026-09-10 新增。連接器與插槽（伺服器 CPU socket、高速 I/O、線束）。⚠ **本清單第一檔連接器標的，且它與既有的 `substrate`（ABF 載板）、`compound_semi`（化合物半導體基板）一樣，是供應鏈上一個此前完全沒有覆蓋的層。** ⚠⚠ **值得單獨記的是它的毛利率位置**：3533 2026 Q2 毛利率 **45.47%**（Q1 49.55%、FY2025 約 51%），**而連接器同業一般在 25–35% —— 它在族群頂端，而頂端正是「是結構水準還是循環高點」這個問題該被問的地方。** ⚠ 同業樣本尚未逐家取得（貿聯 3665、信邦 3023、Amphenol APH、TE Connectivity TEL、立訊 002475），目前只有 Yahoo 所載「同業平均本益比 47.44」這個不知成分、不知加權的彙總值"}
  server_platform: {count: 1, pct: 3.8, note: "3533 — 2026-09-10 新增。⚠⚠ **本清單第一個「一般用途伺服器 CPU 平台世代切換」的曝險，而它與 ai_capex_hw 是兩回事，這正是設立這一格的理由。** 動能來自 **Intel Oak Stream 與 AMD Venice**（管理層估 2026 Q4 或 2027 初放量），出資者是伺服器 OEM 與企業／CSP 的一般伺服器汰換，**不是 AI 加速器的建置預算**。⚠⚠ **而現有三個 driver 沒有任何一個記這件事** —— 這已是同一個結構問題的**第三個實例**（CEG：沒有 driver 記用電量；AAOI：沒有 driver 記 DOCSIS 升級循環；本檔：沒有 driver 記 CPU 平台世代）。**三次就是模式不是巧合：三個現有 driver 全部只記「AI 資本支出的流量」，而清單正在納入越來越多不由那個流量驅動的標的。** 建議新增 `server-platform-cycle`，與先前建議的 `datacenter-power-demand`（CEG）、`broadband-access-capex`（AAOI）一併排程"}
  catv:           {count: 1, pct: 3.8,  note: "AAOI — 2026-09-10 新增。有線電視寬頻接取（CATV／DOCSIS）。⚠⚠ **本清單第一個與 AI 無關的終端需求，而且它不是一個小角落：AAOI 2026 年 Q2 的 CATV 分部營收 8,060 萬美元，佔該檔總營收 42.0%（年增 44%）。** ⚠⚠ **而現有三個 driver（hyperscaler-capex／ai-accelerator-demand／accelerator-roadmap）沒有任何一個記它** —— 它的出資者是有線電視業者（Charter／Comcast 等），循環是 DOCSIS 4.0 升級週期，時程與超大型 CSP 資本支出無關。⚠ **這與 CEG 建檔時的結構問題同型**（那次是「沒有一個 driver 記用電量」，處置是建議新增 `datacenter-power-demand`）。**正確做法同樣是新增 `broadband-access-capex` driver，而不是硬掛在超大型 CSP 資本支出上。在補上之前，AAOI 的 42% 在 driver 層是失明的。** ⚠ **且升級循環是有終點的** —— AAOI 那 42% 的營收正靠著它的上升段，故已在該檔設為第四條 falsifier（CATV 單季營收年減超過 20%）。⚠ 同業觀測點：Harmonic（NASDAQ:HLIT），CATV／DOCSIS 純業，2026-09-09 P/S 2.91x、營收 TTM +11.2% —— **它同時是 AAOI 分部估值的錨，也是這個循環的獨立觀測點**"}
  epitaxy:        {count: 1, pct: 3.8,  note: "3081 — 2026-09-10 新增。化合物半導體磊晶片（InP／GaAs 雷射與檢光器磊晶）。⚠⚠ **與 `compound_semi`（AXTI 的 InP／GaAs／Ge 單晶基板）刻意分開：兩者是買賣關係不是同一門生意。****AXTI 長單晶、切成基板；3081 買基板、在上面長磊晶層做成雷射與檢光器磊晶片。毛利率結構與資本投入位置都不同（3081 Q2 2026 毛利率 57%、營業利益率 47%）。** ⚠ **同名易混的三個「基板／晶圓」層在本清單現在各有一格**：`substrate`（3037／8046 的 ABF 載板）、`compound_semi`（AXTI 的化合物半導體單晶基板）、`epitaxy`（3081 的磊晶片）。**中文都可以叫「基板」或「晶圓」，但客戶、循環、物理全都不同。** ⚠⚠ **本格帶進本清單至今最極端的資本密集度**：3081 的 capex／營收 約 **217.8%**（近三季 CAPEX 近 60 億元 ÷ 近三季營收約 27.55 億元），**是 15% 門檻的 14.5 倍**，**而同期折舊僅占營收 6.14% —— 相差 35 倍，正在蓋的資產尚未投入服務。** ⚠ 同業樣本：**IQE plc（LSE）與全新光電 2455**，兩家倍數本輪皆未取得。**且 IQE 已是 AXTI 列的同業之一 —— 它現在同時錨住兩檔覆蓋標的，屬「共用錨」，與 COHR／AAOI 共用 Fabrinet 同科。**"}
  compound_semi:  {count: 1, pct: 3.8,  note: "AXTI — 2026-09-10 新增。化合物半導體晶圓基板（InP／GaAs／Ge 單晶）。⚠⚠ **與 `substrate`（3037／8046 的 ABF 載板）刻意分開，理由見該格。** ⚠ 本格與 `optical` 的差別值得記：optical 記的是「賣給誰」（光通訊終端），compound_semi 記的是「做什麼」（單晶生長與晶圓加工）。**AXTI 的 GaAs 與 Ge 產品線服務工業機器人與太空太陽能，不在 AI 鏈上** —— 那部分目前佔比小（Q2 為 6.87 ÷ 47.6 = 14.4%），但它是本檔唯一非 AI 的營收來源"}
  china_ops:      {count: 1, pct: 3.8,  note: "AXTI — 2026-09-10 新增。⚠⚠ **本清單第一檔以中國為主要生產地的標的，而這是一個全新的失效路徑，不是既有風險的變體。** 全部產能在北京同美（Tongmei）；**Q3 2026 營收指引明文限定於「已取得出口許可或不需許可」的部分 —— 中國的鎵／鍺／銦出口許可是營收的閘門，不是背景風險**；同美科創板 IPO 已於 2026-06-26 撤回轉赴香港，觸發人民幣 3.244 億元（約 4,900 萬美元）的贖回權。⚠ **不要把它與 tw_market 或 TSM 的地緣曝險混為一談** —— 台灣是「客戶與產能所在地的地緣風險」，中國是「出口管制與子公司治理的直接營運閘門」，**兩者的傳導機制與可觀測訊號完全不同**"}
  tw_market:      {count: 12, pct: 46.2, note: "⚠⚠ **2026-09-10 納入 3081 後自 44.0% 升至 46.2%。本日一天之內自 36.4% 升到 46.2%（8 檔 → 12 檔），逼近半數。** ⚠⚠ **而 3081 與 3017 這兩檔同日建立的台股，一起把「月營收年增率」這個工具的限制講清楚了**：**3017 的年增率單調減速（111.72% → 54.34%），而那幾乎全是基期造成的（其 2025 年營收在下半年才起飛）；3081 的年增率單調加速（89.35% → 180.90%），而它完全沒有基期助力（2025 年 3–8 月每月都在 1.81–1.85 億元之間，幾乎是平的）。** **同一個指標在兩檔的可讀性完全不同，差別在去年的形狀。** **結論：看月營收年增率之前要先看去年那一條線平不平；不平的時候只能用環比或絕對金額。** **這是本日從兩檔身上一起學到的，也是這一格 46.2% 真正的內容 ——高頻資料的價值在於它高頻，不在於它容易解讀。**原註：⚠⚠ **2026-09-10 納入 3017 後自 41.7% 升至 44.0%。本日一天之內自 36.4% 升到 44.0%（8 檔 → 11 檔）。** ⚠ **本日新增的三檔台股（3533、2345、3017）全部把第一條 falsifier 設在月營收上，皆可於 2026-10-10 前後驗證** —— **驗證頻率的優勢在本日被實際用了三次，不再只是一句註記。** ⚠⚠ **但 3017 那一檔同時暴露了這個優勢的一個陷阱**：**月營收年增率會被基期效應主導 —— 3017 的 2025 年營收在下半年才起飛（該年 1–8 月月均約 96.7 億元、9–12 月月均約 155.6 億元，高出約 61%），所以 2026 下半年的年增率會機械性大幅下降。** **用年增率設 falsifier 門檻會測到基期而不是需求；3017 因此改用絕對金額。** **高頻資料的價值在於它高頻，不在於它容易解讀。**原註：⚠⚠ **2026-09-10 納入 3533 與 2345 後自 36.4% 升至 41.7% —— 首度突破四成。** ⚠ **而這一格有一個在百分比裡看不見的性質，值得單獨記：驗證頻率。****台股月營收每月 10 日前公告，因此這 10 檔的 falsifier 可以設在「一個月內可驗證」；美股標的最快都要等季報。** 本日建立的 3533 與 2345 的第一條 falsifier 都是月營收門檻，**約 2026-10-10 即可驗證。** **這是等權因子分布數不出來的一種優勢，記在這裡以免只看到 41.7% 的集中度。**原註：⚠ **2026-09-10 納入 2308 後自 38.9% 升至 42.1%，逼近歷來最高的 43.8%（8 檔中的 8 檔為台股，已逾五分之二）。** ⚠ **本次新增使兩個集中度同時上升（ai_capex_hw 與 tw_market），沒有一個被稀釋** —— 這在本清單是第二次（第一次是 COHR）。原註：⚠ 2026-09-08 兩度稀釋：納入 CEG 後 43.8% → 41.2%，再納入 AVGO 後 → 38.9%。原註：3324 + 6442 + 3008 + 3037 + 8046 + 6239 + 3030，含匯率與地緣風險。⚠ 台股占比自 40.0% 再升至 **43.8%**（歷來最高，已近五分之二強）。⚠ 但此前的「技術面系統性缺口」已於 2026-08-31 解除 —— wantgoo 路徑打通後五檔台股的均線、MACD、KD 與量能均可取得，僅 RSI 仍缺，且三檔的技術面資料都受同一個系統性缺口影響（報價頁 JS 動態渲染）"}
  non_ai:         {count: 0, pct: 0.0,  note: "⚠⚠ **2026-09-10 納入 AAOI 後仍記為 0，但這一次「仍記為 0」揭露的是方法本身的限制，不只是一個判斷。** AAOI 的 thesis 是 AI 驅動的（資料中心佔營收 56%），故不標 `non_ai`；**但它有 42% 的營收是 CATV（有線電視寬頻接取），掛在有線電視業者的 DOCSIS 升級循環上，與 AI 完全無關。** ⚠⚠ **`factor_tags` 是標的層級的二元標籤，表達不了「這檔有 42% 的營收不在 AI 上」；等權因子分布數的是標的數，不是營收。** **結果是：清單的實際非 AI 曝險大於 0，但這個模型看不見它。** ⚠ **這是本清單第一次這個限制變得重要**（CEG 那次是「最接近填上它」，但 CEG 的營收本身並沒有一大塊在 AI 之外的獨立循環上）。**處置：暫不改動標籤語意（那會讓歷史數列失去可比性），但在此明記模型的這個盲點，並在讀 optical 的 27.3% 時記得它高估了實際的 AI 光通訊曝險。**原註：⚠ **2026-09-08 重新檢視後仍記為 0，但 CEG 是本清單至今最接近填上它的一檔，理由要寫清楚。** CEG 的 TTM 營收 31.27B 絕大部分來自傳統電力批發與零售供應，**與 3008 不同的是：3008 是營收非 AI 但盈餘動能來自 CPO，CEG 則是連盈餘主體都來自傳統電力**。⚠ **但驅動它倍數的仍是資料中心用電的敘事** —— 對 VST 的 EV/EBITDA 溢價 54.7% 就是那個敘事的價格。**營收與盈餘非 AI、但估值溢價是 AI，所以它稀釋了因子集中度，卻沒有離開這個前提。** 記為 0 而非 1 是保守的選擇，已明寫理由以便日後檢驗。原註：⚠ 仍為 0，儘管 3008 的營收基礎是消費性光學。理由見下方 3008 專屬註記 —— 驅動它股價的是 CPO 不是手機鏡頭，所以它填不了這個洞"}

common_premise: "⚠ **2026-09-10 納入 2308 台達電後：19 檔中有 17 檔共用同一前提 —— AI 資料中心資本支出在未來 8 個季度不會出現實質減速。例外仍是 INTU 與 CEG 兩檔，2308 不構成第三個例外（它曝險於 capex 流量，不免疫）。** ⚠ **但 2308 帶進一個前提內部的新結構，值得與 AVGO 那次並列**：AVGO 那次改變的是**方向一致性**（清單第一次出現同一則消息對兩檔方向相反）；**2308 這次改變的是「什麼東西在驅動它」** —— 其餘 12 檔 ai_capex_hw 受惠於**機櫃出貨台數**，**2308 有一半受惠於單櫃功率密度**（54V → ±400V → 800VDC 由功耗驅動）。**即使 AI 伺服器出貨量成長減速，只要單櫃功耗續升，這條鏈仍有量。** 這使它在共同前提失效時的**受傷順序**與其餘標的不同 —— 不是免疫，是**時序與幅度都不同**。⚠ **不可據此把它讀成避風港**：功率密度續升的前提本身也建立在新機櫃持續出貨上，只是脫鉤的那一半讓它的衰退較淺。原註：⚠ **2026-09-08 納入 AVGO 後再改寫：18 檔中有 16 檔共用同一前提 —— AI 資料中心資本支出在未來 8 個季度不會出現實質減速。 ⚠⚠ **2026-09-08 納入 AVGO 後必須補上一句，因為它改變的不是這個前提的覆蓋率，而是它的內部結構：清單第一次出現「同一則消息對兩檔覆蓋標的方向相反」。** AVGO 的 AI 營收**就是**超大規模業者自研加速器的採購金額（FY2026 Q3 為 16.7B、Q4 指引 21.7B，年增 221%）；**若某家 CSP 自研轉外購（改買 NVDA），對 AVGO 是營收減項而對 NVDA 是利多。** 此前 ai_capex_hw 內的十一檔雖深淺不一但方向一致，**故「66.7% 同因子」此後不可再讀成「66.7% 同向曝險」——共同前提仍然成立，但它失效時清單內部的反應第一次不是齊漲齊跌。**這是本覆蓋清單的單一失效點，個股層分析再深也看不見它。** ⚠ **例外現在有兩檔，而兩檔的性質不同，這個區分比數量重要**：(1) **INTU —— 完全不在這條鏈上**（AI 應用端／SaaS）；(2) **CEG —— 在鏈上，但曝險於「存量」而非「流量」**。其餘 15 檔曝險的是 AI 資料中心的**資本支出**（流量）；CEG 曝險的是資料中心的**用電量**，那是資本支出落成之後的**存量** —— **一座已建成的資料中心即使 capex 歸零仍然耗電。** ⚠ **CEG 不免疫**：新的 PPA 仍要等新的資料中心蓋起來，且驅動它估值溢價（對 VST 的 EV/EBITDA 溢價 54.7%）的正是資料中心敘事。**但既有合約的現金流不隨 capex 減速而消失 —— 這是清單上其餘十五檔都沒有的性質，也是 INTU 之後第一個實質的分散。** ⚠ **3030 是第三種性質，但不構成例外**：它在鏈上、曝險於流量，只是**間接**（賣設備給 EMS／PCB／封測廠，受惠於客戶的資本支出決策而非客戶的出貨量），時序與其餘標的錯開，不可套用同一個傳導強度。⚠ 唯一被記錄到的例外需求是主權 AI（見 drivers/ai-accelerator-demand 的 cross_check）—— 其資金來源為主權基金而非企業現金流，對本前提免疫，但覆蓋清單中沒有任何一檔直接曝險於它。"


# ⚠ 6239 力成：**清單中第一檔「受惠於量而非價」的標的，也是唯一未處於延伸狀態的台股。**
