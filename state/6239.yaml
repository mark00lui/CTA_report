- date: 2026-09-01
  level: L1
  summary: FOPLP 產業報導（工商時報，未提本檔）循線查出兩項新事實 —— 面板規格 510×515 小於日月光 600×600 且產業預期後者成主流，但量產時程領先日月光約一年。改變 1 個 key_variable 的內容與信心方向。⚠ 目標價 240 未變、機率未變
  delta: >
    ⚠ **定級的過程本身是本次最值得記的事，寫在最前面。**
    我原本定 L2，理由是「新增 key_variable」這條門檻 —— 我打算把 FOPLP 的競爭格局
    另開一格。但 `validate_state.py` 擋下了：key_variables 上限 6（硬性 ERROR），
    理由寫的是「超過代表沒分清主次」。
    於是必須回答一個問題：既有六格中，有哪一格比「FOPLP 競爭格局」更該讓位？
    逐格檢視 —— 自由現金流與資本支出強度是 thesis 爭點；毛利率與月營收是 falsifier 標的；
    市場共識是 base 情境的 EPS 輸入；FOPLP 與 TSV 進度是 thesis 核心路徑。**一格都沒有。**
    **那個上限的判斷是對的**：這些新事實是 FOPLP 這條路徑的**細化**，不是模型的新軸。
    併回既有變數後，本次符合的是 L1（改變 1 個 key_variable；機率變動 0pp；目標價變動 0%）。
    ⚠ **這不是被工具限制降級，是被工具問出了正確答案。**
    若我一開始就新開一格，會得到一個 TP 未變、機率未變、位階未變的 L2 ——
    那種 L2 會稀釋 git log 裡等級的分辨力。
    目標價 240、三情境機率、EPS、倍數**全部未變**。
    ⚠ **觸發事件從頭到尾沒有提到本檔** —— 工商時報〈化圓為方 聯發科FOPLP量產關鍵〉是一篇
    以聯發科視角寫的產業文。它的價值在於提供**座標系**：面板格式的兩種規格、量產所需的
    時間常數、生態分工。座標系讓原本孤立的公司說法變得**可定位** ——
    「力成目標 2027 年中量產」單獨看無從判斷難易；放進「聯發科花了 3 年、日月光落後一年」
    的座標裡，它才有可檢驗的形狀。
    **併入 `FOPLP與DDR5_TSV進度與競爭格局`（原名 `FOPLP與DDR5_TSV進度`）的，
    是一組方向相反、量級相當的事實**：
    (＋) 時程領先約一年 —— 力成 2025-05 已小量出貨且有重量級客戶驗證（產品為 2nm SoC
         搭配 12 顆 HBM、整體封裝造價 25,000 美元／顆），同期日月光才要年底試產、2026 送樣。
         這是「全球第一家專業封測廠」第一次拿到非公司來源的支撐。
    (−)  面板規格落後 —— 510×515 只有日月光 600×600 的 **73%** 面積，而產業預期 600×600
         成主流。FOPLP 的整個經濟理由就是以更大方形面積攤薄成本（600×600 有效產能達
         300mm 晶圓數倍、降本最高約一成）。
    **兩邊量級相當，我沒有理由把機率往任一邊推 —— 機率是使用者的判斷，本次未動。**
    另一個變數的**數值不變但讀法改變**：該格的信心方向上升
    （2027 年中落在三個獨立時間常數之內，第四條 falsifier 的可達性上升）；
    `資本支出強度` 多一層 —— 若主流收斂到 600×600，400 億元的一部分可能是**競爭必要支出**
    而非可選擴張，該筆錢的性質從「成長投資」變成「可能含有防禦成分」，而防禦性支出的
    報酬率低於成長性支出。
    ⚠ **一個必須擋下的誤用**：事件文的「功耗自 100W 提升至 1,000W 等級」是**單封裝**口徑，
    而 drivers/accelerator-roadmap.yaml 已記 B300 單顆最高 1,400W。1,000W **低於**已在檔內的
    數字，是較粗的產業泛稱，對 3324 不構成新資訊。口徑不同的功耗數字並列時，
    先確認是同一個東西再更新模型。
    CTA：price 自 8/31 收盤 277 更新為 **9/1 收盤 284.00（+7.00、+2.53%）**，
    成交 1,491.3 萬股。⚠ **均線與 MACD／KD／均量仍為 8/31 口徑，price 與指標不同口徑。**
    284 高於昨日 MA5 280.10，但 MA60 季線 297.44 仍在上方（-4.5%）。
    ⚠ **量能是本日最該注意的一項**：0.91 倍，比 8/31 的 0.93 倍**更低** ——
    **上漲日的量能低於下跌日，這不是右側確認該有的形態。** 未構成位階改變。
    加權目標價 240 相對新現價 284 為 **-15.5%**（前為 -13.2%）——
    **這 2.3pp 全部來自價格移動，模型一個數字都沒動。**
    訊號維持中性／低。不給偏多的理由本日被**強化**（量縮上漲）；不給偏空的理由多一條
    （本次降低第四條 falsifier 的觸發機率）。信心維持低，並新增第七個理由：
    FOPLP 這條腿的競爭座標指向兩個相反方向，而公司未表態面板規格路線。
    四條 falsifier 門檻與日期全部不變（改了就失去約束力），但第四條補記一個例外情境：
    **若為跟進 600×600 而主動延後時程，該條會觸發但未必是壞消息** ——
    falsifier 的門檻會被公司自己的新決策作廢，屆時要看延後的理由。
    driver 層：`accelerator-roadmap` 新增 `foplp_layer_note`（此前該 driver 完全無 FOPLP 內容）。
    ⚠ 這裡有一個分層的判斷：面板尺寸、產能倍數、降本幅度、時間常數這些**產業級**數字
    住在 driver；「力成自己是 510×515、P11 月產 6,000 片」這種**個股級**事實住在 state。
    扇出 6239 L1、8046／3037 L0、TSM L0、3324 L0。
    ⚠ 對 8046／3037 記下一個**方向可能相反**的疑問：扇出型封裝以 RDL 取代部分傳統載板功能，
    機制上存在侵蝕 ABF 用量的可能。但本次無證據支持 —— 事件文把載板與矽橋並列為所需技術，
    且力成 P12 三樓明載「AI 晶片與 **ABF 載板**結合」，力成自己的 AI 產線是**用**載板而非取代它。
    **列為未證實的疑問，不是結論。**
    ⚠ 順帶更正 notes 中兩處計數：「五檔台股」應為「六檔」。
    ⚠ **本次最該記住的方法論**：若只讀那則報導就收工，這會是 L0。
    實質內容全部來自「拿它的座標去回查本檔」。
    **產業報導的價值不在它說了什麼，在它讓你能問出什麼。**
- date: 2026-09-01
  level: L2
  summary: 手動全量重估（建檔同日）。首次建立三情境與加權目標價 240，相對現價 277 為 -13.2%；訊號中性／信心低
  delta: >
    機率由使用者指定 0.25/0.50/0.25。三情境：bear 8.5 × 17x = 144；base 10.9 × 20x = 218；
    bull 12.7 × 30x = 381。
    ⚠ **本檔是六檔台股中第一檔 PE 可直接當錨的** —— 三年 trailing 區間 6.34–45.12（跨 7 倍），
    而 8046 跨 93 倍、3037 因分母趨零失效、3008 需靠新聞來源。本檔獲利未在谷底歸零。
    ⚠ 但 2026 出現明顯 regime shift：全年區間下緣 24.97 高於 2023–2025 任何一年的上緣
    （2025 的 24.61 僅差 0.36）。判斷它才是本次的工作。
    兩步判斷 —— 定位：三年平均 trailing 16.5x 換算 forward 等值 14.8x，現況 forward 25.41x
    溢價 72%。判斷【部分合理】：支持的證據具體（DDR5 TSV **已完成試產、2026 Q4 量產**是進度
    不是計畫；FOPLP 目標 2027 年中前全球首家；H1 淨利 +91% 為營收成長的近三倍），
    反對的同樣具體（capex／營收約 42% 為覆蓋清單最高而自由現金流完全未知；OSAT 是服務業
    定價權有限）。取 20x，高於歷史換算的 14.8x、低於現況 25.41x。
    ⚠ **兩個錨互相驗證**：三情境的隱含 PB 為 1.81／2.66／4.54，全部落在三年區間 1.43–4.80 內
    且順序與 PE 一致。對照 8046 —— 該檔的 PE 與 PB 在 base 上互相矛盾（PB 6.0x 換算成 PE
    僅 24.7x、隱含 PEG 0.37），且 ROE 更低卻有更高的 PB。
    **同一套方法一檔得出互相驗證、一檔得出互相矛盾，那個差異本身就是資訊。**
    ⚠ EPS 來源要分清：base 10.9 是唯一取得的賣方數字；bear 8.5 與 bull 12.7 **皆為推導值**，
    已列 gaps。另注意搜尋中的 FactSet「EPS 7.25–7.57」為 2025 年度，非 2026，不可混用。
    ⚠ 基準年維持 2026 —— 已進入下半年本應滾動，但 2027 共識未取得，且 Q3／Q4 仍有實質資訊。
    2026 共識 10.9 可能偏保守（H1 已 5.5，達成只需 H2 約持平，而公司指引逐季成長；
    若 Q3／Q4 為 3.4／3.8 則全年約 12.7，高 17%）—— 這是本倉庫第四次遇到台股共識落後。
    循環性檢查不觸發（base 218 對現價 -21.3%）。四條 falsifier 全數維持、未觸發、無 __ 需補。
    ⚠ **-13.2% 是六檔台股中最溫和的**（8046 -38.3%、3008 -31.5%、3037 -30.5%）。
    這不是因為我對本檔比較寬鬆，是它的估值位置本來就沒那麼延伸 —— PB 3.58x 位於三年區間
    的 64% 處，而 8046 在頂部、3037 接近頂部。
    訊號中性：不給偏多因估值上檔為負且技術面明確不支持（價格在季線 297.44 之下、
    MACD 的 DIF 與 MACD 雙雙低於零軸、量能 0.93 倍、距 52 週高 -28.4%，confirm_trigger
    的價格與量能兩項都不成立）；不給偏空因四條 falsifier 全未觸發、MACD 的 OSC 已翻正為
    打底早期訊號、且基本面全部向上。
    ⚠ **信心低最主要的理由只有一個但很大**：自由現金流與營業現金流完全未取得，
    而 capex／營收約 42% 是覆蓋清單最高。依 valuation.md 超過 15% 門檻時現金流分析是強制的，
    而這正是 thesis 的爭點所在，卻連一個數字都沒有 ——
    **在補上它之前，本檔的 bear 情境是憑推論而非憑證據**。
