notes: >
  ⚠⚠⚠ **本檔是覆蓋清單成立以來估值最極端的一檔，而兩個比率要一起看才成立**：
  **市營比 **45.92**（TTM 營收僅約 17.52 億元，市值 804.58 億元），
  而本益比是「--」—— 未揭露，因為 TTM EPS 是負的（**-1.18 元**）。**
  **前一個紀錄保持者 AXTI 是市營比 35.25、本益比 1,141.03（正但趨零）；
  本檔的分母已經穿過零。**
  ｜⚠⚠⚠ **而本檔把「擴建型 Q3」這個此前只是懷疑的東西變成了結論。**
  **Q3 象限的兩個預設錨是「PB／重置成本」與「中週期正常化 EPS × 正常倍數」，
  而本檔兩個都不能用：股價淨值比 14.13；TTM -1.18、FY2025 +0.16、
  Q1 約 -1.10、Q2 -0.22 是一條沒有中週期的序列。**
  **這是 3081（股價淨值比 56.17）之後第二次兩個預設錨同時失效，而兩次都是擴建型。**
  ⚠⚠ **結構性的解釋現在寫得出來了，它不是巧合**：
  **一家正在建產能的公司，(a) 帳面資產已經灌入了尚未貢獻獲利的在建工程與新設備，
  使 PB 對「現有獲利能力」失去意義；(b) 同時它沒有正常盈餘可以正常化，
  因為新產能的損益還沒開始。**
  **這正是 valuation-map 對 PB 的警語「在建工程已進分母卻未貢獻獲利時被高估（6239 即是）」
  的一般化 —— 6239 是個案，擴建型 Q3 是這個個案的類別。**
  ⚠ **建議 references 把 Q3 拆成「循環型」與「擴建型」並各給處方，已是第三次提出；
  而本檔提供了第三個樣本與一個結構性的理由，不再只是三個個案的並列。**
  ｜⚠⚠ **本檔是本輪第一次為新標的加上 `cpo` 標籤，而那件事本身有訊息量。**
  **cpo 這一格在此之前連續六次下降（20.0 → 19.0 → 18.2 → 17.4 → 16.7 → 16.0 → 15.4%），
  分子始終是 4 —— 前五檔光互連相關新增（AXTI、AAOI、2345、3017、3081）全部拒標。**
  **本檔標上，分子第一次自 4 變 5。**
  ⚠ **標上的理由要寫死，否則下一輪會被當成寬鬆**：
  **本檔的 thesis 直接押在 CPO 上 —— ReLFACon™ 是把 FAU 封裝到 PIC／COUPE 的技術；
  1.6T OE 已切入可插拔與 CPO 交換器、2026 年直上 6.4T；
  已向超過 5 家潛在巨頭客戶交付多款 CPO 樣品；FAU 三年 70 億元的自估就是這件事的價格。**
  **前五檔拒標的共同理由是「不依賴 CPO 這個特定前提成立」；本檔正好相反 ——
  它的整個上檔都建立在那個前提上。**
  ｜⚠⚠⚠ **本檔與覆蓋清單內的 3008 大立光同時是「循環引用」與「零和競爭」——
  這是本清單第一次兩者同時發生在同一組標的上。**
  **3008 在本倉庫被記為「價值主體是尚未貢獻營收的 CPO 選擇權」，
  而那個選擇權的內容正是 FA／PMLA／**FAU** 光學元件端 —— 與本檔的主錨是同一個市場。**
  ⚠⚠ **依 3583 細化後的規則，3008 的市場觀測倍數可用、判斷值不可用。
  但本組還有一層更強的限制**：**兩檔的判斷值是以負號連動的 ——
  我若調高本檔的 FAU 選擇權價值，機械上就該調低 3008 的，反之亦然。**
  **此前記過的三組零和（3324／3017、AVGO／3661、2308／3211）沒有一組同時是循環引用。**
  **實務規則：重估任一檔的 FAU 選擇權時必須同時檢查另一檔，且兩份報告要互相指名 ——
  單獨調一邊會讓兩檔的合計份額超過一，而那不會報錯。**
  ｜⚠⚠ **本檔的月營收貢獻了一個新的形狀：月增率連續六個月為正，
  而年增率與累計年增率都不可讀。**
  **2025 年的基期全距達 103%（1.003 到 2.041 億元），是本輪最不規則的 ——
  2 月的年增 +27.67% 是因為去年 2 月最低，4 月的 -37.30% 是因為去年 4 月最高。
  兩個極端都是基期造成的。**
  **累計年增率 -10.56% 則混著上半年的崩與下半年的回升，同樣不可讀。**
  ⚠ **這是本輪第一次「月增率」成為唯一可用的序列 ——
  而它剛好也是最能看出連續性的那一個（3 月起 +9.10 → +12.39 → +9.49 → +8.51 → +19.69%，
  單月營收五個月 +74.3%）。**
  ｜⚠⚠ **本檔的比值 1.68 倍揭露了那條規則的一個弱點，而我應該先承認它**：
  **我把可用門檻定在「2–3 個日振幅」，但那個「2」是在一個沒有任何樣本的空區間裡畫的 ——
  此前的分布是 0.008／0.086／1.09／1.18／1.21｜（空白）｜2.03／2.55。**
  **本檔是第一個落進空白處的觀測值。它不推翻門檻，但它證明門檻是任意的。**
  ⚠ **而它也是三個條件第一次出現分歧**：**距離 13.00% 過關、價格在均線正確一側過關、
  比值 1.68 不過關。前兩個過關樣本（6187 2.03、6531 2.55）是三個條件同時成立。**
  **處置：填入 invalidation 並明記其為邊緣案例，等更多樣本落進 1.21–2.03 再校準門檻。**
  ｜⚠⚠ **並記下今日第四次二手來源的問題，而這一次的性質與前三次不同。**
  **本輪查到一則「大立光切入 CPO FAU」的說法，唯一來源是社群平台貼文 ——
  不是公司揭露、也不是財經媒體報導。**
  **前三次（3221 代號、6187 的 +9.82%、6531 的英文名）是**來源寫錯**；
  這一次是**來源等級不夠**。**
  **前者靠交叉比對可以抓到，後者只能靠看來源是誰 —— 兩種防線不一樣。**
  **處置：完全不採用，第四條 falsifier 改錨在本檔自己的 capex 計畫上，並列 gaps 待查證。**
  ｜⚠ **另記兩件事**：**(a) 本檔是上櫃（OTC），本輪第一檔非上市的台股標的；**
  **(b) 當日開高走低（開 730、高 756、收 708，收在接近最低 701），
  雖然仍在季線之上 14.95%，右側的品質不佳。**

event_log:
- date: 2026-09-11
  level: L2
  summary: 手動全量重估（建檔次日）— 同業倍數取得使方法自「連方法都還沒有」變成可執行；首次建立三情境，加權目標價 543 元（相對 2026-09-10 收盤 714 為 -23.9%）
  delta: >
    ⚠ **建檔次日重估的理由**：**建檔時我說本檔「連方法都還沒有，在 Q3 財報之前做的意義不大」——
    那句話只有一半是對的。「連方法都還沒有」的原因之一是三家同業倍數沒取得，
    而那一項用公開資料就能關掉，關掉之後就有方法了。**
    ⚠⚠ **應回填 references：「沒有方法」與「方法的輸入沒查」要分開寫，
    否則會把可做的事推遲到不必要的時點。**
    ｜⚠⚠⚠ **本檔的核心事實用一句話就能講完：市營比 46.31 配毛利率 0.23% ——
    本輪最極端的一對。**
    **市場給的倍數是同業最高者（波若威 3163 的 27.02）的 1.71 倍、中位數（20.48）的 2.26 倍，
    而本檔的毛利率幾乎是零。亦即那 46.31 倍完全是在為 FAU 的未來毛利率付錢，
    而 FAU 的毛利率我沒有任何數字（結構性地要等 2026-11 的 Q3 報告）。**
    ｜⚠⚠⚠ **第二個乾淨的框架，而它不需要 FAU 的任何數字**：
    **股價淨值比 14.19 落在同業區間 10.73–17.75 的中段，而市營比 46.31 遠在 7.40–27.02 之外。**
    **兩者同時成立的意思要算資產週轉率（營收 ÷ 淨值）才看得見：
    本檔 0.31 倍（四家最低）／前鼎 4908 的 0.52／波若威 3163 的 0.66／聯鈞 3450 的 1.83。**
    **→ 市場已經按同業的淨值倍數給它定價，但它的資產還沒開始產生同業水準的營收。**
    **這就是 thesis 的量化版本，也是三情境的軸（營收假設直接對應週轉率 0.35／0.49／0.70）。**
    ｜⚠⚠⚠ **必須明寫一個降級：三情境是用 check（同業序位）驅動的，不是用 primary。**
    **primary（選擇權拆分）與 secondary（重置成本對照）本次都不可執行 ——
    FAU 的 70 億元自估沒有分年拆分與毛利率；6.48 倍的機台投資對營收比要拿去問同業，
    而三家同業的 capex 與產能未取得。**
    **檢查器的設計目的是驗證主錨算出來的數字，不是自己產生那個數字。
    用它當驅動意味著三情境沒有經過交叉驗證 —— 我只有一把尺，而那把尺原本是拿來量另一把尺的。**
    **處置：三情境照建，conviction 維持低，並在 Q3 財報後用 primary 重跑看兩者差多少。**
    ⚠⚠ **對照 6805：那一檔的主錨也不可執行，但處置是把主錨移入 excluded 並換上一個
    新的主錨（而那個新主錨不是原來的檢查器）。本檔沒有可換的新主錨，故只能降級使用檢查器。
    兩種處置的差別應回填 references。**
    ｜**三情境（基準年 FY2027，exit_multiple 記的是市營比）**：
    **bear 0.25：FAU 出不來 → 營收 20.0 億（週轉率 0.35）、市營比 12 倍
    （落在聯鈞 7.40 與中位數 20.48 之間）→ 211（-70.4%）。**
    **base 0.50：FAU 如期投產 → 營收 28.0 億（週轉率 0.49，接近前鼎）、
    市營比 20.48 倍（＝同業中位數）→ 505（-29.3%）。**
    **bull 0.25：70 億元自估兌現 → 營收 40.0 億（週轉率 0.70，超過波若威）、
    市營比 27.02 倍（＝同業最高）→ 951（+33.2%）。**
    **加權 ＝ 52.75 ＋ 252.5 ＋ 237.75 ＝ 543（-23.9%）。機械加權，無人工調整。**
    ⚠⚠⚠ **而 base 那一格值得單獨記：我一開始把它設成同業最高的 27.02，
    那會使 base 只比現價隱含的 28.98 倍低 6.8%、加權只有 -3.8%（落在 ±5% 內）。
    是「用中位數不用平均」這條規則把它擋回來的 ——
    規則的價值應該被記成「它擋下了什麼」，不只是「它說了什麼」。**
    ⚠⚠⚠ **但 base 真正的脆弱處不在倍數而在營收**：**若 FY2027 營收是 bull 的 40 億元
    而倍數仍取中位數，目標價 721（+1.0%）—— 翻正。亦即方向取決於
    「FAU 的營收何時出來」這個我沒有數字的變數。這與 AXTI 同型，也是評級維持中性的直接理由。**
    ｜⚠⚠ **營業虧損 21.43% 而稅前只虧 6.52% —— 業外淨收益約 +2.61 億元
    （相當於營收 17.52 億元的 14.9%）。亦即本檔目前損益表裡最大的單一正向項目不是本業。**
    **第二條 falsifier（單季是否仍為稅後淨損）的判讀直接取決於它，
    驗收時必須同時看營業損益。那 2.61 億元的組成未取得，已列 gaps。**
    ｜✓ **除權息前置檢查（本輪第三次執行）—— 本檔乾淨**：
    **2025 年現金股利 0.00 元、未查到配股 → 六條均線全部無污染。** 這在本輪是少數。
    ⚠⚠⚠ **而這反過來弱化了 3081 那一檔的一個推論**：
    **3081 那一輪我把「強勢上升趨勢中 MA60 低於 MA120」當成「均線序列未做除權回溯調整」
    的徵兆之一。本檔的 MA60 614.52 < MA120 701.39 是同一個形態，而本檔完全不配息。**
    **→ 那個形態是一個旗標，不是一個證明，它可以純粹由價格路徑造成。
    3081 的結論仍站得住（它站在形態 ＋ 一個有日期的除權息 ＋ 斷點位置三者上），
    但單獨使用這個形態會過度推論。本檔是反例。**
    ｜**失效價位維持 614.52（MA60，距錨定價 13.93%、比值 2.60 倍）。**
    ⚠⚠ **並記本檔特有的形態：MA120（701.39）比採用的 MA60 更接近現價（1.77% 對 13.93%），
    但因太近（比值 0.33 倍）而不合格 —— 「取最接近的合格者」在本檔跳過了一條更近的均線。
    這是該規則第一次在「乾淨的序列」上發生（3081 那一次是在疑似被污染的序列上）。**
    ⚠⚠⚠ **建檔時的比值爭議也解決了**：**建檔時以季線 615.92、現價 708、日振幅 7.74%
    計得 1.68 倍（邊緣未達門檻）；本次以 MA60 614.52、現價 714、日振幅 5.37% 計得 2.60 倍。
    兩個數字差 55% 而兩日之間的基本面毫無變化 ——
    這正是「單日振幅當分母不可用」最直接的一個實例（與 6531 的 2.55→1.70 同型）。**
    ｜**位階自「右側確認」改為「右側確認但短線轉弱」** ——
    **價格在 MA20／MA60／MA120／MA240 之上，但已跌破 MA5（718.20）與 MA10（737.90），
    且 KD 轉弱（K 33.99 在 D 50.64 之下）。**
    ⚠ **且 MA120 只低於現價 1.77%，價格幾乎貼在半年線上 —— 結構性的脆弱點。**
    ｜**新增第五條 falsifier（2027 Q1 之前合併毛利率任一季未達 10%）**——
    **它測的是三情境裡最大的那個假設（毛利率自 0.23% 改善到 20%）的中途里程碑。**
    ⚠⚠ **本檔特有的理由：市營比這把尺完全忽略毛利率，
    而毛利率是這把尺唯一看不見、卻決定一切的那一格。**
    ⚠ **並複查既有四條**：**第二條的判讀取決於業外（見上）；
    第三條（全年營收 19 億元）的結果會很接近門檻（TTM 17.52 億、8 月 2.045 億）；
    第四條（capex 未於 2027 Q2 前投入完成）確認為 bear 的直接觸發條件。**
    ｜⚠ **一個來源解析問題必須記下來**：**Yahoo 同一頁把「股價」寫成 68,133.00（應為 714）、
    把「股價淨值比」寫成 1.35（那是 Beta 的值），而同頁其他欄位
    （每股淨值 50.31、股本、股數 113,640,567、市值、毛利率、營益率、ROE、ROA）
    都通過內部一致性檢查。**
    **→ 處置不是棄用整頁，是逐欄做一致性檢查。這是本輪第一次遇到這種形態。**
    ｜**評級維持中性／信心低。**
    ⚠ **對照本輪四檔數字接近而處置不同的標的**：
    **3081 的 -21.6% 對所有假設都穩健 → 偏空；AXTI 的 -24.3% 取決於一個未確認的口徑 → 中性；
