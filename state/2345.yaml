    ⚠⚠⚠ **而後半（毛利率結構能不能往上推）目前的答案是「沒有」——
    淨利率在營收放大 36% 的情況下沒有改善，反而微降 0.32 個百分點。**
    **對一家 ODM 而言，營收放大卻沒有營運槓桿，通常代表組合沒變或價格讓利吃掉了規模效益。**
