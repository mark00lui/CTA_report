- date: 2026-09-11
  level: L2
  summary: 手動全量重估（建檔後首次）— 執行兩項由其他標的指定的動作（3081 要求的 capex 口徑重查：通過；6805 要求的層級軸改正：結論不變理由要換），並首次建立三情境，加權目標價 86.5 美元（相對 2026-09-10 收盤 103.29 為 -16.3%）
  delta: >
    ⚠⚠⚠ **先執行兩項由其他標的指定的動作。**
    **(1) 3081 要求的 capex 口徑重查 —— 本檔通過。**
    **3081 查出它的「近三季 capex 近 60 億元」是公告額而非已支出額，並指定本檔重查。**
    **本檔的 768.64 是現金流量表數，三個檢驗都過：現金流量表三者互洽
    （FCF ＝ OCF − capex → -131.82 − 768.64 ＝ -900.46，與所載完全一致）；
    資產負債表量級可能（768.64 ÷ 總資產 2,300 ＝ 33%，對照 3081 的 92% 不可能）；
    資金來源明確（股數年增 49.26% ＋ 淨現金 1.996 億美元）。**
    ⚠⚠ **而這件事本身值得記**：**「某一檔查出口徑錯誤，就假設同形態的另一檔也錯」
    與原來的錯誤是同一種偷懶 —— 兩次都是用現成的解釋取代查證。**
    **(2) 6805 要求的層級軸改正 —— 結論不變，理由要換。**
    **原寫「主錨在分部層、副錨在企業／股權層、檢查器在每股層」，三項裡有兩項不屬於層級軸
    （「分部」屬於分母軸；「每股」是股權層的一種表達）。**
    **真正撐住這個宣稱的是 primary 的 EV/Sales（企業層）對 secondary 的 P/B（股權層）——
    改正之後它反而更紮實。**
    ｜⚠⚠⚠ **主錨（分部別倍數）在本輪第一次真的算得出結果，而結論是負面的。**
    **6805 與 3081 的分部拆解都因同業倍數離散過大而做不出來；本檔做得出來，
    因為兩邊的分部同業都存在、倍數都與錨定價同日、且都用同一個口徑（trailing）。**
    **資料中心 TTM 營收 3.337 億 × 中際旭創 16.4 ＝ 54.73 億；CATV 2.503 億 × Harmonic 2.86
    ＝ 7.16 億；其他 0.36 億 → EV 62.24 億 ＋ 淨現金 1.996 億 ＝ 股權 64.24 億 ÷ 84.91M 股
    ＝ **每股 75.66 美元，比 2026-09-10 收盤 103.29 低 26.7%**。**
    **而那是上界 —— 它假設本檔的資料中心分部享有中際旭創整家公司的倍數，
    而後者淨利率 +31.3%、本檔整體 -9.57%。**
    ⚠⚠ **更直接的表達：本檔市營比 14.72 對「自身業務組合加權的同業倍數」10.45 —— 貴 40.9%。**
    ⚠ **並發現我建檔時違反了自己剛寫下的禁用**：**我禁用了「整體 EV/Sales 單一數字」，
    卻又在對照中際旭創時用了整體對整體（「15.38x 對 16.4x —— 幾乎相同」）。拆開之後是貴 40.9%。**
    ｜⚠⚠⚠ **並找到 3081 那條「口徑必須對稱」規則的第一個實際解法：用淨利率做橋。**
    **forward 市營比 ＝ forward PE × 預期淨利率 → 中際旭創 17.70 × 31.3% ＝ 5.54x。**
    **有了它，三情境才能在「本檔 FY2027 營收 × 同業 forward 市營比」這個對稱口徑上建立。**
    ⚠⚠ **而 trailing 16.4x 對 forward 5.54x 差 2.96 倍，那個落差本身就是「同業也在成長」的度量 ——
    兩個數字不矛盾，用錯地方才矛盾（第 2 節用 16.4 對，三情境用 5.54 也對）。**
    ｜⚠⚠ **依 6805 的通則移除 LITE 與 COHR**（兩者都在覆蓋清單內），
    **而建檔時 methods.primary 明文把它們列為資料中心側的錨。**
    **移除後資料中心側只剩中際旭創一家（Fabrinet 是代工、只作下界參照）——
    依 3081 的規則「同業序位需至少三個可用成員」，資料中心側不足，
    同業結論因此只能當方向不能當刻度。**
    ⚠ **這同時解決了 state/LITE.yaml 記的循環引用問題的另一半。**
    ｜✓✓✓ **首次在本輪取得淨現金（1.996 億美元，每股 2.35），而這揭露了一個流程問題**：
    **「淨負債未取得」在本輪出現 27 次，而本檔一次就拿到了 ——
    原因不是公司揭露不揭露，是我查的地方不對。美股在 stockanalysis 的 statistics 頁
    一欄就有；台股要去公開資訊觀測站抓合併資產負債表，而我一直沒去抓。**
    **這是流程問題不是取得性問題：台股流程應固定加一步「抓合併資產負債表」，
    與「抓月營收」同一個層級。**
    ｜**三情境（基準年 FY2027，一律用 forward 市營比而非本益比，因為當期盈餘為負）**：
    **bear 0.25：營收 15.0 億、組合 60/40、倍數 2.68（落在 Harmonic 2.86 與 Fabrinet 3.12 之間
    —— 亦即市場把本檔當成 CATV／代工廠估）、股數 105M → 38（-63.2%）。**
    **base 0.50：營收 21.3 億（一致預估 26.6 億的八折）、組合 70/30、倍數 4.03、股數 100M
    → 86（-16.7%）。⚠⚠⚠ 打八折的三個具名理由：FY2026 一致預估有公司 Q3 指引背書、
    FY2027 的 +156% 沒有任何公司說法背書（SKILL 明文賣方預估不得單獨支撐 L2 以上）、
    以及一致預估的 FY2027 EPS 4.60 隱含淨利率 15.6% 而本檔今天毛利率只有 28.92%。**
    **bull 0.25：營收 26.6 億（一致預估）、組合 75/25、倍數 4.87（不折價）、股數 95M
    → 136（+31.7%）。⚠ 外部檢查：分析師目標價均值 163.40（6 位）—— 我的 bull 低 17%，
    亦即我的最樂觀情境仍低於市場的中性預期。**
    **加權 ＝ 9.5 ＋ 43 ＋ 34 ＝ 86.5（-16.3%）。機械加權，無人工調整。**
    ⚠⚠ **4b 要分格做**：base 的 -16.7% 在 ±5% 之外（形式上不觸發），
    **但倍數那一格只比現價隱含的 4.12x 低 2.2% —— 倍數沒有獨立意見，營收才有。
    混在一起看會漏掉這件事。處置：conviction 維持低並把它寫進 signal.basis。**
    ｜⚠⚠⚠ **稀釋是本檔最大的單一變數，超過營收與倍數加總。**
    **三情境用的 FY2027 股數是 95–105M；若照歷史的年增 49.26% 繼續（兩年 ×2.22 → 188.5M），
    bear 20／base 46／bull 72，加權自 86.5 降到約 46（-55.4%）—— 落差 47%，
    大於營收假設（20%）與倍數折價（15%）加起來。**
    ⚠⚠ **而這驗證了建檔時 rank_metric ③（股數年增率 ÷ 營收年增率 ＝ 0.80）的選擇：
    當時那是一個判斷，本次它變成目標價裡最大的一個係數。**
    **第三條 falsifier（股數超過 9,765 萬）正好卡在本報告的假設與歷史速度之間 ——
    它是本檔最該盯的一條，而公司自己的 Q3 指引所用股數 9,280 萬距它只差 5.2%。**
    ｜**技術面：除權息前置檢查無命中（本檔不配息）**，
    ⚠ **但有功能相同的東西：股數年增 49.26% 同樣使「每股」的歷史序列不可直接比較 ——
    與 3081 的股票股利是同一類問題，只是來源不同（增資 vs 配股）。**
    **位階自「整理」改為「多空分界」**：**價格幾乎正好落在 200 日均線上（高 0.46%），
    且在 50 日均線之下 11.73%。失效價位維持留空（比值 0.11 倍，
    本輪「太近」那一端的第二極端，僅次於 8299 的 -0.02%）。**
    ⚠ **只取得兩條均線（50／200 日），本輪唯一 —— 因為美股資料源不提供其餘四條。已列 gaps。**
    ⚠ **52 週區間 18.50–233.67 ＝ 12.6 倍，本輪波動度最極端；Beta 3.78 全清單最高；
    空單佔在外股數 12.27%（記錄而不解讀，它既是下檔壓力也是上檔燃料）。**
    ｜**新增第五條 falsifier（2027 Q2 之前 GAAP 毛利率任一季均未達 32%）——
    ⚠⚠ 本輪第一條測「bull 的可行性」而非「bear 的觸發」的 falsifier。**
    **門檻推導：一致預估 EPS 4.60 隱含淨利率 15.6% → 需營業利益率約 19%；
    本檔營業費用率 40.2%，即使降到 15%，毛利率仍須達 34% → 32% 是必要非充分條件。**
    ⚠ **並記一個並列：本輪的第五條 falsifier 開始測「我自己的假設」而不只是「公司的營運」——
    6805 測象限漂移、3081 測資本結構、本檔測 bull 的可行性。**
    ｜**評級維持中性／信心低**，但「中性」的意思改變了 ——
    **建檔時是「尚無估值判斷」，現在是「有估值判斷但不確定性帶太寬」。**
    **不是偏空：base 的倍數幾乎沒有獨立意見，而營收假設的另一端給的是 +31.7%；
    且位階是多空分界不是破位。不是偏多：加權目標價低於現價，且價格在 50 日均線之下。**
    ｜⚠ **本次未做到**：**分部別毛利率（第二次未關閉，而它是主錨的明文前置條件）**；
    中際旭創 forward PE 的對應年度；Fabrinet 與 Harmonic 的 forward 倍數；
    六條均線中的四條；20 日平均振幅；FY2026 各季的實際營收拆分；
    **以及 CATV 那一半仍然沒有 driver 記它（`broadband-access-capex` 自建檔起未排程，
    這已是本清單第七次「某塊營收沒有 driver 解釋」）。**
