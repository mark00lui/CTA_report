driver_refs:
- driver: hyperscaler-capex
  direction: '+'
  note: >
    CSP 資本支出 → 資料中心光互連埠數 → 雷射晶片 → **磷化銦基板**需求。
    ⚠⚠ **本檔的時序與清單其餘光通訊標的相反，這一點必須寫死**：
    6442／3008／COHR／LITE 是「落後 2–3 季」，**本檔是基板，出貨在下游收發器之前，
    因此對同一個 capex 訊號本檔的營收反應更早。** 領先性是它被納入的主要理由之一。
    ⚠ **代價是長鞭效應**：最上游節點承受最大的庫存放大，
    **capex 減速時本檔也會最早、最劇烈地反映** —— 領先是雙向的，不是單向的好處。
- driver: accelerator-roadmap
  direction: '+'
  note: >
    互連規格世代與功率密度 → 每加速器的光埠數 → 基板片數。
    ⚠ **敏感度保守記「中」而非「高」**：本檔的產品是基板，**對 CPO 與可插拔光模組兩條路徑都供貨**，
    因此它**不依賴 CPO 這個特定前提成立**（見 factor_tags 未列 `cpo` 的理由）。
    這使它在該 driver 上的曝險比 COHR／LITE／6442／3008 都低，而那是好事。
- driver: ai-accelerator-demand
  direction: '+'
  note: >
    加速器實際出貨 → 收發器掛載量 → 雷射與基板。
    ⚠ **本檔對這個 driver 的曝險最直接可量化，但當下量化不了** ——
    需要「每加速器的光埠數 × 每埠的 InP 面積」兩個係數，兩個都未取得（列 gaps）。
    **扇出時應明寫「無法量化」而非「無影響」。**

