    6M 未實現 995 稅前，以約 21% 稅率估算稅後約 786，**約占 6M 淨利 2,103 的 37%**。
    ⚠ **這解釋了先前所有的季度異常**：2025Q1 EPS 0.38 對 2026Q1 EPS 4.49（同一季別差 11.8 倍）、
