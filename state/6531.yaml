notes: >
  ⚠⚠ **本檔刻意不標 `ai_capex_hw`，而這是本輪第三次做這個判斷**（前兩次為 3533、8299）：
  **現在的營收由 IoTRAM 撐 —— 法說明言「IoTRAM 強勁需求推升營收年增 115%」；
  而給 AI 加速器用的 VHMStack™ 要到 2027–2028 才全面量產。**
  **AI 資料中心的當期營收實質上是零 —— 標上去會是為敘事而標，不是為證據而標。**
  ⚠ **重新分類規則已寫定於 changes_if**：**VHMStack 相關營收占比 > 10% 則加標籤並重估。**
  **三次「不標」的共同結構是一樣的：看起來像 AI 的東西，其當期營收占比接近零。**
  ｜⚠⚠ **thesis 的證據是年增與季增指向相反的方向**：
  **Q2 EPS 季增僅 +1%，而同期營收季增 +12.6% —— 單季淨利率自約 32.2% 降到約 28.8%。**
  **而年增是 +224%。**
  **年增描述的是一年前的低基期，季增描述的是現在。**
  ⚠ **這件事之所以重要，是因為下一段要等很久**：
  **VHM 與 VHMStack 的全面量產時程延伸至 2027–2028。**
  **若 IoTRAM 這一段已經到頂，中間就有一段 18–30 個月的空白，而現價是 57.61 倍。**
  ｜⚠ **有一件事要公平地寫在旁邊**：**Q1 的毛利率 46% 在營收年增 115% 的同時
  與去年同期持平。**
  **那說明成長來自量而不是價，也說明本檔的產品定價沒有跟著記憶體現貨價走 ——
  那是客製化與利基型產品的特徵，而它與同日建檔的 8299 群聯正好相反
  （那一檔的毛利率一年內自 29.06% 衝到 65.31%，因為它賺的是價差）。**
  **兩檔都在記憶體這條鏈上，而獲利機制完全相反。**
  ｜⚠⚠ **本檔為那條雙邊 invalidation 規則貢獻了第二個「過關」樣本，
  而兩個過關樣本合起來揭露了一個此前沒寫出來的隱含條件**：
  **本輪的比值分布是 —— 8299 0.008 倍、3661 0.086 倍（太近）；
  3583 1.09、3211 1.18、3131 1.21 倍（偏緊）；6187 2.03 倍、本檔 2.55 倍（過關）。**
  **七個有比值的樣本裡兩個過關，而兩個過關的都是「價格在季線之上」的標的。**
  ⚠⚠ **那不是巧合：價格在均線之上時，均線是支撐（可以當失效價位）；
  在均線之下時，均線是壓力（已跌破的線不能當失效價位）。**
  **亦即「兩端都過關」還有一個隱含的第三個條件：價格必須在那條線的正確一側。**
  **這一點應與 ±20% 的上界與「2–3 個日振幅」的下界一起寫進 references。**
  ｜⚠ **本檔屬「先看去年那條線的形狀」的第四種、也是最麻煩的一種（與 3131 同型）：
  兩年都不規則，而且連累計年增率都不是單調的。**
  **五種形狀現在的樣本數：平的 1 檔、單調斜的 3 檔、兩年不規則但累計單調 1 檔、
  兩年不規則且累計也不單調 2 檔、兩年都很平 1 檔。**
  **最麻煩的那一種已經出現兩次 —— 它不是特例。**
  ｜⚠ **建檔時攔下一個來源的英文名錯誤，這已是兩天之內第三次資料源出錯**：
  **某搜尋摘要把 6531 的英文名寫成 "Aiptek" —— Aiptek 是天瀚科技，不是愛普。**
  **6531 是 AP Memory Technology（愛普科技）。**
  **產品名（IoTRAM、S-SiCap、VHM、VHMStack）確實是愛普的，故中文標的沒錯、英文名錯。**
  ⚠ **前兩次分別是 3221 的代號筆誤（3221 是台嘉碩、順達是 3211）
  與 6187 的 H1 成長率 +9.82%（法說為 +53.7%）。**
  **三次的共同點是：二手摘要在「識別」與「已經算過的數字」這兩件事上最容易錯，
  而那兩件事恰好最不容易靠內部一致性檢查抓到。**
  ｜⚠ **另記兩件未查證、因此不得推論的事**：
  **(a) 坊間常提及本檔與鈺創 5351 的淵源，但兩者的實際股權與業務關係本輪未查證 ——
  若有實質關聯，鈺創作為同業的獨立性就要打折；**
  **(b) 本檔在報價頁上顯示為「愛普*」，帶星號註記，該註記的確切意義本輪未查證。**
  **兩者都已列 gaps，在查證之前任何相關推論都不可寫。**

