key_variables:
- name: 對VST的EV/EBITDA溢價
  value: 54.7
  unit: '%'
  tier: 事實
  source: >
    ⚠ **這一格就是 thesis 本身，也是唯一可直接驗證 thesis 的變數。**
    本檔 **16.34** 對 VST **10.56** → 溢價 **54.7%**
    （stockanalysis，**as-of 2026-09-08，價格為 2026-09-04 收盤**）。
    其他兩個口徑同向：forward PE 本檔 **24.21** 對 VST **14.50** → 溢價 **67.0%**；
    EV/Sales 本檔 **4.16** 對 VST **3.65** → 溢價 **14.0%**。
    ⚠ **與清單上多數標的相反：本檔是溢價，不是折價。**
    3030 對致茂折價 64.1%、3324 對 3017 折價 12.7% —— **本檔的爭點方向是倒過來的。**
    ⚠ **溢價可能的具名成因（未經證實者已標明）**：
    (1) ⚠ **期別錯配，而這是我目前最懷疑的一項** —— TTM 的 EV 含 100% 併購後淨負債 24.0B，
        **而 TTM EBITDA 只含部分期間的 Calpine 貢獻。分子完整、分母不完整，機械性地推高 EV/EBITDA。**
    (2) 無碳基載機組的稀缺性（⚠ **裝置容量與燃料結構未取得，此項為未證實**）；
    (3) 獲利品質：本檔 ROE **15.05%** 低於 VST 的 **42.96%** —— ⚠ **這一項對溢價不利**，
        但 VST 的高 ROE 部分來自其被買回削薄的股東權益（BVPS 僅 8.95），**兩者的分母不可比**。
    ⚠⚠ **2026-09-08 新增第三種可能，而它是本輪事件帶進來的，也是最該記的一項**：
    **溢價可以純粹因為利率而壓縮，與核能敘事完全無關。**
    公用事業類股是市場公認的「債券替代品」（穩定現金流、高配息、低波動），
    **本檔因此是覆蓋清單中唯一估值直接對標公債殖利率的標的。**
    2026 年 8 月：XLU **-4.78%** 而同期 S&P500 **+2.62%**（差 **7.40pp**），
    **公用事業為今年以來 S&P500 唯一下跌的族群**。
    ⚠ **這意味著 thesis 有一個先前未記錄的失效模式**：
    **54.7% 的溢價可能在「核能稀缺性完全成立」的情況下照樣壓縮 ——
    只要長天期殖利率繼續上行。** 那不會使 thesis 為假，但會使它**不可獲利地為真**。
    **判定第二條 falsifier 時必須把這一層與「稀缺性不成立」分開讀。**
    ｜**爭點因此是三分而非二分**：54.7% 有多少是真實稀缺性、多少是期別錯配、
    **多少只是折現率在動。**
  updated: 2026-09-08
