thesis: "爭點是自製與再生晶圓占比過半後的淨利率落點"
thesis_since: 2026-09-10
# ⚠ 只留爭點，前提移入 key_variables 與 notes（LITE 那輪的教訓，AXTI 起沿用）。
#   前提（已確立、不是爭點）：**營收穩定成長** ——
#   2026 前 8 月累計 81.57 億元（年增 8.12%）、8 月單月 10.68 億元創新高、
#   八個月的月營收全在 9.71–10.68 億元之間。
#   ⚠ **為什麼爭點是淨利率的落點而不是營收**：
#   **近四季淨利率走過 24.5% → 8.2% → 11.1% → 14.0%，全距 16.3 個百分點，
#   而同期單季營收全距只有約 11%。獲利的變異幾乎全部來自組合。**
#   ⚠⚠ **而公司自己說組合正在翻轉（自製設備與再生晶圓合計占比 2026 年可望首度過半）——
#   翻轉之後淨利率會落在那個 8.2% 到 24.5% 區間的哪一段，公司沒有回答，而現價是 44.79 倍。**

