- date: 2026-09-11
  level: L2
  summary: 手動全量重估（建檔後首次）— ⚠⚠⚠ 取得四家同業倍數後證明建檔時宣告的主錨（分部別倍數 SOTP）不可用，方法組合更換；首次建立三情境與加權目標價 2,057，相對 2026-09-10 收盤 2,190 為 -6.1%
  delta: >
