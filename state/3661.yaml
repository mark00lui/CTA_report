# ⚠⚠ 建檔當下最重要的四件事，寫在最前面：
#   (1) ⚠⚠ **本檔的當期盈餘代表性是本日九檔中最差的，而原因不是分母壞掉，是分母在一年之內
#       移動了一個數量級**：**月營收年增率自 2026 年 2 月的 -77.08% 走到 8 月的 +273.61%，
#       累計年增率自 -67.11% 翻正到 +13.58%。** 同一年、同一家公司。
#   (2) ⚠⚠ **因此「市營比 12.02 倍」這個數字是假的便宜**：它的分母約 280 億元，
#       **而 2026 年 7、8 兩個月就做了 162.09 億元。以 7–8 月年化（約 972 億元）計，
#       市營比只有約 3.5 倍。同一個市值，選不同的年度，倍數差 3.4 倍。**
#       **本檔估值的核心問題不是「幾倍」，是「哪一年」。**
#   (3) ⚠⚠ **毛利率的方向已經確定，只是幅度未知**：Q1 2026 毛利率 **50.16%**（歷史新高，
#       年增 +27pp）是 NRE 高峰的產物；**Q2 營收季增 +82.6% 而稅後淨利只季增 +14.9%，
#       淨利率已自約 34.8% 壓到約 21.4%。量產稀釋不是預測，是已經發生的事。**
#   (4) ⚠ **本檔與覆蓋清單內的 AVGO 在同一批 AI ASIC 專案上是零和競爭關係**
#       （本日第三組這樣的配對，前兩組為 3324／3017、以及散熱鏈上的 2308）。
#       **故 AVGO 明文禁用作為估值錨，只作為競爭觀察對象。**
