- date: 2026-09-10
  level: L2
  summary: 新增追蹤標的 —— 清單第一檔以資本支出擴建（而非商品循環）進入 Q3 象限；42% 營收為 CATV
  delta: >
    建檔。判 **Q3（資產與循環）**。
    X 軸低且比 AXTI 更徹底：**EPS TTM -0.79、trailing PE n/a —— 分母不是趨零，是為負**；
    **營業利益從未為正**（FY2023 -41.35／FY2024 -70.91／FY2025 -54.60／TTM -67.41），
