- name: 資本支出與自由現金流
  value: 537
  unit: 億元新台幣（2026 全年 capex 計畫）
  tier: 事實
  source: >
    董事會核准 2026 資本支出自原訂 340 億元上修至 537 億元（+197 億），逾 80% 投入 ABF 擴產。
    ⚠ capex ÷ 年化營收（1-7 月 965.90 億年化約 1,656 億）= **32.4%**，
    遠超過 references/valuation.md 所訂「必須做現金流分析」的 15% 門檻。
    現況：2026 Q2 自由現金流 +14.20 億元 —— 為正但相對 537 億的年度計畫極薄。
    ⚠ 壓力在前方不在後方：capex 自 340 上修至 537 是本季才決定的，Q2 的 FCF 尚未反映它。
    ⚠ 已在外部籌資：自 2025 年起透過發債與增資募得 93.76 億元，含每股 116 元的溢價增資
    與 40 億元可轉債。一家帳上有現金的公司選擇外部籌資，本身就是規模的訊號 —— 與 GOOG
    2026 年發股籌資的判讀同構。
    ⚠ **2026-09-08 公司行動掃描抓到一件 state 完全沒有的事：辦理海外募股約 14 億美元。**
    公司說明的用途為「**購買以外幣計價的原物料**」。
    ⚠ **金額換算與稀釋幅度**：14 億美元 × 匯率 32 = **448 億元台幣**；
    對市值 15,600 億元 = **稀釋約 2.9%**。
    ⚠ **我在計算這一格時當場犯了一個 10 倍的量級錯誤並抓到**：
    先誤將 1.4 × 32 = 44.8 直接讀成「44.8 億元」，得出稀釋 0.3%；
    但 1.4 的單位是**十億**美元，44.8 是**十億**台幣 = **448 億元**。
    這與本倉庫記錄過的「2027 capex 4 billion 對 400 億」是**同一類錯誤：單位層級沒對齊**。
    ⚠ **而它被抓到是因為我把數字印出來看了一眼覺得不對，不是因為有任何檢查擋下它。**
    ⚠ **本輪不因稀釋單邊下修 EPS**，理由具體：募資用途是鎖住以外幣計價的原物料，
    **而 thesis 的第一句就是「ABF 漲價循環由 T-glass 缺料撐起」** ——
    **稀釋與供給保障是同一筆錢的兩面**。若只計稀釋不計供給保障，是選擇性使用同一則事實。
    機械影響僅供參照：2027 EPS 32.71 × (1 − 2.9%) ≈ **31.77**，base 654 → 約 **635**。

