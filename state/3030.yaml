  value: 59.10
  unit: '%（TTM 至 2026 Q2 的毛利率）'
  tier: 事實
  source: >
    ⚠ **本檔建檔時最重要的空白，本輪關閉，而答案不是我預設的那個。**
    stockanalysis 損益表（**as-of 2026-09-08**，單位百萬元新台幣）：
    ｜FY2024 營收 6,356／毛利 3,784／**毛利率 59.53%**／營益 2,029／**營益率 31.92%**／淨利 1,837／EPS 7.76
    ｜FY2025 營收 8,467／毛利 4,941／**毛利率 58.36%**／營益 2,992／**營益率 35.34%**／淨利 2,479／EPS 10.48
    ｜TTM(26Q2) 營收 9,537／毛利 5,636／**毛利率 59.10%**／營益 3,457／**營益率 36.25%**／淨利 3,118／EPS 13.18
    ⚠ **thesis 的核心觀察「EPS 年增 75% 對營收年增 23.92%」現在有答案了，而它是三選一裡的第三個：**
    ・**不是毛利率** —— 三年帶寬僅 **1.17pp**，且 TTM 的 59.10% 還低於 FY2024 的 59.53%
    ・**不是業外**（至多約一成，見下）
    ・**是營業槓桿** —— 費用率 27.61% → 23.02% → **22.85%（-4.76pp）**；
      兩年營收 **+50.0%** 而營業費用僅 **+24.2%**（1,755M → 2,179M）
    ⚠ **2026-09-08 重估補上季度序列（單位百萬元新台幣，毛利率／營益率／營益→淨利落差）**：
    ｜2025Q1 1,941／57.60%／34.57%／**-13.9%**｜2025Q2 2,378／58.37%／**39.66%**／**-44.7%**
    ｜2025Q3 2,068／56.72%／32.25%／**+4.0%**｜2025Q4 2,081／60.64%／34.18%／-3.5%
    ｜2026Q1 2,441／60.30%／38.17%／-11.3%｜2026Q2 2,947／58.70%／**38.95%**／-20.6%
