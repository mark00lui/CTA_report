notes: >
  ⚠⚠⚠ **本檔最重要的一件事是「同一個價格算得出三個本益比，差 3.7 倍」，
  而兩端各是一個陷阱。**
  **TTM EPS 約 **4.22 元** → **29.98 倍**；H1 2026 的 4.82 元年化 → 約 **13.1 倍**；
  Q2 的 3.92 元年化 → 約 **8.1 倍**。**
  **原因是 TTM 的分母裡還含著 2025 年下半年約 **-0.60 元**的虧損（4.22 − 4.82）。**
  ⚠⚠ **valuation-map 對 trailing PE 的警語只寫了一邊：
  「⚠ 說謊時：循環頂（低 PE 看似便宜）」—— 那是 8.1 倍那一端。**
  **29.98 倍那一端是它的鏡像：循環底剛翻正時分母含著虧損，高 PE 反而是便宜的訊號。**
  ⚠ **這是本輪第三個要求把那條警語做成雙邊的案例（前兩個是 8299 與 3211），
  也是第一個三個數字全部算得出來、可以直接寫進 references 當範例的。**
  ｜⚠⚠⚠ **本檔是本輪第四檔 Q3，也是第一檔「循環型」而非「擴建型」——
  而它為那個拆分建議提供了對照組。**
  **Q3 的兩個預設錨（PB／重置成本、中週期正常化 EPS）：**
  **在三檔擴建型身上全部失效 —— 3081 的股價淨值比 56.17、3363 的 14.13，
  且兩檔都沒有正常盈餘可正常化（3363 的 TTM EPS 是 -1.18）；**
  **在本檔身上**兩個都能用** —— 股價淨值比 4.04（對 IDM 偏高但在可討論的範圍內），
  而本檔有完整的循環歷史可以正常化。**
  ⚠⚠ **拆分的建議我提了三次，前三次都只是三個個案的並列；本檔第一次讓它有了對照組。**
  **結構性的理由也已經寫在 3363 那一檔：擴建中的公司帳面資產已灌入尚未貢獻獲利的
  在建工程，同時沒有正常盈餘可以正常化 —— 循環型沒有這兩個問題。**
  ⚠ **並記下一個順帶的收穫：本檔是本輪第一次「中週期正常化」作為**主錨**而非檢查器使用
  （前五次 8299、3131、6187、3583、3665 都是當檢查器）。**
  ｜⚠⚠⚠ **本檔讓「哪一條序列有訊息」的判準第一次寫得出一般式。**
  **此前的做法是「先看去年那條線的形狀」，分五類逐案處理。**
  **本檔顯示真正的判準不是形狀，是**訊號對雜訊的比**：**
  **本檔 —— 基期全距 45.4%，今年累計年增 **+149.14%** → 訊號遠大於雜訊 → 年增率可讀；**
  **2317 鴻海 —— 基期全距 19.1%，累計年增 +39.73% → 可讀；**
  **3363 上詮 —— 基期全距 **103%**，累計年增 **-10.56%** → 訊號遠小於雜訊 → 不可讀。**
  **基期形狀只是分母；要與今年的變動幅度一起看才有意義。**
  **形狀分類仍有用（它告訴你雜訊長什麼樣），但決定可讀性的是比值。**
  ⚠ **應與 2317 那條「再看今年有沒有季節性」一起寫進 references。**
  ｜⚠⚠ **刻意不標 `ai_capex_hw`，本輪第四次**（前三次 3533、8299、6531）。
  **驅動是 NOR Flash 全面漲價、NAND 與 eMMC 供不應求、車規 eMMC 出貨在即 ——
  那是記憶體的價格循環，賺的是價差。**
  **與 8299 群聯同一個理由，而本檔離 AI 更遠（NOR 主要用在工控、車用、消費）。**
  ⚠⚠ **而扇出時有一個方向可能是反的，必須寫死**：
  **AI driver 上修對本檔是「產能排擠 → 缺貨 → 漲價」的二階效應；
  但 AI driver 下修對本檔不必然是利空 —— 排擠緩解會讓標準型產能回流，那是供給增加。**
  **這與清單上其餘賣硬體給資料中心的標的完全不同。**
  ｜⚠⚠ **本檔是 `memory` 那一格第一檔與 MU／SNDK 同機制的台股標的**：
  **有廠製造、賣位元、量價齊揚。**
  **那一格現在有六檔而只有三種機制 —— 6239 是封測、8299 是模組價差、
  6531 是無廠客製化設計、MU／SNDK／本檔是有廠製造。**
  **本檔納入之後，那一格第一次可以在「同機制」內部做序位比較。**
  ⚠ **但借 MU／SNDK 要打折**：**它們做標準型 DRAM／NAND（大宗商品），
  本檔做專業型記憶體（NOR、SLC NAND、ROM、車規 eMMC）——
  循環幅度與客戶結構不同。借它們的**循環位置判讀**比借倍數有用。**
  ｜⚠⚠ **本檔與 8299 群聯的差別要寫下來，因為兩檔的漲價故事看起來一樣**：
  **8299 是模組廠，賺的是現貨價與存貨成本的時間差 —— 那筆利益會隨庫存周轉結束；**
  **本檔有自己的廠，漲價利益會持續到供需反轉，但代價是產能一旦建好就撤不掉。**
  **兩者的時間結構不同 —— 而那正是第四條 falsifier（全年自由現金流為負）
  只對本檔有意義的原因。**
  ｜⚠⚠ **技術面與基本面的落差值得單獨記一筆**：
  **8 月營收年增 218.53% 且首破 80 億元、Q2 EPS 年增 668%，而股價在季線之下 5.57%。**
  **依 CTA 紀律，基本面理由再強也不跳過右側確認 —— 這正是那條紀律存在的場合。**
  ⚠ **並記下比值分布的一個新觀察**：**「偏緊」那一段現在有四個樣本擠在 1.09–1.24 之間
  （3583 1.09、3211 1.18、3131 1.21、本檔 1.24）。**
  **這個聚集本身有意義：多數台股的季線就是離現價一到一點多個日振幅 ——
  那更支持「季線對多數標的本來就不是好的失效參考」這個解釋。**
  **十一個樣本、兩個過關（18%）。**
  ｜⚠ **另記兩件交叉檢查乾淨的事**：**(a) Q2 月營收加總 191.25 億元與法說載的
  191.25 億元完全一致；(b) TTM 營收推算（560.9 億元）減去前 8 月累計（454.63 億元）
  ＝ 106.27 億元，月均 26.6 億元，與 2025 年 7、8 月的 27.54／25.57 億元相容。**
  **本輪多數標的的兩路推算都有 0.5%–2.5% 的差異，本檔沒有。**

