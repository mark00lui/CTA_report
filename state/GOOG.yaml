notes: 本檔的分歧不在 Search 會不會被 AI 吃掉，而在兩個引擎的相對速度 —— Search +17% 沒有崩壞跡象，
  真正改變損益結構的是 Cloud（+82%、營業利益自 2.8B 跳至 8.8B、backlog 514B）。代價寫在資產負債表上：
  2026 capex 上修至最高 205B，且非以營運現金流支應（6 月發股籌 49.6B、Q2 發債籌 20.3B）。
  一家帳上現金充裕的公司選擇發股籌資，本身就是規模的訊號。
  ｜⚠ 本檔是覆蓋清單中 GAAP 獲利被股權證券未實現利益扭曲最嚴重的一檔（正常化後 EPS 只剩三分之一不到）。
  MSFT（OpenAI 損益）、NVDA（CoreWeave 等評價利益）有同樣結構但幅度較小。三家公司都對 AI 主題標的有大額股權投資，
  同一批 AI 資產的評價波動會同時影響三檔的帳面獲利 —— 這是 correlation_watch 目前沒有記到的一條連結，
  建議下次 coverage 更新時納入。用未經調整的 GAAP 或 TTM EPS 算本益比，會系統性低估這批標的的估值水準。
