    而那個更正同時改變了方法組合。**
    **建檔時我把本檔記為「本輪最不穩定的一檔」，依據是「月營收全距 10% 而淨利率全距 16.3pp」。**
    **但年度 EPS 序列 FY2022 7.07 → 2023 8.09 → 2024 11.54 → 2025 13.81 是完美單調的，
    三年 CAGR 25.0%，四年區間僅 1.95 倍；二十季裡只有兩季低於前一季，幅度都在 11% 以內。**
