      **2317 的法說（2026-08-12）說：「上修資本支出年增三成以上，
      提前擴充伺服器機櫃、**液冷**及測試產能，並強化臺灣、美國、墨西哥、越南等全球佈局。」**
      ⚠⚠⚠ **而 3324 雙鴻與 3017 奇鋐的整個 thesis 就是液冷滲透率 ——
      那句「擴充液冷產能」來自買它們東西的人嘴裡，不是來自它們自己。**
      **此前記過的三種交叉驗證是：上下游時序（AXTI ↔ 3081）、
      同一個埠的兩端（2345 ↔ 光模組族群）、同層同業序位（3533 ↔ 3665）。**
      **本組是第四種：買賣雙方一手互證 —— 借的是對方嘴裡的事實。**
      ｜⚠⚠ **時序的用法要寫死，否則這條會被讀成同步的利多**：
      **組裝廠「提前」擴充液冷產能，代表液冷零件的拉貨會**早於**機櫃出貨 ——
      3324 與 3017 的營收應領先 2317 的雲端網路營收，而不是同步。**
      **若觀察到同步或落後，其中一邊的數字要重新檢查，或是庫存在某一層堆積。**
      ｜⚠⚠ **並記下這一組帶來的一個因子分布上的盲點**：
      **`ai_capex_hw` 現在有 28 檔，其中 27 檔是賣東西給 AI 資料中心的供應商，
      2317 是那些供應商的客戶。**
      **一筆 AI 機櫃的資本支出同時出現在零件供應商與組裝廠的營收裡 ——
      等權因子分布數的是標的數不是營收，所以它看不見這件事。**
      **兩者的曝險方向相同，但傳導時序相反。**
      ｜⚠ **明文禁用把 3017／3324／3533／3665／6805／2308 的倍數當 2317 的錨，反之亦然 ——
      上下游沒有倍數可比性。**
      **2317 的 Q2 毛利率 6.12%；2345（最接近的 ODM）是 19.7%；3533 是 45.47%。**
  - pair: "⚠⚠⚠ 2317 / 3363 — 同日建檔，把兩個極端同時佔滿了（估值與營收序列）"
    added: 2026-09-10
    note: >
      **兩檔同一天建檔，同在一條 AI 鏈上，而它們在兩件不同的事情上都是本清單的兩個極端。**
      ⚠⚠⚠ **(a) 估值**：**2317 的市營比 **0.35**（本清單最低），
      3363 的是 **45.92**（本清單最高）—— 相差 **131 倍**。**
      **2317 是薄利多銷的組裝（TTM 淨利率約 2.11%、股東權益週轉率約 5.28 倍，
      兩者都是本清單極端值）；3363 是還沒有營收的選擇權（TTM EPS -1.18，本益比未揭露）。**
      **這是「市營比在跨商業模式時完全沒有意義」最好的一次證明。**
      ⚠⚠⚠ **(b) 營收序列的可讀性**：**兩檔正好把「哪一條序列有訊息」的兩個極端佔滿了。**
      **2317 的**月增率不可讀**（強烈的消費電子季節性：-15.39 → -18.39 → **+34.90**
      → +3.53 → +3.28 → -4.38 → +15.18 → -2.61%），
      但**年增率與累計年增率都可讀**（去年基期溫和不規則，全距約 19.1%；
      累計年增率 2 月觸底 21.63% 後單調上升六個月至 39.73%）。**
      **3363 則完全相反：**年增率與累計都不可讀**（去年基期全距 **103%**，
      2 月的 +27.67% 與 4 月的 -37.30% 兩個極端都是基期造成的），
      只有**月增率**可讀（3 月起連續六個月為正）。**
      ⚠⚠ **這證明「哪一條序列有訊息」不是標的的屬性，
      是基期形狀與季節性共同決定的。**
      **判斷順序應該是：先看去年那條線的形狀 → 再看今年有沒有季節性 → 最後才選序列。**
      **本輪此前只做了第一步，應把第二步補進 references。**
      ｜⚠⚠⚠ **(c) 並記下 2317 揭露的一個 invalidation 規則缺口，
      它是本輪最有價值的方法論收穫。**
      **2317 的日振幅只有 **1.59%**、Beta **0.96**，兩者都是本輪最低（3363 是 7.74%）。**
      **對這樣一檔市值 3.5 兆元的大型股，「2 個日振幅」只需要距離 **3.2%** 就滿足了 ——
      而 3.2% 對任何個股都在單日新聞與盤中雜訊的範圍內。**
      **亦即那條規則需要的不只是相對下界（≥2 個日振幅），還要一個**絕對下界**。**
      **現有三個條件是：不太遠（≤±20%，絕對上界）、不太近（≥2 個日振幅，相對下界）、
      在正確的一側。2317 補上第四個：絕對下界。**
      ⚠ **並記下十個樣本的通過率只有 20%（6187 2.03、6531 2.55）——
      要嘛門檻太嚴，要嘛「季線」對多數標的本來就不是好的失效參考。
      後者更可能，因為本輪只查了季線一條線。**
  - pair: "⚠⚠⚠ 3363 / 3008 — 本清單第一組同時是「循環引用」與「零和競爭」的標的"
    added: 2026-09-10
    note: >
      **兩檔的價值主體是同一個尚未貢獻營收的選擇權：FAU（光纖陣列）。**
      **3008 大立光在本倉庫被記為「價值主體是尚未貢獻營收的 CPO 選擇權」，
      而那個選擇權的內容正是 FA／PMLA／**FAU** 光學元件端；**
      **3363 上詮的主錨就是 FAU —— 公司自估 2026 至 2028 年三年累計營收貢獻上看
      約 70 億元，FAU 產品 2026 Q3 起出貨（初期 3.2T），
      並已投入 15.38 億元建產線（其中 FAU 生產機台約 10.8 億元）。**
      ⚠⚠⚠ **兩件事同時成立，而本清單此前從未同時發生過**：
      **(a) 循環引用 —— 兩檔都在覆蓋清單內，我對其中一檔的判斷會移動另一檔；**
      **(b) 零和競爭 —— 兩檔搶的是同一個市場的份額。**
      **此前記過的三組零和（3324／3017、AVGO／3661、2308／3211）沒有一組同時是循環引用；
      此前記過的循環引用（LITE／COHR）不是零和（LITE 是 COHR 的錨，不是它的競爭者）。**
      ⚠⚠ **實務規則，必須寫死**：
      **依 3583 那一檔細化後的規則，3008 的市場觀測倍數可用、判斷值不可用。**
      **但本組還有一層更強的限制：兩檔的判斷值是以負號連動的 ——
      我若調高 3363 的 FAU 選擇權價值，機械上就該調低 3008 的，反之亦然。**
      **重估任一檔的 FAU 選擇權時必須同時檢查另一檔，且兩份報告要互相指名。**
      **單獨調一邊會讓兩檔的合計份額超過一，而那不會報錯 —— 只會安靜地把同一塊餅賣兩次。**
      ｜⚠⚠ **並記下一件本輪查到但刻意不採用的事，因為它正是這組關係的核心風險**：
      **本輪查到一則「大立光切入 CPO FAU」的說法，唯一來源是社群平台貼文 ——
      不是公司揭露、也不是財經媒體報導。**
      **完全不採用，3363 的第四條 falsifier 因此改錨在它自己的 capex 計畫上。**
      ⚠ **今日已第四次遇到二手來源的問題，而這一次的性質與前三次不同**：
      **前三次（3221 代號、6187 的 +9.82%、6531 的英文名）是**來源寫錯**，
      靠交叉比對可以抓到；**
      **這一次是**來源等級不夠**，只能靠看來源是誰。兩種防線不一樣。**
      ｜⚠⚠ **另記 3363 帶來的一個對 references 有結論性的發現**：
      **它是「擴建型 Q3」的第三例（前兩例 AAOI 128.97%、3081 217.8%），
      而它的 capex／營收 是 87.8%（15.38 億元 ÷ TTM 營收約 17.52 億元）。**
      **Q3 象限的兩個預設錨（PB／重置成本、中週期正常化 EPS）在它身上都不能用：
      股價淨值比 14.13；而 TTM EPS -1.18、FY2025 +0.16、2026 Q1 約 -1.10、Q2 -0.22
      是一條沒有中週期的序列。**
      **這是 3081（股價淨值比 56.17）之後第二次兩個預設錨同時失效，兩次都是擴建型。**
      ⚠⚠ **結構性的解釋現在寫得出來了，不再是三個個案的並列**：
      **擴建中的公司帳面資產已灌入尚未貢獻獲利的在建工程與新設備，使 PB 失去意義；
      同時它沒有正常盈餘可以正常化，因為新產能的損益還沒開始。**
      **那正是 valuation-map 對 PB 的警語「在建工程已進分母卻未貢獻獲利時被高估
      （6239 即是）」的一般化 —— 6239 是個案，擴建型 Q3 是這個個案的類別。**
      **建議把 Q3 拆成「循環型」與「擴建型」並各給處方，已第三次提出。**
  - pair: "⚠⚠ 3665 / 3533 — 同在 connector 格內且互為同業，而利潤率差一倍"
    added: 2026-09-10
    note: >
      **3665 貿聯是 3533 嘉澤建檔時列的同業之一，而兩檔現在都在覆蓋清單內 ——
      這是 3583 那一檔細化後的規則第一次被套用在
      「新標的撞上舊標的同業」的場景。**
      ⚠⚠ **而它不必再改，直接用就是了 —— 那正是規則細化的目的。**
      **用 3533 的市場觀測倍數作序位對照（須明寫日期與「不得因我的判斷而調整」），
      不用它的目標價、應有倍數或情境倍數。**
      ｜⚠⚠ **而第一個序位觀察就有內容（皆為同一日期的觀測或推算值）**：
      **兩檔的市營比幾乎相同（3665 為 4.42、3533 為 4.72），
      但本益比差了 1.8 倍（約 35.53 對 19.81）。**
      **差別全在淨利率：3665 約 12.2%、3533 約 24.5%；
      毛利率是 28.77%（Q1）對 45.47%（Q2）。**
      **3665 用兩倍的營收換到一半的利潤率。**
      ⚠ **那是商業模式的差異（線束與線材 vs 連接器與插槽），
      不是估值的差異 —— 而序位分析要回答的正是市場該為這個差異付多少。**
      ｜⚠ **扇出方向相同但彈性不同**：
      **兩檔都受 AI 機櫃建置帶動，但 3533 的伺服器營收主體是 CPU 插槽
      （AI 直接曝險僅約 1%，故拒標 ai_capex_hw），
      3665 的 HPC 佔比是 45%（故標上）。**
      **同一則 CSP capex 的消息，兩檔方向相同而幅度差很多 ——
      扇出時不可共用同一個彈性。**
      ｜⚠⚠ **另記 3665 帶來的兩個方法論收穫，它們與連接器無關但值得放在這裡**：
      **(a) 它是本輪十七檔中第一個「數據與敘事互相印證」的案例。**
      **三個獨立序列同時指向同一個轉折點：月營收年增率 4 月觸底 18.54% → 6 月 63.79%；
      累計年增率 4 月觸底 25.37% → 8 月 40.01%；
      單季淨利率 Q1 約 10.88% → Q2 約 12.79%。**
      **而管理層說 Q1 是「新世代 HPC 平台初期爬坡」造成的過渡期、「並非結構性需求放緩」。**
      **對照：3211 是敘事與數字相反、6531 是只有敘事沒有數據、3583 是只有數據沒有敘事。**
      **(b) 它提供了「invalidation 必須用比值不能用絕對百分比」最乾淨的一次證明：
      3211 順達的季線距現價也是 +5.19% —— 完全相同的絕對距離。**
      **但 3211 的日振幅 4.39%（比值 1.18 倍，判偏緊），
      3665 的日振幅 6.46%（比值 0.80 倍，判太近）。**
      **同樣的距離、不同的判定 —— 絕對百分比在這裡會給出相同的答案，而那個答案是錯的。**
      **本輪的比值分布現在有八個樣本，填滿 0.008 到 2.55，過關的只有兩個
      （6187 2.03、6531 2.55）且兩個都是「價格在均線之上」的 ——
      三個條件（不太遠、不太近、在正確的一側）現在都有樣本支撐，應正式寫進 references。**
  - pair: "⚠⚠ 6531 / 8299 — 同在記憶體鏈上，而獲利機制完全相反"
    added: 2026-09-10
    note: >
      **兩檔都在記憶體這條鏈上，而它們的毛利率對記憶體現貨價的反應完全相反 ——
      這是 `memory` 這一格今天學到最尖銳的一件事。**
      **8299 群聯：毛利率一年內自 29.06% 衝到 65.31%（2026 Q2），
      毛利年增 752.8% 遠高於營收年增 279.5% —— 它賺的是現貨價與存貨成本的時間差，
      那是一筆從客戶手上轉移過來的錢。**
      **6531 愛普：Q1 2026 毛利率 46%，在營收年增 115% 的同時與去年同期持平 ——
      成長來自量而不是價，產品定價沒有跟著記憶體現貨價走。那是客製化與利基型產品的特徵。**
      ⚠⚠ **實務後果**：**同一則「記憶體漲價」的消息，對 8299 是短期利多中期利空
      （存貨利益會隨周轉結束），對 6531 幾乎沒有直接影響。**
      **扇出時把兩檔放在同一個 driver 條目下用同一個方向，會有一檔是錯的。**
      ｜⚠ **而 `memory` 這一格現在有四種獲利機制**：
      **MU 與 SNDK（有廠製造，賣位元，量價齊揚）、8299（模組價差）、6531（無廠客製化設計）。**
      **四檔，三種機制 —— 這一格的 14.7% 不能當成一個同質的曝險來讀。**
      ｜⚠⚠ **另記 6531 帶來的一個方法論收穫，它與記憶體無關但值得放在這裡**：
      **6531 是本輪第二檔「均線兩端都過關」的標的（比值 2.55 倍日振幅，
      高於 6187 的 2.03 倍），而兩個過關樣本合起來揭露了一個此前沒寫出來的隱含條件 ——**
      **兩個過關的都是「價格在季線之上」的標的。那不是巧合：**
      **價格在均線之上時，均線是支撐（可以當失效價位）；
      在均線之下時，均線是壓力（已跌破的線不能當失效價位）。**
      **亦即「兩端都過關」還有第三個條件：價格必須在那條線的正確一側。**
      **應與 ±20% 的上界與「2–3 個日振幅」的下界一起寫進 references。**
      ｜⚠ **並記下本日第三次資料源出錯**：**某搜尋摘要把 6531 的英文名寫成 "Aiptek"
      —— Aiptek 是天瀚科技，不是愛普。6531 是 AP Memory Technology。**
      **前兩次是 3221 的代號筆誤（3221 是台嘉碩、順達是 3211）
      與 6187 的 H1 成長率 +9.82%（法說為 +53.7%）。**
      **三次的共同點：二手摘要在「識別」與「已經算過的數字」這兩件事上最容易錯，
      而那兩件事恰好最不容易靠內部一致性檢查抓到 —— 它們必須靠外部知識或第二個來源。**
  - pair: "⚠⚠ 3583 / (3131 ＋ 6187) — 它是另外兩檔共用的同業，納入後迫使「清單內不作錨」的通則細化"
    added: 2026-09-10
    note: >
      **辛耘 3583 同時是 3131 弘塑與 6187 萬潤在建檔時列的同業之一。**
      **依 6805 那一檔收斂寫定的通則「清單內的標的不作為估值錨」，
      把它納入清單會同時抽掉兩檔的錨 —— 而那兩檔的同業倍數當時一個都還沒取得。**
      ⚠⚠ **決定性的理由不是「這樣很不方便」，而是那條禁令有一個壞的尺度性質**：
      **覆蓋清單越大，落在清單內的同業就越多；
      一條「讓清單變大時自己變得更沒用」的規則，多半是規格寫錯了。**
      ｜⚠⚠ **細化後的版本（本檔起適用）**：
      **錨可以是觀測值，不可以是我的判斷值。**
      **清單內標的的「市場觀測倍數」可用於序位對照，但必須在報告裡明寫
      「用的是哪一天的觀測值，且不得因我對該檔的判斷而調整」；
      其「目標價、應有倍數、情境倍數」一律不可用。**
      **且每次重估其中一檔時，必須檢查另一檔是否連動並明寫。**
      ｜⚠ **回頭檢查最初的 LITE／COHR，這個細化是相容的，而且更接近當時的原始處置**：
      **那次記下的做法本來就是「兩檔的錨各自獨立，但每次重估其一時
      必須檢查另一檔是否連動並明寫」—— 那正是細化後的版本，不是禁令。**
      **亦即 6805 的禁令版本才是偏離，本次是回到原本的處置並把理由講清楚。**
      ⚠ **實務後果**：**`state/3131.yaml` 與 `state/6187.yaml` 的 peers 章節
      應在下次 /revalue 時依此加註；不逕行修改（state 變動須有對應報告）。**
      ｜⚠⚠ **細化的第一個正面回報立刻出現：三檔的序位現在可以用觀測值做，不必再全部留空。**
      **（皆為 2026-09-09 觀測值）本益比 —— 3583 44.79 ／ 3131 46.65 ／ 6187 71.80；**
      **股價淨值比 —— 6.09 ／ 23.97 ／ 15.83；市營比 —— 5.11 ／ 10.09 ／ 17.73。**
