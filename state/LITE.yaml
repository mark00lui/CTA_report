driver_refs:
- driver: ai-accelerator-demand
  direction: '+'
  note: >
    加速器出貨 → 機櫃內外互連埠數 → 800G／1.6T 收發器與雷射需求。領先 2–3 季。
    ⚠ **與 COHR 的傳導性質幾乎相同（兩者是直接同業），但本檔的供給瓶頸在自有雷射產能** ——
    管理層明言「持續的供給受限」，並在擴充高功率雷射與光交換產品產能至 2028。
    ⚠ **本 driver 的 transmission 尚未列入本檔**，需於下次 `/driver` 補上以完成雙向引用；
    **單向引用在 validate_state.py 是 ERROR 而非 warn，會擋 commit。**
- driver: accelerator-roadmap
  direction: '+'
  note: >
    互連規格世代 → CPO 導入時點與埠數 → 產品組合與毛利結構。領先 3–4 季。
    ⚠ **本檔與 COHR 同為該 driver 的 cpo 傳導對象，但兩者的第一手時程揭露程度不同** ——
    COHR 給了具體時點（初期營收 2026-12 當季、scale-up 曆年 2027 下半），
    **本檔的 CPO 料號進度本輪未取得**，列 gaps。
