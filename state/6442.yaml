    exit_multiple: 26
    multiple_basis: "錨 A（自身歷史，2026-08-31 首次取得，本檔自「無獨立估值基礎」升級）。歷年 trailing 本益比：2026 迄今 109.89／47.78、2025 72.97／25.50、2024 122.00／30.83、2023 32.41／9.20。⚠ 2023 排除（AI 前的舊光聖）。26x 對應 AI 期間 trailing 低點區間（2025 的 25.50、2024 的 30.83）換算的 forward 等值 —— 以 2026 共識 46.5 ÷ 近四季 33.80 = +37.6% 換算，25.50 trailing ≈ 18.5x forward。26x 高於該值，意即本情境不假設回到 AI 期間最低點，只假設成長動能停滯後的去化"
    tp: 1092
    narrative: EPS 42 = H1 實績 19.07 + H2 22.9，相當於 Q3／Q4 各約 11.5 與 Q2 的 11.21 持平 — 不是災難，只是動能停在這裡。26x 低於現況 34.8x
  base:
    p: 0.50
    p_basis: 訂單能見度已達 2026 年底、產能滿載兩班制、菲律賓廠已投產，執行面條件齊備
    key_assumption: 光通訊占比維持高檔、CPO 依既定時程；H2 溫和成長，Q4 加速使全年達市場估計
    eps: 46.5
    exit_multiple: 36
    multiple_basis: "錨 A（自身歷史，2026-08-31 自「無獨立估值基礎」升級）。前一版 base 35x 就是現價隱含值（1,630 ÷ 46.5 = 35.05x），依 valuation.md 屬放棄判斷，signal.conviction 因此被壓在低。本次取得歷年 trailing 本益比，三年平均約 50.5x；以 2026 共識 46.5 ÷ 近四季 33.80 = +37.6% 換算，**歷史平均的 forward 等值為 36.7x**。現況 forward 35.05x 較之折價僅 **4.5%**。判斷為【折價幅度小且大致合理】—— 與 3324 的情形明顯不同（該檔折價達 11%＋且基本面在加速）。本檔的折價有具體理由：單一客戶占比 63%，族群需求不等於它的訂單；且 CPO 時程只有管理層說法，缺乏自身揭露的驗證。取 36x —— 略低於歷史平均換算值 36.7x，高於現價隱含的 35.05x。⚠ 非現價隱含值，這一點與前一版不同"
