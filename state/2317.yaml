thesis: "爭點是營業利益年增 68% 為何只換到稅後淨利年增 30%"
thesis_since: 2026-09-10
# ⚠ 只留爭點，前提移入 key_variables 與 notes（LITE 那輪的教訓，AXTI 起沿用）。
#   前提（已確立、不是爭點）：**營收與營業層的成長都是真的，而且管理層已給前瞻** ——
#   2026 Q2 營收 2.53 兆元（季增 19%、年增 41%）、雲端網路占比首破五成、
#   營業利益 948 億元（年增 68%）、營業利益率 3.75%（歷年同期新高）；
#   前 8 月累計營收 6 兆 5,111 億元（年增 39.73%）；
#   管理層預期 Q3 營收顯著季增、AI 機櫃出貨量季增高雙位數百分比，
#   全年 AI 機櫃出貨量倍數以上成長（已上修）。
#   ⚠⚠⚠ **為什麼爭點是「換到多少」而不是「有沒有成長」**：
#   **營業利益年增 68%，稅後淨利只年增 30%。**
#   **「稅後淨利 ÷ 營業利益」自去年 H1 的約 83.7% 降到今年 H1 的約 64.5% ——
#   掉了約 19 個百分點。**
#   **而歸屬母公司的每股盈餘是那條鏈的最末端，也是本益比 16.61 的分母。**
#   ⚠ **可能的解釋至少有三個，本輪一個都沒查證**：
#   **業外損益（轉投資與匯兌）、有效稅率上升、少數股權（AI 機櫃的獲利若落在
#   持股未達百分之百的子公司，母公司只認列一部分）。**
#   **三者對估值的意義完全不同 —— 第三個甚至可能是結構性的、不會回來的。**

