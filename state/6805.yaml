notes: >
  ⚠⚠ **本檔把本日反覆出現的「清單內標的能不能當錨」這件事收斂成一條通則，
  而這是本檔最有價值的產出：**
  **清單內的標的不作為估值錨 —— 不論它是競爭者還是鄰居。**
  **理由不是競爭關係，是錨的價值在於它獨立於我的判斷，而清單內的標的不獨立。**
  ⚠ **本日累積的四個案例正好涵蓋四種關係，而處置全部相同**：
  **(1) LITE／COHR —— 同層直接同業，而且已經發生了循環引用（必須拆）；**
  **(2) 3324／3017 —— 同層直接同業、零和競爭（建檔前攔下）；**
  **(3) AVGO／3661 —— 不同層但零和競爭（從一開始就不入 peers）；**
  **(4) 本檔與 3324／3017 —— 同一個液冷迴路上的相鄰零件，不是零和（同樣不入 peers）。**
  **第 (4) 種證明這條規則與競爭關係無關 —— 那是本檔的貢獻。**
  ｜⚠⚠ **營收組合在一年內翻轉，這是本檔的核心事實**：
  **AI 伺服器相關應用營收占比自去年同期 19.2% 拉升到 55.7%，正式成為最大營收來源。**
  **這不是成長，是換了一門生意 —— 而任何 trailing 倍數的分母裡，
  有四分之三以上的期間描述的是舊的那一門。**
  ⚠ **而 thesis 問的不是轉型有沒有發生（已經發生），是 55.7% 是台階還是峰值**：
  **Q2 營收季減 10.08%，管理層的解釋是「手機與伺服器新舊產品交替」——
  這是一門按專案計的生意，營收天生是塊狀的。**
  **加上液冷快接頭產能已逼近滿載，55.7% 短期內沒有向上的空間 ——
  下一個變動只能是向下或靠擴產。**
  ｜⚠⚠ **本檔是兩門生意，因此整體市營比 9.83x 被明文禁用作為主錨 ——
  與 AAOI（資料中心 56%／CATV 42%）是同一個禁用理由，本日第二次。**
  ⚠ **但本檔的分部拆解有一個 AAOI 沒有的優勢**：
  **純轉軸廠（新日興 3376、兆利 3548）的伺服器占比接近零，
  因此它們的倍數就是「本檔那 44.3% 消費電子業務值多少」的直接參照。**
  **消費那一半的錨是現成的，缺的只是去查。**
  ｜⚠ **順帶校正一個我自己的用語錯誤，記在這裡以便日後修**：
  **我在 AAOI 那檔把「分部／企業／每股」稱為跨層級軸，
  但 valuation-map 對層級軸的定義是「股權（P/x）／企業（EV/x）」——
  分部拆解不屬於那個軸，它屬於分母軸。**
  **AAOI 的三軸宣稱因此有一項偏鬆，應於下次 /revalue AAOI 改正。**
  **本檔不重複那個錯誤：分部拆解記在分母軸，層級軸誠實標為未跨。**
