    ⚠ 且事實往相反方向走得更遠：管理層 2026-08-26 給出 FY2028 營收成長約 +70% 的遠期指引
    （隱含營收接近 700bn，而街上原本模型化約 570bn／+44%），並明言為供給受限而非需求上限。
