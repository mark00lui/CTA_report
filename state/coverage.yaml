full_revaluation_2026_09_10:
  scope: "19 檔全部重跑，價格一律為 2026-09-09 收盤（台股同日、美股同日），同一來源"
  outputs: "2 份 L2 報告（COHR、MSFT、META 另各一份，合計 4 份）＋ 15 檔 L1 不出報告；共 19 個 commit"

  ⚠_目標價幾乎沒有動: >
    **19 檔中只有 2 檔的加權目標價實質變動：COHR +9.4%、CEG +1.1%。**
    **而兩檔的變動都來自同業重評價，不是公司本身。**
    ⚠ **沒有任何一檔的目標價變動來自「公司自身的新基本面事實」。**
    本輪唯一碰到模型的基本面數字是 **6442 的 8 月營收（+152.24%）**，
    而它的作用是**確認** base 假設（自下而上複核得 FY2026 EPS 47.0，對 base 的 46.5 差 1%），
    **不是修改它**。
    ⚠ **這件事本身就是本輪最重要的輸出**：一個月內跑兩次全清單重估，
    第二次幾乎沒有新資訊 —— **這說明重估的頻率已高於基本面的更新頻率**，
    下一次應改由「財報季」而非「日曆」觸發。

  ⚠⚠_循環性檢查的聚合警訊: >
    **19 檔中有 7 檔的加權目標價落在現價 ±5% 內：MSFT +4.1%、MU +3.1%、6442 +2.0%、
    3324 +0.2%、TSM -0.3%、META -1.8%、6239 -2.1%。**
    **全清單中位數為 -0.3%。**
    ⚠⚠ **`references/valuation.md` 明訂：「多檔都落在該區間時，不得在覆蓋層聚合成
    『清單沒有明顯定價錯誤』」—— 本欄就是為了執行那條禁令而寫的。**
    **逐檔查過之後，這 7 檔至少有兩種不同的成因，不可混為一談**：
    ・**已判定為基準年假象（2 檔）**：**3324** 與 **6442** ——
      兩檔的位移測試都做出來了，滾動至 2027 後在任何合理成長假設下都移出 ±5% 帶外，
      且 3324 的 EPS×倍數敏感度網格呈**對角線分布**。**它們的「合理定價」是日曆的產物，不是判斷。**
    ・**錨被價格追上（4 檔）**：見下一格。
    ・**MSFT 是唯一一檔可辯護的**：26x 於 2026-08-27 由自身歷史換算得出，
      當時現價隱含 24.89x，**推導在前、價格在後，順序可查**。
    **→ 結論：本清單「看起來大致合理定價」的那 7 檔中，只有 1 檔是真的判斷。**

  ⚠⚠_錨被價格追上是本輪的系統性現象: >
    **四檔的 base 倍數當初推導都是獨立的，之後被價格走到旁邊**：
    ｜**3324** base 24x 對現價隱含 **23.98x**（設定於 2026-08-31，當時現價隱含 21.80x）
    ｜**6442** base 36x 對現價隱含 **36.56x**（設定於 2026-08-31，當時現價隱含 35.05x）
    ｜**META** base 19x 對現價隱含 **18.84x**（設定於 2026-08-27，當時現價隱含 16.60x）
    ｜**TSM** base 19x 對現價隱含 **19.77x**
    ⚠ **這與「抄現價」不同 —— 推導順序可查、當時確實獨立。但後果一樣：模型對市場沒有意見。**
    ⚠ **而現行流程抓不到它**：`valuation.md` 的獨立性辯護只問「推導當下是否獨立」，
    **不問「之後是否仍然獨立」。** 四檔全部通過了那個檢查，卻全部失去了意見。
    **建議下次修訂 valuation.md 時補一條：錨與現價隱含值的差距收斂到 2% 以內時，
