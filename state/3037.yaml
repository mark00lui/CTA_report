    +15% 明顯低於當前水準，也低於累計成長率的一半。這是第一條的**可量化代理** ——
    產地標示案若真的影響出貨，會最先反映在月營收上，而月營收是台股最高頻的一手數據。
    ⚠ 8 月營收（9/10 前公布）只涵蓋事件後 3 個工作日，不具檢驗力；實質檢驗自 9 月營收起。
- condition: 季度毛利率連兩季低於 20%
  check_by: 2027-05-31
  status: 未觸發
  note: >
    門檻於 2026-08-31 設定。錨點：2026 Q2 為 24.8%、Q1 為 17.96%。
    ⚠ Q1 的 17.96% 已低於本門檻，故本條的意思是「漲價流入損益的效果反轉且非單季現象」——
    Q2 相對 Q1 的 +6.8pp 跳升正是漲價的證據，連兩季跌回 20% 以下即代表漲價循環結束。
    毛利率比營收更適合當這條的指標：供給受限下需求先反映在價格不在量。
- condition: 2026 全年自由現金流轉為負，而同期 ABF 載板營收成長仍高於 30%
  check_by: 2027-03-31
  status: 未觸發
  note: >
    門檻於 2026-08-31 設定。錨點：2026 Q2 自由現金流 +14.20 億元（為正但薄），
    ABF Q2 YoY +51%。capex 自 340 億上修至 537 億是本季才決定的，Q2 尚未反映。
    條件刻意加上「ABF 成長仍高於 30%」，是為了排除「需求變差導致現金流差」這個不同的故事 ——
    本條要抓的是「生意很好但現金留不住」。
    ⚠ 這條與 COHR 的第一條 falsifier 同構。兩檔都是供給受限的 AI 零組件廠、都在缺貨期
    大舉擴產，差別在 COHR 的自由現金流已經是 -10.2 億美元，本檔還是正的 ——
    但本檔的 capex 上修尚未反映。**觀察順序上 COHR 領先本檔**，可用它預判本檔。
