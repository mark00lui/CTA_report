notes: >
  ⚠⚠ **代號更正必須放在最前面，因為本倉庫已經犯過一次同類錯誤。**
  **指令給的是「3221 順達」，但 3221 是台嘉碩（上櫃，市值約 50.76 億元），
  順達科技是 3211（上櫃）。名稱明確、代號差一碼，判定為筆誤，依名稱建檔。**
  **valuation-map 裡記著「⚠ 不是 3413，3413 是京鼎——本倉庫犯過這個錯」——
  這是第二次，建議在 references 加一條：建檔時先用名稱與代號互相驗證，兩者不合就停下來問。**
  ｜⚠⚠ **本檔是本日十二檔中唯一盈餘在下滑的，而它的本益比是 49.46 倍。**
  **Q2 EPS 1.35 元（年減 65%）、H1 累計 3.4 元（年減 31%）、TTM 7.41 元。**
  **對照同日的 8299：本益比 9.55 倍而 EPS 創 40 季新高。**
  ⚠⚠ **兩者是同一個陷阱的兩端，而 valuation-map 只寫了一半**：
  **原文對 trailing PE 的警告是「⚠ 說謊時：循環頂（低 PE 看似便宜）」——
  本檔是另一半：轉型谷（高 PE 看似昂貴）。**
  **建議把那一條補成雙向的：分母被膨脹與被壓縮都會讓 trailing PE 說謊，方向相反而已。**
  ｜⚠⚠ **敘事與季度數字互相矛盾，而這就是 thesis**：
  **管理層說「以 BBU 為核心的非 IT 業務占比今年首度突破整體營收五成」，
  但 Q2 的實際非 IT 占比降到 25%–30%，且 Q2 的成長來自 IT 產品。**
  ⚠ **而算術讓這個爭點變得很尖銳**：
  **H1 非 IT 約 18.8 億元；全年若要超過 50%（約 74.5 億元），
  H2 的非 IT 須達約 55.7 億元，佔 H2 營收（約 80 億元）的約 70%。**
  **「全年破五成」隱含的是下半年要衝到七成 —— 那不是一個溫和的假設，
  而第一條 falsifier 的 40% 門檻正是這條路徑上的最低中途檢查點。**
  ⚠ **但要公平地說：管理層把 Q2 的問題指名為「BBU 某一機種客戶拉貨低於預期」，
  而由單一機種主導的業務本來就會這樣跳 —— 一個機種放量就能跳一大截。**
  **「有可能」與「有可能落空」同時成立，這正是 thesis 該問的形狀。**
  ｜⚠⚠ **「A7 土地潛值逾百億」超過整個帳面淨值（約 89.6 億元），也接近市值的兩成。**
  **這使 Q4 象限處方裡「選擇權拆分」那一半第一次真正用得上 —— 本日十二檔中的第一次。**
  **對照前十一檔：2345 我推翻了 Q4 的主錨、AAOI 與 3081 的 Q3 兩個主錨都不能用、
  8299 是分類軸沒有覆蓋到、6805 的整體市營比被禁用 —— 本檔是第一次處方直接用得上。**
  ⚠ **但它只有一句法說說法，沒有外部估價 —— tier 只能是假設，
  它可以用來界定範圍，不可以用來報一個數字。已設為第四條 falsifier。**
  ｜⚠⚠ **本檔為「先看去年那條線的形狀」這個判準補上了第三種情況，而它是最麻煩的一種**：
  **3081 的基期是平的 → 年增率可以直接讀；**
  **3017／6805／8299 的基期是單調斜的 → 年增率被系統性放大或縮小，改用絕對金額或月增率；**
  **本檔的基期是不規則的，而本檔 2026 年的月營收同樣不規則 ——
  兩年形狀都不規則時，年增率與月增率都不可讀，只有累計或季度有訊號。**
  **實務後果：本檔的第一條 falsifier 因此不用月營收，改用季度的 BBU 占比 ——
  這是本輪十二檔中第一次月營收完全不能當 falsifier 的錨。**
  ｜⚠ **rank_metrics 第五次執行「確認不到就換掉」，但拒絕的理由是新的類型**：
  **前四次都是「同業頻率不對等」（3081 的 IQE 只有半年報、8299 的 SIMO 是美股季報），
  本次是「兩年都不規則」—— 指標本身取得得到，但讀不出訊號。**
  **這兩種失效應該分開記：一種是拿不到，一種是拿到了也沒用。**
  ｜⚠ **本檔是本輪第一檔「均線的距離本身沒有問題」的標的**：
  **季線距現價 +5.19%，且高於一個日振幅 4.39% —— 兩端都不越界。**
  **前十一檔不是太遠（AXTI -74.2%／-33.6%、6805 -25.21%、3017 -20.25%）
  就是太近（3661 +0.30%、8299 -0.02%）或根本取不到（LITE）。**
  **那條雙邊規則的「可用」定義，在本檔身上第一次得到一個正面的樣本。**
  ⚠ **但 invalidation 仍留空 —— 價格在季線之下 4.93%，已經跌破的線不能當失效價位。**
  **季線在這裡是壓力不是支撐，故填進 resistance 與 confirm_trigger。**
  ｜⚠ **刻意不引用 `accelerator-roadmap`，理由記在這裡以免下一輪誤以為是漏掉**：
  **BBU 的單位價值取決於機櫃功率密度而非加速器顆數，真正的傳導變數確實住在那個 driver ——
  但本檔的產品規格與機櫃功率的對應關係完全未取得，引用它會是一個我無法驗證的宣稱。**
  **記錄「刻意不引用」與記錄「引用」一樣重要（3533 那輪起的做法，本檔是第二次）。**

