# 結論：**集中度與可檢驗性同時上升。** 這兩件事通常反向，本次同向，是罕見情形。
# 判讀時不要只看 25.0% 就認定 cpo 曝險惡化了三分之一 —— 它確實惡化了，
# 但同時第一次有了可以提前知道自己錯了的機制。
