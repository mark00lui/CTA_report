    **推導：Q2 淨利 ＝ 4.62 × 1.01769 ＝ 4.702 億元（÷ 營收 12.21 ＝ 淨利率 38.5% ✓ 與法說一致）；
    法說 H1 EPS 7.75 × 1.01769 ＝ 7.887 億元 → Q1 淨利 3.185 億元 ÷ 3.44 ＝ 0.9259 億股
    ＝ 1.01769 ÷ 1.10 ✓✓✓**
    ⚠⚠ **而這一個原因同時關閉了建檔時記下的全部四個 TTM EPS 歧異**：
    **11.56 與 11.80 都是未還原的（偏高）；法說的 7.75 是還原後的 H1（正確）；
    財報狗／wantgoo 的 8.06 是未還原的季加總（偏高 4.0%）。**
    ⚠⚠⚠ **規則：股票股利汙染兩個地方 —— 均線，以及季 EPS 加總。現金股利只汙染均線且程度小
    一個數量級（6805 配現金 12.5 元，均線偏誤 ≤0.60%、EPS 加總無誤差；本檔配股票 1 元，
    均線偏誤 ≤6.2%、EPS 加總誤差 5.7%）。**
    **季 EPS 加總的誤差沒有任何外觀異常 —— 唯一的檢驗方法是用淨利（股數無關）反推。**
    ｜⚠⚠⚠ **2026-09-11 新增第三項：禁用「自己的 forward 倍數對同業的 trailing 倍數」。**
    **本檔實測：不對稱口徑（本檔 2027 滿載市營比 18.5 對 2455 的 trailing 24.12）→ 便宜 23%；
    同口徑（兩邊都 trailing：72.4 對 24.12）→ 貴 3.00 倍。同一對標的，結論反向。**
