  summary: 工商時報 2026-08-31 報導（何英煒）——SEMICON Taiwan 2026 先進封裝檢測平台，揭露半導體應用占比約 1 成、7 成研發人力投於先進封裝檢測，及前七月 EPS 8.87（達 2025 全年 84.5%）。⚠ 順此取得毛利率序列，象限自 Q4 改判 Q1，並更正建檔時混用兩天價格口徑的六個衍生值
  delta: >
    **定級 L2，同時滿足三條門檻**（任一即足）：
    (1) **象限漂移 Q4 → Q1**（依 /revalue 步驟 1b：漂移本身即構成 L2）；
    (2) **key_variable 增減**：新增「半導體與先進封裝應用占比」，
        「分析師覆蓋」併入「對同業的估值折價」；
    (3) **方法組合改變**：primary 錨改用市值／營業利益口徑；check 由 P/S 改為營益率與費用率序列；
        選擇權自「不適用」改為「適用，但屬 bull 的來源而非 base 的組成」。
    ⚠ **不是 L3**：五條 falsifier 無一觸發，且 thesis **未被推翻** ——
    被推翻的是**框架**。thesis 講「本益比折價」，那本來就是 Q1 的論證，
    是我宣告的象限與自己的 thesis 不一致，而毛利率資料把它照了出來。
    ⚠ **L2 要求重跑三情境與重算目標價，本輪做不到，明寫而非充數**：
    三情境仍全為 `__`。建檔時列的兩個 load-bearing 缺口，**本輪關掉一個**（毛利率），
    **剩下的是「無共識 EPS」**（結構性，無分析師覆蓋）**與機率須由使用者指定**。
    可提供的是自行推導的 run-rate（**來源等級最低的那一級，不得當成共識，也不構成目標價**）：
    前七月 EPS 8.87 → 線性 ×12/7 = **15.21**（對 2025 的 10.49 為 +45.0%）；
    若 H2 維持 7 月的 1.51/月則 **16.42**（+56.5%）。換算 270 收盤為 **17.75x 與 16.44x**。
    ⚠ **本輪關閉四個缺口：**
    **① 毛利率與營益率序列（建檔時最重要的空白）** ——
    FY2024 **59.53%／31.92%**、FY2025 **58.36%／35.34%**、TTM(26Q2) **59.10%／36.25%**。
    **thesis 的核心觀察「EPS 年增 75% 對營收年增 23.92%」現在有答案，且是三選一裡的第三個：**
    **不是毛利率**（三年帶寬僅 1.17pp，TTM 還低於 FY2024）、**不是業外**（上限約一成）、
    **是營業槓桿** —— 費用率 27.61% → 23.02% → **22.85%**；
    兩年營收 **+50.0%** 而營業費用僅 **+24.2%**（1,755M → 2,179M）。
    ⚠ 必要但書：**營業槓桿不可長期外推**，費用率已走了大半，再往下的空間遠小於已走過的。
    **② 半導體與先進封裝應用占比 = 約 1 成**（rank_metrics 第二項）。
    ⚠ **1 成營收對 7 成研發，這個落差推翻了建檔時「沒有業務線可拆」的判斷**，
    但它有兩種相反解讀（選擇權 vs 投資效率不佳），**在當下財報上長得一樣**，
    分辨方式是看該占比未來幾季會不會動，已寫入 changes_if 與 checkpoints。
    它同時解釋了本檔營收成長 +28.2% 為何落後致茂的 +61.6%：**主力仍是 SMT。**
    **③ 前七月獲利**：稅後純益 20.96 億元、EPS **8.87**（達 2025 全年 10.49 的 **84.5%**）；
    7 月單月淨利 3.57 億元、EPS **1.51**，單月創歷史新高。
    三處內部一致性已核對：8.87 − H1 的 7.36 = 1.51 ✓；8.87 ÷ 10.49 = 84.6% ✓；
    20.96 億 ÷ 8.87 = 2.364 億股 ✓ 與 TTM 反推的 2.366 億股相同。
    由此另得：7 月單月淨利率 **34.6%** 高於 H1 的 **32.3%**，與營業槓桿方向一致。
    **④ 錨 B 換口徑，而換口徑讓致茂的業外現形。**
    致茂 TTM：毛利率 61.07%／營益率 36.84%／**淨利率 41.12%** ——
    **淨利率高於營益率，業外淨貢獻 +1,728M，它的 PE 57.02 建立在被業外墊高的 EPS 上。**
    ｜市值／營業利益：本檔 **18.48x** 對致茂 **63.50x** → **折價 70.9%**（PE 口徑為 64.1%）。
    ⚠ **而營益率幾乎相同：36.25% 對 36.84%，差僅 0.59pp。**
    **兩家在營業獲利能力上近乎同級，估值卻差 3.4 倍 —— 這是 thesis 目前最強的一塊證據。**
    ⚠ 兩邊皆未調整淨現金，用的是市值不是 EV，已列 gaps。
    ⚠ **象限自 Q4 改判 Q1，而錯的是 X 軸的輸入**：
    建檔時我用「52 週振幅 3.3 倍、距高點 -41%」論證「當期盈餘代表性低」——
    **那是價格的波動，不是盈餘的波動。X 軸問的是盈餘，我餵了它一個價格輸入。**
    這與本倉庫「機率不因價格波動而調整」是同一條紀律的另一面。
    Y 軸（低資本密集）不變，**但仍是推論**（PB 6.55、ROE 32.0%），capex／營收續列 gaps。
    ⚠ **本輪更正建檔當日的一個口徑錯誤，它讓六個衍生值全錯。**
    price 用 9/8 收盤 **270**，但 PE／市值／P/S／PB／每股淨值／ROE 全部沿用報價頁上
    9/7 收盤 **282** 口徑的比率。對齊後
    （隱含股數 = 3,118M ÷ 13.18 = **236.57M**；236.57M × 282 = 66.71B ≈ 頁面 66.61B，確認為 282 口徑）：
    ｜PE **21.40 → 20.49**｜市值 **666.13 → 638.7 億元**｜P/S **6.98 → 6.70**
    ｜PB **6.84 → 6.55**｜每股淨值 **39.47 → 41.23**（39.47 = 270÷6.84，正是混口徑的產物）
    ｜ROE **33.4% → 32.0%**｜規模差 **14.2 → 14.8 倍**
    ⚠ **沒有任何腳本會擋下這件事。** 它是被「市值÷股價的股數對不上 EPS 反推的股數」
    這個算術交叉檢查抓到的 —— 與 3037 的 GDR 十倍錯誤、capex「4 billion 對 400 億」同一家族。
    ⚠ **falsifier 兩處異動，方向都對自己不利，故不需辯護**：
    ・第三條**更正錨點** 62.5% → **64.1%**（門檻 50% 未動）——
      更正把起點**推離**門檻，讓「收斂」更難成立。
    ・第四條**重錨並拆分**：毛利率門檻 **40% → 55%**，業外條件拆為獨立的第五條。
      ⚠ **必須承認原門檻的設計失敗**：40% 低於已觀測區間下緣 **18.36pp**，
      **它不是設得寬，是設得等於沒有。**
      重錨的正當性來自兩件事：建檔時已**明文**標註它是佔位並承諾取得序列後重設（事前承諾），
      且重錨在**資料到達的當下**執行（非挑時點）。
      ⚠ **且新門檻比舊門檻更容易觸發 —— 我是在證據對我有利的當天把 falsifier 收緊。**
      ⚠ **對照 8046**：該檔第三條同樣門檻失準卻**刻意不改**，因為當時股價已跌 16.7%，
      改門檻等於在可能轉偏空的方向上移動球門。
      **兩案的差別不在門檻是否失準，而在改動的時點是否對自己有利。**
    ・第五條**新增**（業外占稅前淨利 > 15%）：門檻設在推導上限（約一成）之上，有觀測基礎，非佔位。
    ⚠ **補上 driver_refs（建檔時漏了，而 factor_tags 早就掛著 ai_capex_hw）**：
    指向 `accelerator-roadmap`，direction `+`，**lag 領先 4–6 季 —— 明確長於 6239 的 3–4 季**。
    理由：本檔賣的是檢測設備，客戶是 EMS／PCB／封測廠，
    **roadmap 定案 → 客戶決定擴產 → 設備招標 → 驗證 → 認列，每一環都可能吸收掉變動**；
    6239 是直接服務 AMD／Broadcom 的封裝廠，本檔隔了一層客戶的資本支出決策。
    已同步在 driver 的 transmission 補上回指，方向一致。
    ⚠ **訊號維持中性／低，但兩者的理由都變了。**
    **不給偏多**：技術面仍是完整空頭排列，價格 270 低於除 MA240(248.50) 外的所有均線，
    當日 **-4.26%**、量能 **0.77 倍**、距 MA60 季線 **+11.5%**。
    **依 SKILL.md，基本面理由再強也不跳過右側確認 —— 而本輪基本面理由確實變強，
    這正是那條規則存在的時刻。**
    **不給偏空**：基本面明確向上且本輪獲得實質佐證。
    **信心維持低**：建檔時四個理由中兩個已消除、一個仍在（capex）、
    **一個結構性且不會消除（無分析師覆蓋 → 錨寬度算不出來）**。
    **關掉四個缺口而信心不升等，就是最後那一條在管 —— 規則按設計運作，不是保守。**
    ⚠ **並新增一個關於我自己的低信心理由**：
    建檔當日混了兩天價格口徑，且**漏掉一則八天前就已刊出、直接回答我所列缺口的報導**。
    **證據品質的問題不只在資料端，也在流程端。**
    ⚠ **產品發表不是訂單，更不是營收。** TR7900Q SII-P、TR7950、TR7007Q SII-S、X-Ray
    四條產品線依證據分層屬**事實**（已發表），但**不可據以推導營收**。
    checkpoints 已寫明 SEMICON 會期要看的不是規格，是有無客戶驗證或訂單的說法。
- date: 2026-09-08
  level: '—'
  summary: 建檔。2026 Q2 EPS 3.86 元（年增 75%）、營收 29.4655 億元（年增 23.92%，連 3 季成長）；H1 累計 EPS 7.36 元（年增 58%）；7 月營收 10.33 億元（年增 38.19%）；TTM EPS 13.18 元（+54.9%）、TTM 營收 95.4 億元（+28.2%）
  delta: >
    新增追蹤標的。**本檔是第一檔在建檔階段就完成 valuation_frame 的標的。**
    **象限判為 Q4**（低資本密集 × 低盈餘代表性）：
    資本密集度低由 **PB 6.84 與 ROE 33.4%** 推論（⚠ capex／營收未取得，這條腿是推論，已列 gaps）；
    盈餘代表性低由 **TTM EPS +54.9%、Q2 年增 75%、52 週振幅 3.3 倍、距高點 -41%** 判定。
    ⚠ **Q4 的處方中「選擇權拆分」對本檔不適用** —— 沒有尚未貢獻營收的業務線可拆。
    **兩個錨都在建檔時取得，這正是把步驟 5 前移的目的**：
    ・錨 B（主）：致茂 2360，PE **57.02**／forward PE 41.54／P/S **23.39**
      （stockanalysis，**as-of 2026-09-08 13:24 CST**）
    ・錨 A（副）：自身歷史 trailing PE，**限 2024 年後的 regime 15–34x**
      （histock，as-of 2026-09；⚠ 2022 為 8–13、2023 為 7–14，2024 前後有明顯 regime shift，不可混用）
    ・檢查器：P/S 對照 —— 本檔 **6.98** 對致茂 **23.39**，折價 **70.2%**
    跨兩軸：**參照**（同業 vs 自身歷史）與**分母**（盈餘 vs 營收）。
    ⚠ **建檔階段立刻暴露一個無法克服的限制：本檔沒有分析師覆蓋。**
    forecast 頁回 404、forward PE 為 n/a、無目標價、無共識高低分布。
    **錨寬度算不出來不是「資料還沒查」，是這個標的沒有那個東西** ——
    依 SKILL.md，信心不得因缺口減少而升等，**即使日後補上毛利率與資本支出，
    信心上限仍在「低」**。
    ⚠ **thesis 的爭點是估值折價本身，這在本清單中是第一次**：
    「本益比 21.4x 對致茂 57.0x 的折價（**62.5%**）屬規模與無覆蓋的結構性折價，
    還是會隨獲利成長持續而收斂」。折價有具名的合理成分 ——
    規模差 **14.2 倍**、營收成長 +28.2% 對 +61.6%、致茂有 AI 伺服器電源測試曝險。
    **爭點不是「該不該折價」，是「62.5% 是不是折過頭」。**
    ⚠ 該 thesis 有一個特有風險已寫進第三條 falsifier 的但書：
    **折價可能因致茂下修而收斂，那不等於本檔被重評價** —— 判定時須同時看兩邊的絕對倍數。
    ⚠ **三情境刻意不建**：兩個 load-bearing 的輸入都還沒有 ——
    毛利率未取得（而 thesis 的核心觀察正是「EPS 年增 75% 對營收年增 23.92%」，
    **驅動來源未經證實**），且無共識 EPS 可用。
    依 valuation.md，錨拿不到時應明寫而非填一個看起來合理的數字。
    四條 falsifier：三條有數字門檻且未觸發，**最早驗證點為 2026-09-10 的 8 月營收**；
    ⚠ 第四條（毛利率相關）標為**未驗證**而非未觸發，因為**它的判定對象尚未取得**，
    且 40% 的門檻是暫定值 —— **已明寫它目前不是一條合格的 falsifier，只是佔位。**
    ⚠ 技術面：**完整空頭排列**（MA120 318.57 > MA60 301.18 > MA20 291.77 > MA10 289.70
    > MA5 289.10），價格低於除 MA240(248.50) 外的所有均線，距 52 週高 **-41%**，
    量能為 20 日均量的 **0.77 倍**。MACD 的 DIF 與 MACD 雙雙在零軸之下（OSC +0.12 剛翻正）。
    ⚠ **三個來源的價格與日期不一致，依錨五欄規則全部記下不擇一**：
    stockanalysis 270.00（9/8 13:20 盤中）／histock 270.0（標示 9/7 收盤）／
    wantgoo 282.00（標示 9/7，且均線與之同口徑）。
    282 → 270 恰為 -4.26%，最可能是 9/7 收 282、9/8 收在或接近 270。
    **price 採 270，但均線全部是 282 那一天的口徑 —— 兩者不同口徑，已明寫。**

