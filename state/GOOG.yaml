    **(B) 同業現金流序位複核（2026-09-09 收盤，三檔同步重取）**：
    P/FCF 失真倍數 GOOG **3.11x**／MSFT 2.19x／META **2.01x**（與 2026-09-01 記錄一致，本檔仍最嚴重）；
