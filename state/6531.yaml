    ｜⚠ **全距 1,400 ÷ 280 ＝ 5.00 倍超過 3 倍門檻**：算術 805 對幾何 **694**（-29.7%），差 15.9%。
    **但 EPS 全距 2.00 倍與倍數全距 2.50 倍相當，屬連續型不確定性
    （對照 3008 的 EPS 1.26 倍對倍數 3.75 倍，寬度幾乎全部來自二元事件）——
    所以本檔的算術加權仍是有意義的統計量，只是要並列幾何值。**
    ｜**缺口關閉 3 個（beta、華邦電倍數的年度歸屬、遠期共識的存在性與品質），新增 4 個** ——
