- date: 2026-09-11
  level: L2
  summary: 台股基準年修正連續作業第四檔 — 基準年自 FY2026 滾動至 FY2027（方法與分位一直是對的，錯的只是年度）；⚠⚠⚠ 而滾動讓兩個 state 曾明文稱讚的交叉檢查失效，其中一個本來就不是有效的檢查；加權目標價 4,965 → 5,646（+13.7%）
  delta: >
    ⚠⚠ **本輪要改的核心是一個欄位：`valuation_base_year: 2026` → `2027`**，
    依 references/forward-estimates.md §4（進入當年下半年後基準年滾動為 FY+2）。
    **本檔的三情境方法一直是對的（EPS 取共識分布的低／中心／高，與 3037 同型），錯的只是年度 ——
    這是本輪的第四種病型（2308 幻影 EPS／8046 單一券商／3037 無病／本檔年度停滯）。**
    **EPS 自 168.16／185.03／199.16（S&P 的 FY2026 低／均／高）改為
    182.48／209.37／229.89（FactSet 的 FY2027 低／中位／高，17 位，2026-07-27）。**
    **並依 §3 把中心值自平均改為中位數且兩者並列（209.37 對 209.01，差 0.2%，分布對稱）。
    三個倍數（12／24／45）一個字沒動 —— 沒有新的觀測錨出現。**
    ｜⚠⚠⚠ **而滾動基準年讓兩個 state 在 2026-09-08 明文稱讚的交叉檢查失效，
    而檢查它們為什麼失效比滾動本身更有價值 —— 兩個原因完全不同。**
    **① bear ≈ 52 週低（state 稱「最強的交叉檢查」）：舊 168.16 × 12 ＝ 2,018 對 52 週低 2,020
    僅差 0.1%；新 bear 2,190 比它高 8.4%。**
    **診斷：檢查的對象是一個價格，而價格是時間不變的歷史事實，bear 的 EPS 卻隨基準年滾動上升
    —— 所以它會自動失效。它是一個一次性的好檢查，不是可持續的錨。引用時必須寫上所屬基準年。**
    **但檢查變弱不等於方向錯：新 bear 2,190 仍在 52 週區間（2,020–7,995）之上，
    沒有假設一個從未出現的價位。**
    **② bull ≈ 街上目標高（state 稱「交叉檢查極佳」，8,962 對 9,000 差 0.4%）：
    ⚠⚠⚠ 問題不在它失效了，而在它本來就不該被當成檢查 ——
    街上目標價是**判斷值**，依 INTC 那一輪（2026-09-11）訂下的三層規則禁用為錨，
    而用它驗證自己的輸出是同一個錯誤的軟性版本。**
    **且 0.4% 的吻合度本身就該引起警覺：那種精確度通常意味著其中一邊是朝另一邊調的。**
    ⚠ **公平記下 state 在同一格裡另寫了相反方向的自我警告**
    （「仍高於街上目標隱含的 27.5x……這是本模型最脆弱的假設」）——
    **兩句話互相矛盾，而自我警告與自我稱讚同時出現時該信前者。**
    **處置：「街上目標高」降級為僅供對照的判斷值，並明寫新 bull 10,345 已高出它 14.9%；
    45x 維持不動（CPO 上檔本質上無法用歷史錨定），並把它列為缺口並指明取得途徑。**
    ｜⚠⚠ **第三件事是口徑，它不改目標價但改歸因**：
    **錨 A 是自身歷史 **trailing** PE（平均 15.8x），而 base 套在 FY2027 的 **forward** EPS 上。
    以 FY26→27 共識成長 +10.2% 折算，15.8x trailing 的 forward 等值是 14.34x。**
    **→ base 的拆解改寫為「24x ＝ 本業 forward 等值 14.34x ＋ CPO 溢價 **9.66x**」，
    而 state 原記 8.2x —— 低估 18%。**
    **而歸因是重要的，state 自己寫過理由：「把它拆開寫出來，日後 CPO 進度變動時才知道該動哪一段」
    —— 若 CPO 被證偽，要扣掉的是 9.66x 不是 8.2x。**
    **選擇權拆分（check）同步更新：本業 FY2027 EPS ≈ 167.9 × 14.34x ＝ 2,407，
    殘差 4,253 ＝ 現價的 63.9%（舊值 2,514／3,986／61.3%）。
    thesis 的「現價六成買的不是本業」仍然成立，而占比升高的兩個原因同向：
