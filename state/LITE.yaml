    **依 CTA 紀律，在右側確認無法判定時不得升為偏多，即使 52 週報酬達 +561.97%。**
    **「已經漲很多」從來不是評級的理由，「無法判定」更不是。**
    ⚠ **信心壓在「低」有三個具名理由**：
    (1) ⚠⚠ **錨寬度 70.7%（目標價 820–1,400，26 位分析師），是本清單至今最寬的一檔** ——
        對照 GOOG 39.7%、CEG 5.78%。**依 SKILL.md，錨寬度寬時信心不得升等。**
        **而錨寬度寬本身就是資訊：分析師對這檔的分歧程度遠高於清單其餘標的。**
    (2) **分部別營收占比與 CPO 進度兩個缺口都擋住主錨** —— 見 gaps 前兩項。
    (3) **象限判定卡在門檻上**（capex／營收 14.97%，距 15% 僅 0.03pp），
        **下一輪 capex 若再增即落入 Q3，整套方法要換。**
    ⚠ **已經確定的兩件事，先寫下來**：
    **(a) 營運拐點是真的** —— FY2026 營收 +83.22%、Q4 +109%、營業利益自 -192.2 轉為 +536.2、
        非 GAAP 毛利率 50.4%（+1,260bps）、提前逾一季達到目標營運模型。
    **(b) 而估值同時是族群最貴的** —— EV/Sales **29.08x** 對 COHR 8.57、FN 3.04；
