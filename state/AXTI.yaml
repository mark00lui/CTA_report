    **處置是依已發生數判 Q4（不拿計畫值當已發生），但把它列為每輪必問的第一題。**
  quadrant_since: 2026-09-10
  peer_group: 化合物半導體基板與晶圓（InP／GaAs／Ge／SiC 單晶與磊晶）
  peers:
