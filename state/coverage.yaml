  - pair: "⚠⚠ AAOI / (COHR ＋ LITE ＋ 6442) — 同層直接同業；並記一個新的風險科別：共用錨"
    added: 2026-09-10
    note: >
      **AAOI 與 COHR／LITE／6442 同屬「收發器與模組」這一層，是直接同業，預期相關性高。**
      **加上上游的 AXTI 與光學元件端的 3008，本清單的 optical 因子現在有了真正的層級結構：**
      **上游基板 AXTI ／ 收發器與模組 COHR、LITE、AAOI、6442 ／ 光學元件 3008。**
      ⚠⚠ **但 AAOI 帶進兩件此前沒有的事，都不是相關性而是結構問題：**
      **(1) 它有 42% 的營收（CATV）不在這條鏈上。** 這既是分散（一條與 AI 無關的需求），
      **也是盲點（三個 driver 沒有一個記它）。** 判讀 optical 因子的 27.3% 時必須記得
      **等權因子分布數的是標的數不是營收，所以那個數字高估了實際的 AI 光通訊曝險。**
      **(2) ⚠⚠ 共用錨風險 —— 這是與循環引用不同科但同源的一種，本清單第一次明確記下。**
