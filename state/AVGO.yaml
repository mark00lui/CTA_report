    ⚠ **軸③（時間）本輪新增為明確的方法**：FY2026E 11.64（共識）／FY2027 建構 18.47／
    FY2028 >30（公司指引）—— **本檔是清單中唯一三個年度都有數字的標的。**
    ⚠ **一個指向覆蓋清單其他標的的傳導**：管理層稱「限制是產能不是訂單」，
