    eps: 70.0
    exit_multiple: 17
    multiple_basis: "低於同業中位數 23.92 的 29%。錨在「獲利動能轉弱時市場給同業折價」—— 參照 TEL TE Connectivity 的 20.03（四家同業中最低的正常盈餘者，2026-09-10 基準）再打 15%。 ⚠⚠ **2026-09-12：EPS 70.0 與倍數 17x 皆維持，而本輪把它的門檻量化了。** **FactSet FY2027 共識最低為 92.20（18 位，2026-08-14），本情境低它 **24.1%** —— 需要具名機制，而本檔有，且是管理層自己說出口的**：`methods.check` 記著「Q1 的 49.55% 毛利率是 2025 年採購的低價原物料庫存的產物，而原料佔 COGS 已自 45–50% 升到 65%」。 ⚠⚠⚠ **本輪把它換算成數字：本情境隱含 FY2027 淨利率 ＝ 70.0 × 1.1243 億股 ÷ 共識營收中位 493.41 億元 ＝ **15.95%**，比最近一個乾淨季度 Q2 2026 的 **20.86%** 再低 **4.91pp**。以 H1 的毛利率 45.47% 與費用結構反推（毛利 45.47% − 淨利 23.22% ＝ 費用與稅約 22.25pp），若費用結構不變，**本情境要求毛利率降到約 38.2%，即自 45.47% 再掉 7.3pp**。** **→ thesis 的爭點（45.47% 是結構水準還是循環高點）第一次有了一個可在 Q3／Q4 財報上驗證的門檻。已列為檢驗點。**"
    tp: 1190
    narrative: "伺服器平台世代切換的貢獻被利潤率壓縮抵銷，盈餘回到 FY2025 水準，市場給同業最低倍數再折價"
  base:
    p: 0.5
    p_basis: "⚠ 沿用清單慣例，未經個別指定（同 bear）。"
    key_assumption: "FY2027 為 88.0 —— FY2026E 中性路徑 82.3（H1 39.05 ＋ H2 約 43.22，後者取 H2 2025 水準）再成長 7%。依據：2026 前 8 月累計營收 254.79 億元、年增 17.70%；伺服器佔營收 55.36% 且年增 71%。"
