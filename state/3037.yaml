  unit: 質性
  tier: 事實
  source: >
    桃園地檢署與調查局於 2026-08-28 同步搜索，帶回 1 位總經理與 1 位副總（公司重訊校正
    媒體先前報導的人數）；另有報導稱 PCB 事業處總經理以 1,500 萬元交保、副總以 1,200 萬元交保。
    公司重訊明確否認做假帳、內線交易與「觸怒美方地緣政治紅線」，稱均為誤傳。
    美系外資表示本案不影響 ABF 載板業務，僅涉含 HDI 的 PCB 產品（占營收約 36%）。
    ⚠ 市場的判讀與公司說法不一致：8/28 股價自盤中新高 1,230 急殺收 1,110（-70），
