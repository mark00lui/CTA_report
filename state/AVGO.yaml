      **MRVL 20.89／AVGO 19.51／NVDA 18.28，全距僅 14.3%；
      而營益率 16.81%／48.59%／65.21%，差 3.9 倍。**
      **一家營益率 16.8% 的公司，EV/Sales 比營益率 65.2% 的那家還高。**
    ・**自身歷史 forward PE 區間未取得**，錨 A 空的。
    ・**forward PE 基準年未確認**（頁面 20.68 隱含 EPS 17.31，對共識 FY2026 的 11.64
      隱含 30.75x，**差 48.7%**），錨 B 分母不明。
    **依 valuation.md，錨都拿不到時明寫並把信心上限壓到「低」——本檔正是那個情形。**
    **而它與 3030 那種「資料不夠」的低信心是兩回事：這是「資料夠而尺不夠」。**
    ⚠ **forward PE 的基準年問題與 NVDA 於 2026-09-07 記下的是同一個失效模式** ——
    **同一個坑兩天內出現在兩檔美股上。依缺陷 3，兩個數字都記，不挑一個。**
    ⚠⚠ **主錨因此改為成長持續期，並以選擇權拆分為副錨 —— 這是偏離 Q4 標準處方的決定，理由具名。**
    ⚠ **換分母是本輪最有價值的一次操作**：EV/Sales 族群全距只有 14.3%，
    換成 **EV／營業利益** 立刻爆開為 **4.4 倍**（MRVL 124.3x／AVGO 40.1x／NVDA 28.0x）。
    **軸①（分母）在這裡是唯一讓族群顯出結構的那一刀。**
    ⚠ 而結論對本檔不利：**本檔對 NVDA 溢價 43.2%，而 NVDA 營益率更高（65.21% 對 48.59%）、
    FCF 是本檔的 3.2 倍（127.01B 對 39.4B）、且是淨現金 23.61B 對本檔淨負債 35.44B。**
    ⚠ **反論同時記下**：本檔 TTM 嚴重落後 run-rate（EV/Sales 19.51x 對 Q4 年化 **12.49x**，
    **差 56%**），**在 run-rate 口徑下本檔可能反而最便宜 —— 但同業無同口徑數字，無法一致比較。**
    ⚠⚠ **thesis 來自一個 69 倍的對比，那是本倉庫至今最極端的一個。**
    49 位分析師對 FY2026 EPS 的分歧只有 **3.35%**（營收更只有 **0.85%**），
    **而目標價自 215.88 到 715，錨寬度 231.2%。**
    **他們對這家公司賺多少幾乎完全同意，對那些盈餘值多少完全不同意 ——
    爭點百分之百在倍數，零在盈餘。**
    ⚠ **EPS 錨寬度 3.35% 是全清單最窄（前次 CEG 5.78%），但明確不因此升信心**：
    口徑是非 GAAP，且 FY2026 只剩 Q4 而 Q4 已被指引。
    **窄反映的是「時間快到了」，不是「對價值有把握」。**
    ⚠ **本檔是清單第一檔「選擇權拆分真的做得出來」的標的**：
    Q3 分部 半導體 20,839M（70%，+127%）／軟體 8,752M（30%，+29%），
    其中 **AI 半導體 16,700M（半導體的 80.1%、總營收的 56.4%）**；
    年化為 AI **66.8B**／非 AI 半導體 **16.6B**／軟體 **35.0B**。
    ⚠ **但只完成一半 —— 分部別營益率未取得，還不能給各部分不同倍數。** 已列 gaps。
    ⚠ **反推的非 AI 部分成長溫和**（Q3 約 +20%、Q4 指引約 +13%）——
    **公司的成長幾乎完全來自 AI，非 AI 是一個成長 13–20% 的成熟基盤。**
    ⚠ **排序指標的取得性這次在建檔時先驗證了，是流程修正生效的第一次記錄。**
    3030 與 CEG 連兩檔都是「三個指標只有一個可用」，我當時記為流程問題。
    **本檔先查再寫定：營益率與 EV／營業利益三家皆已取得（三分之二可用）；
    AI 占比只有本檔有，且三家揭露口徑不同，即使取得也需先對齊定義。**
    ⚠⚠ **本檔在覆蓋層帶進一個此前不存在的結構：清單內部的方向相反。**
    本檔的 AI 營收**就是**超大規模業者自研加速器的採購金額 ——
    **若某家 CSP 自研轉外購（改買 NVDA），對本檔是營收減項而對 NVDA 是利多。**
    **這是清單內第一次出現「同一則消息對兩檔覆蓋標的方向相反」的結構性關係**，
    已寫入 `hyperscaler-capex` 的 driver_refs 註記。
    ⚠ **並發現 `ai-accelerator-demand` driver 的一個實質口徑缺口**：
    該 driver 的 current 明寫「NVDA + AMD，**不含**自研 ASIC」，
    **而本檔的 AI 營收正是被排除的那一塊（單季 16.7B、指引 21.7B、年增 221%）。**
    **該 driver 的現值系統性低估加速器總需求，且低估幅度正以三位數年增率擴大。**
