    **目標價 490 對現價 2,810 差 5.7 倍 → 依 §9b① 屬共識已過期。**
    FY2027 的外部參照仍是券商三家（外資 28.8／富邦 40.92／法人 40.04）。
    **錨定價 2,830（09-10 收盤）→ 2,810.00（09-11 官方收盤）**：
