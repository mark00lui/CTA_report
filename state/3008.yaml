    依 SKILL.md 於 2026-09-01 新訂的紀律：**「條件一旦滿足即執行，不論結果對現有論點
    有利或不利；若不執行，該理由本身將被記為一次校準偏差。」本次執行。
    這是該條紀律第一次真正被用到。**
    ⚠ **但 thesis 沒有被推翻，它被證實了。** 原 thesis 明寫「核心鏡頭 7 月已轉年減，
    爭點是新舊引擎能否接上」—— **8 月的 -16.23% 正是它指出要看的東西，
    而且缺口在擴大而非收斂。falsifier 觸發代表「該看的事發生了」，不代表「當初想錯了」。**
    thesis 因此**更新而非推翻**：爭點自「能否接上」改為「**缺口有多久**」。
    **步驟 1b：首次宣告 valuation_frame，象限為 Q4。**
    判準：TTM EPS +9.1% 而 **TTM 營收僅 +1.1%**（獲利與營收脫鉤）；
    核心鏡頭連兩月年減逾 10%；**CPO 當前營收為零**，管理層指引 2027 年中放量。
    ⚠ **Q4 的處方「選擇權拆分」本輪第一次做出來，結果是本輪最重要的數字**：
