    與單季淨利率的跳動（Q1 約 17.0% → Q2 約 40.6%，推算）。
    ⚠⚠ **Y 軸（資本密集度）＝ 高。**
    ⚠ **實際 capex／營收 與折舊占營收比重皆未取得（列 gaps）——
    只知道法說提到「下半年擴產」「隨產能陸續開出」。**
    判高的依據是業務模式與一個比率：**本檔是自有晶圓廠的記憶體 IDM
    （設計、製造、封測一體），與 valuation-map 現有的 Q3 成員 MU、SNDK 同類；**
