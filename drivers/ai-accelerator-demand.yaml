counter_signal:   # 2026-08-31 新增 —— 與 FY2028 +70% 指引方向相反，刻意並列
  as_of: 2026-08-26
  finding: >
    **以季增「金額」看，成長的絕對增量已不再放大。**
    Q3 FY27 指引 1,080 相對 Q2 的 962，季增 118；而 Q2 相對 Q1 的季增為 146。
    亦即：年增率仍達三位數、FY2028 指引仍有 +70%，但**每季新增的絕對金額由 146 降至 118**。
  tier: 事實（由公司公布數字與指引直接相減）
  source: REX Shares 分析指出此點；金額本身出自 NVIDIA 財報與 Q3 指引
  why_it_matters: >
    本 driver 現有的三條 falsifier 都看**年增率**或**QoQ 百分比轉負**，沒有一條看
    **增量的二階變化**。一個需求循環見頂時，最早的訊號通常不是成長轉負，
    而是「每季新增的金額停止放大」—— 那會比 falsifier 早好幾季出現。
    ⚠ 但單季不構成趨勢：Q3 為指引非實績，且 NVIDIA 明言供給受限，
    增量收斂可能反映產能而非需求。**連兩季才有意義。**
  action: 列為觀察，Q3 實績（約 2026-11）公布時檢查增量是否續降。若連兩季收斂，考慮升格為第四條 falsifier

supply_commitment:   # 2026-08-31 新增 —— 記憶體需求的第一個一手量化證據
  as_of: 2026-08-26
  value: 279
  prior: 119
  unit: USD bn（NVIDIA 對供應商的採購承諾）
  tier: 事實
  source: >
    NVIDIA Q2 FY2027 財報與 CFO Colette Kress 說明（2026-08-26）—— 採購承諾自三個月前的
    119 增至 279（逾一倍），公司明確表示增幅 primarily related to the procurement of memory。
    另揭露總未來承諾約 366（＝供應承諾 279 + 雲端協議 29 + 長期資料中心租賃與股權投資）。
  note: >
    ⚠ 這是「記憶體排擠 capex」主題第一次拿到**一手、量化、且來自公司財務長**的證據。
    notes/2026-08.md 於 2026-08-27 記下該主題已累積三次佐證卻拒絕晉升為 driver，理由是
    第三次為 TrendForce 經二手來源引用、未讀到原始報告，而前兩次是公司自己說的。
    本次補上的正是那個缺口：不是產業機構的推估，是 NVIDIA 自己為鎖定記憶體簽下的
    279 bn 承諾，以及它對自身毛利率約 3pp 的實際壓縮。
    ⚠ 方向要看清楚：對記憶體廠（MU／SNDK）這是需求利多，對加速器廠與其下游是成本利空。
    同一則消息方向相反，是常態不是例外。
  gap: >
    ⚠ 279 中記憶體占多少未揭露，只說 primarily。無法據此推算記憶體的絕對採購金額，
    也就無法與 TrendForce 的「記憶體占 CSP capex 68%」相互驗算。
  counter_view: >
    ⚠ 2026-08-31 併記供給側的反向警訊，避免本欄只留下單邊證據：
    摩根士丹利於 2026-08-29 示警中國記憶體崛起，**2028 年 DRAM 與 NAND 供給恐迎重大轉折**。
    tier 推論（單一賣方觀點，未取得原始報告）。
    ⚠ 它與本欄的需求證據不矛盾但時序不同：NVIDIA 的 279 bn 承諾是**未來 1–2 年**鎖料，
    大摩警告的是 **2028 年的供給反轉** —— 兩者可以同時為真，而那正是循環股的典型形狀
    （需求先到、供給後到、然後價格崩）。
    ⚠ 對 MU 與 SNDK 的意義：兩檔的基準年目前為 FY2027，2028 落在模型之外，
    故本次不改任何情境；但它是下次 /revalue 時判斷「循環何時見頂」的直接輸入，
    也是這兩檔 bear 情境該錨在哪的線索。此事實住在本 driver，不複製進兩檔 state。

