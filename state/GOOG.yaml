    (2) **Cloud 沒有乾淨的公開可比**（Azure、AWS 都不單獨上市），8–12x 營收的區間是本次最大擺盪項
        —— 它一項就造成每股 $240 到 $317 之間約一半的差距；
    (3) **稅率 17% 為假設值**，非查得的有效稅率。
