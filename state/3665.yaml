driver_refs:
- driver: hyperscaler-capex
  direction: '+'
  note: >
    CSP 資本支出 → AI 機櫃建置 → **高速線材、電源互連與線束**。
    一手佐證：**HPC 佔比自 1Q25 的 27% 大幅提升至 1Q26 的 45%**；
    2026 前 8 月累計營收 **626.33 億元新台幣（年增 40.01%）**、8 月單月 **88.92 億元
    （年增 53.99%）**。
    ⚠⚠ **而本檔對本 driver 帶進一個此前沒有的層次：機架層級（rack-level）。**
    **管理層明言「AI 基礎設施正從以伺服器為核心，逐步轉向機架層級架構，
    帶動電源交付、高速互連、光學整合與系統驗證需求」，
    並於 GTC 2026 推出大電流傳輸與高速資料傳輸兩大方案，對應產業走向 800 VDC 電源架構。**
    **本清單此前的標的多半對應「伺服器內的某個零件」；本檔對應的是「機櫃這個單位」。**
    ⚠ **扇出時的實務後果**：**若本 driver 的變動是「機櫃數」而非「伺服器台數」，
    本檔的彈性會大於零件供應商。兩者在資料中心的算法上不是同一個分母。**
- driver: accelerator-roadmap
  direction: '+'
  note: >
    互連規格世代與機櫃功率密度 → 高速線材的規格、以及電源架構自 54V 走向 **800 VDC**。
    ⚠⚠ **本檔在本 driver 上有一個雙軌佈局，扇出時不可只算一邊**：
    **銅（高速線材、大電流傳輸）與光（併入 XFS 後的光學實力）。**
    **管理層看好 HVDC 與光學互連的長期需求。**
    ⚠ **但兩軌的營收占比、以及 XFS 併購對毛利率的實際貢獻全部未取得** —— 列 gaps。
    ⚠ **時程性質**：**Q1 2026 的毛利率壓力被管理層歸因於「新世代 HPC 平台初期爬坡」，
    亦即本 driver 的世代切換對本檔是先壓毛利率、再放量 —— 順序不可顛倒。**
- driver: ai-accelerator-demand
  direction: '+'
  note: >
    加速器出貨 → 機櫃數 → 線材與電源互連的掛載量。
    ⚠ **敏感度記「高」，但必須先乘上占比**：**HPC 佔 1Q26 營收 45%，
    另約 55% 在電動車、工業、醫療與電器等非 AI 應用。**
    ⚠⚠ **而那 55% 有自己的循環，現有三個 driver 沒有任何一個記它** ——
    **這已是同一個結構問題的第五個實例**（前四次：CEG 的用電量、AAOI 的 DOCSIS 升級循環、
    3533 的 CPU 平台世代、6805 的摺疊裝置循環）。
    **五次之後，這四個 driver 的建議應該一起排程處理，而不是每次列一條。**

