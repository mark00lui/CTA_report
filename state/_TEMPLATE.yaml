# 公開研究檔範本 — 複製為 state/<ticker>.yaml。
# 本倉庫不含任何倉位資訊：無成本、無張數、無權重、無 Kelly、無損益、無持倉揭露。
# 未知值一律留 __ 並寫進 gaps，不要填看起來合理的數字。
ticker: __
name: __
market: __            # TW / US
factor_tags: []
valuation_frame:   # 估值方法組合 — 建檔時決定，每次 /revalue 複核。見 references/valuation-map.md
  quadrant: __            # Q1 盈餘倍數／Q2 現金流與企業價值／Q3 資產與循環／Q4 營收與選擇權
  quadrant_basis: __      # ⚠ 判準要指名數值：capex／營收（15% 門檻）、折舊占比、淨負債、循環位置、分母是否趨零
  quadrant_since: __      # 進入這個象限的日期。⚠ 象限漂移比倍數變動嚴重 —— 它代表整套方法要換
  peer_group: __          # 族群名稱
  peers: []               # ⚠ 多數族群在覆蓋清單內只有 1–2 檔，同業必須從清單外取
  rank_metrics: []        # 2–3 個排序指標，**事先**寫定。事後挑指標來支持已想好的答案是這一層的自欺
  methods:
    primary: __           # 主錨 — 依象限的處方選
    secondary: __         # 副錨 — 單一方法無法交錯驗證
    check: __             # 檢查器（PEG／Gordon PB／P/FCF 等），可留 __
  axes_crossed: []        # 主錨與副錨跨了哪些軸：分母／層級／時間／參照。⚠ 至少一個，最好兩個
  excluded: __            # ⚠ 明寫這個象限「不可以用」哪些方法，以及為什麼（例：Q3 不做 DCF、不算 PEG）
  reviewed: __            # 最近一次複核日期。超過 120 天 validate_state.py 會警告
thesis: "__"          # 一句話，且必須可否證
thesis_since: __

scenarios:
  bear:
    p: __
    p_basis: "__"
    key_assumption: "__"
    eps: __
    exit_multiple: __
    multiple_basis: "__"   # 倍數的錨。base 不得用現價隱含倍數 — 見 references/valuation.md
    tp: __
    narrative: "__"
  base:
    p: __
    p_basis: "__"
    key_assumption: "__"
    eps: __
    exit_multiple: __
    multiple_basis: "__"   # 倍數的錨。base 不得用現價隱含倍數 — 見 references/valuation.md
    tp: __
    narrative: "__"
  bull:
    p: __
    p_basis: "__"
    key_assumption: "__"
    eps: __
    exit_multiple: __
    multiple_basis: "__"   # 倍數的錨。base 不得用現價隱含倍數 — 見 references/valuation.md
    tp: __
    narrative: "__"
  weighted_tp: __

key_variables:         # 上限 6 個
  # kind 必填：量化 → value 只能是數值或 __；質性 → value 是散文且 unit 必須寫「質性」。
  # 「這一格該不該是數字」要寫下來，不能靠讀的人自己判斷。
  # unit 必須在受控詞彙裡（20 種，見 state-schema.md）；期間寫進 period、口徑寫進 unit_note。
  - {name: __, kind: 量化, value: __, unit: __, tier: 缺口, source: "", updated: __}
  # 帶修飾語時加 value_qualifier：點值／區間／下界（逾）／上界（近）／約值。
  # 區間必須同時有 value_low 與 value_high，value 取中點（衍生值，兩端未失）：
  # - {name: __, kind: 量化, value: 62, value_qualifier: 區間, value_low: 60, value_high: 64,
  #    unit: USD bn, tier: 事實, source: "", updated: __}
  # 質性變數：
  # - {name: __, kind: 質性, value: "一句話", unit: 質性, tier: 推論, source: "", updated: __}

cta:
  位階: __             # 右側確認 / 整理 / 破線 / 左側觀察
  price: __
  key_ma: __
  support: __
  resistance: __
  invalidation: __     # 技術面失效價位（規則參數，非個人停損）
  confirm_trigger: "__" # 右側確認條件：具體價格 + 量能
  updated: __

signal:
  rating: __           # 偏多 / 中性 / 偏空 — 研究結論，非交易建議
  conviction: __       # 高 / 中 / 低
  basis: "__"          # 為何是這個評級，一句話
  changes_if: "__"     # 什麼條件會改變評級

falsifiers:            # 至少 2 條，須有數字門檻與可驗證日期
  - {condition: "__", check_by: __, status: 未驗證}

checkpoints:
  - {date: __, event: "__", what_to_watch: "__"}

gaps:
  - {question: "__", how_to_close: "__"}

event_log: []          # {date, level, summary} — 只留最近 20 筆
                       # ⚠ 不得有 delta：事件的細節寫在該事件的報告裡，不要抄第二份回 state。
                       # state 是當下最佳判斷，不是日誌。validate_state.py 會擋下。

last_updated: __
