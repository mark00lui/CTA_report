    multiple_basis: "錨 A（自身歷史，2026-08-31 首次取得，本檔自「無獨立估值基礎」升級）。歷年 trailing 本益比：2026 迄今 109.89／47.78、2025 72.97／25.50、2024 122.00／30.83、2023 32.41／9.20。⚠ 2023 排除（AI 前的舊光聖）。26x 對應 AI 期間 trailing 低點區間（2025 的 25.50、2024 的 30.83）換算的 forward 等值 —— 以 2026 共識 46.5 ÷ 近四季 33.80 = +37.6% 換算，25.50 trailing ≈ 18.5x forward。26x 高於該值，意即本情境不假設回到 AI 期間最低點，只假設成長動能停滯後的去化 ⚠⚠ **2026-09-12：EPS 42.0 維持（基準年仍為 FY2026），倍數自 26x 改為 **26.61x**、目標價 1,092 → 1,118。** **改法是保留同一個 trailing 錨、改以更新後的 TTM EPS 34.59 與**本情境自己的**成長率換算 forward 等值：forward ＝ trailing 錨 × 34.59 ÷ 42.0。** ⚠⚠⚠ **而本情境的 trailing 錨被重算，因為 state 用 base 的成長率（+37.6%）換算全部三格：本情境自己的成長率是 42.0 ÷ 33.80 − 1 ＝ **+24.3%**，故真 trailing 等值 ＝ 26 × 1.243 ＝ **32.31x**（亦即 1,092 ÷ 33.80，與目標價反推完全一致）。** **⚠ 後果：state 說「26x 高於 25.50 trailing 換算的 18.5x forward，意即本情境不假設回到 AI 期間最低點」—— 結論正確而幅度被低報。真值 32.31x **高於 2025 年的 trailing 低點 25.50x 達 26.7%，也高於 2024 年的低點 30.83x 達 4.8%** —— 亦即本情境的倍數比 AI 期間任何一年的觀測低點都高，在倍數這一側相當溫和。** ⚠ **而本情境的 EPS 42.0 在 FY2026 的意思是「H1 實績 19.07 ＋ H2 22.9」，即 Q3／Q4 各約 11.5 與 Q2 的 11.21 持平 —— 本情境自己說「不是災難，只是動能停在這裡」。那個描述正確，而它也是本檔 EPS 全距只有 1.24 倍的原因（見 bull）。**"
