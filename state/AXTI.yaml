    ｜三情境**刻意不建立**：主錨的兩個分母都缺（FY2027 共識營收未取得；**「季產能 60／130」的口徑
    未確認 —— Q3 指引 66.0 已高於所謂 2026 年底的 60，兩者不可能同屬一個口徑**）。
    ｜評級**中性／信心低**。⚠⚠ **錨寬度 127.3%（55–125，僅 5 位分析師），本清單至今最寬，
    遠超前一紀錄 LITE 的 70.7%；低標比現價低 20.2%、高標高 81.4% —— 分析師連方向都沒有共識。**
    ｜⚠ **技術面無可用失效價位**：50DMA 距現價 **-33.6%**、200DMA **-74.2%**、52 週低 **-95.6%**。
    **這已是連續第二檔（前為 LITE）**，應視為方法問題：**均線作為失效價位預設了價格與均線的
    距離有界，急漲股違反這個前提。** 已列 gaps 並提出補一條 references 規則。
    ⚠ 另記：**空單佔在外股數 16.75%** —— 價格有相當部分是持倉結構的產物，
    **這是不得把近期強勢讀成右側確認的理由之一。**
    ｜四條 falsifier，第一條（**Q3 營收低於公司自訂指引 6,600 萬**，財報日已公告 **2026-10-29**）
    在 6 個月內可驗證且門檻取自公司自己的話。
    ⚠ **第四條刻意與 AI 需求完全無關**（同美香港上市與人民幣 3.244 億元贖回權）——
    **CEG 那一輪教會的事是：一檔標的若只有一條失效模式，通常是我只找到一條。**
    ｜⚠ **rank_metrics 三項在寫定的同一時刻逐項確認了取得途徑** ——
    **上一輪（LITE）記下的流程問題「寫定指標時沒有同時確認它取得得到」，本檔起改掉。**

