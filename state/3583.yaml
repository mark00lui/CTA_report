- date: 2026-09-12
  level: L2
  summary: 台股基準年修正連續作業第十四檔 — ⚠⚠⚠ 三情境 EPS 與三個倍數一個字未動、目標價完全不變，仍定 L2：PB／每點 ROE = PE ÷ 100 在本檔第二次出現且三情境全用它（系統性）；bull 的推導代數自相矛盾；三個倍數全是本檔 trailing PE 41.3 的固定變換
  delta: >
    ⚠⚠⚠ **本輪一個數字都沒改，而這正是報告要寫的東西。**
    **(1) 3017 那輪證明的恆等式 PB ÷ ROE(%) ＝ (P/B) ÷ (100E/B) ＝ **PE ÷ 100**
    在本檔第二次出現，而且三個情境全都用它 —— 所以它是系統性的，不是單一檔案的筆誤。
    三個數字再次全中：京鼎 3413 的 0.141 → 14.1（其 PE 14.04）、
    3131 弘塑的 0.410 → 41.0（其 PE 41.0）、本檔的 0.414 → 41.4（本檔 PE 41.3）。**
    **base 的核心論證「本檔 0.414 與 3131 的 0.410 幾乎相同 → 市場對這兩檔用同一套定價邏輯」
    因此讀作「本檔 PE 41.4 與 3131 的 PE 41.0 幾乎相同」—— 兩個早已並列的數字換句話說。
    而 state 對它的處置也建立在誤解上：它稱之為「兩個比率相差 1% 的巧合」，
    那不是巧合，是同一件事說兩次。**
    ｜**(2) ⚠⚠⚠ bull 的推導在代數上自相矛盾**：它寫「PB ÷ 每點 ROE 維持不變時 PE 可以略升」，
    而那兩者是同一個量 —— 該句讀作「PE 不變時 PE 可以略升」。
    **把它當成原意（PB 不變、ROE 上升）來讀，結論還是反的：PE ＝ PB ÷ ROE，
    ROE 上升而 PB 不變 → PE 下降。ROE 改善在這個關係裡是壓低 PE 的力量。**
    **→ 42x 只剩「略高於本檔目前的 41.3」，即 41.3 × 1.017。**
