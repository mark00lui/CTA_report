# 公開研究檔 — 本倉庫不含任何倉位資訊：無成本、無數量、無權重、無 Kelly、無損益、無持倉揭露。
# 未知值一律留 __ 並寫進 gaps，不要填看起來合理的數字。
#
# ⚠⚠ 建檔當下最重要的四件事，寫在最前面：
#   (1) **本檔是覆蓋清單第一檔以「資本支出擴建」而非「商品循環」進入 Q3 象限的標的。**
#       valuation-map 的 Q3 名單（MU／SNDK／3037／8046／6239）**全部帶 cyclical 標籤**。
#       **這是對地圖本身的發現：Q3 可以由擴建到達，不只由循環到達。**
#   (2) ⚠⚠ **營業利益從未為正，而且是在營收增加 173.8% 的同時變得更負**：
#       FY2023 -41.35 → FY2024 -70.91 → FY2025 -54.60 → TTM **-67.41**（百萬美元）。
#       **這與 LITE（一次性費用、營業利益 +5.362 億）和 AXTI（TTM 剛轉正 +3.88）都不同。**
#   (3) ⚠⚠ **42% 的營收是 CATV（有線電視寬頻接取），與 AI 無關。**
#       Q2 2026：資料中心 1.077 億 ／ **CATV 0.806 億** ／ 電信 0.034 億。
#       **整體 EV/Sales 15.04x 是把 AI 倍數套在一個四成是有線電視設備的營收基礎上。**
#       **本檔的主錨因此必須是分部別的，這不是精緻化，是不做就會錯。**
#   (4) ⚠⚠ **在外股數年增 49.26%，自 FY2023 的 3,840 萬增至 8,491 萬（+121.1%）。**
#       **營收年增 61.85% ÷ 股數年增 49.26% → 每股營收成長僅 +8.4%。**
#       **而公司自己的 Q3 EPS 指引用的是 9,280 萬股，比現在還多 9.3% —— 指引本身內含進一步稀釋。**
ticker: AAOI
name: Applied Optoelectronics
market: US
factor_tags:
- ai_capex_hw
- optical
- catv

driver_refs:
- driver: hyperscaler-capex
  direction: '+'
  note: >
    CSP 資本支出 → 資料中心光互連埠數 → 800G／1.6T 可插拔收發器。落後 2–3 季。
    ⚠⚠ **但本 driver 只解釋得了本檔 56% 的營收。**
    **另外 42% 是 CATV（有線電視寬頻接取），它的需求來自有線電視業者的 DOCSIS 升級資本支出 ——
    現有三個 driver 沒有任何一個記這件事。**
    ⚠ **這與 CEG 建檔時的結構問題同型**（那次是「沒有一個 driver 記用電量」）。
    **正確做法是新增 `broadband-access-capex` driver，而不是把 CATV 硬掛在超大型 CSP 資本支出上 ——
    兩者的出資者、循環與時程完全不同。** 在補上之前，本檔的 42% 在 driver 層是失明的。
- driver: ai-accelerator-demand
  direction: '+'
  note: >
    加速器實際出貨 → 收發器掛載量。落後 2–3 季。
    ⚠ 一手佐證：Q2 2026 資料中心營收 **1.077 億美元（+140% 年增）**，
    管理層稱 **800G 出貨量季增逾一倍**，且「**需求將超出產能直到 2027 年中**」。
    ⚠ **敏感度須連同稀釋一起讀**：本 driver 上修會推升本檔的**營收**，
    **但營收成長有八成被股數成長吃掉（49.26% ÷ 61.85% = 0.80），到達每股的只有 +8.4%。**
    **扇出時若只寫「營收利多」而不寫這一層，等於報告了一半。**
- driver: accelerator-roadmap
  direction: '+'
  note: >
    互連規格世代 → 800G 到 1.6T 的切換時點與每埠單價。領先 2–3 季。
    ⚠ **本檔是可插拔收發器廠，與 COHR／LITE 同層，但不押 CPO** ——
    產能目標明寫為「**800G 與 1.6T 產品**每月約 65 萬件」（現約每月 20 萬件），
    **故 factor_tags 未列 `cpo`。**
    ⚠ **這使它在 CPO 路線之爭上是中性的，但在「1.6T 何時放量」上是高度敏感的** ——
    **兩者不是同一件事，扇出時不可混用。**

valuation_frame:
  quadrant: Q3
  quadrant_basis: >
    **X 軸（當期盈餘代表性）＝ 低，且比 AXTI 更徹底。**
    EPS TTM **-0.79 美元**、trailing PE **n/a** —— ⚠ **分母不是趨零，是為負。**
    **營業利益從未為正**：FY2023 **-41.35** ／ FY2024 **-70.91** ／ FY2025 **-54.60**
    ／ TTM **-67.41**（百萬美元）。
    ⚠⚠ **而且是在營收自 217.65 增至 595.97（+173.8%）的同時，營業虧損自 -41.35 擴大到 -67.41。**
    **營業利益率自 -19.00% 改善到 -11.31%，但四個期間沒有一個接近零。**
    ｜**Y 軸（資本密集度）＝ 高，而且不是「略高」。**
    **capex／營收 TTM = 768.64 ÷ 595.97 = 128.97% —— 是 15% 門檻的 8.6 倍。**
    FY2025 **46.13%**（210.23 ÷ 455.72）、FY2024 **20.13%**（50.2 ÷ 249.37）、FY2023 6.57%
    —— **門檻是在 FY2024 跨過的，之後逐年加速。**
    ⚠⚠ **而最重要的一個比率是 129% 對 D&A／營收的 5.92%（35.3 ÷ 595.97）。**
    **這個落差本身就是結論：正在蓋的資產尚未投入服務、尚未開始折舊。**
    **它開始折舊的那一天，損益表會有一次階梯式的衝擊，而那一天還沒到。**
    ｜FCF TTM **-9.0045 億美元**；OCF TTM **-1.3182 億** —— **營運本身在燒錢，這還沒算 capex。**
    淨現金 **+1.996 億**（現金 4.9974 億 − 總負債 3.0014 億），
    ⚠ **但那是募資的快照，不是獲利能力的快照** —— TTM 發行新股 **13.51 億美元**。
    ｜⚠⚠ **本檔是覆蓋清單第一檔以「擴建」而非「商品循環」進入 Q3 的標的。**
    valuation-map 的 Q3 名單（MU／SNDK／3037／8046／6239）**全部帶 cyclical 標籤，本檔沒有。**
    **這是對地圖本身的一個發現：Q3 可以由資本支出擴建到達，不只由循環到達。**
    ⚠ **而 Q3 的處方對本檔恰恰是對的** —— 不做 DCF、不算 PEG、看資產與正常化，
    **對一家從未賺過營業利益的公司，這正是應該做的三件事。**
  quadrant_since: 2026-09-10
  peer_group: 光通訊收發器與模組 ＋ CATV／寬頻接取（⚠ 本檔是兩門生意，同業必須兩邊各取）
  peers:
  - >
    **中際旭創 Innolight（深圳 300308）** —— 資料中心光模組的全球量產龍頭。
    ⚠⚠ **取得它同時關掉 state/LITE.yaml 記了一條的缺口**
    （「缺它使族群樣本完全偏向美股，現有三家 COHR／FN／LITE 皆為美股」）。
    2026-09-10：股價 **¥889.77**、市值 **¥1.07 兆**、trailing PE **49.56**、**forward PE 17.70**、
    營收 TTM **¥652.3 億（+134.2%）**、淨利 **¥204.5 億（+200.4%）**、**淨利率 31.3%**、
    **P/S 16.4x**、52 週 ¥337.00–¥1,416.88（距高 -37.2%）、目標價 ¥1,290（+45.0%）。
    ⚠⚠ **這是本次建檔最尖銳的一個對照**：**本檔 P/S 15.38x 對它 16.4x —— 幾乎相同**，
    **而它淨利率 +31.3%、營收 +134.2%、forward PE 17.70；本檔淨利率 -9.57%、營收 +61.85%、
    forward PE 46.90。**
    ⚠ **但必須同時記下這個對照的四個限制，否則就是拿它當武器而不是當尺**：
