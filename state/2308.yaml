  # ⚠⚠ (a) 本來就該在 2026-09-11 的統一重錨裡做掉 —— 那一輪只做了 15 檔美股，24 檔台股尚未重錨，本檔是第一檔。
  # ⚠ 與街頭的距離：FactSet 共識目標價中位 2,565（2026-07-31，21 位）→ 本模型 -35.5%；
