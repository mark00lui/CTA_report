  basis: 廣告引擎本身沒問題（+27%、曝光 +14%、價格 +12%、DAP 36 億）。2026-08-27 重錨後估值空間自 +3.6% 擴至 +10.8%（加權 642 相對 579）—— 現況 forward 16.6x 較 5 年 trailing 平均換算的 22x 折價 25%，判斷折價有真實理由（獲利品質惡化）但幅度過度。然而技術面是清單中唯一的空頭排列，右側確認三段一段都沒成立 —— 依 CTA 紀律「已經跌很多」與「算出來便宜」都不是翻多的理由。也不給偏空：兩條 falsifier 都未觸發且距離不近，營業利益 18.78B 仍厚實
  changes_if: 三段右側確認全部成立（收復 592.52 → 站上 623.24 → 黃金交叉）→ 偏多；週收盤跌破 520.26、廣告營收成長跌破 15%、或 2027 capex／費用 guidance 上修逾 20% 而廣告成長低於 20% → 偏空；2027 指引出爐且費用成長率低於營收成長率 → 信心升至高
