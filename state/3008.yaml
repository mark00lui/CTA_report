    （沒有均線，且漲停期間沒有換手）。在這個狀態下給偏多等於純粹追動能。
    不給偏空：四條 falsifier 一條都沒觸發，而第一個驗證點（Q3 試產）根本還沒到。CPO 首張訂單、
    規格文件已收、7 月送樣、今年四度購地累計 56.49 億元 —— 這些是真的動作不是題材。
    在第一個時點到期前宣告它失敗，是把「定價過高」誤當成「故事是假的」。
    信心低有三個具體理由：基準年 2026 的 EPS 不含 CPO，模型結構與論點對不上；均線與 52 週低點
    未取得；街上目標價停在 2026-07-27、早於本週漲停，連我用來對照的外部參照都是過期的。
