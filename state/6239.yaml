    (＋) 時程領先約一年 —— 力成 2025-05 已小量出貨且有重量級客戶驗證（產品為 2nm SoC
         搭配 12 顆 HBM、整體封裝造價 25,000 美元／顆），同期日月光才要年底試產、2026 送樣。
         這是「全球第一家專業封測廠」第一次拿到非公司來源的支撐。
    (−)  面板規格落後 —— 510×515 只有日月光 600×600 的 **73%** 面積，而產業預期 600×600
         成主流。FOPLP 的整個經濟理由就是以更大方形面積攤薄成本（600×600 有效產能達
         300mm 晶圓數倍、降本最高約一成）。
    **兩邊量級相當，我沒有理由把機率往任一邊推 —— 機率是使用者的判斷，本次未動。**
    另一個變數的**數值不變但讀法改變**：該格的信心方向上升
    （2027 年中落在三個獨立時間常數之內，第四條 falsifier 的可達性上升）；
    `資本支出強度` 多一層 —— 若主流收斂到 600×600，400 億元的一部分可能是**競爭必要支出**
    而非可選擴張，該筆錢的性質從「成長投資」變成「可能含有防禦成分」，而防禦性支出的
    報酬率低於成長性支出。
    ⚠ **一個必須擋下的誤用**：事件文的「功耗自 100W 提升至 1,000W 等級」是**單封裝**口徑，
    而 drivers/accelerator-roadmap.yaml 已記 B300 單顆最高 1,400W。1,000W **低於**已在檔內的
    數字，是較粗的產業泛稱，對 3324 不構成新資訊。口徑不同的功耗數字並列時，
    先確認是同一個東西再更新模型。
    CTA：price 自 8/31 收盤 277 更新為 **9/1 收盤 284.00（+7.00、+2.53%）**，
    成交 1,491.3 萬股。⚠ **均線與 MACD／KD／均量仍為 8/31 口徑，price 與指標不同口徑。**
    284 高於昨日 MA5 280.10，但 MA60 季線 297.44 仍在上方（-4.5%）。
    ⚠ **量能是本日最該注意的一項**：0.91 倍，比 8/31 的 0.93 倍**更低** ——
    **上漲日的量能低於下跌日，這不是右側確認該有的形態。** 未構成位階改變。
    加權目標價 240 相對新現價 284 為 **-15.5%**（前為 -13.2%）——
    **這 2.3pp 全部來自價格移動，模型一個數字都沒動。**
    訊號維持中性／低。不給偏多的理由本日被**強化**（量縮上漲）；不給偏空的理由多一條
    （本次降低第四條 falsifier 的觸發機率）。信心維持低，並新增第七個理由：
    FOPLP 這條腿的競爭座標指向兩個相反方向，而公司未表態面板規格路線。
    四條 falsifier 門檻與日期全部不變（改了就失去約束力），但第四條補記一個例外情境：
    **若為跟進 600×600 而主動延後時程，該條會觸發但未必是壞消息** ——
    falsifier 的門檻會被公司自己的新決策作廢，屆時要看延後的理由。
    driver 層：`accelerator-roadmap` 新增 `foplp_layer_note`（此前該 driver 完全無 FOPLP 內容）。
    ⚠ 這裡有一個分層的判斷：面板尺寸、產能倍數、降本幅度、時間常數這些**產業級**數字
    住在 driver；「力成自己是 510×515、P11 月產 6,000 片」這種**個股級**事實住在 state。
    扇出 6239 L1、8046／3037 L0、TSM L0、3324 L0。
    ⚠ 對 8046／3037 記下一個**方向可能相反**的疑問：扇出型封裝以 RDL 取代部分傳統載板功能，
    機制上存在侵蝕 ABF 用量的可能。但本次無證據支持 —— 事件文把載板與矽橋並列為所需技術，
    且力成 P12 三樓明載「AI 晶片與 **ABF 載板**結合」，力成自己的 AI 產線是**用**載板而非取代它。
    **列為未證實的疑問，不是結論。**
    ⚠ 順帶更正 notes 中兩處計數：「五檔台股」應為「六檔」。
    ⚠ **本次最該記住的方法論**：若只讀那則報導就收工，這會是 L0。
    實質內容全部來自「拿它的座標去回查本檔」。
    **產業報導的價值不在它說了什麼，在它讓你能問出什麼。**
