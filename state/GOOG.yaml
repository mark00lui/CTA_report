driver_refs:
- driver: hyperscaler-capex
  direction: '-'
  note: >
    capex → 折舊費用 → 營益率；另受市場對 ROI 耐心的情緒放大。落後 2–4 季。
    Alphabet 的曆年 capex 成分住在該 driver，不在本檔複製 —— 這也是 資本支出 移出 key_variables 的原因。
