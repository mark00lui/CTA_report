driver_refs:
- driver: hyperscaler-capex
  direction: '+'
  note: >
    CSP 資本支出 → 晶圓代工與先進封裝擴產 → **自製濕製程設備、代理設備與再生晶圓**需求。
    ⚠⚠ **本檔對本 driver 有一個其餘兩檔設備商沒有的一手證據**：
    **公開揭露 2024 年對台積電的機台銷貨收入達 20.36 億元新台幣，較 2023 年的 9.29 億元
    大幅增加（+119%）。**
    **這是一個具名客戶的具名金額 —— 本清單十五檔裡少見。**
    ⚠ 另有：**2025 年再生晶圓月產能約 21 萬片，2026 年預計增至約 25 萬片**；
    公司稱**自製設備與再生晶圓 2026 年合計營收占比可望首度超過一半**。
    ⚠⚠ **但扇出時最容易算錯的是這一點**：**本檔的月營收極度平穩
    （2026 年 1–8 月全在 9.71–10.68 億元之間，全距僅 10%），
    而單季淨利率在四季內走過 24.5% → 8.2% → 11.1% → 14.0%。**
    **本 driver 上修若透過代理業務進來，營收會動而獲利幾乎不動；
    若透過自製設備與再生晶圓進來，獲利會動而營收幾乎不動。**
    **不分辨是哪一條路徑，扇出的方向可能是對的而幅度完全錯。**
- driver: accelerator-roadmap
  direction: '+'
  note: >
    先進封裝與製程世代 → 濕製程設備的規格、以及再生晶圓的規格與良率要求。
    ⚠ **本檔對本 driver 的曝險目前無法量化**：
    **自製設備與再生晶圓的個別占比、以及其中先進製程的比重全部未取得
    —— 只有「兩者合計 2026 年可望首度超過一半」這一句。**
    **扇出時應明寫「無法量化」而非「無影響」。**
- driver: ai-accelerator-demand
  direction: '+'
  note: >
    加速器出貨 → 晶圓代工與先進封裝的產能需求 → 客戶擴產 → 設備與再生晶圓訂單。
    ⚠ **敏感度記「中」，理由與 3131、6187 相同**：吃的是客戶的擴產決策而非出貨量。
    ⚠⚠ **但本檔多一層稀釋**：**代理業務的營收占比大而毛利低，
    本 driver 上修先打到的是那一塊 —— 對營收有感、對獲利未必。**
    **這正是本檔營收平穩而獲利劇烈波動的成因之一。**

valuation_frame:
  quadrant: Q4
  quadrant_basis: >
    **X 軸（當期盈餘代表性）＝ 低，而本檔的證明是本輪三檔設備商裡最乾淨的一次。**
    ⚠⚠ **單季淨利率在四季內走過 24.5% → 8.2% → 11.1% → 14.0%（推算，見 key_variables），
    全距 16.3 個百分點；而同期單季營收全部落在 28.13 至 31.20 億元之間，全距僅約 11%。**
    **營收幾乎不動而獲利率在 8.2% 到 24.5% 之間跳 —— 波動完全來自組合，不是量。**
    ⚠ **後果直接**：**TTM EPS 約 16.30 元是四個性質完全不同的季度的平均，
    而本益比 44.79 的分母完全取決於窗口位置。**
    ⚠ **且獲利方向是往下的**：**FY2025 EPS 約 18.20 元 > TTM 的 16.30 元；
    H1 2026 累計 9.16 元，年減 17.19%（Q1 年減約 49.6%、Q2 年增 75.79%）。**
    ⚠ **加上組合正在翻轉**：公司稱**自製設備與再生晶圓 2026 年合計營收占比可望首度超過一半**
    —— 當期描述的是翻轉的中途。
    ｜**Y 軸（資本密集度）＝ 判低，但這是本輪三檔設備商中最沒有把握的一格。**
    ⚠⚠ **實際 capex／營收 與折舊占營收比重皆未取得（列 gaps），而本檔有一個具體的理由需要它**：
    **再生晶圓是重資產業務，月產能自 2025 年的約 21 萬片擴到 2026 年的約 25 萬片，
    那是實質的資本支出，不是組裝業的擴線。**
    **若 capex／營收 > 15%，本檔應為 Q3（資產與循環）而非 Q4，整套方法要換。**
    ⚠ 判低的間接依據：**股價淨值比 6.09**（每股淨值約 **119.87 元**、淨值約 **100.52 億元**，
    對市值 **612.17 億元**）；**ROE 約 13.6%**；股東權益週轉率約 **1.19 倍**。
    ⚠⚠ **而這三項在三檔設備商裡都是最低的**（3131：51.4%／23.97／2.38；
    6187：22.0%／15.83／0.89；本檔：13.6%／6.09／1.19）——
    **股價淨值比只有 3131 的四分之一，這本身就暗示本檔的資產比另兩檔重。**
    **亦即間接證據指向的方向與 Y 軸的判定是相反的，這一格必須列為每輪必問的第一題。**
    ｜⚠⚠ **結論：低 X ＋ 低 Y（暫）＝ Q4。本輪十五檔中第九檔落在 Q4，
    但也是這九檔中象限判定最不穩的一檔。**
