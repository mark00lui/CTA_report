    ⚠⚠ **而修正錨定價不構成把評級改為偏多的理由 —— 它是校準修正不是新判斷，
    而 +7.7% 的幅度本身也不足以支撐方向性判斷（幾何加權甚至是 -3.5%，兩者跨越了零）。**
    ⚠⚠⚠ **這個修正同時翻轉了 base 的自我檢查，而那比目標價的變動更重要**：
    **以 cta.price 2,555 計，base 的 30 倍等於現價隱含的 30.06 倍（-0.2%）——
    會被判為「base ＝ 現價隱含倍數」那個被禁止的失敗模式；
    以 multiple_basis 用的 2,335 計則高於隱含值 9.2%，完全合格。**
    **→ 通則：循環性檢查之前必須先確認 cta.price 與所有 *_basis 裡引用的價格是同一個。**
    ✓✓ **遠期共識首次取得（FactSet 8 位）：FY2027 中位 103.19、FY2028 154.28。
    而 bull 的 110 高於共識中位 6.6% —— 本檔是本輪第一個通過「bull 必須高於共識中位」的標的。**
    ⚠⚠ **但 bear 落在共識完全沒有模型化的區域**：bear 的 50 隱含 FY2027 相對 FY2026
    共識中位 65.24 衰退 23.4%，而共識最低的 80.50 隱含成長 23.4%。
    **具名機制（淨利率留在 Q2 水準）只解釋了一部分 —— FY2026 共識已包含 Q2 的低淨利率。已列缺口。**
    ⚠ **與街上同方向但幅度差 64 個百分點**（共識目標價 4,000 為 +71.3%，本模型 +7.7%）——
    **分歧主要在 EPS（base 低於共識中位 17.6%）而非倍數，與 3081（分歧 100% 在倍數）相反。**
    ⚠ **conviction 維持低的主要理由**：同業定位是 trailing 口徑而 base 的 EPS 是 FY2027（年度錯配，
    而 base 的 30 倍正是由該定位反推的）；bear 的機制不完整；均線與 52 週高低仍未取得。
    ⚠ **「中性」在本檔的意思是「尚無估值判斷」，不是「多空平衡」。**
    三情境與加權目標價未建立（理由見 scenarios 註解）。
    ⚠ **技術面：價格在季線之下 10.14%，右側未確認 —— 依 CTA 紀律不得升為偏多。**
    ⚠ **信心壓在「低」有四個具名理由，而本檔的第一條比本輪其餘十二檔都嚴重：**
    (1) ⚠⚠ **三個排序指標的現值一個都沒取得**（毛利率、合約負債、營業利益率），
        **而副錨整個建立在合約負債上。三家清單外同業的倍數也一家都沒取得。**
        **本檔是本輪資料缺口最集中的一檔。**
    (2) ⚠⚠ **當期盈餘在半年內自己打臉**：Q1 淨利率約 29.5%、Q2 約 18.9%，
        **而 Q2 的營收還比 Q1 高 8.1%。用哪一季當基準都會錯。**
    (3) **管理層給的答案要等 18–30 個月** —— 3D 設備毛利率高出 2.5D 許多，
        **但占比要到 2027–2028 才顯著提升。**
