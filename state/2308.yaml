    與 2301 的 23.35x。**方向不隨基準年選擇翻轉，故可以給方向。**

scenarios:
  # 2026-09-10 首次建立。基準年 FY2027。
  # ⚠ 序位只調倍數不調 EPS：base 的 EPS 直接採市場反推值 51 未下修，獨立判斷全部放在倍數上。
  #   bear／bull 的 EPS 才動，因為那是營運情境假設（800VDC 成敗），不是序位調整。
  bear:
    p: 0.30
    p_basis: >-
      > ⚠⚠⚠ **2026-09-11：機率一個字未動（依規則機率是使用者的判斷），但它的語意變了，必須單獨記**：機率原本掛在**敘事情境**上，現在掛在**共識分布的百分位**上 —— 0.30 的 bear 現在的意思是「最悲觀的那一位分析師有三成機率對」，那不是同一個陳述。**內部一致性檢查：機率加權 EPS ＝ 0.30×41.08 ＋ 0.50×59.00 ＋ 0.20×80.91 ＝ 58.01，對共識中位 59.00 為 -1.7%、對平均 60.06 為 -3.4% —— 加權本身只有輕微偏保守，沒有因語意改變而引入大偏差。但語意的改變應由使用者確認。**
      ⚠ **高於慣用的 0.25，三個具名理由**：(1) 品質事件未解（VR 18.4kW PSU 電容器，
