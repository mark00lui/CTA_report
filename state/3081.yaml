    （state 自己的 key_variable 就寫前端 MOCVD「2027 Q2／下半年起貢獻」）——
    **改用年平均 2.0 倍後 base EPS 自 49 降為 39.24，而三家券商的 FY2027 中位是 40.04，差 -2.0%。**
