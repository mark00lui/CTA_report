signal:
  rating: 中性
  conviction: 低
  basis: >
    2026-08-27 重估後不給偏多的理由變強：加權目標價低於現價 24.2%（前為 5.3%）。
    變化來自首次取得自身歷史本益比區間 12–16x —— 現況 36.78x 是歷史上緣的 2.3 倍，
    而 base 只認列市場為 CPO 所付價格的 39%。且技術面完全無法判讀（沒有均線，
    三根漲停期間沒有換手）。在這個狀態下給偏多等於純粹追動能。
    不給偏空：四條 falsifier 一條都沒觸發，而第一個驗證點（Q3 試產）根本還沒到。CPO 首張訂單、
    規格文件已收、7 月送樣、今年四度購地累計 56.49 億元 —— 這些是真的動作不是題材。
    在第一個時點到期前宣告它失敗，是把「定價過高」誤當成「故事是假的」。
    信心維持低。原本三個理由中，「無獨立估值基礎」已於 2026-08-27 解除（取得五年區間 12–16x，
    本檔自錨等級「無」升為錨 A），但另兩個仍在：基準年 2026 的 EPS 不含 CPO，模型結構與論點
    對不上；均線與 52 週低點未取得，右側確認無從驗證。新增第三個理由 —— H1 營業利益僅 +5.5%
    而淨利 +44%，base 的分母 EPS 190 含相當比例的利息與匯兌，那部分不該享有同樣的倍數，
    但拆分所需的完整業外明細目前是缺口。
  changes_if: CPO 於 2026Q3 內確認試產且漲停打開後守住 6,290 → 偏多；月營收連兩月年減逾 10%、或 CPO 試產未於 Q3 內開始、或毛利率連兩季低於 45% → 偏空；取得 2027 共識 EPS（CPO 首次進入分母）或取得均線資料 → 信心升至中

