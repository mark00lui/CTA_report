    (2) **不確定性帶太寬** —— **稀釋一個變數就能把加權自 86.5 移到約 46。**
    (3) **位階是多空分界不是破位** —— 價格仍在 200 日均線之上（雖然只高 0.46%）。
    **為什麼不是偏多**：**加權目標價低於現價；且升級為偏多需右側技術確認，
    而價格在 50 日均線之下 11.73%。**
    ⚠ **信心維持「低」，六個具名理由：**
    (1) ⚠⚠⚠ **分部別毛利率仍完全未取得，第二次未關閉 ——
        而它是主錨的明文前置條件**（建檔時就寫「不同毛利率的公司不可比，
        valuation-map 對 EV/Sales 的警告就是這一句」）。
    (2) ⚠⚠ **資料中心側只剩一個可用同業**（LITE／COHR 依 6805 的通則移除、FN 是代工口徑不同）
        —— **依 3081 的規則，同業序位需至少三個可用成員。**
    (3) ⚠⚠ **base 的倍數缺乏獨立意見**（見 (1) 之外，這是 4b 分格檢查的結果）。
    (4) ⚠⚠ **稀釋的不確定性大於營收與倍數加總**（47% 對 20%＋15%）。
    (5) ⚠ **中際旭創的 forward PE 17.70 對應哪一個會計年度未確認** ——
        **若是 FY2026 而非 FY2027，forward 市營比那座橋（5.54x）會偏。**
    (6) ⚠ **只取得兩條均線**（50／200 日），失效價位留空。
    ⚠ **而必須公平記下的正面事實，免得被上面六條蓋掉：**
    **(a) 資料中心分部營收年增 +140%**（Q2 2026 的 1.077 億對去年同期 0.448 億）——
        **rank_metric ① 本檔領先或並列。**
    **(b) 淨現金 1.996 億美元（每股 2.35）** —— 不是負債累累的擴建；
        **且 capex 768.64 的口徑本次重查通過（現金流量表三者互洽）。**
    **(c) FY2026 的一致預估（10.4 億美元）有公司自己的 Q3 指引背書**（中值 2.725 億年化 10.9 億）。
    **(d) 六位分析師的目標價全部在現價之上**（低標 109 比現價高 5.53%，均值 163.40 為 +58.2%）。
    ⚠⚠ **(a) 到 (d) 同時為真，而 thesis 問的是
    「capex／營收 128.97% 的資產擴建能否讓營業利益首度轉正」——
    本次沒有改變那個爭點，只是把它的估值後果算了出來。**
