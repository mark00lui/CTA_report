driver_refs:
- driver: ai-accelerator-demand
  direction: '+'
  note: >
    加速器出貨 → 企業級 SSD 與 HBM 排擠標準型記憶體產能 → **NOR／SLC NAND／eMMC 的供需與價格**。
    ⚠⚠⚠ **但這條傳導是間接的，而且必須寫死方向與強度，否則會被當成 AI 需求標的**：
    **本檔的營收爆發（8 月 81.45 億元、年增 218.53%；前 8 月累計 454.63 億元、
    年增 149.14%）由 **NOR Flash 全面漲價** 與 **NAND、eMMC 嚴重供不應求** 驅動，
    公司並預期第四季漲價動能仍在。**
    **那是記憶體的價格循環 —— 賺的是價差，不是 AI 需求直接創造的營收。**
    ⚠ **也因此本檔刻意不標 `ai_capex_hw`**，與 8299 群聯同一個理由，本輪第四次。
    **重新分類規則已寫定：資料中心相關（企業級 SSD 用 NAND、AI 伺服器用 NOR／SLC）
    營收占比 > 15% 則加標籤並重估。**
    ⚠⚠ **扇出時的實務後果**：**本 driver 上修對本檔是「產能排擠 → 缺貨 → 漲價」的
    二階效應，時滯較長且幅度不確定；**
    **而本 driver 下修對本檔不必然是利空 —— 排擠緩解會讓標準型產能回流，
    那對本檔是供給增加。方向可能是反的。**
    **這與清單上其餘賣硬體給資料中心的標的完全不同，不可套用同一個結論。**
    ⚠⚠⚠ **另記 `memory` 這一格現在有六檔而只有三種獲利機制，
    而本檔是第一檔與 MU／SNDK 同機制的台股標的**：
    **有廠製造、賣位元、量價齊揚 —— 6239 雖同格但它是封測、8299 是模組價差、
    6531 是無廠客製化設計。**
    **本檔納入之後，那一格第一次可以在「同機制」內部做序位比較。**

