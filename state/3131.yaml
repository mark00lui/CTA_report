    ⚠ **分母沒有壞掉**：TTM EPS **54.77 元**（由本益比 46.65 × 現價 2,555 反推）、
    Q1 2026 **16.11 元**、Q2 **11.16 元**（季減 **31%**、年增 **+58%**）、
    H1 累計 **27.27 元**（年增 **+73%**）。
    ⚠⚠ **但單季淨利率在半年內掉了 10.6 個百分點，而且是在營收上升時掉的**（推算）：
    **Q1 約 29.5%（淨利約 4.71 億元 ÷ 營收 15.97 億元）→ Q2 約 18.9%
    （淨利約 3.27 億元 ÷ 營收 17.26 億元），而 Q2 營收還季增 8.1%。**
    **H1 約 24.0%、TTM 約 21.6%。**
    **一家公司在營收上升的同時淨利率掉 10.6 個百分點，代表當期盈餘的組成正在劇烈變動 ——
    Q1 與 Q2 沒有一季能代表另一季。**
    ⚠ **加上組合即將改變**：管理層稱 3D 設備毛利率高出 2.5D 許多，
    **占比要到 2027–2028 才顯著提升 —— 亦即當期描述的是變動前的狀態。**
    ⚠⚠ **且設備商的營收本質上是客戶資本支出的導數，天生塊狀且循環放大**：
    **2026 年的月增率介於 -47.71% 到 +25.65% 之間。**
    ｜**Y 軸（資本密集度）＝ 低。** ⚠ **實際 capex／營收 與折舊占營收比重皆未取得（列 gaps）。**
    判低的依據是三個已取得的比率：**股價淨值比 23.97**（每股淨值約 **106.59 元**、
    淨值僅約 **31.19 億元**，對市值 **747.57 億元**）；**股東權益報酬率約 51.4%**；
    股東權益週轉率約 **2.38 倍**（TTM 營收約 74.09 億元 ÷ 淨值約 31.19 億元）。
    **設備整合商的資產主要是人與流程，關鍵零件外購 —— 資本密集的生意做不出 51.4% 的 ROE。**
    ⚠ **但保留一句**：**2026-05-26 法說明言「產能滿載，啟動大舉擴產」——
    擴產的金額與時程完全未取得，這一格必須每輪重問。**
    ｜⚠⚠ **結論：低 X ＋ 低 Y ＝ Q4（營收與選擇權）。本日十三檔中第七檔落在 Q4。**
    ⚠ **與同日 3533 的對照值得寫下來，因為兩者表面上很像而我判了不同象限**：
    **3533 營收年增 17.7%、EPS 大且乾淨、毛利率自 49.55% 下滑到 45.47% —— 我判 Q1。**
    **本檔營收年增 22.90%、EPS 大且乾淨，但淨利率自 29.5% 掉到 18.9% 之後
    管理層說 2027–2028 會再往上 —— 判 Q4。**
    **差別在方向：3533 的當期在往常態收斂，本檔的當期在兩個方向之間擺盪且尚未落定。
    收斂中的當期盈餘比擺盪中的更有代表性。**
