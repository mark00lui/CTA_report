    ⚠ **Q4 的處方中「選擇權拆分」對本檔尚不可行** —— 本業與 CPO 的界線未揭露，
    無法算出殘差。這與 3008 不同（該檔可用利息收入剝離出本業 EPS）。
  quadrant_since: 2026-09-08
  peer_group: 光通訊／CPO
  peers:
