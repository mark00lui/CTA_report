thesis: 6x 不是便宜而是市場對 FY2028 回歸的提前定價 —— 新產能落在 FY2028 而非基準年，這是低倍數與 EPS 再翻倍能並存的原因
thesis_since: 2026-08-27
thesis_history:
- {until: 2026-08-27, text: "86% 毛利率本身就是最強的擴產誘因，而新產能已排定 2027H2 開出；6.5x 遠期本益比是循環峰值的假便宜，爭點是供給追上前還剩幾季",
   why_changed: "建檔當日重估即取得產能時點與 Micron 財年的對齊關係，把「還剩幾季」這個問句換成了機制陳述：新供給只有約 2 個月落在 FY2027，其餘全落在 FY2028。原句方向正確但停在提問；新句給出「為何 6x 與 +111% EPS 成長能並存」的具體解釋。見 reports/2026/08/2026-08-27-MU-revaluation.md"}
valuation_base_year: FY2027   # 2026-09～2027-08。FY2026 實質已結束（僅剩 FQ4，財報日 2026-09-30 —— 2026-09-12 依 Micron 2026-08-26 新聞稿自 09-22 更正）。⚠ 無法用本益比反推唯一鎖定 —— forward PE 6.53 隱含 143.7 落在 FY2026(73.40) 與 FY2027(155.03) 之間，屬 NTM 口徑

