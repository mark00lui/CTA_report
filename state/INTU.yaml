event_log:
- date: 2026-09-11
  level: L2
  summary: 美股全量重估第二檔 — ⚠⚠⚠ 補上折現率的錨之後發現問題不在折現率而在基期：FY2026 的 FCF 含約 9.09 億現金稅利益、SBC 又少扣 4.67 億；三情境改由 DCF 正向產出，加權目標價 356 → 412.6（+15.9%）
  delta: >
    ⚠⚠⚠ **本輪要解的是 state 自己在 2026-09-07 記下的債**（「形式上是錨 C，實質上是
    base ＝ 現價隱含值」＋「折現率未錨定」，後者 valuation.md 更早在 2026-08-31 點名）。
    **而解完之後推翻了它對病因的判斷。**
    ｜**折現率那一件幾乎沒有影響**：CAPM 給 4.97%（10 年期美債 2026-09-10）
    ＋ beta **0.98** × ERP 4.0／4.5／5.0% ＝ **8.89／9.38／9.87%**，
    **幾乎正好等於原本未錨定的 8／9／10% 猜測。**
    ⚠⚠ **而這是必須記下它的理由，不是放過它的理由**：對照同日重估的 COHR（beta 2.10 → r 14.4%），
    若也用「8/9/10%」會低估折現率 5 個百分點以上。
    **未錨定的參數在低 beta 標的上看起來無害，在高 beta 標的上系統性高估價值 ——
    錯誤的方向是固定的。本檔是運氣好，不是方法對。**
    ｜⚠⚠⚠ **真正的病因是基期，而它有兩層錯，兩層同方向**：
    **(1) SBC 實際 2,056 百萬，不是 state 記的 1,589 —— 原值把指引的「每股 5.81 美元」
    當稅前數乘股數，而 5.81 是稅後數，低估倍數正好是 (1 − 24%)。**
    **(2) 更重要的是 FY2026 如實認列的 8,617 本身不乾淨。五年 FCF 利潤率
    29.33／33.66／28.82／32.52／**40.18%** —— FY2026 高出前四年區間上緣 6.5pp，
    而營益率只增加 2.6pp。對帳（淨利＋D&A＋SBC＋營運資金−capex）前四年差額
    +345／−294／−233／−77，FY2026 是 **+1,548**（營收 7.22pp）＝ 前四年最大絕對值的 4.5 倍，
    且幾乎正好等於 FCF 率躍升的 7.7pp。用指引的算法獨立驗證得 +909，同階。**
    **→ 兩個錯誤都讓本檔看起來更便宜。乾淨基期：FY2026 為 5,652、FY2027 指引推算 6,581。**
    ⚠ **判為遞延所得稅加回是推論，需 10-K 明細確認（首要缺口）。**
    ｜⚠⚠⚠ **逆向 DCF 的全距揭露一件排序被弄反的事**：隱含成長率在不同基期下全距 **5.6pp**，
    其中 **5.0pp 來自基期與 SBC 口徑、只有 1.9pp 來自折現率網格** ——
    **基期的影響是折現率的 2.6 倍，而上一輪把全部注意力放在折現率上。**
    **市場隱含（ERP 4.5%、FY2027 指引基期）＝ 約 0%，對照指引營收 +9~10%、
    新口徑 non-GAAP EPS +23~24% → thesis 的「估值已定價轉型失敗」成立，且理由比原來更硬。**
    ｜⚠⚠⚠ **三情境改由 DCF 正向產出，倍數變成衍生值（DCF → 目標價 → 隱含倍數）**：
    **bear 基期 5,652、0% 定速、永續 0% → 221（9.6x）；
    base 基期 6,581、7%→3%、永續 3% → 465（20.2x）；bull 11%→3% → 548（23.8x）。**
    **加權 412.6，相對現價 +31.9%。** ⚠ 永續成長在 bear 改為 0% 而非 3% ——
    用 3% 永續搭配「護城河破了」的明確期會讓 bear 自我矛盾。
    ⚠⚠ **bear 有雙路徑收斂**：舊 bear 走「9–11x 結構性衰退倍數」得 229，
    新 bear 走「自由現金流永久停滯」得 221，相差 3.5% ——
    **那兩句話在數量上是同一句話，使 bear 成為三情境中證據最強的一格。**
    ｜⚠⚠⚠ **反解舊三情境，暴露的問題比 state 原本的自我指控更嚴重**：
    **舊 bear／base／bull 在 DCF 語言裡是 −1.05%／+2.18%／+6.87%，加權 +2.39%，
    而市場隱含 −0.01% —— 整組情境只比市場樂觀 2.4pp，不只 base 等於市場。**
    **而舊 bull 的 +6.87% 低於公司自己的營收指引 +9~10%：最樂觀情境的樂觀程度
    還不到管理層的基準情境。** 那不是保守，是尺規被現價綁住後連上緣都被拉下來。
    ⚠ **並提供一個可檢驗的判準**：上一輪辯稱 base 345 ≈ 現價 345.88 是
    「價格事後漲上來與模型會合」—— 換一個乾淨基期後 base 移動了 35%（345 → 465），
    **若它原本獨立就不該移動這麼多。**
    ｜⚠⚠⚠ **整個 48.7% 的分歧可以完全收進單一參數**：固定成長路徑只調 beta，
    **0.98 → 加權 412.6；1.21 → 356（＝舊目標價）；1.44 → 312.8（＝現價）。**
    反之固定 beta 0.98，分歧可完全表達為「成長 7%→3% 對 0%」。**兩種表述等價，資料無法區分。**
    **處置：beta 不調（調了就是與情境重複計算同一風險，同「序位只調倍數不調 EPS」），
    但敏感度逐格列出，並把 beta 的不穩定列為缺口。**
    ｜⚠⚠⚠ **並發現資料源的一個錯誤**：stockanalysis 顯示 FY2027 EPS 成長 **−0.37%**，
    它用新口徑的 FY2027 估計除舊口徑的 FY2026 實際（24.27）。同一基礎的真實成長是
    **+23.4%（指引）／+29.7%（共識）**，舊對舊是 **+18.7%**（底層經濟）。
    **同一頁的「forward PE 12.93」是對的（新÷新），「EPS 成長 −0.37%」是錯的 ——
    兩個數字在同一張表上，只有一個可用。口徑改變的年度，倍數與成長率要分別驗證。**
    ｜**CTA 位階惡化且性質改變**：50DMA 318.69、200DMA 422.30（09-10）。
    **價格 312.77 低於 50DMA 1.9% —— 50DMA 已自支撐翻為壓力，support 欄位的
    「302.80 (50DMA)」是價格仍在均線之上時寫的，已移除。** 死亡交叉 -24.5%（自 -25.1% 略收斂）。
    **評級維持中性：上檔 +31.9% 不跳過右側確認。**
    ｜**conviction 維持低，但理由換了**：已解兩條（無獨立估值基礎、折現率未錨定），
    未解兩條（錨 A／錨 B 結構性失效、驗證要等 2027 報稅季），
    **新增決定性一條：逆向 DCF 與正向 DCF 是同一個模型跑兩個方向，不是兩個獨立參照 ——
    本檔實質上只有一個錨，而分歧又收斂在單一參數上。**
    ｜**缺口**：關閉 2 個（SBC 金額、折現率的可觀測錨 —— 後者是 `changes_if` 列為
    「取得即執行」的最優先條件），新增 4 個（1,548 百萬的組成、beta 的前瞻估計、
    FY2026 實際現金稅率、取得無形資產攤銷是否含在 D&A 內）。
    **新增第四條否證點：FY2027 扣 SBC 後自由現金流低於 60 億 —— 這是第一條直接測主錨基期的否證點，
    既有三條全在損益表上。** ⚠ 並寫明驗收必須先做對帳、扣掉超出歷史區間的一次性項目，
    否則這條否證點會被一筆稅項繞過。
    ｜⚠ **機率 0.30／0.45／0.25 為使用者 2026-08-26 指定，本輪一個字未動。**
    ⚠ **加權 412.6 與分析師均值 405.60 僅差 1.7%，那是事後對照不是推導依據** ——
    分析師均值是別人模型的調查結果，不得作為錨。
    報告：reports/2026/09/2026-09-11-INTU-revaluation.md
