notes: >
  ⚠⚠⚠ **本檔是覆蓋清單成立以來估值最極端的一檔，而兩個比率要一起看才成立**：
  **市營比 **45.92**（TTM 營收僅約 17.52 億元，市值 804.58 億元），
  而本益比是「--」—— 未揭露，因為 TTM EPS 是負的（**-1.18 元**）。**
  **前一個紀錄保持者 AXTI 是市營比 35.25、本益比 1,141.03（正但趨零）；
  本檔的分母已經穿過零。**
  ｜⚠⚠⚠ **而本檔把「擴建型 Q3」這個此前只是懷疑的東西變成了結論。**
  **Q3 象限的兩個預設錨是「PB／重置成本」與「中週期正常化 EPS × 正常倍數」，
  而本檔兩個都不能用：股價淨值比 14.13；TTM -1.18、FY2025 +0.16、
  Q1 約 -1.10、Q2 -0.22 是一條沒有中週期的序列。**
  **這是 3081（股價淨值比 56.17）之後第二次兩個預設錨同時失效，而兩次都是擴建型。**
  ⚠⚠ **結構性的解釋現在寫得出來了，它不是巧合**：
  **一家正在建產能的公司，(a) 帳面資產已經灌入了尚未貢獻獲利的在建工程與新設備，
  使 PB 對「現有獲利能力」失去意義；(b) 同時它沒有正常盈餘可以正常化，
  因為新產能的損益還沒開始。**
  **這正是 valuation-map 對 PB 的警語「在建工程已進分母卻未貢獻獲利時被高估（6239 即是）」
  的一般化 —— 6239 是個案，擴建型 Q3 是這個個案的類別。**
  ⚠ **建議 references 把 Q3 拆成「循環型」與「擴建型」並各給處方，已是第三次提出；
  而本檔提供了第三個樣本與一個結構性的理由，不再只是三個個案的並列。**
  ｜⚠⚠ **本檔是本輪第一次為新標的加上 `cpo` 標籤，而那件事本身有訊息量。**
  **cpo 這一格在此之前連續六次下降（20.0 → 19.0 → 18.2 → 17.4 → 16.7 → 16.0 → 15.4%），
  分子始終是 4 —— 前五檔光互連相關新增（AXTI、AAOI、2345、3017、3081）全部拒標。**
  **本檔標上，分子第一次自 4 變 5。**
  ⚠ **標上的理由要寫死，否則下一輪會被當成寬鬆**：
  **本檔的 thesis 直接押在 CPO 上 —— ReLFACon™ 是把 FAU 封裝到 PIC／COUPE 的技術；
  1.6T OE 已切入可插拔與 CPO 交換器、2026 年直上 6.4T；
  已向超過 5 家潛在巨頭客戶交付多款 CPO 樣品；FAU 三年 70 億元的自估就是這件事的價格。**
  **前五檔拒標的共同理由是「不依賴 CPO 這個特定前提成立」；本檔正好相反 ——
  它的整個上檔都建立在那個前提上。**
  ｜⚠⚠⚠ **本檔與覆蓋清單內的 3008 大立光同時是「循環引用」與「零和競爭」——
  這是本清單第一次兩者同時發生在同一組標的上。**
  **3008 在本倉庫被記為「價值主體是尚未貢獻營收的 CPO 選擇權」，
  而那個選擇權的內容正是 FA／PMLA／**FAU** 光學元件端 —— 與本檔的主錨是同一個市場。**
  ⚠⚠ **依 3583 細化後的規則，3008 的市場觀測倍數可用、判斷值不可用。
  但本組還有一層更強的限制**：**兩檔的判斷值是以負號連動的 ——
  我若調高本檔的 FAU 選擇權價值，機械上就該調低 3008 的，反之亦然。**
  **此前記過的三組零和（3324／3017、AVGO／3661、2308／3211）沒有一組同時是循環引用。**
  **實務規則：重估任一檔的 FAU 選擇權時必須同時檢查另一檔，且兩份報告要互相指名 ——
  單獨調一邊會讓兩檔的合計份額超過一，而那不會報錯。**
  ｜⚠⚠ **本檔的月營收貢獻了一個新的形狀：月增率連續六個月為正，
  而年增率與累計年增率都不可讀。**
  **2025 年的基期全距達 103%（1.003 到 2.041 億元），是本輪最不規則的 ——
  2 月的年增 +27.67% 是因為去年 2 月最低，4 月的 -37.30% 是因為去年 4 月最高。
  兩個極端都是基期造成的。**
  **累計年增率 -10.56% 則混著上半年的崩與下半年的回升，同樣不可讀。**
  ⚠ **這是本輪第一次「月增率」成為唯一可用的序列 ——
  而它剛好也是最能看出連續性的那一個（3 月起 +9.10 → +12.39 → +9.49 → +8.51 → +19.69%，
  單月營收五個月 +74.3%）。**
  ｜⚠⚠ **本檔的比值 1.68 倍揭露了那條規則的一個弱點，而我應該先承認它**：
  **我把可用門檻定在「2–3 個日振幅」，但那個「2」是在一個沒有任何樣本的空區間裡畫的 ——
  此前的分布是 0.008／0.086／1.09／1.18／1.21｜（空白）｜2.03／2.55。**
  **本檔是第一個落進空白處的觀測值。它不推翻門檻，但它證明門檻是任意的。**
  ⚠ **而它也是三個條件第一次出現分歧**：**距離 13.00% 過關、價格在均線正確一側過關、
  比值 1.68 不過關。前兩個過關樣本（6187 2.03、6531 2.55）是三個條件同時成立。**
  **處置：填入 invalidation 並明記其為邊緣案例，等更多樣本落進 1.21–2.03 再校準門檻。**
  ｜⚠⚠ **並記下今日第四次二手來源的問題，而這一次的性質與前三次不同。**
  **本輪查到一則「大立光切入 CPO FAU」的說法，唯一來源是社群平台貼文 ——
  不是公司揭露、也不是財經媒體報導。**
  **前三次（3221 代號、6187 的 +9.82%、6531 的英文名）是**來源寫錯**；
  這一次是**來源等級不夠**。**
  **前者靠交叉比對可以抓到，後者只能靠看來源是誰 —— 兩種防線不一樣。**
  **處置：完全不採用，第四條 falsifier 改錨在本檔自己的 capex 計畫上，並列 gaps 待查證。**
  ｜⚠ **另記兩件事**：**(a) 本檔是上櫃（OTC），本輪第一檔非上市的台股標的；**
  **(b) 當日開高走低（開 730、高 756、收 708，收在接近最低 701），
  雖然仍在季線之上 14.95%，右側的品質不佳。**

event_log:
- date: 2026-09-11
  level: L1
  summary: CTA 評估（規則修正）— 失效價位自「615.92」改為 614.52（MA60，比值 2.59 倍）
  delta: >
    全清單十九檔 CTA 評估的一部分，觸發者為**規則變更**而非新聞：
    **那條失效價位規則是在 2026-09-10 建檔過程中逐步推導出來的，
    而它本身帶著兩個錯 —— 只取一條均線（季線）、用單日振幅當比值分母。**
    ⚠ **修正後六條均線全算，十九檔中十一檔由「留空」變為可填**；
    並撤回兩檔不合格的既有填值（3661、AAOI）——
    兩檔都是在規則成形之前建的。
    ⚠ 本檔的逐條均線與判定見上方 cta 區塊的註解。
    **三情境仍未建立，本次不動估值面。**
    報告：reports/2026/09/2026-09-11-coverage-cta-ma-rule.md
- date: 2026-09-10
  level: L2
  summary: 新增追蹤標的 —— ⚠⚠⚠ 清單估值最極端的一檔（市營比 45.92、本益比未揭露）；擴建型 Q3 第三例且兩個預設錨同時失效
  delta: >
    建檔。判 **Q3（資產與循環）**，本輪十八檔中第三檔落在 Q3。
    ⚠⚠⚠ **X 軸極低 —— 分母已經穿過零**：**TTM EPS **-1.18 元**、
    2026 Q2 **-0.22 元**（季增 +80%、年減 -225%）、由季增反推 Q1 約 **-1.10 元**，
    對照 FY2025 全年 **+0.16 元**。報價頁的本益比欄位直接顯示「--」。**
    ⚠⚠⚠ **Y 軸高，而且是本輪最明確的一次**：**公司於 2026 至 2027 Q2 規劃投入
    資本支出約 **15.38 億元**（FAU 生產機台約 **10.8 億元**），
    對照 TTM 營收約 17.52 億元 ＝ **87.8%**，年化後仍約 58.5% ——
    超過 15% 門檻三到六倍。**
    ⚠⚠⚠ **而本檔把「擴建型 Q3」從懷疑變成結論**：
    **Q3 的兩個預設錨（PB／重置成本、中週期正常化 EPS）在本檔都不能用 ——
    股價淨值比 **14.13**；而 TTM -1.18、FY2025 +0.16、Q1 約 -1.10、Q2 -0.22
    是一條沒有中週期的序列。**
    **這是 3081（股價淨值比 56.17）之後第二次兩個預設錨同時失效，兩次都是擴建型。**
    **結構性的解釋現在寫得出來了：擴建中的公司帳面資產已灌入尚未貢獻獲利的在建工程，
    同時沒有正常盈餘可正常化 —— 那正是 valuation-map 對 PB 的警語
    「在建工程已進分母卻未貢獻獲利時被高估（6239 即是）」的一般化。**
    **建議把 Q3 拆成循環型與擴建型，已第三次提出，但這次有結構性理由而不只是個案並列。**
    ｜⚠⚠⚠ **估值極端度**：**市營比 **45.92**（TTM 營收僅約 17.52 億元，
    市值 804.58 億元），而本益比未揭露。**
    **前一個紀錄保持者 AXTI 是市營比 35.25、本益比 1,141.03（正但趨零）。**
    ｜⚠⚠ **本輪第一次為新標的加上 `cpo` 標籤，而 cpo 這一格在此之前連續六次下降
    （20.0 → 15.4%，分子始終是 4）。分子第一次自 4 變 5。**
    **標上的理由：本檔的 thesis 直接押在 CPO 上（ReLFACon™ 把 FAU 封裝到 PIC／COUPE、
    1.6T OE 已切入可插拔與 CPO 交換器、2026 直上 6.4T、
    已向超過 5 家潛在巨頭客戶交付多款 CPO 樣品）。**
    **前五檔拒標的共同理由是「不依賴 CPO 這個特定前提成立」；本檔正好相反。**
    ｜⚠⚠⚠ **本檔與清單內的 3008 大立光同時是「循環引用」與「零和競爭」——
    本清單第一次兩者同時發生。**
    **3008 的 CPO 選擇權內容正是 FA／PMLA／FAU，與本檔的主錨是同一個市場。**
    **兩檔的判斷值以負號連動：調高一邊就該調低另一邊。**
    **此前三組零和（3324／3017、AVGO／3661、2308／3211）沒有一組同時是循環引用。**
    ｜方法跨**三軸**（分母／參照／時間）。
    ⚠⚠ **主錨是選擇權拆分（跳線本業 76% ＋ FAU），本輪第三次用得上，
    而且是唯一一次公司同時給出金額與時程：2026–2028 三年累計自估 **70 億元**、
    FAU 2026 Q3 起出貨（初期 3.2T）。**
    ⚠ **副錨是重置成本／產能對照 —— Q3 處方裡唯一在本檔用得上的，
    且有現成比率：10.8 億元機台 → 70 億元營收 ＝ 6.48 倍，可拿去問同業。**
    ⚠⚠ **層級軸未跨（淨現金未取得）—— 本輪第十二檔，而本檔缺它的代價最大：
    15.38 億元 capex 對淨值 56.97 億元是 27%，公司同期在虧損，
    資金來源會改變每股的分母，而 70 億元的選擇權是用每股在算的。**
    ｜三情境**刻意不建立**，而理由與前十七檔不同層次：
    **不是數字還沒查齊，是連方法都還沒有 —— Q3 的兩個預設錨同時失效。**
    ｜評級**中性／信心低**。位階**右側確認**（價格在季線之上 14.95%）。
    ⚠⚠ **比值 **1.68 倍**日振幅 —— 本輪第一個落在 1.21 與 2.03 之間的樣本，
    而那個區間此前是空的。**
    **必須誠實承認：「2 個日振幅」這個門檻是在空區間裡畫的
    （此前分布為 0.008／0.086／1.09／1.18／1.21｜空白｜2.03／2.55）。**
    **本檔不推翻門檻，但證明門檻是任意的。**
    **也是三個條件第一次分歧（距離過關、正確一側過關、比值不過關）——
    處置為填入 invalidation 並明記邊緣案例。**
    ⚠ **另記當日開高走低（開 730、高 756、收 708，收在接近最低 701），右側品質不佳。**
    ｜四條 falsifier。⚠ **第一條刻意用季度絕對金額**：
    **本檔去年基期全距 103%（1.003 到 2.041 億元），年增率幾乎不可讀 ——
    2 月的 +27.67% 與 4 月的 -37.30% 兩個極端都是基期造成的；累計年增率同樣不可讀。**
    **本檔因此是本輪第一次「月增率」成為唯一可用的序列
    （3 月起連續六個月為正，單月營收五個月 +74.3%）。**
    ⚠ **第四條沒有標成「未驗證」，本輪連續第四檔。**
    ｜⚠⚠ **並記下今日第四次二手來源的問題，性質與前三次不同**：
    **查到一則「大立光切入 CPO FAU」的說法，唯一來源是社群平台貼文。**
    **前三次（3221 代號、6187 的 +9.82%、6531 的英文名）是來源寫錯，
    這一次是來源等級不夠 —— 前者靠交叉比對可以抓到，後者只能靠看來源是誰。**
    **完全不採用，第四條 falsifier 改錨在本檔自己的 capex 計畫上，並列 gaps 待查證。**

