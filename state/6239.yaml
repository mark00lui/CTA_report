- name: FOPLP與DDR5_TSV進度與競爭格局
  value: DDR5 的 TSV 互連已完成試產、2026 Q4 量產；FOPLP 目標 2027 年中前成為全球第一家量產面板級扇出型封裝 AI 應用的專業封測廠。⚠ 2026-09-01 併入競爭格局：本檔面板 510×515mm、P11 月產 6,000 片；日月光 600×600mm 但時程落後約一年；產業預期 600×600 成主流
  unit: 質性
  tier: 事實
  source: >
    2026 法說會（4 月與後續）。⚠ **這一格是 thesis 的核心** —— 它是本檔自
    「記憶體封測」重評價為「AI 先進封裝」的唯一路徑，也是兩條 falsifier 的驗證對象。
    DDR5 的 TSV 互連被公司明述為「為 HBM 技術累積基礎」，但**尚未進入 HBM**，
    不可直接視為 HBM 曝險。
    ⚠ **2026-09-01 大幅擴充：本變數自「僅公司說法」變成「有競爭座標」，但數值未變。**
    ⚠ 為何併進本格而非新開一格：`validate_state.py` 的 key_variables 上限為 6（硬性 ERROR），
    而既有六格全部是 thesis 爭點或 falsifier 標的，沒有一格比「FOPLP 競爭格局」更該讓位。
    **那個上限的判斷是對的** —— 這些是 FOPLP 這條路徑的**細化**，不是模型的新軸。
    本次因此定 L1 而非 L2（詳見 event_log）。
    【時間常數，工商時報 2026-09-01】聯發科投入面板級封裝約 **7 年**、**約花 3 年完成首項
    產品量產**、單一新產品導入周期約 **8–9 個月**。力成自 2025-05「小量出貨」到 2027 年中
    量產約 2 年，**落在該經驗值之內** —— 不是需要打破產業常數才能達成的時程。
    第四條 falsifier 的可達性因此上升。
    【競爭格局，工商時報 2025-05-31 ——⚠ 距今約 15 個月】
    (＋) **時程領先約一年**：力成該時點已「面板級扇出型封裝開始小量出貨」，且有重量級客戶
         高階產品進入驗證（該產品為 **2nm SoC 搭配 12 顆 HBM，整體封裝造價高達 25,000 美元／顆**）；
         同期日月光為 300×300 已試作、推進 600×600，2025 下半設備進駐、年底試產、
         **2026 才開始送樣客戶認證**。
         **這是「全球第一家專業封測廠」說法第一次拿到非公司來源的支撐。**
    (−)  **面板規格落後**：力成最大面板 **510×515mm**，日月光為 **600×600mm**，
         前者僅後者 **73%** 面積。而 FOPLP 的整個經濟理由就是以更大方形面積攤薄每顆成本 ——
         事件文明載 600×600 有效產能達 300mm 晶圓**數倍**、面板製程降本潛力**最高約一成**。
         若主流收斂到 600×600，本檔拿到的是同一個機制的 73%。
    ⚠ **兩者量級相當，我沒有理由把機率往任一邊推。機率是使用者的判斷，本次未動。**
    ⚠ 三個節制的理由（不要把它讀成「力成輸了」）：面積不等於良率更不等於成本
    （日月光自 300×300 逐步爬上去，說明尺寸是慢慢爬的）；格式可以換線（但要錢 ——
    見資本支出強度）；本檔目標市場可能不需要最大面板 —— 但最後這條與「2nm SoC + 12 顆 HBM」
    的旗艦規格**互相矛盾**，兩個推論打架時該記的是矛盾本身，不是挑一個相信。已列 gaps。
    【產能，鉅亨網 2026-01-27】P11 廠無塵室擴產 2026 上半年完成，總產能規畫**每月 6,000 片面板**；
    P12 三樓專處理 AI 晶片與 **ABF 載板**結合，一樓作為 FOPLP 擴充準備。
    ⚠ **【2026-09-01 第二次重估補入，來自法說會 2026-04-28 —— 這幾項比前述任何二手資料都硬】**
    ・FOPLP **良率已達 94–95%**（另一來源記 95%），工程能力已獲客戶認可。
    ・**第一階段 3K 產能今年到位**（對照鉅亨網記 P11 總規畫月產 6,000 片 —— 3K 是第一階段）。
    ・2026 **下半年開始產品試作與驗證**，先進封裝下半年預計有 **NRE 收入**（不是量產營收）。
    ・**目標 2027 年中前量產**，量產應用別為 AI、HPC、ADAS、OE（TSV & Bump）、
      **CPO（Switch／SoC + OE）**。
    ・**客戶為 AMD／Broadcom**（公司稱不評論個別客戶，但已提及與其合作 FOPLP 產品）。
    ・**FOPLP 產能已被預訂。**
    ⚠ **AMD／Broadcom 這一項直接解決了 9/1 稍早那份 L1 報告記下的矛盾**：
    當時我把「2nm SoC + 12 顆 HBM 的旗艦規格」與「瞄準邊緣運算與車用」並列為兩個打架的推論，
