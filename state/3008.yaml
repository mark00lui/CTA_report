    multiple_basis: "⚠ **2026-09-08（L3）倍數維持 24x，但 EPS 改用共識均值，且錨的結構第一次被寫清楚。** ⚠ **24x 高於自身歷史 2023–2025 區間的上緣 22.58x** —— 這件事此前沒被明說。正確的讀法是：**24x = 本業歷史平均 15.8x ＋ 為 CPO 認列的 8.2x 溢價**，而那 8.2x 就是本檔 base 裡的選擇權成分。把它拆開寫出來，日後 CPO 進度變動時才知道該動哪一段。⚠ **EPS 自 190.00 改為 185.03（共識均值，19 位分析師，as-of 2026-09-08）** —— 來源等級升為**取得-分布值**，且**錨寬度 = (199.16-168.16)/168.16 = 18.4%**（本檔第一次算得出來）。⚠ **一個反向的警訊**：1-8 月累計營收 390.93 億元、年增 +3.71%，若餘下四月維持該速度，全年約 **634 億元**，**接近共識營收區間下緣 62.2B、遠低於均值 66.23B** —— 共識的營收可能偏高，而 EPS 建立在其上。｜原推導：錨 A + 拆解（2026-08-27 首次取得歷史錨，本檔自「無獨立估值基礎」升級）。⚠ **2026-08-31 修正錨的來源與標籤**：8/27 用的「五年區間 12–16x」出自經濟日報產業分析，本次自 wantgoo 本益比頁取得逐年實績 —— 2026 迄今 37.58／13.45、2025 16.53／11.54、2024 19.59／14.17、2023 22.58／11.95，2023–2025 實際區間為 **11.54–22.58、平均約 15.8x**。兩點差異：(1) 上緣不是 16 而是 22.58（2023）與 19.59（2024）；(2) **我把 16x 稱為「歷史上緣」其實接近「歷史平均 15.8x」—— 標籤錯了，數字沒錯**。本次不改 16x，因為 2023–2024 的高讀數伴隨 EPS 下滑（分母縮小推升本益比），屬失真而非市場給的溢價，用平均比用上緣誠實。現況 trailing 36.78x（6,915÷近四季 EPS 188.02；cnyes 顯示 37.23x，口徑略異）為歷史上緣的 2.3 倍。判斷為【部分合理】並以拆解方式表達：本業給歷史上緣 16x（不給中值，因 CPO 已使公司性質改變），CPO 額外給 8x。CPO 隱含定價因此為 190×8 ≈ 每股 1,520 元，相當於市場當前為 CPO 所付（6,915 − 190×16 = 3,875 元／股）的 39%。理由是 udn 2026-08 列出的三項風險使 CPO 規模受限：技術路線（GC vs EC）未定、資源集中押注緩衝小、賣給模組廠而非終端晶片廠使議價力與天花板受限。⚠ 非現價隱含值（36.78x），前值 36.4x 才是 ⚠⚠⚠ **2026-09-11 基準年滾動 FY2026 → FY2027：EPS 自 185.03（S&P 的 FY2026 共識**均值**）改為 **209.37**（FactSet 的 FY2027 共識**中位數**，17 位，2026-07-27，+13.2%）。** **供應商統一為 FactSet、中心值改用中位數並與平均並列（209.37 對 209.01，差 0.2% —— 本檔的共識分布對稱，沒有 2308 FY2028 那種 6.6% 的偏態）。倍數 24x 不動，目標價 4,441 → 5,025。** ⚠⚠⚠ **而本輪發現一個口徑問題，它不改目標價但改歸因**：**錨 A 是自身歷史 **trailing** PE（平均 15.8x），而 base 套在 FY2027 的 **forward** EPS 上。以 FY26→27 共識成長 +10.2% 折算，15.8x trailing 的 forward 等值是 **14.34x**。** **→ base 的拆解應改寫為「24x ＝ 本業 forward 等值 14.34x ＋ 為 CPO 認列的 **9.66x** 溢價」，而 state 原記的溢價是 8.2x —— 低估 18%。** ⚠⚠ **而歸因是重要的，state 自己寫過理由：「把它拆開寫出來，日後 CPO 進度變動時才知道該動哪一段」—— 若 CPO 被證偽，要扣掉的是 9.66x 不是 8.2x。** ⚠ **選擇權拆分（check）同步更新**：本業 FY2027 EPS ≈ 159.1 × 本業營業利益成長 1.055 ＝ 167.9，× forward 等值 14.34x ＝ **2,407**；殘差 **4,253** ＝ 現價 6,660 的 **63.9%**（舊值：本業 2,514、殘差 3,986、占 61.3%）。**thesis 的「現價六成買的不是本業」仍然成立，而占比升高的兩個原因同向：價格漲、本業以更低的 forward 倍數計。** ⚠ **錨寬度隨年限單調擴大**：FY2026 19.1%／FY2027 **26.0%**／FY2028 50.4%（state 原記 18.4% 為 S&P 的 FY2026 口徑）。**FY2028 的低值 182.90 幾乎等於 FY2027 的 182.48（差 0.2%）—— 最悲觀的分析師認為本檔 FY2027 到 FY2028 完全不成長。**"
