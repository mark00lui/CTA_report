  ┌ 診斷：倍數階梯原為 14／18／30 —— bull−base 差 12 個倍數，bear−base 只差 4 個，**單邊**。
  ├ 病灶：base 的 18x 只錨在自身 3 年平均 16.5x，而**那段期間力成是純記憶體封測廠**
