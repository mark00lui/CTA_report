# 共用驅動因子。這一層存放「多檔標的共用、且不屬於任何單一標的」的變數。
# 規則：一個共用事實只能有一個家。個股 state 用 driver_refs 引用，不複製數值。
id: hyperscaler-capex
name: 四大超大型 CSP 資本支出
what_it_is: AMZN、GOOGL、MSFT、META 四家的年度資本支出合計與各自 guidance 區間
why_shared: >
  這是整個 AI 硬體鏈的需求上游 — 它不屬於任何單一標的，卻同時決定 TSM 的投片、
  3324/3017 的伺服器散熱附載、6442 的光互連需求。同時它也是四家自己的成本與折舊。
  若複製進每檔 state，數值會各自漂移且沒人會發現。

# ⚠ 2026-08-27 修正一個結構性問題：前版 current.value 為 725，但四個成分加總是 740。
#   前者是第三方統計、後者是公司揭露，兩者混用使整個序列無法重現。
#   本次起 current.value 一律為「四家公司揭露 guidance 上限之加總」，基準寫死在下方，
#   第三方統計改列為 cross_check 的外部參照，不再當作 current 本身。
current:
  value: 745
  unit: USD bn（2026 曆年合計 = 四家公司揭露 guidance 上限之加總）
  as_of: 2026-08-27
  tier: 事實
  basis: "Amazon 220 + Alphabet 205 + Microsoft 175 + Meta 145 = 745。全部為公司自行揭露，非第三方推估。"
  source: >
    各家 2026 Q2 財報與法說（Amazon 2026-07-30、Alphabet 2026-07-22、
    Microsoft 2026-07-29、Meta 2026-07-29）。
  yoy: "+82%（2025 約 410）"
  note: >
    ⚠ 合計數的變化會掩蓋成分的相反方向，看合計前務必先看成分：
    本次 725→745 的 +20 幾乎全部來自 Amazon 的真實上修，而 Microsoft 的 −15 是
    會計口徑而非需求縮手。若只看合計會低估真實需求的上行幅度。

components:
  - {name: Amazon, value: 220, guidance: "約 220（由約 200 上修）",
     source: "Q2 2026 財報 2026-07-30 —— CEO Jassy 歸因於記憶體成本上漲；Q2 單季現金 capex 53.1；AWS 成長 36.7%。管理層稱 2027 產能已大致被預訂，部分 2028 產能亦已有歸屬",
     as_of: 2026-08, tier: 事實, change: "真實上修 +20"}
  - {name: Alphabet, value: 205, guidance: "195–205（由 180–190 上修）",
     source: "Q2 2026 財報 2026-07-22 —— Q2 單季 capex 44.9（YoY +107%）；約 60% 投向伺服器、40% 投向資料中心與網通設備；公司稱需求強勁但供給限制仍在拖慢產能交付",
     as_of: 2026-08, tier: 事實, change: "上限持平，下緣由 180 升至 195。⚠ 前版區間記為 175–205，該下緣有誤"}
  - {name: Microsoft, value: 175, guidance: "約 175（由約 190 下修）",
     source: "FY26 Q4 法說 2026-07-29 —— 差額全部來自資料中心耐用年限 15→25 年與未來租賃由融資改列營業。CFO Hood：Outside of this useful life impact, our calendar year 2026 CapEx investment expectations remain unchanged。Q1 FY27 單季 capex 指引逾 50",
     as_of: 2026-08, tier: 事實, change: "⚠ 會計口徑 −15，非需求下修。計算 falsifier 時不得視為 guidance 下修"}
  - {name: Meta, value: 145, guidance: "130–145（由 125–145 收窄）",
     source: "Q2 2026 財報 2026-07-29 —— 上限未動、下緣上抬 5；Q2 單季 capex（含融資租賃本金）31.08；2026 全年總費用指引 165–169",
     as_of: 2026-08, tier: 事實, change: "下緣 +5（略偏正面）。⚠ 前版區間記為 125–145，未反映 7/29 的收窄"}

history:
  - {as_of: 2025, value: 410, note: "2025 全年實際合計"}
  - {as_of: 2026-02, value: 630, note: "各家 Q4 財報後的初始 2026 guidance 合計上限"}
  - {as_of: 2026-04, value: 725, note: "Q1 財報後上修（當時採第三方統計，非成分加總 —— 見 current 的基準說明）"}
  - {as_of: 2026-08, value: 725, note: "Q2 後 Alphabet 上調上限、Meta 再上調，合計維持 700–740 區間（同上，第三方統計）"}
  - as_of: 2026-08-27
    value: 745
    note: >
      改以公司揭露上限加總為基準並全面校正三個過時成分：Amazon 200→220（真實上修）、
      Microsoft 190→175（會計口徑）、Meta 與 Alphabet 的區間下緣修正。
      ⚠ 本點與前四點的基準不同（成分加總 vs 第三方統計），比較時須注意；
      若以同一基準回推，2026-08 的成分加總為 740，故真實變動為 740→745。

# 與 ai-accelerator-demand 互為交叉驗證：承諾（本檔）vs 落地（加速器實際出貨）
forward_estimate_2027:   # 2026-08-31 新增 —— 本 driver 第一個 2027 數據點
  as_of: 2026-08-26
  source: >
    NVIDIA Q2 FY2027 法說（2026-08-26），CFO Colette Kress 於會中所述。
  value_2026: 800
  value_2027: 1300
  unit: USD bn（前五大 hyperscaler 曆年資本支出合計）
  yoy: 約 +63%（800 → 1,300）
  tier: 推論
  note: >
    ⚠ tier 標推論而非事實：這是 NVIDIA 對「客戶會花多少」的估計，不是那五家公司自己的 guidance。
    供應商對客戶支出的估計有結構性的樂觀傾向 —— 它同時是 NVIDIA 自己 FY2028 營收 +70% 指引的
    支撐論據，兩者不獨立。
    ⚠ **口徑與 current 的 745 不同，不可互相取代**：
      current 745 = 四大 CSP（Amazon 220 + Alphabet 205 + Microsoft 175 + Meta 145）、
                    2026 曆年、**各公司自行揭露**、tier 事實
      本值 800   = 前五大 hyperscaler、2026 曆年、**NVIDIA 估計**、tier 推論
    兩者差約 55，與「多了第五家」的規模一致（黃仁勳另有一句「Amazon、Oracle、Alphabet、
    Microsoft 四家每年就要花 6,000 億」，暗示第五家可能是 Oracle）。⚠ 但那句的 600 又與
    本檔四家加總的 745 對不上，**第三個口徑**。三個數字並存，未能完全調和。
    ⚠ 本值解開了 notes/2026-08.md 於 2026-08-31 記下的口徑矛盾：當時來自影片三手轉述的
    「1.3 萬億 AI capex」被記為「未來累計、科技巨頭」而無法與 745 比較 ——
    現在確認它就是**前五大 hyperscaler 的 2027 曆年**數字，出處為 NVIDIA CFO。
    原以為的三個互不相容數字（745／1.3兆／3兆）中，1.3 兆這一個已歸位；
    WSJ 的 3 兆（表外承諾、九家公司）仍未調和。
  why_it_matters: >
    本 driver 在此之前**只有 2026 的數字**，2027 完全空白 —— 而覆蓋清單十三檔中有十二檔的
    common_premise 是「AI 資本支出在未來 8 個季度不會出現實質減速」，那個前提正好跨到 2027。
    本值是第一個把 2027 填上的數據點。它說的是 +63%，即不僅不減速，還加速。
    ⚠ 但它出自供應商而非支出方。真正的驗證要等各家自己給 2027 guidance
    （Microsoft、Meta、Alphabet 約 2027-01，Amazon 約 2027-02）——那才是 tier 事實。

cross_check:
  against: ai-accelerator-demand
  logic: >
    本檔是「支出承諾」，ai-accelerator-demand 是「實際落地」。承諾持續上修但加速器營收停滯
    → 錢沒流向運算；加速器超前而承諾未動 → 承諾可能即將上修。
  status: 未背離
  as_of: 2026-08-27
  finding: >
    方向一致。capex +82% YoY（745 vs 2025 的 410），加速器合計 +116% YoY（95.7 vs 約 44.2）。
    加速器成長仍快於 capex，意味 capex 中流向運算的比重續升。
    本次新增一個較合理的校準：Alphabet 揭露其 capex 約 60% 投向伺服器。若該比例可外推，
    745 × 60% ≈ 447，對照加速器單季 95.7 年化後的 383，比值約 86% —— 遠比先前用全額 capex
    當分母（54%）合理。但高速成長中的單季年化本身會低估，故仍列觀察不作結論。
  caveats: >
    (1) 分子涵蓋範圍大於分母：NVDA 客戶不限四大 CSP（其 AI Clouds／Industrial & Enterprise
        營收 +138% YoY 至 40.3，含主權與 AI-native），這些不在四大 capex 的分母裡。
    (2) 期間不對齊：本檔為曆年全年，加速器為單季。
    (3) 60% 伺服器占比是 Alphabet 單一家的揭露，外推至其餘三家未經證實。
  action: 兩者連兩季背離 → 硬體端 L2，並在報告中明寫是哪一邊先動

deployment_friction:   # 2026-09-09 新增 —— 本 driver 第一個「承諾與落地之間的摩擦」量化資料點
  as_of: 2026-09-09
  tier: 事實（延誤事由與準時率）＋推論（對 capex 入帳節奏的外推）
  what_this_is_not: >
    ⚠ **先講它不是什麼，因為這是本區塊最容易被誤用的地方。**
    **本則不改變 current 745，也不改變任何一個 components 的值。**
    Alphabet 的 205 是**支出承諾**，本則講的是那筆錢**蓋不蓋得出來、什麼時候蓋得出來**。
    ⚠ **兩者可以同時為真**：guidance 一分未動，而落地時程延後。
    把本則讀成「capex 下修」是錯的 —— 那會誤觸第一條 falsifier。
  event: >
    Bloomberg 2026-09-09 報導 Google 與 Blackstone 的合資案 **Project Braid** 在多個
    美國廠址遭遇延誤。該 JV 由 **Blackstone 投入 50 億美元**，目標**明年（2027）達 500 MW**
    運算容量，用途為**向客戶出租 Google 的 AI 處理器**。
    ⚠ **成立 JV 的動機由報導點明：降低 Google 直接投入 AI 基礎設施的成本** ——
    亦即這是**帳外**的建置載具，不在 Alphabet 自己的 205 裡。
  quantified_metric: >
    ⚠ **本則的核心數字，也是本 driver 至今唯一一個關於「交付」而非「金額」的量化值**：
    **參與 Project Braid 的高層現認為資料中心專案如期交付的機率僅 50%，
    低於三年前的 90%。**
    來源為 Bloomberg 引述消息人士，非公司揭露 —— tier 為**推論**，且是單一報導。
    ⚠ 口徑未明：50% 指的是該 JV 自己的專案、或業界普遍值，報導未區分。
  causes:   # 三個事由的性質不同，不可合併成一句「缺料」
    - {type: 供應鏈, detail: "某廠址因未備妥合適的**變壓器**而不適用。業界變壓器等待期近**一年**", tier: 事實}
    - {type: 開發商執行, detail: "懷俄明州夏安廠址原由 Crusoe 開發，Google **對其交付能力失去信心**後收回自行推進並重新申請許可；地方官員告知居民該案將縮小規模", tier: 事實}
    - {type: 監理, detail: "德州州長 Abbott **凍結新資料中心審查**，待該州檢討開發商如何負擔電力成本", tier: 事實}
  company_response: >
    Project Braid 執行長 Benjamin Treynor Sloss：「各個潛在據點以不同速度推進，是非常常見的情況」，
    並稱該合資案擁有多元的廠址選項、進展良好，**明年 500 MW 的目標仍在軌道上**。
    Google 與 Blackstone 均未作進一步實質回應。
  scope_limit: >
    ⚠ **報導明確指出延誤僅涉及本合資案，不涉及 Google 自有（第一方）資料中心。**
    這是判斷影響範圍時最關鍵的一句 —— 它把本則對 Alphabet 損益的直接影響壓得很低，
    也是本次多數標的判為 L0 的主要理由。
  source_conflict: >
    ⚠ **引發本次更新的中文報導有一個十倍的數字錯誤，記在這裡以免日後被引用。**
    鉅亨網 2026-09-09（經 Yahoo 股市轉載）寫「黑石投入 **50 billion 美元**」；
    Bloomberg 原文與所有英文轉載（DCD、TipRanks、Construction Review 等）均為 **5 billion**。
    **採 5 billion。** 另鉅亨提及「其他 29 處潛在場址」，英文來源僅稱
    a wide/diversified set of site options，未給數字 —— **29 這個數字為單一二手來源，未採用。**
    ⚠ 這是本倉庫第五次抓到二手中文來源的問題（前四次見 accelerator-roadmap 的 2026-08-31 event_log）。
  why_it_matters: >
    ⚠ **本則的價值不在它改了什麼數字（它什麼都沒改），而在它把一條已記錄兩次的觀察
    第一次變成可量化的。**
    本 driver 於 2026-08-27 記過 Alphabet 自稱「需求強勁但**供給限制**仍在拖慢產能交付」；
    ai-accelerator-demand 於 2026-08-31 的扇出記過「NVDA 明言供給受限而非需求受限，意味平台端的
    capex 可能不是**想花多少**而是**能買到多少** —— 若成立，capex guidance 的資訊量會下降。
    本次不改模型，列為觀察」。
    **本則是那條觀察的第三次出現，也是第一次帶數字（50% 對 90%）。**
    ⚠ **但必須誠實記下一個計數上的疑問**（與 notes/2026-09.md 對折現率通道提出的是同一類）：
    前兩次的瓶頸是**晶片與記憶體供給**，本次的瓶頸是**變壓器、許可與土地**。
    **兩者都讓「承諾」與「落地」脫鉤，但供給側的決策者、前置期與解方完全不同 ——
    它們可能是兩條通道，而我一直當成一條在數。**
    下次回顧時應先決定要當一個主題還是兩個；本次不因此建新 driver（使用者於 2026-09-09 指定併入本檔）。
  implication_for_this_driver: >
    ⚠ **對 cross_check 的意義**：本檔（承諾）與 ai-accelerator-demand（落地）的比較，
    此前隱含假設兩者之間沒有摩擦。本則指出摩擦存在且不小。
    **若實體交付才是綁定約束，則 capex 金額的上修對硬體端的傳導強度會低於金額所暗示的** ——
    這與 cross_check 目前「未背離」的結論不衝突（兩邊都在加速），
    但它是**未來出現背離時的第一個候選解釋**：背離不一定代表需求轉弱，也可能只是蓋不出來。
    本次不改 cross_check 的 status，僅在此登記這個解釋。
  gaps: >
    ⚠ 50% 對 90% 的口徑（該 JV 自身或業界普遍）未區分，且為單一報導引述消息人士。
    ⚠ 變壓器交期近一年為業界泛稱，無來源可回溯至製造商或產業協會。
    ⚠ 德州凍結的期限與涵蓋範圍未揭露 —— 這是三個事由中唯一可能擴散到其他業者的一個。
    ⚠ 本則無法回答的關鍵問題：**遞延的 capex 是遞延，還是取消？** 兩者對後續年度的
    金額含意相反（遞延會墊高 2027，取消則不會）。

# 2026 年下半最重要的變化不是金額，是市場反應
market_reaction_regime:
  as_of: 2026-08-27
  observation: >
    capex 上修已從利多轉為利空訊號，且本季再獲印證。
    Alphabet 於 2026-07-22 上修 capex 至 195–205 後股價下挫，並引發同業賣壓；
    CNBC 於 2026-07-28 報導 Amazon、Meta、Microsoft 在 Alphabet 報告引發賣壓後
    面臨投資人更嚴格的檢視。Meta 上調 guidance 當日亦曾下跌 9.25%。
  implication: >
    同一則「capex 上修」新聞，對硬體端（TSM/3324/3017/6442）是需求利多，
    對平台端（MSFT/GOOG/META/AMZN）在當前情緒下是折舊與 ROI 疑慮的利空。
    處理這類事件時必須分開判斷，不可套用同一個方向。
  tier: 推論

# 觀察到的第四個案例：平台端的 GAAP 獲利被股權投資評價利益灌水
# （MSFT 的 OpenAI、NVDA 的 CoreWeave 等、GOOG 的股權證券、AMZN 的 Anthropic）
equity_gain_distortion:
  as_of: 2026-08-27
  observation: >
    Amazon Q2 2026 的 GAAP EPS 5.75 含 53.4B 的 Anthropic 投資利益。
    這是本倉庫目前記錄到的第四家 —— MSFT、NVDA、GOOG 皆有同構的情形。
  implication: >
    用未經調整的 GAAP 或 TTM EPS 計算這批標的的本益比，會系統性低估估值水準。
    且同一批 AI 資產的評價波動會同時影響多檔帳面獲利，是 coverage 的 correlation_watch
    目前沒有記到的一條連結。
  tier: 事實

transmission:
  - ticker: 'AVGO'
    direction: '+'
    path: >
      ⚠ **這是本 driver 所有 transmission 中最短的一條，短到幾乎是同一個數字的兩面。**
      **AVGO 的 AI 半導體營收就是超大規模業者自研加速器（TPU／MTIA 類）的採購金額** ——
      **它不是「受惠於 capex」，它「是」capex 的一部分。**
      實測（AVGO 8-K，2026-09-02，FY2026 Q3 截至 2026-08-02）：
      **AI 半導體營收 16.7B（年增 221%、季增 54%），Q4 指引 21.7B（年增 236%）。**
      ⚠ **與硬體端其餘標的的關鍵差別**：3324／3037／8046／6239 賺的是資本支出
      **流過供應鏈之後的一小段**；本檔賺的是**加速器本身**。**彈性最大、時滯最短。**
      ⚠⚠ **反向風險必須明寫，而它是本清單第一次出現的結構**：
      **若某家 CSP 決定自研轉外購（改買 NVDA）或延後專案，對 AVGO 是直接的營收減項，
      而對 NVDA 反而是利多** —— **同一則 capex 消息對兩檔覆蓋標的方向相反。**
      扇出時不可對 AVGO 與 NVDA 套用同一個結論。
    lag: 領先 2–3 季（CSP 的年度 capex guidance 先出，晶片投片與出貨認列在後）
    sensitivity: 高（AI 已占 AVGO 總營收 56.4%，Q4 指引 62.4%）
    affects: ['AI半導體營收與占比']
