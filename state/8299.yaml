# 公開研究檔 — 本倉庫不含任何倉位資訊：無成本、無數量、無權重、無 Kelly、無損益、無持倉揭露。
# 未知值一律留 __ 並寫進 gaps，不要填看起來合理的數字。
#
# ⚠⚠ 建檔當下最重要的四件事，寫在最前面：
#   (1) ⚠⚠ **本檔是 valuation-map 對 trailing PE 的警告的字面版本：「循環頂（低 PE 看似便宜）」。**
#       **本益比 9.55 —— 本日十檔中最低的一個，而它出現在 EPS 創 40 季新高、
#       毛利率一年內自 29.06% 升到 65.31% 的時候。**
#       **這一檔存在的價值有一半在於：它測試我在數字好看的時候會不會照自己的規則做。**
#   (2) ⚠⚠ **象限依軸判 Q4（低 X、低 Y），但 Q4 的預設主錨在本檔明文禁用**：
#       **市營比 2.38x 之所以看起來便宜，正是因為分母（營收）在循環頂 ——
#       2026 前 8 月累計營收年增 278.99%。**
#       **正確的工具是「中週期正常化 EPS × 正常倍數」，而 valuation-map 對它的註記是
#       「循環股必用」—— 那是一條跨象限的規則，不是 Q3 專屬的。本檔是循環股，故必用。**
#   (3) ⚠⚠ **本檔的上游 MU 與 SNDK 都在覆蓋清單內，而方向相反**：
#       **NAND 漲價對它們是售價，對本檔是原料成本 —— 本檔目前的高毛利有相當部分
#       來自低價庫存與現貨價的時間差，那是一次性的價差利益不是議價能力。**
#       **這讓本清單第一次有了「上游漲價 → 下游先受惠再受害」的完整配對。**
#   (4) ⚠⚠ **季線距現價 -0.02%（2,085.41 對 2,085.00）—— 比昨天的 3661（0.30%）更極端。**
#       **當日振幅 2.64%，而季線距離是它的 1/132。連續第二檔證明「太近」也不能當失效價位。**
