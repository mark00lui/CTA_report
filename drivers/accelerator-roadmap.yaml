  - date: 2026-08-31
    summary: 新增 Rubin Ultra NVL576 完整規格；⚠ 更正 cpo_layer_note 的 scale_up 狀態（仍為銅 → 銅光並用）；⚠ 更正二手報導寫反的因果關係
    delta: >
      此前本 driver 對 Rubin Ultra 只有「排定 2027、約 600kW」。本次補齊：
      scale-up domain 自 144 顆擴大至 576 顆（相對 GB300 NVL72 為 8 倍）、Kyber 垂直刀鋒架構、
      800 VDC 供電（同銅線多傳 150% 功率）、15 EF FP4／5 EF FP8（較 GB300 NVL72 提升 14 倍）、
      單 GPU 為 4 顆光罩尺寸晶片與 1TB HBM4 跨 16 個 HBM sites、NVHBM 將記憶體控制器移入
      HBM base die（+30% 頻寬、−15% 功耗）、三星取得早期領先開發 8 層 HBM4E、
      NVIDIA 訂速度規格 17–18 Gbps。時點自「2027」精確為「2027 下半」，未遞延，第一條 falsifier 不觸發。
      ⚠ **本次最重要的實質修正**：cpo_layer_note 的 scale_up 原記「仍為銅，CPO 尚未進入 scale-up 域」。
      Rubin Ultra NVL576 的 576 顆單一 NVLink domain 明載為 copper **and direct optical connections** ——
      光學已進入 scale-up 域。原記述在 Rubin 世代成立、在 Rubin Ultra 世代不成立，時點必須分開講。
      ⚠ **二手報導的因果關係寫反了**：引發本次更新的中文報導把「HBM 配置自單一 12-high 擴大為
      8-high HBM4E／12-high HBM4／8-high HBM4，測試低至 192GB」寫成設計哲學選擇（優先速度而非層數）。
      一手英文報導（Tom's Hardware）的標題是 as memory shortage bites back —— 原因是記憶體短缺。
      兩種框架對記憶體廠的投資含意**相反**（主動少用 = 偏空；買不到 = 偏多）。採後者，
