    **SOTP（首次執行）**與**錨寬度（首次量測）**，兩者都沒有推翻既有的三情境 ——
    **L1 的意思是「查了、沒變」，不是「沒查」。**
    ✅ **SOTP 結果**：Low $240／Mid $275／High $317，**連 High 都低於現價 328.38**。
    ⚠ 不得宣稱它驗證了 base 270（口徑不同：run-rate 快照 vs 2027 目標價）。
    ✅ **錨寬度首次量測**：FY2026 EPS **11.27%**（但該共識為 GAAP 含股權利益，錨本身不可用）；
    **目標價 39.7%**（340–475，平均 422.34）。
    ⚠ **信心為何不升等，理由必須明寫**：本次**缺口減少**（SOTP 已做、錨寬度已得）
    **但錨很鬆**（目標價區間 39.7%）。依規則，兩者是抵銷關係，不得只看缺口數就升等。
    ⚠ 另記一個與方向相反的事實：**分析師目標價最低值 340 仍高於現價 328.38**，全街無一家看到現價之下 ——
    這是本檔估值為負的判斷所面對的最直接反證，不藏起來。
    ⚠ **象限複核：維持 Q2，無漂移。** capex／營收 TTM **29.7%**（132.40 ÷ 445.8），
    依 2026 guidance 205B 對 FY2026E 營收 498.08B 為 **41%** —— 兩個口徑都遠超 15% 門檻。
    ⚠ 以下為前次（2026-09-01）記錄：
    **加權目標價 321 → 302（-5.9%），相對現價 335.41 為 -10.0%**
    （前為相對 342.88 的 -5.6%）。評級維持**中性**、信心維持**中**。
