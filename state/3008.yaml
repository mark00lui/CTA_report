ticker: 3008
name: 大立光
market: TW
factor_tags:
- optical
- cpo
- consumer_optics
thesis: 三日 +28% 定價的是 2027 年中才放量、當前營收為零的 CPO；核心鏡頭 7 月已轉年減，爭點是新舊引擎能否接上
thesis_since: 2026-08-27
valuation_base_year: 2026   # ⚠ 該年 EPS 共識 190 元裡不含任何 CPO 貢獻，而本檔的一切都關於 CPO —— 模型結構與論點對不上。2027 共識查無，滾動時點為 Q3 財報（約 2026-10）

scenarios:
  # ⚠ 本檔的分歧幾乎全部由倍數承載：17x 到 45x 是 2.6 倍，而 EPS 區間只有 ±9%。
  # 這不是刻意放大，是基準年不含 CPO 的必然後果 —— CPO 的價值進不了 2026 的 EPS，
  # 就只能塞進倍數。結果是本模型對倍數假設極度敏感，可靠度低於清單其他標的。
  # 在 2027 共識出來之前，本檔的估值只能做到這個精度。
  bear:
    p: 0.25
    p_basis: 機率由使用者於 2026-08-27 全量重估指定。7 月單月營收已年減 10.66%（達第二條 falsifier 的單月門檻），且 Q2 EPS 環比自 46.63 降至 35.72
    key_assumption: CPO 試產或驗證遞延；核心鏡頭年減擴大。倍數回到 CPO 題材發酵前的水準
    eps: 175.24
    exit_multiple: 14
    multiple_basis: "錨 A（自身歷史，2026-08-27 首次取得）：過去五年本益比區間 12–16x。14x 為該區間中值。⚠ 前值 17x 已高於歷史區間上緣 —— 當時以「2026-04/06 市場實際付過 16.3x／16.8x」為錨，那兩個點其實落在五年區間的頂部，把區間頂當成 bear 是把最樂觀的歷史狀態誤當保守情境。本情境的意思是：CPO 證偽後回到手機鏡頭公司的常態定價，而非崩跌"
    tp: 2453
    narrative: 14x 為五年區間 12–16x 的中值。CPO 證偽即回到本業的常態定價，不需要崩跌
  base:
    p: 0.50
    p_basis: CPO 首張訂單、規格文件、7 月送樣與今年四度購地都是已發生的動作；但 CPO 於 2026 年內不貢獻營收，故 EPS 用共識中位
    key_assumption: 共識達成；CPO 依指引推進但尚未貢獻營收；倍數給予歷史上緣加成但不接受市場當前的全額 CPO 定價
    eps: 190.00
    exit_multiple: 24
    multiple_basis: "錨 A + 拆解（2026-08-27 首次取得歷史錨，本檔自「無獨立估值基礎」升級）。自身歷史五年本益比區間 12–16x（來源：經濟日報 2026-08 產業分析）。現況 trailing 36.78x（6,915÷近四季 EPS 188.02；cnyes 顯示 37.23x，口徑略異）為歷史上緣的 2.3 倍。判斷為【部分合理】並以拆解方式表達：本業給歷史上緣 16x（不給中值，因 CPO 已使公司性質改變），CPO 額外給 8x。CPO 隱含定價因此為 190×8 ≈ 每股 1,520 元，相當於市場當前為 CPO 所付（6,915 − 190×16 = 3,875 元／股）的 39%。理由是 udn 2026-08 列出的三項風險使 CPO 規模受限：技術路線（GC vs EC）未定、資源集中押注緩衝小、賣給模組廠而非終端晶片廠使議價力與天花板受限。⚠ 非現價隱含值（36.78x），前值 36.4x 才是"
    tp: 4560
    narrative: 24x = 本業歷史上緣 16x + CPO 溢價 8x。市場為 CPO 付每股約 3,875 元，本情境只認列其中 39%
  bull:
    p: 0.25
    p_basis: 需要 CPO 如期 Q3 試產且 FAU 獲證實。與 bear 對稱
    key_assumption: CPO 如期 Q3 試產、FAU 獲證實，2027 放量能見度提高；倍數再擴張以反映尚未入帳的 CPO
    eps: 208.64
    exit_multiple: 45
    multiple_basis: "CPO 大成功情境：45x 為自身五年歷史上緣 16x 的 2.8 倍，等於認列市場當前為 CPO 所付的全額再加成。⚠ 仍高於街上目標隱含的 27.5x，且街上目標價停在 2026-07-27 未反映其後三根漲停 —— 用過期賣方目標價當參照是已知的自欺模式（此處方向相反但同源）。這是本模型最脆弱的假設，本次未調整只因 CPO 上檔本質上無法用歷史錨定"
    tp: 9390
    narrative: ⚠ 45x 高於街上目標隱含的 27.5x，是三情境中唯一「比街上樂觀」之處。理由是街上目標價停在 2026-07-27、未反映本週兩根漲停 —— 但這也是本模型最脆弱的假設
  weighted_tp: 5241

