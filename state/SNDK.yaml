notes: ⚠ 2026-08-27 重估後修正：本檔與 MU 同向但**不等深**。上一輪谷底 WD Flash 分部毛利率為
  −11.9%（FY2023 Q4）與 −10.3%（FY2024 Q1），而 MU 的 DRAM 谷底是 2.7% —— NAND 實際虧錢、DRAM 只是
  趨近於零。原因是結構性的：DRAM 三家寡占、且 HBM 受先進封裝產能限制；NAND 六家以上競爭且無對等瓶頸。
  **MU 的 bull 論證（HBM 讓記憶體脫離商品循環）在本檔幾乎不適用。**
  ｜以下為建檔時的原始判斷，保留供對照：本檔與 MU 是同一個循環的兩個切面，不是兩個獨立標的。兩者毛利率同為 84.6%（巧合但說明問題）、
  同樣由漲價驅動、同樣面對 CY2027H2 的新產能。把兩檔一起放進覆蓋清單，比較接近把記憶體的曝險加倍，
  而不是分散 —— 這一點已寫進 coverage.yaml，判讀清單分散度時必須記得。
  ｜與 MU 的差異有兩處值得追：(1) SNDK 是純 NAND，MU 是 DRAM+HBM+NAND，HBM 的結構性論證只適用於 MU；
  (2) SNDK 明確拆分了量價貢獻（三分之二來自漲價），MU 沒有 —— 這使 SNDK 的循環性更容易被檢驗，
  也讓它成為判斷整個記憶體循環位置的較佳指標。
  ｜52 週 +3,105% 與 52 週低 46.75 都受分拆影響，不可當作動能或支撐的參考。

