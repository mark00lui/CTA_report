# 公開研究檔範本 — 複製為 state/<ticker>.yaml。
# 本倉庫不含任何倉位資訊：無成本、無張數、無權重、無 Kelly、無損益、無持倉揭露。
# 未知值一律留 __ 並寫進 gaps，不要填看起來合理的數字。
ticker: 6442
name: 光聖
market: TW
factor_tags:
- ai_capex_hw
- optical
- cpo
- single_customer
- tw_fx
driver_refs:
- driver: accelerator-roadmap
  direction: '+'
  note: >
    CPO量產時點的產業側事實住在該 driver，不在本檔複製。⚠ 該 driver 的 cpo_layer_note 區分了兩層：
    scale-out 交換器（Spectrum-X／Quantum-X Photonics）已量產，scale-up（Rubin 的 NVLink 6）仍為銅。
    引用時務必指明哪一層 —— 混用會高估可及市場。
- driver: ai-accelerator-demand
  direction: '+'
  note: 加速器出貨量 → 互連埠數。領先 2–3 季，但 sensitivity 僅中：單一客戶占比高使傳導不純，族群需求上升不等於本檔拿到訂單。
- driver: hyperscaler-capex
  direction: '+'
  note: >
    capex → 機櫃內外光互連埠數 → 光通訊產品需求與 CPO 導入時程。領先 2–3 季，sensitivity 中
    （同上，單一客戶因素使傳導不純）。合計數值取該 driver 現值，不在本檔複製。
thesis: AI 資料中心光纖連接與 CPO 用光學互連需求，帶動產品組合升級與毛利結構性上移
thesis_since: 2026-08-27
valuation_base_year: 2026   # 曆年。首次設定；2027 僅 2 家機構、能見度不足，滾動時點為 Q3 財報（約 2026-11）
scenarios:
  bear:
    p: 0.25
    p_basis: 機率由使用者於 2026-08-27 全量重估指定。6 月營收 YoY 僅 +1.65% 暴露單一客戶拉貨的不穩定；毛利率 Q1 已由 2025 全年的 57.74% 降至 55.41%
    key_assumption: CPO 產業如期放量但本檔未進入五家供應鏈；A 客戶砍單或分散供應商
    key_assumption_history:
    - {until: 2026-08-27, text: CPO 量產遞延、A 客戶砍單或分散供應商,
       why_changed: "accelerator-roadmap 首次填值：scale-out CPO 交換器已進入全面量產、2026 秋出貨，產業側無遞延。失敗路徑因此由『CPO 沒來』改為『CPO 來了但本檔不在名單上』—— 而後者更難驗證，因為五家供應鏈名單不公開，技術時程卻是公開的。見 reports/2026/08/2026-08-27-6442-L1-cpo-scale-out-ramp.md"}
    eps: 42.0
    exit_multiple: 26
    multiple_basis: "錨在「成長動能停滯後的去化」：26x 低於現況 34.8x。⚠ 未取得自身歷史 forward 分位（台股報價頁 JS 渲染），為推論值 — 見 gaps"
    tp: 1092
    narrative: EPS 42 = H1 實績 19.07 + H2 22.9，相當於 Q3／Q4 各約 11.5 與 Q2 的 11.21 持平 — 不是災難，只是動能停在這裡。26x 低於現況 34.8x
  base:
    p: 0.50
    p_basis: 訂單能見度已達 2026 年底、產能滿載兩班制、菲律賓廠已投產，執行面條件齊備
    key_assumption: 光通訊占比維持高檔、CPO 依既定時程；H2 溫和成長，Q4 加速使全年達市場估計
    eps: 46.5
    exit_multiple: 35
    multiple_basis: "⚠ 無獨立估值基礎（依 references/valuation.md，signal.conviction 上限為低，本檔已符合）。錨 A 自身歷史 forward 分位：未取得，台股報價頁為 JS 動態渲染，WebFetch 取不到 — 這是可補的缺口，非本質性不可得。錨 B 同業平均 70.8x（近四季 trailing）明顯含 CPO 族群題材溢價，直接使用等於把族群的樂觀當基準。錨 C reverse-DCF 未執行。35x 即現價隱含值，屬市場定價非獨立判斷"
    tp: 1628
    narrative: 需 H2 做到 27.4（+44% vs H1），即 Q4 明顯加速。35x 為現價隱含值，非獨立判斷
  bull:
    p: 0.25
    p_basis: 需要 CPO／ELS 在 Q4 就有實質貢獻，而公司目前只給到「預計 2026 年可見到相關應用」。與 bear 對稱
    key_assumption: 產能擴充與 CPO／ELS 於 Q4 開始貢獻；毛利率維持 55%+
    eps: 52.0
    exit_multiple: 48
    multiple_basis: "錨在同業：同業平均 70.8x（近四季 trailing，含族群題材溢價），取 48x 未取該值。僅作 bull 上緣參照"
    tp: 2496
    narrative: 48x 仍低於同業平均 70.8x（近四季口徑，不完全可比），未取激進值
  weighted_tp: 1711
  # EPS 全部由 H1 實績 19.07 往下推。刻意不採用兆豐／國票／康和 2026-03 的預估
  # （38.18／40.41／36.46），那批數字已被 H1 實績超越，其目標價 2,000–2,450 建立在
  # 已作廢的獲利假設上。
