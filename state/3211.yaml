thesis: "爭點是 BBU 占比能否自 Q2 的 25–30% 拉到管理層說的全年過半"
thesis_since: 2026-09-10
# ⚠ 只留爭點，前提移入 key_variables 與 notes（LITE 那輪的教訓，AXTI 起沿用）。
#   前提（已確立、不是爭點）：**營收規模在成長** —— 2026 前 8 月累計 97.41 億元（年增 20.90%）、
#   8 月單月 16.77 億元創八個月新高；H1 營業毛利 11.53 億元（年增 +43%）。
#   ⚠ **為什麼爭點是占比而不是需求**：
#   **管理層說「非 IT 業務占比今年首度突破五成」，但 Q2 的實際占比降到 25%–30%，
#   而且 Q2 的成長來自 IT 產品 —— 敘事與該季的數字方向相反。**
#   ⚠⚠ **而算術讓這個爭點變得很尖銳**：
#   **H1 非 IT 約 18.8 億元；全年若要超過 50%（約 74.5 億元），
#   H2 的非 IT 須達約 55.7 億元，佔 H2 營收的約 70%。**
#   **「全年破五成」隱含的是下半年要衝到七成 —— 那不是一個溫和的假設。**

