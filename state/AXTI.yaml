      年報的地區別營收或主要客戶揭露算數 | 10-K`
      —— ⚠ **沒有它，無法分辨聯亞選住友的性質。**
    **恢復技術面可判定性**：`日內高低價，或 20 日平均振幅 | 有無 | 取得即執行 |
      需與現價同源 | 日 K 序列（換來源）`
      —— ⚠⚠ **比值目前只有一個卡在門檻上的上界 2.33 倍。**
    **偏空**：`合約鎖定覆蓋率 | 60% | < （至 2027-08-31）| 公司揭露算數 | 法說或財報附註`。
    **偏空**：`非 GAAP 毛利率 | 40% | < （連兩季）| 財報認列算數 | 10-Q`。
    **象限漂移（自 Q4 遷入 Q3，整套方法要換）**：
      `capex／營收 | 15% | > | 財報認列算數，董事會公告的計畫額不算數 | 合併現金流量表`
      —— ⚠⚠ **現值 10.99%，而 6.325 億美元募資 ÷ FY2026 共識營收 2.1798 億 ＝ 290%。
      若該金額在一至兩年內支出，這條必然觸發。這是每輪必問的第一題。**
    **偏多（需同時滿足基本面與技術面）**：
      `「1.3 億美元」確認為 InP 單項 | 有無 | 取得即執行 | 公司明確界定算數 | 法說`
      ＋ `合約鎖定覆蓋率 | 60% | > | 公司揭露算數 | 法說`
      ＋ `收盤價 | 50 日均線 62.70 | > | 需收盤價且比值可算出 | 日 K 序列`
      —— ⚠⚠ **三個條件都必須滿足。第一項若成立，base 目標價自 44 升到約 61。**

