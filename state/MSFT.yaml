notes: 本檔的分歧不在需求而在獲利品質。Azure、RPO、Intelligent Cloud 三者本季都沒有可爭論的空間；問題是那些營收要用多貴的資產去換、
  以及折舊何時入帳（落後 2–4 季）。街上把 FY27 EPS 成長從 FY26 的 +22% 砍到 +14%，就是這條負向傳導的定量表述。｜
  重要：2026-07-29 起 capex「金額」與「折舊入帳方式」正式分岔 —— 硬體端（TSM／3324／3017／6442）看的是出貨量，
  不受年限假設影響；平台端看的是進入損益表的折舊。drivers/hyperscaler-capex.yaml 用單一數值同時服務兩端的精度
  已因此下降。若平台端與硬體端的模型日後出現說不通的落差，第一個該懷疑的是這裡，不是個股層假設。
event_log:
- date: 2026-08-26
  level: L3
  summary: 手動全量重估（最近財報為 2026-07-29 FY26 Q4）。營收 $90.0B +18%、non-GAAP EPS $4.74 +23%、Azure +43%、RPO $678B +84%；曆年 2026 capex 由 ~190 降至 ~175
  delta: 論點層首次建立；基準年設為 FY2027；三情境寫定，加權目標價 512（無前值）；訊號偏多／信心中。兩條原 falsifier 門檻補齊後均未觸發，新增年限變更貢獻的第三條。資本支出年增移出 key_variables 改為 driver_refs 引用。關鍵發現：capex 口徑下修全數來自折舊年限 15→25 年與租賃重分類，非需求，driver 的三條 falsifier 亦均未觸發
