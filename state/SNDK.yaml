    ② 輸入獨立性辯護在本檔**必然失敗，且早已自承**：base 的 7x 就是現價隱含值，
       `multiple_basis` 從建檔起就明寫「**無獨立估值基礎**」、conviction 上限「低」。
       **本檔的 base 貼著現價不是巧合，是設計上的必然。**
    ⚠ **本輪最重要的實質新資訊：thesis 的爭點被量化了。**
    thesis 說「爭點是 NBM 長約能把價格鎖多久」，現在有數字 ——
