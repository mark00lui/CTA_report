thesis: "爭點是 8 月營收轉正來自 FAU 出貨還是跳線本業回溫"
thesis_since: 2026-09-10
# ⚠ 只留爭點，前提移入 key_variables 與 notes（LITE 那輪的教訓，AXTI 起沿用）。
#   前提（已確立、不是爭點）：**營收確實在回升，而且回升是連續的** ——
#   月增率自 2026 年 3 月起連續六個月為正（-8.39 → +9.10 → +12.39 → +9.49 → +8.51
#   → +19.69%），單月營收自 3 月的 1.173 億元升到 8 月的 2.045 億元（+74.3%）；
#   年增率自 4 月的 -37.30% 轉為 7 月的 +12.09%、8 月的 +13.20%。
#   ⚠⚠ **為什麼爭點是「來自哪裡」而不是「有沒有回升」**：
#   **市值 804.58 億元對 TTM 營收約 17.52 億元是 45.92 倍 ——
#   這個倍數在為 FAU 定價，不是在為跳線定價。**
#   **若 8 月的回升是跳線本業的循環回溫，那它證明的是一件市場沒有在買的事。**
#   ⚠ **而這件事在 Q3 財報的產品別營收上是可以直接讀出來的，
#   時間點就在 2026 年 11 月。**

