  reviewed: 2026-09-10
  anchor_width:   # 2026-09-10 首次取得 —— 此前完全沒有，信心評級只看得到缺口數
    fy2026_eps: >
      **11.27%** ＝（高 21.92 − 低 19.70）÷ 低 19.70，51 位分析師，平均 20.60。
      ⚠ **但這組共識是 GAAP 口徑、含股權證券利益，本檔已明列為不可用** ——
      平均 20.60 與 state 早記的「2026 共識 20.59 不可用」一致。**錨寬度可用，錨本身不可用。**
    price_target: >
      **39.7%** ＝（高 475 − 低 340）÷ 低 340，平均 422.34。
      ⚠ **這是本次最該被看見的一個數字**：缺口在減少（SOTP 已執行、錨寬度已取得），
      **但錨很鬆**。依規則「錨寬度擴大時，即使缺口數量減少，信心也不得自動升等」，
      本次為**首次量測**而非擴大，但 39.7% 的絕對水準已足以**抵銷**缺口減少帶來的升等理由。
      ⚠ 另記：分析師目標價的**最低值 340 仍高於現價 328.38** —— 全街無一家看到現價之下。
    fy2027_eps: ⚠ **仍未取得** —— 該年度的估計在資料商屬付費牆內容，見 gaps
