# 共用驅動因子。這一層存放「多檔標的共用、且不屬於任何單一標的」的變數。
# 規則：一個共用事實只能有一個家。個股 state 用 driver_refs 引用，不複製數值。
id: hyperscaler-capex
name: 四大超大型 CSP 資本支出
what_it_is: AMZN、GOOGL、MSFT、META 四家的年度資本支出合計與各自 guidance 區間
why_shared: >
  這是整個 AI 硬體鏈的需求上游 — 它不屬於任何單一標的，卻同時決定 TSM 的投片、
  3324/3017 的伺服器散熱附載、6442 的光互連需求。同時它也是四家自己的成本與折舊。
  若複製進每檔 state，數值會各自漂移且沒人會發現。

# ⚠ 2026-08-27 修正一個結構性問題：前版 current.value 為 725，但四個成分加總是 740。
#   前者是第三方統計、後者是公司揭露，兩者混用使整個序列無法重現。
#   本次起 current.value 一律為「四家公司揭露 guidance 上限之加總」，基準寫死在下方，
#   第三方統計改列為 cross_check 的外部參照，不再當作 current 本身。
current:
  value: 745
  unit: USD bn（2026 曆年合計 = 四家公司揭露 guidance 上限之加總）
  as_of: 2026-08-27
  tier: 事實
  basis: "Amazon 220 + Alphabet 205 + Microsoft 175 + Meta 145 = 745。全部為公司自行揭露，非第三方推估。"
  source: >
    各家 2026 Q2 財報與法說（Amazon 2026-07-30、Alphabet 2026-07-22、
    Microsoft 2026-07-29、Meta 2026-07-29）。
  yoy: "+82%（2025 約 410）"
  note: >
    ⚠ 合計數的變化會掩蓋成分的相反方向，看合計前務必先看成分：
    本次 725→745 的 +20 幾乎全部來自 Amazon 的真實上修，而 Microsoft 的 −15 是
    會計口徑而非需求縮手。若只看合計會低估真實需求的上行幅度。

