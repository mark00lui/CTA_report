      **而 2025Q2 的 -44.7% 正是 thesis「Q2 EPS 年增 75%」的成因**
    ｜`capex／營收 | 15% | > 即須自 Q1 重判為 Q2 | 計畫值不算數，以實際入帳為準 | 季報現金流量表`
    → 象限判準僅存的推論腿
    ｜`半導體與先進封裝應用占比 | 15% | > | 公司揭露算數，媒體轉述需第二來源 | 年報或法說產品別揭露`
    → **1 成營收對 7 成研發是選擇權還是投資效率不佳，靠這個占比會不會動來分辨。它只影響 bull，不影響 base**
    ｜`2027 共識 EPS | 有無 | 取得即執行 | 賣方預估算數 | 任一有覆蓋的來源`
    → **取得後基準年才滾得動、錨寬度才算得出來 —— 本檔目前三者皆無**
    ｜`收盤價 | 301.18 (MA60 季線) | > 且同日成交量 > 20 日均量 1.5 倍 且連三個交易日維持在其上 | 盤中價不算數，以收盤為準 | 交易所收盤價與成交量`
    → 重評為偏多的必要條件；⚠ 現況 270 距此 **+11.5%**、量能 0.77 倍，**兩項皆不成立**
    ｜`週收盤價 | 248.50 (MA240 年線) | < | 盤中價不算數 | 交易所週收盤` → 評級下修
    ｜`月營收年增率 | +10% | < 連兩月 | 需公司未歸因於季節性或客戶排程 | 公開資訊觀測站` → 偏空

