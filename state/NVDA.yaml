    ⚠ **今早重估時標記為「下次處理」的項目，本次處理。** 第二條 falsifier 原為「Non-GAAP 毛利率連兩季低於 72%」，但管理層 2026-08-26 已指引 Q4 FY27 毛利率觸底 **71–72%** —— 這條會被**公司自己的指引**觸發，而那不是壞消息：CFO 明確歸因記憶體成本，且 FY2028 隨 Q1 漲價回到 72–73%。**一條會被「已知且已解釋的事」觸發的 falsifier 沒有鑑別力。** 改寫兩點：門檻自 72% 降至 **70%**（低於指引谷底，確保只有超出指引的惡化才觸發）；加上**歸因條件**（記憶體成本是外生投入價格，需求或定價轉弱才是論點層問題）。check_by 自 2027-02-28 延至 2027-05-31，因需看到 FY2028 Q1 漲價後的實際結果。⚠ 一般性教訓已寫入該條 note：**falsifier 的門檻會被公司的新指引作廢**，每次重估都該檢查門檻是否仍落在「意外」的區域，而不只是檢查它有沒有觸發。這是本倉庫第一次抓到這種情形。三情境、倍數、加權目標價 255 全部不變。
