gaps:
- question: ⚠ 客戶集中度未取得。光收發器業界普遍高度集中，且本檔資料中心段已占營收 79%，但未取得前五大或單一客戶占比
  how_to_close: 10-K 的客戶集中度揭露（重大客戶占比逾 10% 須列示）
- question: ⚠ 為何 FY2026 Q4 營收與 Q1 指引皆優於共識，股價仍自 52 週高回落 32.9%。財報優於預期而股價下跌，代表市場擔心的不在損益表 —— 最可能是現金流，但無直接證據
  how_to_close: 財報後的賣方報告與法說 Q&A 逐字稿；比對回落的起始日與哪則消息同步
- question: ⚠ FY2027 EPS 共識區間口徑不一致。取得中位 9.41（19 位，會計年度截至 2027-06，且與遠期本益比 31.30 對得上）；但另一來源給區間 7.19–10.69、中位 8.50，兩者無法調和。bear／bull 的 EPS 因此留空
  how_to_close: 單一來源的完整分析師分布（Visible Alpha／FactSet），確認會計年度定義
- question: ⚠ 自身歷史遠期本益比不可用。五年平均本益比 75.39 為 trailing 口徑，且該期間分母受 II-VI 併購 Coherent（2022）後的整合期與工業段景氣下行壓抑 —— E 趨近零時本益比爆炸，平均值失去意義。這與 SNDK（分拆無歷史）、3008（商業模式轉型）都不同，是錨 A 的第三種失效模式
  how_to_close: 歷史遠期本益比 band（Koyfin／Bloomberg）；或改以 EV/Sales、EV/EBITDA 的歷史區間替代
- question: ⚠ 正常化自由現金流水準未知。現價隱含的市值 576.5 億美元需要多少常態自由現金流才合理，取決於 capex 何時見頂 —— 而管理層只給了「18 個月回收期」這個宣稱，沒給 capex 的峰值時點
  how_to_close: 逐季追蹤 capex 與折舊的差額；capex 見頂訊號出現後，用折舊／營收比推算維持性資本支出
- question: take-or-pay 長約的實際金額、期間分布與違約條款未揭露。「訂單能見度」這一格目前只能是質性
  how_to_close: 10-K 的合約義務附註；法說 Q&A
- question: 工業段（FY26 Q4 -15.8% YoY）的落底時點與常態獲利水準。它是本檔唯一的非 AI 業務，也是合併毛利率的拖累來源
  how_to_close: 分部損益揭露；同業（Lumentum、IPG）的工業段趨勢交叉比對
- question: 街上目標價有兩個並存數值：384.45（S&P Global，22 位）與 416.09（stockanalysis，22 位，2026-08-19）。取得日期相近但差距 8.2%，未能調和
  how_to_close: 確認兩者的統計口徑（是否含未更新的舊目標價）與截止日
notes: >
  納入本檔的主要研究價值不在於多一檔 AI 硬體，而在於它是覆蓋清單中**唯一能提供
  第一手 CPO 時程**的標的：初期營收 2026 年 12 月當季、scale-up 曆年 2027 下半、
  逾 150 億美元增量可及市場、「幾乎每個大型策略客戶都有 CPO 或 NPO 專案」。
  6442 與 3008 的 CPO 論點目前都只有各自管理層的說法，沒有外部座標可交叉驗證；
  本檔補上了這一格。第三條 falsifier 因此同時是那兩檔的檢驗點。
  ｜⚠ 但這個價值有代價：納入本檔使 cpo 因子自 2 檔變 3 檔（18.2% → 25.0%）、
  optical 同樣 2 → 3、ai_capex_hw 自 6 檔變 7 檔（54.5% → 58.3%）。
  **這是覆蓋清單第一次出現「新增標的同時加深它自己的每一個因子」。** 詳見 coverage.yaml。
  ｜本檔與 6442 的關係需要分清：兩者都在光互連鏈上，但 COHR 是垂直整合的元件與模組廠
  （自製磷化銦雷射到收發器），6442 是光通訊產品廠且單一客戶占比 63%。
  因此 COHR 的訂單能見度不等於 6442 的訂單能見度 —— 族群需求對 6442 不等於訂單，
  這一點 6442 自己的 driver_refs 已註明。判讀時不要把 COHR 的「FY2027 售罄」
  直接外推到 6442。
  ｜3008 切入的 FA／PMLA／FAU 光纖陣列模組位於 CPO 封裝的上游環節，
  而 COHR 提供 CPO 用的超高功率連續波雷射。兩者在同一條鏈上但不同位置，
  目前無直接證據顯示是競爭關係 —— 但也無證據顯示不是。這是納入本檔後
  新出現的一個待查問題。
  ｜估值上本檔目前是覆蓋清單中資料最不完整的一檔之一：錨 A 因分母趨零而失效、
  reverse-DCF 因自由現金流為負而無法用永續模型直接反推。這兩件事都不是「查不到」，
