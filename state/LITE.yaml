signal:
  rating: 中性
  conviction: 低
  basis: >
    ⚠ **「中性」在本檔的意思是「尚無估值判斷」，不是「多空平衡」。**
    三情境與加權目標價尚未建立（見 scenarios 的說明），**沒有目標價就沒有可檢驗的評級**。
    ⚠ **且技術面本輪無法判定** —— 均線未取得，`confirm_trigger` 與 `invalidation` 都是 `__`。
    **依 CTA 紀律，在右側確認無法判定時不得升為偏多，即使 52 週報酬達 +561.97%。**
    **「已經漲很多」從來不是評級的理由，「無法判定」更不是。**
    ⚠ **信心壓在「低」有三個具名理由**：
    (1) ⚠⚠ **錨寬度 70.7%（目標價 820–1,400，26 位分析師），是本清單至今最寬的一檔** ——
        對照 GOOG 39.7%、CEG 5.78%。**依 SKILL.md，錨寬度寬時信心不得升等。**
        **而錨寬度寬本身就是資訊：分析師對這檔的分歧程度遠高於清單其餘標的。**
    (2) **分部別營收占比與 CPO 進度兩個缺口都擋住主錨** —— 見 gaps 前兩項。
    (3) **象限判定卡在門檻上**（capex／營收 14.97%，距 15% 僅 0.03pp），
        **下一輪 capex 若再增即落入 Q3，整套方法要換。**
    ⚠ **已經確定的兩件事，先寫下來**：
    **(a) 營運拐點是真的** —— FY2026 營收 +83.22%、Q4 +109%、營業利益自 -192.2 轉為 +536.2、
        非 GAAP 毛利率 50.4%（+1,260bps）、提前逾一季達到目標營運模型。
    **(b) 而估值同時是族群最貴的** —— EV/Sales **29.08x** 對 COHR 8.57、FN 3.04；
        EV/EBITDA **109.46x** 對 COHR 未取得、FN 26.60。
        ⚠ **EV/EBITDA 109.46 是用真實 EBITDA（800.7M）算的，不受債務清償費用影響。**
        **「淨損是假的」與「倍數是貴的」兩件事同時為真，不可用前者否定後者。**
  changes_if: >
    ⚠ 五欄語法（資料項 | 門檻 | 不等號方向 | 計畫值是否算數 | 資料來源）。
    **恢復技術面可判定性（最高優先）**：`50／200DMA | 有無 | 取得即執行 |
      資料商或券商值算數 | 報價頁` → 在此之前不得升為偏多。
    **升為可評級**：完成 `/revalue LITE`（前置條件為取得分部別終端市場營收占比）。
    **偏空**：`Q1 FY2027 營收 | 12.3 億美元（指引下緣） | < | 財報認列算數，指引不算數 | 8-K`。
    **偏空**：`非 GAAP 毛利率 | 45% | < | 財報認列算數 | 季報` —— 連兩季。
    **信心升至中**：`分析師目標價錨寬度 | 40% | < | 查得值算數 | 共識頁`
      ⚠ **現為 70.7%，這一條短期內不太可能成立，寫下來是為了讓它可被檢驗。**

