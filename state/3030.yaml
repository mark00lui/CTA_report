  methods:
    primary: 錨 B（同業 —— 致茂 2360，但必須大幅折價且理由須具名）
    secondary: 錨 A（自身歷史 trailing PE，**限 2024 年後的 regime**：15–34x）
    check: P/S 對照同業（本檔 **6.98** 對致茂 **23.39**，折價 70.2%）
  axes_crossed:
  - 參照（軸④：同業 vs 自身歷史）
  - 分母（軸①：PE 用會計盈餘、P/S 用營收）
  excluded: >
    ⚠ **不可用 forward PE** —— 本檔 forward PE 為 **n/a**，因為**沒有分析師覆蓋**
    （stockanalysis 的 /forecast/ 頁回 404）。
