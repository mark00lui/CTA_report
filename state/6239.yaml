  │      這對 ai-accelerator-demand 的傳導強度是往**下**修正，不是往上。
  ├ (＋) **FOPLP 客戶為 AMD／Broadcom、良率 94–95%、產能已被預訂** ——
  │      9/1 稍早那份 L1 報告記下的「旗艦 vs 邊緣運算」矛盾，本次由公司側解決。
  │      **保留矛盾而不硬選一邊，換來的就是這個：矛盾解決時不必推翻自己。**
