    **capex／營收 FY2024 7.37% → FY2025 7.59% → FY2026 15.49%（11.03 億 ÷ 71.2 億）。**
    ⚠ **是「已發生數」不是計畫值**（對照 3081 那一輪把公告額當已支出額，已撤回）。
    ⚠⚠⚠ **而漂移之後本檔落在一個 valuation-map 沒有格子的位置**：
    **Q2 的處方寫「純 PE 會系統性高估」而本檔的主錨正是同業 forward PE；
    Q2 處方的方法（逆向 DCF）因自由現金流 -10.23 億而算不出來。**
    **→ 本檔屬於一個象限，而那個象限禁用它唯一能執行的方法、處方它無法執行的方法。**
    **這與 3081／3363 的「Q3 應區分循環型與擴建型」同類、位置不同；兩個軸沒有第三個維度
    表達「現金流的符號」。應回填 references。**
    ⚠⚠ **處置：方法不變，但理由是「事先寫定的改錨條件沒有觸發」而不是「我覺得還能用」**——
    逐條複查：LITE 的 trailing PE 仍為 n/a ✗；LITE 的 EV/EBITDA 103.5 < 120 ✗。
    **象限漂移是換方法的強理由，而條件沒觸發就不換 —— 否則事先寫定條件就失去全部意義。**
    ｜⚠⚠⚠ **取得完整五年現金流後，「紅旗在哪裡」的判斷改變了**：
    **營運現金流÷營收 12.46% / 11.96% / 11.59% / 10.91% / **1.12%**（FY22→FY26）——
    營收成長 22.5% 的同一年掉了 9.8 個百分點。**
    **把 1,216 百萬的自由現金流惡化拆開：營運現金流未隨營收成長 -698（57%）、
    資本支出超出歷史比率 -563（46%）、交互項 +45。**
    **營運現金流那一半比資本支出那一半大，而兩者的可逆性完全不同 ——
    資本支出是決定，收現是能力。**
    **既有第一條 falsifier 測兩者的差，無法區分它們 → 新增第五條單獨測營運現金流（門檻 6%）。**
    ｜⚠⚠ **把 18 個月回收期的說法對照資本成本，那把一句話變成一個數字**：
    **r ＝ 4.97%（10 年期美債 2026-09-10）＋ beta 2.10 × 4.5% ＝ 14.4%；
    18 個月回收期 ≈ 48% 內含報酬率 ＝ 資本成本的 3.3 倍；即使 3 年回收，24% 仍高於 14.4%。**
