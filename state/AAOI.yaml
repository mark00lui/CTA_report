    **(1) 3081 要求的 capex 口徑重查 —— 本檔通過。**
    **3081 查出它的「近三季 capex 近 60 億元」是公告額而非已支出額，並指定本檔重查。**
    **本檔的 768.64 是現金流量表數，三個檢驗都過：現金流量表三者互洽
    （FCF ＝ OCF − capex → -131.82 − 768.64 ＝ -900.46，與所載完全一致）；
    資產負債表量級可能（768.64 ÷ 總資產 2,300 ＝ 33%，對照 3081 的 92% 不可能）；
    資金來源明確（股數年增 49.26% ＋ 淨現金 1.996 億美元）。**
    ⚠⚠ **而這件事本身值得記**：**「某一檔查出口徑錯誤，就假設同形態的另一檔也錯」
    與原來的錯誤是同一種偷懶 —— 兩次都是用現成的解釋取代查證。**
    **(2) 6805 要求的層級軸改正 —— 結論不變，理由要換。**
    **原寫「主錨在分部層、副錨在企業／股權層、檢查器在每股層」，三項裡有兩項不屬於層級軸
    （「分部」屬於分母軸；「每股」是股權層的一種表達）。**
    **真正撐住這個宣稱的是 primary 的 EV/Sales（企業層）對 secondary 的 P/B（股權層）——
    改正之後它反而更紮實。**
    ｜⚠⚠⚠ **主錨（分部別倍數）在本輪第一次真的算得出結果，而結論是負面的。**
    **6805 與 3081 的分部拆解都因同業倍數離散過大而做不出來；本檔做得出來，
    因為兩邊的分部同業都存在、倍數都與錨定價同日、且都用同一個口徑（trailing）。**
    **資料中心 TTM 營收 3.337 億 × 中際旭創 16.4 ＝ 54.73 億；CATV 2.503 億 × Harmonic 2.86
    ＝ 7.16 億；其他 0.36 億 → EV 62.24 億 ＋ 淨現金 1.996 億 ＝ 股權 64.24 億 ÷ 84.91M 股
    ＝ **每股 75.66 美元，比 2026-09-10 收盤 103.29 低 26.7%**。**
    **而那是上界 —— 它假設本檔的資料中心分部享有中際旭創整家公司的倍數，
    而後者淨利率 +31.3%、本檔整體 -9.57%。**
    ⚠⚠ **更直接的表達：本檔市營比 14.72 對「自身業務組合加權的同業倍數」10.45 —— 貴 40.9%。**
    ⚠ **並發現我建檔時違反了自己剛寫下的禁用**：**我禁用了「整體 EV/Sales 單一數字」，
    卻又在對照中際旭創時用了整體對整體（「15.38x 對 16.4x —— 幾乎相同」）。拆開之後是貴 40.9%。**
    ｜⚠⚠⚠ **並找到 3081 那條「口徑必須對稱」規則的第一個實際解法：用淨利率做橋。**
    **forward 市營比 ＝ forward PE × 預期淨利率 → 中際旭創 17.70 × 31.3% ＝ 5.54x。**
