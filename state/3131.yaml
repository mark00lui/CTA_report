    ｜評級**中性／信心低**。位階**整理**（價格 2,555 在季線約 2,843.28 之下 10.14%），
    **invalidation 留空 —— 已跌破的線不能當失效價位。**
    ⚠⚠ **但本檔為那條雙邊規則提供了第二個「比值約 1.2 倍」的樣本，兩個樣本構成一個建議**：
    **3211 為 5.19% ÷ 4.39% ＝ 1.18 倍；本檔為 11.28% ÷ 9.30% ＝ 1.21 倍。**
    **絕對距離差一倍以上而比值幾乎相同 —— 說明「太近」的門檻應該用「距離 ÷ 日振幅」表達，
    而不是絕對百分比；且 1.2 倍很可能仍然太緊，可用的失效價位大概需要 2–3 個日振幅以上。**
    ｜⚠⚠ **兩個流程缺陷在本檔同時達到「不能再列成 gaps」的次數**：
    **淨現金未取得（本日第七檔）、前三大客戶占比未取得（連續第六檔把第四條 falsifier
    標成未驗證）。兩者都不是「這次沒查到」，是沒有列進建檔的固定步驟。應一併補進流程。**
    ⚠ **引用京鼎 3413 時已逐項確認**（valuation-map 記過「不是 3413，3413 是京鼎」）——
    **昨日才因代號筆誤更正過一次（3221 是台嘉碩），兩天之內兩次，
    更說明「名稱與代號互相驗證」該寫進建檔步驟。**
    ⚠ 另記：**成交量僅約 84.8 萬股，本輪十三檔中最低** —— 不影響估值判斷，
    但影響任何以價格為門檻的規則的可執行性。

