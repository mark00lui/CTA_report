driver_refs:
- driver: hyperscaler-capex
  direction: '+'
  note: >
    CSP 資本支出 → 伺服器建置 → 高速連接器與插槽。
    ⚠⚠ **敏感度刻意記「低」，而且理由必須寫清楚，否則下一輪會被當成保守而調高**：
    **本檔的伺服器營收（Q2 佔 55.36%）主要來自一般用途伺服器的 CPU 插槽，
    而不是 AI 加速器的建置。** 直接與 AI 相關的 QDS **目前佔營收約 1%**（下半年估 2–3%）、
    SOCAMM 剛於下半年量產，**管理層明言 GPU／AI 晶片專案的「採用與導入時間不確定」。**
    ⚠⚠ **真正驅動本檔的是 Intel Oak Stream 與 AMD Venice 的平台世代切換
    （管理層估 2026 Q4 或 2027 初放量）—— 而現有三個 driver 沒有任何一個記這件事。**
    **正確做法是新增 `server-platform-cycle` driver。**
  # ⚠⚠ 這已是**同一個結構問題的第三個實例**（CEG：沒有 driver 記用電量；
  #   AAOI：沒有 driver 記 DOCSIS 升級循環；本檔：沒有 driver 記 CPU 平台世代）。
  #   **三次就是模式不是巧合：三個現有 driver 全部只記「AI 資本支出的流量」，
  #   而清單正在納入越來越多不由那個流量驅動的標的。**
- driver: ai-accelerator-demand
  direction: '+'
  note: >
    加速器出貨 → SOCAMM（AI 伺服器記憶體模組形態）與 QDS 的掛載量。
    ⚠ **敏感度低**：兩者合計目前佔營收僅約 1%（下半年估 2–3%），
    **且 QDS 的毛利率低於公司平均**（ASP 每 set 20–30 美元，對 EPS 為正貢獻但拉低毛利率）。
    ⚠ **這是本檔唯一與本 driver 直接相關的部分，扇出時不得把 55.36% 的伺服器營收算進來。**
  # ⚠ `accelerator-roadmap` 經考慮後**刻意不引用**，理由記在這裡以免下一輪誤以為是漏掉：
  #   本檔的產品是插槽與連接器，**沒有證據顯示它的規格世代跟著互連 roadmap（NVLink／CPO）走**；
  #   它跟的是 CPU 平台 roadmap，那是另一件事。**記錄「刻意不引用」與記錄「引用」一樣重要。**

valuation_frame:
  quadrant: Q1
  quadrant_basis: >
    **X 軸（當期盈餘代表性）＝ 高，而且是本日四檔中唯一的一次。**
    TTM EPS **82.02 元**（FY2025 為 **70.17**、2026 H1 累計 **39.04**，年增 +45%）——
    **分母又大又正，既不趨零也不為負。** 對照本日另三檔：
    AXTI trailing PE 1,141.03（分母趨零）、AAOI EPS -0.79（分母為負）、LITE 亦為 GAAP 負數。
    **本檔是本日第一檔 trailing PE 可以直接當工具用的標的。**
    毛利率 Q2 **45.47%**、營業利益率 **21.97%**、Q2 稅後 **19.84 億元**。
    ⚠ **業外與一次性項目都有，但相對於 19.84 億的單季淨利都不大**：
    匯兌損失 1.67 億（人民幣對美元升值）、庫藏股發放員工費用 2.79 億（一次性）。
    ⚠⚠ **但 X 軸不是滿分，理由要指名**：**毛利率正在轉折向下且原因是成本面的** ——
    Q1 **49.55%** → Q2 **45.47%**（-4.08pp），管理層說明為
    「2025 年採購的低價原物料庫存已於第一季消化完畢」，
    **銅、金、塑膠佔 COGS 比重自 45–50% 升到 65%**，
    且改善「需等油價回穩與新產品放量，預計 2026 Q4 或 2027 初」。
    **亦即：Q1 的 49.55% 是管理層自己說的庫存產物，不可當正常水準。**
    ｜⚠⚠ **Y 軸（資本密集度）＝ 未取得，這是本檔最弱的一環，必須誠實標出。**
    **capex／營收、折舊占營收比重、淨現金／淨負債三項全部未取得。**
    可用的間接證據只有兩條，**都是推論不是事實**：
    (a) 公司公告的籌資規模很小 —— 現金增資普通股上限 **130 萬股**（佔在外股數 11,253 萬股的
        **1.16%**）＋ 國內第三次無擔保可轉債上限 3 萬張，
        **與「capex／營收 > 15% 的大規模擴建」不相容**（對照 AAOI 同期發行新股 13.51 億美元）；
    (b) 股價淨值比 **4.46**、每股淨值 **373.63 元**（2026Q1）——
        **市場不是在買資產，這與 Q3 象限的性質相反。**
    ⚠ **處置：先判 Q1，並把 capex／營收 列為 gaps 第一項與每輪必問的第一題。**
    **若 capex／營收 > 15%，本檔應移入 Q2（現金流與企業價值），整套方法要換。**
    **這是本日四檔中證據最薄的一個象限判定，寫在這裡以免日後把它當成已確立。**
  quadrant_since: 2026-09-10
  peer_group: 連接器與插槽（伺服器 CPU socket、高速 I/O、線束）
  peers:
  - >
    **貿聯 BizLink（台股 3665）** —— 線束與連接器，伺服器與電動車曝險。
    ⚠ **本輪未取得任何倍數，列 gaps。**
  - >
    **信邦 3023** —— 連接器與線束整合。⚠ **本輪未取得任何倍數，列 gaps。**
  - >
    **Amphenol（NYSE:APH）** 與 **TE Connectivity（NYSE:TEL）** —— 全球連接器龍頭，
    **是「同業平均本益比 47.44」這個數字最可能的成分來源之一**。
    ⚠ **本輪未取得，而它們是主錨的錨。**
  - >
    **立訊精密 Luxshare（深圳 002475）** —— ⚠ **刻意列入，理由與 AAOI 那輪相同**：
    **不取 A 股樣本，這個族群的參照會完全偏向美股與台股。**
    AAOI 那輪取得中際旭創後發現「美股樣本的倍數水準明顯高於 A 股龍頭」，
    **本族群是否也有同樣的偏差，取得之前不知道。**
  rank_metrics:
  - >
    **① 伺服器營收占比與其年增率。** 本檔 Q2 2026 **55.36%，年增 +71%、季增 +10%**
    （對照桌機 14.46%／-14%、筆電 8.2%／-14%、車用 7.63%／+24%、嘉基 4.31%／-19%）。
    ✓ **取得性已確認（公司法說逐季揭露）。**
    ⚠ **這一項要小心讀**：**總營收年增只有 +17.7%（前 8 月累計），
    亦即伺服器 +71% 的同時，非伺服器的一半在萎縮。組合在改善，規模沒有跟上。**
  - >
    **② 毛利率。** 本檔 Q2 **45.47%**（Q1 49.55%、FY2025 約 51%）。
    ✓ **取得性已確認，所有上市同業皆公開。**
    ⚠ **這一項本檔在族群頂端**（連接器同業一般在 25–35%），
    **而頂端正是「是結構水準還是循環高點」這個 thesis 要問的地方。**
  - >
    **③ 新平台世代的插槽規格取得與放量時點**（Intel Oak Stream、AMD Venice）。
    ⚠ **取得途徑已確認但只有一半**：平台商的 roadmap 是公開的，
    **但「哪一家拿到哪一顆插槽」通常只能自各家法說推斷，不保證每季都拿得到。**
    **誠實標出這一項的取得性弱於前兩項，而不是假裝三項等強** ——
    **LITE 那輪記下的流程問題正是「寫定指標時沒有同時確認它取得得到」。**
  methods:
    primary: >
      **同業 forward PE 序位**（參照軸 —— 同業而非自身歷史）。
      現值：本益比 **19.81**（以昨收 1,625 ÷ TTM EPS 82.02，與 Yahoo 所載完全吻合）；
      以現價 1,575.50 計為 **19.21x**；以法人共識 2026 EPS **95 元**計為 **16.58x forward**。
      ⚠⚠ **Yahoo 同日載「同業平均本益比 47.44」——本檔約為其 42%。**
      **但那是一個彙總值，我不知道成分股是誰、怎麼加權，所以它現在只是一個線索不是錨。**
      **必須逐家取得（3665／3023／APH／TEL／002475）才能定序位 —— 列 gaps。**
    secondary: >
      **EV／營業利益（或 EV/EBITDA）**（層級軸 —— 企業價值而非股權）。
      ⚠ **前置條件是淨現金／淨負債，本輪未取得，列 gaps。**
      **選它的理由**：本檔正計畫現金增資與發行可轉債，
      **資本結構即將改變，只看股權層的 PE 會看不見這件事。**
    check: >
      **正常化毛利率下的 EPS**（時間軸 —— 中週期而非當期）。
      ⚠⚠ **這不是套用通則，是回應一個具體的、管理層自己說出口的事實**：
      **Q1 的 49.55% 毛利率是「2025 年採購的低價原物料庫存」的產物，
      而原料佔 COGS 已自 45–50% 升到 65%。**
      **亦即當期毛利率的分子被一個已經結束的庫存效應墊高過，正常化不是保守是必要。**
    # ⚠ 三個方法在 **時間** 上刻意不同（trailing／當期企業價值／中週期），
    #   在 **參照** 上刻意不同（同業／自身企業價值／正常化理論值），
    #   在 **層級** 上刻意不同（股權／企業／股權但換分子）。
  axes_crossed:
  - 參照
  - 層級
  - 時間
  # ⚠⚠ **刻意只宣稱三軸，不宣稱跨了分母軸。**
  #   三個方法的分母都在「會計盈餘」這一類（淨利／營業利益／正常化淨利）——
  #   valuation-map 的分母軸列的是「會計盈餘／現金流／帳面資產／營收／產能」，
  #   **EBITDA 與淨利同屬第一類。宣稱跨四軸會是過度宣稱，而過度宣稱交錯驗證
  #   正是這一層最危險的自欺 —— 它讓人以為已經檢查過了。**
  excluded: >
    ⚠ **禁用 PEG 單獨作結論** —— valuation-map 明列「PE ＋ PEG」是**假的**交錯驗證
    （同一個分母，g 也來自盈餘）。**且本檔 Q2 EPS 年增 164%、H1 年增 45%、
    總營收年增僅 17.7% —— g 取哪一段會完全改變答案。**
    ｜⚠ **禁用「自身歷史 PE 分位」作為唯一錨** —— 那是軸④（參照）的典型失效，
    **6239 那次踩的正是這個**；且本檔的獲利結構兩年內變動很大
    （FY2025 EPS 70.17、TTM 82.02），與更早期不可比。
    ｜⚠⚠ **禁用把 Q1 2026 的 49.55% 毛利率當成正常水準** ——
    **管理層自己說那是低價庫存的產物。用它當基準會讓每一個下游數字都偏高。**
    ｜⚠ **本輪不做 DCF** —— DCF 在 Q1 象限「可用」，**但 capex／營收未取得，
    自由現金流的分母不在。可用不等於做得出來。**
  reviewed: 2026-09-10

thesis: "爭點是 45.47% 毛利率是結構水準還是已在下滑途中的循環高點"
thesis_since: 2026-09-10
# ⚠ 只留爭點，前提移入 key_variables 與 notes（LITE 那輪的教訓，AXTI 起沿用）。
#   前提（已確立、不是爭點）：獲利是真的且規模不小 —— TTM EPS 82.02、Q2 營業利益率 21.97%。
#   ⚠ 為什麼是毛利率而不是估值：**本益比 19.81 對同業平均 47.44 這個落差，
#     若毛利率是結構水準就是明顯的錯價，若是循環高點就是市場對峰值盈餘給的正常折價。
#     兩個結論完全相反，而分歧點只有一個 —— 所以爭點就是它。**

