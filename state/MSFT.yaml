valuation_frame:   # 2026-09-01 首次宣告。⚠ 本次的重點是象限漂移，不是倍數
  quadrant: Q2
  quadrant_basis: >
    ⚠ **自 Q1 遷入 Q2**。FY2026 資本支出 **115.9B（+79.6%）**，含融資租賃口徑約 **175B**；
    以 FY2026 營收約 305B 計，capex／營收約 **38%**（含租賃約 57%），遠超 15% 門檻。
    自由現金流 67.0B（**-6.5%**），P/FCF **56.3x** 為遠期本益比 25.68x 的 **2.19 倍**。
    ⚠ **但本檔位於 Q2 的健康端**：自由現金流為正且規模大，FCF／OCF 轉換率 **36.6%** 為族群最高，
    且是四大 hyperscaler 中**唯一被預期 2026 年自由現金流仍成長（+5%）**的一家。
    **象限改變的是方法，不是自動代表要調降倍數。**
  quadrant_since: 2026-09-01
