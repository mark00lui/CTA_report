    5.28 倍正好是兩個極端。**
    ｜⚠⚠⚠ **結論：極低 X ＋ 高 Y ＝ Q3（資產與循環）。本輪二十檔中第四檔落在 Q3。**
    ⚠⚠⚠ **而本檔是第一檔「循環型」Q3，前三檔（AAOI 128.97%、3081 217.8%、
