notes: 街上目標價的上升來自倍數擴張而非獲利上修 —— FactSet 兩次調查對照：EPS 58.08→57.34（下修），
  目標價 1,320→1,425（上修），隱含倍數由 22.7x 升至 24.9x；高盛 2026-08-17 同樣是上調目標價、下修毛利率。
  這不必然是錯的（2026 EPS 共識 +103%），但意味目標價共識對「市場願意付幾倍」的依賴高於對「公司賺多少」的依賴，
  而前者比後者脆弱。這是把 bear 倍數設在 15x（低於現況 18.8x）的理由。
  ｜與 NVDA 的對照：NVDA 的賣方均值目標價幾乎等於該檔的 bull 情境；本檔街上目標價 1,425 落在 base(1,261) 與
  bull(1,878) 之間偏 base 上緣 —— 街上對本檔的樂觀程度低於對 NVDA，即使本檔營收成長率遠高於 NVDA。
