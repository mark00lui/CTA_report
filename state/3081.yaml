    **這是 valuation.md 禁止的「base ＝ 現價隱含倍數」的一個更難察覺的變形，
    而現有的循環性檢查抓不到它（1,960 距現價 30.8%，看起來像有內容的判斷）。**
    **診斷方法：把 EPS 改掉，看目標價動不動。**
