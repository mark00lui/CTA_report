    ⚠ **信心壓在「低」有四個具名理由：**
    (1) ⚠⚠ **主錨（成長持續期）需要一個穩態獲利水準，而 thesis 押的正是那個水準會不會上移。**
        **用一個尚未確定的數字當穩態，等於把答案先寫進假設。**
    (2) **副錨的兩家同業 forward PE 都有來源衝突**（CLS 22.88 對 37.61、
        ANET 37.42 對 49.98）——**倍數差 60% 以上，不是小數點問題。**
    (3) ⚠ **技術面已破季線 13.08%，右側確認條件距現價 +15.1%。**
    (4) **實際 capex／營收 未取得** —— Y 軸靠三條間接證據（ROE 52.9%、權益週轉率 5.07x、
        股價淨值比 16.31）撐著。**證據夠強到排除高資本密集，但不等於量到了。**
    ⚠ **已經確定的事，先寫下來，免得被上面四條的謹慎蓋掉：**
    **(a) 量是真的，而且沒有一個月不成立** —— FY2025 營收 **+125%**、
        2026 前 8 月累計 **+61.86%**、近六個月單月年增率介於 **+44.43% 到 +71.69%**。
        **本清單裡沒有第二檔的成長曲線與四大 CSP 資本支出曲線貼得這麼近。**
