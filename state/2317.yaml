valuation_frame:
  quadrant: Q1
  quadrant_basis: >
    ⚠⚠⚠ **X 軸（當期盈餘代表性）＝ 高，但這個判定要精確到層級，否則會判錯**：
    **有代表性的是**營業利益**，不是稅後淨利。**
    **2026 Q2：營收 2.53 兆元（季增 19%、年增 41%）、
    毛利率 **6.12%**（年減 0.21pp）、**營業利益 948 億元（年增 68%）**、
    **營業利益率 3.75%（年增 0.60pp，歷年同期新高）**、
    稅後淨利約 600 億元（年增 30%）、**淨利率約 2.37%**、EPS **4.27 元**。**
    **H1：營收 4.65 兆元（年增 35%）、營業利益 1,705 億元（年增 65%）、
    稅後淨利 1,099 億元（年增 27%）、EPS 7.84 元（年增 26%）。**
    ⚠⚠⚠ **判「高」的理由**：**本檔的商業模式沒有在改變 —— AI 機櫃是同一個組裝生意的更多量，
    不是一個不同利潤結構的新生意。**
    **淨利率 2.35%（Q1）→ 2.37%（Q2）；毛利率 6.12%。這些量級三十年沒變過。**
    **對照本輪其他標的：3363 是跳線 → FAU（毛利率結構完全不同）、
    6531 是 IoTRAM → VHMStack（產品線整個換掉）。本檔不是那種轉型。**
    **分母也完全健康：TTM EPS 約 **15.08 元**、本益比 **16.61**。**
    ⚠⚠⚠ **但判「高」的同時必須寫下那個唯一的、而且很大的疑點 ——
    它就是 thesis**：**營業利益年增 68%，稅後淨利只年增 30%。**
    **「稅後淨利 ÷ 營業利益」自去年 H1 的約 83.7%（1,033 ÷ 865 反推）
    降到今年 H1 的約 64.5%（1,099 ÷ 1,705）—— 掉了約 19 個百分點。**
    **亦即營業層的改善沒有等比例落到歸屬母公司的每股盈餘上。**
    **X 軸判高指的是營業利益；稅後淨利那一層目前不具代表性。**
    ｜⚠ **Y 軸（資本密集度）＝ 低。**
    ⚠ **實際 capex 金額與 capex／營收 未取得（列 gaps）——
    只知道「上修資本支出年增三成以上」，那是變動率不是水準。**
    **判低的依據是結構與兩個比率**：**電子製造服務以組裝與人力為主，
    設備投資對營收的比例遠低於半導體；**
    **股價淨值比 **1.85**（每股淨值 135.57 元）、ROE 約 **11.1%**、
    **股東權益週轉率約 5.28 倍 —— 本清單最高**。**
    **一家用 1.91 兆元淨值做 10.07 兆元營收的公司，資本密集度在定義上就是低的。**
    ｜⚠⚠⚠ **結論：高 X ＋ 低 Y ＝ Q1（盈餘倍數）。**
    **本輪十九檔中只有第二檔落在 Q1（前一檔為 3533 嘉澤）——
    Q4 有十一檔、Q3 有三檔、Q1 只有兩檔。**
    ⚠⚠ **而 Q1 的處方（盈餘倍數）在本檔要往上挪一層用：
    因為 PE 的分母被營業以下的層級汙染了，EV/EBIT 才是對的尺。**
    **這正好是層級軸的定義，見 methods。**
