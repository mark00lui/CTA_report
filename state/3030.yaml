    ・資本密集度低：**PB 6.84 且 ROE 約 33.4%**（TTM EPS 13.18 ÷ 每股淨值 39.47）——
      帳面資產小而報酬極高，是資產輕的直接證據。
      ⚠ **但 capex／營收未取得，這條腿目前靠 PB 與 ROE 推論**，已列 gaps 第一項。
    ・盈餘代表性低：TTM EPS **+54.9%**、2026 Q2 EPS **年增 75%**、H1 年增 58% ——
      成長率遠離穩態；且 52 週區間 **139.50–457.50（3.3 倍）**、現價距高點約 **-41%**，
      是劇烈重評價的形態。檢測設備需求跟隨客戶的資本支出循環，故加 `cyclical` 標籤。
    ⚠ **Q4 的處方中「選擇權拆分」對本檔不適用** —— 本檔沒有尚未貢獻營收的業務線可拆。
    實際可用的是 EV/Sales（族群對照）與成長持續期。
  quadrant_since: 2026-09-08
  peer_group: 檢測與量測設備
  peers:
  - 致茂 2360 — PE **57.02**／forward PE **41.54**／P/S **23.39**／市值 944.61B／TTM 營收 40.38B(+61.6%)／52 週 550–2,795（stockanalysis，**as-of 2026-09-08 13:24 CST**）
