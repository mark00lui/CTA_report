  methods:
    primary: >
      **產能對應營收的反推**（分母軸 —— 用**產能**而非盈餘或營收，
      而「產能」正是 valuation-map 分母軸明列的一項）。
      **管理層已給數字：2027 年產能拉到目前的 2.5 倍（年增 +150%），2028 維持高速擴產，
      重點集中在磊晶端、後段委外代工。**
      問法：以 8 月營收 5.20 億元年化約 62.4 億元為現行滿載基準，
      **2027 產能全開對應年營收約 156 億元；以市值約 2,900 億元計，
      相當於 2027 滿載營收的約 18.6x P/S。**
