signal:
  rating: 中性
  conviction: 中
  basis: >
    ⚠ **2026-09-01 全量重估：加權目標價維持 642，相對現價 572.34 為 +12.2%**
    （前為相對 578.02 的 +11.1%）。評級維持**中性**、信心維持**中**。
    ⚠ **象限自 Q1 遷入 Q2**（TTM capex 89.325B，2026 guidance 上修至 130–145B，
    capex／營收約 53–59%；TTM 自由現金流 40.976B 且**連兩年下降**：54.1 → 46.1 → 41.0）。
    ⚠ **但遷入 Q2 之後查到的東西推翻了我原本的框架，這一點必須寫清楚**：
    本檔的 P/FCF **35.6x**、失真倍數 **2.02**、forward PE **17.68x**，
    **三項在平台三檔中都是最低的**。我原本把本檔寫成「獲利品質最差、費用失控」的一檔 ——
    **在現金軸與絕對估值軸上，那是錯的：它是三檔中最便宜、失真最小的一家。**
    ⚠ **SOTP 與合併 PE 互相驗證**：剝離 Reality Labs 後本業 EPS 約 40.5 × 17x = 689，
    減 RL 五年虧損現值每股約 28 → **661**；而合併法 34.7 × 19x = **659**。**兩者差 0.2%。**
    **不給偏多**的理由完全未變，而且是本檔最該堅持的一條：
    **技術面是清單中唯一的空頭排列**，右側確認三段一段都沒成立。
    **「已經跌很多」與「算出來便宜」都不是翻多的理由** —— 現在又多了一條
    「同業比較後更便宜」，它同樣不是理由。這正是 CTA 紀律存在的原因。
    **不給偏空**：兩條 falsifier 都未觸發且距離不近，營業利益 18.78B 仍厚實。
    ⚠ 以下為前次（2026-08-27）記錄：廣告引擎本身沒問題（+27%、曝光 +14%、價格 +12%、DAP 36 億）。2026-08-27 重錨後估值空間自 +3.6% 擴至 +10.8%（加權 642 相對 579）—— 現況 forward 16.6x 較 5 年 trailing 平均換算的 22x 折價 25%，判斷折價有真實理由（獲利品質惡化）但幅度過度。然而技術面是清單中唯一的空頭排列，右側確認三段一段都沒成立 —— 依 CTA 紀律「已經跌很多」與「算出來便宜」都不是翻多的理由。也不給偏空：兩條 falsifier 都未觸發且距離不近，營業利益 18.78B 仍厚實
  changes_if: ⚠ 2026-09-01 新增 —— 管理層目前**拒絕給出 2027 支出指引**，該指引出爐是本檔最重要的單一事件；若 2027 capex 指引使 capex／營收自 53–59% 再上行而廣告成長未同步，則 base 的 19x 需下修。｜三段右側確認全部成立（收復 592.52 → 站上 623.24 → 黃金交叉）→ 偏多；週收盤跌破 520.26、廣告營收成長跌破 15%、或 2027 capex／費用 guidance 上修逾 20% 而廣告成長低於 20% → 偏空；2027 指引出爐且費用成長率低於營收成長率 → 信心升至高
