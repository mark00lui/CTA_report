  次年度_FY2027: {eps: 51, 來源等級: 取得-市場價格反推, 依據: '1,795 ÷ forward PE 35.17 = 51.04', 現價隱含倍數: 35.2}
  混合年_各半:   {eps: 44.5, 來源等級: 合成, 現價隱含倍數: 40.3}
  殘餘度: 0.50   # = 6 ÷ 12（Q3、Q4 未公告）。⚠ 恰好貼在 0.5 門檻上，不宜單獨依賴 FY2026
  方向一致性: >
