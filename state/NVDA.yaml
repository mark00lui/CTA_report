  ｜估值口徑：用 non-GAAP。GAAP EPS 高於 non-GAAP 的原因已於 2026-08-27 確認 —— 調節表排除
  「gains/losses from equity securities, net」（NVIDIA 對 CoreWeave 等公司之股權投資的評價利益），金額大於股權薪酬故 GAAP 反而較高。
  與 MSFT 的 OpenAI 損益同構。用會反轉方向的項目當估值錨沒有意義（差額連兩季由 0.52 縮至 0.24 即為證據）。
  ｜結構性認識：FY27 四季中三季已定（Q1/Q2 實際、Q3 已指引），EPS 合理區間僅 8.9–9.5（±3%）。
  因此三情境的分歧幾乎全在 exit multiple，不在 EPS —— 這與 INTU、MSFT 那兩次重估的結構不同。

