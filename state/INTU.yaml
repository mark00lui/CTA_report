valuation_frame:   # 2026-09-07 首次宣告。⚠ 本輪發現錨 C 形式成立但實質等於市場定價
  quadrant: Q1
  quadrant_basis: >
    **高盈餘代表性 × 低資本密集** —— 全清單唯一的 Q1。
    capex／營收僅約 **1.0%**（FY2026 capex 221M），遠低於 15% 門檻；
    SaaS 訂閱模式使當期盈餘具代表性；FY27 指引明確（營收 +9~10%、non-GAAP EPS +23~24%）。
    ⚠ 但有一個 Q1 少見的干擾：**FY2026 起 non-GAAP EPS 納入 SBC**，
    新舊口徑不可比（FY27 舊口徑 28.81 對新口徑 23.00），使自身歷史倍數失效。
  quadrant_since: 2026-09-07
  peer_group: SaaS／稅務與中小企業軟體
  peers:
  - ⚠ **同業同樣被 agentic AI 顛覆疑慮重評價，無乾淨可比者** —— 這是錨 B 失效的原因，非疏漏
  rank_metrics:
  - Online Ecosystem 成長率（ex-Mailchimp）
  - Non-GAAP 營益率
  - 自由現金流轉換率（⚠ **須扣 SBC 後再看**）
  methods:
    primary: >
      ⚠⚠⚠ **2026-09-11 自「錨 C 反推市場隱含成長」升級為「錨 C 雙向：逆向反推市場 ＋ 正向產出獨立目標價」。**
      **這是實質改變，不是措辭改變**：舊做法只算出「市場隱含 +1.46% 永續成長」然後宣稱市場太悲觀，
      目標價仍由倍數決定（base 15x）；**新做法用同一個模型正向算出每股 464.59，
      而它不以現價為起點。** 參數：明確期 10 年、永續 3%（衰退情境改為等於期末成長）、
      **r ＝ 4.97%（10 年期美債 2026-09-10）＋ beta 0.98 × ERP 網格 4.0／4.5／5.0% ＝ 8.89／9.38／9.87%**、
      基期扣 SBC 且扣除一次性現金稅利益。**三情境的 exit_multiple 是由 DCF 結果反推的衍生值，
      推導方向是「DCF → 目標價 → 隱含倍數」，不是「倍數 → 目標價」。**
    secondary: >
      P/FCF **扣 SBC 後且扣除一次性稅利益**。
      ⚠⚠ **2026-09-11 兩處修正**：(a) SBC 實際為 **2,056 百萬**（FY2026 現金流量表），
      非原記的 1.59B —— 原值是把指引的「每股 5.81 美元」當稅前數乘股數，而 5.81 是**稅後**數，
      低估倍數正好是 (1 − 24%)；(b) FY2026 如實認列的 FCF 8,617 含約 **909 百萬現金稅利益**
      （指引式回推為 7,708），不可作為基期。**乾淨值：FY2026 扣 SBC 後 5,652、FY2027 指引推算 6,581。**
    check: >
      自身歷史 forward PE（⚠ **仍失效**：跨越 AI 疑慮前後，且 SBC 口徑改變）。
      ⚠⚠ **2026-09-11 新增實際可用的 check：beta 敏感度逐格試算。**
      **固定 base 成長路徑，只調 beta：0.98 → 加權 412.6；1.21 → 356（＝舊目標價）；
      1.44 → 312.8（＝現價）。** 亦即本模型與市場的分歧可完全表達為單一參數之爭，
      而這比「我們比市場樂觀」具體得多。
  axes_crossed:
  - 分母（軸①：盈餘 vs 自由現金流）
  - 時間（軸③：TTM 乾淨基期 vs FY2027 指引推算基期）—— 2026-09-11 新增，
    且兩者收斂（FY2026 乾淨值 5,652 → FY2027 指引 6,581，+16.4%）
  - ⚠⚠⚠ **軸④（參照）仍然只跨到一點，而這是 2026-09-11 重估後唯一沒有改善的缺陷。**
    **「逆向 DCF」與「正向 DCF」是同一個模型跑兩個方向，不是兩個獨立參照** ——
    前者問「現價隱含多少成長」，後者問「這個成長值多少錢」，共用同一組現金流、同一個折現率、
    同一個終值公式。**它們一起錯的機率接近 1。**
    **自身歷史失效（口徑改變＋AI 重評價）、同業無乾淨可比 —— 這兩個都是結構性的，無法靠查資料解決。**
    **→ 本檔實質上只有一個錨。這是 conviction 不能升的決定性理由，優先於「base 已不等於現價」這個改善。**
  excluded: >
    ⚠⚠⚠ **2026-09-11 結案：上面那條 2026-09-07 的自我指控（「形式上是錨 C，實質上是 base = 現價隱含值」）
    已處理，而處理的過程推翻了它對病因的判斷。**
    **它歸因於「折現率未錨定」與「錨 C 只做到描述市場假設」。錨上折現率之後發現：
    8%／9%／10% 的猜測幾乎正好等於 CAPM 的 8.89%／9.38%／9.87%（beta 0.98）——
    那個未錨定的參數對本檔答案是對的。**
    ⚠⚠ **真正的病因是基期。** 逆向 DCF 的隱含成長率在不同基期下的全距是 **5.6pp**，
    其中 **5.0pp 來自基期與 SBC 口徑、只有 1.9pp 來自折現率網格**。
    **而當時只用了一個基期（7.03B），沒有人問那個基期本身對不對 ——
    它同時含有約 909 百萬的一次性現金稅利益，又少扣了 467 百萬的 SBC。**
    **兩個錯誤同方向：都讓本檔看起來更便宜。**
    ⚠⚠⚠ **而「base 是不是從現價推來的」這件事現在有可檢驗的做法，不必再靠聲明：
    把舊三情境反解成 DCF 成長率 —— 舊 bear／base／bull ＝ −1.05%／+2.18%／+6.87%，
    加權 +2.39%，而市場隱含 −0.01%。整組情境只比市場樂觀 2.4pp，
    且舊 bull 的 +6.87% 還低於公司自己的營收指引 +9~10%。**
    **上一輪 state 辯稱 base 345 ≈ 現價 345.88 是「價格事後漲上來與模型會合」——
    這個檢驗能分辨真假：換一個乾淨基期後 base 移動了 35%（345 → 465）。
    若它原本是獨立算出來的，不該移動這麼多。**
    ⚠ **2026-09-11 新增一條禁用**：**不得以「風險更高」為由上調 beta。**
    AI 顛覆風險已表達在三情境的成長假設與 0.30 的 bear 機率上，
    在折現率再算一次就是重複計算（同「族群序位只調倍數、不調 EPS」）。
    **beta 固定取觀測值 0.98，敏感度逐格列出，並把 beta 的不穩定列為缺口。**
    ⚠ **亦不得用分析師目標價當錨。** 本輪加權 412.6 與分析師均值 405.60 僅差 1.7%，
    **那是事後對照，不是推導依據** —— 分析師均值是別人模型的調查結果，不是獨立的估值基礎。
    ⚠ **不用自身歷史倍數** —— 5 年 forward 平均 31.22x 跨越 AI 顛覆疑慮前後，
    且 FY2026 起 non-GAAP 納入 SBC 使口徑不可比（歷史換算為新口徑約 39x）。
    ⚠ **不用同業倍數** —— 同業同樣被 AI 疑慮重評價，無乾淨可比。
    ⚠ **不可只報未扣 SBC 的自由現金流** —— TTM 8.62B 含約 1.59B 加回，
    扣掉後 7.03B，殖利率自 9.11% 降至 7.4%。**只報高的那個是選擇性揭露。**
    ⚠ **2026-09-07 新增最重要的一條：錨 C 不可只做到「描述市場假設」就停。**
    本輪內部檢查發現：market 隱含永續成長（r=9%）為 **+1.46%**，
    而本檔 base 15x 的隱含永續成長為 **+1.4%** —— **兩者實質相同**。
    而同一段論證主張市場過度悲觀（「假設 FCF 永遠只能跟上通膨甚至更慢，
    而公司 FY27 guidance 是營收 +9~10%」）。
    **論證說市場太悲觀，base 卻採用了市場的悲觀。**
    **形式上是錨 C，實質上是「base = 現價隱含值」** —— 那正是 valuation.md 的核心規則所禁止的。
    ⚠ 且**折現率仍未錨定**：r=8%／9%／10% 沒有可觀測錨與日期，
    valuation.md 已於 2026-08-31 點名本檔為三個未錨定實例之一，至今未補。
  reviewed: 2026-09-11
thesis: 護城河同時被 agentic AI 與低價競爭測試；管理層以自願降價重建漏斗換取更大付費基數，估值已定價轉型失敗，驗證要等 2027 報稅季
thesis_since: 2026-08-26
valuation_base_year: FY2027
scenarios:
  bear:
    p: 0.30
    p_basis: 機率由使用者於 2026-08-26 全量重估指定。AI 替代風險在 2027 報稅季前無法否證，屬不對稱的無知不可低估；但管理層連五季超預期，且本次侵蝕經證實來自價格而非 AI，故壓在三成而非更高
    key_assumption: 降價未換回件數；agentic AI 對 DIY 與記帳的替代真實發生；FY28 營收成長跌破 8%
    eps: 23.00
    exit_multiple: 9.6
    multiple_basis: "錨在「SaaS 護城河被證偽」後的結構性衰退定價（9–11x forward），非本檔歷史 —— 歷史區間在此情境下依定義不適用，因為該情境的前提正是這家公司不再是歷史上那家公司 ⚠⚠⚠ **2026-09-11 改為 DCF 產出：基期 5,652（FY2026 扣 SBC 且扣一次性稅利益）、成長 0% 定速、永續 0%、r 9.38% → 每股 221，隱含 forward PE 9.6x。** ⚠ **永續成長在 bear 改為 0%（等於期末成長）而非 3% —— 用 3% 永續搭配「護城河破了」的明確期會讓 bear 自我矛盾（等於說先停滯十年再永遠以 3% 成長）。** ⚠⚠⚠ **而這一格是本檔三情境中證據最強的一格，因為它有兩條獨立路徑收斂**：舊 bear 走的是「市場給 9–11x 結構性衰退倍數」× EPS 22.88 ＝ 229；新 bear 走的是「自由現金流永久停滯」＝ 221。**兩者相差 3.5%，亦即那兩句話在數量上是同一句話。** base 與 bull 都沒有這種雙路徑。 ⚠ **分部量化的對照**：Consumer 年減 10%、GBS 減速至 5%、Mailchimp 年減 3% → 混合營收 −1.22%，計入降價的利潤率壓縮後 FCF 成長約 −4% 量級。**bear 取的是更寬鬆的 0% 而不是 −4%** —— 理由是毛利率 81%、FY2026 仍產生 56.5 億扣 SBC 後現金流，給一個仍在收現的特許事業衰退永續值過於極端。**這是刻意往 bear 不利的方向放寬，必須記下。**"
    tp: 221
    narrative: 「自願重置」事後被證實是被迫，市場給結構性衰退倍數
  base:
    p: 0.45
    p_basis: FY27 減速是管理層自選而非被動下修，達成機率高於一般情形；QuickBooks Free/Lite 首月逾 20,000 戶與 Mid-Market Q4 +39% 證明漏斗運作中
    key_assumption: FY27 指引達成；件數止穩但以 ARPU 讓利換取，成長維持 9–10%
    eps: 23.00
    exit_multiple: 20.2
    multiple_basis: "錨 C（reverse-DCF，2026-08-27 完成，本檔自「無獨立估值基礎」升級）。錨 A 仍失效：自身歷史 forward 5 年平均 31.22x 跨越 AI 顛覆疑慮前後，且 FY2026 起 non-GAAP 納入 SBC 使口徑不可比（歷史換算為新口徑約 39x）。錨 B 同業同樣被 AI 疑慮重評價，無乾淨可比。改用錨 C：TTM 自由現金流 8.62B，扣除 SBC 約 1.59B（FY27 舊口徑 EPS 28.81 對新口徑 23.00，差額 5.81×2.7354 億股）後為 7.03B；市值 94.61B（現價 345.88）。以永續成長模型反推，折現率 8%／9%／10% 對應市場隱含永續成長率 0.53%／1.46%／2.39% —— 亦即市場付的價格假設 INTU 的自由現金流永遠只能跟上通膨甚至更慢，而公司 FY27 guidance 是營收 +9~10%、non-GAAP EPS +23~24%。這個落差就是 AI 顛覆風險的定價，且它可否證。交叉檢查：本檔三情境 10x／15x／22x 對應的市值在 r=9% 下隱含永續成長 -2.0%／+1.4%／+3.9%，與 PE 框架內部一致，兩種方法未互相矛盾 ⚠⚠⚠ **2026-09-11 改為 DCF 產出，這是本輪最重要的改變：基期 6,581（FY2027 指引回推、扣 SBC、完 24% 稅）、成長 7% 十年衰減至 3%、永續 3%、r 9.38% → 每股 465，隱含 forward PE 20.2x。** **倍數是衍生值：推導方向是 DCF → 465 → ÷ 指引中點 EPS 23.00 ＝ 20.2x，不是先挑 20.2x。** ⚠⚠ **成長起點 7% 低於 FY2027 指引的 +9~10% 與 3 年共識 +9.25%** —— 折讓幅度即 thesis 所述的降價與 Consumer 減速風險。 ⚠⚠⚠ **循環性檢查：465 相對現價 312.77 為 +48.7%，遠離 ±5% 帶 —— 它不是「沒有獨立意見的產物」。** **而這正是相對上一輪的實質進展：上一輪 base 345 與當時現價 345.88 僅差 0.25%。** ⚠ **EPS 採指引中點 23.00 而非共識 24.18**：共識比指引高 5.1%，兩者都在新口徑上，**採低的那個是刻意保守**。 ⚠ **終值占 56.3%**，三情境間差異僅 2.8pp，不是區分情境的脆弱點。"
    tp: 465
    narrative: 15x ⇔ DCF 隱含永續成長約 +1.4%（r=9%）。⚠ 循環性檢查：base 345 與 8/27 現價 345.88 僅差 0.25%，但這是結論不是產物 —— 15x 訂於 8/26（當時現價 315.6，隱含 13.7x），是價格事後漲上來與模型會合
  bull:
    p: 0.25
    p_basis: 需要件數回正與倍數修復同時發生，而件數要到 2027-05 才看得到，時間上不允許更高權重
    key_assumption: 2027 報稅季付費件數回到 +5% 以上；Mid-Market 維持 30%+；市場承認 AI 恐慌過度
    eps: 23.00
    exit_multiple: 23.8
    multiple_basis: "錨在自身歷史但明確打折：5 年 forward 平均 31.22x 換算為新（含 SBC）口徑約 39x。取 22x 等於假設 AI 顛覆造成的折損有一半是永久的 —— 即使 bull 也不回到歷史區間 ⚠⚠⚠ **2026-09-11 改為 DCF 產出：基期 6,581、成長 11% 十年衰減至 3%、永續 3%、r 9.38% → 每股 548，隱含 forward PE 23.8x。** 成長起點 11% 對應「降價換到更大付費基數」兌現（Mid-Market +39%、QuickBooks Free/Lite 首月逾 20,000 戶）＋ 營益率延續擴張（四年 +8.1pp，20.70% → 28.80%）。 ⚠⚠ **原敘述「22x 仍遠低於歷史換算後的 38–50x，即使 bull 也假設永久折損未完全消失」這個框架仍然成立**：新的 23.8x 相對歷史換算值約 39x 低 39%。 ⚠⚠⚠ **而必須記下舊 bull 的問題**：舊 bull 528 反解成 DCF 成長率是 **+6.87%，低於公司自己的營收指引 +9~10%** —— **亦即舊模型的最樂觀情境，樂觀程度還不到管理層的基準情境。** 那不是保守，是整個尺規被現價綁住之後連上緣都被拉下來。"
    tp: 548
    narrative: 倍數向歷史區間下緣修復，但即使 bull 也假設永久折損未完全消失（22x 仍遠低於歷史換算後的 38–50x）
  weighted_tp: 412.6   # = 0.30x221 + 0.45x465 + 0.25x548 = 412.55；相對錨定價 312.77 為 +31.9%
