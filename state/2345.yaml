    ⚠⚠ **本檔可能是全覆蓋清單裡對本 driver 傳導最直接的一檔，這句話要能被檢驗，所以附數字：**
    白牌資料中心交換器**直接賣給超大型 CSP**（非透過品牌商），
    FY2025 營收 **2,483 億元（年增 +125%）**、2026 前 8 月累計 **2,460.04 億元（年增 +61.86%）**
    —— **那條成長曲線與四大 CSP 的資本支出曲線是同一條。**
    ⚠ **時滯短於本清單其餘硬體標的**：交換器與伺服器同批部署，
    **不像基板（AXTI，領先 2–4 季）或載板（3037／8046）那樣隔著數個環節。**
    ⚠ **也因此本檔是本 driver 的一個「落地」觀測點** —— 對照 `deployment_friction` 記的
    「承諾與落地之間的摩擦」：**交換器出貨是資料中心真的通電了的證據之一，不是承諾。**
  # ⚠ 敏感度記「高」，而且這一次是有數字支撐的高，不是預設的高。
- driver: ai-accelerator-demand
  direction: '+'
  note: >
    加速器出貨 → 機櫃內外互連埠數 → 交換器埠數與世代。
    ⚠⚠ **本檔與光通訊族群（COHR／LITE／AAOI／6442／3008）在物理上是綁定的，
    這是本清單此前沒有明說的一件事**：
    **一個 800G 埠同時需要交換器這一端的埠與光模組那一端的收發器。**
    **兩邊的出貨量在物理上必須對得起來 —— 若交換器出貨與收發器出貨長期背離，
    其中一邊的數字是錯的，或是庫存在某一層堆積。**
    **這使本檔成為光通訊那六檔的一個獨立交叉驗證節點，而且是同一個埠的另一端，
    不是上下游（那是 AXTI 的角色）。**
- driver: accelerator-roadmap
  direction: '+'
  note: >
    互連規格世代 → 交換器世代切換（800G → 1.6T）與 OCS 光交換。
    ⚠ **本檔對本 driver 的曝險是直接的而非間接的**：**它賣的就是那個世代本身。**
    800G 目前持續放量；**1.6T 與 OCS 光交換器經法人預期於 2026 下半年開始貢獻**
    （⚠ tier 為推論 —— 那是法人預期，不是公司揭露，見 gaps）。
    ⚠ **與 3533 的對照值得記**：那一檔跟的是 CPU 平台 roadmap，本 driver 對它不適用，
