- date: 2026-09-12
  level: L2
  summary: 台股基準年修正連續作業第十三檔 — ⚠⚠⚠ base 宣告的獨立錨「PB／每點 ROE」被證明恆等於 PE ÷ 100，且本檔的值就是自己的 trailing PE，即現價隱含倍數 × 0.658；而 §9b(a) 的診斷抓不到 trailing 型的循環。EPS 改用 FY2027 共識，加權目標價 4,090 → 4,291（+4.9%，因方法層變動仍定 L2）
  delta: >
    ⚠⚠⚠ **本輪最重要的發現與數字無關。base 的 `multiple_basis` 原寫
    「同業 PE 區間為建準 17.74 至健策 129.99（離散 7.33 倍，中位數無意義），**故改用** PB／每點 ROE：
    建準 0.177、本檔 0.451、健策 1.30 —— 本檔落在中間」。**
    **而 PB ÷ ROE(%) ＝ (P/B) ÷ (100E/B) ＝ **PE ÷ 100**，恆等不是近似。
    三個數字全部對得上：0.177 → 17.7（PE 17.74）、0.451 → 45.1（PE 45.56）、1.30 → 130（PE 129.99）。
    新區間的離散是 7.34 倍 —— 與原本的 7.33 倍一模一樣。
    它沒有解決離散，它就是那個離散換了個名字。**
    ｜⚠⚠ **而本檔的 0.451 ＝ 本檔自己的 trailing PE，所以「本檔落在中間」
    說的是「市場現在給本檔的倍數落在同業之間」—— 那是現價隱含倍數。
    30 ÷ 45.56 ＝ 0.658，是 §9b④ 那個禁用形狀的第三個變體
    （3081 與 6805 折的是 forward，本檔折的是 trailing）。**
    ⚠⚠⚠ **而 §9b(a) 的診斷（改 EPS 看目標價動不動）抓不到它：
    (a) 的原理只在倍數用 forward（同一個 EPS）時成立；
    本檔折的是 trailing，分母是 TTM EPS 而非情境 EPS，所以改 FY2027 的 EPS 目標價確實會動。
    (a) 完全通過，而錨仍然是市場給的 —— 這是檢查 (a) 的一個洞，本輪首見。**
    **base 自己那句循環性檢查也沒抓到，原因相同：它查的是 forward 隱含倍數（25.6），
    而錨是 trailing 隱含倍數（45.1）—— 兩個數字不同所以通過，但查錯了對象。**
    ｜**處置：30 倍維持不動，但它現在沒有錨，已列缺口。不硬湊新錨 ——
    同業只有兩個成員（3324 因循環引用明文禁用），不足三個，錨 B 不成立；
    且兩者的倍數都是 trailing，依 6531／3131 先例不可當 FY2027 基準。
    ⚠ 唯一還在的外部參照是街上：3,880 ÷ 148.15 ＝ 26.19x，本檔取 30x 高出 14.5% ——
    在沒有錨的狀態下那 14.5% 是曝險不是判斷。**
    ｜**遠期共識（FactSet 19 位，2026-08-13）：EPS FY2026 中位 102.37 → FY2027 **148.15**（+44.7%）
    → FY2028 186.01（+25.6%）；FY2027 高 170.42／低 132.00。
    ⚠ 本輪**首次同時取得營收預估表**：FY2026 2,193.97 億 → FY2027 **3,036.59 億** → FY2028 3,550.43 億。**
    ⚠⚠ **而有了營收才能算出共識隱含的淨利率，那正好就是本檔的爭點：
    18.32% → 19.15% → 20.57%，**單調擴張**。
    亦即 19 位分析師認為五倍的水冷板產能擴充帶來的是規模效益而不是稼動率風險 ——
    thesis 的爭點沒有被否證，但它現在有了一個量化的對手盤。**
    ｜**base EPS 135 → 148.15（共識中位）。⚠ 歸因很乾淨：原本的 FY2026 基期約 100
    對共識 102.37 只差 2.3%，所以 8.9% 的落差**全部**來自成長率判斷（+35% 對 +44.7%），
    沒有任何一部分來自算錯或口徑不同 —— 對照 3661 的三情境 EPS 全因股數錯誤低了 28.2%。**
    **bull EPS 170 → 170.42（共識上緣）。⚠⚠ 自建值與共識上緣差 **0.25%** ——
    13 檔以來吻合得最近的一次，兩條完全獨立的路徑落在 0.25% 之內。
    ✓ §9b(c) 通過（對中位 +15.0%）。**
    **bear 90 維持：具名機制涵蓋量與率兩段。
    ⚠ 但它隱含的淨利率 11.63–12.55% 比自己的機制多跌 1.2–2.1pp（毛利率只掉 4.6pp，
    且營收仍成長 +28.4% 使費用率應下降），那一段沒有被解釋。已列缺口。
    ⚠ 方向值得記：3661 是 EPS 比機制樂觀不起來（算錯），本檔是比機制更悲觀 ——
    同一項檢查，方向相反，所以要雙向做。**
    ｜✓ **§9b(b) 與 3661 那輪的恆等式檢查，本檔通過**：base 目標價對應市營比 5.75x，
    而 市營比 ＝ 本益比 × 淨利率 ＝ 30 × 19.15% ＝ 5.745 —— 一致。
    **市營比的「哪一年」問題：TTM 7.16x 對 FY2027 共識 4.36x，差 1.64 倍 ——
    遠小於 3661 的 4.21 倍，因為本檔已經在規模上而非剛放量。**
    ⚠ **§9b(d)：全距 3.60 倍；EPS 段 1.89 倍、倍數段 1.90 倍 ——
    13 檔以來第一次兩段幾乎完全相等。寬度一半來自「賺多少」、一半來自「值幾倍」，
    而後者那一半現在沒有錨。算術 4,291 對幾何 3,896，差 10.1%，兩者同號。**
    ｜⚠⚠⚠ **Beta(5Y) 首次取得 ＝ 0.71，而 52 週區間 937.00–3,595.00 ＝ **3.84 倍** ——
    本系列最極端的一組不相稱。股價一年內接近翻四倍而 beta 低於大盤，
    因為 5 年窗口有 3 年多屬 AI 行情前的另一個 regime。
    **這有具體後果：beta 是錨 C 的折現率輸入 —— 即使日後取得台幣 10 年期公債殖利率，
    本檔的錨 C 也不得用 5 年期 beta 建。**
    ｜**錨定價 3,380 → 3,370（-0.30%）。⚠⚠ §9b⑮ 的新變體：權威欄位比同檔案內的註解還舊 ——
    `cta.price` 帶 09-09 的 3,380，而同一區塊的均線註解與 base 註解帶 09-10 的 3,460。
    兩者各自正確，但站台產生器取的是欄位。→ 價格一致性檢查要涵蓋註解。**
    ✓ **交叉驗證通過**：3,460 → 3,370 為 -2.60%，與 stockanalysis 記的當日跌幅一致。
    ⚠ **順帶解掉 TTM EPS 的兩來源衝突：以單季數字重建得 ≈73.8，採 73.98（差 0.24%）；
    連帶 ROE 54.6% → 52.6%、capex／營收 7.56% → 8.11%（象限 Q4 不變，§9b⑭ 記下負面結果）。**
    ｜**`valuation_base_year` 首次建立為 2027。缺口關閉 3 個、新增 4 個。**
    ⚠ **機率 0.25／0.50／0.25 為使用者指定，本輪一個字未動。**
