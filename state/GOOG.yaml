    check: >
      ✅ **SOTP —— 2026-09-10 首次執行**（此前宣告了卻沒做，是 valuation-map 列的
      「遷入 Q2 且單一錨」那筆待辦）。以 2026Q2 分部數字年化為 run-rate：
      Services 營收 378.0（Search 253.2／YouTube 廣告 44.4／訂閱與裝置 51.6／Network 28.8）；
      **Cloud 營收 99.2、營業利益 35.2（營益率 35.5%）**；Other Bets 營收 1.53、營業虧損 −7.2。
      Services＋公司層營業利益 135.2 →（稅率**假設** 17%）稅後 112.2；Cloud 稅後 29.2；
      淨現金 121.68（總現金 242.47 − 總負債 120.79）。
      倍數：Services 18／20／22x（錨在 META forward 20.20x，最可比的成熟廣告平台）；
      Cloud 8／10／12x 營收（⚠ **無乾淨可比 —— Azure 與 AWS 都不單獨上市**，此為最大擺盪項）；
      Other Bets 低與中取 0（保守，虧損 −7.2／年），高情境給 100。
      **結果：Low $240／Mid $275／High $317 每股。**
      ⚠⚠ **本結果最重要的一句：連 High 情境的 $317 都低於現價 $328.38** ——
      亦即以當前 run-rate 與寬鬆的分部倍數，都撐不到市價。
      ⚠⚠ **但絕不可宣稱「SOTP 的 275 與 base 的 270 收斂、互相驗證」——兩者口徑不同**：
      SOTP 是**當前 run-rate 的快照**，base 是**2027 基準年的目標價**。
      數值接近是巧合，**這正是本倉庫記過的「兩個數字剛好對得上，不代表它們是同一個東西」**。
      SOTP 真正說的是：**現價已內含 run-rate 之上的成長**（Cloud +82% 使這合理），
      它量化了市場為成長付了多少，不產生 2027 目標價。
      ⚠ 限制：Alphabet-level 公司層成本未單獨揭露，故與 Services 合併處理；
      單季年化對高成長分部（Cloud）會低估；稅率 17% 為假設值。
  axes_crossed:
  - 分母（軸①：本益比看盈餘、P/FCF 看現金 —— 本檔落差達 3.11 倍；2026-09-10 再加 SOTP 的分部營業利益）
  - 參照（軸④：2026-09-01 補上同業；2026-09-10 SOTP 另引入**分部層級**的外部可比 META 20.20x）
