    (1) ⚠⚠ **主錨目前沒有錨** —— 清單外的兩家同業（健策 3653、建準 2421）倍數幾乎沒取得，
        **而清單內唯一的直接同業 3324 被明文禁用（循環引用）。**
    (2) ⚠⚠ **TTM EPS 本身有 4.3% 的來源歧異**（77.19 對 73.98），**而它是所有倍數的分母**；
        **且 forward PE 有更大的口徑問題**（26.26x 隱含 EPS 125.1，
        對台灣法人 2026 共識上緣 106.8 高出 17%）。
    (3) ⚠ **invalidation 無法填** —— 季線距現價 -20.25%，
        **依我在 AXTI 那檔提出的規則（超過 ±20% 不得作為失效價位）不可用。**
    (4) **thesis 押的毛利率問題要等產能實際開出後才有答案** ——
        水冷板月產能自 20 萬擴到 100 萬套是 2026 下半年的事。
    ⚠ **已經確定的事，先寫下來，免得被上面四條的謹慎蓋掉：**
    **(a) 量是真的** —— 2026 前 8 月累計營收年增 **76.10%**、Q1 年增 110.17%、Q2 年增 66%、
        **環比連續四個月為正**。
    **(b) 率也在改善，而且是組合帶動的** —— 毛利率自 Q2 2025 到 Q2 2026 **上升 8.16 個百分點**，
        Q1→Q2 再升 2.8pp。**水冷毛利率高於氣冷，所以這條線本身就是組合移動的證據。**
    **(c) 且資本支出強度不高** —— **capex／營收 約 7.56%**，遠低於 15% 門檻。
        ⚠ **但 Q1 capex 年增 +169%、2026–2027 合計已公告 320 億元 —— 方向明確向上。**
    **(d) ⚠ 而年增率正在單調減速（111.72% → 54.34%），主因是 2025 下半年的高基期。**
        **(a) 與 (d) 同時為真，這正是本檔最容易被讀錯的地方。**
  changes_if: >
    ⚠ 五欄語法（資料項 | 門檻 | 不等號方向 | 計畫值是否算數 | 資料來源）。
    **升為可評級（最高優先）**：`健策 3653 與建準 2421 的當期本益比 | 有無 |
      取得即執行 | 需為當期值，2026 年 2 月的 94.27 倍不算數 | 各家報價頁`
      ⚠ **3324 的倍數在任何情況下都不算數（循環引用）。**
    **解決分母歧異**：`TTM EPS | 單一可信值 | 取得即執行 |
      需與 forward 口徑同源（同一個基準年） | 財報原始數字自行加總四季`。
    **恢復技術面可判定性**：`月線（20 日） | 有無 | 取得即執行 |
      需與現價同源計算 | 日 K 序列` → ⚠ **在此之前 invalidation 無法填；
      季線距現價 -20.25%，依規則不可用。**
    **偏空**：`2026 年 9 月單月營收 | 185.90 億元（7 月水準） | < | 公告值算數 | 公開資訊觀測站`。
    **偏空**：`季毛利率 | 28% | < | 財報認列算數 | 季報`。
    **論點確立（thesis 成立方向）**：`2026 Q4 或 2027 Q1 季毛利率 | 32.57% | > |
      財報認列算數，管理層的「占比可望提高」不算數 | 季報`
      —— ⚠ **這一條是 thesis 本身：要在水冷板產能五倍開出之後，毛利率仍高於擴產前的水準。**
    **象限複核**：`capex／營收（近四季） | 15% | > |
