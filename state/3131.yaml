    **(b) 而且客戶結構是清單裡最特別的一個** —— **前三大客戶橫跨晶圓代工、封測代工、HBM，
        三類都在覆蓋清單內（TSM、6239、MU／SNDK）。**
        **三類客戶的擴產週期不同步 —— 對本檔是分散，任何一類擴產都能撐住訂單。**
    **(c) 但獲利的組成正在劇烈變動** —— **淨利率半年內掉 10.6 個百分點，
        而營收還在上升。這正是 thesis 押的東西。**
