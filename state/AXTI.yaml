notes: >
  ⚠⚠ **本檔被納入的主要理由不是它便宜（它是清單最貴的一檔），是它補上了一個層級。**
  清單原有的光通訊曝險（6442／3008／COHR／LITE）全部集中在**收發器與模組**這一層；
  **本檔是它們共同的上游基板供應商，而且是其中兩家（COHR、LITE）已簽長期供貨合約的對象。**
  **這是本清單第一次能做真正的上下游層級交叉驗證 —— 用上游的出貨去檢驗下游的敘事。**
  ｜⚠⚠ **而且傳導時序是相反的**：基板出貨在下游收發器**之前**數個季度，
  **所以本檔是那個共用光通訊前提的早期預警。**
  ⚠ **但同一件事的反面必須同時記住：最上游節點的長鞭效應最強。**
  **需求轉折時本檔會最早反映，而且幅度最大 —— 領先是雙向的，不是單向的好處。**
  ｜⚠⚠ **與 LITE／COHR 那組循環引用的差別，必須現在就寫死，否則下一輪一定會犯同樣的錯：**
  **本檔的副錨借的是 COHR／LITE 的「出貨量與時程」（下游事實），
  不是它們的「倍數」（估值判斷）。那組循環引用之所以成立，正是因為那裡借的是倍數。**
  **借事實可以，借倍數不可以。**
  ｜⚠ **本檔刻意不標 `cpo`。** InP 基板同時供給可插拔光模組與 CPO 兩條路徑，
  **本檔不依賴 CPO 這個特定前提成立。**
  **這是清單裡第一次新增一檔光通訊標的卻沒有加深 cpo 前提的依賴 —— 那是它的優點，不是疏漏。**
  ｜⚠⚠ **也刻意不標 `substrate`。** 那個標籤在本清單指的是 3037／8046 的 **ABF 載板**（封裝載板），
  **本檔是化合物半導體晶圓基板（InP／GaAs／Ge 單晶）。客戶、循環、物理全都不同。**
  **同名不同物混進同一格，會讓因子分析安靜地說謊 —— 而它不會報錯。** 故另立 `compound_semi`。
  ｜⚠ **基準年定 FY2027，但它有一個與 LITE 相反的性質，值得記下來作為校準：**
  FY2026 殘餘度為 **0.50**（7–12 月未公告），**恰在門檻上；但 Q3 已給指引，
  有效殘餘度僅 0.25，遠低於 0.5 → 本年結論必須降權。**
  ⚠⚠ **而公開 forward PE 43.45 隱含 EPS 1.586，與 FY2026 共識 0.87 和 FY2027 共識 2.23 都不吻合**
  （68.91 ÷ 0.87 = **79.2x**；68.91 ÷ 2.23 = **30.9x**）。
  **對照 LITE：988.98 ÷ 45.70 = 21.64，與 FY2027 共識分毫不差 —— 那檔的基準年被算術鎖定。**
  **本檔沒有：我無法從價格反推市場站在哪一年。**
  ⚠ **這使基準年假象的風險比 LITE 高而非低 —— 因為連「市場在看哪一年」都是我猜的。**
  ｜⚠ **本檔帶進一個清單其餘二十檔都沒有的因子：`china_ops`。**
  全部產能在北京同美；Q3 指引明文受出口許可閘門限制；科創板 IPO 已撤回轉赴香港，
  觸發人民幣 3.244 億元贖回權。**TSM 在台灣，本檔在中國 —— 那不是同一種地緣曝險。**
  **這是需求端全對也仍可能單獨失效的一條路徑，故單獨設為第四條 falsifier。**

