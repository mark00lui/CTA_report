    它測的是執行力與資金到位，不是市場要不要。**
    **需求全對時，機台交期、廠務、資金仍可能讓時程延後，這條仍可能單獨發生。**
    ⚠ **可驗證方式**：**合併現金流量表的「取得不動產、廠房及設備」累計數。**
    ⚠ **本輪連續第四檔的第四條 falsifier 沒有標成「未驗證」**
    （前三檔為 6187 用管理層能見度、3583 用對台積電銷貨金額、6531 用產品量產時程）——
    **四檔的共同做法是：找一個公司自己說過、且有期限或有金額的陳述當錨。**

