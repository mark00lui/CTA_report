notes: ⚠ 2026-08-27 重估補記：三個月內 FactSet 的 2026 EPS 中位數只動 +2.2%（185.91→190.00），
  目標價卻 +72%（3,030→5,220），隱含倍數自 16.3x 擴張至 27.5x —— 目標價的上升幾乎完全來自
  倍數而非獲利上修。與 3324 同構但幅度差一個量級。而現價 6,915 已超過該目標價 32.5%，
  且該目標價日期為 2026-07-27、早於本週兩根漲停。
  ｜產能承諾（原為 key_variable，因上限 6 個而移出）：2026 年四度購置不動產、累計約 56.49 億元，
  最新一筆為 2026-08-25 的 30.8 億元台中南屯土地廠房。說要做與投錢下去是兩回事，這是可觀測的代理指標。
  ｜Q2 環比是下滑的（Q1 46.63 → Q2 35.72），H1 的 +50% 年增主要由 Q1 貢獻 —— 建檔時沒看出來，
  因為 cnyes 頁面把 Q1 標成「當季」。
  ｜⚠ 本檔看似能填補覆蓋清單 non_ai 為 0.0% 的結構性偏誤 —— 它的營收基礎確實是消費性光學（手機鏡頭），
  與 AI capex 無關。但它填不了，因為**驅動股價的不是營收基礎而是 CPO**：三日 +28.41%、兩根漲停、
  創歷史新高，催化劑全部來自 CPO 首張訂單與為此購置的不動產。
  ｜因此本檔加深的不是 ai_capex_hw，而是 cpo —— 與 6442 光聖形成同題材的第二檔。
  兩者切入點不同（本檔自 FA／PMLA／FAU 光學元件端，6442 為光通訊產品），但共用同一個
  「CPO 是否如期放量」的前提。判讀清單分散度時必須把這一層算進去。
  ｜建檔時點的特殊性要記住：連續兩根漲停期間沒有換手，支撐與壓力都還沒形成，
  技術面的任何判讀在此時都不可靠。加上均線本來就沒取得，本檔的 CTA 是全清單中最弱的一份。

