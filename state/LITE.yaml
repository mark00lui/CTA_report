notes: >
  ⚠⚠ **納入本檔造成一個結構問題，它比本檔自身的估值更該先被記住：本檔原本是 COHR 的錨。**
  `state/COHR.yaml` 的三個情境倍數**全部**掛在 FN 與本檔的 forward PE 上
  （bear 略低於 FN、base 取兩家中點、bull ≈ 本檔）。
  **本檔成為覆蓋標的後，我對它的判斷會直接移動 COHR 的目標價 —— 那是循環引用。**
  **處置**：兩檔的錨仍各自獨立（COHR 用同業序位、本檔用 EV/Sales 與成長持續期），
  **但每次重估其一時必須檢查另一檔是否連動，並在報告中明寫。**
  ⚠ **而 COHR 檔於 2026-09-10 已明文記著「base 的中點含一半 LITE，這是 base 目前最弱的一環」
  並事先寫定了兩個改錨條件。那些條件現在多了一層意義：它們同時是解除循環引用的路徑。**
  ｜⚠⚠ **建檔當日修正了本倉庫既有的一個錯誤判讀，記在這裡以便日後校準**：
  COHR 檔兩度把本檔描述為「虧損公司」「forward PE 建立在虧轉盈的預估上」
  「虧損公司的高轉換率是算術不是品質」——
  **但本檔 FY2026 的 GAAP 淨損是一次性非現金的債務清償費用，營業利益為 +5.362 億。**
  **把 GAAP 淨損直接讀成營運惡化，是本輪第一次犯，而它影響的是另一檔的 base 錨。**
  **教訓：用一個標的的 GAAP 底線去描述它的營運狀態之前，先看營業利益那一行。**
  ｜⚠ **但有一件事沒有被推翻**：EV/EBITDA **109.46** 是用真實 EBITDA（800.7M）算的，
  **不受該筆費用影響**。**「淨損是假的」與「倍數是貴的」兩件事同時為真。**
  ｜本檔與 COHR 的差別值得先記下來，日後定序位會用到：
  **毛利率 50.4% 對 37.50%（本檔高）；自由現金流 +3.001 億對 -10.2 億（本檔正、COHR 負）；
  EV/Sales 29.08 對 8.57（本檔貴 3.4 倍）。**
  **本檔在營運指標上較佳，在估值上較貴 —— 序位分析要回答的正是這兩者的交換比率。**

