    隱含假設「取得了就能定價」。本次全部取得（2026-09-10 13:30，與錨定價同日），
    代進分部別倍數後：伺服器分部（TTM 營收 160 億元 × 55.7%）的每股區間是 290 到 4,263 元
    （市營比 2.23 對 32.80，全距 14.7 倍）；轉軸分部的每股區間是 71 到 392 元
    （市營比 0.69 對 3.79，全距 5.5 倍）；合併 361 元到 4,655 元 ＝ 12.9 倍。**
    **現價 2,190 落在其中，但那句話沒有任何資訊量。**
    ⚠⚠⚠ **寫成一條規則：「缺口關閉」與「方法可用」是兩件事。**
    **建檔時宣告主錨的同時，必須一併記下「若輸入取得但同業離散過大，退路是什麼」——
    沒有退路的主錨是一個還沒被檢驗的希望。**
    ⚠ **並公平記下一句讓我不舒服的事**：**建檔時我寫「純轉軸廠的倍數就是那 44.3% 值多少的
    直接參照，消費那一半的錨是現成的，缺的只是去查」—— 那句話的語氣確定性遠超過當時的證據。
    我知道兩家是純轉軸廠，但不知道它們的盈餘狀況，而那正是決定「錨是否現成」的變數。**
    ｜⚠⚠ **方法組合更換（本身即 L2）**：
    **primary 自「分部別倍數（SOTP）」改為「同業序位（PB÷每點ROE 絕對值逐家比，含目標標的本身）」；
    secondary 自「同業序位」改為「次年盈餘倍數（FY2027E EPS × exit multiple）」；
    check 維持「成長持續期 reverse」。跨三軸（參照／分母／時間）不變，層級軸仍未跨。**
    **象限重新審視後維持 Q4 —— 未漂移**（X 低：營收組合一年內自 19.2% 到 55.7%；
