        **可用的觀測頻率只有季度 —— 這是本輪唯一一檔連累計都不能用的。**
    ⚠ **已經確定的事，先寫下來，免得被上面四條的謹慎蓋掉：**
    **(a) 規模與獲利都在成長** —— 2026 前 8 月累計營收 **47.97 億元（年增 22.90%）**、
