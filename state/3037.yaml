notes: >
  ⚠ **本檔是循環股，這個判斷決定了後續所有估值工作的框架。** ABF 載板是典型的產能循環：
  缺口造就漲價 → 漲價引來擴產 → 擴產填補缺口 → 價格反轉。52 週區間 129.50–1,230，
  上緣是下緣的 9.5 倍，這個振幅本身就是循環股的特徵而非成長股的。
  依 references/valuation.md，/revalue 時**不可用峰值 EPS × 峰值倍數**，
  且若採市場慣用的「峰值 EPS × 低倍數」，必須並列「中週期正常化 EPS × 正常倍數」的版本。
  ｜thesis 刻意不寫產地標示案，而寫漲價窗口與自身擴產的賽跑。理由：公司重訊與美系外資
  都稱本案限於含 HDI 的 PCB 段（占營收約 36%），未涉 ABF（占 52%）；把一個三天前發生、
  範圍尚未確定的事件當成論點核心，會過度加權。但它是第一條 falsifier，也是本檔目前
  最可能改變一切的單一變數 —— 架構上放在 key_variable 而非 thesis，是刻意的選擇。
  ｜⚠ 外資與市場的判讀相反：8/28 大跌當日外資逆勢買超 367.3 萬股，而 8/31 鎖跌停有
  9,000 萬至 1.19 億股的賣單排隊。這個分歧本身是資訊，值得追蹤後續的三大法人動向。
  ｜⚠ 與 COHR 的結構同構，值得並列追蹤：兩檔都是供給受限的 AI 零組件廠、都在缺貨期
  大舉擴產（COHR capex／營收 15.4%、本檔 32.4%）、都面對「擴產能否在窗口關閉前
  轉為獲利」這個問題。差別在時序 —— COHR 的自由現金流已經是 -10.2 億美元，
  本檔 Q2 還是 +14.20 億元新台幣，但 capex 上修尚未反映。
  **COHR 在這條路上領先本檔，可以用它預判本檔。** 這是覆蓋清單第一次出現兩檔
  可以互為領先指標的標的。
  ｜⚠ 本檔把「產地標示與美國關稅規避的司法風險」從 notes 的一則觀察變成覆蓋清單內的
  key_variable。notes/2026-08.md 該則原本寫著「決定它有沒有意義的缺口：3324／6442／3008
  是否有中國產能」—— 現在不必等那個答案了，因為涉案的公司本身進了清單。
  ｜載板與 TSM 在 accelerator-roadmap 上是互補而非替代：TSM 做晶片與 CoWoS，
  本檔做承載它的載板，單機櫃功耗與晶片面積上行同時推升兩者的規格要求。
