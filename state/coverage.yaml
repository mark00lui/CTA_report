      **這是四檔中唯一有完整同業序位支撐的負空間。**

  ⚠⚠_零檔偏多: >
    **19 檔的評級分布：中性 16、偏空 3（2308／CEG／3008）、偏多 0。**
    ⚠ **連續兩輪全清單重估都沒有出現任何一檔偏多。**
