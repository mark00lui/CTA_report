  而營業現金流與自由現金流**完全未取得** —— 這是建檔時最大的空白，也是 thesis 爭點所在。
  ｜⚠ **2026-09-01 新增：FOPLP 這條腿第一次有了競爭座標，而座標指向兩個相反方向。**
  ┌ (＋) **時程領先約一年** —— 力成 2025-05 已「面板級扇出型封裝開始小量出貨」，
  │      同期日月光才要 2025 下半設備進駐、年底試產、2026 送樣客戶認證（工商時報 2025-05-31）。
  │      這是「全球第一家專業封測廠」說法第一次拿到**非公司來源**的支撐。
  ├ (−) **面板規格落後** —— 力成 510×515mm 對日月光 600×600mm，只有 **73%** 面積，
