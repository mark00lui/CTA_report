    **分母端加回淨現金做不到 —— 淨現金金額未取得**。
    **只做半邊會系統性低估價值**，故殘差明寫為「**CPO 選擇權 ＋ 淨現金**」的合計，兩者拆不開。
    **這是本檔最重要的一個未完成項，已列為信心升等的前提。**
    ⚠ **共識分布首次取得（19 位分析師，stockanalysis，as-of 2026-09-08）**：
    2026 EPS 低 168.16／均 185.03／高 199.16 → **錨寬度 = 18.4%**（本檔第一次算得出來）；
    目標價 低 2,330／均 **5,146**／高 **9,000**。
