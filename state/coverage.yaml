      **對 AXTI 是需求（有人搶著要它的基板）、對 3081 是供給限制（買不到大基板），
      並因此成為 3081 第四條 falsifier 的成因之一。**
      **這正是 CLAUDE.md 說的「同一則消息對不同標的方向可能相反」——
      而本清單第一次在自己的兩檔之間看到它，不是在硬體端與平台端之間。**
      ｜⚠ **共用錨風險**：**IQE plc 同時是 AXTI 與 3081 的同業。**
      **它不在覆蓋清單內所以不構成循環引用，但我對 IQE 的判讀若有偏差，兩檔會同向偏 ——
      與 COHR／AAOI 共用 Fabrinet 同科。本清單現在有兩組共用錨。**
      ｜⚠⚠ **光互連鏈至此首度完整，四層都在清單內**：
      **InP 基板（AXTI）→ 磊晶片與 CW 雷射（3081）→ 收發器模組（COHR／LITE／AAOI／6442／3008）
      → 交換器（2345）。**
      **本清單現在有四種交叉驗證，性質各不相同，判讀時混用會得到錯的結論：**
      **(1) 上下游時序（AXTI → 3081 → 收發器）：借的是先後，上游先動；**
      **(2) 同一個埠的兩端（2345 ↔ 收發器）：借的是數量守恆，兩邊應同步；**
      **(3) 同層直接同業（COHR／LITE／AAOI）：借的是序位，彼此是替代；**
      **(4) 買賣雙方的一手互證（3081 的法說 → AXTI 的 thesis）：借的是對方嘴裡的事實。**
      **第 (4) 種是本日新出現的，而它的證據力高於前三種 —— 因為說話的人沒有動機幫對方背書。**
      ｜⚠⚠ **另記一個可能被整條鏈共有、卻只有 3081 揭露的結構事實**：
      **3081 的終端客戶以美國 CSP 為主，但地區營收中國佔 70–80%，
      因為全球約 75% 的資料中心模組產能在中國。**
      **亦即需求源頭與出貨目的地分屬兩地。**
      **這個性質很可能被 COHR／LITE／AAOI／6442／AXTI 共有，而它們沒有一檔記錄了它 ——
      下次重估任一檔時應主動查證地區別營收，這是一條沒被記在任何 driver 裡的關稅與出口管制曝險。**
  - pair: "⚠⚠ 3017 / 3324 — 直接同業、零和替代，且為本清單第二組循環引用"
