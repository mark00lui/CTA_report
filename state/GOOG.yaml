    multiple_basis: "⚠ **2026-09-01 自 22x 下修至 20x，而下修的唯一理由是本次首度取得的同業現金流序位。** 錨 A 的推導不變：5 年平均 trailing 25.08x ÷ 1.15 ≈ 21.8x。⚠ **但那個歷史期間本檔的自由現金流轉換率遠高於現在的 26.2%** —— **歷史倍數內含一個已經不存在的現金產出結構**，與 6239 於同日發現的「自身歷史橫跨了一次 regime 變化」是同一類問題。錨 B（本次新增）：平台三檔中本檔的 P/FCF 失真最嚴重（**3.11 倍**，MSFT 2.19、META 2.02）、轉換率最低（**26.2%**，MSFT 36.6、META 31.4），2026 Q2 單季自由現金流 **-5.9B 為 2004 年上市以來首次轉負**，而 capex guidance 又自 180–190B 上修至 **195–205B 並明示 2027 再增**。⚠ **而現價 forward 24.95x 與 MSFT 的 25.68x 幾乎平價 —— 市場並未反映這個差距。** 本檔雲成長雖是族群最強（Cloud +82%、backlog 514B），那已在錨 A 的歷史倍數裡。取 20x，較錨 A 的 21.8x 再折 8%。⚠ **未調和的衝突，必須記下**：查得 Zacks 對 FY2027 的 EPS 估計為 **11.51**，較本檔採用的 13.50 低 **17%**（若屬實則 base 為 230）。但該值為單一機構、日期 2026-07 下旬，且與本檔已記錄的「正常化 2026 年化約 11.3」對照後看起來像 2026 而非 2027 的口徑。**單一未經核實且與自身推導衝突的數字不作為修改依據，列入 gaps。** ⚠ 前次推導保留：⚠ 口徑對齊：本檔 EPS 13.5 為排除股權證券損益的正常化值，而歷史 trailing 期間股權損益幅度遠小於現在，故歷史 trailing 與本檔正常化口徑大致可比；市場公布的 forward 16.42x 用的是含股權損益的分母，不可與此並用。現況正常化 25.2x 較歷史換算值溢價 15%，判斷為【不合理】：$205B capex 的折舊尚未開始入帳，溢價缺乏支撐。⚠ 非現價隱含值（25.2x）。
