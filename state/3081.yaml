  base:
    p: 0.5
    p_basis: "⚠ 沿用清單慣例，未經個別指定（同 bear）。"
    key_assumption: "產能達成 2.5 倍 → FY2027 營收 156 億元（8 月營收年化 62.4 億元 × 2.5）；毛利率自 57.45% 回落到 52%（擴產初期 ＋ 折舊上升），稅後淨利率 32%。淨利 49.92 億元 ÷ 1.01769 億股 ＝ EPS 49.05。"
    eps: 39.24
    exit_multiple: 40
    multiple_basis: "⚠⚠ **先確認不是抄現價**：現價隱含的 FY2027 倍數 ＝ 2,830 ÷ 49 ＝ 57.8 倍，本項取 40 倍，是自隱含值**下調 30.8%**。 ⚠⚠⚠ **2026-09-12 修正本句的 EPS 口徑**：分母用的 49 是 `key_assumption` 的未修正推導值（49.05），**而本情境實際採用的 `eps` 是 39.24（時點修正後）。** **循環性檢查必須用它所檢查的那個情境自己的 EPS。****以 39.24 與官方收盤 2,810 計：現價隱含 FY2027 倍數 ＝ 71.61 倍，本項的 40 倍是自隱含值下調 44.1%。** ⚠ **方向不變而幅度被低估了 13.3 個百分點**（30.8% → 44.1%）——**用錯的 EPS 讓「不是抄現價」這個結論看起來比實際更勉強，所以這次錯誤的方向是保守的；但它仍是錯的，而下一次同樣的錯可能往另一邊倒。** ⚠⚠ **並記一個更一般的形狀**：同一檔 state 裡 `key_assumption` 的推導值（49.05）與 `eps` 欄位的採用值（39.24）相差 25%，而 `multiple_basis` 引用了前者。**一個情境內部有兩個 EPS 時，任何引用都必須指明是哪一個。****往下挪的三個具名理由**：**(1) 2.5 倍的組成內部不一致 —— 前端 MOCVD 僅 +25–30% 而整體目標 +150%，產能目標本身帶執行風險；(2) 本檔自己就是新供給的主要來源（thesis 的核心）—— 2027 年市場上多波長 CW 雷射的供給增量主要由它貢獻，若需求跟不上，壓價的人就是它自己；(3) 折舊／營收 7.8% 正貼在管理層自訂上限 8–12% 的下緣，而新產能自 2027 Q2 起投入服務。** ⚠ **兩條路徑的一致性檢查**：49 × 40 ＝ 1,960 → 市值 1,994.7 億元 → 對 FY2027 營收 156 億元 ＝ 市營比 12.8×。⚠⚠ **它低於 2455 今天的 24.12，但那個比較是口徑不對稱的（見 methods.primary）—— 不可用它來論證 base 保守。** ⚠⚠⚠ **穩健性**：本項改為 50 倍使加權升至 2,464（-12.9%）；**改為現價隱含的 57.8 倍則加權升至 2,780（-1.8%）—— 亦即結論為負唯一會被推翻的方式，是把 base 的倍數設成現價隱含值，而那正是 references/valuation.md 整份文件在防的那件事。** ⚠⚠⚠ **2026-09-11（同日第二次）最重要的發現，而它與共識無關：本欄開頭的自我檢查問對了問題，但答案讓它通過了一個應該被擋下的東西。** 原文寫「先確認不是抄現價：現價隱含的 FY2027 倍數 ＝ 2,830 ÷ 49 ＝ 57.8 倍，本項取 40 倍，是自隱含值下調 30.8%」。**而 `49 × 40 ＝ 1,960` 與 `2,830 × 0.692 ＝ 1,960` 是恆等式 —— 當倍數被定義為「現價隱含倍數的固定折扣」時，目標價就恆等於「現價的固定折扣」，EPS 在等式兩邊完全消去。** **→ 那個 base 不是 49 × 40，它是 2,830 × 0.692。它從來沒有用到 EPS。** ⚠⚠ **這是 valuation.md 禁止的「base ＝ 現價隱含倍數」的一個更難察覺的變形：base ＝ 現價隱含倍數 × 固定折扣 → 目標價與價格 1:1 連動。而現有的循環性檢查抓不到它（1,960 距現價 30.8%，看起來像有內容的判斷）。** **診斷方法：把 EPS 改掉，看目標價動不動 —— 若倍數以「相同折扣」重算（72.1 × 0.692 ＝ 49.9x），目標價回到 1,960，一動不動。** **本輪處置：倍數維持 40x，讓目標價隨 EPS 一起動（1,960 → 1,570）—— 因為「維持折扣」等於承認倍數是價格的函數。⚠ 代價：40x 因此失去原本的（雖然是錯的）依據，現在沒有任何錨，已列缺口。** ⚠⚠⚠ **第二個發現：EPS 自 49 修正為 39.24，因為 2.5 倍是年底產能不是全年平均。** **state 自己的 key_variable 就寫了理由：前端 MOCVD 新增產能「2027 Q2／下半年起貢獻」；券商註記亦寫「預期到 2027 年底，MOCVD 產能將較 2026 年增長超過 100%」。營收由年平均產能決定 —— 改用 2.0 倍：62.4 × 2.0 ＝ 124.8 億 × 32% ÷ 1.01769 ＝ **39.24**。** **⚠ 而這獨立重現了券商共識：三家（外資 28.8／富邦 40.92／法人 40.04）的中位是 40.04，本輪的 39.24 差 −2.0%。時點修正是從 state 自己的 key_variable 推出來的，沒有用到券商的數字。** **⚠⚠ 而原本的 49 幾乎等於券商的 FY2028（外資 50.6）—— 模型比街上快了一年，與 3008（基準年停在 FY2026、慢一年）正好相反。** ⚠ **以修正後 EPS 計，現價隱含倍數是 72.1 倍（不是原記的 57.8），40x 的折價變成 44.5% —— 而那 44.5% 不是判斷，是修正 EPS 的副產品。**"
