notes: 本檔與其他覆蓋標的的關係不對稱 —— NVDA 的資料中心營收「同時是」drivers/ai-accelerator-demand
  的主要成分，也就是說它既是被研究的個股，也是驅動 TSM／3324／6442 模型的上游資料源。因此本檔的
  key_variables 刻意避開資料中心營收（那住在 driver），只放 NVDA 自己的毛利率、費用、中國曝險與估值。
  ｜該 driver 的 why_shared 目前寫「NVDA 與 AMD 不在覆蓋清單內，正因如此它們的數字只能住在這一層」——
  這句話的前提在 2026-08-27 起不成立，但結論仍成立（理由是它驅動三檔硬體端，與是否被覆蓋無關）。
  下次 /driver 時應修正該句措辭，不要因為前提失效就把數值搬進 state。
  ｜估值口徑：用 non-GAAP。GAAP EPS 高於 non-GAAP 的原因已於 2026-08-27 確認 —— 調節表排除
  「gains/losses from equity securities, net」（NVIDIA 對 CoreWeave 等公司之股權投資的評價利益），金額大於股權薪酬故 GAAP 反而較高。
  與 MSFT 的 OpenAI 損益同構。用會反轉方向的項目當估值錨沒有意義（差額連兩季由 0.52 縮至 0.24 即為證據）。
  ｜結構性認識：FY27 四季中三季已定（Q1/Q2 實際、Q3 已指引），EPS 合理區間僅 8.9–9.5（±3%）。
  因此三情境的分歧幾乎全在 exit multiple，不在 EPS —— 這與 INTU、MSFT 那兩次重估的結構不同。

event_log:
- date: 2026-08-31
  level: L2
  summary: 全清單重估 — 更正 8/27 的實質錯誤，base 倍數 28x → 30x，加權目標價 242 → 255（+5.4%）
  delta: >
