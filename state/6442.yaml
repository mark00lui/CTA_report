# ⚠⚠⚠ 2026-09-12 複核：維持 2026，而本檔是二十三檔裡**唯一一個兩個不可滾動的理由同時成立**的：
#   (i) FY2027 無覆蓋 —— 鉅亨兩次不同關鍵字搜尋皆無 EPS 型亦無目標價型速報；
#       **stockanalysis 的 analyst price target 與 analyst count 都是 n/a**；
#       state 原記的「2027 僅 2 家機構」本身已低於 §9b② 的 5 位門檻。
#   (ii) **代數恆等** —— 三個倍數都是「自身 trailing 歷史分位 ÷ 成長率」換算的 forward 等值，
#        故 目標價 = trailing 錨 x TTM EPS，**滾動基準年不會改變任何數字**。
#        （與 3324 完全同型，是第二次出現 —— 故為建模習慣而非個案。見 base.multiple_basis。）
#   前面三檔各只有一個理由：2337（FY2027 是循環的頂）、3030（無覆蓋）、3324（代數恆等）。
# ✓✓ 但 2026 這個基準年在本檔是**合格**的，而那一點與 3030 正好相反：
#   **以盈餘計殘餘度 0.59**（H1 EPS 19.07 ÷ FY2026E 46.5 = 41.0% 已實現），通過 0.5 門檻；
#   而以曆日計約 0.33（不通過）。兩者結論相反，差別來自 H2 遠強於 H1
#   （FY2026E 46.5 需要 H2 做到 27.4，是 H1 的 1.44 倍）。
#   → **門檻應該用盈餘基礎**，因為它要測的是「基準年的 EPS 還有多少是未知的」，
#     而不是「日曆過了多久」。本檔有 59% 的年度盈餘尚未認列，那個基準年就還有內容。
#     對照 3030：那一檔兩種基礎都是 0.33，所以看不出差別；本檔才看得出來。
#   報告：reports/2026/09/2026-09-12-6442-revaluation.md
# 原註記：# 曆年。首次設定；2027 僅 2 家機構、能見度不足，滾動時點為 Q3 財報（約 2026-11）
base_year_outputs:   # ⚠ 2026-09-10 新增 —— 位移測試首次做出來，結論與 3324 同型
  殘餘度: 0.33
  殘餘度_說明: >
    ＝ 剩餘未公告月份 4（9–12 月）÷ 12。**8 月營收已於 2026-09-09 公告，故自前次 0.42 降至 0.33。**
    ⚠ **明確低於 0.5 門檻** —— 當年度結論須降權且**不得單獨作為方向判定依據**；
    而本檔結構性地只有 2026 一個基準年（無分析師覆蓋，2027 共識取不到）。
  循環性檢查: >
    ⚠ **全面觸發**：base 1,674 對現價 1,700 為 **-1.5%**；加權 1,734 為 **+2.0%**。
    **現價隱含倍數 36.56x，而 base 為 36x。**
    ⚠ **這正是 2026-09-08 已記錄的那個轉折的延續**：8/31 把 base 自 35x（當時的現價隱含值）
    改為 36x（自身歷史換算，推導獨立），**但價格漲上來後 36x 又成了現價隱含值**。
    **錨的獨立性在推導當下成立，之後被價格追上 —— 與「抄現價」不同，但結果一樣。**
  位移測試: >
    ✅ **首次做出來（2027 共識不可得，以自建成長率區間執行，明示為自行推導）**：
    ・2027 EPS ＝ 46.5 ×(1+20%) ＝ 55.8 → ×36x ＝ **2,009**，相對現價 **+18.2%**
    ・2027 EPS ＝ 46.5 ×(1+30%) ＝ 60.5 → ×36x ＝ **2,176**，相對現價 **+28.0%**
    ・2027 EPS ＝ 46.5 ×(1+40%) ＝ 65.1 → ×36x ＝ **2,344**，相對現價 **+37.9%**
    **三個假設全部移出 ±5% 帶外 → 判定為「基準年假象」**，與 3324 同日的結論同型。
    ⚠ **含意**：「本檔大致合理定價」是用一個只剩三分之一的基準年算出來的，**不是估值結論**。
  base_eps_自下而上複核: >
    ✅ **2026-09-10 首次用實際月營收自下而上複核 base 的 EPS 46.5，結果為 47.0（差 1%）。**
    推導：H1 營收 63.88 億（6 個月，月均 10.65）；7 月 12.29 ＋ 8 月 16.28 ＝ 28.57 億
    （2 個月，月均 14.29）→ **月均 run-rate 較 H1 高 +34.2%**。
    以 8 月的 16.28 億外推 9–12 月 → H2 營收約 93.7 億；
    以 H1 隱含淨利率 **24.0%**（EPS 19.07 × 80.25M 股 ÷ 63.88 億）計 → H2 EPS 約 **28.0**，
    **FY2026 EPS ＝ 19.07 ＋ 28.0 ＝ 47.0**。
    ⚠ **這是本輪最有價值的一項**：base 的 46.5 原本是「由 H1 往下推的自行推導」，
    要求 H2 較 H1 高 47% —— **當時那是一個要求很高的假設，現在有兩個月的實績支持它。**
    ⚠ **但克制**：(1) 以單月 16.28 億外推四個月是強假設，該月年增 152.24% 可能含拉貨集中；
    (2) 淨利率沿用 H1 的 24.0%，**Q3 毛利率未取得**；(3) 兩個月不構成趨勢。
    **故不調 EPS，只把它記為 base 假設的外部佐證。**
