    ⚠⚠⚠ **而 TTM EPS 約 **4.22 元**（現價 126.50 ÷ 本益比 29.98）——
    比 H1 還低。**
    **亦即 2025 年下半年約為 **-0.60 元**（4.22 − 4.82）—— 本檔去年下半年仍在虧損。**
    **三個本益比：TTM **29.98 倍** ／ H1 年化 約 **13.1 倍** ／ Q2 年化 約 **8.1 倍**，
    差 3.7 倍。**
