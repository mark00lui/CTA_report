    被動資金流污染可能不小），故量能訊號視為大致乾淨但未完全排除污染，
    **依規則不得單獨作為右側確認的否決依據**。
    ⚠ **price 欄採 2026-09-09 收盤 1,795.00，不採 9/10 盤中 1,690** ——
    盤中價不入 price 欄，否則同一天可以得到兩個相反的位階結論。
    ⚠ **invalidation 刻意寫「當期 MA240」而非寫死數字** —— 2026-09-09 於 state/GOOG.yaml
    剛踩過「把移動均線寫成固定值會讓條件隨時間失真」這個問題，本檔建檔即避開。
    ⚠ **driver_refs 只掛 hyperscaler-capex 一個，且該 driver 的 transmission 尚未回指本檔** ——
    validate_state.py 會發 warn，那是正確的。accelerator-roadmap 應掛而未掛（其
