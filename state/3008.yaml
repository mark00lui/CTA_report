    **FY26→27 +10.2%、FY27→28 +14.4% —— 對照 ABF 三家的 +80% 到 +148%。**
    **所以滾動基準年只讓 EPS 升 10.2%，而它小於三情境的 EPS 全距（1.26 倍）；
    而 2308 的滾動幅度（+50.1%）是其三情境全距（±14%）的三倍以上。**
    **→ 判斷該不該優先處理某檔的基準年，看它的 FY+1→FY+2 成長率。**
    ｜⚠⚠⚠ **全距 10,345 ÷ 2,190 ＝ 4.72 倍超過 3 倍門檻（算術 5,646 對幾何 4,891，差 15.5%），
    而本檔的全距來源與 ABF 兩檔不同，這比算術／幾何之別更重要**：
    **FY2027 共識的 EPS 全距只有 1.26 倍，而倍數全距是 3.75 倍（12x → 45x）——
