    ⚠ **第四條沒有標成「未驗證」，是本輪連續第三檔做到這件事**
    （前兩檔為 6187 用管理層能見度、3583 用對台積電銷貨金額）——
    **三檔的共同做法是：找一個公司自己說過、且有期限或有金額的陳述當錨。**
    ｜⚠ **另記一個與同日 8299 的對照**：**Q1 毛利率 46% 在營收年增 115% 的同時
    與去年同期持平 —— 成長來自量而不是價，產品定價沒有跟著記憶體現貨價走。**
    **而 8299 的毛利率一年內自 29.06% 衝到 65.31%，因為它賺的是價差。**
    **兩檔都在記憶體這條鏈上，而獲利機制完全相反。**

