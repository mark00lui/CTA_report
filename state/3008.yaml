notes: ⚠ 本檔看似能填補覆蓋清單 non_ai 為 0.0% 的結構性偏誤 —— 它的營收基礎確實是消費性光學（手機鏡頭），
  與 AI capex 無關。但它填不了，因為**驅動股價的不是營收基礎而是 CPO**：三日 +28.41%、兩根漲停、
  創歷史新高，催化劑全部來自 CPO 首張訂單與為此購置的不動產。
  ｜因此本檔加深的不是 ai_capex_hw，而是 cpo —— 與 6442 光聖形成同題材的第二檔。
  兩者切入點不同（本檔自 FA／PMLA／FAU 光學元件端，6442 為光通訊產品），但共用同一個
  「CPO 是否如期放量」的前提。判讀清單分散度時必須把這一層算進去。
  ｜建檔時點的特殊性要記住：連續兩根漲停期間沒有換手，支撐與壓力都還沒形成，
  技術面的任何判讀在此時都不可靠。加上均線本來就沒取得，本檔的 CTA 是全清單中最弱的一份。

