    且價格在季線之上，invalidation 因此首次填得出來（1,134.89）。**
    **這條規則現在有兩端極端樣本、兩個偏緊樣本、與一個過關樣本 ——
    應正式寫進 references，並用「距離 ÷ 日振幅」的比值表達。**
    ｜⚠⚠ **「清單內的標的不作為估值錨」第七次適用，且第一次適用於同一個因子格內的兩檔**
    （3131 與本檔同屬 `semi_equipment`，是最像同業的一組，但它在清單內）。
    **六種關係（循環引用、零和競爭、相鄰零件、上下游、客戶、同格同業），同一個處置。**
    ⚠ **同業取自清單外的辛耘 3583／志聖 2467／京鼎 3413，而它們正是 3131 的同業 ——
    構成本清單第四組共用錨。刻意不為了避開重疊而改用可比性更差的對照。**
    ｜方法跨**三軸**（參照／分母／時間）。
    ⚠⚠ **副錨用「合約負債 ÷ 單季營收」，而本檔比 3131 多一個東西**：
    **管理層明言「訂單能見度直達 2027 年 Q2」—— 那是一句有期限、可被時間否證的話，
    合約負債是它在報表上的痕跡，兩者對不起來就有一邊是錯的。**
    ⚠ **層級軸未跨（淨現金未取得）—— 本輪第八檔。昨日已記為流程缺陷，
    本檔不再重複，直接寫進 changes_if 並標「每次建檔必查」。**
    ｜三情境**刻意不建立**：**三個排序指標現值全缺（與 3131 完全相同的三項）；
    三家同業倍數全缺；產品組合的營收占比完全未取得 —— 而管理層說利潤率的波動正來自組合。**
    ｜評級**中性／信心低**。位階**右側確認**。
    ｜四條 falsifier。⚠ **第四條是本輪第一次沒有標成「未驗證」的** ——
    **前六檔都因為客戶集中度取不到而標未驗證；本檔改用管理層自己給的能見度當錨
    （2027 Q1 單季營收低於 2026 Q2 的 23.54 億元），繞開了那個缺口。**
    **有期限的管理層陳述，比一個查不到的年報欄位更容易變成可否證的東西。**
    ｜⚠ **建檔時攔下一個錯誤的二手數字**：某來源載 H1 EPS 累計成長率 **+9.82%**，
    **但法說載 +53.7%，且由 Q1 2025 的 3.58 與 Q2 2025 的 4.16 推得亦為 +53.7% —— 兩路一致。**
    **若採信 +9.82% 會推得 Q1 2026 年減約 50%，一個完全不存在的衰退。**
    **二手成長率比二手絕對值更危險，因為它看起來已經算過了。**
    ｜⚠ **月營收的四種形狀現在都有樣本，本檔與 3081 是「三個維度都可讀」的那一種。**
    ⚠⚠ **但即使可讀，仍刻意不把月營收年增率列為排序指標 ——
    它在本族群量的是交機時點而不是競爭力。**
    **「可讀」與「可用來定序位」今天第一次分開，這是「確認不到就換掉」規則的第四種失效類型。**

