# 公開研究檔 — 本倉庫不含任何倉位資訊：無成本、無張數、無權重、無 Kelly、無損益、無持倉揭露。
# 未知值一律留 __ 並寫進 gaps，不要填看起來合理的數字。
#
# ⚠ 本檔刻意「不」放資料中心營收。那是共用事實，住在 drivers/ai-accelerator-demand.yaml
#   的 components（NVIDIA Data Center），同時驅動 TSM 投片、3324 機櫃附載、6442 互連埠數。
#   依 CLAUDE.md「一個共用事實只能有一個家」，本檔只放 NVDA 自己的變數。
ticker: NVDA
name: NVIDIA
market: US
factor_tags:
- ai_capex_hw
- accelerator
driver_refs:
- driver: ai-accelerator-demand
  direction: '+'
  note: >
    本檔是這個 driver 的主要成分，也是它的傳導對象 —— 覆蓋清單中唯一「既被研究、又是他檔資料來源」
    的標的。資料中心營收與合計值取 driver 現值，不在本檔複製。方向為 '+' 但內含一個反向成分：
    合計需求若主要由自研 ASIC 貢獻，對 NVDA 是替代而非受惠，見該檔第三條 falsifier（ASIC 占比 >30%）。
- driver: accelerator-roadmap
  direction: '+'
  note: >
    自家平台換代節奏。方向 '+'，但換代爬坡期對毛利率是短空 —— Q3 FY27 毛利率指引由 75.0% 降至
    74.0%，正好是 Vera Rubin 開始出貨的那一季。判讀本檔毛利率下行時，必須先排除「換代爬坡」
    這個暫時性解釋，才能論證它是結構性的定價權問題。這是 thesis 的核心分歧點。
valuation_frame:   # 2026-09-07 首次宣告
  quadrant: Q4
  quadrant_basis: >
    **低資本密集**（fabless，capex 遠低於 15% 門檻，TTM 營收 302.97B）
    × **當期盈餘代表性低**（TTM EPS 7.91 **+125.3%**、營收 **+83.4%** ——
    成長率遠離穩態，單一年度的 EPS 無法代表常態獲利能力）。
    ⚠ **故為 Q4 而非 Q2**：資本密集度是 fabless 的低，不是 hyperscaler 的高。
    Q4 的處方是 EV/Sales 與成長持續期，**forward PE 單獨無意義** ——
    它會隨基準年滾動而大幅跳動，本輪即出現實例（見 excluded）。
  quadrant_since: 2026-09-07
  peer_group: 加速器
  peers:
  - ⚠ **本清單內無同業，清單外亦無真正可比者**（AMD 的資料中心規模與毛利結構差距過大）。
    這是本檔軸④跨不過去的結構性原因，非疏漏
  rank_metrics:
  - 資料中心營收成長率
  - 毛利率軌跡（本檔自 75% 下行，thesis 的核心爭點）
  - 客戶集中度（⚠ 本檔此值為 `__`，**排序指標本身是缺口**）
  methods:
    primary: 自身歷史 forward PE（**限 AI 期間**：近 2 年平均 34.2x、近 1 年 32.2x；5 年平均 40.2x 因跨越 AI 前後不採用）
    secondary: 成長持續期／reverse-DCF（Q4 的處方，⚠ **本輪仍未執行**，列 gaps）
    check: 賣方目標價隱含倍數（325.99，stockanalysis，2026-09-04，60 位分析師）
  axes_crossed:
  - 時間（軸③：自身歷史 forward vs 現況 forward）
  - ⚠ **軸④跨不過去** —— 無可比同業。這是本檔的結構性限制
  excluded: >
    ⚠ **不用 PB**（fabless，帳面淨值與價值脫節）。
    ⚠ **不用 EV/EBITDA**（折舊攤銷占比太小，中和不了任何東西）。
    ⚠ **不做 forward-DCF**。
    ⚠ **不可跨基準年引用 forward PE** —— 2026-09-07 實例：
    state 的遠期本益比記 **23.2**（基準 FY2027 EPS 9.27），
    而 stockanalysis 同期記 **19.10**（隱含 forward EPS **12.06**，高出三成）。
    **最可能的解釋是市場的 forward 已滾到 FY2028 而本檔基準年仍是 FY2027。**
    引用任何一個「forward PE」之前，先確認它的分母是哪一年。
    ⚠ **2026-09-07 新增一項必須開始處理的東西**：本檔已建立
    **約 990 億美元的股權投資組合**（兩年內自零建起）。
    依 valuation.md 的 DCF 第二點，**資產負債表的產出不該被乘上本益比倍數** ——
    GOOG 已因股權證券損益而需要正常化 EPS，**本檔正在變成同一類問題**，
    但目前尚未取得該組合對 EPS 的貢獻金額。列 gaps。
  reviewed: 2026-09-12
thesis: 需求已不是爭點（DC +117%、Q3 指引 $108B 且完全不含中國）；爭點是毛利率自 75% 下行的斜率與 Rubin 換代的持續性，23x 遠期本益比已明顯折價但未定價成長終結
thesis_since: 2026-08-27
thesis_history:
- {until: 2026-08-27, text: "…19x 遠期本益比已定價成長終結",
   why_changed: "引用的數字錯誤。19.08x 為 NTM 口徑（跨 FY27H2／FY28H1），與任何單一會計年度共識都對不上。FY2027 共識 EPS 實為 9.02，對 209.66 收盤是 23.2x。23.2x 只支持『已明顯折價』，不支持『已定價成長終結』的強論述。見 reports/2026/08/2026-08-27-NVDA-revaluation.md"}
valuation_base_year: FY2027   # 首次設定。滾動至 FY2028 的時點為 Q3 FY27 財報（約 2026-11），屆時 FY28 共識可得

scenarios:
  bear:
    p: 0.25
    p_basis: 機率由使用者於 2026-08-27 全量重估指定。52 週股價僅 +16.6% 而同期營收成長 106%，市場已用膝蓋投票表達對持續性的懷疑；毛利率指引下行尚未被證明是暫時的
    key_assumption: Q4 營收持平於約 110B、毛利率續滑至 72%；市場視其為循環高點，給半導體週期性倍數
    eps: 8.9
    exit_multiple: 16
    multiple_basis: "半導體股被市場認定處於週期高點時的 forward 定價區間（15–17x）。對應價 142 低於 52 週低 164.07 — 市場在過去一年未曾付過此價，故本情境需要比過去一年更深的修正"
    tp: 142
    narrative: 對應價低於 52 週低 164.07 — 需要一次比過去一年更深的修正才成立
  base:
    p: 0.50
    p_basis: Q3 已給指引且連五季超預期，達成是最可能路徑；倍數維持現況不需要任何人改變看法
    key_assumption: FY2027 共識達成（營收 409B、EPS 9.27）；毛利率依指引自 Q3 的 74% 滑至 Q4 觸底 71–72%，原因為記憶體成本而非需求
    eps: 9.27
    exit_multiple: 30
    multiple_basis: "錨 A（自身歷史 forward，AI 期間可比）。近 2 年 forward 平均 34.2x、近 1 年 32.2x；5 年平均 40.2x 因跨越 AI 前後不採用。半導體業 forward 中位 30.36x。現況 23.5x（217.55 ÷ 9.27）較近 2 年平均折價 31%。⚠ **2026-08-31 更正一個實質錯誤**：前一版寫「EPS 成長將自 +106% 大幅減速至約 +14%，折價有理」—— **+14% 對不上任何數字**。FY2027 共識 EPS 9.27 的年增率是 **+94.4%**（61 位分析師，前一年約 4.77）；+106% 則是 Q2 單季**營收** YoY，兩者口徑不同不可並列成一個減速敘事。減速的前提根本不成立，而那正是我用來合理化 31% 折價的一半理由。判斷因此自【部分合理】改為【大部分不合理】：管理層 2026-08-26 另給出 FY2028 營收成長約 +70% 的遠期指引，且明言供給受限而非需求上限（黃仁勳：demand is much greater than 70%），該指引遠高於街上原本模型化的約 +44%。一家剛保證下一年還要成長七成的公司，不該用「成長減速」折價。倍數自 28x 提高至 30x，取**半導體業 forward 中位 30.36x 的整數**，仍低於自身近 1 年的 32.2x 與近 2 年的 34.2x —— 保留的折價對應三項真實負面：毛利率因記憶體成本自 74% 滑至 71–72%、自由現金流 127.01B 顯著低於 TTM 淨利（營運資金被爬坡吃掉）、以及季增金額由 146 降至 118 的增量收斂訊號。⚠ 非現價隱含值（23.5x）"
    tp: 278
    narrative: 30x ＝ 半導體業 forward 中位，仍低於自身近 1 年 32.2x。折價自 31% 收斂但未消除，保留的部分對應毛利率、自由現金流與增量收斂三項負面
  bull:
    p: 0.25
    p_basis: 需要毛利率回升與倍數擴張同時發生，且中國恢復不在任何人的掌控中。與 bear 對稱
    key_assumption: Q4 約 128B、毛利率守在 73% 以上（證明記憶體成本可由 FY2028 Q1 漲價吸收）；中國恢復為純上檔；市場接受 FY2028 +70% 指引的成長持續性，倍數回到自身近 2 年區間
    eps: 9.5
    exit_multiple: 34
    multiple_basis: "錨在市場實際付過的價：近 2 年 forward 平均 34.2x。⚠ 對應價 323 幾乎等於賣方均值目標價 323.42（61 位，2026-08-30）—— 跟隨街上目標價等於選擇了本情境。這個巧合在 8/27 版本就出現過（當時 bull 304 對街上 305.79），街上目標價持續等於我的 bull，是一個穩定的型態而非偶然：**街上把我認為需要三件事同時發生的情境當成中心預期**"
    tp: 323
    narrative: 34x ＝ 自身近 2 年 forward 平均，未取 5 年平均的 40.2x
  weighted_tp: 255

