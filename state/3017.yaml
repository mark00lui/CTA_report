# 公開研究檔 — 本倉庫不含任何倉位資訊：無成本、無數量、無權重、無 Kelly、無損益、無持倉揭露。
# 未知值一律留 __ 並寫進 gaps，不要填看起來合理的數字。
#
# ⚠⚠ 建檔當下最重要的四件事，寫在最前面：
#   (1) **本檔建立同時關掉一個長期存在的驗證警告。** `drivers/hyperscaler-capex.yaml` 的
#       transmission 早就列著 3017 卻沒有對應的 state 檔，`validate_state.py` 為此警告了很久，
#       而 `state/3324.yaml` 自己也記著這件事。**本檔補上後只剩 AMZN。**
#   (2) ⚠⚠ **本檔與 3324 雙鴻是直接同業，而 3324 的 `methods.secondary`（錨 B）
#       用的正是本檔的 forward PE 26.26x —— 這是本清單第二組循環引用**
#       （第一組為 LITE／COHR）。**差別是這一次我在建檔前就看見它，而不是建到一半才發現。**
#       **處置：本檔的錨一律取自覆蓋清單外（健策 3653、建準 2421），明文禁用 3324 的倍數。**
#   (3) ⚠⚠ **而且查證錨 B 時發現一個口徑問題，它會回頭影響 3324 的估值。**
#       **3,285 ÷ 26.26 = 隱含 forward EPS 125.1，而台灣法人 2026 年共識 EPS 區間為
#       87.78–106.8（均值約 101.1）—— 隱含值高出上緣 17%。**
#       **以同一個 2026 共識口徑重算，本檔的 forward PE 是 32.5x 而非 26.26x；
#       對照 3324 自身的 21.80x（同樣用 2026 共識），同業溢價是 49% 而不是 20%。**
#       **這代表 3324 給自己的折價，是對著一個口徑不一致的分母量出來的。** 見 notes。
#   (4) ⚠ **本檔是本日六檔中唯一取得實際 capex 數字的**（年度約 150 億元、Q1 單季 36.57 億元、
#       2026–2027 合計 320 億元），**也是唯一價格站在季線之上的**（+25.39%）。
