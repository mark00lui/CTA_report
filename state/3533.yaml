    且改善「需等油價回穩與新產品放量，預計 2026 Q4 或 2027 初」。
    **亦即：Q1 的 49.55% 是管理層自己說的庫存產物，不可當正常水準。**
    ｜⚠⚠ **Y 軸（資本密集度）＝ 未取得，這是本檔最弱的一環，必須誠實標出。**
    **capex／營收、折舊占營收比重、淨現金／淨負債三項全部未取得。**
    可用的間接證據只有兩條，**都是推論不是事實**：
    (a) 公司公告的籌資規模很小 —— 現金增資普通股上限 **130 萬股**（佔在外股數 11,253 萬股的
