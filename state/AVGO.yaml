thesis: 爭點不是 AI 成長是否為真（Q3 +221%、Q4 指引 +236%），而是持續期——49 位分析師對盈餘的分歧僅 3.35%，對目標價卻達 231%
thesis_since: 2026-09-08

scenarios:
  # ⚠ 2026-09-08 首次建立（建檔同日的第二輪）。建檔時的阻塞是「資料夠而尺不夠」——
  #    沒有任何可用的倍數錨。本輪由公司法說會的多年期指引解開：
  #    **我宣告的主錨「成長持續期」第一次真的有東西可錨。**
  # ⚠⚠ **但所有指引數字都是二手轉述（多來源一致，一手逐字稿未讀），這決定了信心不升等。**
  #    本輪自己撞到一個證據：CMoney 2026-09-07 寫「調整後 EBITDA 指引約 66%」，
  #    而 8-K（一手）寫的是「Non-GAAP **operating income** ... 66 percent」——
  #    **EBITDA ≠ 營業利益。同一類來源在一個我查得到的數字上把口徑弄錯了。**
  # ⚠ **基準年由 FY2026 改為 FY2027**（見 valuation_base_year）。目標價的跳動主要來自換基準年，
  #    不是重評價 —— 依 /revalue 步驟 3 明確標示。
  # ⚠ **EPS 由「指引的 AI 營收 + 推導的非 AI 營收 × 營益率 × 稅後轉換率」建構，
  #    刻意不用頁面 forward PE 隱含的 17.31 —— 那是由現價推導的，用它就是循環論證。**
  #    稅後轉換率 0.815 取自 Q3 FY26 實績（非 GAAP 營業利益 20,095 → 淨利 16,372）。
  #    股數 4.76B。非 AI 營收以 Q4 指引的約 13.1B/季為基礎，按 +13% 年增推算。
  # 機率 0.25 / 0.50 / 0.25 由使用者於 2026-09-08 指定（本檔無前值可沿用）。
  bear:
    p: 0.25
    p_basis: "使用者指定（2026-09-08）。對應的判斷是：指引無法達成——供給（晶圓與先進封裝）比公司說的更緊，或某一大客戶縮減／轉自研，且客戶集中度使衝擊直接反映在損益表"
    key_assumption: "FY2027 AI 營收僅達 90B（指引 115B 的 78%）；非 AI 56B；非 GAAP 營益率壓縮至 58%（即市場目前隱含的水準）"
    eps: 14.50
    exit_multiple: 14
    multiple_basis: >
      **14x 略高於街上目標下緣所隱含的倍數**：分析師最低目標 215.88 ÷ base EPS 18.47 = **11.7x**。
      ⚠ **不取更低的 11.7x**：那是 49 位分析師中最悲觀的一位，
      **而本情境假設的是「指引未達成」而非「公司出事」。**
      對照本檔自身現況：現價隱含 FY2027 為 **19.38x**，14x 較之低 **27.8%**。
    tp: 203
    narrative: "供給或客戶其中一項出問題，指引跳票。倍數同步壓縮以反映自研 ASIC 的客戶集中度風險——這是本檔最大的單一風險，而它至今沒有一手來源可量化"
  base:
    p: 0.50
    p_basis: "使用者指定（2026-09-08）"
    key_assumption: "FY2027 AI 營收達指引的 115B；非 AI 59B（Q4 指引年化後按 +13% 成長）；非 GAAP 營益率 62%——介於公司指引的 66% 與市場目前隱含的 58% 之間"
    eps: 18.47
    exit_multiple: 22
    multiple_basis: >
      ⚠ **不是現價隱含倍數**：現價 357.90 ÷ base EPS 18.47 = **19.38x**，
      **22x 較之高 13.5%**。循環性檢查通過。
      **22x 的來源是成長持續期（本檔宣告的主錨，本輪第一次真的可用）**：
      公司指引 FY2027 AI 倍增至 115B、FY2028 再倍增至 230B，**且兩年供給皆稱已鎖定**；
      管理層另稱 **FY2028 EPS 將超過 30**。
      ⚠ **22x 的檢驗方式是換算到 FY2028：base 406 ÷ 指引 EPS 30 = 13.5x。**
      **即使 base 成立，對公司自己指引的 FY2028 盈餘仍只有 13.5 倍 —— 這個倍數不算積極。**
      ⚠ **為何不更高**：三個具名理由。
