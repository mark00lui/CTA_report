gaps:
- question: >
    ⚠⚠⚠ **模型裡沒有任何一格對應「NAND 循環反轉」，而那是 thesis 的核心風險。**
    三情境的 EPS 全部高於官方 FY2026 實際值 **73.76**：
    **bear 130 ＝ +76.2%**／base 214.1 ＝ +190.3%／bull 240 ＝ +225.4%。
    ✓ bear 自陳「這不是崩跌情境，只是『漲價停在這裡』」—— **所以那是刻意的界定而非矛盾。**
    ⚠ **但後果是：若漲價回吐而不只是持平，三情境全部失效。**
    ⚠⚠ **而官方序列證明那一格不是假想的**：FY2023 −14.78、FY2025 −11.32、單季最差 −13.33。
    ⚠⚠ **且 2026-09-09 新簽的 15 億美元循環額度是有擔保並含最大槓桿比率財務約款的
    —— 真正的反轉會同時咬到約款，而模型對那個情境沒有表達。**
  how_to_close: 由使用者決定是否新增第四格（或把 bear 改寫成兩段：漲價持平 vs 漲價回吐），並指定機率；本輪不動機率與 EPS
- question: >
    ⚠⚠⚠ **市場隱含的中週期 EPS 高於本公司歷來最佳年度，而 base 借用的正是市場的倍數。**
    現價 1,633.35 ÷ 16.8 ＝ **97.22**，**比官方 FY2026 的 73.76 高 31.8%**；
    官方四年算術平均只有 **10.76**（⚠ 含三年谷底與減損，不是正常化值）。
    **→ 市場隱含的「中週期」假設了結構性抬升，而那正是 bull 的前提（NBM 長約把價格鎖為結構性）。
    亦即現價在 base 的位置上已經定價了 bull 的前提 ——
    這把 base 從「非獨立判斷」推進到「不是中性情境」。**
    ✓ `signal.conviction` 已是「低」且 `multiple_basis` 已宣告「無獨立估值基礎」，**所以結論不變，
    變的是理由的強度。**
  how_to_close: 自 10-K 取出 FY2023–FY2026 的營收與營業利益率，做一個自下而上的中週期 EPS 估算（跨循環平均營業利益率 × 正常化營收），與 97.22 並列；若兩者差距仍大，base 的倍數必須改為獨立推導而不是現價隱含值
- question: >
    ⚠⚠⚠ **`cross_check` 的 F5 量到的不是情境設計，是加權方式 —— 本檔是發現它的案例。**
    恆等式：**（算術−base）−（幾何−base）＝ 算術加權 − 幾何加權 ＝ 該檔的 AM–GM 落差**，
    而加權算術平均恆大於加權幾何平均，**所以落差 >4pp 時「算術 ≈ base」與「幾何 ≈ base」
    不可能同時成立。**
    **實測：現行 F5 旗標 8 檔（3324 +0.17／3583 −0.28／MSFT −0.35／AAOI +0.48／SNDK +0.80／
    2317 −1.21／3131 −1.51／6187 +1.80 pp），而改以幾何為準會旗標另外 7 檔
    （TSM −0.00／CEG +0.33／6442 −0.73／3081 −1.11／COHR −1.11／INTC −1.16／3533 −1.93 pp）
    —— 兩個集合完全不相交。**
    ✓ 最接近同時滿足的是 CEG（落差僅 1.68pp）與 MSFT（2.02pp），**正好印證機制。**
  how_to_close: 在 cross_check.py 裡把 F5 改為量 AM–GM 落差本身（並說明它與 F2 全距的重疊），或把訊息改寫為「算術加權對兩翼不敏感」而不是「兩翼對頭條幾乎沒有貢獻」
- question: >
    ⚠⚠ **週收盤濾網的地位要分兩類，而此前十一次使用混為一談 —— 本檔是發現它的案例。**
    **若欄位文字本來就是「週收盤跌破 X」（本檔即是），
    週真實波幅 ≈ √5 ＝ 2.236 倍日 ATR 才是與條件同尺度的分母，日 ATR 是低估，不是門檻
    —— 那時用濾網不是放寬。**
    **若欄位是日收盤條件，濾網才是放寬，需要額外的理由。**
    ⚠ 這與既有的「濾網是否適用於價格上方的位階」是不同的問題。
  how_to_close: 在覆蓋層收尾報告裡分類清點十一次使用各屬哪一類，並把分類寫進 references/state-schema.md 的雙邊規則一節
- question: >
    ⚠ **無自身「倍數」歷史（2025-02 分拆），且 NAND 專營公司的可比同業有限。**
    目前以 MU 的 trailing 中位 16.8x 代理，但 NAND 與 DRAM 的循環幅度與供給結構不同。
