driver_refs:
- driver: ai-accelerator-demand
  direction: '+'
  note: >
    加速器出貨與供應商採購承諾 → HBM 與伺服器 DRAM 需求 → 合約價與毛利率。領先 1–2 季。
    ⚠ 2026-08-31 補入 —— 此前本檔在覆蓋清單內卻無任何 driver_refs。促成的證據是
    NVIDIA 於 2026-08-26 揭露採購承諾自 119 增至 279 bn、明言主要用於記憶體採購。
    ⚠ 傳導的是**價格**不是數量：加速器廠為鎖料而願意簽更長更貴的約，
    故本檔的反應應先出現在合約價與毛利率，而非出貨量。
    ⚠ 同一筆記憶體成本對 NVDA 是毛利率壓縮（Q4 觸底 71–72%），對本檔是漲價 —— 方向相反。
thesis: 6x 不是便宜而是市場對 FY2028 回歸的提前定價 —— 新產能落在 FY2028 而非基準年，這是低倍數與 EPS 再翻倍能並存的原因
thesis_since: 2026-08-27
thesis_history:
- {until: 2026-08-27, text: "86% 毛利率本身就是最強的擴產誘因，而新產能已排定 2027H2 開出；6.5x 遠期本益比是循環峰值的假便宜，爭點是供給追上前還剩幾季",
   why_changed: "建檔當日重估即取得產能時點與 Micron 財年的對齊關係，把「還剩幾季」這個問句換成了機制陳述：新供給只有約 2 個月落在 FY2027，其餘全落在 FY2028。原句方向正確但停在提問；新句給出「為何 6x 與 +111% EPS 成長能並存」的具體解釋。見 reports/2026/08/2026-08-27-MU-revaluation.md"}
valuation_base_year: FY2027   # 2026-09～2027-08。FY2026 實質已結束（僅剩 FQ4，財報日 2026-09-22）。⚠ 無法用本益比反推唯一鎖定 —— forward PE 6.53 隱含 143.7 落在 FY2026(73.40) 與 FY2027(155.03) 之間，屬 NTM 口徑

scenarios:
  # EPS 為 FY2027 口徑。⚠ 本檔的多空之爭不在賺多少而在倍數：
  # bull 的 EPS 只比共識高 13%，但 10x vs 6.5x 是 54% 的重評價。
  bear:
    p: 0.25
    p_basis: 機率由使用者於 2026-08-27 全量重估指定。定價鬆動不需等新產能實際開出，預期即足以壓垮合約價；且 FY2023 的先例證明振幅是真的（毛利率一年內由 45.2% 崩至 2.7%）
    key_assumption: 定價在 FY2027 內先行鬆動；EPS 停在 FY2026 水準附近而非再翻倍
    eps: 95
    exit_multiple: 5
    multiple_basis: "循環股尾部錨在上一輪實際谷底：MU 的 DRAM 谷底為 FY2023 的 2.7% 毛利率。5x 套在峰值 EPS 上是市場對「這就是峰值」的典型定價，非估值訊號"
    tp: 475
    narrative: 5x 為循環峰值常見低檔；對應價低於 200DMA(581.54)
  base:
    p: 0.50
    p_basis: FQ4 指引已給且供給緊俏預期延續至曆年 2026 之後；新供給要到 CY2027H2 才開出，FY2027 全年有時間緩衝
    key_assumption: FY2027 共識達成，供給緊俏延續全年；倍數維持在循環峰值該有的低檔
    eps: 155.03
    exit_multiple: 6.5
    multiple_basis: "循環股框架（見 references/valuation.md）。採市場慣用的【峰值 EPS × 低倍數】：FY2027 共識 155.03 × 6.5x。⚠ 6.5x 貼近現價隱含值，故此數字本身不是獨立判斷 —— 獨立判斷在下面的正常化對照。【正常化對照】MU 的 trailing 本益比 10 年中位 16.78x、5 年平均 15.81x（區間 2.50–164.56x，極值來自循環兩端的 EPS 趨近零，故用中位不用平均）。反推：現價 974 ÷ 16.78x ⇒ 市場隱含的中週期正常化 EPS 約 58 美元，相當於峰值 155 的 37%。真正該問的是「58 美元是不是 MU 合理的跨循環 EPS」，而不是「6.5 倍便不便宜」。上一輪循環 MU 的 EPS 自 FY2023 的 -5.34 到本輪峰值區間，跨度極大，中週期 EPS 目前為缺口 —— 但 58 這個隱含值已被明確算出，可供日後檢驗"
    tp: 1008
    narrative: 6.5x 為峰值 EPS × 低倍數的市場慣用框架；正常化對照見 multiple_basis —— 現價隱含中週期 EPS 約 58 美元
  bull:
    p: 0.25
    p_basis: 需要市場開始給「非循環」倍數，那是認知的改變而非數字的改變 —— 比 EPS 超預期難得多。與 bear 對稱
    key_assumption: HBM 使記憶體脫離商品循環（需求結構性、供給受先進封裝與良率限制）；市場開始給非循環倍數
    eps: 175
    exit_multiple: 10
    multiple_basis: "錨在賣方定價：街上均值目標 1,515（2026-08 取得）隱含 9.8x。交叉檢查：10x 峰值 EPS 相當於正常化框架下中週期 EPS 約 90 美元 × 16.78x，即假設本輪高獲利有六成是結構性的"
    tp: 1750
    narrative: 10x ≈ 街上均值目標 1,515 隱含的 9.8x。關鍵是倍數不是 EPS
  weighted_tp: 1060
  # ⚠ 三情境刻意不含 FY2023 式全面崩跌（毛利率個位數、EPS 轉負）。
