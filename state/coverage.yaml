      **3081 的 2026 Q2 法說明言「InP 基板：4 吋以上大基板供給比重極低，為隱形瓶頸；
      本公司現多數出貨 3 吋以上」。**
      **AXTI 的整個 thesis 就是 InP 基板產能能不能開出來 —— 而這句話來自它的客戶那一層，
