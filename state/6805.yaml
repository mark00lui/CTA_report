    ｜⚠⚠⚠ **並發現三步判準第一步的退路不完整**：第一步說「盈餘趨零 → 改用 PB 或 PS」，
    但本輪的主力指標 PB ÷ 每點 ROE 的**分母也是 ROE** —— 所以對盈餘趨零的同業同樣爆掉：
    **新日興的 PB 僅 2.44（便宜）卻算出 1.435（看似很貴）；兆利的 PB 僅 0.93 卻算出 2.325。
