# 族群需求對 6442 不等於訂單，這一點 6442 自己的 driver_refs 已註明。
#
# ⚠ 待查：3008 切入的 FA／PMLA／FAU 光纖陣列模組位於 CPO 封裝的上游環節，
# 而 COHR 提供 CPO 用的超高功率連續波雷射。兩者在同一條鏈上但不同位置，
# 目前無直接證據顯示是競爭關係 —— 但也無證據顯示不是。納入 COHR 後新出現的問題。

# ⚠ 3008 大立光：一個看起來能分散、實際上不能的案例
# 它的營收基礎是消費性光學（手機鏡頭），與 AI capex 無關 —— 表面上正好補上 non_ai 的 0.0%。
# 但納入當日（2026-08-27）它以連續第二根漲停作收、三日 +28.41%、創歷史新高，
# 而催化劑全部來自 CPO：首張訂單到手、量產客戶規格文件已收、8/25 再砸 30.8 億元購置廠房
# （今年第 4 度、累計 56.49 億元）。
#
# 換句話說：**驅動它股價的不是它的營收基礎。** 買進它等於買 CPO，不是買手機鏡頭。
# 因此 non_ai 維持 0，而 cpo 由 1 檔變 2 檔 —— 那才是這次新增真正加深的因子。
#
# 這個案例的一般性教訓值得記下來：判斷一檔標的能否分散清單，要看「什麼在驅動它的股價」，
# 不是看「它的營收來自哪裡」。用產業分類做分散度檢核會在這裡失效。

# ⚠ 納入 SNDK 幾乎是把記憶體曝險加倍，而不是分散。
# MU 與 SNDK 是同一個循環的兩個切面：毛利率同為 84.6%（巧合但說明問題）、同樣由漲價
# 驅動、同樣面對 CY2027H2 的新產能、同樣以 6–7x 的循環峰值倍數交易。
# 兩檔的差異只在 (1) SNDK 純 NAND、MU 含 DRAM 與 HBM，故 HBM 的結構性論證只適用於 MU；
# (2) SNDK 明確拆分了量價貢獻（三分之二來自漲價），MU 沒有。
# 判讀清單分散度時，memory 這一格的 20.0% 應被視為「一個部位的兩種寫法」而非兩個獨立賭注。
# 但第 (2) 點也讓 SNDK 成為判斷整個記憶體循環位置的較佳指標 —— 它的量價拆分是可檢驗的，
# MU 的不是。若要用一檔追蹤循環轉折，看 SNDK 的漲價貢獻比看兩檔的毛利率更早。

# ⚠ 納入 MU 帶來一個前八檔都沒有的性質：它的營收就是清單其餘標的的成本。
# 記憶體漲價是 Meta 與 Amazon 上修 2026 capex 時各自明確點名的原因；TrendForce 另估
# 記憶體將占 CSP capex 的 68%（二手引用，原始報告未取得）。因此 MU 在需求維度上與其餘
# 硬體端同向（加深集中），卻在成本／毛利維度上與平台端和加速器端反向。
# 這不是分散 —— 它們共用同一個 common_premise；但在該前提成立的前提下，
# MU 與其餘標的的獲利分配是零和的。判讀清單內的相對強弱時必須把這一層分開看。

# 納入 NVDA 使既有的因子集中「加深」而非分散，這一點必須寫明：
# NVDA 是這個共同前提最純粹的單一表述 —— 它沒有非 AI 業務可以緩衝（Edge 僅占 Q2 營收 7.5%），
# 也沒有像 MSFT／GOOG 那樣的訂閱或廣告基底。若共同前提失效，它不是「跟著受傷」，而是震央。
# 換句話說：這次新增提高了清單的解析度（多了供應端的第一手視角），但降低了它的分散度。

# ✅ **2026-09-10 結案：下方這個記錄過三次的缺口，已由納入 2308 台達電關閉一半。**
# NVIDIA 點名的兩家台廠中，**台達電已納入，光寶科 2301 仍未納入**（後者現列為 2308 的 peers 之一）。
# ⚠ **關閉它的代價要寫清楚，不能只記好消息**：本次新增使 **ai_capex_hw 68.4%（第六次刷新歷來最高）**
# 與 **tw_market 42.1%** 同時上升，**沒有一個因子被稀釋** —— 這在本清單是第二次（第一次是 COHR）。
# ⚠ **且它沒有填上 non_ai**：2308 約六成營收來自非 AI 業務（電源零組件、自動化、車用），
# 但依本清單一貫的判準（「看什麼在驅動它的股價，不是看它的營收來自哪裡」），
# 驅動它 forward 35x 與 52 週 +122.7%（自低點）的是 AI 電源，故 non_ai 維持 0。
# 這與 3008、CEG 是同一種處置。
#
# ⚠ **仍未關閉的部分**：光寶科 2301 未納入；**機房電力系統（Eaton、Schneider、Vertiv）
# 與矽元件（ADI、Infineon、MPS、Navitas、OnSemi、TI 等十家）仍為零曝險。**
# Vertiv 現已作為 2308 的同業錨被實測（forward PE 33.55／EV-EBITDA 37.87／營益率 19.96%／ROE 43.94%），
# 但那是**當同業用**，不是覆蓋。
#
# ⚠ 2026-08-31 發現的覆蓋缺口：**電力／電源鏈完全沒有曝險，而 NVIDIA 已點名兩家台廠。**
# NVIDIA 明載 800 VDC 資料中心的全面量產與 Kyber 機櫃同步落在 2027。物理原因是規模所迫：
# 1 MW 機櫃若沿用 54 V 機內配電，單櫃需高達 200 公斤銅匯流排；改 800 VDC 後同一銅線多傳
# 150% 功率、TCO 最多降 30%。這不是選配升級，是 600kW 以上機櫃的前提條件。
#
# NVIDIA 點名的電源系統元件夥伴含 **Delta（台達電）** 與 **LiteOn（光寶科）**，
# 另有 Flex Power、Lead Wealth、Megmeet；機房電力系統為 Eaton、Schneider Electric、Vertiv；
# 矽元件為 ADI、Infineon、MPS、Navitas、OnSemi、TI 等十家。透過 OCP 另有逾 80 家生態企業。
#
# ⚠ 本清單十三檔中**沒有任何一檔屬電力或電源**。這是 common_premise 成立時的一條受惠路徑，
# 且與既有因子的相關性結構不同 —— 它受惠於「機櫃功耗上升」本身，而非「出貨量」或「滲透率」。
# 換句話說：即使 AI 伺服器出貨量成長減速，只要單櫃功耗續升，這條鏈仍有量。
# 這是清單目前唯一一條「與出貨量部分脫鉤」的 AI 受惠路徑。
#
# ⚠ 2026-09-01 再添一條同向佐證：沙烏地 HUMAIN（PIF 旗下）宣布 AMD MI355X 算力投產，
# 規模以 **MW** 表述 —— 2027 年起最多 250 MW、2030 年目標最多 1 GW，不是 GPU 顆數也不是金額。
# 對照 NVIDIA Rubin Ultra 的 600kW／櫃與 800 VDC：**MW 正在成為 AI 算力的共同計量單位**。
# 當整個產業改用電力當計量單位時，電力鏈零曝險這件事的意義比「少一個產業」更大。
#
# ⚠ 但不因此自動新增標的 —— 依 /new-ticker 慣例，建檔需使用者指示。此處只記錄缺口與理由。
# 共用事實住在 drivers/accelerator-roadmap 的 power_architecture，不複製。

