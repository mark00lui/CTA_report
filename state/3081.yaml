notes: >
  ⚠⚠ **本檔補上覆蓋清單的第四個供應鏈層級，而清單至此第一次有了完整的一條光互連鏈：**
  **InP 基板（AXTI）→ 磊晶片與 CW 雷射（本檔）→ 收發器模組（COHR／LITE／AAOI／6442／3008）
  → 交換器（2345）。**
  **本檔正好卡在 AXTI 與收發器族群之間 —— 它買 AXTI 那一層的東西，賣給收發器那一層。**
  ｜⚠⚠ **而本檔的法說直接印證了 AXTI 的論點，這是本清單第一次出現「下游用一手說法證實上游」：**
  **法說明言「InP 基板：4 吋以上大基板供給比重極低，為隱形瓶頸；本公司現多數出貨 3 吋以上」。**
  **AXTI 的整個 thesis 就是 InP 基板產能能不能開出來，而這句話來自它的客戶那一層，
  不是來自 AXTI 自己 —— 這正是 `state/AXTI.yaml` 的副錨想做卻做不到的層級交叉驗證。**
  ⚠ **而它同時是本檔第四條 falsifier 的成因之一**：
  **同一個瓶頸，對 AXTI 是需求（有人搶著要它的基板），對本檔是供給限制（買不到大基板）。**
  **同一則事實對相鄰兩層方向相反 —— 這正是 CLAUDE.md 說的「同一則消息對不同標的方向可能相反」，
  而本清單第一次在自己的兩檔之間看到它。**
  ｜⚠⚠ **本檔刻意不標 `cpo`，理由要寫清楚，因為它看起來很像該標。**
  **支持標的證據**：Datacom 佔 80–85% 且主要為矽光子用 CW 雷射；多波長方案在 3.2T 等
  高速應用具差異化；**而外部連續波雷射源本來就是 CPO 架構的必要元件。**
  **不標的理由（我認為更重),**：**本檔今天的 CW 雷射需求主要來自可插拔矽光模組 ——
  地區營收中國占 70–80%，因為全球約 75% 的資料中心模組產能在中國，
  而那些產能今天生產的絕大多數是可插拔模組。**
  **亦即：本檔的 thesis 不依賴「CPO 是否如期放量」，CPO 是額外的上檔而非前提。**
  **這與 AXTI、AAOI、2345 未標 cpo 是同一種紀律，本日第四次。**
  ⚠ **重新分類規則已寫定**：**若揭露 CPO 架構相關的 CW 雷射營收占比超過 15%，
  則加上 `cpo` 並重估。** 已列 gaps。
  ｜⚠⚠ **本檔是本日第二檔以「資本支出擴建」而非「商品循環」進入 Q3 的標的（第一檔為 AAOI），
  而兩檔都遇到同一個問題：Q3 的兩個預設主錨都不能用。**
  **AAOI 的 PB 被在建工程灌水（valuation-map 對 6239 的警告）；
  本檔的 PB 是 56.17x，帳面價值相對股價小到失去解析度 —— 方向相反，結果一樣不能用。**
  **中週期正常化 EPS 對本檔同樣失效：Q2 EPS 創 39 季新高，
  用過去約十年的獲利去正常化，等於用一家產品類別已經改變的公司的舊身分去估它。**
  **兩次就不是個案 —— 建議回填 references：Q3 應區分「循環型」與「擴建型」，兩者處方不同。**
  ｜⚠⚠ **本檔與同日 3017 構成一組很乾淨的方法論對照，值得單獨記住：**
  **3017 的月營收年增率單調減速（111.72% → 54.34%），而那幾乎全是基期造成的；
  本檔的年增率單調加速（89.35% → 180.90%），而它完全沒有基期助力
  （2025 年 3–8 月每月都在 1.81–1.85 億元之間，幾乎是平的）。**
  **同一個指標在兩檔的可讀性完全不同，而差別在去年的形狀。**
  **看月營收年增率之前要先看去年那一條線平不平 —— 這是本日從兩檔身上一起學到的。**
  ｜⚠ **估值倍數是本清單至今最極端的一組**：本益比 **246.56**、股價淨值比 **56.17**、
  市營比 **72.95**。**對照本日另五檔的最高值（AXTI 的 EV/Sales 32.73），市營比是它的 2.2 倍。**
  ⚠⚠ **但「極端」不是結論，是待解釋的現象** ——
  **獲利品質是真的（營業利益率 47%、淨利率 38%、毛利率 57%，且都在創高），
  這與同日 AAOI（同樣判 Q3，但營業利益從未為正）是兩種完全不同的東西。**
  **真正的問題是主錨要問的那一個：2.5 倍產能開出之後，這些數字還在不在。**
  ｜⚠ **wantgoo 的市值欄位少一個數量級，這已是本日第三次**
  （2345 載 1,102.60 而正確約 11,026 億；3017 載 1,327.225 而正確約 13,280 億；
  本檔載 290.042 而正確約 2,900 億元）——**確認為該來源的系統性單位問題，一律自行推算。**

event_log:
- date: 2026-09-11
  level: L3
  summary: 手動全量重估（建檔後首次）— ⚠⚠⚠ 定 L3：訊號自中性跨級為偏空，且建檔時作為 thesis 一半的 key_variable（近三季 capex／營收 217.8%）查出是口徑錯誤；另查出建檔時漏記的私募案與股票股利。首次建立三情境，加權目標價 2,219（相對 2026-09-10 收盤 2,830 為 -21.6%）
  delta: >
    ⚠⚠⚠ **本次找到三個我自己的錯，而三個都有共同的形態：我取了支持既有敘事的那一種解讀。**
    ｜**錯一：capex／營收 217.8%「本清單新紀錄」是把公告額當已支出額。**
    **原文為「聯亞在過去三季已『公告』近 60 億元的資本支出」。三個獨立證據都反對 218%：**
    **(a) 管理層明言「相關資本支出與股利發放原則上皆可由自有資金支應」且
    「仍可維持正的自由現金流」—— 與花掉營收 218% 的現金不相容；
    (b) 淨值僅 51.91 億元、總資產約 65.4 億元（由 ROE 10.52% ÷ ROA 8.36% 推得權益乘數約 1.26）
    —— 一家總資產 65 億元的公司不可能三季支出 60 億元；
    (c) 2025 年折舊僅約 3.1 億元且 2026 只是「小幅回升」。**
    ⚠⚠⚠ **而檢驗的材料我建檔時就握在手上**：**我當時寫「capex 218% 對折舊 6.14%，相差 35 倍
    → 正在蓋的資產尚未投入服務」—— 那個解釋在算術上成立，但它不是唯一的解釋，
    另一個是「capex 的口徑錯了」。我只取了支持現有敘事的那一種。**
    **規則：capex／營收 與 折舊／營收 差超過一個量級時，兩種解釋都要查；
    檢查後者最快的方法是看資產負債表的量級，不是找 capex。**
    ⚠ **處置**：**217.8% 撤回，tier 自推論降為缺口。但象限不變** ——
    **即使取保守估計（年度現金 capex 約 10–15 億元），對 TTM 營收 39.77 億元仍是 25–38%，
    遠高於 15% → Y 軸維持高，象限維持 Q3。撤回的是量級宣稱，不是象限判定。**
    ⚠ **連帶：AAOI 的 128.97% 對折舊 5.92%（21.8 倍）是同一形態，
    應於 /revalue AAOI 重查 capex 口徑。**
    ｜**錯二：建檔時漏掉私募增資案 —— 而那是 SKILL 明文要求的獨立步驟。**
    **2026-01-28 董事會決議辦理私募普通股，股數不超過 4,500,000 股（+4.42%），
    限策略性投資人，價格為市價八成；2026-05-27 股東會通過；目前尚未確定對象。**
    **SKILL 明文「公司行動掃描是獨立步驟，不得以新聞搜尋代替」——
    而建檔時我只做了新聞搜尋，因此同時漏掉這個私募案與 2026-07-15 的股票股利。**
    ⚠ **量化而不埋進假設**：**450 萬股全數發行使三情境的 EPS 與目標價各降 4.2%，
    加權自 2,219 降至約 2,126（-24.9%）。已立為新增的第五條 falsifier（門檻 300 萬股）。**
    ｜**錯三：股票股利使季 EPS 加總高估 TTM 5.7%，而這一個原因關閉了建檔時記下的全部四個歧異。**
    **2026-07-15 配現金 3 元 ＋ 股票股利 1 元（股數 +10%）。**
    **推導（用淨利反推，因為淨利不受配股影響）：Q2 淨利 ＝ 4.62 × 1.01769 ＝ 4.702 億元
    （÷ 營收 12.21 ＝ 淨利率 38.5% ✓ 與法說的 38% 一致）；
    法說 H1 EPS 7.75 × 1.01769 ＝ 7.887 億元 → Q1 淨利 3.185 億元 ÷ 3.44 ＝ 0.9259 億股
