  │      （600×600 有效產能達 300mm 晶圓數倍、降本最高約一成）。
  └ **兩者量級相當，我沒有理由把機率往任一邊推。** 機率是使用者的判斷，本次未動。
  ｜⚠ **另一件本次學到的事，值得單獨記**：促成本次 L2 的報導**從頭到尾沒有提到力成**，
