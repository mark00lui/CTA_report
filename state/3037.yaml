key_variables:
- name: 產地標示司法案範圍
  value: 檢調告知主因為刑法「妨害農工商罪」的產地標示爭議；公司重訊稱範圍為 PCB 因應客戶需求調度產能的認定爭議，非 ABF 載板業務，營運正常、對財務業務無重大影響
  unit: 質性
  tier: 事實
  source: >
    桃園地檢署與調查局於 2026-08-28 同步搜索，帶回 1 位總經理與 1 位副總（公司重訊校正
    媒體先前報導的人數）；另有報導稱 PCB 事業處總經理以 1,500 萬元交保、副總以 1,200 萬元交保。
    公司重訊明確否認做假帳、內線交易與「觸怒美方地緣政治紅線」，稱均為誤傳。
    美系外資表示本案不影響 ABF 載板業務，僅涉含 HDI 的 PCB 產品（占營收約 36%）。
    ⚠ 市場的判讀與公司說法不一致：8/28 股價自盤中新高 1,230 急殺收 1,110（-70），
    8/31 開盤即鎖跌停 999 元（-10%），約 9,000 萬至 1.19 億股的賣單排隊未成交，跌破千元。
    但同日 8/28 外資逆勢買超 367.3 萬股 —— 外資與散戶對本案的判讀相反，這個分歧本身是資訊。
    ⚠ 本格刻意不寫進 thesis：公司與外資都稱限於 36% 的 PCB 段，把三天前的事件當成論點
    會過度加權；但它是第一條 falsifier，且是本檔目前最可能改變一切的單一變數。
  updated: 2026-08-31
- name: ABF載板營收占比與成長
  value: 52
  unit: '%（2026 Q2 占總營收）'
  tier: 事實
  source: >
    2026 Q2 ABF 載板營收占總營收 52%、YoY +51%。這是本檔的價值來源，也是產地標示案
    **未涉及**的那一段。法說稱 Blackwell 訂單塞爆、ABF 缺貨到後年。
  updated: 2026-08-31
- name: 毛利率
  value: 24.8
  unit: '%（2026 Q2）'
  tier: 事實
  source: >
    2026 Q2 24.8%，較 Q1 的 17.96% 跳升 6.8pp —— 這是漲價流入損益的直接證據，
    比營收成長更能量測漲價循環的強度。對照 EPS：Q1 3.28 元、Q2 8.45 元（季增 157.62%，
    創新高），H1 合計 11.7 元；近四季 EPS 15.02 元。
    ⚠ 毛利率是本檔最重要的單一追蹤指標：供給受限下需求上修先反映在價格不在量，
    看營收成長率會低估傳導強度。
  updated: 2026-08-31
- name: 月營收
  value: 162.54
  unit: 億元新台幣（2026-07）
  tier: 事實
  source: >
    2026-07 月營收 162.54 億元，YoY +43.69%、MoM +9.11%，創歷史新高；
    1-7 月累計 965.90 億元、YoY +30.76%。2026-06 為 148.97 億元、YoY +36.31%。
    Q1 營收 374.46 億元、Q2 428.89 億元（QoQ +14.5%、YoY +32%，10 季新高），H1 合計 803.36 億元。
    ⚠ 8 月營收（9/10 前公布）是產地標示案發生後的第一個月度數據，也是第一個可觀測的
    影響證據 —— 但 8/28 才發生，當月只涵蓋 3 個工作日，實質檢驗要等 9 月營收。
  updated: 2026-08-31
- name: 資本支出與自由現金流
  value: 537
  unit: 億元新台幣（2026 全年 capex 計畫）
  tier: 事實
  source: >
    董事會核准 2026 資本支出自原訂 340 億元上修至 537 億元（+197 億），逾 80% 投入 ABF 擴產。
    ⚠ capex ÷ 年化營收（1-7 月 965.90 億年化約 1,656 億）= **32.4%**，
    遠超過 references/valuation.md 所訂「必須做現金流分析」的 15% 門檻。
    現況：2026 Q2 自由現金流 +14.20 億元 —— 為正但相對 537 億的年度計畫極薄。
    ⚠ 壓力在前方不在後方：capex 自 340 上修至 537 是本季才決定的，Q2 的 FCF 尚未反映它。
    ⚠ 已在外部籌資：自 2025 年起透過發債與增資募得 93.76 億元，含每股 116 元的溢價增資
    與 40 億元可轉債。一家帳上有現金的公司選擇外部籌資，本身就是規模的訊號 —— 與 GOOG
    2026 年發股籌資的判讀同構。
  updated: 2026-08-31
- name: ABF供需與漲價幅度
  value: 15-20
  unit: '%（2026 年 ABF 載板漲價幅度預估）'
  tier: 推論
  source: >
    2026 年 ABF 載板漲價幅度預估 15–20%，公司採滾動式調漲策略。
    上游 T-glass 材料嚴重缺貨，日本供應商新廠預計 2027–2028 才投產。
    法人預估 2027 年全球 ABF 載板供給缺口約 12%，產業可能再進入漲價循環。
    ⚠ tier 標推論而非事實：漲價幅度與供給缺口皆為法人／產業預估，非公司揭露。
    ⚠ 這一格與「資本支出」是同一枚硬幣的兩面 —— 缺口造就漲價，漲價引來擴產，
    擴產填補缺口。thesis 問的就是這個循環的時序。
  updated: 2026-08-31
