driver_refs:
- driver: ai-accelerator-demand
  direction: '+'
  note: >
    加速器出貨 → HBM 與伺服器 DRAM 需求 → 記憶體封測量能。領先 2–3 季。
    ⚠ **傳導性質與 MU／SNDK 完全不同，這是本檔最重要的一條註記**：
    MU／SNDK 賺的是**記憶體價格**，本檔賺的是**封測服務費，按顆計價**。
    記憶體漲價對 MU／SNDK 是營收，對本檔的客戶是成本 —— 漲價本身進不了本檔的損益。
    本檔受惠的是**量**：記憶體廠產能滿載 → 封測需求增。
    因此該 driver 上修時，MU／SNDK 的反應應先出現在合約價與毛利率，
    本檔則應先出現在**產能利用率與月營收**。
    ⚠ 反向風險：若記憶體漲價的機制是**減產挺價**而非需求成長，對 MU／SNDK 是利多、
    對本檔是**利空**（量減）。方向可能相反，扇出時必須分開判。
- driver: accelerator-roadmap
  direction: '+'
  note: >
    先進封裝規格世代 → FOPLP 與 DDR5 TSV 的導入時點。領先 3–4 季。
    公司目標 2027 年中前成為全球第一家量產面板級扇出型封裝 AI 應用的專業封測廠；
    DDR5 的 TSV 互連已完成試產、2026 Q4 量產，為 HBM 技術累積基礎。
    ⚠ 本檔與 TSM 在先進封裝上是**不同層級**：TSM 做的是 CoWoS 等晶圓級先進封裝，
    本檔是專業封測廠（OSAT）的面板級與記憶體封裝。兩者不直接競爭。
