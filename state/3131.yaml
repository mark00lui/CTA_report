driver_refs:
- driver: hyperscaler-capex
  direction: '+'
  note: >
    CSP 資本支出 → 晶圓代工與封測的先進封裝擴產 → **濕製程設備**（清洗、電鍍、顯影）需求。
    一手佐證：法說自述「**前三大客戶集中於半導體先進封裝領域，涵蓋晶圓代工、封測代工
    及 HBM 客戶**」；2026-05-26 法說稱「**產能滿載，啟動大舉擴產**」。
    ⚠⚠ **本檔在本 driver 上的位置與本清單其餘標的都不同，扇出時最容易算錯的就是這一點**：
    **設備商的營收是客戶「資本支出」的導數，不是客戶「營收」的導數。**
    **客戶的營收成長 10% 不會讓設備商成長 10%；客戶決定擴產才會 ——
    而擴產是階梯狀的決策，不是連續函數。**
    **這使本檔的營收天生塊狀且循環放大（月增率在 2026 年介於 -47.71% 到 +25.65% 之間）。**
    ⚠ **時滯也因此比其餘硬體標的長**：capex 承諾 → 擴產決策 → 設備招標 → 交機驗收 → 認列。
- driver: accelerator-roadmap
  direction: '+'
  note: >
    先進封裝的世代（2.5D CoWoS → 3D 堆疊與混合鍵合）→ 濕製程設備的規格與單價。
    ⚠⚠ **這是本檔 thesis 的另一半，而它有一個明確的時點**：
    **管理層稱「預期 2027 至 2028 年 3D 設備的營收佔比將顯著提升，
    且因 3D 設備毛利率高出 2.5D 許多，其比重提升將極大助益於整體毛利率的改善」。**
    ⚠ **亦即本 driver 對本檔的作用點在毛利率而不在營收，而且要等 18–30 個月。**
    **扇出時若把世代推進直接當成當期利多，會把一個 2027–2028 的事情算進 2026。**
- driver: ai-accelerator-demand
  direction: '+'
  note: >
    加速器出貨 → HBM 與先進封裝的產能需求 → 客戶擴產 → 設備訂單。
    ⚠ **敏感度記「中」而非「高」，理由與 hyperscaler-capex 那條相同**：
    **本檔吃的是客戶的擴產決策而不是客戶的出貨量，兩者之間隔著一個階梯狀的決策。**
    ⚠ **且本檔的客戶橫跨晶圓代工、封測、HBM 三類 —— 三者的擴產週期並不同步，
    這對本檔既是分散也是雜訊來源：任何一類擴產都能撐住訂單，但也讓月營收更難讀。**

