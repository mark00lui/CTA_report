# 公開研究檔 — 本倉庫不含任何倉位資訊：無成本、無數量、無權重、無 Kelly、無損益、無持倉揭露。
# 未知值一律留 __ 並寫進 gaps，不要填看起來合理的數字。
#
# ⚠⚠ 建檔當下最重要的四件事，寫在最前面：
#   (1) ⚠⚠ **本檔與昨日建檔的 3131 弘塑同屬 `semi_equipment`，同一個季度、毛利率方向相反 ——
#       而兩檔的管理層給的解釋是同一個：專案組合。**
#       **3131：Q1 淨利率約 29.5% → Q2 約 18.9%（掉 10.6pp），而營收季增 +8.1%。**
#       **本檔：Q1 約 23.4% → Q2 約 35.6%（升 12.2pp），而營收季增 +66.7%。**
#       **兩檔合起來證明的事比任何一檔單獨說的都強：這個族群的單季利潤率不可外推。**
#   (2) ⚠⚠ **本檔是本輪十四檔中第一檔「均線兩端都過關」的標的**：
#       **季線距現價 -14.67%（< ±20%），而比值為 2.03 倍日振幅（7.22%）——
#       第一次同時滿足「不太遠」與「不太近」，且價格在季線之上，invalidation 首次填得出來。**
#   (3) ⚠⚠ **管理層給了一個罕見地具體的東西：訂單能見度直達 2027 年 Q2。**
#       **那是三個季度，而現價的本益比是 71.80 倍。**
#   (4) ⚠ **建檔時攔下一個錯誤的二手數字**：某來源載 H1 2026 EPS 累計成長率 +9.82%，
#       **但法說載 +53.7%，而由 Q1 2025 的 3.58 元與 Q2 2025 的 4.16 元推算的結果是 +53.7% ——
#       兩路一致，故判定 +9.82% 為錯誤，不採用。**
