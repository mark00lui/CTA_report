  H2 的非 IT 須達約 55.7 億元，佔 H2 營收（約 80 億元）的約 70%。**
  **「全年破五成」隱含的是下半年要衝到七成 —— 那不是一個溫和的假設，
  而第一條 falsifier 的 40% 門檻正是這條路徑上的最低中途檢查點。**
  ⚠ **但要公平地說：管理層把 Q2 的問題指名為「BBU 某一機種客戶拉貨低於預期」，
  而由單一機種主導的業務本來就會這樣跳 —— 一個機種放量就能跳一大截。**
  **「有可能」與「有可能落空」同時成立，這正是 thesis 該問的形狀。**
  ｜⚠⚠ **「A7 土地潛值逾百億」超過整個帳面淨值（約 89.6 億元），也接近市值的兩成。**
