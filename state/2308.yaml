- date: 2026-09-11
  level: L3
  summary: 台股基準年修正第一檔 — ⚠⚠⚠ base EPS 51 對應不到任何一個真實會計年度（由資料商 forward PE 反推），基準年自「不明」改為 FY2027 共識中位 59.00；thesis 裡的「已被 forward 35x 定價」已證偽，重寫；加權目標價 1,374 → 1,654（+20.4%），上檔空間 -23.5% → +2.1%
  delta: >
    ⚠⚠⚠ **起因是使用者指出台股估值缺少 FY+1／FY+2 遠期共識會系統性低估成長股。
    查證後本檔的病因比預期嚴重：base EPS 51 不是一個保守的估計，它對應不到任何會計年度。**
    **它是資料商 forward PE 的反推值（1,620 ÷ 31.84 ＝ 50.88），而同一個資料商自己的預估頁
    寫 FY2026 EPS 40.65。同一家的兩個頁面互相矛盾，而 state 取用了不可驗證的那一個。**
    ⚠ **同日實測光寶科 2301 有同樣問題**（forward PE 23.35 反推 11.86，預估頁寫 FY2026 10.75）；
    **而美股 INTU 的 forward PE 12.93 反推 24.18 與其預估頁完全相同 ——
    這個不一致在本資料商上是台股特有的。機制未確認（NTM 混合年度的推論試算為 54.41，仍不等），列缺口。**
    ｜**取得通道實測（完整方法已寫入 references/forward-estimates.md）**：
    **鉅亨網的 Factset 速報新聞是唯一取得 FY+1～FY+3 中位／平均／高／低齊全的免費通道 ——
    cnyes 的「預估」分頁是 JS 渲染取不到，但同樣資料被發成新聞，而新聞抓得到。**
    **本檔（2026-05-02，23 位）：FY2026 中位 39.3（高 44.8／低 32.21）、
    FY2027 中位 **59.00**（高 **80.91**／低 **41.08**）、FY2028 中位 93.30（高 151.63／低 83.30）。**
    ⚠ 速報分 EPS 型與目標價型，後者只有目標價與評級分布。MarketScreener 憑代號猜 URL 會取到別家公司。
    ｜⚠⚠⚠ **現價 1,620 對各年度的隱含倍數，這是 thesis 被證偽的直接證據**：
    **TTM 51.6x／FY2026 41.2x／**FY2027 27.5x**／FY2028 17.4x。**
    **thesis 寫「占比約四成已被 forward 35x 定價」—— 而市場付的是 FY2027 的 27.5x。**
    **一家 FY2027 共識成長 +50.1% 的公司被給 27.5x，那個倍數不要求營益率跳升才划算，它只要求共識兌現。**
    **舊 thesis 的結構是「市場已經付了 AI 占比，我們要賺營益率」；而市場沒有付那麼多 ——
    賠率結構改變，不是數字改變。→ L3，thesis 重寫為「爭點是 FY2027 共識的 1.97 倍離散度
    會收斂到哪一端，而 800VDC 在 2027Q2 的放量時點決定它」。**
    **800VDC 作為機制未被推翻，改的是它在論點裡的位置：從「超額報酬來源」變成「共識收斂的觸發器」。**
    ｜⚠⚠⚠ **本輪最重要的方法發現：基準年是成長股估值的單一最重要參數，超過倍數與機率。**
    **基準年換一年 ＝ +50.1%（FY26→27）／+58.1%（FY27→28），
    而舊三情境的 EPS 42／51／58 彼此只差 ±14% ——
    情境離散度比基準年的一格小三到四倍，所以基準年錯了是三情境一起錯，不是錯一格。** 已回填 valuation.md。
    ｜**三情境改建**：**EPS 改為直接取 FactSet FY2027 分布的低／中位／高（41.08／59.00／80.91，
    全距 1.97 倍），不再由分析者設定 —— 舊值的自設離散度只有真實離散度的七分之一。**
    **倍數：bear 23x ＝ 2301 的 FY2027 觀測倍數 22.97x（AI 溢價消失）；
    base 30x ＝ 2301 的 FY2027 觀測倍數 × 2308 在 FY2026 觀測到的溢價 1.310 ＝ 30.08x ——
    兩個乘數都是觀測值不是判斷值，且比 2308 自己的 FY2027 現價隱含 27.46x 高 9.3%（獨立意見的幅度）。**
    ⚠⚠ **bull 維持 30x 不給擴張，而這是證據的限制不是判斷**：30x 以上沒有任何 FY2027 觀測錨
    （VRT 的 FY2027 取不到、6412 覆蓋太薄）。**代價：若重評價同時發生在倍數上，bull 被低估。**
    **且這同時是全距控制 —— 若 bull 改用 2308 自己的 FY2026 觀測倍數 41.22x，
    全距會變成 3.53 倍，超過「≥3 倍則算術平均嚴重偏移」的門檻（同 3211 的問題）。
    現在是 2.57 倍，在門檻之內。→ 當 EPS 的離散度已由共識分布提供時，倍數的情境化要節制。**
    ｜⚠⚠⚠ **機率 0.30／0.50／0.20 一個字未動，但它的語意變了，這件事必須單獨講**：
    **機率原本掛在敘事情境上，現在掛在共識分布的百分位上 —— 0.30 的 bear 現在的意思是
    「最悲觀的那一位分析師有三成機率對」。那不是同一個陳述，應由使用者確認。**
    **內部一致性檢查：機率加權 EPS ＝ 58.01，對共識中位 59.00 為 -1.7%、對平均 60.06 為 -3.4%
    —— 加權本身只有輕微偏保守，沒有因語意改變而引入大偏差。**
    ｜**四條獨立交叉驗證使 FY2027 的 59.00 可信**：元大中信 57.7、凱基 60.7、美系 65.1
    （三家中位 60.7，差 +2.9%）；**第四條不經過任何共識 —— 用 2026-07-16 的季度路徑
    （H1 實際 3,426.09 億、Q3 +15% QoQ、Q4 +8% QoQ）回推 FY2026 營收 7,809.6 億，
    對 S&P 共識 7,779.8 億差 +0.38%。**
    ⚠ **限制：FactSet 那張表是 2026-05-02 的，已過期四個月**，其後歐系外資曾上修 FY2027／FY2028
    達 5~6% → **59.00 偏保守，偏差方向已知。**
    ｜**錨定價 1,795 → 1,620（-9.75%，舊錨價高於實際收盤 10.8%）** ——
    ⚠ **2026-09-11 的統一重錨只做了 15 檔美股，24 檔台股尚未重錨，本檔是第一檔；
    其餘 23 檔的錨齡問題仍使跨標的上檔空間不可比。**
    **beta 首次取得 1.50，但台幣無風險利率的通道實測失敗（cnyes 的 TW10YY 回傳 1.91% 但日期是
    2024-09-10，兩年前）→ 錨 C 仍做不出來，而這是 24 檔台股共通的缺口。**
    ｜**技術位階需要兩套均線慣例一起看**：價格 1,620 低於 MA20／MA60／MA120／50DMA，
    只高於 MA240（+9.2%）與 200DMA（+1.5%）。
    **台股慣用 MA20 < MA60 < MA120 是短中期空頭排列；美式 50DMA > 200DMA 達 +11.5% 仍為多頭 ——
    兩者不衝突，測的是不同期間。不可只引一對就說「排列未破」。**
    **壓力帶 1,780–1,912，最後防線 1,482–1,595，而 200DMA 距現價只有 1.5%。評級維持中性。**
    ｜**conviction 維持低，關掉四個缺口但剩下的是結構性的**：
    **錨 A（自身歷史 forward PE 分位，原列第一優先）、錨 B（FY2027 族群中位數，只有一個可用同業
    不足三個）、錨 C（台幣無風險利率取不到）三個都不成立 ——
    本檔實質上只有「單一同業 × 觀測溢價」這一個建構。**
    ｜**新增第五條否證點，它是本檔唯一每月可驗收的**：**2026 年 9–12 月出現連續兩個月營收
    YoY 低於 +30%**（共識隱含 H2 2026 需 +39.6%，月均 725.6 億）。
    **既有四條全部要等季報或法說，而台股有法定月營收、頻率是季報的 3 倍 ——
    這是台股相對美股的優勢，而本檔此前沒有用到它。**
    ⚠ **但驗收能力目前受限於資料完整性**：2026 年 5、6、7 月的逐月數至今未取得。
    ｜**key_variables 新增「FY2027共識EPS與離散度」，取代從未填過的「非AI業務營收成長」
    （已移入 gaps，同 2026-08-27 對「AI功能貨幣化證據」的處置）。**
    **列為 key_variable 而非單一數字的理由：共識的上修速度本身是變數 ——
    本檔 FY2026 的 FactSet 中位數在 2026 年內自 22 升到 39.3（+78.6%）。**
    ｜**與街頭的距離**：FactSet 共識目標價中位 2,565 → 本模型 -35.5%；S&P 平均 2,474 → -33.1%
    （舊模型 -44.5%）。**目標價全距 (4,120−1,330)÷1,330 ＝ 209.8%，覆蓋清單目前最寬 ——
    共識對方向幾乎一致（20 樂觀：0 中立：1 保守）但對幅度極度分裂。✅ 關掉「錨寬度未取得」缺口。**
    報告：reports/2026/09/2026-09-11-2308-revaluation.md
- date: 2026-09-10
  level: L2
  summary: 三情境首次建立，加權目標價 __ → 1,374（相對現價 1,795 為 -23.5%）；評級中性（＝尚無估值判斷）→ 偏空。全清單重估第 1 檔
  delta: >
    報告：reports/2026/09/2026-09-10-2308-revaluation.md
    ⚠ **本檔的重估與 Google／黑石消息無直接關係** —— 該消息只是本輪全清單重估的觸發時機。
    它對本檔的傳導在 hyperscaler-capex 扇出中判為 L0（單一 JV 5B／500MW 對照合計 745B
    不足千分之七），**本次重估未改變那個判斷**。
    ✅ **建檔當日的最大阻塞已解除，但解除方式與預期不同**：`AI相關營收占比` 當時記為
    「三個互不相容的數字（40%／逾 25%／逾 50%）」，**那是錯的判讀** ——
    它們是**三層同心圓**：**AI 相關 40% ＝ AI 產品 >25% ＋ 液冷 >12%**，缺的那塊是液冷。
    ⚠ **教訓**：本倉庫記過「兩個數字剛好對得上不代表是同一個東西」；**這次是反過來——
    兩個數字對不上，卻是同一個東西的不同切法。** 衝突時「口徑不同」要和「有人記錯」一起查。
    ⚠⚠ **由此帶出一個對 3324 比本檔自身估值更重要的發現**：
    **台達電的液冷產品已占其營收逾 12%，約 890 億元，大於 3324 雙鴻的全年營收（年化約 400 億）。**
    今早 coverage.yaml 寫「兩檔驅動變數不同、是同機櫃的互補件」**不完整——在液冷這一段是直接競爭**。
    已修正 correlation_watch，並列為 3324 重估的必要輸入。
    ✅ **選擇權拆分（主錨）首次做出來**，因為補上了光寶科 2301 的倍數（forward 23.35x／
    EV-Sales 3.37x），族群自一點變三點（2308 35.17／2301 23.35／VRT 33.55，中位數 33.55）。
    以 FY2026E 營收 7,400 億、AI 相關 40%、EV 4.548 兆計：非 AI 若以 2301 的 3.37x 計價，
    **AI 殘值隱含 10.31x EV/Sales（對 VRT 8.84x 溢價 16.6%）**；若以 4.5x 計價（反映台達毛利率
    35.64% 高於光寶 24.08%），**AI 隱含 8.61x（大致合理）**。
    ⚠ **拆分給的是區間不是單一答案，且情境 B 較可信——故它偏向「AI 那塊大致合理定價」，
    與序位法的「整體偏貴」幅度不同。兩者並列不掩蓋。**
    **三情境**（基準年 FY2027）：bear 0.30／42×22x=924；base 0.50／51×28x=1,428；
    bull 0.20／58×33x=1,914。**加權 1,374，相對現價 1,795 為 -23.5%。**
