  記憶體漲價對 MU／SNDK 是營收，對本檔的客戶是成本 —— 漲價本身進不了本檔的損益。
  本檔受惠的是量：記憶體廠產能滿載 → 封測需求增。
  ｜⚠ 由此導出一個方向可能相反的情形，已寫入 driver_refs：
