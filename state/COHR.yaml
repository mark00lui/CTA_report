    營運現金流的崩潰是收現能力，不一定停得下來。**
    **第一條 falsifier 測的是兩者的差（自由現金流），所以它無法區分
    「管理層照計畫花錢」與「收現能力壞掉」—— 本條把後者單獨拉出來測。**
    ⚠ **為什麼門檻是 6%**：**它約為 FY2025 的 10.91% 與 FY2026 的 1.12% 的中點，
    代表現金轉換率回復一半以上。**
    **若到 FY2027 上半年仍在 6% 以下，管理層「庫存與應收」的解釋就不成立 ——
    而 base 的 33 倍是一個盈餘倍數，那時它就是在為一個收不到現金的盈餘付錢。**
    ⚠ **與既有四條的差別**：既有四條測需求（營收成長）、毛利率、產品時程與產能；
    **本條第一次單獨測「盈餘變成現金的效率」。**
    ⚠ **驗收時需要的輔助資料（目前是本檔最高優先的缺口）：庫存天數與應收天數的序列 ——
    沒有它無法判斷崩潰是可逆的時間差還是結構性的收現惡化。**
