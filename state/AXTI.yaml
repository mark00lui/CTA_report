- date: 2026-09-11
  level: L2
  summary: 手動全量重估（建檔後首次）— 執行 3081 指定的動作（聯亞光電已與住友電工簽五年期 InP 供貨合約，而住友正是本檔 peers 裡的「實際在位者」），並發現建檔時記的產能口徑缺口是決定性的；首次建立三情境，加權目標價 49.0 美元（相對 2026-09-10 收盤 64.70 為 -24.3%）
  delta: >
    ⚠⚠⚠ **本次最重要的產出是一個不依賴我任何參數的排除論證，
    它把建檔時記的那個口徑缺口從「未確認」升級為「決定性」。**
    **一致預估的 FY2027 EPS 2.23 美元 × 在外股數約 66M ＝ 隱含淨利約 1.472 億美元。**
    **若「1.3 億美元季產能」是基板合計讀法，FY2027 滿載營收 ≈ (60＋130)÷2×4 ＝ 3.80 億
    → 需要 38.7% 的稅後淨利率，而本檔毛利率只有 45% —— 算術上不可能
    （全部營業費用加稅只能佔營收 6.3 個百分點）。→ 一致預估用的不是基板合計讀法。**
    **若是 InP 單項讀法，總產能 ＝ 130 × (47.6÷30.7) ＝ 2.02 億／季 → FY2027 ≈ 5.88 億
    → 隱含淨利率 25.0%，在 45% 毛利率下完全可行。**
    ⚠⚠ **誠實標明性質**：**排除的那一半是乾淨的（只用一致預估的 EPS、股數與本檔自己的毛利率）；
    成立的那一半用了我推算的產品組合，是一致的假說不是證明。**
    **兩個讀法的 FY2027 營收差 55%，並造成 bear 14 對 bull 94 這個本輪最寬的情境區間（6.7 倍）。**
    ｜⚠⚠⚠ **執行 3081 指定的動作，而它是一個具體的、有日期的競爭失分**：
    **聯亞光電 3081 於 2026-04 與住友電工簽訂五年期 InP 基板長期供貨合約，鎖定 2026–2030 ——
    而住友電工正是本檔 peers 裡列的「InP 基板的實際在位者」。**
    **一家明確的下游客戶（聯亞是 InP 磊晶片廠，買基板做 CW 雷射）把五年供應鎖給了在位者。**
    ⚠⚠ **它對 thesis 的意義**：**現行 thesis 是供給側與成本側的爭點；
    住友那件事加進來的是一條需求側的失效路徑 —— 產能蓋出來之後客戶可能已被鎖走。
    而本檔的 check 指標正好在量它：合約鎖定覆蓋率 36.7%，亦即 63.3% 的目標產能還沒有客戶。**
    **已把 check 指標門檻化為第五條 falsifier（2027-08-31 前未升過 60%）。**
    ⚠ **但同時記下相反方向的事實**：**3081 自己的法說說全球約 75% 的模組產能在中國，
    而 3081 是台廠、本檔產能在中國 —— 「聯亞選住友」可能是在位者贏了，
    也可能是台廠的地緣偏好。分辨它們需要本檔 InP 客戶的地理分布，已列 gaps。**
    ⚠⚠ **並公平記下：3081 的法說仍證實需求端的前提（「InP 4 吋以上大基板是隱形瓶頸」）——
    瓶頸是真的；住友那件事改變的是「誰吃到這個瓶頸的租」。**
    ｜⚠⚠ **改正建檔時 key_ma 的兩個錯數字**：原記「50DMA 45.76／200DMA 17.75」，
    **正確值是 50 日均線 62.70、200 日均線 55.49（2026-09-11 的 CTA 評估已查出，
    但 key_ma 的文字沒改，本次一併改掉）。**
    **45.76 對 62.70 差 37%、17.75 對 55.49 差 213% —— 那不是價格波動，是抓錯了數字。**
    ｜**同業序位：依三步判準，本檔只能用絕對值比。**
    **本檔的隱含 ROE 僅 0.51%（EPS 0.07 ÷ 每股淨值 13.77）→ 本益比 924 是假象；
    而 3081 那一輪建立的補充規則在這裡命中 —— PB ÷ 每點 ROE 的分母也是 ROE，
    對盈餘趨零的標的同樣失效（本檔算出 9.2，只是分母趨零的產物）。**
    ⚠⚠ **絕對值的結果本身就是結論**：**股價淨值比 4.70 是可用同業中最低的（全新 2455 為 26.94）；
    市營比 33.09 是可用同業中最高的（全新 24.12、WOLF 2.00、IQE 0.69）。**
    **「PB 最低而 PS 最高」＝ 市場給的是營收的未來不是資產的現值；
    而 PB 之所以低是因為 6.325 億美元募資剛把淨值撐大 —— 那個便宜是分母膨脹的產物。**
    ⚠ **同業只有一個可用成員（全新 2455）—— 依 3081 的規則需至少三個，
    本方法只能定方向不能定刻度。**
    ｜**三情境（基準年 FY2027，exit_multiple 記的是 EV/Sales 而非本益比，
    由「exit PE × 稅後淨利率」導出 —— AAOI 那一輪建立的橋）**：
    **bear 0.25：基板合計讀法 ＋ 客戶沒跟上 → 營收 2.80 億、EV/Sales 2.25（貼著 Wolfspeed 的 2.00）
    → 14（-78.4%）。⚠⚠⚠ exit PE 25 倍沒有任何同業錨，依 valuation.md 明寫「無獨立估值基礎」。
    ⚠⚠ 並記 bear 特有的結構：14 美元裡有 4.51 美元（32%）是淨現金，營運本身只值 9.49 美元 ——
    本檔有一個實質的現金地板，這在本輪是少見的。**
    **base 0.50：取兩讀法之間偏保守 → 營收 4.20 億、EV/Sales 6.30 → 44（-32.0%）。
    ⚠ 現價隱含 9.14x，取 6.30x 是下調 31.1%；三個具名理由為口徑未確認本身該折價、
    需求側的新證據（住友五年約）、以及 18% 稅後淨利率已是大幅改善的假設（現值 3.23%）。**
    **bull 0.25：InP 單項讀法 ＋ 產能滿載 → 營收 5.88 億、EV/Sales 10.00 → 94（+45.3%）。
    ⚠ 外部檢查：分析師目標價均值 91.6 美元（5 位）—— 我的 bull 高 2.6%，
    亦即最樂觀情境約等於市場的中性預期（對照 AAOI 的 bull 比街上均值低 17%）。**
    **加權 ＝ 3.5 ＋ 22 ＋ 23.5 ＝ 49.0（-24.3%）。機械加權，無人工調整。**
    ｜⚠⚠⚠ **穩健性檢查揭露了本檔與 3081 的關鍵差別**：
    **機率改 0.2／0.5／0.3 → -15.3%；base 營收改用 InP 讀法 → **-5.1%**；
    再把倍數放回現價隱含的 9.14x → **+22.1%**。**
    **亦即結論為負對倍數與機率都不特別敏感，但對「口徑」極度敏感 ——
    本檔的方向判斷幾乎完全取決於一個我沒有確認的事實，不是取決於我的判斷。**
    ｜**評級維持中性／信心低，而「為什麼不是偏空」本身是本次的一個方法論結論**：
    **-24.3% 幾乎完全來自事實性的口徑歧異，不是方向判斷 ——
    一個可以靠一頁簡報解決的問題不該被寫成方向性的評級。**
    ⚠⚠ **對照 3081：那一檔的 -21.6% 對所有倍數假設都穩健，只有「把 base 設成現價隱含值」
    能翻轉它，所以給偏空。兩者的數字接近而處置不同，理由是不確定性的性質不同 ——
    這應回填 references。**
    ｜**技術面：除權息前置檢查無命中（不配息）**，
    ⚠⚠ **但有一個功能相近的東西：股東權益兩季內自 3.3463 億跳到 9.5185 億（+184%，
    主因 6.325 億美元募資）—— 它汙染的不是均線，是所有「每股」的歷史比較。
    這是本輪「每股口徑斷點」的第三種來源（前兩種：AAOI 的股數年增 49.26%、3081 的股票股利）。**
    ⚠⚠ **比值自「算不出來」進展到「算得出一個上界，而上界剛好卡在門檻上」**：
    **取得當日漲跌幅 -6.11% → 比值 ＝ 14.23% ÷ 6.11% ＝ 2.33 倍；
    但當日漲跌幅是振幅的下界，所以 2.33 是比值的上界 —— 真實比值 ≤ 2.33，而門檻是 2。
    失效價位維持留空。結論沒變，理由精確了一級。**
    ⚠ **順帶解掉一個帳面價值的不一致**：**每股淨值 13.77 × 64.20M ＝ 8.84 億（母公司），
    而建檔時記的股東權益 9.5185 億含非控制權益 —— 差 0.678 億美元，
    與同美那筆中國 PE（人民幣 3.244 億元贖回權，約 0.45 億美元）的量級一致。
    不是矛盾，是兩個口徑；而第四條 falsifier 測的正是那一塊。**
    ｜**象限 Q4 維持，依已發生數**（capex／營收 TTM 10.99%、FY2025 6.79%、FY2024 5.81%）。
    ⚠ **但那一題仍是每輪必問的第一題：6.325 億美元募資 ÷ FY2026 共識營收 2.1798 億 ＝ 290%，
    若在一至兩年內支出，capex／營收 必然越過 15% 而象限遷入 Q3。**
    ｜⚠ **本次未做到**：**產能口徑（最高優先，第二次未關閉）**；FY2027 一致預估營收；
    **本檔 InP 客戶的地理分布**；日內高低價與其餘四條均線；20 日平均振幅；
    全新 2455 的 forward 倍數；**每加速器的光埠數 × 每埠的 InP 面積（自建檔起仍未取得，
    `ai-accelerator-demand` 對本檔的敏感度仍然無法量化）。**
    報告：reports/2026/09/2026-09-11-AXTI-revaluation.md
