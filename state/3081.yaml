    key_assumption: "⚠⚠ 機制為本次新增，比建檔時的「毛利率下滑」更具體：產能只到 1.6 倍而非 2.5 倍 —— 受前端 MOCVD 僅 +25–30% 的限制。FY2027 營收 100 億元（8 月營收年化 62.4 億元 × 1.6）；毛利率自 57.45% 回落到 45%（擴產初期稼動率 ＋ 折舊自 7.8% 升向管理層自訂上限 8–12%），稅後淨利率 24%。淨利 24.0 億元 ÷ 1.01769 億股 ＝ EPS 23.6。"
    eps: 24.04
    exit_multiple: 25
    multiple_basis: "⚠⚠⚠ **本項沒有任何同業錨，必須明寫**：唯一的台股同業全新 2455 的本益比是 130.64（本身極端）、IQE 虧損、WOLF 的 303.16 是假象、AXTI 在覆蓋清單內且為上游供應商而禁用 —— **本檔在 bear 情境下完全沒有乾淨的低倍數同業錨。** 25 倍是「成長敘事破掉但仍是高毛利特用材料廠」的概念值。**依 valuation.md，此種情況必須明寫「無獨立估值基礎」並把 signal.conviction 上限壓到低。** ⚠ 本輪實測到的台股半導體倍數全距供讀者自行判斷：京鼎 3413 的 14.04 到創意電子 3443 的 159.57。⚠ 穩健性：本項改為 15 倍使加權降至 2,159（-23.7%）、改為 40 倍使加權升至 2,309（-18.4%）—— **結論為負對 bear 的倍數幾乎不敏感。** ⚠ **2026-09-11（同日第二次）：EPS 自 24 微調為 24.04（同一算式的精確值：62.4 × 1.6 ＝ 99.8 億 × 24.5% ÷ 1.01769 億股），倍數 25x 未動。** ⚠⚠ **1.6 倍未動的理由：它原本就是一個「水準」論證（前端 MOCVD 僅 +25–30% 使 2.5 倍達不到），與本輪新增的「時點」論證（2.5 倍是年底水準）獨立 —— 兩者在 bear 裡疊加是合理的：水準不足 ＋ 年中才貢獻。** ⚠⚠⚠ **但必須記一件對 bear 的挑戰：最保守的券商（外資 FY2027 EPS 28.8）反推的年平均產能只有 1.47 倍，低於本情境的 1.6 倍。亦即 bear 不是最悲觀的情境 —— 街上有人比它更保守。**"
