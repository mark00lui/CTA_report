driver_refs:
- driver: hyperscaler-capex
  direction: '+'
  note: >
    capex → GPU/ASIC 投片 → ABF 載板需求。領先 2–3 季。
    ⚠ 本檔的傳導有一個其他硬體端沒有的性質：ABF 載板目前是**供給受限**，
    需求上修不會立即轉為營收，只會轉為漲價與更長的交期。因此該 driver 上修時，
    本檔的短期反應在**價格**而非**量**上 —— 看營收成長率會低估傳導強度，
    要看毛利率。
- driver: ai-accelerator-demand
  direction: '+'
  note: >
    加速器出貨 → 載板投片。領先 2–3 季。
    ⚠ 方向要看清楚：已認列的加速器營收對本檔是同步偏落後指標（載板要先做出來），
    真正領先的是下一季 guidance 與長約，與 TSM 的註記同構。
- driver: accelerator-roadmap
  direction: '+'
  note: >
    平台節點與封裝規格 → ABF 載板層數、尺寸與良率要求。領先 3–4 季。
    ⚠ 本檔與 TSM 在此條 driver 上是**互補而非替代**：TSM 做的是晶片與 CoWoS，
    本檔做的是承載它的載板。單機櫃功耗與晶片面積上行同時推升兩者的規格要求。
thesis: ABF 漲價循環由 T-glass 缺料與 2027 年約 12% 供給缺口撐起，而解除時點（日本新產能 2027–2028）與自身 537 億擴產的投產時點重疊；爭點是誰先到，不是需求會不會來
