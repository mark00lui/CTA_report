notes: >
  ⚠ **本檔與 3037 欣興是同一個 ABF 漲價循環的兩個曝險，不是分散。** 兩者的差別在純度與槓桿：
  ｜IC 載板占營收：本檔近 90%，3037 的 ABF 為 52%（另有 36% 的 PCB 含 HDI）。
  本檔更純，但也沒有其他業務可緩衝 —— 而 3037 的那 36% 正是其產地標示司法案的範圍，
  這反過來說明「不純」有時是保護。
  ｜稼動率：本檔三廠平均逾 80%，量能尚未滿載，漲價與稼動率可同時上行；
  3037 未取得對等數字。這是本檔理論上的額外槓桿。
  ｜估值極端度：本檔 trailing 本益比 145.71x（8/31）／152.81x（9/1 盤中），
  三年區間 7.82–726.25；PB 16.13x，三年區間 1.40–16.39、平均 5.47x，**現況位於頂部**。
  3037 對應為 PE 37.23x、PB 14.0x（三年區間 1.51–14.99、平均 5.5x，同樣接近頂部）。
  **兩檔的 PB 都在自身三年區間的頂部，且平均值幾乎相同（5.47 對 5.5）** ——
  這不是巧合，是同一個循環把兩檔推到同一個位置。
  ｜52 週振幅：本檔 177.50–1,415.00 為 **8.0 倍**，3037 為 129.50–1,230（9.5 倍）。
  兩檔都是清單中振幅最極端的一組，遠超美股任何一檔。
  ｜⚠ 因此判讀覆蓋清單的分散度時，substrate 這一格的 14.3% 應視為
  **「一個循環的兩種寫法」**而非兩個獨立賭注 —— 與 coverage.yaml 對 memory（MU／SNDK）
  的既有警告同構，但本檔這組的同源程度更高：MU 與 SNDK 至少分屬 DRAM 與 NAND，
  本檔與 3037 是同一種產品。
  ｜⚠ 第三次遇到台系載板股的賣方數字過期問題：本檔查到一則 FactSet 速報記 EPS 2.47、
  目標價 131.5，對照 52 週低 177.50 應屬循環谷底期的舊調查。
  前兩次為 3037（2026 共識 18.96 對 H1 實績 11.73）與 3324（公司上修目標而 FactSet 同期下修）。
  **引用台系載板股的賣方數字前必須先確認調查日期**，這已是可預期的失敗模式而非偶發。
  ｜⚠ BT 的漲幅預估（+70%）高於 ABF（+50%），與市場多把注意力放在 ABF 的印象相反。
  原因是供給收縮 —— 亞洲大廠逐步停接 BT 載板訂單。供給側的收縮比需求側的成長更能推升價格，
  這是本檔值得獨立追蹤的一條線索，也是 3037 的檔案裡沒有的角度。
event_log:
- date: 2026-09-11
  level: L2
  summary: 台股基準年修正第三檔 — ⚠⚠⚠ base 的 FY2027 EPS 是單一美系外資的估計（23.78），而同一篇 Factset 速報裡就有共識中位數 42.34（+78%）；每股淨值改用實際值重建；加權目標價 759 → 958（+26.2%），上檔空間 -29.7% → -11.3%
  delta: >
    ⚠⚠⚠ **篩檢 24 檔台股時本檔被判為「base EPS 綁具名年度 ＋ 指名共識來源」的三檔乾淨檔之一
    （另兩檔是 2308 與 3037），而細讀後發現判錯了：它綁的年度是對的（FY2027），綁的不是共識。**
    **證據在 bull 的 multiple_basis 裡，state 自己寫的：「EPS 35.2 為推導值：以 FactSet 2026
    （17.08）對美系外資 2026（11.52）的 1.48 倍比例，外推該外資的 2027（23.78）至 FactSet 口徑」。**
    **亦即 base 的 23.78 是單一美系外資的 FY2027，bull 的 35.2 是把它乘 1.48。**
    **FactSet 的 FY2027 共識（16 位，2026-08-28）：中位 42.34／平均 45.19／高 65.83／低 21.66 ——
    中位數比採用值高 78.0%，而連舊的 bull（35.2）都低於共識中位數 16.9%。**
    ⚠⚠⚠ **這違反 references/forward-estimates.md §7「不得用單一券商的預估當共識」，
    而它被寫進了權重 0.5 的 base。**
    ｜⚠⚠ **但 state 當時已經算出那個數字不合理，這一點要公平記下**：
    **它在 key_variables 寫「若 2026 落在共識上緣 21.80，則 2027 的 23.78 僅隱含 +9.1% 成長」，
    並明寫「2027（基準年）仍無分布（Pro 付費牆），故三情境的 2027 EPS 仍為單一來源」。**
    **它沒錯在判斷 —— 一家在漲價上行段、稼動率還有空間的載板廠不會只成長 9% ——
    錯在不知道鉅亨網的 Factset 速報新聞免費給這張表。**
    **→ 這是 forward-estimates.md 存在理由的最乾淨實例：問題不在分析能力，在通道。**
    ｜**每股淨值同步重建（本檔主錨是 PB，所以 EPS 的修正要先經過淨值）**：
    **2026-06-30 實際 76.24（state 的 PB 16.13x 隱含值 68.8，偏低 9.7%；以實際值重算現況 PB 為 14.16x）**
    **＋ H2'26 EPS 約 10.67 − 2026 除息 2.00 ＝ 2026 年底 84.91；**
    **＋ FY2027 EPS − 2027 除息 6.83 ＝ 2027 年底 93.08／120.42／143.91（原單一值 97.9）。**
    ⚠ 兩個假設要標：H1'26 的 6.41 由 TTM 8.51 扣推估的 H2'25 而得（逐季 EPS 未取得）；
    配發率 40% 是假設，歷史區間由淨值變動反推為 32–66%，**取 40% 偏保守。**
    ｜⚠⚠⚠ **修正後出現一個漂亮的結果：PB 6.0x 不再需要辯護。**
    **state 原本的 Gordon 檢查器（ROE 30%／r 11%／g 5%）給 4.17x，而 base 取 6.0x 需要
    「認列漲價使 ROE 超越常態」這個說法。新的 FY2027 ROE 是 41.2%（原推導 24.3%），
    同一個公式給 6.03x —— 主錨與正交檢查器獨立收斂，誤差 0.5%，而 Gordon 的其他三個參數一個字沒動。**
    ⚠ **但那個收斂建立在 r ＝ 11% 這個未錨定的參數上**：r 12% → 5.17x、r 13% → 4.52x。
    ｜⚠⚠ **bear 的 EPS 維持 15.00，而它刻意低於共識下緣 21.66 達 30.7%，理由有兩個**：
    **(1) 機制具名 —— 賣方共識不模型化循環破裂（亞洲同業恢復接 BT 訂單使供給收縮逆轉），
    它只模型化漲價幅度不如預期；**
    **(2) 更實際的理由是共識下緣本身被汙染了 —— FactSet 的 FY2026 低值 8.56 與已實現數字矛盾
    （TTM 至 2026-06 已是 8.51、H1'26 約 6.41，8.56 等於假設 H2'26 只有 2.15）。那是未更新的舊估計。**
    **→ 通則：共識分布的下緣特別容易被未更新的估計汙染，而在共識快速上修的標的上
    （本檔 FY2026 中位數在 2026 年內自 2.0 升到 17.08）汙染幅度會很大。引用下緣前要做合理性檢查。**
    **→ 規則補一條：共識分布是情境全距的「下限」不是上限，超出它要有具名機制並寫出超出多少。**
    ｜⚠⚠ **錨寬度這個指標本身是供應商相依的，而相依程度大到不能忽略**：
    **FY2026 低值 stockanalysis 16.07 對 FactSet 8.56，高值兩家完全相同（21.80）——
    錨寬度因此是 35.7% 對 154.7%，量測值差 4.3 倍。**
    **本輪改記 FY2027 的錨寬度並指明供應商，且同時報兩種定義（對下緣 204.0%、對中位 104.4%）。**
    ｜⚠⚠⚠ **全距 2,015 ÷ 372 ＝ 5.42 倍，遠超 3 倍門檻 → 算術加權 958 被 bull 尾端拉動，
    幾何加權為 791，兩者差 21.1%。**
    **而這個全距是真實的不是建構假象：EPS 跨 4.39 倍（其中 3.04 倍來自共識自己的分布）、
    自身三年 PB 實際區間 1.40–16.39x，而每股淨值的離散只有 1.55 倍 ——
    PB 框架已經把盈餘分歧抑制過一次，剩下的是真分歧。**
    **→ 本檔的加權目標價是弱摘要統計量；有訊息量的是情境階梯本身，
    而最該讀的一行是「base 723 相對現價 -33.1%」：即使用共識中位數，本檔在 PB 框架下仍偏貴三成。**
    ⚠ **並記一個結構性特徵：隱含 PE 階梯變成非單調（24.8／17.1／30.6）** ——
    因每股淨值是存量、跌得比 EPS 慢。**PB 錨定在循環股上必然如此，而舊的單調階梯
    （24.2／24.7／42.5）掩蓋了它；它的後果是 PB 與 PE 框架會對「哪個情境最便宜」給出不同答案。**
    ｜⚠⚠⚠ **同業序位首次在「同一供應商、同一市場、逐年標註」上建立，關掉 state 原本的方法論弱點**：
    **FY2027 PE —— 本檔 25.51x／3037 28.53x／3189 38.38x，族群中位 28.53x，本檔最便宜。**
    **序位與原記的完全相同（8046 < 3037 < 3189），但水準低 26–33%
    （原記 33.73／38.71／43.03，年度不明）。**
    **→ 這是 8299 那條規則的反面實例：這次序位可用而水準不可用。**
    ⚠⚠ **而一個意外發現推翻了 3037 事先寫定的排序指標：市場的倍數序位是 ABF 曝險度的反序**
    —— 本檔曝險近 90% 卻最便宜（25.51x），3037 的 52% 拿到 28.53x。
    **解釋是市場按成長斜率排（本檔 FY26→27 +147.9% 最陡），而 FY2028 序位相同支持它。**
    **不得事後換掉排序指標；處置是記錄它未能解釋，並立替代假說於下一輪檢驗。**
    ｜**錨定價 1,110 → 1,080（-2.70%）—— 只佔上檔空間改善的 -2.7%，其餘全部來自 EPS 來源修正。
    beta 首次取得 2.08（3037 2.34／3189 1.84）。**
    ⚠ **本輪資料源未提供本檔均線 → 技術位階沿用前值，右側確認本輪無法重新判定。**
    ｜**否證點：第三條門檻自 FY2026 EPS < 11.52 上調至 < 14.00**
    （11.52 要求 H2'26 ≤ 5.11 而 H1'26 約 6.41，即要求下半年衰退 20%，幾乎不可能觸發；
    14.00 要求 H2'26 ≤ 7.59，即 H2 幾乎不成長，有約束力）。
    **新增第五條：FactSet 的 FY2027 共識中位數自 42.34 下修逾 15%（低於 36.00）——
    既有四條沒有一條測「我採用的那個預估有沒有被市場自己推翻」，而本輪已證明這個輸入曾錯 78%。**
    ⚠ 限制寫明：它測的是共識不是公司，觸發時要重新檢查基期而非直接下修目標價。
    ｜**缺口關閉 4 個（FY2027 共識分布、每股淨值、bull EPS 的推導性質、同業倍數的年度歸屬），
    新增 6 個**（台幣無風險利率、逐季 EPS、配發率、共識下緣的合理性、均線、3189 的載板占比）。
    ⚠ **機率 0.25／0.50／0.25 為使用者指定，本輪一個字未動。**
