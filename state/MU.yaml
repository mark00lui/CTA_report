- name: HBM進度
  value: HBM4 已為領先客戶進入高量產，並向多家終端客戶送出認證樣品；HBM4E 開發中，目標 2027 曆年量產。管理層目標為 HBM 市占率接近其 DRAM 市占率
  unit: 質性
  tier: 事實
  source: >
    FQ3 FY2026 法說會準備稿。
    ⚠ 2026-08-31 新增外部佐證（值未變，信心提高 —— 本次定級 L1）：
    NVIDIA 於 2026-08-26 揭露對供應商的採購承諾自三個月前的 119 bn 增至 279 bn，
    CFO Colette Kress 明言增幅 primarily related to the procurement of memory；
    同時 NVIDIA 自身毛利率因記憶體成本自 Q3 的 74% 降至 Q4 觸底的 71–72%，
    Kress 稱記憶體成本 exceeded our prior expectations and are headed even higher into next year。
    這是本檔漲價循環第一個來自**下游客戶財務長**的一手量化證據 ——
    在此之前的佐證是 Meta／Amazon 的 capex 歸因與 TrendForce 的二手引用。
    ⚠ 但 279 bn 中記憶體占多少未揭露（只說 primarily），無法換算為本檔的營收金額，
    故 HBM進度 這一格的**值不變**，僅提高信心。
    ⚠ **2026-08-31 再補，且方向相反的兩件事同時出現**（值仍不變，本次亦為 L1）：
    (+) 記憶體短缺獲得**最強形式的確認** —— NVIDIA 為此**重新設計產品**：Rubin Ultra 的 HBM 配置
        自原本單一的 12-high HBM4E 擴大為 8-high HBM4E／12-high HBM4／8-high HBM4 等備案，
        測試組態低至 192GB。一手報導（Tom's Hardware）明指原因為 as memory shortage bites back。
        客戶願意犧牲規格來遷就供給，比任何價格數據都直接。
    (−) **三星取得 NVIDIA 自訂記憶體 NVHBM 的早期領先**，正開發 8 層 HBM4E，
        NVIDIA 訂的速度規格為 17–18 Gbps。NVHBM 將記憶體控制器移入 HBM base die，
        相對標準 HBM4E 可達 +30% 頻寬、−15% 功耗，首次實作即在 Rubin Ultra（2027 下半）。
        ⚠ 這對本欄記載的「管理層目標為 HBM 市占率接近其 DRAM 市占率」是直接的競爭訊息 ——
        下一代自訂記憶體的首發夥伴不是本檔。
    ⚠ 「早期領先」不等於獨家，SK 海力士與本檔的 NVHBM 進度均未取得，列入 gaps。
    兩個訊號方向相反且都無法量化，故值不變、僅記錄。
