  **本檔成為覆蓋標的後，我對它的判斷會直接移動 COHR 的目標價 —— 那是循環引用。**
  **處置**：兩檔的錨仍各自獨立（COHR 用同業序位、本檔用 EV/Sales 與成長持續期），
  **但每次重估其一時必須檢查另一檔是否連動，並在報告中明寫。**
  ⚠ **而 COHR 檔於 2026-09-10 已明文記著「base 的中點含一半 LITE，這是 base 目前最弱的一環」
  並事先寫定了兩個改錨條件。那些條件現在多了一層意義：它們同時是解除循環引用的路徑。**
  ｜⚠⚠ **建檔當日修正了本倉庫既有的一個錯誤判讀，記在這裡以便日後校準**：
  COHR 檔兩度把本檔描述為「虧損公司」「forward PE 建立在虧轉盈的預估上」
  「虧損公司的高轉換率是算術不是品質」——
  **但本檔 FY2026 的 GAAP 淨損是一次性非現金的債務清償費用，營業利益為 +5.362 億。**
  **把 GAAP 淨損直接讀成營運惡化，是本輪第一次犯，而它影響的是另一檔的 base 錨。**
  **教訓：用一個標的的 GAAP 底線去描述它的營運狀態之前，先看營業利益那一行。**
  ｜⚠ **但有一件事沒有被推翻**：EV/EBITDA **109.46** 是用真實 EBITDA（800.7M）算的，
  **不受該筆費用影響**。**「淨損是假的」與「倍數是貴的」兩件事同時為真。**
  ｜本檔與 COHR 的差別值得先記下來，日後定序位會用到：
  **毛利率 50.4% 對 37.50%（本檔高）；自由現金流 +3.001 億對 -10.2 億（本檔正、COHR 負）；
  EV/Sales 29.08 對 8.57（本檔貴 3.4 倍）。**
  **本檔在營運指標上較佳，在估值上較貴 —— 序位分析要回答的正是這兩者的交換比率。**

event_log:
- date: 2026-09-11
  level: L2
  summary: 手動全量重估（建檔後首次）— 決定了 LITE↔COHR 循環引用的切斷方向（在本檔這一側）、50 與 200 日均線首次取得、FY2027 一致預估取得；首次建立三情境，加權目標價 751 美元（相對 2026-09-10 收盤 935.70 為 -19.7%）。⚠ 並在寫作過程中抓到自己三處錯
  delta: >
    ⚠⚠⚠ **本次抓到自己三處錯，全部是在讀 state 自己的記錄時發現的，三處都寫下來。**
    **(1) 我先推論 GAAP 淨損 -69.4 億美元的成因是可轉債嵌入衍生工具的重評
    （因為 52 週漲 516.69% ＋ 營業利益為正）。而建檔時的 key_variable 已有來源記錄：
    它是「一次性、非現金的債務清償費用」。我的推論不成立，採建檔時的描述。**
    ⚠ **但量級上有張力值得追：費用 6,935M 對償還的長期債務本金 1,377M ＝ 5.0 倍。
    一筆現金償還不會產生 5 倍於本金的費用，除非清償的是可轉換債務且用股份結算
    （股價一年漲 5.17 倍）—— 這一段標明為我的推論並列進 gaps。
    若涉及股份結算，那就是一次已發生的稀釋，股數的歷史序列會有斷點。**
    **(2) 我差點用產品型態拆分（Q4 FY26 的 Components 649.4M ／ Systems 356.9M
    ÷ 單季 1.03B ＝ 63.0% ／ 34.6%）去關閉「分部別營收占比」這個缺口 ——
    而建檔時已明寫它要的是「資料中心／AI vs 工業／電信」的終端市場拆分。**
    ⚠⚠ **規則：關閉缺口前先重讀它的 question 欄位。
    「看起來能關閉缺口的數字」與「缺口要的數字」是兩件事，而兩者形式上都叫「分部占比」。**
    **(3) 我的第一版草稿把 base 設成「管理層的 40 美元打 15% 折 ＝ 34」——
    而建檔時明文禁用「管理層的 40 作為 base 的錨」。**
    ⚠⚠ **打折不等於沒有用它當錨。已改正：base 改為自 FY2027 一致預估（EPS 21.64）
    加上獨立的成長與利潤率假設推導，管理層的說法只出現在 check 與 bull。**
    ｜⚠⚠⚠ **決定了建檔時懸著的循環引用：在本檔這一側切斷。**
    **建檔時的處置是「每次重估其一時必須檢查另一檔是否連動並明寫」—— 那是記著，不是解決。**
    **依 INTC 那一輪整理的三層規則，清單內標的的市場觀測倍數本來可用但須檢查雙向性，
    而 state/COHR.yaml 的三個情境倍數全部掛在 Fabrinet 與本檔的 forward 本益比上 ——
    雙向成立，必須切斷一側。**
    ✓ **處置：本檔不以 COHR 的任何值為錨（含觀測值）；COHR 可繼續用本檔的觀測值。**
    ⚠⚠⚠ **選擇的理由是一條新規則：循環引用要在「替代錨較多的那一側」切斷。**
    **本檔有替代錨（Fabrinet 的 forward 本益比 22.99／EV-EBITDA 26.60／EV-Sales 3.04、
    中際旭創的 forward 市營比 5.54、26 位分析師的 FY2027 一致預估）；
    COHR 若也不能用本檔，它的同層錨就只剩 Fabrinet —— 而 Fabrinet 是代工（毛利率 11.99%）。**
    ⚠⚠ **而切斷有代價，必須一起寫：COHR 是唯一一家「同層、同口徑、非代工」的同業，
    切掉之後本檔在這一類只剩中際旭創一家（A 股、會計與 regime 不同）——
    依 3081 的規則（同業序位需至少三個可用成員），本檔不足，只能定方向不能定刻度。**
    ⚠ **coverage 的 correlation_watch 仍應保留 —— 切斷處理的是估值錨的閉環，
    不是營運的相關性。兩件事不同。**
    ｜⚠⚠ **同口徑的三個比較都指同一個方向（2026-09-10 基準）**：
    **forward 本益比 43.23 對 Fabrinet 22.99（1.88 倍）、中際旭創 17.70（2.44 倍）；
    EV/EBITDA 103.5 對 Fabrinet 26.60（3.89 倍）；
    forward EV-Sales 13.20 對中際旭創 5.54（2.38 倍）。**
    **三個指標、三個不同的分母、兩個不同的同業 —— 結論一致：本檔貴 1.9 到 3.9 倍。**
    **這與 3081 形成對照：那一檔換口徑會使結論反向；本檔在三個指標上都指同一個方向。**
    ⚠ **而辯護的那一半也要寫**：**非 GAAP 毛利率 50.4% 是族群最高。
    粗算：毛利率 50.4% ÷ 11.99% ＝ 4.2 倍而 EV-Sales 27.49 ÷ 3.04 ＝ 9.0 倍 ——
    以毛利率調整後本檔對 Fabrinet 仍貴約 2.1 倍。溢價的一半左右有支撐，另一半沒有。**
    ⚠⚠ **建檔時記的「淨損是假的與倍數是貴的兩件事同時為真」在本次獲得三重確認。**
    ｜**三情境（基準年 FY2028，全部用非 GAAP EPS）**：
    **bear 0.25：營收 +20%、淨利率 26% → EPS 22 × 20 倍 ＝ 440（-53.0%）。
    ⚠ 20 倍略低於 Fabrinet 的 22.99、高於中際旭創的 17.70 ——
    這是本輪少見的「bear 的倍數有乾淨的同業錨」（3081 與 AXTI 都沒有）。**
    **base 0.50：營收 +45%（自 FY2027 的 62.8 億到 91.1 億，成長率腰斬）、
    非 GAAP 淨利率維持 FY2027 的隱含值 30.9% → EPS 31 × 22 倍（＝Fabrinet 的 forward 本益比）
    ＝ 682（-27.1%）。⚠ 現價隱含 30.2 倍，取 22 倍是下調 27.2%。**
    **bull 0.25：直接採管理層的 40 美元 × 30 倍（對 Fabrinet 溢價 30%，理由是 CPO）
    ＝ 1,200（+28.2%）。⚠ 分析師均值 1,148（26 位）—— 我的 bull 高 4.5%。**
    **加權 ＝ 110 ＋ 341 ＋ 300 ＝ 751（-19.7%）。機械加權，無人工調整。**
    ⚠⚠⚠ **而 bull 同時回答了 thesis**：**thesis 問「109x EV/EBITDA 已把管理層的
    2028 年 40 美元定價了多少」—— 答案是 935.70 ÷ 1,200 ＝ **78%**，
    亦即現價已經把 bull 定價了約四分之三。這是本次 check 真正執行的產出。**
    ⚠ **4b**：base -27.1%、加權 -19.7%，遠在 ±5% 之外 → 不觸發；
    且倍數那一格有獨立意見（下調 27.2%）。
    ⚠⚠ **穩健性**：base 倍數改為中際旭創的 17.70 → 666（-28.8%）；
    base 的 EPS 改為管理層的 40 → 850（-9.2%）；
    **兩者同時才翻正為 1,014（+8.4%）—— 而那等於放棄兩個判斷。**
    ｜✓✓ **技術面：50 與 200 日均線首次取得（建檔時完全未取得），位階自「無法完整判定」
    改為「多方，但無可用失效價位」。**
    **50 日 823.92（下方 11.95%）／200 日 695.99（下方 25.62%）。
    200 日距離超過 ±20% 上界；50 日的比值只算得出一個上界 2.22 倍
    （以當日漲跌幅 5.39% 當振幅的下界），卡在門檻 2 上 → 失效價位維持留空。**
    ⚠ **與 AXTI（上界 2.33）完全相同的形態，本輪第二次，兩檔都因同一個資料源
    不提供日內高低價。而兩次的上界都卡在門檻上不是巧合 ——
    ±20% 與 2 倍在「距離 12–15%、日變動 5–6%」這個常見組合下必然落在邊緣。**
    ✓ **但狀態已改變：建檔時是「均線未取得，無法設定」，現在是
    「均線取得了，但兩條都不合格」—— 那是一個更有資訊量的狀態。**
    ⚠⚠⚠ **技術面前置檢查正式執行，而本檔命中庫藏股 —— 本輪第一次。**
    **本檔不配息（無除權息污染），但 FY2026 庫藏股買回 2.81 億美元
    → 量能訊號標註「受污染」。**
    ⚠⚠ **而它與除權息的差別要記下來：除權息有明確日期與可算的機械偏誤，因此污染均線；
    庫藏股是連續的、買回時點通常不逐日揭露，因此污染量能但不污染均線。**
    ｜**新增第四條 falsifier（capex／營收 超過 15%）**——
    **錨點 FY2026 為 14.97%，距門檻 0.03 個百分點，本輪「最貼著門檻」的一檔。**
    **跨過去象限自 Q4 遷入 Q2，而 Q2 的處方明文警告「純 PE 會系統性高估」，
    而本次的三情境正是用本益比做的 —— 亦即這一條觸發，整套方法就要換，三情境作廢。**
    ⚠ **並複查既有三條**：**第二條（非 GAAP 毛利率連兩季低於 45%）——
    GAAP 的 44.24% 已經低於門檻，驗收時誤用 GAAP 會立刻誤判觸發，口徑必須寫死；
    第三條（FY2028 EPS 共識低於 30 美元）狀態自「未觸發」改為「無法驗證」——
    FY2028 共識根本還沒公布，而在沒有錨點時宣稱「未觸發」是假裝我知道一件我不知道的事
    （本輪第四次做這個處理）。**
    ｜**評級維持中性／信心低。** ⚠ **不是偏空的四個理由**：
    **幅度比本輪其他幾檔小（3081 -21.6%、AXTI -24.3%、INTC -24.0%、3363 -23.9%）；
    26 位分析師共識 Buy、均值 +22.7% 且區間下緣 820 僅低 12.4%；
    穩健性顯示結論不穩；營業利益 +5.362 億與自由現金流 +3.001 億都是正的。**
    ⚠ **不是偏多**：加權低於現價，且建檔時寫的「取得均線之前不得升為偏多」——
    **均線取得了但兩條都不合格，那個限制實質上仍然成立。**
    ⚠ **錨寬度 70.7%（本清單最寬）複查後四個數字皆未變動，信心上限維持。**
    ｜⚠ **本次未做到**：**終端市場拆分（第二次未關閉，而我還差點錯誤地關閉它）**；
    **CPO 的進度與時程（第二次未關閉，而它是 bull 倍數溢價的唯一依據）**；
    **FY2028 的一致預估（基準年，使第三條 falsifier 無法驗證）**；
    69.35 億美元債務清償費用的組成與是否涉及股份結算；
    capex／營收 14.97% 未重查（而門檻距它只有 0.03 個百分點）；
    Fabrinet 的 forward EV-Sales；庫藏股買回的時點分布；日內高低價與其餘四條均線；
    20 日平均振幅。
