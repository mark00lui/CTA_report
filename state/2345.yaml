    ⚠ **年度／季度的分部或產品別營收拆分未取得**（資料中心交換器 vs 其他）。
    **本檔的毛利率 19.7% 是混合值，而 thesis 問的是結構是否上移 ——
    沒有拆分就無法分辨「組合改善」與「同一組合漲價」。**
  how_to_close: 合併財報的部門別資訊附註；法說簡報的產品別營收圖
- question: >
    ⚠ **成交量的歷史區間與均量未取得** —— `confirm_trigger` 目前只有價格沒有量，是半條規則。
    已知當日成交約 244.1 萬股、成交金額 48.20 億元。
  how_to_close: 取 20 日／60 日均量作為門檻基準
- question: >
    ⚠ **發行股數為推算值（約 5.611 億股），非直接取得。**
    推算路徑有兩條且結果一致：市值約 11,026 億 ÷ 股價 1,965；
    以及 Q2 淨利（月營收合計 955.38 億 × 淨利率 11.56% ＝ 110.4 億）÷ Q2 EPS 19.78 ＝ 5.58 億股。
    **兩路差約 0.5%。⚠ 但推算不是事實，且 ROE 52.9% 這個象限判定的主要證據建立在它上面。**
  how_to_close: 公開資訊觀測站的股本形成或最新股東會年報

notes: >
  ⚠⚠ **本檔與同日建檔的 3533 放在一起看，才看得出這一輪最重要的一件事：
  同一個 `ai_capex_hw` 標籤，我做了兩個相反的判斷，而兩邊的理由都是可查的。**
  **3533：伺服器佔營收 55.36%（年增 +71%）卻不標，因為那是一般用途伺服器的 CPU 插槽，
  直接 AI 相關的 QDS 僅約營收 1%，且管理層自己說 GPU 專案時程不確定。**
  **本檔：標，因為白牌交換器直接賣給超大型 CSP，FY2025 營收 +125%、2026 前 8 月 +61.86% ——
  那條曲線與四大 CSP 的資本支出曲線是同一條。**
  **標籤的價值全部來自這種區分；如果兩檔都標，這個因子就只是「看起來像 AI」的同義詞。**
  ｜⚠⚠ **本檔是本清單裡對 `hyperscaler-capex` 傳導最直接的一檔，而它帶來一個新用途：
  它是「落地」的觀測點。** 該 driver 的 `deployment_friction` 記的是「承諾與落地之間的摩擦」，
  **而交換器出貨是資料中心真的通電了的證據之一，不是承諾。**
  **capex 承諾（hyperscaler-capex）、加速器出貨（ai-accelerator-demand）、
  交換器出貨（本檔）—— 三個層次，本檔補上的是最後一個。**
  ｜⚠⚠ **另一個此前沒明說的結構關係：本檔與光通訊那六檔在物理上是綁定的。**
  **一個 800G 埠同時需要交換器這一端的埠與光模組那一端的收發器。**
  **兩邊的出貨量必須對得起來 —— 若長期背離，其中一邊的數字是錯的，或是庫存在某一層堆積。**
  **這使本檔成為 COHR／LITE／AAOI／6442／3008 的獨立交叉驗證節點，
  而且是「同一個埠的另一端」，不是上下游（那是 AXTI 的角色）。兩種交叉驗證性質不同。**
  ｜⚠⚠ **判 Q4 而非 Q1，是本檔最需要解釋的估值判斷。**
  **本檔的分母沒有任何問題（TTM EPS 63.65，又大又正、無一次性扭曲）——
  它落在 Q4 是因為 valuation-map 四個 X 軸判準裡的另一個：「成長率是否遠離穩態」。**
  **EPS 從 FY2025 的 47.13 到 2026 共識的 73.8，營收兩年內近三倍，
  而毛利率同時創五季新高 —— TTM 盈餘被「量的三倍」與「率的高點」同時推高。**
  **valuation-map 對 NVDA 的處理正是同一個道理，本檔套用同一條。**
  ⚠⚠ **但這是一檔「象限的預設主錨是錯的」Q4 標的：Q4 主錨是 EV/Sales，
  而本檔毛利率只有 19.7%，同業毛利率結構從 CLS 的個位數營益率橫跨到 ANET 的品牌高毛利 ——
  valuation-map 明記「EV/Sales ⚠ 不同毛利率的公司不可比」。
  故刻意把副錨（成長持續期）升為主錨，並把 EV/Sales 降為只對 CLS 用的檢查器。**
  **象限給的是預設處方，不是不能推翻的規則 —— 但推翻它必須寫出理由，這裡寫了。**
  ｜⚠ **rank_metrics 這一次的處置與前幾檔不同，值得記**：
  **曾考慮把「800G／1.6T 世代切換時點」列為第三項，經確認取得性不足後刻意換掉，
  改用「前三大客戶營收占比」（年報必揭露）。**
  **LITE 那輪記下的流程問題是「寫定指標時沒有同時確認它取得得到」，
  AXTI 與 AAOI 的處置是「確認並標註風險」，本檔起改成「確認不到就換掉」。**
  ｜⚠ **本日第二次遇到同一個來源的同一種錯誤（Yahoo 當日漲跌符號），
  應視為系統性問題而非偶發** —— 日後一律以開高低與昨收自行判定符號。
  **另記 wantgoo 的市值少一位數（載 1,102.60 億，正確約 11,026 億），
  已用市營比與股價×股數兩條獨立算術驗證。**
  **這兩件事都不是無關緊要的顯示問題：市值進了市營比、股價漲跌進了位階判斷。**

