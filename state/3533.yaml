    ｜⚠⚠ **禁用把 Q1 2026 的 49.55% 毛利率當成正常水準** ——
    **管理層自己說那是低價庫存的產物。用它當基準會讓每一個下游數字都偏高。**
    ｜⚠ **本輪不做 DCF** —— DCF 在 Q1 象限「可用」，**但 capex／營收未取得，
    自由現金流的分母不在。可用不等於做得出來。**
  reviewed: 2026-09-12

thesis: "爭點是 45.47% 毛利率是結構水準還是已在下滑途中的循環高點"
thesis_since: 2026-09-10
# ⚠ 只留爭點，前提移入 key_variables 與 notes（LITE 那輪的教訓，AXTI 起沿用）。
#   前提（已確立、不是爭點）：獲利是真的且規模不小 —— TTM EPS 82.02、Q2 營業利益率 21.97%。
#   ⚠ 為什麼是毛利率而不是估值：**本益比 19.81 對同業平均 47.44 這個落差，
#     若毛利率是結構水準就是明顯的錯價，若是循環高點就是市場對峰值盈餘給的正常折價。
#     兩個結論完全相反，而分歧點只有一個 —— 所以爭點就是它。**

valuation_base_year: 2027
# 2026-09-12 首次建立本欄位 —— 三個 key_assumption 都明寫 FY2027，內容有基準年而結構沒有。

scenarios:
  bear:
