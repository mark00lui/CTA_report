  - pair: "⚠⚠ 2345 / 光通訊六檔（COHR、LITE、AAOI、6442、3008、AXTI）— 同一個埠的兩端，物理綁定"
    added: 2026-09-10
    note: >
      ⚠⚠ **這是本清單此前沒有明說的一種結構關係，而它比相關性更硬：物理綁定。**
      **一個 800G 埠同時需要交換器這一端的埠（2345）與光模組那一端的收發器
      （COHR／LITE／AAOI／6442／3008），以及更上游的 InP 基板（AXTI）。**
      **兩端的出貨量在物理上必須對得起來 —— 若長期背離，
      其中一邊的數字是錯的，或是庫存正在某一層堆積。**
      ⚠ **三種交叉驗證的性質要分清楚，本清單現在三種都有了：**
      **(1) 上下游（AXTI → 收發器）：借的是時序，基板領先數個季度；**
      **(2) 同一個埠的兩端（2345 ↔ 收發器）：借的是數量守恆，兩邊應同步而非一先一後；**
      **(3) 同層直接同業（COHR／LITE／AAOI）：借的是序位，彼此是替代關係。**
      **判讀時混用會得到錯的結論 —— 例如把 (2) 的背離讀成 (1) 的領先。**
      ｜⚠⚠ **另記一件同樣重要的事：2345 對「CPO 對可插拔誰贏」是中性的。**
      **若 CPO 真的取代可插拔，改變的是光模組那一端的形態，而交換器端的埠數不變。**
      **這是本日第三檔新增光通訊鏈曝險卻不加深 cpo 前提依賴的標的（前兩檔為 AXTI、AAOI）——
      cpo 因子因此連續第四次下降（20.0 → 19.0 → 18.2 → 17.4 → 16.7%）。**
      ⚠ **但分子始終是 4：那四檔對「CPO 是否如期放量」的依賴一分未減，變的只有分母。**
      ｜⚠⚠ **獲利結構的差異必須一併記下，否則序位分析會跨格套用倍數：**
      **毛利率 LITE 50.4% ／ COHR 37.50% ／ AAOI 29.8% ／ AXTI 45.0% ／ 2345 僅 19.7%。**
      **2345 是 ODM，營收每多一塊錢只有兩毛留在公司；它的本益比 30.87x（forward 26.63x）
