# ⚠ **本檔的傳導方向與現有三個 driver 都不完全相符，寧可先空著。**
# `hyperscaler-capex` 記的是四大 CSP 的**資本支出承諾**，`ai-accelerator-demand` 記的是
# **加速器出貨**，`accelerator-roadmap` 記的是**平台時程與功率密度**。
# ⚠ **本檔曝險的是資料中心的「用電量」，那是資本支出落成之後的存量，不是資本支出本身。**
# 一座已建成的資料中心即使 capex 歸零仍然耗電 —— **這使本檔與清單上其餘十六檔的傳導在時序與方向上都不同。**
# ⚠ **唯一可能相符的是 `accelerator-roadmap` 的「功率密度」那一半**（GB300 NVL72 已達 132–142kW／櫃），
# 因為功率密度直接決定每座資料中心的簽約電力。**但該 driver 的 current 值記錄的是平台時程，不是總電力需求。**
# **正確的做法是新增一個 `datacenter-power-demand` driver，而不是硬掛在既有的三個上面。** 已列 gaps。

