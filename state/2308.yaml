thesis: >
  市場對 FY2027 只付 27.5 倍而共識成長 +50.1%，爭點不是營益率能否跳升，
  而是共識 1.97 倍的離散度（41.08–80.91）收斂到哪一端，800VDC 在 2027Q2 的放量時點決定它
thesis_since: 2026-09-10

