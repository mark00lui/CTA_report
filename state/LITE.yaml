  rating: 中性
  conviction: 低
  basis: >
    ⚠ **「中性」在本檔的意思是「尚無估值判斷」，不是「多空平衡」。**
    三情境與加權目標價尚未建立（見 scenarios 的說明），**沒有目標價就沒有可檢驗的評級**。
