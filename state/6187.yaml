    **亦即本檔對本 driver 的曝險不只在 CoWoS 那一段，還往光互連封裝延伸。**
    ⚠⚠ **但這一句只有方向沒有數字**：**CPO 相關的營收占比、時點、里程碑全部未取得。**
    **扇出時不可把 CPO 的時程變動直接換算成本檔的損益。** 列 gaps。
- driver: ai-accelerator-demand
  direction: '+'
  note: >
    加速器出貨 → 先進封裝產能需求 → 客戶擴產 → 設備訂單。
