# 覆蓋層分析 — 這不是投資組合，是研究覆蓋清單。
# 本檔不含權重、部位、持倉方向。因子分析以「等權覆蓋」為基準，
# 目的是量測這批標的的論點相依性，不是描述任何人的股權配置。
as_of: 2026-08-27

coverage:                 # 追蹤清單（研究覆蓋，非投資組合）
  - {ticker: TSM,  market: US, tags: [ai_capex_hw, foundry, tw_fx]}
  - {ticker: NVDA, market: US, tags: [ai_capex_hw, accelerator]}
  - {ticker: MU,   market: US, tags: [ai_capex_hw, memory, cyclical]}
  - {ticker: MSFT, market: US, tags: [ai_platform, saas]}
  - {ticker: GOOG, market: US, tags: [ai_platform, advertising]}
  - {ticker: META, market: US, tags: [ai_platform, advertising]}
  - {ticker: INTU, market: US, tags: [ai_application, saas]}
  - {ticker: 3324, market: TW, tags: [ai_capex_hw, thermal, tw_fx]}
  - {ticker: 6442, market: TW, tags: [ai_capex_hw, optical, cpo, single_customer]}

# 等權基準下的因子分布（9 檔各佔 1/9 = 11.1%）
# 這是覆蓋清單的結構描述，與任何實際配置無關
equal_weight_factor_mix:
  ai_capex_hw:    {count: 5, pct: 55.6, note: "TSM + NVDA + MU + 3324 + 6442 — 同一條需求鏈。2026-08-27 兩度加深：納入 NVDA 由 42.9% 升至 50.0%，納入 MU 再升至 55.6%。清單已有超過一半押在同一條鏈上"}
  ai_platform:    {count: 3, pct: 33.3, note: "MSFT + GOOG + META — 支出方；capex 縮手時它們先反應，硬體端後反應"}
  ai_application: {count: 1, pct: 11.1, note: "INTU — 唯一與 capex 因子低相關的標的；占比自 14.3% 兩度稀釋至 11.1%"}
  accelerator:    {count: 1, pct: 11.1, note: "NVDA — 加速器供應端。同時是 drivers/ai-accelerator-demand 的主要成分"}
  memory:         {count: 1, pct: 11.1, note: "MU — 記憶體供應端。⚠ 它是清單內唯一「營收即他檔成本」的標的：記憶體漲價正是 Meta 與 Amazon 上修 capex 時各自點名的原因"}
  cyclical:       {count: 1, pct: 11.1, note: "MU — 清單中唯一的商品循環股（Beta 2.21，52 週 +706%，毛利率一年內由 37.7% 升至 84.6%）。其餘八檔的風險來自論點，本檔的風險來自循環位置"}
  tw_market:      {count: 2, pct: 22.2, note: "3324 + 6442，含匯率與地緣風險；占比自 28.6% 兩度稀釋至 22.2%"}
  non_ai:         {count: 0, pct: 0.0,  note: "覆蓋清單完全集中於 AI 主題 — 這是清單的結構性偏誤，讀者應據此加權"}

common_premise: "9 檔中有 8 檔共用同一前提：AI 資料中心資本支出在未來 8 個季度不會出現實質減速。這是本覆蓋清單的單一失效點 — 個股層分析再深也看不見它。2026-08-27 納入 NVDA 與 MU 後，例外仍只有 INTU 一檔。"

# ⚠ 納入 MU 帶來一個前八檔都沒有的性質：它的營收就是清單其餘標的的成本。
# 記憶體漲價是 Meta 與 Amazon 上修 2026 capex 時各自明確點名的原因；TrendForce 另估
# 記憶體將占 CSP capex 的 68%（二手引用，原始報告未取得）。因此 MU 在需求維度上與其餘
# 硬體端同向（加深集中），卻在成本／毛利維度上與平台端和加速器端反向。
# 這不是分散 —— 它們共用同一個 common_premise；但在該前提成立的前提下，
# MU 與其餘標的的獲利分配是零和的。判讀清單內的相對強弱時必須把這一層分開看。

# 納入 NVDA 使既有的因子集中「加深」而非分散，這一點必須寫明：
# NVDA 是這個共同前提最純粹的單一表述 —— 它沒有非 AI 業務可以緩衝（Edge 僅占 Q2 營收 7.5%），
# 也沒有像 MSFT／GOOG 那樣的訂閱或廣告基底。若共同前提失效，它不是「跟著受傷」，而是震央。
# 換句話說：這次新增提高了清單的解析度（多了供應端的第一手視角），但降低了它的分散度。

shared_falsifier:
  condition: "任兩家超大型 CSP 在同一季下修資本支出 guidance"
  action: "觸發全覆蓋清單 L3 review，不是單一個股"
  status: 未觸發

correlation_watch:
  - {pair: "TSM / 3324", note: "同受 AI 伺服器出貨量驅動，相關性高"}
  - {pair: "TSM / 6442", note: "終端需求同源，但 6442 受單一客戶影響更大"}
  - {pair: "MSFT / GOOG / META", note: "廣告與雲的景氣循環不同步，但 AI 支出敘事同步"}
  - {pair: "INTU / 其餘", note: "應為低相關 — 每季實測一次，若相關性上升代表這個假設失效"}
  - {pair: "NVDA / TSM", note: "預期為清單中最高的一組。NVDA 的出貨就是 TSM 的投片，中間只隔一道代工。若這兩檔相關性「下降」才是異常，通常意味自研 ASIC 比重上升或庫存在通路端堆積"}
  - {pair: "NVDA / 3324、6442", note: "NVDA 領先 2–3 季（散熱與光互連晚於晶片）。同步而非領先的相關性代表傳導假設有誤"}
  - {pair: "NVDA / MSFT、GOOG、META", note: "方向刻意相反：加速器採購對 NVDA 是營收，對平台端是折舊。若四者同向大漲或大跌，代表市場在交易整體 AI 敘事而非個別基本面 — 那是清單分散度最低的時刻"}
  - pair: "GOOG / NVDA / MSFT（＋清單外的 AMZN）— 股權投資評價利益"
    added: 2026-08-27
    note: >
      一條與營運無關、卻會讓帳面數字同向移動的連結，2026-W35 才發現。四家的 GAAP 獲利都被
      對 AI 標的的股權投資評價利益灌水：GOOG 的股權證券（Q2 EPS 9.11 → 正常化約 2.87）、
      NVDA 的 CoreWeave 等（GAAP 2.46 > non-GAAP 2.22）、MSFT 的 OpenAI（GAAP 17.95 >
      non-GAAP 17.28）、AMZN 的 Anthropic（Q2 GAAP EPS 5.75 含 53.4B 利益）。
    implication: >
      (1) 用未經調整的 GAAP 或 TTM EPS 算這批標的的本益比會系統性低估估值水準 —— GOOG 最極端，
          表面 17x、正常化後 25x 以上。本倉庫一律改錨正常化 EPS。
      (2) 同一批 AI 資產的評價波動會同時推升或壓低多檔的帳面獲利，這是傳統因子分析看不見的
          相關性來源。若這批被投資標的（OpenAI、Anthropic、CoreWeave 等）同步重評價，
          三檔覆蓋標的的 GAAP 獲利會同向跳動，而營運面完全沒變。
    check: 每季核對各家調節表，確認正常化口徑仍被正確排除
  - pair: "MU / NVDA — HBM 成本"
    added: 2026-08-27
    note: >
      方向相反且直接。HBM 是加速器的主要 BOM 成本之一，MU 的定價權就是 NVDA 的成本壓力。
      TrendForce 估 HBM 合約價 2027 年可能再漲 70–140%（二手引用）。
    implication: >
      NVDA Q3 FY27 毛利率指引由 75.0% 降至 74.0%，本倉庫先前歸因於 Vera Rubin 換代爬坡；
      HBM 成本上漲是第二個候選解釋。前者暫時、後者結構性，意涵相反。
      目前無證據區分 —— 若 NVDA 毛利率在 Rubin 出貨占比提高後仍未回升，第二個解釋的權重上升。
    check: NVDA 每季毛利率 vs MU 的 HBM 定價與出貨
  - pair: "MU / MSFT、GOOG、META — 記憶體即 capex 通膨"
    added: 2026-08-27
    note: >
      MU 的營收是平台端的成本。Meta 與 Amazon 上修 2026 capex 時都明確點名記憶體價格。
      這使 capex 金額上修不等於運算量等比上修 —— 同一筆預算能買的算力被記憶體通膨稀釋。
    implication: >
      對硬體端而言這是壞消息（capex 的含金量下降），對 MU 是好消息，對平台端是雙重打擊
      （支出變高、且買到的算力變少）。同一則「capex 上修」新聞在清單內至少有三個方向。
    check: drivers/hyperscaler-capex 的 gaps 已列「各家 capex 中 AI 相關實際占比」，記憶體占比是其子問題

review_cadence:
  weekly: "事件流回顧 + 共同前提檢核 + 未來兩週檢驗點"
  monthly: "陳舊變數清理 + 相關性實測"
  quarterly: "全部 thesis 重審一次，不論有無事件"
