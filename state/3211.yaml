    **Q2 2026 EPS **1.35 元**（季減 34%、**年減 65%**）；H1 累計 **3.4 元**（**年減 31%**）；
    TTM EPS **7.41 元**（對照 2026 Q1 當時的近四季 9.92 元）。**
