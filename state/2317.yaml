    錨定價自 250.50 更新為 248.00，上檔空間自 +28.9% 變為 +34.3%。評級維持中性／低。**
    ⚠⚠⚠ **本輪最重要的產出是共識把 thesis 的爭點換算成了一條可否證的路徑。**
    thesis 是「營業利益年增 68% 為何只換到稅後淨利年增 30%」——那 19 個百分點的漏損會不會回來。
