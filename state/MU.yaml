  rating: 中性
  conviction: 低
  basis: 不給偏多的理由不是基本面（FQ3 是清單九檔裡最猛的數字），是三件事 — 技術面剛跌破 50DMA，那是 +706% 後的第一次實質回檔、是動能中斷不是右側確認；上檔 +8.9% 對 Beta 2.21 的股票不成比例；四週後有一個會直接回答論點的財報（2026-09-22），在那之前建立方向性結論等於搶跑。也不給偏空 — 三條 falsifier 距離都不近，且新供給要到 FY2028 才實際壓上來，「終將回歸」不是「現在就回歸」。信心低不是資料不足而是 situation 本身不確定：街上 47 位分析師目標價 361–2,200 六倍價差，此時宣稱中等以上信心並不誠實
