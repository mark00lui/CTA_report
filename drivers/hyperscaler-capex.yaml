# 與 ai-accelerator-demand 互為交叉驗證：承諾（本檔）vs 落地（加速器實際出貨）
cross_check:
  against: ai-accelerator-demand
  logic: >
    本檔是「支出承諾」，ai-accelerator-demand 是「實際落地」。承諾持續上修但加速器營收停滯
    → 錢沒流向運算；加速器超前而承諾未動 → 承諾可能即將上修。
  status: 未背離
  as_of: 2026-08-27
  finding: >
    方向一致。capex +82% YoY（745 vs 2025 的 410），加速器合計 +116% YoY（95.7 vs 約 44.2）。
    加速器成長仍快於 capex，意味 capex 中流向運算的比重續升。
    本次新增一個較合理的校準：Alphabet 揭露其 capex 約 60% 投向伺服器。若該比例可外推，
    745 × 60% ≈ 447，對照加速器單季 95.7 年化後的 383，比值約 86% —— 遠比先前用全額 capex
    當分母（54%）合理。但高速成長中的單季年化本身會低估，故仍列觀察不作結論。
  caveats: >
    (1) 分子涵蓋範圍大於分母：NVDA 客戶不限四大 CSP（其 AI Clouds／Industrial & Enterprise
        營收 +138% YoY 至 40.3，含主權與 AI-native），這些不在四大 capex 的分母裡。
    (2) 期間不對齊：本檔為曆年全年，加速器為單季。
    (3) 60% 伺服器占比是 Alphabet 單一家的揭露，外推至其餘三家未經證實。
  action: 兩者連兩季背離 → 硬體端 L2，並在報告中明寫是哪一邊先動

# 2026 年下半最重要的變化不是金額，是市場反應
market_reaction_regime:
  as_of: 2026-08-27
  observation: >
    capex 上修已從利多轉為利空訊號，且本季再獲印證。
    Alphabet 於 2026-07-22 上修 capex 至 195–205 後股價下挫，並引發同業賣壓；
    CNBC 於 2026-07-28 報導 Amazon、Meta、Microsoft 在 Alphabet 報告引發賣壓後
    面臨投資人更嚴格的檢視。Meta 上調 guidance 當日亦曾下跌 9.25%。
  implication: >
    同一則「capex 上修」新聞，對硬體端（TSM/3324/3017/6442）是需求利多，
    對平台端（MSFT/GOOG/META/AMZN）在當前情緒下是折舊與 ROI 疑慮的利空。
    處理這類事件時必須分開判斷，不可套用同一個方向。
  tier: 推論

# 觀察到的第四個案例：平台端的 GAAP 獲利被股權投資評價利益灌水
# （MSFT 的 OpenAI、NVDA 的 CoreWeave 等、GOOG 的股權證券、AMZN 的 Anthropic）
equity_gain_distortion:
  as_of: 2026-08-27
  observation: >
    Amazon Q2 2026 的 GAAP EPS 5.75 含 53.4B 的 Anthropic 投資利益。
    這是本倉庫目前記錄到的第四家 —— MSFT、NVDA、GOOG 皆有同構的情形。
  implication: >
    用未經調整的 GAAP 或 TTM EPS 計算這批標的的本益比，會系統性低估估值水準。
    且同一批 AI 資產的評價波動會同時影響多檔帳面獲利，是 coverage 的 correlation_watch
    目前沒有記到的一條連結。
  tier: 事實

transmission:
  - ticker: COHR
    direction: '+'
    path: capex → 資料中心內外光互連埠數 → 收發器與光元件需求
    lag: 領先 2–3 季
    sensitivity: 中（FY2027 已售罄且長約含 take-or-pay，短期 capex 波動先反映在訂單能見度而非營收）
    affects: ['資料中心營收成長', '訂單能見度']
  - ticker: TSM
    direction: '+'
    path: capex → GPU/ASIC 投片量 → 先進製程與 CoWoS 產能利用
    lag: 領先 1–2 季（晶片先於整機）
    sensitivity: 高
    affects: [先進製程營收占比, CoWoS月產能]
  - ticker: '3324'
    direction: '+'
    path: capex → 伺服器機櫃出貨量 → 液冷附載率與單機價值量
    lag: 領先 2–3 季（散熱晚於晶片）
    sensitivity: 高
    affects: [液冷滲透率, 北美CSP訂單能見度, 產能利用率]
  - ticker: '3017'
    direction: '+'
    path: capex → 伺服器機櫃出貨量 → 水冷板／分歧管／機箱需求
    lag: 領先 2–3 季
    sensitivity: 高
    affects: [月營收 YoY, 2026E EPS 市場預估]
    note: ⚠ 尚無 state/3017.yaml。本條目為刻意保留 —— 3017 是真實的傳導對象，只是不在覆蓋清單內。驗證腳本會因此持續發出 warn，不要用刪除條目的方式消除它
  - ticker: '6442'
    direction: '+'
    path: capex → 機櫃內外光互連埠數 → 光通訊產品需求與 CPO 導入時程
    lag: 領先 2–3 季
    sensitivity: 中（受單一客戶因素干擾，傳導不純）
    affects: [光通訊產品營收占比, CPO量產時點]
  - ticker: MSFT
    direction: '-'
    path: capex → 折舊費用 → 營益率；除非雲營收同步加速，否則壓縮獲利
    lag: 落後 2–4 季（折舊隨資產啟用才入帳）
    sensitivity: 高
    affects: [營益率, 折舊年限假設]   # 2026-08-27 修正：原列「資本支出年增」，該變數已於 MSFT 重估時移出其 key_variables
  - ticker: GOOG
    direction: '-'
    path: 同上；另受市場對 ROI 耐心的情緒放大
    lag: 落後 2–4 季
    sensitivity: 高
    affects: [Cloud成長率]   # 2026-08-27 修正：原列「資本支出」，該變數已於 GOOG 重估時移出其 key_variables
  - ticker: META
    direction: '-'
    path: 同上，且 Meta 無公有雲可直接變現 capex，ROI 質疑最強
    lag: 落後 2–4 季
    sensitivity: 高
    affects: [總費用guidance, 總成本費用成長]   # 2026-08-27 修正：原列「資本支出guidance」，該變數已於 META 重估時移出其 key_variables
  - ticker: AMZN
    direction: '-'
    path: 同上；AWS 成長率是判斷 capex 是否轉化為營收的主要中介指標
    lag: 落後 2–4 季
    sensitivity: 高
    affects: [資本支出, AWS成長率]
    note: ⚠ 尚無 state/AMZN.yaml。同 3017，為刻意保留的真實傳導對象

falsifiers:
  - condition: 任兩家在同一季下修全年 capex guidance
    check_by: 2026-11-30
    status: 未觸發
    evidence: >
      2026-08-27：本季唯一的金額下修是 Microsoft（190→175），且已確認全部來自折舊年限與
      租賃重分類，CFO 明言投資預期未變 —— **不計為 guidance 下修**。其餘三家皆為上修或
      下緣上抬（Amazon +20、Alphabet 下緣 180→195、Meta 下緣 125→130）。
      這正是本條需要人判讀而非數字比對的原因：機械式掃描會在 Microsoft 那一筆產生偽陽性。
    action: 觸發全覆蓋清單 L3 review（硬體端與平台端方向相反，須分開處理）
  - condition: 2027 合計 guidance 低於 2026 實際（成長轉負）
    check_by: 2027-02-28
    status: 未驗證
    evidence: "2026-08-27：尚無 2027 guidance。方向性線索為 Amazon 稱 2027 產能已大致被預訂、部分 2028 產能亦已有歸屬"
    action: 硬體端全面 L3；平台端視為營益率利多
  - condition: 任一家明確將 capex 與「需求不足」而非「產能受限」連結
    check_by: 2026-11-30
    status: 未觸發
    evidence: >
      2026-08-27：明確反向。Alphabet 稱需求強勁但**供給限制**仍在拖慢產能交付；
      Amazon 稱 2027 產能已大致被預訂。四家無一將支出與需求不足連結。
    action: 這是最早的轉折訊號，優先度高於金額本身

