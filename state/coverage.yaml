  - pair: "⚠⚠ 2308 / 3324 — 不只是同機櫃的互補件，在液冷這一段是**直接競爭**"
    added: 2026-09-10
    revised: 2026-09-10
    note: >
      ⚠ **本條於建立當日即被自己的重估推翻一半，修正記在這裡不抹除原文。**
      **原記述**：「兩檔都裝在同一個 AI 機櫃裡，但驅動變數不同 —— 3324 由液冷滲透率驅動、
      2308 由電壓架構換代驅動；兩者都源自單櫃功耗上升，故預期相關性高、可互為佐證。」
      ⚠ **那句話不完整。2026-09-10 重估 2308 時取得：台達電的「液冷產品」已占其營收逾 12%**
      （法說口徑：AI 相關 40% ＝ AI 產品 >25% ＋ **液冷 >12%**）。
      以 FY2026E 營收約 7,400 億元計，**台達的液冷業務約 890 億元 ——
      大於 3324 雙鴻的全年營收（近月月營收 27–38 億元，年化約 400 億元）。**
      **亦即：清單中規模最大的液冷供應商不是那家液冷專業廠，是 2308。**
      ⚠ **含意有三，都要寫**：
      (1) **兩檔在液冷這一段是直接競爭，不是互補。** 「同機櫃的兩個零組件」只在電源那一段成立。
      (2) **3324 的 thesis（液冷由選配轉標配、滲透率決定重評價幅度）多了一個此前未記的競爭者，
          而且是一個規模大它一倍以上、且同時供應電源的整合型對手。** 這是 3324 重估的必要輸入。
      (3) 原記的「可互為佐證」仍成立且更強：Kyber 600kW 機櫃要求完全液冷且供電改 800 VDC，
          **若其中一檔的時程遞延而另一檔沒有，代表其中一個管理層的說法有問題。**
      ⚠ **兩檔仍共用一個同構缺口**：2308 的 `單櫃電源價值量` 與 3324 的 `單機液冷價值量`
      都拿不到，而兩檔的論點都靠「單機價值量跳升」支撐。
      ⚠ **預期相關性仍為高**（同源於單櫃功耗），但**相關性高的原因現在有兩個：
      同一個上游驅動，加上同一塊市場**。後者是零和的，前者不是。
