      **對照本日另三檔（LITE／AXTI／AAOI）最快的可驗證點都要等到季報。**
      **清單中的 9 檔台股標的都有這個性質，而它在因子分布裡是看不見的。**
      ｜⚠ **估值的對照一併記下，因為它是本日五檔裡最刺眼的一組**：
