    ⚠⚠ **技術面與基本面的落差值得單獨記**：**8 月營收年增 218.53% 且首破 80 億元、
    Q2 EPS 年增 668%，而股價在季線之下。**
    **依 CTA 紀律，基本面理由再強也不跳過右側確認 —— 這正是那條紀律存在的場合。**
