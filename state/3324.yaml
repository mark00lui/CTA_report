signal:
  rating: 中性
  conviction: 中
  basis: >
    基本面動能是清單中最強的之一：7 月營收 +116.7% 創高、公司自行上修 2026 年營收成長目標
    自 +50% 至 +70%、Q1 EPS 12.61 創高且 YoY +122.79%、液冷營收占比目標自 2025Q3 實績 35%
    提高至 55% 以上。2026-08-31 重錨後加權目標價對現價 1,250 仍有 +10.2% 空間。
    ⚠ 技術面本次首次可判讀，結果是**部分確認**：價格站上全部六條均線、收在當日最高、
    量能達 20 日均量的 2.91 倍、MACD 柱體為正且擴張 —— 這些都是右側訊號。
    但 confirm_trigger 的兩項條件只成立一項：「放量」成立，「突破 1,305」未成立（距 52 週高 4.2%）。
    次要條件「MA60 上穿 MA120」也未成立 —— 季線 994.5 仍在半年線 1,020 之下，中期結構未翻轉。
    依 CTA 紀律，**部分確認不等於確認**，故維持中性。
    這是本檔第一次「差一步」而非「無從判讀」，兩者性質不同，值得分開記。
    ⚠ 另一個不升為偏多的具體理由：現股當沖率 31.01%。放量突破若有三成來自當沖，量能品質要打折 ——
    需看次日能否守住 1,250 與 MA5 的 1,118。
    信心度自「低」升至「中」：原本並存的三個缺口關閉了兩個 —— 全部均線已取得（本次）、
    錨 A 已取得（歷史本益比區間，base 自錨 B 升級）。仍為中而非高，因為第三個缺口未關閉
    （2027 共識未取得，基準年無法自 2026 滾動），且 Q2 2026 單季財報數字仍缺、RSI 未取得。
  changes_if: 放量突破 1,305 並站穩 → 偏多；週收盤跌破 994.5 (MA60) → 下修，跌破 981 (MA240) → 偏空；2026 全年液冷營收占比未達 45%（公司目標 55%+）、毛利率連兩季低於 28%、或連兩月營收 YoY 低於 +30% → 偏空；取得 2027 共識並完成基準年滾動 → 信心升至高

