    依慣例約 **2026-12 上旬**公布，**在六個月內**。
    ⚠ **取指引值而非自訂數字，理由是本檔的共識錨寬度只有 3.35%** ——
    **在一個如此收斂的共識裡跌破公司自己給的指引，本身就是強訊號。**
    錨點：Q3 實際 29,591M（+86%）、Q4 指引約 34,800M（+93%）。
- condition: AI 半導體單季營收年增率低於 +80%
  check_by: 2027-06-30
  status: 未觸發
  note: >
    門檻於 2026-09-08 設定。錨點：Q3 FY26 **+221%**、Q4 指引 **+236%**。
    ⚠ **本條測的是 thesis 的核心——「持續期」，不是「成長是否為真」。**
    ⚠ **80% 這個門檻刻意設得遠**：自 +221% 降到 +80% 仍是很高的成長，
    **它測的是「三位數成長是否結束」，不是「成長是否放緩」。**
    ⚠ **但必須先講清楚一個基期效應**：AI 營收的比較基期正在快速墊高
    （Q3 FY25 約 5.2B → Q3 FY26 16.7B），**年增率的機械性下滑是必然的**。
    **本條因此可能在營運沒有惡化的情況下被觸發** ——
    **判定時必須同時看季增率與絕對金額，不可只看年增率。**
- condition: AI 半導體單季營收季減（QoQ 轉負）
  check_by: 2027-09-30
  status: 未觸發
  note: >
    門檻於 2026-09-08 設定。錨點：Q3 FY26 季增 **+54%**；Q4 指引自 16.7B 增至 21.7B（**+30%**）。
    ⚠ **本條是上一條的補位，正是為了防上一條的基期效應誤判** ——
    **季增轉負不受基期墊高影響，是更乾淨的轉折訊號。**
    ⚠ 但它也更遲鈍：季增可能因單一客戶的專案排程而波動一季。
    **兩條並用，任一觸發即重審，但意義不同。**
- condition: 非 GAAP 營益率低於 60%
  check_by: 2027-03-31
  status: 未觸發
  note: >
    門檻於 2026-09-08 設定。錨點：Q4 指引約 **66%**（公司明言「flat from a year ago」）；
    Q3 實際非 GAAP 營業利益 20,095M／營收 29,591M = **67.9%**。
