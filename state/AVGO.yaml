- driver: hyperscaler-capex
  direction: '+'
  note: >
    ⚠ **本檔是覆蓋清單中與這個 driver 距離最近的一檔，近到幾乎是同一個數字的兩面。**
    本檔的 AI 半導體營收（Q3 FY26 **16.7B**、Q4 指引 **21.7B**）**就是超大規模業者
    自研加速器（TPU／MTIA 類）的採購金額**——**它不是「受惠於 capex」，它「是」capex。**
    **領先 2–3 季**：CSP 的年度 capex guidance 先出，晶片投片與出貨認列在後。
    ⚠ **與清單其餘硬體端的關鍵差別**：3324／3037／8046／6239 賺的是資本支出**流過供應鏈**
    之後的一小段；本檔賺的是**加速器本身**。**傳導最短、彈性最大，方向與硬體端相同但幅度不同。**
    ⚠ **反向風險必須明寫**：若某家 CSP 決定自研轉外購（改買 NVDA）或延後專案，
    **對本檔是直接的營收減項，而對 NVDA 反而是利多**——
    **這是清單內第一次出現「同一則 capex 消息對兩檔覆蓋標的方向相反」的結構。**
    affects：AI半導體營收與占比、單季營收。
- driver: ai-accelerator-demand
  direction: '+'
  note: >
    ⚠⚠ **建立這一條的同時發現該 driver 有一個實質缺口，必須一併記下。**
    `ai-accelerator-demand` 的 `current` 明寫其口徑為
    「單季資料中心營收合計；NVDA + AMD，**不含**自研 ASIC」。
    **而本檔的 AI 半導體營收正是它排除掉的那一塊，且已達單季 16.7B、指引 21.7B、年增 221%。**
    → **該 driver 的現值系統性低估了加速器總需求，而低估的幅度正在以三位數年增率擴大。**
    **這不是本檔的問題，是 driver 的口徑問題，已列 gaps 並應走 `/driver` 處理。**
    **領先 1–2 季**（本檔的認列與 NVDA／AMD 的認列大致同步，略早於整機出貨）。
    ⚠ **方向雖為 `+`，但成分上本檔與 NVDA 在自研 ASIC 對商用 GPU 這一題上是替代關係**——
    見上一條的反向風險。
    affects：AI半導體營收與占比。

