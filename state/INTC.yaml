thesis: "爭點是代工外部營收能否在 2027 前自 2.93 億長到數十億美元"
thesis_since: 2026-09-11
# ⚠ 只留爭點，前提移入 key_variables 與 notes（LITE 那輪的教訓，AXTI 起沿用）。
#   前提（已確立、不是爭點）：**轉正與改善都是真的** ——
#   2026 Q2 營收 $16.1B（超指引中點 $1.8B）、EPS $0.42（預期 $0.21）、
#   非 GAAP 毛利率 41.8%（高於指引約 280bps）、**連續第七季超預期**；
#   三部門全數成長（CCG & Physical AI +13%、DCAI +59%、Foundry +31%）；
#   Foundry 營業利益率自 2025 Q2 的 -71.7% 改善至 -36.2%（35.5 個百分點）；
#   Q3 指引調整後 EPS $0.38、營收 $15.8–16.8B。
#   ⚠⚠⚠ **為什麼爭點是那個外部營收數字**：
#   **公司自己給了兩個端點 —— 現在是單季 **$293M**（年化約 $1.17B），
#   而 2027 損益兩平「只需要 low- to mid-single-digit billions 的年度外部營收」。**
#   **那是數倍的差距，而時間只剩一年多。**
#   ⚠⚠ **而它是唯一能分辨兩種解釋的數字**：
#   **Foundry 的虧損收斂（-71.7% → -36.2%）目前幾乎全部來自**內部採用 18A**，
#   不是來自外部客戶。**
#   **若外部營收不跟上，2027 的「損益兩平」會是一個靠內部轉撥達成的會計事件，
#   而不是一個代工事業成功的證據 —— 兩者對 $527B 市值的意義完全不同。**
#   ⚠ **並記住時序：2027 損益兩平靠 18A 內部採用；真正要賺外部錢的 14A 要到 2028。**

valuation_base_year: 2026   # ⚠⚠⚠ 2026-09-18 首次設定 —— daily_check.py 提示「無法解析」，原因是本欄此前從未建立（不是格式錯，是缺欄位）。⚠ 本檔刻意不套用 `forward-estimates.md` §4 的預設滾動規則（H2 之後滾入 FY+2＝2028）：三情境走的不是「EPS × 倍數」而是 SOTP，三格分部估值（DCAI／CCG／Foundry）全部錨在**2026 Q2 財報年化 run-rate**，三情境共用同一組分部收入假設、只調整倍數 —— 亦即模型的基準本來就是 2026，滾動到 2027 需要分部層級的 FY2027 guidance 或共識（CCG 分部營收與獲利、Foundry 損益兩平的外部營收路徑），而那組數字仍在 gaps 裡未取得。在取得之前把本欄標成 2027 會製造「倍數與 EPS 不同年」的假象（見 valuation.md §5），比留空更危險。

