  axes_crossed:
  - 時間（軸③：自身歷史 forward vs 現況 forward）
  - ⚠ **軸④跨不過去** —— 無可比同業。這是本檔的結構性限制
  excluded: >
    ⚠ **不用 PB**（fabless，帳面淨值與價值脫節）。
    ⚠ **不用 EV/EBITDA**（折舊攤銷占比太小，中和不了任何東西）。
    ⚠ **不做 forward-DCF**。
    ⚠ **不可跨基準年引用 forward PE** —— 2026-09-07 實例：
    state 的遠期本益比記 **23.2**（基準 FY2027 EPS 9.27），
