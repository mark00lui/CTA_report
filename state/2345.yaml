    （品牌交換器），本檔是 3.22（白牌 ODM）—— 商業模式差異解釋了大部分。**
    ｜⚠ **明文不並列中週期正常化（序列單調）**：FY2022 14.64 → 2023 15.99 → 2024 21.49
    → 2025 47.13，三年 CAGR 47.5%；四年平均 24.81、TTM 63.65、比值 2.57 倍。
    **若硬做 24.81 × 22 ＝ 546（-72.4%）。本檔與 3017、6805、3583、2317 同屬單調組。**
    ｜⚠⚠ **市值少一個數量級，本次第二度確認**（建檔時已記 2345／3017／3081 三檔）：
    **建檔載 1,102.60 億元，但 ÷ 1,975 ＝ 5,583 萬股，對一家前 8 月營收 2,460 億元的公司不可能。
