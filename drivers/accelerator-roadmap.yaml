      而本檔 components 已記 B300 單顆最高 1,400W、機櫃 132–142／190／600kW。
      1,000W 低於已在檔內的數字，是較粗的產業泛稱，**對 3324 不構成新資訊**。
      口徑不同的功耗數字並列時，先確認是同一個東西再更新模型。
    fanout: >
