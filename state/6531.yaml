  delta: >
    建檔。判 **Q4（營收與選擇權）**，本輪十六檔中第十檔落在 Q4。
    ⚠ **建檔時先攔下一個來源錯誤**：**某搜尋摘要把 6531 的英文名寫成 "Aiptek"
    —— Aiptek 是天瀚科技，不是愛普。6531 是 AP Memory Technology（愛普科技）。**
    **產品名（IoTRAM、S-SiCap、VHM、VHMStack）確實是愛普的，故中文標的沒錯、英文名錯。**
    **兩天之內第三次資料源出錯（前兩次：3221 代號筆誤、6187 的 +9.82% 成長率）——
    三次的共同點是二手摘要在「識別」與「已經算過的數字」上最容易錯，
    而那兩件事恰好最不容易靠內部一致性檢查抓到。**
    ｜⚠⚠ **X 軸低，而證據是年增與季增指向相反的方向**：
    **Q2 EPS 季增僅 +1%，而同期營收季增 +12.6%（21.00 → 23.64 億元）——
    單季淨利率自約 32.2% 降到約 28.8%。而年增是 +224%。**
    **年增描述的是一年前的低基期，季增描述的是現在。**
    ⚠ 加上成長率極度遠離穩態（前 8 月累計營收年增 109.13%、8 月單月年增 150.82%），
    **且產品組合將在 2027–2028 整個改變（VHM 與 VHMStack 全面量產）。**
    Y 軸判低（無廠 IC 設計；股價淨值比 **12.97**、ROE 約 **22.5%**），
    ⚠ **但保留：股東權益週轉率僅約 0.69 倍，對無廠設計公司偏低 ——
    合理的解釋是帳上有大額現金，而那未經查證。**
    ｜⚠⚠ **刻意不標 `ai_capex_hw`，本輪第三次做這個判斷（前兩次 3533、8299）**：
    **現在的營收由 IoTRAM 撐，VHMStack 要到 2027–2028；AI 資料中心的當期營收實質上是零。**
    **已寫定重新分類規則（VHMStack 相關營收占比 > 10% 則加標籤並重估）。**
    **三次「不標」的共同結構一樣：看起來像 AI 的東西，其當期營收占比接近零。**
    ｜方法跨**三軸**（分母／參照／時間）。
    ⚠⚠ **主錨是「選擇權拆分」（IoTRAM 現業務 ＋ VHM／VHMStack 的未貢獻營收產品）——
    這是本輪第二次 Q4 的這一半處方真正用得上**（第一次為 3211 的 A7 土地），
    **與 3008 被記為「價值主體是尚未貢獻營收的 CPO 選擇權」同型。**
    ⚠ **檢查器用成長持續期而非中週期正常化，理由是本檔的毛利率穩定
    （Q1 46%，與去年同期持平），正常化能修正的東西不多 ——
    真正的問題是「57.61 倍在為一個 2027–2028 的產品付多少錢」。**
    ⚠ **層級軸未跨（淨現金未取得）—— 本輪第十檔；而本檔的淨現金特別重要，
    若帳上有大額現金，選擇權拆分的分母要先扣掉它。**
    ｜三情境**刻意不建立**：主錨的另一半只有一個年份沒有任何數字；
    兩家清單外同業倍數全缺；三個排序指標中兩個現值未取得；淨現金未取得。
    ｜評級**中性／信心低**。位階**右側確認**。
    ⚠⚠ **本檔是本輪第二檔「均線兩端都過關」的標的，而且比前一檔更好**：
    **季線距現價 -13.79%，比值 **2.55 倍**日振幅（5.41%），高於 6187 的 2.03 倍。**
    ⚠⚠ **而兩個過關樣本合起來揭露了一個此前沒寫出來的隱含條件**：
    **兩個過關的都是「價格在季線之上」的標的 —— 那不是巧合。**
    **價格在均線之上時，均線是支撐（可以當失效價位）；在均線之下時，均線是壓力
    （已跌破的線不能當失效價位）。**
    **亦即「兩端都過關」還有第三個條件：價格必須在那條線的正確一側。**
    **應與 ±20% 的上界與「2–3 個日振幅」的下界一起寫進 references。**
    ⚠ **但本檔的報價是 2026-09-10 10:23 的盤中價，當日 +4.6% 且收在當日最高價 ——
    盤中價的技術面判讀偏樂觀，收盤後應重新確認。**
    ｜四條 falsifier。⚠ **第一條刻意用季度而非月營收或累計**：
    **本檔兩年的月營收都不規則，連累計年增率都不是單調的（六月觸底後回升）——
