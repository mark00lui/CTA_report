# 公開研究檔 — 本倉庫不含任何倉位資訊：無成本、無數量、無權重、無 Kelly、無損益、無持倉揭露。
# 未知值一律留 __ 並寫進 gaps，不要填看起來合理的數字。
#
# ⚠⚠ 建檔當下最重要的四件事，寫在最前面：
#   (1) ⚠⚠ **本檔把本日反覆出現的「清單內標的能不能當錨」這件事，收斂成一條通則：**
#       **清單內的標的不作為估值錨 —— 不論它是競爭者（AVGO／3661、3324／3017）
#       還是鄰居（本檔與 3324／3017 是同一個液冷迴路上的相鄰零件）。**
#       **理由不是競爭關係，是錨的價值在於它獨立於我的判斷，而清單內的標的不獨立。**
#   (2) ⚠⚠ **營收組合在一年內翻轉**：AI 伺服器相關應用占比自去年同期 **19.2%**
#       拉升到 **55.7%**，**正式成為公司最大營收來源**。
#       **這不是成長，是換了一門生意 —— 而任何 trailing 倍數都還在描述舊的那一門。**
#   (3) ⚠⚠ **季線距現價 -25.21%（季線約 1,716.39 對現價 2,295）—— 本日「太遠」那一端最極端的
#       一檔（前兩檔為 AXTI 的 -33.6%／-74.2%、3017 的 -20.25%）。**
#       **配上昨天的 3661（+0.30%）與 8299（-0.02%），本日十檔已經把那條雙邊規則的
#       兩端都量到了。**
#   (4) ⚠ **順帶校正一個我自己的用語錯誤，記在這裡以便日後修**：
#       **我在 AAOI 那檔把「分部／企業／每股」稱為跨層級軸，
#       但 valuation-map 對層級軸的定義是「股權（P/x）／企業（EV/x）」——
#       分部拆解不屬於那個軸。AAOI 的三軸宣稱因此有一項偏鬆，應於下次 /revalue AAOI 改正。**
#       **本檔不重複那個錯誤：分部拆解記在分母軸，層級軸誠實標為未跨。**
