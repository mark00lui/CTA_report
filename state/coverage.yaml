  - pair: "⚠⚠ 8299 / (MU ＋ SNDK) — 上下游買賣關係，且短期方向相反；本清單第一組「先受惠再受害」"
    added: 2026-09-10
    note: >
      **MU 與 SNDK 製造 NAND 晶圓；8299 買晶圓做成控制器與模組 —— 買賣關係，不是同業。**
      **已於 `state/8299.yaml` 明文禁用兩者作為估值錨。**
      ⚠⚠ **而它們的景氣方向在短期是相反的，這是本清單第一次出現**：
      **NAND 漲價對上游是售價、對 8299 是原料成本。**
      **8299 目前的高毛利（2026 Q2 為 65.31%，去年同期約 29.06%）有相當部分來自
      低價庫存與現貨價的時間差 —— 那是一次性的價差利益，不是議價能力。**
      **短期利多（存貨利益）、中期利空（成本上升）。**
      ⚠⚠ **這把 CLAUDE.md 的那句話推進了一步**：
      **「同一則消息對不同標的方向可能相反」——
      8299 的情況是「同一則消息對同一檔標的，在不同時間軸上方向也相反」。**
      **故其 `ai-accelerator-demand` 的 sensitivity 刻意記「中」而非「高」。**
      ｜⚠⚠ **實務後果，而且是本清單的一個新用法**：
      **8299 的第三條 falsifier 直接用 MU／SNDK 當錨點 ——
      「上游任一家的季毛利率連兩季下滑，而 8299 的季毛利率仍高於 55%」。**
      **機制：NAND 現貨價鬆動會先反映在上游的售價，再反映在 8299 的存貨成本。
      若上游已連兩季下滑而 8299 仍維持高毛利，那代表它還在吃低價庫存 ——
      時間差即將結束，而不是它比上游更有議價能力。**
      **這是本清單第一次用「另外兩檔標的」當成一檔標的的 falsifier 錨點，
      而且它刻意設計成「看起來像好消息的壞消息」。**
      ｜⚠ **本倉庫已有的兩個谷底參照在這一組特別有用**：
      **valuation-map 記載 MU FY2023 毛利率 2.7%、SNDK 前身 WD Flash 分部 -11.9%。**
      **那是這個循環另一端長什麼樣子的現成錨 —— 而 8299 的主錨
      （中週期正常化 EPS，valuation-map 註記「循環股必用」）正需要這種東西。**
      ⚠ **但那是上游的谷底不是 8299 的**，其自身的循環區間仍須另外取得（已列 gaps）。
      ｜⚠⚠ **並記下 8299 刻意不標 `ai_capex_hw` 而 MU／SNDK 兩者皆標的理由，
      因為那是這一組最容易被質疑的地方**：
      **它們賣的是位元，價格上漲時量價齊揚；8299 賺的有相當部分是價差，
      那是一筆從客戶手上轉移過來的錢，不是 AI 需求創造出來的。**
      **且其企業級／AI 相關營收占比完全未取得 —— 標上去會是一個我無法驗證的宣稱。**
      **重新分類規則已寫定：占比 > 25% 則加標籤並重估。**
  - pair: "⚠⚠ 3661 / AVGO — 同一批 AI ASIC 專案上的零和競爭；本日第三組清單內競爭配對"
    added: 2026-09-10
    note: >
      **兩檔都做超大型 CSP 的自研 AI 加速器，在同一批專案上競爭 —— 誰拿到是零和的。**
      ⚠⚠ **已於 `state/3661.yaml` 明文禁用 AVGO 作為估值錨。**
      **`state/AVGO.yaml` 的同業是 NVDA 與 MRVL，並未列入 3661，所以目前沒有循環引用；
      但若 3661 以 AVGO 為錨，就會建立一條單向依賴，而兩檔又互為競爭對手 ——
      單向依賴＋互為競爭是最壞的組合，故從一開始就擋掉。**
      ⚠ **本清單至此有三組「清單內互為競爭」的配對，處置各不相同，值得並列**：
      **(1) 3324／3017（散熱，且 3324 的錨 B 就是 3017 → 循環引用，必須拆）；**
      **(2) 2308／3324／3017（台達電能提供「電源＋液冷」組合 → 份額觀察，不入 peers）；**
      **(3) AVGO／3661（AI ASIC → 從一開始就不入 peers）。**
      **共同的處置原則：競爭對手可以當觀察對象，不可以當估值錨。**
      ｜⚠⚠ **而 3661 一納入就把 AVGO 那一檔已經建立的方法論拿去用了，這值得單獨記**：
      **`state/AVGO.yaml` 記載「EV/Sales 在 AI 加速器族群幾乎沒有鑑別力 ——
      MRVL 20.89／AVGO 19.51／NVDA 18.28，全距僅 14.3%，而營益率是 16.81%／48.59%／65.21%，
      差 3.9 倍；換分母後 EV／營業利益立刻爆開：124.3x／40.1x／28.0x」。**
      **3661 的檢查器直接沿用了這個發現，而不是重新想一遍。**
      **這是本清單第一次把一檔既有標的的方法論發現，直接用在另一檔的建檔上 ——
      而那正是把這些東西寫進 state 而不是寫進報告的目的。**
      ｜⚠⚠ **3661 帶進一個本清單此前沒有的損益形態，判讀時容易讀反：營收與毛利率反向移動。**
      **2026 Q1：營收年減約 60%，而毛利率 50.16% 創歷史新高（NRE 階段）；**
      **2026 Q2 起：營收爆發（8 月年增 +273.61%），而淨利率自約 34.8% 壓到約 21.4%（量產階段）。**
      **後果：對這一格的標的，「毛利率下降」不必然是壞消息，「毛利率創高」也不必然是好消息 ——
      必須同時看營收。而這正好與本清單其餘標的的直覺相反。**
      ｜⚠ **另記一個 3661 獨有的傳導時滯性質**：
      **它同時吃到 capex 的承諾段（NRE，高毛利低營收）與落地段（量產，低毛利高營收），
      兩段分在不同的損益科目、隔著數個季度。**
      **同一個 driver 上修，會先讓它的毛利率好看，再讓它的營收好看 ——
      扇出時必須先問「它現在在哪一段」，再判斷方向。**
  - pair: "⚠⚠ 3081 / AXTI — 直接的上下游買賣關係，且下游的法說一手證實了上游的 thesis"
    added: 2026-09-10
    note: >
      **AXTI 長 InP 單晶並切成基板；3081 買基板、在上面長磊晶層做成 CW 雷射與檢光器磊晶片。**
