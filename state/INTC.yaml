notes: >
  ⚠⚠⚠ **本檔最重要的一件事，是它讓層級軸在連續十三檔之後第一次真的被跨過 ——
  而原因不是本檔比較特別，是我這次去查了合併資產負債表。**
  **前十三檔的缺口全部是同一個動作沒做，而我在上一輪自己說過要把它變成固定步驟。**
  **這一條應該回填 references 的建檔檢查表。**
  ⚠⚠⚠ **而一查就發現它是本檔最關鍵的數字**：
  **非控制權益 **$15,601M**，占股東權益 $103,143M 的 **15.1%** ——
  Intel 的晶圓廠有相當一部分的經濟利益不屬於母公司股東，
  而公司指引 2027 與 2028 的非控制權益各約 **$1.1B／年**（GAAP）。**
  **亦即 forward PE 60.13 的分母每年要先扣掉約 $1.1B。**
  ⚠ **對照 2317 鴻海**：**我在那一檔發現「營業利益年增 68% 而稅後淨利只年增 30%」，
  三個候選解釋之一就是非控制權益，而我沒拿到數字。本檔拿到了，而它是 15.1%。**
  **兩檔合起來說明：非控制權益不是會計細節，是母公司股東實際拿到多少的問題。**
  ⚠ **四軸全跨（分母／參照／時間／層級）是本輪二十一檔中的第一次。**
  ｜⚠⚠⚠ **本檔是「擴建型 Q3」的第四例，也是最極端的一例 ——
  它擴的不是產能，是一整個還沒有客戶的事業。**
  **Foundry 部門單季虧 **$2.1B**，而全公司單季淨利只有約 **$2.2B**
  （EPS $0.42 × 5.25B 股）—— 產品端賺的約 $4.3B 被吃掉一半。**
  **而外部客戶營收只有 **$293M**，約該部門營收 $5.8B 的 **5%**。**
  ⚠⚠⚠ **但本檔同時揭露了「中週期正常化 EPS」的第三種失效方式，而它是新的。**
  **已知的兩種是：(1) 沒有中週期可正常化（3363 的 TTM EPS 為 -1.18、序列太短；
  AAOI 與 3081 同）；(2) 有完整循環可正常化（2337 旺宏，兩個預設錨都能用）。**
  **本檔是第三種：**有三十年豐富的循環歷史，但那個中週期屬於一家已經不存在的公司。**
  **Intel 的歷史描述的是「壟斷 x86 的 IDM」，而現在的 Intel 是「要變成代工廠的公司」——
  正常化會把答案帶回一家不存在的公司，而那比沒有歷史更危險，
  因為它會產出一個看起來很有根據的數字。**
  ⚠ **這一條應與「Q3 拆成循環型／擴建型」的建議一起寫進 references：
  拆分之後，擴建型的處方裡必須明寫「不要對轉型前的歷史做正常化」。**
  ｜⚠⚠⚠ **本檔與 TSM 是本清單**第二組**「循環引用」與「零和競爭」同時發生的配對**
  （第一組是 3363／3008 的 FAU）。
  **TSM 原本是 `foundry` 因子格內唯一一檔；本檔納入後變成兩檔，
  而兩檔搶的是同一批先進製程訂單 —— Apple 已收到 Intel 18A-P 的初始設計套件評估。**
  ⚠⚠ **但本組比 3363／3008 多一個必須保留的可能性，這一點不可省略**：
  **代工訂單可能是**新增**的（整體晶圓需求擴大）而非**轉移**的。**
  **若是新增，兩檔同向；若是轉移，兩檔零和。**
  **FAU 那一組的市場規模相對固定，轉移的成分高得多；先進製程不是。**
  **在分不清之前不可預設其中一種 —— 這是「零和」這個標記第一次需要附帶條件。**
  ｜⚠⚠⚠ **本檔在 driver 層的位置是清單此前沒有的：它同時在三個位子上，而方向不同。**
  **(a) 賣 CPU 給 CSP（與清單上賣硬體的標的同向）；
  (b) 賣代工產能給 AI 晶片設計商（那是 TSM 的位子）；
  (c) 是 NVDA 在資料中心運算上的競爭者。**
  ⚠⚠ **而更麻煩的是 (c) 與 (b) 在**同一檔內部**方向相反**：
  **加速器需求若完全由 GPU 吃下，對本檔的 DCAI 是排擠；
  但同一筆需求若走向自研 ASIC，本檔的代工那一層反而受惠。**
  **AVGO 那次記下的是「清單內兩檔之間方向相反」；
  本檔是「同一檔內部兩個通道方向相反」—— 那是新的，而且更難處理。**
  ｜⚠⚠ **三把尺的現值要並列著記，因為它們之間的落差就是 thesis**：
  **trailing PE **n/a**（TTM EPS -$2.30）、forward PE **60.13**、
  EV/Sales **9.88 倍**、市值／PPE **4.99 倍**。**
  ⚠ **對照昨日建檔的 2337 旺宏**：**那一檔是三個本益比差 3.7 倍（29.98／13.1／8.1），
  本檔的 trailing PE 根本不存在。**
  **兩檔都是「分母剛穿過零」，但穿過之後的高度完全不同 ——
  旺宏年化後是 8.1 倍，本檔年化後是 60 倍。而那才是估值的全部。**
  **「分母剛轉正」本身不是資訊；轉正之後到哪裡才是。**
  ｜⚠⚠ **技術面完全缺，而本檔還揭露了比值規則的第二個問題**：
  **本檔的日振幅只有 **3.66%** 而 Beta 是 **2.23**（本輪最高）——
  小區間是跳空造成的（當日最高 $103.23 低於昨收 $106.24），不是波動度低。**
  **用單日振幅當比值的分母在本檔會低估真實雜訊，應改用 20 日平均振幅（ATR）。**
  ⚠ **這是 2317 鴻海那條「絕對下界」之後，比值規則第二個需要修的地方：分母的穩健性。**
  **兩條應一起回填 references。**
  ⚠ **並記下本檔的 52 週全距是 **492%**（$24.05 → $142.35）、Beta **2.23**，
  兩者都是本輪二十一檔中最大的 ——
  一檔一年內走過 $24 到 $142 的股票，任何單一日的技術判讀能承載的資訊都很有限。**
  ｜⚠ **代號風險記在最後但優先級不低**：**INTC 是 Intel，INTU 是 Intuit，
  而 INTU 已在覆蓋清單內（標籤為 ai_application ＋ saas，與本檔毫無關係）。**
  **本倉庫第四次遇到代號近似的風險**（前三次：3413／京鼎、3221 台嘉碩／3211 順達、
  Aiptek 天瀚／6531 愛普）。
  **四次之中有三次是在同一週發生的 —— 這個頻率本身說明它不是偶然，
  而建檔前對一次「代號與公司名是否真的對得上」應該是固定步驟。**

