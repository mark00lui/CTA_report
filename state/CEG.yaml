    **FY2023／FY2024 的營運現金流為負（-5,301／-2,464）**，現金流的波動比盈餘還大。
    ⚠ **建檔時我把「避險部位的 mark-to-market」列為未經證實的解讀 —— 本輪它被一手文件證實。**
    ⚠ **建檔時「刻意不掛 cyclical 標籤」的決定因此獲得支持**：主因是評價擺盪不是電價循環。
