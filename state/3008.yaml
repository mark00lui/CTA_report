    （對照 8046：EPS 全距 3.04 倍、倍數 3.5 倍，兩者相當，屬連續型不確定性。）
    **→ 當全距來自二元事件時，加權平均是錯誤的統計量：它算出的是一個「CPO 有一半成功」的世界，
    而那個世界不存在。本檔該讀的是兩個分支（2,190 與 10,345）。已列為架構缺口
    （state schema 目前只容許連續式三情境）。**
    ｜**錨定價 6,870 → 6,660（-3.06%）。beta 首次取得 1.18 —— 本輪五檔台股最低
    （3037 2.34／8046 2.08／3189 1.84／2308 1.50），而 52 週振幅有 3.96 倍。
    5 年歷史 beta 對一檔剛經歷 CPO 重評價的股票未必代表前瞻風險，列缺口。**
    ⚠ **均線本輪未取得 → 右側確認無法重新判定。**
    ｜**評級維持偏空，而與 2308 那一輪（三根支柱兩根倒）相反，本檔的支柱變強了 ——
    四個口徑全為負：算術 -15.2%／base -24.5%／幾何 -26.6%／街上共識目標價 -22.73%。**
    ⚠⚠⚠ **但這對 conviction 是壞消息不是好消息：偏空與街上同向，亦即沒有差異化觀點。
    依 valuation.md 的精神「與市場一致」不是信心的來源 —— 模型說得出「這檔明顯錯價」才是，
    而本檔說的是「市場自己也知道它貴」。已列為判斷缺口。**
    ｜**缺口關閉 3 個（三年共識分布、beta、淨利÷營業利益對帳），新增 6 個** ——
