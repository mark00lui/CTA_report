    secondary: 錨 B（同業 —— 3017 的 forward PE **26.26x**，**本輪首次取得**）
    check: EV/Sales（⚠ **本輪未執行** —— 本檔 TTM 營收未取得，列 gaps）
  axes_crossed:
  - 參照（軸④：自身歷史 vs 同業 —— **本輪才跨過去**）
  - 時間（軸③：trailing 歷史 vs forward 換算）
  excluded: >
    ⚠ **錨寬度算不出來，而且是結構性的** —— **本檔無分析師覆蓋**
