signal:
  rating: 中性
  conviction: 中
  basis: FY27 EPS 指引還原 SBC 口徑後（$28.69–28.93）實際優於市場模型，34.6% 營益率搭配 11.0x 舊口徑估值已定價相當程度的結構性衰退；但 agentic AI 替代風險在 2027 報稅季前無法否證，技術面仍在 200DMA 之下缺乏右側確認。信心度 2026-08-27 當日兩次調整：先自「中」下修至「低」（base 倍數無有效錨），後於同日完成 reverse-DCF 後回升至「中」—— 錨 C 已建立，不再是無獨立估值基礎。回升的依據不是看法變樂觀，是做完了原本沒做的功課。DCF 的結論反而讓 base 顯得保守：15x 對應永續成長 +1.4%，若給 +2.5%~3%（仍遠低於 FY27 guidance 的營收 +9~10%）則每股價值為 405~441，高於 base 的 345
  changes_if: 站上 439.52 且 200DMA 轉揚 → 偏多；週收盤跌破 252.84 → 偏空；FY27 Q3（約 2027-05）TurboTax 付費件數 YoY 轉負 → 直接偏空，不等技術面
