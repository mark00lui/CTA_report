  reviewed: 2026-09-08
thesis: 液冷從選配轉為標配，2026 滲透率與單機價值量決定重評價幅度
thesis_since: 2026-08-27   # 產業側（accelerator-roadmap 功耗軌跡）與公司側（7月營收+117%、年度目標上修至+70%）於本日同時對上，論點成立日以此為準
valuation_base_year: 2026   # 曆年。首次設定；滾動至 2027 的時點為 Q3 財報（約 2026-11），屆時 2027 共識成形
base_year_outputs:   # ⚠ 2026-09-09 新增 —— 本輪循環性檢查全面觸發，位移測試首次做出來
  殘餘度: 0.33
  殘餘度_說明: >
    ＝ 剩餘未公告月份 4（9–12 月）÷ 12。**8 月營收已於 2026-09-08 公告，故自前次 0.42 降至 0.33。**
    ⚠⚠ **已明確低於 0.5 門檻**，依 SKILL.md：「殘餘度低於 0.5 時，當年度的結論必須降權，
    且**不得單獨作為方向判定依據**」。**而本檔目前只有 2026 這一個基準年**
    （2027 共識結構性取不到 —— 無分析師覆蓋，`/forecast/` 回 404）。
    **亦即：本輪的方向判定不得依賴估值，只能依賴 falsifier 與技術面。**
  循環性檢查: >
    ⚠⚠ **全面觸發，且本輪首次把位移測試做出來，結論是「基準年假象」。**
    現價 **1,375**（2026-09-09 收盤）｜base TP **1,376**，相對現價 **+0.08%**｜
    加權 TP 1,378，相對現價 **+0.2%**（前次為 +4.6% 與 +4.8%）。
    **現價隱含倍數 ＝ 1,375 ÷ 57.34 ＝ 23.98x，而 base 倍數為 24x —— 兩者幾乎完全相同。**
    ⚠ **但這不是「base 錨在現價」的方法錯誤，區別必須講清楚**：
    24x 是 2026-08-31 依**自身歷史**（AI 期間 trailing 32–35x 換算 forward 24.8–26.7x，
    取其下緣之下）設定的，**設定時現價隱含值為 21.80x**。
    **是價格漲上來碰到模型，不是模型抄了價格。** 性質不同，但後果相同 ——
    **在 2026 這個基準年上，本模型目前對市場沒有意見。**
  位移測試: >
    ✅ **依 valuation.md 的正確順序：先跑基準年位移測試，移出即判為基準年假象，不需進入獨立性辯護。**
    ⚠ 2027 共識不可得，故以自建成長率區間執行（**明示為自行推導，非查得值**）：
    ・2027 EPS ＝ 57.34 ×(1+20%) ＝ 68.8 → ×24x ＝ **1,651**，相對現價 **+20.1%**
    ・2027 EPS ＝ 57.34 ×(1+30%) ＝ 74.5 → ×24x ＝ **1,789**，相對現價 **+30.1%**
    ・2027 EPS ＝ 57.34 ×(1+40%) ＝ 80.3 → ×24x ＝ **1,927**，相對現價 **+40.1%**
    **三個成長假設全部移出 ±5% 帶外 → 判定為「基準年假象」。**
    ⚠ **含意**：「本檔目前大致合理定價」這個讀數**是用一個只剩三分之一的基準年算出來的**，
    不是一個估值結論。**不得在覆蓋層被聚合成「清單沒有明顯定價錯誤」。**
  敏感度網格: >
    EPS × 倍數，標 * 者落在現價 1,375 的 ±5% 內（EPS 取 FactSet 15 位分析師實際離散度）：
    ```
      EPS |     15x     18x     21x     24x     27x     30x     32x
    50.30 |    754     905    1056    1207    1358*   1509    1610
    53.80 |    807     968    1130    1291    1453    1614    1722
    57.34 |    860    1032    1204    1376*   1548    1720    1835
    60.00 |    900    1080    1260    1440*   1620    1800    1920
    62.60 |    939    1127    1315*   1502    1690    1878    2003
    ```
    ⚠⚠ **標記格呈明顯對角線分布（27x／24x／24x／21x 隨 EPS 上升而下降）——
    依 valuation.md，這正是基準年假象的證據**，與位移測試的結論一致。
    **兩個獨立的檢驗指向同一個結論，故該判定不是單一方法的產物。**
