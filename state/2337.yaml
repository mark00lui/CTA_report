# 公開研究檔 — 本倉庫不含任何倉位資訊：無成本、無數量、無權重、無 Kelly、無損益、無持倉揭露。
# 未知值一律留 __ 並寫進 gaps，不要填看起來合理的數字。
#
# ⚠⚠ 建檔當下最重要的五件事，寫在最前面：
#   (1) ⚠⚠⚠ **同一個價格、三個本益比，差 3.7 倍**：
#       **用 TTM EPS 約 4.22 元 → **29.98 倍**；
#       用 H1 2026 的 4.82 元年化 → 約 **13.1 倍**；
#       用 Q2 的 3.92 元年化 → 約 **8.1 倍**。**
#       **原因是 TTM 的分母裡還含著 2025 年下半年約 **-0.60 元**的虧損（推算，見 key_variables）。**
#       ⚠⚠ **而兩端各是一個陷阱**：**29.98 倍是「循環底剛翻正」的高 PE 假象；
#       8.1 倍是「峰值 EPS × 低倍數」的循環頂陷阱。**
#       **valuation-map 只寫了後者（「⚠ 說謊時：循環頂（低 PE 看似便宜）」）——
#       本檔同時展示了兩者，且三個數字都算得出來。**
#   (2) ⚠⚠⚠ **本檔是本輪第四檔 Q3，也是**第一檔「循環型」而非「擴建型」**。**
#       **而它證明了那個拆分建議**：**Q3 的兩個預設錨（PB／重置成本、中週期正常化 EPS）
#       在三檔擴建型（AAOI／3081／3363）身上全部失效，在本檔身上**兩個都能用**。**
#       **拆分現在有了對照組，不再只是三個個案的並列。**
#   (3) ⚠⚠ **刻意不標 `ai_capex_hw`，本輪第四次**（前三次 3533、8299、6531）。
#       **與 8299 群聯同一個理由，而本檔離 AI 更遠：驅動是 NOR Flash 全面漲價、
#       NAND 與 eMMC 供不應求、車規 eMMC —— 那是記憶體的價格循環。**
#   (4) ⚠⚠⚠ **月增率八個月全部為正，累計年增率八個月完全單調上升（51.41% → 149.14%）。**
#       **這是本輪第一檔兩條序列同時單調的。**
#   (5) ⚠⚠⚠ **而它讓「哪一條序列有訊息」的判準第一次寫得出一般式**：
#       **不是只看基期形狀，是看**訊號對雜訊的比**。** 見 monthly_revenue 註解。
