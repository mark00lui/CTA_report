valuation_frame:   # 2026-09-07 首次宣告。⚠ 本輪發現錨 C 形式成立但實質等於市場定價
  quadrant: Q1
  quadrant_basis: >
    **高盈餘代表性 × 低資本密集** —— 全清單唯一的 Q1。
    capex／營收僅約 **1.0%**（FY2026 capex 221M），遠低於 15% 門檻；
    SaaS 訂閱模式使當期盈餘具代表性；FY27 指引明確（營收 +9~10%、non-GAAP EPS +23~24%）。
    ⚠ 但有一個 Q1 少見的干擾：**FY2026 起 non-GAAP EPS 納入 SBC**，
    新舊口徑不可比（FY27 舊口徑 28.81 對新口徑 23.00），使自身歷史倍數失效。
  quadrant_since: 2026-09-07
  peer_group: SaaS／稅務與中小企業軟體
  peers:
  - ⚠ **同業同樣被 agentic AI 顛覆疑慮重評價，無乾淨可比者** —— 這是錨 B 失效的原因，非疏漏
  rank_metrics:
  - Online Ecosystem 成長率（ex-Mailchimp）
  - Non-GAAP 營益率
  - 自由現金流轉換率（⚠ **須扣 SBC 後再看**）
  methods:
    primary: 錨 C（reverse-DCF 反推市場隱含永續成長）
    secondary: P/FCF **扣 SBC 後**（TTM 8.62B 扣約 1.59B = 7.03B）
    check: 自身歷史 forward PE（⚠ **失效**：跨越 AI 疑慮前後，且 SBC 口徑改變）
  axes_crossed:
  - 分母（軸①：盈餘 vs 自由現金流）
  - ⚠ **軸④只跨到「市場價格反推」一點** —— 自身歷史失效、同業無乾淨可比。
    而市場價格反推**本身就以現價為起點**，這是本輪發現的問題根源（見 excluded）
  excluded: >
    ⚠ **不用自身歷史倍數** —— 5 年 forward 平均 31.22x 跨越 AI 顛覆疑慮前後，
    且 FY2026 起 non-GAAP 納入 SBC 使口徑不可比（歷史換算為新口徑約 39x）。
    ⚠ **不用同業倍數** —— 同業同樣被 AI 疑慮重評價，無乾淨可比。
    ⚠ **不可只報未扣 SBC 的自由現金流** —— TTM 8.62B 含約 1.59B 加回，
    扣掉後 7.03B，殖利率自 9.11% 降至 7.4%。**只報高的那個是選擇性揭露。**
    ⚠ **2026-09-07 新增最重要的一條：錨 C 不可只做到「描述市場假設」就停。**
    本輪內部檢查發現：market 隱含永續成長（r=9%）為 **+1.46%**，
    而本檔 base 15x 的隱含永續成長為 **+1.4%** —— **兩者實質相同**。
    而同一段論證主張市場過度悲觀（「假設 FCF 永遠只能跟上通膨甚至更慢，
    而公司 FY27 guidance 是營收 +9~10%」）。
    **論證說市場太悲觀，base 卻採用了市場的悲觀。**
    **形式上是錨 C，實質上是「base = 現價隱含值」** —— 那正是 valuation.md 的核心規則所禁止的。
    ⚠ 且**折現率仍未錨定**：r=8%／9%／10% 沒有可觀測錨與日期，
    valuation.md 已於 2026-08-31 點名本檔為三個未錨定實例之一，至今未補。
  reviewed: 2026-09-07
thesis: 護城河同時被 agentic AI 與低價競爭測試；管理層以自願降價重建漏斗換取更大付費基數，估值已定價轉型失敗，驗證要等 2027 報稅季
thesis_since: 2026-08-26
valuation_base_year: FY2027
scenarios:
  bear:
    p: 0.30
    p_basis: 機率由使用者於 2026-08-26 全量重估指定。AI 替代風險在 2027 報稅季前無法否證，屬不對稱的無知不可低估；但管理層連五季超預期，且本次侵蝕經證實來自價格而非 AI，故壓在三成而非更高
    key_assumption: 降價未換回件數；agentic AI 對 DIY 與記帳的替代真實發生；FY28 營收成長跌破 8%
