thesis: "爭點是毛利率 64.4% 是循環中段還是接近這一輪的頂"
thesis_since: 2026-09-10
# ⚠ 只留爭點，前提移入 key_variables 與 notes（LITE 那輪的教訓，AXTI 起沿用）。
#   前提（已確立、不是爭點）：**循環已經翻轉，而且幅度極大** ——
#   2026 Q2 營收 191.25 億元、毛利率 64.4%、EPS 3.92 元（季增 +336%、年增 +668%）；
#   8 月營收 81.45 億元（年增 218.53%，首破 80 億元）；
#   前 8 月累計 454.63 億元（年增 149.14%）；
#   月增率八個月全部為正，累計年增率八個月完全單調上升。
#   ⚠⚠ **為什麼爭點是「循環中段還是頂」**：
#   **價格已經給了 4.04 倍股價淨值比，而本檔去年下半年還在虧損（約 -0.60 元，推算）。**
#   **市場顯然已經在為循環定價；問題只剩下它定的是哪一段。**
#   ⚠⚠⚠ **而這件事有一個管理層自己給的、可以被否證的錨**：
#   **總經理法說時說「目前毛利率已接近 7 成，隨產能陸續開出、市況延續，
#   毛利率挑戰 8 成指日可待」。**
#   **若 Q3／Q4 的毛利率停在 64.4% 附近，那句話就沒有兌現，而循環中段的說法就要重估。**

