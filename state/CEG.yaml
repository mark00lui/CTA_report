notes: >
  ⚠ **本檔是覆蓋清單第 17 檔，也是第一檔「賣電給 AI，而不是賣硬體給 AI」的標的。**
  ｜⚠ **它帶進來的最重要的東西不是新產業，是新的傳導性質：存量 vs 流量。**
  現有 16 檔中有 15 檔曝險於「AI 資料中心**資本支出**」—— 那是流量。
  **本檔曝險的是資料中心的用電量，那是資本支出落成之後的存量。**
  **一座已建成的資料中心即使 capex 歸零仍然耗電。**
  ⚠ **這使它成為 INTU 之後第二個對 common_premise 的例外，但性質不同**：
  INTU 是**完全不在這條鏈上**；本檔是**在鏈上，但曝險於存量而非流量**。
  ⚠ **它不免疫** —— 新的 PPA 仍然要等新的資料中心蓋起來。
  **但既有合約的現金流不隨 capex 減速而消失，這是清單上其餘十五檔都沒有的性質。**
  ｜⚠ **本檔是 2026-09-01 以來第一檔讓 `ai_capex_hw` 占比下降的新增標的**
  （68.8% → 64.7%）。**前五次新增全部是刷新新高。**
  ｜⚠ **建檔時最該記的一件事：兩個會計口徑落在不同象限，這在本清單是第一次。**
  以 **GAAP** 看盈餘代表性低（EPS 5.01／11.89／7.40／10.33，高低差 2.37 倍；
  FY2023／FY2024 營運現金流為負）→ **Q3**；
  以 **Adjusted Operating Earnings** 看代表性高（22 位分析師的 FY2026 錨寬度僅 **5.78%**）→ **Q2**。
  同一個 FY2025，GAAP 7.40 對 Adjusted 9.39，**差 26.9%**。**依缺陷 3，兩個都記，不挑一個。**
  ⚠ **宣告 Q2，但方法組合刻意做成對這個歧義穩健** ——
  EV/EBITDA 同時是 Q2 的主錨且在 Q3 未被禁用，並額外保留 PB（Q3 的主錨）作為副錨。
  **兩個象限的處方交集就是這組方法。這不是騎牆：兩個口徑對 Y 軸完全一致，分歧只在 X 軸。**
  ｜⚠ **建檔時第二件該記的事：我這次真的做了 SEC EDGAR 掃描，而它立刻找到報價頁看不到的東西。**
  同日稍早我在 3030 的報告裡承認「我的公司行動掃描實際上是讀報價頁的 news sidebar，
  它有效，但那是運氣，不是設計」。**本檔改用 `data.sec.gov/submissions/CIK0001868275.json`，
  401 筆申報，找到三件事**：
  ・**2026-06-02 的 424B4 公開說明書**（配合 FWP 與 8-K）——
    **次級發行，Selling Shareholders 賣 11,000,000 股，公司不收取價款、對股數無稀釋**；
    同時公司自承銷商買回 **2,000,000 股**（約占流通股數 0.56%）。
    ⚠ **而正是這份文件證實了 Calpine 併購**（「shareholders who received shares in connection with
    our acquisition of Calpine Corporation」）—— **這是我對 TTM 期別錯配的判斷的一手依據。**
    文件另記 2026-05-29 收盤 **287.75**。
  ・**2026-08-21 的 Form 144**（內部人擬出售受限證券的通知）與多筆 Form 4。
  ・**2026-02-10 與 2026-04-20 的兩份 8-K/A**（已讀 2026-02-10 那份：內容為董事委員會任命，
    **與併購無關** —— ⚠ **這一點值得記：我原本以為 8-K/A 通常跟著併購來，實際讀了才知道不是**）。
  ⚠ **教訓不是「EDGAR 很好用」，是「不讀原文就會把申報類型當成內容」。**
  ｜⚠ **建檔時第三件該記的事：我立刻套用了同日 3030 的口徑教訓，而它派上用場了。**
  報價頁顯示 **299.99，標示 2026-09-08 04:07 EDT，是盤前不是收盤**。
  三處反推（PE 28.95、市值 105.92B、PB 3.32）全部指向 **298.96**（2026-09-04 收盤）。
  **price 採 298.96，與所有比率同口徑。** 若照 3030 建檔時的做法直接取 299.99，
  **六個衍生值又會全部差一天。**
  ｜⚠ **一個與清單其餘標的相反的地方：本檔的爭點是溢價，不是折價。**
  3030 對致茂折價 64.1%、3324 對 3017 折價 12.7%，而本檔對 VST 的 EV/EBITDA **溢價 54.7%**。
  **而我目前最懷疑的是這個溢價有相當部分是期別錯配** ——
  EV 含 100% 併購後淨負債，EBITDA 只含部分期間的 Calpine 貢獻。**分子完整、分母不完整。**
  ｜⚠ **同業的可用性問題本輪換了一種面貌，而這一種更難察覺。**
  名義 n=3（CEG／VST／TLN），但 TLN 的 EBITDA 僅 0.582B、ROE **-12.82%**、PE 為 n/a，
  其 EV/EBITDA 42.15 描述的是過渡期的分母；而 PB 三家完全不可比
  （VST 買回削薄權益使 BVPS 僅 8.95、TLN 為破產重整後 fresh-start、CEG 自 Exelon 分拆帶完整帳面）。
  **實際可比的只有 VST 一家。**
  ⚠ **與 3324 的 n=1、3030 的 n=1、COHR 的 n=2 是同一個盲區，本檔是第四次遇到 ——
  而這次是「看起來有 3 家」的版本。純粹的 n=1 至少一眼看得出來。**
  ｜⚠ **rank_metrics 三項中只有一項現在完整可用，而這已是連續第二檔（3030 亦然）。**
  **應視為我的流程問題而非個案：事先寫定排序指標時，沒有同時確認它取得得到。**
  下次 `/new-ticker` 的步驟 5 應多問一句：**這三個指標，我現在就能對每一個同業算出來嗎？**
  ｜業務：美國最大的無碳發電業者之一，核能機組為主，另有天然氣與再生能源，
  並經營零售與批發電力供應。⚠ **裝置容量與燃料結構本輪未取得，故上一句的「最大之一」
  不作為任何估值論證使用**，已列 gaps。

