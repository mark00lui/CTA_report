  ・**forward PE 的基準年未確認**（20.68 對 30.75，差 48.7%），錨 B 的分母不明。
  **依 valuation.md，錨都拿不到時應明寫並把信心上限壓到「低」。本檔正是那個情形，
  而它與 3030 那種「資料不夠」的低信心是兩回事 —— 這是「資料夠而尺不夠」。**
  ｜⚠ **換分母是本輪最有價值的一次操作，值得單獨記。**
  EV/Sales 的族群全距只有 14.3%，換成 **EV／營業利益** 立刻爆開為 **4.4 倍**
  （MRVL 124.3x／AVGO 40.1x／NVDA 28.0x）。
  **軸①（分母）不是形式要求，它在這裡是唯一讓族群顯出結構的那一刀。**
  ⚠ 而它給出的結論對本檔不利：**本檔對 NVDA 溢價 43.2%，
  而 NVDA 的營益率更高、自由現金流是本檔的 3.2 倍、且是淨現金對本檔的淨負債。**
  ⚠ **反論也已記下**：本檔的 TTM 嚴重落後 run-rate（EV/Sales 19.51x 對 Q4 年化 12.49x，差 56%），
  **在 run-rate 口徑下本檔可能反而最便宜 —— 但同業沒有同口徑數字，無法一致比較。**
  ｜⚠⚠ **thesis 來自一個 69 倍的對比，那是本倉庫至今最極端的一個。**
  49 位分析師對 FY2026 EPS 的分歧只有 **3.35%**（對營收更只有 **0.85%**），
  **而目標價從 215.88 到 715，錨寬度 231.2%。**
  **他們對這家公司賺多少幾乎完全同意，對那些盈餘值多少完全不同意。**
  **爭點百分之百在倍數，零在盈餘 —— 這直接決定了本檔的估值工作該做什麼。**
  ｜⚠ **EPS 錨寬度 3.35% 是全清單最窄（前次為 CEG 的 5.78%），但明確不因此升信心。**
  口徑是非 GAAP，且 FY2026 只剩 Q4 未公告而 Q4 已有明確指引。
  **窄反映的是「一年只剩一季且那一季已被指引」，不是「對價值有把握」。**
  ｜⚠ **與 CEG 的兩個對照，兩檔同日建檔，並列看更清楚。**
  **(1) GAAP 對非 GAAP 的落差，症狀相同而品質完全不同**：
  CEG 的 26.9% 來自**避險部位的評價擺盪（隨機、可正可負）**；
  本檔的 19.3% 來自**併購無形資產攤銷（可預期、逐年遞減）**。
  **同樣是「GAAP 不可用」，一個是雜訊、一個是排程。**
  **(2) 技術面恰好互為鏡像**：CEG 是價格站上兩線而 50DMA 低於 200DMA；
  本檔是**價格跌破兩線而 50DMA 高於 200DMA**。**兩者都不構成右側確認。**
  ｜⚠ **排序指標的取得性，這次在建檔時就先驗證了 —— 這是流程修正生效的第一次記錄。**
  3030 與 CEG 連兩檔都出現「三個事先寫定的排序指標只有一個可用」，
  我當時記下「應視為流程問題：事先寫定指標時沒有同時確認它取得得到」。
  **本檔在寫定前先查：營益率與 EV／營業利益三家皆已取得（三分之二可用），
  AI 占比只有本檔有（口徑亦不同，即使取得也需先對齊定義）。**
  ｜⚠ **本檔在覆蓋層帶進一個此前不存在的結構：清單內部的方向相反。**
  本檔的 AI 營收**就是**超大規模業者自研加速器的採購金額 ——
  **若某家 CSP 自研轉外購（改買 NVDA），對本檔是營收減項而對 NVDA 是利多。**
  **這是清單內第一次出現「同一則消息對兩檔覆蓋標的方向相反」的結構性關係。**
  ｜⚠ **並由此發現 `ai-accelerator-demand` driver 的一個實質口徑缺口**：
  該 driver 的 current 明寫「NVDA + AMD，**不含**自研 ASIC」，
  **而本檔的 AI 營收正是被排除的那一塊，已達單季 16.7B、指引 21.7B、年增 221%。**
  **該 driver 的現值系統性低估了加速器總需求，且低估幅度正以三位數年增率擴大。**
  已列 gaps，應走 `/driver` 檢討 —— ⚠ 但需先決定「自研 ASIC 是否併入」，
  **併入會改變該 driver 全部十一條 transmission 的解讀。**
  ｜業務：半導體解決方案（AI 自研加速器、網通、寬頻、無線、儲存）與基礎設施軟體
  （VMware 為主體）。⚠ 會計年度結束於 **11 月 1 日**，與清單上其餘美股皆不同，
  **跨檔比較「本年度／次年度」時必須先對齊，這是本檔最容易出錯的口徑。**

