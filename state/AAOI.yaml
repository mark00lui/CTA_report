    ⚠⚠ **而最重要的一個比率是 129% 對 D&A／營收的 5.92%（35.3 ÷ 595.97）。**
    **這個落差本身就是結論：正在蓋的資產尚未投入服務、尚未開始折舊。**
    **它開始折舊的那一天，損益表會有一次階梯式的衝擊，而那一天還沒到。**
    ｜FCF TTM **-9.0045 億美元**；OCF TTM **-1.3182 億** —— **營運本身在燒錢，這還沒算 capex。**
    淨現金 **+1.996 億**（現金 4.9974 億 − 總負債 3.0014 億），
    ⚠ **但那是募資的快照，不是獲利能力的快照** —— TTM 發行新股 **13.51 億美元**。
    ｜⚠⚠ **本檔是覆蓋清單第一檔以「擴建」而非「商品循環」進入 Q3 的標的。**
    valuation-map 的 Q3 名單（MU／SNDK／3037／8046／6239）**全部帶 cyclical 標籤，本檔沒有。**
    **這是對地圖本身的一個發現：Q3 可以由資本支出擴建到達，不只由循環到達。**
    ⚠ **而 Q3 的處方對本檔恰恰是對的** —— 不做 DCF、不算 PEG、看資產與正常化，
    **對一家從未賺過營業利益的公司，這正是應該做的三件事。**
