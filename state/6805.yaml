driver_refs:
- driver: hyperscaler-capex
  direction: '+'
  note: >
    CSP 資本支出 → AI 伺服器機櫃數 → **液冷快接頭**（並已延伸至機櫃 Rack Mount 層級）。
    一手佐證：**AI 伺服器相關應用營收占比自去年同期 19.2% 拉升到 55.7%**，
    **液冷快接頭產能已逼近滿載**，多項新專案自 2026 Q3 起陸續投產；
    2026 前 8 月累計營收 **108.12 億元（年增 49.81%）**。
    ⚠⚠ **但本檔在本 driver 上有一個必須寫死的限制**：
    **伺服器那 55.7% 的內部組成（液冷快接頭／其他伺服器零件的比例）完全未取得。**
    **「液冷快接頭產能逼近滿載」是管理層的定性陳述，不是一個占比數字 ——
    扇出時不可把 55.7% 整塊當成液冷曝險。**
    ⚠ **另一個限制：產能已逼近滿載，意味著本 driver 上修在短期打不進營收。**
    **上限由產能決定而非需求決定，這一點與 3081 相同。**
- driver: accelerator-roadmap
  direction: '+'
  note: >
    機櫃功率密度上行 → 氣冷見頂 → 液冷由選配轉標配 → 快接頭與 Manifold 需求。
    ⚠⚠ **本檔與 3324、3017 在同一個液冷迴路上，但不是同一個零件**：
    **3324 與 3017 做水冷板、分歧管（Manifold）、機殼；本檔做快接頭（Quick Disconnect）。**
    **相鄰而非替代 —— 液冷滲透率上修對三檔同向，且三檔之間不是零和的。**
    ⚠ **這與同日 3324／3017 那一組（直接同業、零和）性質不同，扇出時不可混用。**
    ⚠ **但仍明文禁用 3324 與 3017 作為本檔的估值錨**，理由見 notes 的通則。
- driver: ai-accelerator-demand
  direction: '+'
  note: >
    加速器出貨 → 機櫃數 → 液冷零件出貨。
    ⚠ **敏感度記「中」**：**本檔有約 44% 的營收仍在消費電子（手機與筆電轉軸），
    不受本 driver 影響。** 扇出時必須先乘上 55.7% 這個占比。
    ⚠ **且消費那一半有自己的循環** —— 管理層提及華為三折與左右折新機轉軸備貨順利、
    **價格平穩**，以及大尺寸柔性螢幕催生可撓式 PC 與電子書的新應用（年底至明年陸續貢獻）。
    **那是一條與 AI 無關的需求線，現有三個 driver 沒有任何一個記它。**

valuation_frame:
  quadrant: Q4
  quadrant_basis: >
    **X 軸（當期盈餘代表性）＝ 低，而本檔的機制是「營收組合在一年內翻轉」。**
    ⚠ **分母沒有壞掉**：TTM EPS **46.75 元**（財報狗）、H1 2026 EPS **25.77 元**
    （稅後純益 17.66 億元，**年增 +157%**）、Q2 2026 EPS **12.39 元**（年增 **+157.05%**）。
    ⚠⚠ **但 AI 伺服器相關應用的營收占比自去年同期 19.2% 拉升到 55.7%，
    正式成為公司最大營收來源 —— 這不是成長，是換了一門生意。**
    **任何 trailing 倍數的分母裡，有四分之三以上的期間描述的是舊的那一門。**
    ⚠ **而成長率也遠離穩態**：累計營收年增率自 1 月的 **115.76%** 單調降到 8 月的 **49.81%**，
    H1 稅後純益年增 **+157%**。
    ⚠⚠ **另記一個 X 軸的負面證據，它同時是 thesis 的起點**：
    **Q2 營收季減 10.08%，管理層的解釋是「手機與伺服器新舊產品交替」——
    亦即這是一門按專案計的生意，營收天生是塊狀的。**
    **一個季度的數字能不能代表常態，在這種商業模式裡本來就要打折。**
    ｜**Y 軸（資本密集度）＝ 低。** ⚠ **實際 capex／營收 與折舊占營收比重皆未取得（列 gaps）。**
    判低的依據是兩個已取得的比率：
    **股價淨值比 17.68**（每股淨值僅 **129.86 元**，淨值約 **89.0 億元**，
    對市值 **1,573.31 億元**）—— **本日第二高的 PB，僅次於 3081 的 56.17；
    市場完全不是在買資產。**
    **股東權益報酬率約 36.0%**（TTM 淨利約 32.04 億元 ÷ 淨值約 89.0 億元）——
    **資本密集的生意做不出這個數字。**
    ⚠ **但保留一句**：**轉軸與快接頭都是精密金屬加工（沖壓、模具、CNC），
    不是輕資產的設計業。在取得實際 capex 之前，這一格是用比率推的，不是量到的。**
    ｜⚠⚠ **結論：低 X ＋ 低 Y ＝ Q4（營收與選擇權）。本日十檔中第六檔落在 Q4。**
    ⚠ **而 Q4 的預設主錨 EV/Sales 在本檔同樣不能直接用** ——
    **本檔是兩門生意（伺服器 55.7%、消費電子約 44.3%），倍數結構完全不同。**
    **這與 AAOI（資料中心 56%／CATV 42%）是同一個問題，處置也相同：分部別拆解。**
