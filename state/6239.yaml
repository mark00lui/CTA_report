  │      用它當 base 錨等於把一個已不存在的產業 regime 搬進來。
  ├ ⚠ **最直接的證據**：18x **低於超豐的 21.09x，而超豐是力成自己的子公司**。
  │      那不是判斷偏保守，是一個站不住的位置。
