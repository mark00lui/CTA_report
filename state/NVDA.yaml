  summary: 全清單重估 — 更正 8/27 的實質錯誤，base 倍數 28x → 30x，加權目標價 242 → 255（+5.4%）
  delta: >
    ⚠ **更正**：8/27 的 base multiple_basis 寫「EPS 成長將自 +106% 大幅減速至約 +14%，
    折價有理」—— +14% 對不上任何數字。FY2027 共識 EPS 9.27 的年增率是 **+94.4%**
    （61 位分析師，前一年約 4.77）；+106% 則是 Q2 單季**營收** YoY。我把兩個口徑不同的
    成長率並列成一個「大幅減速」敘事，而那正是合理化 31% 折價的一半理由。
    ⚠ 且事實往相反方向走得更遠：管理層 2026-08-26 給出 FY2028 營收成長約 +70% 的遠期指引
    （隱含營收接近 700bn，而街上原本模型化約 570bn／+44%），並明言為供給受限而非需求上限。
    判斷因此自【部分合理】改為【大部分不合理】，base 28x → 30x（半導體業 forward 中位
    30.36x 的整數），bull 32x → 34x（自身近 2 年 forward 平均）。base EPS 9.3 → 9.27
    對齊 61 位共識。加權 242 → 255。
    折價收斂但未消除，保留部分對應三項本週法說揭露的真實負面：(1) 毛利率因記憶體成本
    自 74% 滑至 Q4 觸底 71–72%；(2) TTM 自由現金流 127.01bn 顯著低於淨利而 capex 僅
    7.35bn —— 缺口是營運資金不是資本支出，P/FCF 41.36x 為 forward PE 18.04x 的 2.3 倍；
    (3) 季增金額由 146bn 降至 118bn 的增量收斂。
    ⚠ **基準年維持 FY2027 而不滾動至 FY2028**，這是本次最需要交代的判斷：市場已在看
    FY2028（forward PE 18.04x 隱含 EPS 12.06），但該值建立在 +44% 的舊假設上；且我的
    倍數錨全部是 NTM 基準，套到更遠期會犯與 trailing/forward 混用同類的錯誤。
    改讓 FY2028 指引影響**倍數**而非分母 —— 指引是關於成長持續性的資訊，而持續性正是
    倍數該定價的東西。⚠ 代價：若 FY2028 真做到 +70%，30x × 9.27 會顯得太保守。
    下次重估（約 2026-11）取得可用 FY2028 共識時應正式滾動並明確標示基準年變更。
    ⚠ **第二條 falsifier 需修訂**：現行門檻「non-GAAP 毛利率連兩季低於 72%」會被公司
    自己的 Q4 指引（71–72%）觸發，而那不是壞消息（成本非需求）。本次先標示，下次改寫。
    現價 219.53 → 217.55（8/28）。街上目標價 305.79 → 323.42（61 位）。
    ⚠ 型態：我的 bull 323 幾乎等於街上均值 323.42，8/27 版本亦然（bull 304 對 305.79）——
    街上把我認為需要三件事同時發生的情境當成中心預期，這是連續兩次出現的結構。
    ⚠ 評等分布出現 1 個強力賣出（8/27 為 0）。單一分析師不構成訊號，但值得追蹤。
    機率沿用前值 0.25/0.50/0.25，未重評。訊號維持中性／信心中。
