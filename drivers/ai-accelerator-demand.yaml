  - {question: "自研 ASIC（TPU／Trainium／MTIA）出貨與營收無公開揭露，本檔 components 留 __，故 current 為下限而非全貌", how_to_close: "供應鏈查證；四大 CSP 財報 Q&A；跨來源比較前先確認成分"}
  - {question: "AMD Q3 2026 資料中心分部指引未取得（僅取得管理層『下半年加速』的定性說法）", how_to_close: "AMD Q2 2026 法說逐字稿或財報附件"}
  - {question: "各家資料中心營收中『AI 加速器』與其他（網通、伺服器 CPU）的拆分。AMD 的 6.7 明確含 EPYC CPU，與 NVDA 的口徑不同", how_to_close: "財報 10-Q 分部附註；多數不單獨揭露"}
