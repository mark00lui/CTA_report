# (3) **六檔台股中第一檔 PE 可直接當錨的。** 三年 trailing 區間 6.34–45.12（跨 7 倍），
#     而 8046 為 7.82–726.25（跨 93 倍）、3037 因分母趨零失效、3008 需靠新聞來源。
#     6239 的獲利未在谷底歸零，錨 A 成立。
#
# ⚠ 但代價寫在資本支出上：2026 計畫 400 億元對 2025 的 190 億元，capex／營收約 **42%**，
