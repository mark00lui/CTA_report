# 覆蓋層分析 — 這不是投資組合，是研究覆蓋清單。
# 本檔不含權重、部位、持倉方向。因子分析以「等權覆蓋」為基準，
# 目的是量測這批標的的論點相依性，不是描述任何人的股權配置。
as_of: 2026-08-27

coverage:                 # 追蹤清單（研究覆蓋，非投資組合）
  - {ticker: TSM,  market: US, tags: [ai_capex_hw, foundry, tw_fx]}
  - {ticker: NVDA, market: US, tags: [ai_capex_hw, accelerator]}
  - {ticker: MU,   market: US, tags: [ai_capex_hw, memory, cyclical]}
  - {ticker: SNDK, market: US, tags: [ai_capex_hw, memory, cyclical]}
  - {ticker: MSFT, market: US, tags: [ai_platform, saas]}
  - {ticker: GOOG, market: US, tags: [ai_platform, advertising]}
  - {ticker: META, market: US, tags: [ai_platform, advertising]}
  - {ticker: INTU, market: US, tags: [ai_application, saas]}
  - {ticker: 3324, market: TW, tags: [ai_capex_hw, thermal, tw_fx]}
  - {ticker: 6442, market: TW, tags: [ai_capex_hw, optical, cpo, single_customer]}
  - {ticker: 3008, market: TW, tags: [optical, cpo, consumer_optics]}
  - {ticker: COHR, market: US, tags: [ai_capex_hw, optical, cpo]}

# 等權基準下的因子分布（12 檔各佔 1/12 = 8.3%）
# 這是覆蓋清單的結構描述，與任何實際配置無關
equal_weight_factor_mix:
  ai_capex_hw:    {count: 7, pct: 58.3, note: "TSM + NVDA + MU + SNDK + 3324 + 6442 + COHR — 同一條需求鏈。2026-08-27 納入 COHR 後自 54.5% 升至 58.3%，為歷來最高"}
  ai_platform:    {count: 3, pct: 25.0, note: "MSFT + GOOG + META — 支出方；capex 縮手時它們先反應，硬體端後反應"}
  ai_application: {count: 1, pct: 8.3,  note: "INTU — 唯一與 capex 因子低相關的標的；占比自 14.3% 五度稀釋至 8.3%"}
  accelerator:    {count: 1, pct: 8.3,  note: "NVDA — 加速器供應端。同時是 drivers/ai-accelerator-demand 的主要成分"}
  memory:         {count: 2, pct: 16.7, note: "MU + SNDK — 記憶體供應端。⚠ 清單內唯一「營收即他檔成本」的一組。⚠ 2026-08-27 SNDK 重估後修正：兩檔同向但不等深 —— NAND 上一輪谷底毛利率為負（WD Flash −11.9%），DRAM 為 2.7%，且 MU 有 HBM 的先進封裝瓶頸、SNDK 無對等結構"}
  cyclical:       {count: 2, pct: 16.7, note: "MU + SNDK — 商品循環股。其餘標的的風險來自論點，這兩檔的風險來自循環位置"}
  cpo:            {count: 3, pct: 25.0, note: "6442 + 3008 + COHR — ⚠ 2026-08-27 當日自 0 檔成長到 3 檔。三者切入點不同（6442 光通訊產品、3008 自 FA／PMLA／FAU 光學元件端、COHR 自磷化銦雷射與收發器垂直整合）但共用同一個「CPO 是否如期放量」前提。⚠ 但 COHR 的加入同時帶來反向效果：它是三者中唯一給出第一手時程（初期營收 2026 年 12 月當季、scale-up 曆年 2027 下半）的標的，因此雖然加深了因子集中，卻讓這個共同前提第一次變得可外部檢驗。集中度與可檢驗性同時上升，這在本清單是第一次"}
  optical:        {count: 3, pct: 25.0, note: "6442 + 3008 + COHR"}
  consumer_optics: {count: 1, pct: 8.3, note: "3008 — 清單中唯一營收基礎在消費性電子（手機鏡頭）而非 AI 的標的"}
  tw_market:      {count: 3, pct: 25.0, note: "3324 + 6442 + 3008，含匯率與地緣風險。台股占比因分母變大自 27.3% 稀釋至 25.0%，且三檔的技術面資料都受同一個系統性缺口影響（報價頁 JS 動態渲染）"}
  non_ai:         {count: 0, pct: 0.0,  note: "⚠ 仍為 0，儘管 3008 的營收基礎是消費性光學。理由見下方 3008 專屬註記 —— 驅動它股價的是 CPO 不是手機鏡頭，所以它填不了這個洞"}

common_premise: "12 檔中有 11 檔共用同一前提：AI 資料中心資本支出在未來 8 個季度不會出現實質減速。這是本覆蓋清單的單一失效點 — 個股層分析再深也看不見它。2026-08-27 納入 NVDA、MU、SNDK、3008、COHR 後，例外仍只有 INTU 一檔。"

# ⚠ COHR Coherent：清單中第一次出現「新增標的同時加深它自己的每一個因子」。
# 它帶的三個標籤全部上升，沒有一個被稀釋：
#   ai_capex_hw  54.5% → 58.3%（歷來最高）
#   optical      18.2% → 25.0%
#   cpo          18.2% → 25.0%
# 前幾次新增至少有一個方向是稀釋的（納入 3008 時 ai_capex_hw 自 60.0% 稀釋回 54.5%）。
# 這次沒有。分母變大帶來的稀釋效果，被它自己的三個標籤全部抵銷。
#
# 但這次加深有一個前幾次沒有的性質，必須一併記下來，否則會誤判：
# **COHR 是三檔 cpo 標的中唯一提供第一手時程的。** 6442 與 3008 的 CPO 假設目前都只有
# 各自管理層的說法，沒有外部座標可對照；COHR 給了具體時點（初期營收 2026 年 12 月當季、
# scale-up 曆年 2027 下半、逾 150 億美元增量可及市場），而且它已投片、有客戶專案。
# 因此 COHR 的第三條 falsifier（CPO 初期營收未於 2026 年 12 月當季認列）同時是
# 6442 與 3008 的檢驗點 —— 若連 COHR 都遞延，那兩檔的「2027 年中放量」需一併重審。
#
# 結論：**集中度與可檢驗性同時上升。** 這兩件事通常反向，本次同向，是罕見情形。
# 判讀時不要只看 25.0% 就認定 cpo 曝險惡化了三分之一 —— 它確實惡化了，
# 但同時第一次有了可以提前知道自己錯了的機制。
#
# ⚠ 另需分清：COHR 的「FY2027 售罄」不可外推到 6442。COHR 是垂直整合的元件與模組廠
# （自製磷化銦雷射到收發器），6442 是光通訊產品廠且單一客戶占比 63% ——
# 族群需求對 6442 不等於訂單，這一點 6442 自己的 driver_refs 已註明。
#
# ⚠ 待查：3008 切入的 FA／PMLA／FAU 光纖陣列模組位於 CPO 封裝的上游環節，
# 而 COHR 提供 CPO 用的超高功率連續波雷射。兩者在同一條鏈上但不同位置，
# 目前無直接證據顯示是競爭關係 —— 但也無證據顯示不是。納入 COHR 後新出現的問題。

# ⚠ 3008 大立光：一個看起來能分散、實際上不能的案例
# 它的營收基礎是消費性光學（手機鏡頭），與 AI capex 無關 —— 表面上正好補上 non_ai 的 0.0%。
# 但納入當日（2026-08-27）它以連續第二根漲停作收、三日 +28.41%、創歷史新高，
# 而催化劑全部來自 CPO：首張訂單到手、量產客戶規格文件已收、8/25 再砸 30.8 億元購置廠房
# （今年第 4 度、累計 56.49 億元）。
#
# 換句話說：**驅動它股價的不是它的營收基礎。** 買進它等於買 CPO，不是買手機鏡頭。
# 因此 non_ai 維持 0，而 cpo 由 1 檔變 2 檔 —— 那才是這次新增真正加深的因子。
#
# 這個案例的一般性教訓值得記下來：判斷一檔標的能否分散清單，要看「什麼在驅動它的股價」，
# 不是看「它的營收來自哪裡」。用產業分類做分散度檢核會在這裡失效。

# ⚠ 納入 SNDK 幾乎是把記憶體曝險加倍，而不是分散。
# MU 與 SNDK 是同一個循環的兩個切面：毛利率同為 84.6%（巧合但說明問題）、同樣由漲價
# 驅動、同樣面對 CY2027H2 的新產能、同樣以 6–7x 的循環峰值倍數交易。
# 兩檔的差異只在 (1) SNDK 純 NAND、MU 含 DRAM 與 HBM，故 HBM 的結構性論證只適用於 MU；
# (2) SNDK 明確拆分了量價貢獻（三分之二來自漲價），MU 沒有。
# 判讀清單分散度時，memory 這一格的 20.0% 應被視為「一個部位的兩種寫法」而非兩個獨立賭注。
# 但第 (2) 點也讓 SNDK 成為判斷整個記憶體循環位置的較佳指標 —— 它的量價拆分是可檢驗的，
# MU 的不是。若要用一檔追蹤循環轉折，看 SNDK 的漲價貢獻比看兩檔的毛利率更早。

# ⚠ 納入 MU 帶來一個前八檔都沒有的性質：它的營收就是清單其餘標的的成本。
# 記憶體漲價是 Meta 與 Amazon 上修 2026 capex 時各自明確點名的原因；TrendForce 另估
# 記憶體將占 CSP capex 的 68%（二手引用，原始報告未取得）。因此 MU 在需求維度上與其餘
# 硬體端同向（加深集中），卻在成本／毛利維度上與平台端和加速器端反向。
# 這不是分散 —— 它們共用同一個 common_premise；但在該前提成立的前提下，
# MU 與其餘標的的獲利分配是零和的。判讀清單內的相對強弱時必須把這一層分開看。

# 納入 NVDA 使既有的因子集中「加深」而非分散，這一點必須寫明：
# NVDA 是這個共同前提最純粹的單一表述 —— 它沒有非 AI 業務可以緩衝（Edge 僅占 Q2 營收 7.5%），
# 也沒有像 MSFT／GOOG 那樣的訂閱或廣告基底。若共同前提失效，它不是「跟著受傷」，而是震央。
# 換句話說：這次新增提高了清單的解析度（多了供應端的第一手視角），但降低了它的分散度。

shared_falsifier:
  condition: "任兩家超大型 CSP 在同一季下修資本支出 guidance"
  action: "觸發全覆蓋清單 L3 review，不是單一個股"
  status: 未觸發

correlation_watch:
  - {pair: "TSM / 3324", note: "同受 AI 伺服器出貨量驅動，相關性高"}
  - {pair: "TSM / 6442", note: "終端需求同源，但 6442 受單一客戶影響更大"}
  - {pair: "MSFT / GOOG / META", note: "廣告與雲的景氣循環不同步，但 AI 支出敘事同步"}
  - {pair: "INTU / 其餘", note: "應為低相關 — 每季實測一次，若相關性上升代表這個假設失效"}
  - {pair: "NVDA / TSM", note: "預期為清單中最高的一組。NVDA 的出貨就是 TSM 的投片，中間只隔一道代工。若這兩檔相關性「下降」才是異常，通常意味自研 ASIC 比重上升或庫存在通路端堆積"}
  - {pair: "NVDA / 3324、6442", note: "NVDA 領先 2–3 季（散熱與光互連晚於晶片）。同步而非領先的相關性代表傳導假設有誤"}
  - {pair: "COHR / 6442", note: "同在光互連鏈上但性質不同 —— COHR 垂直整合（自製磷化銦雷射到收發器）且 FY2027 售罄、供給受限；6442 為光通訊產品廠且單一客戶占比 63%，屬需求受限。⚠ 預期相關性中等而非高：若兩者相關性「上升到高」，代表 6442 的單一客戶因素被族群需求蓋過，那是 6442 論點改變的訊號"}
  - {pair: "COHR / 3008", note: "⚠ 關係未定。3008 的 FA／PMLA／FAU 位於 CPO 封裝上游，COHR 供 CPO 用超高功率連續波雷射，同鏈不同位置。無證據顯示是競爭關係，也無證據顯示不是。在釐清之前，不要把兩者的 CPO 進度當成獨立的兩個觀測值"}
  - {pair: "COHR / 其餘硬體端", note: "COHR 的 Beta（5年）2.11 為清單最高。共同前提鬆動時它的反應會被放大 —— 用它當共同前提的早期溫度計可能有效，但要先排除單一標的的特有因素（如目前尚無解釋的財報後回檔 32.9%）"}
  - {pair: "NVDA / MSFT、GOOG、META", note: "方向刻意相反：加速器採購對 NVDA 是營收，對平台端是折舊。若四者同向大漲或大跌，代表市場在交易整體 AI 敘事而非個別基本面 — 那是清單分散度最低的時刻"}
  - pair: "GOOG / NVDA / MSFT（＋清單外的 AMZN）— 股權投資評價利益"
    added: 2026-08-27
    note: >
      一條與營運無關、卻會讓帳面數字同向移動的連結，2026-W35 才發現。四家的 GAAP 獲利都被
      對 AI 標的的股權投資評價利益灌水：GOOG 的股權證券（Q2 EPS 9.11 → 正常化約 2.87）、
      NVDA 的 CoreWeave 等（GAAP 2.46 > non-GAAP 2.22）、MSFT 的 OpenAI（GAAP 17.95 >
      non-GAAP 17.28）、AMZN 的 Anthropic（Q2 GAAP EPS 5.75 含 53.4B 利益）。
    implication: >
      (1) 用未經調整的 GAAP 或 TTM EPS 算這批標的的本益比會系統性低估估值水準 —— GOOG 最極端，
          表面 17x、正常化後 25x 以上。本倉庫一律改錨正常化 EPS。
      (2) 同一批 AI 資產的評價波動會同時推升或壓低多檔的帳面獲利，這是傳統因子分析看不見的
          相關性來源。若這批被投資標的（OpenAI、Anthropic、CoreWeave 等）同步重評價，
          三檔覆蓋標的的 GAAP 獲利會同向跳動，而營運面完全沒變。
    check: 每季核對各家調節表，確認正常化口徑仍被正確排除
  - pair: "MU / NVDA — HBM 成本"
    added: 2026-08-27
    note: >
      方向相反且直接。HBM 是加速器的主要 BOM 成本之一，MU 的定價權就是 NVDA 的成本壓力。
      TrendForce 估 HBM 合約價 2027 年可能再漲 70–140%（二手引用）。
    implication: >
      NVDA Q3 FY27 毛利率指引由 75.0% 降至 74.0%，本倉庫先前歸因於 Vera Rubin 換代爬坡；
      HBM 成本上漲是第二個候選解釋。前者暫時、後者結構性，意涵相反。
      目前無證據區分 —— 若 NVDA 毛利率在 Rubin 出貨占比提高後仍未回升，第二個解釋的權重上升。
    check: NVDA 每季毛利率 vs MU 的 HBM 定價與出貨
  - pair: "MU / MSFT、GOOG、META — 記憶體即 capex 通膨"
    added: 2026-08-27
    note: >
      MU 的營收是平台端的成本。Meta 與 Amazon 上修 2026 capex 時都明確點名記憶體價格。
      這使 capex 金額上修不等於運算量等比上修 —— 同一筆預算能買的算力被記憶體通膨稀釋。
    implication: >
      對硬體端而言這是壞消息（capex 的含金量下降），對 MU 是好消息，對平台端是雙重打擊
      （支出變高、且買到的算力變少）。同一則「capex 上修」新聞在清單內至少有三個方向。
    check: drivers/hyperscaler-capex 的 gaps 已列「各家 capex 中 AI 相關實際占比」，記憶體占比是其子問題

review_cadence:
  weekly: "事件流回顧 + 共同前提檢核 + 未來兩週檢驗點"
  monthly: "陳舊變數清理 + 相關性實測"
  quarterly: "全部 thesis 重審一次，不論有無事件"
