scenarios:
  # ⚠ **口徑**：三個 exit multiple 一律為 **trailing**、套用在 2026 EPS 上
  #   （評價基準時點設在 2026 年底，屆時 2026 EPS 就是 trailing EPS）。
  # ⚠ **2026-09-01 第三次重估：本次的修正來自使用者的一個正確批評 ——
  #   base 與 bull 的差距過大。追查後發現原因不是機率、也不是 EPS，而是我只用了錨 A。**
