    Y 軸判低（股價淨值比 **7.62**、ROE 約 **21.0%**、股東權益週轉率約 1.72 倍），
    ⚠ capex 未取得，且**併入 XFS 之後的資產結構變化未取得**。
    ｜⚠⚠ **本檔提供了「invalidation 必須用比值不能用絕對百分比」最乾淨的一次證明**：
    **3211 順達的季線距現價也是 +5.19% —— 完全相同的絕對距離。**
