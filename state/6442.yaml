cta:
  位階: 站上六條均線中的五條，但半年線仍在季線之上，且量能明顯萎縮 — 8/31 收 1,630 高於 MA5(1,577)、MA10(1,568)、MA20(1,502.5)、MA60(1,573.67)、MA240(1,493.53)，惟低於 MA120(1,773.54)。⚠ MA120 > MA60 > MA240，半年線在季線之上，中期下降結構未翻轉。距 52 週高 2,540 為 -35.8%
  price: 1630
  key_ma: MA5 1,577 / MA10 1,568 / MA20 1,502.5 / MA60 1,573.67 / MA120 1,773.54 / MA240 1,493.53
  support: 1,573.67 (MA60 季線) → 1,502.5 (MA20) → 1,493.53 (MA240 年線)
  resistance: 1,773.54 (MA120 半年線) → 2,540 (52週高)
  invalidation: 週收盤跌破 1,493.53 (MA240 年線) → 偏空；跌破 1,573.67 (MA60) 為第一道警訊
  confirm_trigger: 放量站上 MA120 的 1,773.54 並守住（⚠ 本日量能僅為 20 日均量的 0.49 倍，「放量」目前完全不成立），再突破 2,540
  updated: 2026-08-31
  note: >
    ⚠ **技術面於 2026-08-31 首次取得**，本檔建模以來的長期缺口關閉。
    來源：wantgoo 技術指標頁 —— 與 3324 於同日打通的是同一條路徑，該檔 cta.note 已記錄途徑供比照。
    ⚠ **均線與指標均為 2026-08-28 收盤值（收 1,615），非 8/31 的 1,630。**
    與 3324 那次不同：那次是同一天的盤中快照，可用 MAn + Δ/n 精確回補；
    本次差一個交易日，需知道被移出視窗的舊值才能回補，**故不做調整**，直接標示為 8/28 口徑。
    價格對均線的相對位置以 8/31 的 1,630 判讀，一日的均線位移相對各線間距為小。
    MACD：DIF 41.86 > MACD 23.28，OSC +18.58（柱體為正且擴張，多頭）。
    KD：K9 59.51 > D9 56.29（多頭，但距 80 超買線尚遠，與 3324 的 79.46、3008 的 93.38 對比明顯）。
    ⚠ **量能是本檔最弱的一環**：8/28 成交 134.2 萬股，僅為 20 日均量 274.6 萬股的 **0.49 倍**。
    價漲量縮 —— 這與 3324 的 2.91 倍、3008 的 1.84 倍形成強烈對比，三檔同為 AI 光電族群但量能品質差異極大。
    ⚠ RSI 未取得（與 3324、3008、3037 同一情形，wantgoo 頁面不提供）。
    52 週區間 753–2,540。

signal:
  rating: 中性
  conviction: 中
  basis: >
    基本面是清單中最猛的一組（Q2 稅後淨利年增逾 3.5 倍、H1 EPS 19.07 近兩個股本、
    毛利率 55%+、訂單能見度到年底、產能滿載）。但不給偏多的理由本次**換了內容**：
    ⚠ 8/27 的三個理由中，「均線與 52 週區間皆未取得故右側確認無從判讀」已於 2026-08-31 解除 ——
    技術面首次取得。取得後的結果是**右側確認明確不成立**，而非無從判讀：
    價格站上六條均線中的五條，但**低於 MA120(1,773.54)**，且 MA120 > MA60 —— 半年線在季線之上，
    中期下降結構未翻轉；距 52 週高 2,540 仍有 -35.8%。
    ⚠ **量能是本檔最弱的一環，也是本次最有訊息量的發現**：8/28 成交量僅為 20 日均量的 **0.49 倍**。
    價漲量縮。對比同族群同日：3324 為 2.91 倍、3008 為 1.84 倍 —— 三檔同屬 AI 光電，
    量能品質差異極大。confirm_trigger 要求「放量站上 MA120」，目前**放量這一項完全不成立**。
    其餘兩個理由仍在：加權目標價相對現價 1,630 僅 +6.4%；63% 單一客戶集中度是與論點獨立的
    非對稱風險（6 月營收 YoY 僅 +1.65% 正是其體現）。
    ⚠ **信心度自「低」升至「中」**：低的上限來自 valuation.md 對「無獨立估值基礎」的規定，
    而本次取得自身歷史本益比區間，base 自現價隱含值改錨為歷史平均換算值，該上限解除。
    仍為中而非高：63% 單一客戶集中度未變、CPO 時程仍只有管理層說法無自身揭露驗證、RSI 未取得。
    ⚠ **循環性檢查觸發且必須說明**：base 1,674 對現價 1,630 為 +2.7%，落在 ±5% 內。
    這是**結論不是產物** —— 36x 由歷史平均 trailing 50.5x 換算 forward 36.7x 後略減而得，
    現價隱含值是 35.05x，兩者接近的原因是**歷史錨本身就說本檔接近合理價**（折價僅 4.5%）。
    與 3324 形成對照：該檔的歷史錨顯示折價 11%＋且基本面在加速，故 base 明顯離開現價。
    同一種方法用在兩檔上，一檔得出「錯價」、一檔得出「大致合理」，那才是方法在運作。
  changes_if: 放量站上 MA120 的 1,773.54 並守住 → 重評；再突破 2,540 → 偏多；週收盤跌破 1,573.67 (MA60) 為第一道警訊，跌破 1,493.53 (MA240) → 偏空；單一客戶占比降至 50% 以下或取得 CPO 自身時程揭露 → 信心升至高

