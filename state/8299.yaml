    但錨定價改為 1,990.00（2026-09-11 官方收盤，櫃買中心 OpenAPI）—— 原為 2,085（2026-09-09）。**
    **評級維持中性／低。** ⚠ **前一輪「本輪未能更新」的原因是 stockanalysis 不覆蓋上櫃；
    該限制已由交易所官方 API 解除，見 reports/2026/09/2026-09-12-coverage-exchange-openapi.md。**
    ⚠⚠ **並記清楚：舊值 2,085 不是錯的 —— 它是 2026-09-09 的真實收盤，官方逐日已證實。
    它是過期，不是錯誤。而這兩者的處置不同：錯要修正，過期要更新。**
    ⚠⚠⚠ **本輪的產出是「知道 base 站在哪裡」**：三個框架的 FY2027 base 相差 2.99 倍 ——
    **中週期正常化 103.23 → 826（-60.4%）／state 自建 200 → 1,600（-23.3%）／
    FactSet 共識中位 308.27 → 2,466（+18.3%）。而 declared primary method 給的是最低的那一個。**
    **state 的 200 是五年平均的 1.94 倍、四年平均 31.79 的 6.29 倍 ——
    `methods.primary` 宣告的「中週期正常化 EPS × 正常倍數（循環股必用）」不是產生這個 base 的方法。**
    ⚠⚠ **而 base 唯一的 load-bearing 假設是「AI 帶動的企業級需求有一部分是結構性的」，
    它至今沒有被量化。沒有它，base 就該往 103.23 走。**
    ⚠⚠⚠ **第二個發現：整個 EPS 階梯系統性低於共識 35–53%，而 bull（300）≈ 共識中位（308.27）
    —— 本模型最樂觀的情境等於街上的基準情境。**
    **且 state 的 FY2027 base 200 低於街上的 FY2028 中位 243.73 —— 模型在下行方向比街上快約一年半。**
    ⚠ **但方向上兩者一致**：共識自己也逐年遞減（388.99 → 308.27 → 243.73，約 -21%／年），
    **街上同樣預期 NAND 循環在 FY2026 見頂。分歧不在「會不會下行」，只在「下多快」——
    state 的單年 -52.8% 是共識的 2.5 倍，而那正是 thesis 的爭點。**
    ⚠ **維持中性的理由**（百分比已於 2026-09-12 依錨定價 1,990 重算）：
    **加權 -17.6%、幾何 -35.2%、base -19.6%** 三個口徑仍皆為負
    （舊值依 2,085 為 -21.3%／-38.2%／-23.3% —— 下檔幅度收窄約 3.7pp，因為價格自己跌了 4.6%），
    但共識目標價 2,740 相對現價為 **+37.7%**，方向相反 ——
    **而本檔的評級是中性不是偏空，所以這個衝突的表述比 3081 弱。**
    ⚠ **全距 8.33 倍（本輪最寬）使加權目標價這個單一數字的資訊量很低 ——
    最該讀的是 base 1,600 與共識隱含的 2,466 之間的那個決定。**
    ⚠ **「中性」在本檔的意思是「尚無估值判斷」，不是「多空平衡」。**
    三情境與加權目標價未建立（理由見 scenarios 註解）。
    ⚠⚠ **而本檔的中性有一個必須說清楚的性質：它不是因為數字難看。**
    **本益比 9.55 是本日十檔中最低的一個，近四季 EPS 創 40 季新高，
    Q2 四項全部創單季歷史新高。**
    **中性是因為那些數字出現在循環頂，而我還沒有中週期的參照可以判斷它們值多少。**
    **這一檔存在的價值有一半在於：它測試我在數字好看的時候會不會照自己的規則做。**
    ⚠ **信心壓在「低」有四個具名理由：**
    (1) ⚠⚠ **主錨（中週期正常化 EPS）的輸入完全不在** —— 本檔自身的循環歷史未取得。
