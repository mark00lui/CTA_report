# ⚠⚠ 建檔當下最重要的三件事，寫在最前面：
#   (1) ⚠⚠ **本檔刻意不標 `ai_capex_hw`，這是本日四檔建檔中最需要解釋的一個判斷。**
#       伺服器佔 Q2 營收 55.36%（年增 +71%），看起來像 AI 曝險 ——
#       **但那主要是一般用途伺服器的 CPU 插槽（Intel Oak Stream、AMD Venice 平台世代切換），
#       不是 AI 加速器的建置。** 真正的 AI 相關產品 QDS **目前佔營收約 1%**（下半年估 2–3%），
#       SOCAMM 剛量產；**管理層自己說 GPU／AI 晶片專案「採用與導入時間不確定」。**
#       **標上去會讓因子模型說一句我沒有證據的話。** 已寫定重新分類的規則，見 notes。
#   (2) **本檔是本日建立的四檔中唯一象限落在 Q1 的，也是唯一 trailing PE 可以直接當工具用的。**
#       TTM EPS **82.02 元**、本益比 **19.81**（Yahoo 同日載「同業平均本益比 **47.44**」）、
#       毛利率 45.47%、營業利益率 21.97%。
#       ⚠ **但象限判定的 Y 軸（capex／營收）完全未取得，這是本檔最弱的一環，見 gaps 第一項。**
#   (3) ⚠⚠ **技術面：價格已跌破季線 17.14%，是本日四檔中唯一「破線」的。**
#       季線 1,906.89 —— **已經跌破的線不能當作失效價位，故 invalidation 留空**，
#       而右側確認條件距現價 **+21.0%**。
ticker: '3533'
name: 嘉澤端子
market: TW
factor_tags:
