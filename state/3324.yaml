driver_refs:
- driver: accelerator-roadmap
  direction: '+'
  note: >
    本檔 thesis 的直接驅動因子。單機櫃功耗、下一代平台量產時點都住在該 driver，不在本檔複製。
    2026-08-27 該 driver 首次填值：GB300 NVL72 132–142kW → Rubin NVL144 約 190kW →
    Rubin Ultra 約 600kW（2027）。
- driver: ai-accelerator-demand
  direction: '+'
  note: 加速器出貨量 → 機櫃數 → 液冷附載。領先 2–3 季（散熱晚於晶片）。合計數值取該 driver 現值。
- driver: hyperscaler-capex
  direction: '+'
  note: >
    capex → 伺服器機櫃出貨量 → 液冷附載率與單機價值量。領先 2–3 季，sensitivity 高。
    四大 CSP capex 合計住在該 driver，不在本檔複製。2026-08-27 該 driver 校正後合計 745
    （公司揭露上限加總），其中 Microsoft 的 −15 為會計年限口徑而非需求縮手 —— 讀該檔的
    合計數前務必先看成分，合計會掩蓋成分的相反方向。
thesis: 液冷從選配轉為標配，2026 滲透率與單機價值量決定重評價幅度
thesis_since: 2026-08-27   # 產業側（accelerator-roadmap 功耗軌跡）與公司側（7月營收+117%、年度目標上修至+70%）於本日同時對上，論點成立日以此為準
valuation_base_year: 2026   # 曆年。首次設定；滾動至 2027 的時點為 Q3 財報（約 2026-11），屆時 2027 共識成形
scenarios:
  bear:
    p: 0.25
    p_basis: 機率由使用者於 2026-08-27 全量重估指定。毛利率是真實風險而非雜訊 — Q1 為 29.66%，管理層措辭是「有信心站穩三成」（守住而非上行的語氣），且高盛等多家在上調目標價的同時下修毛利率預估
    key_assumption: 液冷如期普及但 3324 未吃到 — 價格競爭壓縮毛利、對 3017 份額流失、或在新平台設計中被替換
    key_assumption_history:
    - {until: 2026-08-27, text: 液冷滲透率停滯、氣冷方案延壽；價格競爭壓縮毛利,
       why_changed: "accelerator-roadmap 首次填值：GB300 已強制液冷（132–142kW）、Rubin NVL144 約 190kW、Rubin Ultra 約 600kW。氣冷在現行世代就已退場，「延壽」不成立。bear 的失敗路徑因此由『液冷沒來』改為『液冷來了但本檔沒吃到』。見 reports/2026/08/2026-08-27-3324-L1-rubin-power-density.md"}
    eps: 50.3
    exit_multiple: 15
    multiple_basis: "錨 A（自身歷史，2026-08-31 首次取得）。歷年 trailing 本益比：2024 高低 58.71／27.44、2025 高低 63.10／22.94、2026 迄今 50.35／26.03。⚠ 2023 的 26.68／9.56 描述的是液冷占比僅 12% 的舊雙鴻，依 valuation.md 屬結構性改變，排除不用。AI 期間（2024–2026）trailing 低點約 22.94–27.44，以 2026 共識 EPS 57.34 ÷ 近四季 43.75 = +31.1% 換算為 forward 等值 17.5–20.9x。本情境取 15x（trailing 等值 19.7x），**低於 AI 期間任何一年的低點** —— 意思是液冷論點失敗、市場改用非 AI 的眼光重新定價。不取 2023 的 9.56x，因為即使論點失敗，液冷占比也回不到 12%"
    tp: 755
    narrative: 15x 低於現況 18.8x — 成長被懷疑後的去化，非為救目標價而調整倍數
  base:
    p: 0.50
    p_basis: 公司自行上修年度目標至 +70%，7 月營收 +117% 提供實績支撐；共識中位數達成是最可能路徑
    key_assumption: 北美 CSP 液冷導入依既定時程，水冷占比朝 55% 推進；毛利率守住三成
    eps: 57.34
    exit_multiple: 24
    multiple_basis: "錨 A（自身歷史，2026-08-31 自錨 B 升級）。前一版用「街上目標價隱含 24.9x 打折至 22x」，並自註「取得自身歷史分位後應改錨」—— 本次取得，故改錨。AI 期間（2024–2026）trailing 本益比三年平均約 32–35x，以 +31.1% 的成長率換算 forward 等值 **24.8–26.7x**。判斷為【部分合理但折過頭】：現況 forward 21.80x（1,250 ÷ 57.34）落在該區間**下緣之下**，而同期基本面在加速 —— 公司已將 2026 全年營收成長目標自 +50% 上修至 +70%、液冷營收占比目標自 2025Q3 實績 35% 提高到 55% 以上、Q1 EPS 12.61 創高（YoY +122.79%）、7 月營收 +116.7% 創高、泰國二期產能已於 Q1 末開出銜接 GB300 與 ASIC 水冷板追加訂單。折價有部分理由（液冷競爭者眾；2024–25 的高倍數含題材最熱時的讀數），但幅度過度。取 24x —— **低於**歷史平均換算後的 24.8–26.7x 下緣，不取中值。⚠ 非現價隱含值（21.80x）"
    tp: 1376
    narrative: 22x 略低於街上目標價隱含的 24.9x，刻意保守於共識
  bull:
    p: 0.25
    p_basis: 需要單機價值量跳升與毛利率上行同時發生，且兩者都尚無公司側數據佐證。與 bear 對稱
    key_assumption: Rubin 全液冷 + ASIC 訂單放量，單機價值量跳升；毛利率隨產品組合上行
    eps: 62.6
    exit_multiple: 32
    multiple_basis: "錨在市場實際付過的價：2026 年迄今 trailing 高點 50.35x，換算 forward 等值約 38.4x。取 32x（trailing 等值 41.9x）**未取該值** —— 本情境不需要市場付出它今年還沒付過的價格。交叉檢查：同業平均 39.2x（近四季 trailing 口徑），32x 的 trailing 等值 41.9x 略高於它，差距來自本檔液冷占比高於同業均值。⚠ 不採 2025 年的 63.10x 高點，那是題材最熱時的讀數"
    tp: 2003
    narrative: 30x 仍低於同業平均 39.2x（口徑為近四季、不完全可比），未取激進值
  weighted_tp: 1378
  # EPS 直接採用 FactSet 15 位分析師的實際離散度（最低 50.3／中位 57.34／最高 62.6），
  # 不自行編造區間 —— 共識區間本身可得時，用它比用想像更可檢驗。
