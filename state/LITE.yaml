      **成長率與利潤率都遠離穩態，且剛經歷一次符號翻轉。**
    ・⚠⚠ **Y 軸（資本密集度）＝ 恰好卡在門檻上，這一格必須寫清楚，不可四捨五入帶過**：
      **capex／營收 ＝ 451.3 ÷ 3,014 ＝ 14.97%**，
      **距 valuation-map 的 15% 門檻只差 0.03 個百分點。**
      FY2025 為 231 ÷ 1,645 ＝ **14.04%**，同樣貼線。
      其餘判準指向低資本密集：**D&A／營收 8.78%**（264.5 ÷ 3,014）、
      **淨現金 +10.7 億美元**（市值 887.1 億 − EV 876.4 億）、
      **自由現金流 +3.001 億且自 FY25 的 -1.047 億轉正**（FCF 利潤率 9.96%）。
      **綜合判 Y ＝ 低，但這是「低的那一側，且離線只有 0.03pp」——
      下一輪 capex 若再增，本檔會落入 Q3，屆時整套方法要換。這是必須每輪重問的一格。**
    → **低代表性 × 低資本密集 ＝ Q4 營收與選擇權象限。**
    ⚠ **與 COHR 同象限，而這是應該的** —— 兩者是直接同業、同一條需求鏈、同樣的
