  **這是第一檔「賣設備給清單裡三個不同層」的標的。**
  ⚠ **後果有兩個方向，而且都要記**：
  **(a) 三類客戶的擴產週期不同步 → 對本檔是分散，任何一類擴產都能撐住訂單；**
  **(b) 但三條不同步的階梯疊在一起，也讓月營收與累計都變成雜訊 ——
  這正是本檔月營收沒有訊號的成因。**
  ｜⚠⚠ **本檔為「先看去年那條線的形狀」補上了第四種、也是最嚴重的一種情況**：
  **平的（3081）→ 年增率可以直接讀；單調斜的（3017／6805／8299）→ 改用絕對金額或月增率；
  兩年都不規則但累計單調（3211）→ 只有累計有訊號；
  本檔 → 兩年都不規則，而且連累計年增率都不是單調的，只有季度有訊號。**
  **這是本輪十三檔中第一次連累計都不能當 falsifier 的錨。**
  ⚠ **而成因是可以指名的（見上），不是「這檔比較亂」而已 —— 那個差別很重要，
  因為可指名的成因意味著這個性質會持續，不是偶發。**
  ｜⚠⚠ **thesis 的證據是季內就自己打臉的一組數字**：
  **Q1 淨利率約 29.5% → Q2 約 18.9%，掉了 10.6 個百分點，而 Q2 的營收還比 Q1 高 8.1%。**
  **EPS 因此季減 31% —— 那不是需求問題，是組成問題。**
  ⚠ **而管理層給的答案要等 18–30 個月**：3D 設備毛利率高出 2.5D 許多，
  **但占比要到 2027–2028 才顯著提升。在那之前，Q1 的 29.5% 靠什麼撐、還撐不撐得住，
  公司自己沒有回答那一段 —— 而現價已經給了 46.65 倍。**
  ｜⚠ **與同日 3533 的象限對照值得寫下來，因為兩者表面上很像而我判了不同象限**：
  **3533 營收年增 17.7%、EPS 大且乾淨、毛利率自 49.55% 下滑到 45.47% —— 判 Q1；**
  **本檔營收年增 22.90%、EPS 大且乾淨，但淨利率自 29.5% 掉到 18.9% 之後
  管理層說 2027–2028 會再往上 —— 判 Q4。**
  **差別在方向：3533 的當期在往常態收斂，本檔的當期在兩個方向之間擺盪且尚未落定。**
  **收斂中的當期盈餘比擺盪中的更有代表性 —— 這是 X 軸的一個可用判準，值得回填 references。**
  ｜⚠⚠ **本檔為那條雙邊 invalidation 規則提供了第二個「比值約 1.2 倍」的樣本，
  而兩個樣本合起來構成一個具體的建議**：
  **3211：季線距現價 5.19%、當日振幅 4.39% → 比值 1.18 倍；**
  **本檔：季線距現價 11.28%、當日振幅 9.30% → 比值 1.21 倍。**
  **兩檔的絕對距離差一倍以上，比值卻幾乎相同 ——
  說明「太近」的門檻應該用「距離 ÷ 日振幅」的比值表達，而不是用絕對百分比。**
  **而 1.2 倍很可能仍然太緊：距離只有 1.2 個日振幅，一根大 K 就會穿越。
  一個可用的失效價位大概需要 2–3 個日振幅以上。**
  **這一點應與 ±20% 的上界一起寫進 references。**
  ｜⚠⚠ **兩個流程缺陷在本檔同時達到「不能再列成 gaps」的次數**：
  **(a) 淨現金／淨負債未取得 —— 本日第七檔（2345、3017、3081、8299、6805、3211、本檔），
  七次都因為同一個數字跨不了層級軸；**
  **(b) 前三大客戶占比未取得 —— 連續第六檔把第四條 falsifier 標成「未驗證」
  （AXTI、3661、8299、6805、3211、本檔）。**
  **兩者都不是「這次沒查到」，是我沒有把它們列進建檔的固定步驟。應一併補進流程。**
  ｜⚠ **引用京鼎 3413 時已逐項確認**：`references/valuation-map.md` 明記
  「⚠ 不是 3413，3413 是京鼎——本倉庫犯過這個錯」。
  **昨日 3211 才因為代號筆誤更正過一次（3221 是台嘉碩），今日又碰到一個曾經出錯的代號 ——
  兩天之內兩次，更說明「名稱與代號互相驗證」該寫進建檔步驟。**
  ｜⚠ **另記一個流動性事實**：**成交量僅約 84.8 萬股，是本輪十三檔中最低的。**
  **千元以上的低周轉標的，滑價與流動性風險與其餘標的不同科 ——
  這不影響估值判斷，但影響任何以價格為門檻的規則的可執行性。**

