    ⚠ **本檔的分母沒有任何問題**：TTM EPS **63.65 元**，又大又正、無一次性項目扭曲
    （對照 AXTI trailing PE 1,141.03 分母趨零、AAOI EPS -0.79 分母為負、
    LITE GAAP 為一次性費用扭曲）。
    ⚠⚠ **它失效的原因是 valuation-map 四個 X 軸判準裡的另一個：「成長率是否遠離穩態」。**
    EPS 序列：FY2025 **47.13 元**（該年營收 2,483 億元、**年增 +125%**）→
    2026 共識 **73.8 元**（Factset 中位數）；TTM EPS **63.65**、近四季 EPS 年增 **+98.58%**；
    Q2 2026 EPS **19.78**（季增 +33%、年增 **+120%**）。
    **營收在兩年內接近三倍。任何 trailing 數字在這條曲線上都是過期的。**
    ⚠ **且毛利率同時在動**：Q2 2026 為 **19.7%**，**連續三季成長、創五季新高** ——
    **亦即 TTM 盈餘同時被「量的三倍」與「率的高點」兩件事推高，兩者都不保證持續。**
    ｜**Y 軸（資本密集度）＝ 低，而且是本日五檔中證據最強的一次。**
    ⚠ **實際 capex／營收未取得**（列 gaps），但有三條互相獨立的證據都指向資產輕：
    (a) **ROE ≈ 52.9%**（TTM 淨利約 357.1 億 ÷ 淨值約 675.5 億）——
        **資本密集的生意做不出這個數字**；
    (b) **股東權益週轉率 ≈ 5.07x**（TTM 營收 3,423 億 ÷ 淨值 675.5 億）；
    (c) **股價淨值比 16.31**（每股淨值 120.38 元）—— **市場完全不是在買資產。**
    ⚠ 已公告的擴產金額也與低資本密集相符（**個別董事會決議，非年度總額**）：
    四項投資案合計**逾 20 億元新台幣**；竹北廠擴產 **2,490 萬美元**；
    越南廠追加 **3,673 萬美元**（越南累計 **7,251 萬美元**）。
    **合計約 40 億元新台幣量級，對 TTM 營收 3,423 億元約 1.2% ——
    ⚠ 但那是已公告的個別案而非年度資本支出總額，不可當成 capex／營收 的替代品。**
    ｜⚠⚠ **結論：低 X ＋ 低 Y ＝ Q4（營收與選擇權）。**
    **而這正是 valuation-map 對 NVDA 的處理方式**——
    「fabless（Q4 而非 Q2）；**但成長率遠離穩態使 forward PE 單獨無意義 → 需成長持續期**」。
    **本檔是同一個結構：資產輕、盈餘乾淨、但成長率遠離穩態。**
