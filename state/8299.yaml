  低價庫存與現貨價的時間差。**
  ⚠ **而這把 CLAUDE.md 的那句話推進了一步**：
  **「同一則消息對不同標的方向可能相反」—— 本檔的情況是
  「同一則消息對同一檔標的，在不同時間軸上方向也相反」。**
