  methods:
    primary: >
      **SOTP：產品端用盈餘倍數 ＋ Foundry 用重置成本／產能**（分母軸 ——
      一半用會計盈餘，一半用帳面資產與產能）。
      ⚠⚠⚠ **這是本檔唯一正確的主錨，而理由極具體：合併後的任何單一盈餘數字
      都同時描述了兩門性質相反的生意。**
      **產品端（CCG & Physical AI ＋ DCAI）有營收、有獲利、有可比同業（AMD、Qualcomm）；**
      **Foundry 營收 $5.8B、虧 $2.1B、外部只有 $293M、2027 目標損益兩平、14A 要到 2028。**
      ⚠⚠⚠ **而 Foundry 那一半刻意**不**用 EV/Sales，理由必須寫死**：
      **那 $5.8B 裡只有 $293M 是外部的，其餘是內部轉撥 ——
      拿 $5.8B 去乘代工同業的 EV/Sales 會把 Intel 自己賣給自己的晶圓算成市場營收。**
      **正確的分母是產能與重置成本：不動產廠房設備 **$105.74B**，
      而市值 $527.13B ÷ PPE $105.74B ＝ **4.99 倍**。**
      **那個倍數要拿去與 TSM／GFS／UMC 比，才知道市場為這些廠付了幾倍帳面值。**
      ⚠⚠⚠ **2026-09-11 本節曾被我錯誤地改動，已撤回 —— 而那個錯誤本身值得記下來。**
      **我先依 6805 那一檔寫下的通則「清單內的標的不作為估值錨」把 TSM 移除，
      然後在自行驗證時發現：3583 在同一天（2026-09-10）已經建立了一條更精確的規則 ——
      **清單內標的的「市場觀測倍數」可用於序位對照（須明寫日期與「不得因我的判斷而調整」），
      其目標價、應有倍數、情境倍數不可用。**
      **而本檔建檔時引用的正是 3583 那條（見 peers）。**
      ⚠⚠⚠ **亦即 6805 的通則是一條較粗的規則，它覆蓋了 3583 較精確的那一條，
