  event: 2026 年 8 月營收公布（台股每月 10 日前）
  what_to_watch: 年增率能否延續 7 月的 +38.19%；第一條 falsifier 的實質起算點
- date: '2026-10 下旬（依慣例推估）'
  event: 2026 Q3 財報
  what_to_watch: ⚠ **首次取得毛利率** —— 判斷 EPS 成長是本業或業外；以及資本支出（象限判準的另一半）
- date: '2027-03'
  event: 2026 年報
  what_to_watch: 全年毛利率與營益率序列；先進封裝／半導體檢測的營收占比；資本支出實際數

gaps:
- question: ⚠ **2026 Q2 毛利率未取得，這是本檔最重要的空白** —— thesis 的核心觀察是「EPS 年增 75% 對營收年增 23.92%」，而毛利率是判斷那個落差屬本業或業外的第一個關鍵。在補上之前，不得宣稱本輪成長是毛利率驅動
  how_to_close: 公開資訊觀測站的季報；財報狗／wantgoo 的損益表頁（⚠ 財報狗需 JS，wantgoo 的現金流頁曾回 404，需實測損益表頁）
- question: ⚠ **capex／營收未取得，而它是象限判準的一半** —— valuation_frame 把本檔定為 Q4，其中「低資本密集」由 PB 6.84 與 ROE 33.4% 推論得出。若實際高於 15% 門檻，象限須重判為 Q3，整套方法要換
  how_to_close: 季報現金流量表的「購置不動產廠房設備」；年報的重大資本支出計畫
- question: ⚠ **本檔無分析師覆蓋** —— 無共識 EPS、無高低分布、無目標價、forward PE 為 n/a。**錨寬度因此算不出來，且這是結構性的**。它同時是估值折價的原因之一
  how_to_close: ⚠ 可能無法關閉。候選：鉅亨網 FactSet 速報（台股偶有覆蓋中型股）；券商研究報告；或接受本檔的信心上限就在「低」
- question: 先進封裝／半導體檢測的營收占比未揭露 —— 這是族群排序指標的第二項，也是判斷本檔是否真的在 AI 資本支出鏈上的關鍵
  how_to_close: 年報或法說的產品別／應用別營收揭露
- question: 同業倍數只取得致茂 2360 一家。由田 3455、牧德 3563、所羅門 2359 均未取得 —— ⚠ 而 valuation-map 明訂族群基準用中位數，**單一同業時中位數等於該同業本身，規則無法發揮作用**（與 COHR 的 n=2 盲區同類）
  how_to_close: stockanalysis 的 /quote/tpe/{code}/ 逐一嘗試；⚠ 但中小型台股的覆蓋不完整（6442、3324 均回 404）
- question: 自身歷史 PE 只取得年度區間（2022 約 8–13、2023 為 7–14、2024 為 15–34、2025 為 13–25、2026 迄今 18–35），**未取得分位數**。且 2024 前後有明顯 regime shift，可用的樣本只有 2024 起的三年
  how_to_close: histock 的本益比河流圖；或取得月度序列自行計算分位
- question: 每股淨值為推導值（270 ÷ PB 6.84 = 39.47），非公司揭露。⚠ 且未確認是否已除息 —— 依 valuation.md 缺陷 4，每股類指標須註明除權息前後口徑
  how_to_close: 季報資產負債表；公開資訊觀測站的除權息公告
- question: RSI 未取得（wantgoo 頁面不提供，與其餘台股同一情形）
  how_to_close: 券商看盤軟體；或取得日 K 原始序列自行計算
- question: 2026 年 8 月月營收尚未公告（今日 9/8，台股每月 10 日前公告）
  how_to_close: 2026-09-10 公開資訊觀測站

notes: >
  ⚠ **本檔是第一檔在建檔階段就跑完 valuation_frame 的標的**（2026-09-08 起 /new-ticker 新增的步驟 5）。
  而它立刻顯示出這個順序的價值：**因為先決定了要用哪幾把尺，才知道去查同業與自身歷史 PE 區間** ——
  若照舊流程「查到什麼用什麼」，最可能的結果是只拿到一個 trailing PE 21.36 就停。
  ｜⚠ **但同一步驟也立刻暴露一個本檔無法克服的限制：沒有分析師覆蓋。**
  forecast 頁 404、forward PE 為 n/a、無目標價、無共識分布。
  **錨寬度算不出來不是資料還沒查，是這個標的沒有那個東西。**
  依 SKILL.md，錨寬度未知時信心不得因缺口減少而升等 ——
  **這意味著即使補上毛利率與資本支出，本檔的信心上限仍在「低」。**
  ｜⚠ **與覆蓋清單既有標的的一個關鍵差別**：本清單多數台股（6239、3037、8046、3008）
  都有分析師覆蓋，而 6442、3324 與本檔沒有。**這三檔的估值方法組合天生比其他檔少一把尺**，
  應視為同一類處理，而非個別的資料缺口。
  ｜⚠ **thesis 的爭點是估值折價本身，這在本清單中是第一次。** 其餘標的的 thesis 都關於
  營運（滲透率、產能、現金流、路徑），而本檔的 thesis 是「62.5% 的同業折價是否過頭」。
  這種 thesis 有一個特有的風險：**折價可能因同業下修而收斂，那不等於本檔被重評價** ——
  已寫進第三條 falsifier 的但書。
  ｜業務：組裝電路板自動檢測設備（AOI）與相關治具自動檢測設備。
  客戶為 EMS、PCB 與封測廠，故對 AI 資本支出的曝險是**間接的**（經由客戶的設備投資），
  而非直接出貨給 CSP 或加速器廠。⚠ 這與 6239（直接服務 AMD／Broadcom）不同，
  扇出時不可套用同一個傳導強度。

event_log:
- date: 2026-09-08
  level: '—'
  summary: 建檔。2026 Q2 EPS 3.86 元（年增 75%）、營收 29.4655 億元（年增 23.92%，連 3 季成長）；H1 累計 EPS 7.36 元（年增 58%）；7 月營收 10.33 億元（年增 38.19%）；TTM EPS 13.18 元（+54.9%）、TTM 營收 95.4 億元（+28.2%）
  delta: >
    新增追蹤標的。**本檔是第一檔在建檔階段就完成 valuation_frame 的標的。**
    **象限判為 Q4**（低資本密集 × 低盈餘代表性）：
    資本密集度低由 **PB 6.84 與 ROE 33.4%** 推論（⚠ capex／營收未取得，這條腿是推論，已列 gaps）；
    盈餘代表性低由 **TTM EPS +54.9%、Q2 年增 75%、52 週振幅 3.3 倍、距高點 -41%** 判定。
    ⚠ **Q4 的處方中「選擇權拆分」對本檔不適用** —— 沒有尚未貢獻營收的業務線可拆。
    **兩個錨都在建檔時取得，這正是把步驟 5 前移的目的**：
    ・錨 B（主）：致茂 2360，PE **57.02**／forward PE 41.54／P/S **23.39**
      （stockanalysis，**as-of 2026-09-08 13:24 CST**）
    ・錨 A（副）：自身歷史 trailing PE，**限 2024 年後的 regime 15–34x**
      （histock，as-of 2026-09；⚠ 2022 為 8–13、2023 為 7–14，2024 前後有明顯 regime shift，不可混用）
    ・檢查器：P/S 對照 —— 本檔 **6.98** 對致茂 **23.39**，折價 **70.2%**
    跨兩軸：**參照**（同業 vs 自身歷史）與**分母**（盈餘 vs 營收）。
    ⚠ **建檔階段立刻暴露一個無法克服的限制：本檔沒有分析師覆蓋。**
    forecast 頁回 404、forward PE 為 n/a、無目標價、無共識高低分布。
    **錨寬度算不出來不是「資料還沒查」，是這個標的沒有那個東西** ——
    依 SKILL.md，信心不得因缺口減少而升等，**即使日後補上毛利率與資本支出，
    信心上限仍在「低」**。
    ⚠ **thesis 的爭點是估值折價本身，這在本清單中是第一次**：
    「本益比 21.4x 對致茂 57.0x 的折價（**62.5%**）屬規模與無覆蓋的結構性折價，
    還是會隨獲利成長持續而收斂」。折價有具名的合理成分 ——
    規模差 **14.2 倍**、營收成長 +28.2% 對 +61.6%、致茂有 AI 伺服器電源測試曝險。
    **爭點不是「該不該折價」，是「62.5% 是不是折過頭」。**
    ⚠ 該 thesis 有一個特有風險已寫進第三條 falsifier 的但書：
    **折價可能因致茂下修而收斂，那不等於本檔被重評價** —— 判定時須同時看兩邊的絕對倍數。
    ⚠ **三情境刻意不建**：兩個 load-bearing 的輸入都還沒有 ——
    毛利率未取得（而 thesis 的核心觀察正是「EPS 年增 75% 對營收年增 23.92%」，
    **驅動來源未經證實**），且無共識 EPS 可用。
    依 valuation.md，錨拿不到時應明寫而非填一個看起來合理的數字。
    四條 falsifier：三條有數字門檻且未觸發，**最早驗證點為 2026-09-10 的 8 月營收**；
    ⚠ 第四條（毛利率相關）標為**未驗證**而非未觸發，因為**它的判定對象尚未取得**，
    且 40% 的門檻是暫定值 —— **已明寫它目前不是一條合格的 falsifier，只是佔位。**
    ⚠ 技術面：**完整空頭排列**（MA120 318.57 > MA60 301.18 > MA20 291.77 > MA10 289.70
    > MA5 289.10），價格低於除 MA240(248.50) 外的所有均線，距 52 週高 **-41%**，
    量能為 20 日均量的 **0.77 倍**。MACD 的 DIF 與 MACD 雙雙在零軸之下（OSC +0.12 剛翻正）。
    ⚠ **三個來源的價格與日期不一致，依錨五欄規則全部記下不擇一**：
    stockanalysis 270.00（9/8 13:20 盤中）／histock 270.0（標示 9/7 收盤）／
    wantgoo 282.00（標示 9/7，且均線與之同口徑）。
    282 → 270 恰為 -4.26%，最可能是 9/7 收 282、9/8 收在或接近 270。
    **price 採 270，但均線全部是 282 那一天的口徑 —— 兩者不同口徑，已明寫。**

