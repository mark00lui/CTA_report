    added: 2026-09-10
    note: >
      **兩檔是光通訊／CPO 的直接同業**：同一條需求鏈、同象限（Q4）、同樣「獲利尚在正常化途中
      ＋ 價值有一部分在尚未貢獻營收的新產品上」。**預期相關性為本清單最高的一組之一。**
      ⚠⚠ **但真正需要記的不是相關性，是結構問題**：
      **`state/COHR.yaml` 的三個情境倍數全部掛在 FN 與 LITE 的 forward PE 上**
      （bear 略低於 FN、base 取兩家中點、bull ≈ LITE）。
      **LITE 納入覆蓋後，我對它的判斷會直接移動 COHR 的目標價 —— 這是循環引用。**
