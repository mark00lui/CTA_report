    依 SKILL.md，錨寬度未知時**信心不得因缺口減少而升等**，本檔的信心上限因此被這一條決定。
    ⚠ **不可直接套用致茂的倍數** —— 規模差 **14.2 倍**、營收成長率差逾一倍（+61.6% 對 +28.2%），
    且致茂有 AI 伺服器電源測試的曝險。折價是合理的，**爭點只在幅度**。
    ⚠ **2024 年以前的自身歷史不可用** —— 明顯的 regime shift：
    2022 約 8–13x、2023 為 7–14x，而 2024 起跳到 15–34x。**2024 前後不可混用。**
    ⚠ **不做 DCF** —— 現金流資料未取得，且成長率遠離穩態，終值假設會主導結果。
    ⚠ **不算 PEG 作為錨** —— 且若要當檢查器，g 須用營業利益成長率而非稅後淨利成長率
    （本檔 EPS 成長遠高於營收成長，而**驅動來源未經證實**，正是 PEG 最容易誤導的情形）。
