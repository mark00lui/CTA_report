signal:
  rating: 中性
  conviction: 低
  basis: >
    ⚠ **2026-09-07 全量重估（新方法論適用）：信心自「中」降為「低」，
    理由是本輪發現錨 C 形式上成立、實質上等於市場定價。**
    加權目標價 356 維持，相對現價 **332.70**（2026-09-04 收盤，前值 358.06、**-7.1%**）
    為 **+7.0%**（前 -0.6%）。**方向翻正全部來自股價下跌，模型一個數字都沒動。**
    ⚠ **循環性檢查在 base 觸發**（345 對現價 **+3.7%**；加權 +7.0% 未觸發）。依新流程：
    ① **位移測試做不到** —— FY2028 共識未取得。殘餘度 **1.00**（FY2027 剛於 2026-08 開始）
       故不觸發降權，但無法排除基準年假象。
    ② **輸入獨立性辯護失敗，而且失敗的方式值得單獨記**：
       用 state 自己的數字檢查 —— 市場隱含永續成長（r=9%）為 **+1.46%**，
       而 base 15x 的隱含永續成長為 **+1.4%**。**兩者實質相同。**
       而同一段 `multiple_basis` 的論證主張市場過度悲觀
       （「假設 FCF 永遠只能跟上通膨甚至更慢，而公司 FY27 guidance 是營收 +9~10%、
       non-GAAP EPS +23~24%」）。
       **論證說市場太悲觀，base 卻採用了市場的悲觀。**
    ⚠ **這是一個新的失敗模式：用 reverse-DCF「描述」市場假設，然後把那個假設當成自己的 base。
    形式上是錨 C，實質上是 valuation.md 核心規則所禁止的「base = 現價隱含值」。**
    本檔曾因取得錨 C 而自「無獨立估值基礎」升級、信心自低升至中 ——
    **既然那個升級的依據不成立，就該還原。**
    ⚠ **本輪刻意不調整 base 的數字。** 要修正它就得指定一個「合理的永續成長率」，
    而**折現率本身都還沒有可觀測錨**（r=8/9/10% 無依據，valuation.md 已於 2026-08-31
    點名本檔為三個未錨定實例之一，至今未補）。
    **用一個未錨定的數字去修另一個未錨定的數字，不是修正。**
    ⚠ **forward EPS 有兩個值，依規則兩個都記**：state 採用 **23.00**（新口徑，含 SBC）；
    stockanalysis 的 forward PE 13.76 隱含 **24.18**，差 **+5.1%** ——
    而本檔正好有新舊口徑問題（FY27 舊口徑 28.81 對新口徑 23.00），
    **該 13.76 的分母是哪一個口徑未知，不擇一。**
    ⚠ **錨寬度算不出來**（未取得 FY2027 共識高低分布）。
    ⚠ **公司行動掃描**：Q4 財報後**多家分析師降評**（Wolfe Research 降至 Peer Perform、
    數家下調目標價），理由為「FY27 guidance 低於共識」。
    ⚠ **該事件本身 state 已於 2026-08-27 收錄**（FY27 指引已是 key_variable），
    **本輪新增的是市場反應的幅度** —— 六個交易日內股價再跌 7.1%。
    技術面前置檢查：未發現庫藏股、除權息、處置股或指數成分調整，量價訊號未受污染。
    ｜以下為前次記錄：FY27 EPS 指引還原 SBC 口徑後（$28.69–28.93）實際優於市場模型，34.6% 營益率搭配 11.0x 舊口徑估值已定價相當程度的結構性衰退；但 agentic AI 替代風險在 2027 報稅季前無法否證，技術面仍在 200DMA 之下缺乏右側確認。信心度 2026-08-27 當日兩次調整：先自「中」下修至「低」（base 倍數無有效錨），後於同日完成 reverse-DCF 後回升至「中」—— 錨 C 已建立，不再是無獨立估值基礎。回升的依據不是看法變樂觀，是做完了原本沒做的功課。DCF 的結論反而讓 base 顯得保守：15x 對應永續成長 +1.4%，若給 +2.5%~3%（仍遠低於 FY27 guidance 的營收 +9~10%）則每股價值為 405~441，高於 base 的 345
  changes_if: ⚠ 2026-09-07 依新語法補列最優先兩條 —— `折現率的可觀測錨（美國 10 年期公債殖利率或本檔 beta）| 有無 | 取得即執行 | 資料商數值算數但須附日期 | FRED／stockanalysis` → **這是 base 能否被重新設定的前提**；`base 隱含永續成長率 vs 市場隱含永續成長率之差 | 0.5pp | 絕對值 < 即視為 base 等於市場定價 | 以同一折現率計算 | 本檔 multiple_basis 的 reverse-DCF` → **每次重估都要重跑這條，它是本輪抓到問題的方法**。｜站上 439.52 且 200DMA 轉揚 → 偏多；週收盤跌破 252.84 → 偏空；FY27 Q3（約 2027-05）TurboTax 付費件數 YoY 轉負 → 直接偏空，不等技術面
