    ⚠ **但 X 軸不是滿分**：毛利率自 Q1 的 **49.55%** 降至 45.47%，
    **管理層說明為「2025 年採購的低價原物料庫存已於第一季消化完畢」，
    銅金塑膠佔 COGS 自 45–50% 升至 65% —— 亦即 Q1 的 49.55% 是庫存產物，不可當正常水準。**
    ⚠⚠ **Y 軸完全未取得（capex／營收、折舊占比、淨負債三項全缺），
    整個象限判定建立在兩條間接推論上**（籌資規模僅約在外股數 1.16%；股價淨值比 4.46）。
    **這是本日四檔中證據最薄的一個象限判定，已列為 gaps 第一項與每輪必問的第一題；
    若 capex／營收 > 15% 則移入 Q2，整套方法要換。**
    ｜方法組合跨**三軸**（參照／層級／時間）：主錨同業 forward PE 序位、
    副錨 EV／營業利益、檢查器為正常化毛利率下的 EPS。
    ⚠⚠ **刻意只宣稱三軸而不宣稱跨了分母軸** —— 三個方法的分母都在「會計盈餘」這一類，
    **過度宣稱交錯驗證是這一層最危險的自欺，因為它讓人以為已經檢查過了。**
    ⚠ 檢查器選正常化毛利率不是套用通則，**是回應管理層自己說出口的那個庫存事實。**
    ｜⚠⚠ **刻意不標 `ai_capex_hw`，這是本檔最需要解釋的判斷。**
    伺服器佔營收 55.36%（年增 +71%）看起來像 AI 曝險，**但那主要是一般用途伺服器的 CPU 插槽**
    （動能來自 Intel Oak Stream 與 AMD Venice 平台切換）；
    **直接 AI 相關的 QDS 目前佔營收約 1%，SOCAMM 剛量產，管理層自己說 GPU／AI 晶片專案
    「採用與導入時間不確定」。標上去會讓因子模型說一句我沒有證據的話。**
    ⚠ **已在 changes_if 寫定重新分類的規則（QDS ＋ SOCAMM 合計 > 15% 則加標籤並重估），
    讓分類本身可被否證，而不是留給日後的我自由心證。**
    ｜評級**中性／信心低**。⚠⚠ **但本檔的中性與本日另三檔的中性來源完全不同**：
    **AXTI／LITE 是「技術面無法判定」、AAOI 是「判定了但未確認」、
    本檔是「判定了，結果是已經跌破」—— 價格在季線 1,906.89 之下 17.14%，位階記為破線。**
    **invalidation 刻意留空：已經跌破的線不能當失效價位，要填它必須先取得半年線或年線。**
    右側確認條件距現價 **+21.0%**。⚠ Beta（近半年）**1.28**，本日四檔中最低。
    ｜⚠⚠ **估值是本檔被納入的主要理由，但「便宜」是待解釋的現象不是結論**：
    本益比 **19.81**（Yahoo 同日載同業平均 **47.44**）、法人共識 2026 EPS 95 元計為 **16.58x**。
    **至少三個理由可以解釋它**：總營收年增僅 17.7%（伺服器 +71% 而桌機／筆電各 -14%）、
