# 公開研究檔 — 本倉庫不含任何倉位資訊：無成本、無張數、無權重、無 Kelly、無損益、無持倉揭露。
# 未知值一律留 __ 並寫進 gaps，不要填看起來合理的數字。
#
# ⚠ 本檔關閉的是 coverage.yaml 記錄過三次的結構缺口：「電力／電源鏈完全沒有曝險，
#   而 NVIDIA 已點名兩家台廠（台達電、光寶科）」。
#   ⚠ **但它與 CEG 的 ai_power 是完全不同的東西，不可混為一談：**
#   CEG **賣電**（曝險於資料中心用電量，是 capex 落成之後的**存量**）；
#   本檔**賣電源轉換與配電設備**（曝險於機櫃出貨與功率密度，是 capex 的**流量**）。
#   兩者都叫「電力」，但一個免疫於 capex 減速、一個不免疫。故本檔用新標籤 power_electronics，
#   不沿用 ai_power。
ticker: '2308'
name: 台達電
market: TW
factor_tags:
- ai_capex_hw
- power_electronics
- tw_fx

driver_refs:
# ⚠ 建檔時刻意只掛一個，理由寫在下面。第二個（accelerator-roadmap）應掛而未掛，已列 gaps。
- driver: hyperscaler-capex
  direction: '+'
  note: >
    capex → 資料中心機櫃與電力基礎設施建置 → 電源供應器與配電系統需求。領先 2–3 季。
    ⚠ **但本檔的傳導有一個其餘硬體端沒有的性質，這正是納入它的理由**：
    coverage.yaml 記過「即使 AI 伺服器出貨量成長減速，只要單櫃功耗續升，這條鏈仍有量 ——
    這是清單目前唯一一條**與出貨量部分脫鉤**的 AI 受惠路徑」。
    54V → ±400V → 800VDC 的換代由**功率密度**驅動，不由**機櫃台數**驅動。
    ⚠ 2026-09-10 建檔時同步於該 driver 補上對本檔的 transmission，完成雙向引用 ——
    **單向引用在 validate_state.py 是 ERROR 而非 warn（會擋 commit）**，
    因為扇出時會整檔漏掉。

valuation_frame:   # 2026-09-10 建檔時宣告
  quadrant: Q4
  quadrant_basis: >
    ⚠ **Y 軸（資本密集度）＝低，且與直覺相反，故判準全部指名數值。**
    本檔是製造業、有大量廠房，直覺會判它資本密集 —— **實測不是**：
    **capex／營收 TTM 僅 8.28%**（54,170 ÷ 654,540，單位百萬元新台幣），
    FY2025 為 8.31%（46,091 ÷ 554,885）；依 2026 資本支出 guidance **700 億元**與
    前 8 月營收年化推估，全年約 **9–10%**。**三個口徑全部低於 15% 門檻。**
    **D&A／營收 TTM 僅 4.66%**（30,482 ÷ 654,540）。
    **淨現金 1,118.8 億元**（總現金 1,861.7 − 總負債 742.9），非淨負債。
    **自由現金流連五年為正**（FY21–FY25：52.92／247.05／432.57／394.10／523.83 億元，
    TTM 638.11 億元）。**Y 軸為低，無爭議。**
    ⚠ **X 軸（當期盈餘代表性）＝低，這一格才是判斷所在。**
    EPS 軌跡 13.51（FY24）→ 23.08（FY25）→ **31.37（TTM，+87.2%）**；
    營益率 **11.33%（FY24）→ 15.15%（FY25）→ 16.70%（2026Q2）** ——
    **成長率與利潤率都仍在遠離穩態，且業務組合正在快速位移**（AI 相關營收占比兩年內升至約四成）。
    trailing PE **57.22** 對 forward PE **35.17**，隱含成長約 **62.7%** ——
    **兩個倍數差這麼遠時，單一 PE 不構成估值。**
    低代表性 × 低資本密集 → **Q4 營收與選擇權象限**。
    ⚠ **但必須寫明這是 Q4／Q1 的邊界，而非典型 Q4**：本檔與同象限的 3008／6442 不同 ——
    那兩檔的價值主體**尚未貢獻營收**（CPO 選擇權），本檔的 AI 業務**已占營收約四成且已在獲利**。
    **本檔更像 AVGO：成熟本體 + 已經在賺錢的高成長選擇權。**
    因此主錨取**選擇權拆分**而非 EV/Sales —— 後者對「兩種毛利率混在一起」的公司會失真。
    ⚠ **若 AI 占比與營益率在兩季內趨穩，本檔應移入 Q1**（屆時 forward PE 才單獨可用）。
  quadrant_since: 2026-09-10
  peer_group: 資料中心電力與電源轉換（AI power）
  peers:
  - Vertiv VRT（US，⚠ **最純的可比同業**：資料中心電力與散熱，無消費／車用本體。
    實測 2026-09-10：trailing PE 59.50／forward PE 33.55／EV-EBITDA 37.87／EV-Sales 8.84／
    PB 21.27／毛利率 38.04%／營益率 19.96%／ROE 43.94%／營收 TTM 114.8 億美元）
  - 光寶科 2301（TW，⚠ **與本檔同為 NVIDIA 800VDC 生態點名的兩家台廠**，可比性高但倍數未取得）
  - Eaton ETN（US，電力管理，資料中心為其一部分；本體更成熟，適合當**成熟本體**那一半的錨）
  - 群電 6412（TW，電源供應器，規模小得多，僅作台股同業倍數的下緣參照）
  rank_metrics:   # ⚠ 事先寫定。事後挑指標來支持已想好的答案是這一層的自欺
  - ① AI／資料中心相關營收占比（⚠ **本檔目前的口徑本身就是缺口，見 key_variables**）
  - ② 營益率（電源是規模與組合的生意；本檔 16.70% 對 VRT 19.96%，**族群內落後**）
  - ③ 800VDC 量產時程與是否留在 NVIDIA 生態名單內（**BOM 准入，不是族群需求**）
  methods:
    primary: >
      選擇權拆分 —— 把成熟本體（電源零組件、自動化、車用）以成熟同業倍數計價，
      反推市場為 AI 電源這塊付了幾倍。⚠ 選它當主錨的理由：AI 已占營收約四成卻與
      其餘六成混在同一個 57.22x／35.17x 裡，合併倍數無法回答「貴的是哪一塊」。
    secondary: >
      同業倍數序位（VRT 為主錨對象，光寶科 2301 與 Eaton 為輔）——
      ⚠ 這一項跨的是**軸④參照**，也就是 6239 那次踩到的軸。
    check: P/FCF（TTM 自由現金流 638.11 億元，現價下約 73x；⚠ 對照 PE 57.22x，**現金口徑更貴**）
  axes_crossed: [分母, 參照, 層級]
  excluded: >
    ⚠ **不做 forward-DCF** —— Q4 的明文禁令，且本檔成長率遠離穩態，做出來是把無知包裝成精確。
    ⚠ **不用 PB 當錨** —— PB 13.31x，但 ROE 29.97%，製造業帳面淨值不是本檔價值主體；
      PB 高低在此不具資訊。（⚠ Gordon 合理 PB＝(ROE−g)/(r−g) 仍可當**檢查器**，
      它與主錨在軸①④上都正交 —— 但需要一個可觀測的折現率錨，本輪未取得，列 gaps。）
    ⚠ **不算 PEG** —— g 取哪一段差異巨大（EPS +87.2% 對營益率 +1.55pp），
      3008 實測過同一個陷阱（淨利 g 對營業利益 g 差 8 倍）。
    ⚠ **不做淨現金調整後 PE** —— 該方法的強制門檻是淨現金 > 市值 10%，
      本檔淨現金 1,118.8 億元僅為市值 4.66 兆元的 **2.4%**，**未達門檻，不適用**。
    ⚠ **不可混用 trailing 與 forward** —— 本檔兩者差 62.7%，混用會產生任意結論。
  reviewed: 2026-09-10

thesis: >
  重評價的來源是 800VDC 換代帶來的單櫃電源價值量與營益率跳升，不是 AI 營收占比本身 ——
  占比約四成已被 forward 35x 定價，2027 年放量時的營益率才是變數。
thesis_since: 2026-09-10

