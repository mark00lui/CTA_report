    ⚠ **這是本檔最刺眼的一個數字**：TTM 自由現金流僅 **295M**，
    對 EV 129.93B → **EV/FCF = 440.43**。**Q2 的副錨 P/FCF 因此不可用。**
    序列（百萬美元）：
    ｜FY2023 營運 **-5,301**／資本支出 -4,112／自由現金流 **-9,413**
    ｜FY2024 營運 **-2,464**／資本支出 -2,597／自由現金流 **-5,061**
    ｜FY2025 營運 +4,237／資本支出 -2,963／自由現金流 **+1,274**
