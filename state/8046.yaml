- name: 市場共識的分散度
  value: 35.7
  unit: '%（錨寬度，2026 口徑）'
  tier: 推論
  source: >
    ⚠ **2026-09-08 首次取得完整的共識分布，而它顯示整個區間往上移了。**
    2026 EPS（stockanalysis，**as-of 2026-09-08**，**11 位分析師**）：
    低 **16.07** ／ 均 **18.21** ／ 高 **21.80** → **錨寬度 = 35.7%**。
    2026 營收：低 58.3B ／ 均 59.6B ／ 高 63.5B。**2025 實績 EPS 為 3.01。**
    目標價（**14 位**，10 強力買進、1 中立）：低 **1,095** ／ 均 **1,651** ／ 高 **2,500**。
    ⚠ **對照 state 前值「2026 EPS 11.52–17.08」—— 新區間的下緣 16.07 比舊下緣高 39.5%、
    上緣 21.80 比舊上緣高 27.6%。整個分布往上位移，不是變寬或變窄。**
    ⚠ **這使第三條 falsifier 的門檻失去約束力**（見該條的 note）。
    ⚠ **錨寬度 35.7% 的族群定位**：3037 為 **93.8%**、3008 為 18.4%、6239 為 8.9%。
    **本檔約在 3037 的三分之一** —— 同一族群、同一循環，分散度卻差三倍，
    合理的解釋是本檔的業務更純（IC 載板近 90% 對 3037 的 52%），變數較少。
    ⚠ **2027（基準年）仍無分布**（Pro 付費牆），故三情境的 2027 EPS 仍為單一來源。
    可做的交叉檢查：2025 實績 3.01 → 2026 共識均 18.21（**+505%**）→ 2027 採用值 23.78（+30.6%）；
    ⚠ **但若 2026 落在共識上緣 21.80，則 2027 的 23.78 僅隱含 +9.1% 成長** ——
    **2026 的實績落點會直接決定 2027 的成長率看起來是強是弱。**
    ⚠⚠⚠ **2026-09-11 這一格的兩個結論都要改寫，而改寫的方向相反。**
    **(1) 「2027 仍無分布（Pro 付費牆）」不成立 —— 鉅亨網的 Factset 速報新聞免費給完整分布：**
    **FY2027 中位 42.34／平均 45.19／高 65.83／低 21.66（16 位，2026-08-28）。**
    **亦即 base 採用的 23.78 比共識中位數低 78.0%，而它是單一美系外資的估計。**
    **這一格自己算出的「若 2026 落在上緣 21.80，則 2027 的 23.78 僅隱含 +9.1% 成長」是對的 ——
    診斷正確，缺的只是通道。**
    **(2) 錨寬度 35.7% 這個數字本身是供應商相依的，而相依程度大到不能忽略：**
    **stockanalysis（11 位，2026-09-08）FY2026 低 16.07／高 21.80 → 錨寬度 35.7%；**
    **FactSet（16 位，2026-08-28）FY2026 低 **8.56**／高 21.80 → 錨寬度 **154.7%**。**
    **高值完全相同，低值差 1.9 倍 —— 量測值差 4.3 倍。**
    ⚠⚠⚠ **而 FactSet 的低值 8.56 不可能成立**：TTM（至 2026-06）EPS 已是 8.51、H1'26 約 6.41，
    **8.56 等於假設 H2'26 只有 2.15，而上半年是 6.41。那是一個未更新的舊估計。**
    **→ 通則：共識分布的下緣特別容易被未更新的估計汙染，而在共識快速上修的標的上
    （本檔 FY2026 中位數在 2026 年內自 2.0 升到 17.08）汙染幅度會很大。
    引用下緣前要做一次合理性檢查：它與已實現的期間數字是否矛盾。**
    ⚠ **因此本輪改記 FY2027 的錨寬度，並指明供應商**：
    **FactSet FY2027（高 65.83 − 低 21.66）÷ 低 ＝ 204.0%，而它可能含下緣汙染；
    以平均 45.19 為中心的相對全距（高−低）÷中位 ＝ 104.4%。兩個都報，不只報一個。**
  updated: 2026-09-11
