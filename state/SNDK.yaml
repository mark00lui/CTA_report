# 公開研究檔 — 本倉庫不含任何倉位資訊：無成本、無張數、無權重、無 Kelly、無損益、無持倉揭露。
# 未知值一律留 __ 並寫進 gaps，不要填看起來合理的數字。
#
# ⚠ 讀本檔前先看懂兩件事：
#   一、所有財務數字都在記憶體循環的歷史級高點（毛利率 84.6%、營收 +372% YoY、52 週 +3,105%）。
#       在這個位置，低本益比不是估值訊號而是循環位置訊號。
#   二、季增有約三分之二來自「漲價」而非「出貨量」—— 那是最容易均值回歸的一種成長。
#       量的成長需要對手擴產才會被侵蝕；價的成長只需要供需稍微鬆動就會反轉。
