key_variables:
- name: AI相關營收占比
  kind: 量化
  value: 40
  value_qualifier: 約值
  components:
  - {name: AI 產品, value: 25}
  - {name: 液冷產品, value: 12}
  unit: '%'
  tier: 推論
  source: >
    CMoney 對 2026-07-30 法說的報導：「AI 相關營收占比一舉衝上四成」、
    「AI 產品今年營收占比將破 25%，液冷產品超過 12%」，2026-09-10 取得。
    ⚠ **仍為媒體二手轉述，非公司原始揭露**（來源階層第 5 順位），故 tier 維持推論 ——
    **但三層口徑互相自洽（25 + 12 ≈ 37～40），內部一致性支持其可信度**。
    ⚠ **教訓**：本倉庫先前記過「兩個數字剛好對得上，不代表是同一個東西」；
    **這次是反過來 —— 兩個數字對不上，卻是同一個東西的不同切法。**
    數字衝突時「是不是口徑不同」要和「是不是有人記錯」一起查，建檔當日我只查了後者。
    ⚠ 以下三段原本寫在 value 欄位裡，2026-09-13 型別化時搬到這裡（原文未改）：
    「✅ 2026-09-10 口徑衝突已解決 —— 建檔當日記為「三個互不相容的數字」，
    40%／逾 25%／逾 50% 不是矛盾，是三層同心圓，而缺的那一塊是液冷。
    另有法人估全年占比有機會破五成（賣方預估，非公司揭露，不採用）。」
    「⚠⚠ 由此帶出一個對 3324 更重要的事實：台達電的液冷產品已占其營收逾 12%，
    以 FY2026E 營收約 7,400 億元計約 890 億元，大於 3324 雙鴻的全年營收。
    兩檔在液冷這一段是直接競爭，不只是同機櫃的互補件。已修正 coverage.yaml。」
    ⚠ components 的 25 與 12 是「逾」的下界，合計 37 低於 value 的 40 —— 差額即口徑的重疊帶。
  updated: 2026-09-10
