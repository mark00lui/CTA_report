    **兩個象限的處方交集就是這組方法。這不是騎牆 —— 兩個口徑對 Y 軸完全一致，分歧只在 X 軸。**
    ⚠ **Q2 的副錨 P/FCF 不可用** —— **EV/FCF 為 440.43**，TTM 自由現金流僅 **295M**。
    **Q2 的處方本檔只能執行一半。**
    ⚠ **刻意不用 EV/Sales，而理由是一個算出來的對比**：
    FY2026 的 **EPS 錨寬度 5.78%** 對 **營收錨寬度 36.2%**（29.8／35.13／40.6B）——
    **後者是前者的 6.3 倍。22 位分析師對這家公司賺多少高度一致、對它營收多少嚴重分歧。**
    合理的解讀是營收主要由轉手性質的交易量決定，與盈餘幾乎脫鉤。**營收不是有意義的分母。**
    ⚠ **thesis 的方向與清單多數標的相反：本檔是溢價，不是折價。**
    「CEG 對 VST 的 EV/EBITDA 溢價 **54.7%**（16.34 對 10.56）是爭點 ——
    它是核能基載的稀缺性溢價，還是 Calpine 併購造成的期別錯配假象」。
    同向佐證：forward PE 溢價 **67.0%**（24.21 對 14.50）、EV/Sales 溢價 14.0%。
    ⚠ **而我目前最懷疑的是期別錯配** —— **EV 含 100% 併購後淨負債 24.0B，
    而 TTM EBITDA 只含部分期間的 Calpine 貢獻。分子完整、分母不完整，機械性地推高 EV/EBITDA。**
    **這已寫進第二條 falsifier 的條件文字（「且該比較已使用完整併購後年度的 EBITDA」），不是註腳。**
    ⚠ **同業的可用性問題本輪換了一種更難察覺的面貌**：名義 **n=3**，但
    ・**TLN 不可用** —— EBITDA 僅 **0.582B**（CEG 的 7.3%）、ROE **-12.82%**、PE 為 n/a
    ・**PB 跨同業完全無意義** —— CEG 3.32／VST **16.69**／TLN 9.40，三家帳面基礎不相容
    ・**EV/EBITDA 的中位數就是 CEG 自己**（16.34 居中）—— 中位數規則再次失效
    **實際可比的只有 VST 一家。與 3324 的 n=1、3030 的 n=1、COHR 的 n=2 是同一個盲區，
    本檔是第四次 —— 而這次是「看起來有 3 家」的版本，比純粹的 n=1 更難察覺。**
    ⚠ **rank_metrics 三項中只有一項完整可用**（EBITDA 利潤率：CEG 25.4%／VST 34.6%／TLN 15.6%）；
    核能占比三家皆缺、FCF 轉換率只有本檔有。
    **連續第二檔如此（3030 亦然），應視為流程問題：事先寫定指標時沒確認它取得得到。**
    ⚠ **公司行動掃描本輪改用 SEC EDGAR，而它立刻找到報價頁看不到的東西。**
    同日稍早我才在 3030 的報告裡承認自己的掃描「有效但那是運氣，不是設計」。
    401 筆申報中找到：**2026-06-02 的 424B4**（**次級發行 11,000,000 股，公司不收取價款、
    無稀釋**；同時公司自承銷商**買回 2,000,000 股**，約占流通股數 0.56%）——
    ⚠ **而正是這份文件證實了 Calpine 併購，成為我對期別錯配判斷的一手依據**；
    **2026-08-21 的 Form 144**（內部人擬出售通知）；**兩份 8-K/A**。
    ⚠ 已讀 2026-02-10 那份 8-K/A：內容為董事委員會任命，**與併購無關** ——
    **我原本以為 8-K/A 通常跟著併購來，讀了才知道不是。
    教訓不是「EDGAR 很好用」，是「不讀原文就會把申報類型當成內容」。**
    ⚠ **價格口徑：立刻套用同日 3030 的教訓，而它派上用場了。**
    報價頁顯示 **299.99，標示 2026-09-08 04:07 EDT，是盤前不是收盤**。
    三處反推全部指向 **298.96**（2026-09-04 收盤；9/7 為勞動節休市）：
    PE 28.95 → 298.96÷10.33 = 28.94 ✓；市值 105.92B → 354.31M × 298.96 = 105.92B ✓；
    PB 3.32 → 298.96÷90.00 = 3.32 ✓。**price 採 298.96，與所有比率同口徑。**
    ⚠ 除息日 **2026-08-18** 在最近一個月內，已掃描；單次約 0.43 美元對 298.96 為 0.14%，不重大。
    ⚠ **刻意不掛 `cyclical` 標籤**：盈餘波動的合理解讀是避險部位的 mark-to-market，
    而非電價循環 —— **但這個解讀未經證實（業外／MTM 科目未拆解），已列 gaps；
    若證實波動源自電價循環則須補掛。**
    ⚠ **driver_refs 刻意留空** —— 現有三個 driver 記的是資本支出承諾／加速器出貨／平台時程，
    **而本檔曝險的是資料中心的用電量，那是資本支出落成之後的存量，不是資本支出本身。
    一座已建成的資料中心即使 capex 歸零仍然耗電。**
    **正確做法是新增 `datacenter-power-demand` driver，而非硬掛既有的三個。** 已列 gaps。
    ⚠ **技術面：一個少見的組合** —— 價格 298.96 高於 50DMA **266.42（+12.21%）**
    與 200DMA **296.36（+0.88%）**，**但 50DMA 較 200DMA 低 10.10%（空頭交叉狀態）**。
    價格重挫後正在修復、剛收復 200DMA，**而收復幅度僅 +0.88%，一天波動就能抹掉 —— 不是站穩**。
    距 52 週高 412.70 為 **-27.6%**，位於 52 週區間的 **38.2%**；52 週報酬 **-3.09%**。
    ⚠ **四條 falsifier 全部有數字門檻且全部未觸發，第一條在六個月內可驗證**
    （FY2026 Adjusted EPS 低於共識下緣 **11.77**，最早驗證點為 2026 Q3 財報約 2026-11 上旬）。
    ⚠ **第一條的門檻取共識下緣而非自訂數字，理由是錨寬度只有 5.78% ——
    在一個如此收斂的共識裡跌破下緣，本身就是強訊號。**
    ⚠ **三情境刻意不建**：不是因為沒有共識（本檔有 22 位分析師，且 FY2027 可取得、
    基準年滾得動 —— 這是它優於 3030／6442／3324 的地方），
    **而是因為基期不乾淨**：TTM 是併購混合期，倍數的水準無法定錨。
    **依 valuation.md，錨拿不到時應明寫而非填一個看起來合理的數字。**
    ⚠ **錨寬度 5.78% 是全清單最窄（前次最窄為 6239 的 8.9%），但不因此升信心** ——
    那是 Adjusted（公司指引）口徑，22 位分析師都照公司指引建模；
    **窄的是對指引的共識，不是對價值的把握。**

