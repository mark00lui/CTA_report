      而 AI 加速器的建置節奏由完全不同的因素決定。
      若兩者屆時同向同幅移動，那代表我對「CPU 平台週期獨立於 AI 建置」的假設是錯的，
      而那個假設正是本檔被納入的主要理由。**
      ⚠ **重新分類的規則已事先寫定於 state/3533.yaml 的 changes_if**：
      **QDS ＋ SOCAMM 合計營收占比 > 15% 則加上 `ai_capex_hw` 並重估。**
      **規則寫在前面，分類本身才可被否證，而不是留給日後的自由心證。**
      ｜⚠⚠ **另記一個本檔獨有、而本清單此前低估的性質：月營收的驗證頻率。**
      **台股月營收每月 10 日前公告，3533 的第一條 falsifier（9–11 月任一月營收年增率低於 5%）
