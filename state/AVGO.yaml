    **若該說法成立，本檔的下修風險會先出現在那幾檔的產能揭露上，而不是本檔的訂單上。**
    ⚠ **訊號維持中性／低。上檔 +17.4%、且現價僅 11.93x 公司指引的 FY2028 EPS，
    而評級仍是中性 —— 依 SKILL.md，升級為偏多需右側技術確認。**
