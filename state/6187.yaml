notes: >
  ⚠⚠ **本檔與昨日的 3131 弘塑同屬 `semi_equipment`，同一個季度、毛利率方向相反 ——
  而兩檔管理層給的解釋是同一個：專案組合。這是本檔最有價值的產出。**
  **3131：Q1 淨利率約 29.5% → Q2 約 18.9%（掉 10.6pp），而營收季增 +8.1%。**
  **本檔：Q1 約 23.4% → Q2 約 35.6%（升 12.2pp），而營收季增 +66.7%。**
  **兩檔合起來證明的事比任何一檔單獨說的都強：這個族群的單季利潤率不可外推，
  而且方向可以是任意的。**
  ⚠ **而本檔的管理層直接把這件事說出口了**：**「設備高度客製化、產品橫跨不同製程，
  毛利率受產品組合、個別專案與成本結構影響，各期間可能波動」——
  公司自己說單期不具代表性，這比我從兩檔的數字推論出來的更有力。**
  ｜⚠⚠ **本檔是本輪十四檔中第一檔「均線兩端都過關」的標的**：
  **季線距現價 -14.67%（在 ±20% 之內），比值 **2.03 倍**日振幅（7.22%）——
  高於昨日 3211 的 1.18 倍與 3131 的 1.21 倍。**
  **昨日提出的「可用的失效價位大概需要 2–3 個日振幅以上」在本檔第一次被滿足，
  而且價格在季線之上，invalidation 因此首次填得出來。**
  **這條規則現在有兩端的極端樣本（8299 的 0.008 倍、AXTI 的 -74.2%）、
  兩個偏緊樣本（3211、3131）、與一個過關樣本（本檔）—— 應正式寫進 references，
  並用「距離 ÷ 日振幅」的比值表達而不是絕對百分比。**
  ｜⚠⚠ **「清單內的標的不作為估值錨」這條通則在本檔第七次適用，
  而且是第一次適用於「同一個因子格內的兩檔」**：
  **3131 與本檔同屬 `semi_equipment`，是最像同業的一組，
  但它在覆蓋清單內，所以不作錨。**
  **這說明那條通則不只跨層級關係有效（循環引用、零和競爭、相鄰零件、上下游、客戶），
  同層同格也一樣 —— 六種關係，同一個處置。**
  ｜⚠ **建檔時攔下一個錯誤的二手數字，值得記成一次小小的校準**：
  **某來源載 H1 2026 EPS 累計成長率 +9.82%，但法說載 +53.7%。**
  **由 Q1 2025 的 3.58 元與 Q2 2025 的 4.16 元推得 H1 2025 ＝ 7.74，
  11.9 ÷ 7.74 − 1 ＝ +53.7% —— 兩路一致，故判定 +9.82% 為錯誤。**
  ⚠ **若採信 +9.82%，會推得 Q1 2025 為 6.68 元、Q1 2026 年減約 50% ——
  一個完全不存在的衰退。二手成長率比二手絕對值更危險，因為它看起來已經算過了。**
  ｜⚠⚠ **月營收的四種形狀現在都有樣本，而本檔與 3081 是「三個維度都可讀」的那一種**：
  **去年基期平緩上升（3.68 → 6.08 → 5.46，沒有劇烈跳動）、年增率單調上升
  （6.18% → 103.06%）、累計年增率單調上升、環比連續八個月為正。**
  ⚠⚠ **但即使可讀，本檔仍刻意不把月營收年增率列為排序指標，而理由是新的**：
  **它在本族群量的是交機時點而不是競爭力 —— 設備營收依驗收認列，
  同一批訂單早交或晚交一個月就會讓年增率差很多。**
  **「可讀」與「可用來定序位」今天第一次分開，而這是「確認不到就換掉」規則的第四種失效類型：
  拿得到、讀得出訊號，但那個訊號量的不是序位該量的東西。**
  ｜⚠ **本檔的第四條 falsifier 是本輪第一次沒有標成「未驗證」的** ——
  **前六檔（AXTI、3661、8299、6805、3211、3131）都因為客戶集中度取不到而標未驗證。**
  **本檔改用管理層自己給的「訂單能見度直達 2027 年 Q2」當錨，繞開了那個缺口 ——
  有期限的管理層陳述，比一個查不到的年報欄位更容易變成可否證的東西。**
  ｜⚠ **另記一個同族群內的報表差異，它不是估值判斷而是事實**：
  **3131 的 ROE 約 51.4%、股價淨值比 23.97、股東權益週轉率約 2.38 倍；
  本檔為 22.0%／15.83／0.89 倍 —— 三項都明顯較低。**
  **同一個族群內差這麼多，值得在 /revalue 時查證是否有資產結構上的差異。**

event_log:
- date: 2026-09-12
  level: L2
  summary: 台股基準年修正連續作業第十九檔 — ⚠⚠⚠ 三件事的第一次：§9b① 的「目標價對現價差數倍」第一次真的觸發（FactSet 420 對現價 1,280）；券商通道第一次給出明確標註年度的 forward 倍數（BoFA FY2027 36x）；而它正好替換掉 base 那個循環的推導。加權目標價 1,443 → 1,463（+1.4%）
  delta: >
    ⚠⚠⚠ **(1) §9b① 的檢出法第一次真的觸發，而且是反方向。**
    FactSet 的目標價中位 **420**（5 位分析師，ID 6235662）對現價 **1,280** ——
    **現價是目標價的 3.05 倍。** 旁證：ID 6235662 遠早於本輪其他標的的 8 月速報
    （3661 為 6584148、3533 為 6576275、2317 為 6575035）。本檔亦無 EPS 型速報。
    **→ §9b① 的檢出法應寫成雙向的：不只「目標價遠高於現價」，
    也包括「現價遠高於目標價」—— 後者更容易被忽略，因為它看起來像「股價漲太多」
    而不像「資料太舊」。已回填 references。**
    ｜⚠⚠⚠ **(2) 券商通道第一次給出這個作業缺了五檔的東西：一個明確標註年度的 forward 倍數。**
    **美銀 BoFA 首次涵蓋、買進，基於 **FY2027 的 36 倍**預估本益比給目標價 **1,500**
    → 隱含 FY2027 EPS **41.67**。**
    **6531／3131／3533／3665／2317 全部踩到「用同業的 trailing 倍數乘 FY2027 的 EPS」，
    本檔是第一個有年度正確外部倍數的。**
    ⚠ **另一家券商（富邦，目標價 800、FY2026 EPS 20.62）已被實績推翻**：
    H1 2026 實際 EPS 11.87（Q1 3.37 ＋ Q2 8.50）佔其 **57.6%**，隱含 H2 僅 H1 的 0.74 倍，
    **而本檔營收逐月加速（月增率八個月全正、1–7 月累計 48.21 億元 +42.72%、
    Q3 前兩月月均比 Q2 高 37.8%）、Q2 EPS 季增 152.23%。**
    ✓ **3211 那輪建立的「拿已實現的 YTD 去對全年估計」第二次成功檢出陳舊估計。**
    ｜⚠⚠⚠ **(3) base 的倍數推導是循環的，而本檔是第三個全強度實例。**
    原文「理由是本檔已是設備五家中 PB ÷ 每點 ROE 最高的
    （本檔 0.654／志聖 0.573／3583 辛耘 0.414／3131 弘塑 0.410／京鼎 0.141）……
    不該再給族群最高的 PE」。**而 PB ÷ ROE(%) ＝ PE ÷ 100，五個數字全部對得上
    （65.4 ≈ 65.3／57.3 ≈ 57.39／41.4 ≈ 41.3／41.0 ≈ 41.0／14.1 ≈ 14.04）。
    所以那句話讀作「本檔的 PE 已是五家最高，所以不該給族群最高的 PE」——
    用現價隱含倍數設定目標倍數的上限。35 ÷ 65.3 ＝ 0.536。
    bull 的 42x 用完全相同的論證（0.643）；bear 的 30x 部分依賴
    （它的 PE 區間上界與中位數都包含本檔自己，與 3583 的同業序位同一個毛病）。**
    **⚠⚠ 與 3211 的差別：3211 的兩個 4.33 倍是同一次除法但結論是對的，刪掉重複的半句即可；
    本檔是整個推論結構循環（從「現在貴」推出「目標不該更貴」），必須換掉錨。
    → 發現循環時要分開問「結論錯了嗎」與「推導錯了嗎」，兩者的修法不同。**
    **處置：base 倍數 35 → 36（BoFA 明示的 FY2027 倍數）；
    bear 30x 與 bull 42x 數字不動，但重新表述為它的 -16.7% 與 +16.7%（對稱）。**
    ⚠ **§9b③ 要求 ≥3 家券商才能升格為主要來源 —— 那是對 EPS 的要求；
    而一個標註年度的外部倍數即使只有一家，也足以取代一個零資訊的循環推導。
    「倍數」與「EPS」的來源門檻應該分開。已回填 references。**
    **⚠⚠⚠ 採 36x 後數字只從 35 變 36（+2.9%）——
    循環的推導不一定給出錯的數字，所以「數字看起來合理」從來不是推導正確的證據。
    若以「結果合理」為驗收標準，這個錯誤永遠不會被發現。**
    ｜✓✓ **EPS 全部不動，而 base 的 40.0 是本系列驗證得最好的幾個之一**：
    自下而上的 40.0 對 BoFA 隱含的 41.67 **差 4.0%**，兩條完全獨立的路徑互證。
    **不改為 41.67：它是「目標價 ÷ 倍數」反推的單一來源重建值，而 base 有自己的完整推導。**
    **⚠⚠ 同一個檔案裡 EPS 側很穩、倍數側是全系列最差的推導之一 ——
    這正是為什麼 §9b 的四個檢查要分開做：一個模型可以一半對一半錯。**
    ⚠ **§9b(c) 無法以常規形式執行（無共識中位）；改以 bull 55.0 對 BoFA 隱含 41.67
    為 +32.0% 對照，方向正確。**
    ⚠ **§9b(d)：全距 3.50 倍；EPS 段 2.50 倍 >> 倍數段 1.40 倍 ——
    寬度主要來自「淨利率落在哪裡」，而那正是 thesis 的爭點，故加權平均有意義
    （對照 3211：寬度來自二元事件，加權無意義）。
    算術 1,463（+14.3%）對幾何 1,333（+4.1%），差 9.8%，兩者同號；
    但幾何僅 +4.1%、貼近零 —— 本檔是 3211 之後最接近跨越零的一檔。**
    ⚠⚠ **§9b(b) 本輪無法執行 —— 恆等式需要 TTM 與 FY2027 的營收，兩者皆未取得
    （無 EPS 型速報即無共識營收表）。這是 19 檔裡第一次做不了這項檢查。已列缺口。**
    ｜**錨定價 1,330 → 1,280（-3.76%）。標準的 §9b⑮ 形狀：
    `cta.price` 與 `key_ma` 用 09-09 的 1,330，而 `base.multiple_basis` 與均線註解
    用 09-10 的 1,280 —— 後者是對的。**
    ⚠ **09-11 收盤未取得：依 3211 那輪建立的規則（stockanalysis 不覆蓋上櫃）
    直接跳過那一次請求 —— 這是那條規則的第一次實際節省。**
    ⚠⚠⚠ **而價格修正又反轉了一個判定 —— 第四次（3131、3665、3211、本檔），
    且形狀是新的：同一個檔案裡的兩個區塊已經得到相反的結論，
    而因為各自標了不同日期，沒有人發現它們互相矛盾。**
    `key_ma`（09-09 的 1,330）算出「距離 14.67%、日振幅 7.22% → 比值 2.03 倍」，
    判為「本輪十四檔中第一檔均線兩端都過關」；
    **而同檔的六條均線註解（09-10）載「收盤 1280.00、日振幅 6.02%、MA60 1137.30
    在價格下方 11.15%」—— 比值 ＝ 1.85 倍，未達 ≥2 門檻。那個判定不成立，
    而 1.85 在提交當時就已經寫在檔案裡了，只是寫在另一個區塊。**
    **→ 價格一致性檢查不只要比對數值，還要比對由不同價格得出的結論。**
    ⚠⚠ **另記一個選擇偏誤**：四次反轉裡有三次（3665、3211、本檔）反轉的都是
    那條規則自己的「示範案例」。**示範案例被挑出來正是因為它落在門檻附近，
    而落在門檻附近的東西對價格最敏感 —— 這不是巧合。
    → 任何被標為「示範案例」或「第一個通過／不通過」的判定都應優先重算。**
