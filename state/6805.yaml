notes: >
  ⚠⚠ **本檔把本日反覆出現的「清單內標的能不能當錨」這件事收斂成一條通則，
  而這是本檔最有價值的產出：**
  **清單內的標的不作為估值錨 —— 不論它是競爭者還是鄰居。**
  **理由不是競爭關係，是錨的價值在於它獨立於我的判斷，而清單內的標的不獨立。**
  ⚠ **本日累積的四個案例正好涵蓋四種關係，而處置全部相同**：
  **(1) LITE／COHR —— 同層直接同業，而且已經發生了循環引用（必須拆）；**
  **(2) 3324／3017 —— 同層直接同業、零和競爭（建檔前攔下）；**
  **(3) AVGO／3661 —— 不同層但零和競爭（從一開始就不入 peers）；**
  **(4) 本檔與 3324／3017 —— 同一個液冷迴路上的相鄰零件，不是零和（同樣不入 peers）。**
  **第 (4) 種證明這條規則與競爭關係無關 —— 那是本檔的貢獻。**
  ｜⚠⚠ **營收組合在一年內翻轉，這是本檔的核心事實**：
  **AI 伺服器相關應用營收占比自去年同期 19.2% 拉升到 55.7%，正式成為最大營收來源。**
  **這不是成長，是換了一門生意 —— 而任何 trailing 倍數的分母裡，
  有四分之三以上的期間描述的是舊的那一門。**
  ⚠ **而 thesis 問的不是轉型有沒有發生（已經發生），是 55.7% 是台階還是峰值**：
  **Q2 營收季減 10.08%，管理層的解釋是「手機與伺服器新舊產品交替」——
  這是一門按專案計的生意，營收天生是塊狀的。**
  **加上液冷快接頭產能已逼近滿載，55.7% 短期內沒有向上的空間 ——
  下一個變動只能是向下或靠擴產。**
  ｜⚠⚠ **本檔是兩門生意，因此整體市營比 9.83x 被明文禁用作為主錨 ——
  與 AAOI（資料中心 56%／CATV 42%）是同一個禁用理由，本日第二次。**
  ⚠ **但本檔的分部拆解有一個 AAOI 沒有的優勢**：
  **純轉軸廠（新日興 3376、兆利 3548）的伺服器占比接近零，
  因此它們的倍數就是「本檔那 44.3% 消費電子業務值多少」的直接參照。**
  **消費那一半的錨是現成的，缺的只是去查。**
  ｜⚠ **順帶校正一個我自己的用語錯誤，記在這裡以便日後修**：
  **我在 AAOI 那檔把「分部／企業／每股」稱為跨層級軸，
  但 valuation-map 對層級軸的定義是「股權（P/x）／企業（EV/x）」——
  分部拆解不屬於那個軸，它屬於分母軸。**
  **AAOI 的三軸宣稱因此有一項偏鬆，應於下次 /revalue AAOI 改正。**
  **本檔不重複那個錯誤：分部拆解記在分母軸，層級軸誠實標為未跨。**
  ⚠⚠ **而層級軸跨不了的原因是同一個：淨現金／淨負債未取得 ——
  本日第五檔（2345、3017、3081、8299、本檔）。五次之後不該再列成 gaps，
  應該直接寫進建檔的固定步驟。**
  ｜⚠⚠ **本檔把那條雙邊 invalidation 規則的「太遠」那一端量到了最極端處，
  而本日十檔已經把整個分布填滿**：
  **-33.6%／-74.2%（AXTI，太遠）、-25.21%（本檔，太遠）、-20.25%（3017，剛好越線）、
  -18.20%（3081，可用）、-17.14%（3533，可用）、-13.08%（2345，可用）、
  -5.5%（AAOI，可用）、+0.30%（3661，太近）、-0.02%（8299，太近到極端）、
  完全未取得（LITE）。**
  **十檔之後這條規則已經有實證分布支撐，應正式寫進 references：
  invalidation 需與標的的日波動幅度相稱 —— 太遠（> ±20%）不是失效價位，
  太近（< 約一個日均振幅）也不是。**
  ｜⚠ **本檔是第二檔在建檔時就主動套用「先看去年那條線的形狀」判準的**（第一檔為昨日 8299）：
  **2025 年 1–8 月為 6.51 → 7.80 → 8.21 → 8.51 → 8.60 → 9.09 → 11.62 → 11.83 億元，
  往上斜且後段加速 —— 故 2026 年的年增率自 115.76% 降到 29.14% 有相當部分是基期，
  第一條 falsifier 因此改用絕對金額。**
  ｜⚠ **資料來源的可靠性本日再一次不一致，值得記成一條經驗**：
  **本檔的市值完全正確**（1,573.31 億元 ÷ 2,295 ＝ 0.6856 億股，
  與由 H1 稅後純益 ÷ EPS 推得的 0.6853 億股一致）。
  **對照本日 2345／3017／3081 皆少一個數量級、3661 差約 6%、8299 完全正確 ——
  六檔裡三檔有問題、三檔沒有。不可套用統一修正，每一檔都得自己驗一次。**
  ⚠ **另記一個同一頁面內部的不一致**：**wantgoo 的本益比用昨收 2,155 算
  （46.1x，與 46.75 的 TTM EPS 吻合），而股淨比用現價 2,295 算（17.67 ✓）——
  當日漲 6.5%，兩個比率的價格基準不同。這不是大錯，但拿它們互相推算時會出問題。**

