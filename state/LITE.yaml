        ⚠ **EV/EBITDA 109.46 是用真實 EBITDA（800.7M）算的，不受債務清償費用影響。**
        **「淨損是假的」與「倍數是貴的」兩件事同時為真，不可用前者否定後者。**
  changes_if: >
