    8 月 **10.31 億**（**+150.82%**、MoM -6.61%）—— 鉅亨營收速報 2026-09-07。**
    **而 stockanalysis 的 FY2026 共識營收是 101.1 億元（+78.36%），僅 **2 位分析師**。**
    **→ 共識隱含 9–12 月需 35.11 億元、月均 **8.78 億** —— 比 7–8 月實際月均 10.68 億低 **17.8%**，
    而 8 月的年增率還有 +150.82%。**
