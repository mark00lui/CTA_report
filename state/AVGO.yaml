  basis: >
    ⚠ **建檔評級，非估值結論** —— 三情境尚未建立（見 scenarios 的註記），
    因此本評級**不含任何目標價的判斷**，只反映技術面與證據狀態。
    **不給偏多**：`confirm_trigger` 是「收盤站回 50DMA 383.66 之上並連三個交易日維持」，
    **現況 357.90 距此 +7.2%，不成立**。
    價格**同時跌破 50DMA 與 200DMA**，**下方已無均線支撐**，距 52 週高 **-27.7%**。
    ⚠ **依 SKILL.md：升級為偏多需右側技術確認，基本面再強都不跳過 ——
    而本檔的基本面強度在覆蓋清單中名列前茅（Q3 營收 +86%、Q4 指引 +93%、AI 營收 +221%），
    正是這條規則最該生效的情形。**
    **不給偏空**：Q4 已有明確指引且方向向上；49 位分析師 **37 強力買進／0 賣出**；
    50DMA 仍高於 200DMA（均線本身仍是多頭序）；自由現金流利潤率 **44.2%**。
    ⚠ **信心低，四個理由，而第一個決定了上限**：
    (1) ⚠⚠ **沒有任何可用的倍數錨，而這是本檔獨有的情形。**
        資料完整度是清單裡最高的（一手 8-K、Q4 指引、分部營收、49 位共識、三家同業），
        **但每一個錨都失效**：EV/Sales 在族群內幾乎無鑑別力（全距 14.3% 對營益率差 3.9 倍）、
        自身歷史 forward PE 區間未取得、forward PE 的基準年未確認（20.68 對 30.75 差 48.7%）。
        **依 valuation.md，錨都拿不到時信心上限壓到「低」——本檔正是那個情形。**
    (2) **客戶集中度未取得** —— 自研 ASIC 最大的單一風險，而 thesis 問的正是「持續期」。
    (3) **基準年 FY2026 殘餘度 0.25** 低於門檻，且 **FY2027 共識在付費牆後、滾不動**。
    (4) **技術面明確不支持**：跌破兩條均線、下方無均線支撐。
    ⚠ **EPS 錨寬度 3.35% 是全清單最窄，但明確不因此升信心** ——
    口徑是非 GAAP，且 FY2026 只剩一季而那一季已被指引。
    **窄反映的是「時間快到了」，不是「對價值有把握」。**
