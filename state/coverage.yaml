  ⚠_三檔的_EPS_那一格_100_是市場的數字: >
    **TSM**：現價 435.36 ÷ forward PE 19.77 ＝ **22.02**，對 base EPS **22.00**（差 0.1%）
    ｜**SNDK**：1,764.17 ÷ 8.24 ＝ **214.10**，對 base EPS **214.10**（**差 0.00%，分毫不差**）
    ｜**MSFT**：491.65 ÷ 24.89 ＝ **19.75**，對 base EPS **19.75**（差 0%）
    ⚠ **SNDK 最需要小心**：**EPS 100% 抄市場，而 base 倍數 7x 的 multiple_basis
    開頭就寫著「無獨立估值基礎」。** 它的 **-14.3%** 因此**不是一個有力的偏空理由** ——
    它只是「市場付 8.24x 而本模型沒有根據地選了 7x」。
    **不寫明會被誤讀成模型有話要說。**

  ⚠_最深的四檔負空間有兩種不同成因: >
    **CEG -37.4%／8046 -31.6%／3037 -30.1%／3008 -27.7%**
    ・**8046／3037／3008 三檔同為 Q3 循環或選擇權型標的**，
