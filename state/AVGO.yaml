    **在無法逐字核對的數字上，不得因為它是好消息就升等。**
    ⚠ **forward PE 的基準年爭議本輪解開，由三個獨立推導收斂**：
    ① 頁面 forward PE 20.68 → 隱含 EPS **17.31**；
