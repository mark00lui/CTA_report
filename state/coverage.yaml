      ⚠ **但已同時寫下四個限制**：A 股與美股的市場 regime 不同（且 A 股通常給更高而非更低的倍數，
      這使對照更不利於美股標的）、會計與揭露口徑不同、規模差異大、
      **AAOI 的混合毛利率被 42% 的 CATV 拉低而分部別毛利率未揭露。**
      **在這些補上之前，它是序位的輸入，不是結論。把它當武器很容易，當尺才有用。**
      ｜⚠ 三檔同層標的的序位對比一併記下：
      **非 GAAP 毛利率 LITE 50.4% ／ COHR 37.50% ／ AAOI 29.8%（AAOI 墊底）；
