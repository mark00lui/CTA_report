    ⚠⚠⚠ **雙邊規則缺少「觸發餘裕」這一半，而本檔是第一個讓它咬到的案例。**
    規則規範的是一個位階能不能被**選為**失效價位（下界 ≥2 倍 ATR、上界 ≤20%），
    **但它從未規定「價格要穿過那個位階多少，才算觸發」。**
    **本檔實測：週收盤低於當期 200DMA 僅 0.021 個 ATR，而字面上條件成立 ——
    選取門檻（2 倍）與實際觸發幅度（0.02 倍）差一百倍。**
    **餘裕敏感度：要求 0 個 ATR → 觸發；0.25 個 → 不觸發。答案完全取決於一個未指定的參數。**
    ⚠ **本輪把條件改寫為「低於當期 200DMA 達 0.5 個 ATR 以上」，但 0.5 只是候選值 ——
    它會影響所有檔的觸發判定，屬覆蓋層決定。**
  how_to_close: 在覆蓋層收尾報告裡訂下觸發餘裕的值（候選 0.5 個 ATR），寫進 references/state-schema.md 的雙邊規則一節，並對全清單已設定的 invalidation 逐檔重跑一次「若今日觸發，餘裕是多少」
