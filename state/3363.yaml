driver_refs:
- driver: accelerator-roadmap
  direction: '+'
  note: >
    互連規格世代 → 光學引擎（OE）速率 → **光纖陣列（FAU）的精度與密度要求**。
    一手佐證：**公司 2025 年以 1.6 Tbps 的 OE 切入可插拔與 CPO 交換器，
    2026 年直上 6.4 Tbps OE**；**FAU 產品 2026 Q3 起出貨，初期以 3.2T 為主，
    明年推進至 6.4T 甚至更高規格**。
    ⚠⚠ **而本檔對本 driver 帶進一個此前沒有的層次：機櫃內（Scale-up）。**
    **公司明言不僅要支援機櫃間的 Scale-out 網路，
    更要攻入機櫃內部 **XPU 與 HBM 互連**的 Scale-up 核心市場。**
    **本清單此前的光互連標的（AXTI／3081／COHR／LITE／AAOI／6442／3008）
    全部對應機櫃之間或伺服器之間的連結；本檔是第一個把 driver 的傳導
    延伸進「加速器與記憶體之間」的。**
    ⚠ **扇出時的實務後果**：**Scale-up 的節點數遠大於 Scale-out ——
    若這條路線成立，本檔的數量彈性與其餘光互連標的不是同一個量級。**
    **但它同時也更依賴「CPO 是否如期放量」這個前提，因為 Scale-up 的光連結
    幾乎不存在可插拔的替代路徑。**
- driver: ai-accelerator-demand
  direction: '+'
  note: >
    加速器出貨 → 光學引擎與 FAU 的掛載量。
    ⚠⚠ **但敏感度必須先乘上一個很小的占比，否則會完全誤讀本檔的當期損益**：
    **傳統光纖跳線（Patch cord）目前提供 **76%** 的營收 ——
    亦即本檔今天的營收有超過四分之三與 FAU、CPO、Scale-up 全部無關。**
    **FAU 產品 2026 Q3 才開始出貨。**
    ⚠ **公司自估 2026 至 2028 年 FAU 三年累計營收貢獻上看約 70 億元 ——
    對照 FY2025 全年營收 18.92 億元，那約當 3.7 年的現有營收規模。**
    **這個數字是本輪唯一一個「公司同時給了金額與時程」的選擇權估計，
    也是主錨的另一半。**
- driver: hyperscaler-capex
  direction: '+'
  note: >
    CSP 資本支出 → CPO 交換器與機櫃內光互連的採用 → FAU 需求。
    ⚠ **時滯記「領先 2–3 季」**：**FAU 是封裝進 PIC／COUPE 的元件，
    規格定案與樣品驗證早於量產出貨。**
    **一手佐證：公司已向全球超過 5 家潛在巨頭客戶交付了多款 CPO 樣品。**
    ⚠⚠ **而本檔的傳導有一個此前沒記過的性質：它同時是資本支出的接收端與投入端。**
    **公司於 2026 年至 2027 年第 2 季規劃投入資本支出約 **15.38 億元**建置產線，
    其中 FAU 生產機台約占 **10.8 億元** ——
    對照 TTM 營收約 17.52 億元，這是 87.8%。**
    **亦即本 driver 的變動若在產線建好之前反轉，本檔承擔的是已投下去的固定資產，
    而不只是訂單的減少。**

valuation_frame:
  quadrant: Q3
  quadrant_basis: >
    ⚠⚠⚠ **X 軸（當期盈餘代表性）＝ 極低，而本檔的分母已經穿過零。**
    **TTM EPS **-1.18 元**（近四季）；2026 Q2 EPS **-0.22 元**
    （季增 +80%、年減 -225%）；由季增 +80% 反推 Q1 2026 約 **-1.10 元**。**
    **對照 FY2025 全年 EPS **+0.16 元** —— 一年之內自小幅獲利翻成明顯虧損。**
    ⚠ **而報價頁的本益比欄位直接顯示「--」（未揭露），那就是分母為負的直接證據。**
    ⚠⚠ **Y 軸（資本密集度）＝ 高，而且是本輪最明確的一次判定。**
    **公司於 2026 年至 2027 年第 2 季規劃投入資本支出約 **15.38 億元**，
    其中 FAU 生產機台約占 **10.8 億元**。**
    **對照 TTM 營收約 **17.52 億元**（市值 804.58 億元 ÷ 市營比 45.92）：**
    **整個計畫的 capex／營收 ＝ **87.8%**；以六個季度年化後仍約 **58.5%** ——
    **遠超過 15% 的門檻，而且不是勉強超過，是超過三到六倍。**
    ⚠ **折舊占營收比重與淨負債皆未取得（列 gaps）。**
    **但 15.38 億元對淨值約 56.97 億元（每股淨值 50.13 元 × 推算股數約 1.1364 億股）
    是 27% —— 資金來源是關鍵而非細節。**
    ｜⚠⚠⚠ **結論：低 X ＋ 高 Y ＝ Q3（資產與循環）。本輪十八檔中第三檔落在 Q3。**
    ⚠⚠ **而三檔 Q3（AAOI 的 128.97%、3081 的 217.8%、本檔的 87.8%）全部是靠擴建進來的，
    沒有一檔是因為循環位置。**
    **valuation-map 現有的 Q3 成員（MU／SNDK／3037／8046／6239）則全部帶 cyclical 標籤。**
    **這個象限實際上住了兩種完全不同的公司 —— 建議拆成「循環型」與「擴建型」，
    已是第三次提出。**
    ⚠⚠ **而本檔比前兩檔更極端一件事：它的當期盈餘是負的。**
    **原有的五檔 Q3 成員沒有一檔在納入時是虧損的。**
