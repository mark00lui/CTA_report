  並事先寫定了兩個改錨條件。那些條件現在多了一層意義：它們同時是解除循環引用的路徑。**
  ｜⚠⚠ **建檔當日修正了本倉庫既有的一個錯誤判讀，記在這裡以便日後校準**：
