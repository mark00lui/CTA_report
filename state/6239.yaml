- name: 市場共識與目標價
  value: 2026 EPS 三個估值 10.9／12.96／14.26（離散度 31%）；目標價 FactSet 335（11 位）、官股投顧 400
  unit: 元
  tier: 推論
  source: >
    法說後多機構上調，2026 EPS 預估可望達 **10.9 元**。
    FactSet 最新調查：目標價自 310 調升至 **335 元**（幅度 8.06%，11 位分析師），
    最高 500、最低 260。評等分布 10 看多、1 中立。
    ⚠ **共識可能偏保守**：H1 實績已 5.5，達成 10.9 只需 H2 做 5.4（約與 H1 持平），
    而公司明確指引 Q3／Q4 逐季成長、全年營收有望超越 2022 年歷史高峰。
    若 Q3／Q4 分別做到 3.4／3.8，全年約 12.7 —— 較共識高 17%。
    ⚠ 這是本倉庫第四次遇到台股共識落後的情形（前三次：3037 的 2026 共識 18.96 對
    H1 實績 11.73、3324 的公司上修目標而 FactSet 同期下修、8046 的過期速報 EPS 2.47）。
    ⚠ 另注意：搜尋中出現的 FactSet「EPS 預估 7.25–7.57」等數字為 **2025 年度**，非 2026，
    引用時不可混用。
    ⚠ **2026-09-01 第二次重估：「共識偏保守」已從我的推測變成可對照的事實。**
    取得一份明顯較高的賣方估值：**2026 營收 998 億元、EPS 12.96 元、目標價 400 元**。
    共識區間因此拉開為 **10.9 – 12.96**。
    ⚠ **10.9 這個數字現在可以判定為內部不一致**：H1 實績 5.5，達成 10.9 只需 H2 做 5.4
    （**低於** H1），而公司明確指引 Q3／Q4「逐季走高」、產能完全滿載。
    **一個與公司指引方向相反的共識數字，不該當成 base 的輸入。**
    故 base EPS 自 10.90 改為 **11.60**（Q3／Q4 約與 Q2 的 3.0 持平的保守情形），
    仍**低於**公司指引隱含值、也遠低於樂觀端的 12.96。
    ⚠ 這是本倉庫第四次遇到台股共識落後（3037、3324、8046、本檔），
    但**第一次拿到公司自身指引可以直接判定共識不一致**，而非只是「我覺得偏低」。
    ⚠ **2026-09-01 第三次重估補入第三個估值，且它是最高的一個**：
    官股金控旗下投顧給本檔 **2026 EPS 14.26 元 × 28 倍 = 目標價 400 元**，
    理由為「DRAM 相關封測業務營收進一步成長」、產能利用率維持高檔。
    **同一份報告同時給日月光 EPS 14.20 × 42x = 600、京元電 EPS 13.89 × 23.8x = 330** ——
    ⚠ **這是本檔第一次取得「同一套方法、同一時點」的同業對照，也就是錨 B。**
    三個 2026 EPS 估值因此為 **10.9／12.96／14.26，離散度 31%**。
    ⚠ 離散度這麼大本身就是資訊：H2 佔全年的比重極高而能見度低（FOPLP 只收 NRE、
    DDR5 TSV 要 Q4 才量產），賣方對 H2 的斜率假設差異極大。
    base 因此改用 **12.10**（Q3 約 3.2、Q4 約 3.4，即公司「逐季走高」指引的溫和版），
    落在三個估值的中間偏低。
    ⚠ 另記一項需要留意的反向資訊：公司在 2026-04-28 法說會對全年營收的指引為
    「年增率挑戰高個位數至雙位數」，而 H1 實績已 +32% —— **該指引已被自己的實績超越，
    屬過期資訊，不可用來反推 H2 會大幅放緩。**
