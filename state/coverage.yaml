  accelerator:    {count: 2, pct: 10.5,  note: "⚠ **2026-09-08 納入 AVGO，本因子自 1 檔變 2 檔 —— 而兩檔是競爭關係，不是同向曝險。** NVDA 賣商用 GPU、AVGO 為超大規模業者設計自研 ASIC，**兩者在「自研對外購」這一題上互為替代**。⚠ **這是本清單第一個「加深因子集中度卻同時降低方向一致性」的新增** —— 對照 COHR 當時是「集中度與可檢驗性同時上升」。實測（2026-09-04 收盤）：EV/Sales AVGO 19.51 對 NVDA 18.28（幾乎相同），但 **EV／營業利益 AVGO 40.1x 對 NVDA 28.0x（AVGO 溢價 43.2%）**；NVDA 營益率 65.21% 對 AVGO 48.59%、FCF 127.01B 對 39.4B、淨現金 23.61B 對淨負債 35.44B。原註：NVDA — 加速器供應端。同時是 drivers/ai-accelerator-demand 的主要成分"}
  memory:         {count: 3, pct: 15.8, note: "MU + SNDK + 6239 — ⚠ 2026-09-01 納入 6239 後，本因子內部**第一次出現方向分歧**：MU／SNDK 賺記憶體**價格**，6239 賺封測**服務費、按顆計價** —— 漲價進不了 6239 的損益，它受惠的是**量**。若漲價機制是「減產挺價」而非需求成長，對 MU／SNDK 是利多、對 6239 是利空。此前本格的警告只是「同向但不等深」，現在是**可能反向**。原註： 記憶體供應端。⚠ 清單內唯一「營收即他檔成本」的一組。⚠ 2026-08-27 SNDK 重估後修正：兩檔同向但不等深 —— NAND 上一輪谷底毛利率為負（WD Flash −11.9%），DRAM 為 2.7%，且 MU 有 HBM 的先進封裝瓶頸、SNDK 無對等結構"}
  cyclical:       {count: 6, pct: 31.6, note: "MU + SNDK + 3037 + 8046 + 6239 + 3030 — 循環股。⚠ 2026-09-08 納入 3030：檢測設備需求跟隨**客戶的資本支出循環**，是本因子內第四種不同源的循環（記憶體商品循環／載板產能循環／封測稼動率循環／設備資本支出循環）。**四者的供給側決策者與前置期都不同，不可視為同一個賭注的四種寫法。**原註：其餘標的的風險來自論點，這三檔的風險來自循環位置。⚠ 2026-08-31 納入 3037（ABF 載板為典型產能循環，52 週區間 129.50–1,230，上緣為下緣的 9.5 倍）。但它與記憶體兩檔的循環**不同源**：MU／SNDK 是記憶體商品循環，3037 是載板產能循環，兩者的供給側決策者、擴產前置期與客戶結構都不同 —— 不可視為同一個賭注的三種寫法"}
  cpo:            {count: 3, pct: 15.8, note: "6442 + 3008 + COHR — ⚠ 2026-08-27 當日自 0 檔成長到 3 檔。三者切入點不同（6442 光通訊產品、3008 自 FA／PMLA／FAU 光學元件端、COHR 自磷化銦雷射與收發器垂直整合）但共用同一個「CPO 是否如期放量」前提。⚠ 但 COHR 的加入同時帶來反向效果：它是三者中唯一給出第一手時程（初期營收 2026 年 12 月當季、scale-up 曆年 2027 下半）的標的，因此雖然加深了因子集中，卻讓這個共同前提第一次變得可外部檢驗。集中度與可檢驗性同時上升，這在本清單是第一次"}
  optical:        {count: 3, pct: 15.8, note: "6442 + 3008 + COHR"}
  substrate:      {count: 2, pct: 10.5, note: "3037 + 8046 — 2026-09-01 納入 8046 後**一個月內自 0 檔變 2 檔**。ABF 載板在 AI 供應鏈上與 TSM 互補而非替代（TSM 做晶片與 CoWoS，載板廠做承載它的載板），故不是對 foundry 曝險的分散。⚠ **更重要的是這兩檔彼此也不是分散** —— 同一種產品、同一個漲價循環、PB 同樣位於各自三年區間頂部（3037 為 14.0x 對區間 1.51–14.99；8046 為 16.13x 對區間 1.40–16.39），連三年平均都幾乎相同（5.5 對 5.47）。這一格的 14.3% 應視為**一個循環的兩種寫法**"}
