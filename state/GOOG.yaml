    **偏空**：Search 營收成長 | 10% | < | 實績算數 | 季報 —— 連兩季。
    **偏空（技術面）**：週收盤 | 當期 200DMA（現值 335.21） | < | 收盤價算數，盤中價不算數 | 美股週線。
      ⚠ **最近檢驗點為 2026-09-11（五）收盤**，現價 328.38 已在其下，待週收盤確認。
    **偏多**：收盤 | 當期 50DMA（現值 346.09） | > | 收盤價算數 | 美股日線 ——
      且其後放量突破 404.47（52 週高）才成立。
