    依 valuation.md 並列兩個框架：正統的中週期正常化（8 年平均 EPS 6.47 × 15x = 97；
    完整循環平均 7.71 × 15x = 116；峰谷中點 11.71 × 15x = 176）顯示現價是它的 5.7–10.3 倍。
    ⚠ 但同時寫出該框架的失效理由：2018–2025 的欣興以 PC／手機載板為主，AI 占比 2025 年
    才約 40%、2026 年 60%+、下半年拚七成 —— 用那個期間的平均描述現在的公司會系統性低估。
    正確讀法不是「貴了 8.6 倍」，是「市場假設 AI 位移足以把中週期 EPS 抬升近一個數量級」。
    base 20x 的錨以 PB 反推：對 2027 估計帳面值約 115 為 PB 5.7x，落在台廠載板中週期
    1.5–3x 與「ROE 40%、r 10%、g 5% 反推的合理 PB 7.0x」之間 —— 這是【部分結構性】的
    定量表述。⚠ 現價的 PB 14.0x 高於 40% ROE 所能支撐的水準，那是 bull 的內容不是 base 的。
    ⚠ 三項本次新發現，全部寫進 state：
