    但年度 EPS 的複利是平滑的。我當時只看了季度。**
    ⚠ **判讀的教訓：穩定度要在跟決策同一個時間尺度上衡量。三情境用的是年度 EPS。**
    ⚠⚠⚠ **因此本檔明文不並列中週期正常化（序列單調 → 不適用）。**
    **若硬做：四年平均 10.13 × 36 ＝ 365（-47.7%）。**
    **而同格的 3131 與 6187 都適用正常化（序列震盪）—— 三檔在同一格卻分屬兩種處方。**
    ｜⚠⚠⚠ **同業序位：設備五家的 PB ÷ 每點 ROE 完整排序**
    **京鼎 3413 的 0.141 ＜ 3131 的 0.410 ≈ 本檔 0.414 ＜ 志聖 2467 的 0.573 ＜ 6187 的 0.654。**
    **本檔與 3131 幾乎相同 —— 兩檔的 ROE 差 3.7 倍（14.4% 對 53.8%）、
    PB 差 3.7 倍（5.96 對 22.06），兩個比率同步差故相除後相等。**
    **這個巧合有診斷價值：市場對這兩檔用的是同一套定價邏輯，對 6187 與京鼎用的不是。**
    ⚠ **而本檔的 ROE 14.4% 在五家中偏低（僅高於志聖的 10.0%）——
    與它的商業模式一致：代理業務佔相當比重，而代理的資本報酬率結構性低於自製。**
