    eps: 59.00
    exit_multiple: 30
    multiple_basis: >-
      > ⚠⚠⚠ **2026-09-11 全面改建，這是本輪的核心：EPS 改為 FactSet FY2027 共識中位數 59.00（舊值 51 對應不到任何會計年度 —— 它是由資料商 forward PE 反推的 1,620÷31.84=50.88，而同一個資料商的預估頁寫 FY2026 是 40.65）。** **基準年依 references/forward-estimates.md §4 自「不明」改為 **FY2027**（進入下半年後滾動至 FY+2）。** ⚠⚠ **EPS 59.00 有三條獨立交叉驗證**：元大中信 57.7、凱基 60.7、美系大行 65.1（三家中位 60.7，對共識中位 59.00 差 +2.9%）；**另有第四條不經過任何共識** —— 用 2026-07-16 的季度路徑（H1 實際 3,426.09 億、Q3 +15% QoQ、Q4 +8% QoQ）回推 FY2026 營收 7,809.6 億，對 S&P 共識 7,779.8 億差 +0.38%。 ⚠⚠⚠ **倍數 30x 的建構：2301 的 FY2027 觀測倍數 22.97x × 2308 在 FY2026 觀測到的溢價 1.310 ＝ 30.08x。兩個乘數都是觀測值不是判斷值（依 INTC 那一輪的三層規則）。** **對照 2308 自己的 FY2027 現價隱含倍數 27.46x，30x 高出 +9.3% —— 這就是獨立意見的幅度，且它不是現價隱含倍數。** ⚠ **而 30x 偏保守且方向已知**：溢價應反映成長差，而 FY27→28 的成長差（2308 +58.1% 對 2301 +26.0%）大於 FY26→27 的（+50.1% 對 +37.0%）—— 亦即 2308 在 FY2027 基準上應得的溢價高於 FY2026 觀測到的 +31%，用 +31% 是取較低的那個。 ⚠ **循環性檢查：base 1,770 相對錨定價 1,620 為 +9.3%，在 ±5% 帶之外 —— 不是「沒有獨立意見的產物」。對照上一輪 base 345 與當時現價僅差 0.25%。** ⚠ **並記 FactSet 那張多年表是 2026-05-02 的，已過期四個月**，而其後歐系外資曾上修 FY2027／FY2028 達 5~6%（2026-07-16）→ **59.00 偏保守，偏差方向已知。**
      錨在**族群 forward PE 中位數 33.55x（三點：2308 35.17／2301 23.35／VRT 33.55）折 16.5%**，
      **折價幅度＝營益率差幅**（本檔 16.70% vs VRT 19.96%，低 16.3%）——
      每一段調整指名一個可觀測數值。
      ⚠ **非現價隱含倍數**（現價隱含 35.2x）。
      ⚠ **交叉驗證（選擇權拆分）**：以 FY2026E 營收 7,400 億、AI 相關 40% ≈ 2,960 億、
      非 AI 60% ≈ 4,440 億、EV 4.548 兆計 —— 非 AI 若以 2301 的 EV/Sales 3.37x 計價，
      AI 殘值隱含 **10.31x**（對 VRT 8.84x 溢價 16.6%）；若以 4.5x 計價（反映台達毛利率
      35.64% 高於光寶 24.08%），AI 隱含 **8.61x**（大致合理）。
      **拆分給的是區間不是單一值，且情境 B 較可信 —— 故拆分偏向「AI 那塊大致合理定價」，
      與序位法的「整體偏貴」幅度不同，兩者並列不掩蓋。**
      ⚠ **三個方法論限制**：跨市場比較（台股 vs 美股）；三家 forward 的會計年度未逐一確認；
      族群僅三個觀測值。
    tp: 1770
    narrative: 28x 為族群中位數依營益率差幅折價後的值，低於現價隱含 35.2x
  bull:
    p: 0.20
    p_basis: >-
      > ⚠⚠⚠ **2026-09-11：機率一個字未動（依規則機率是使用者的判斷），但它的語意變了，必須單獨記**：機率原本掛在**敘事情境**上，現在掛在**共識分布的百分位**上 —— 0.30 的 bear 現在的意思是「最悲觀的那一位分析師有三成機率對」，那不是同一個陳述。**內部一致性檢查：機率加權 EPS ＝ 0.30×41.08 ＋ 0.50×59.00 ＋ 0.20×80.91 ＝ 58.01，對共識中位 59.00 為 -1.7%、對平均 60.06 為 -3.4% —— 加權本身只有輕微偏保守，沒有因語意改變而引入大偏差。但語意的改變應由使用者確認。**
      ⚠ **低於 bear。** 營益率自 16.70% 追至 19–20% 需要 3.3pp，而過去兩年才走了 5.4pp
      （11.33 → 16.70）且伴隨 AI 占比自低基期衝到 40% —— **占比不可能再翻一倍，
      故利潤率的第二段擴張比第一段難。**
    key_assumption: 營益率向 VRT 靠攏至 19–20%；AI 占比破五成；800VDC 領先同業
    eps: 80.91
    exit_multiple: 30
    multiple_basis: >-
      > ⚠⚠⚠ **2026-09-11 改為「共識分布上緣 × 與 base 相同的倍數」：EPS 80.91 是 FactSet FY2027 的最高估計。** ⚠⚠ **倍數刻意不給擴張，維持 30x，而這是證據的限制不是判斷**：**FY2027 基準上只有兩個觀測倍數點（2301 的 22.97x 與建構的 30.08x），30x 以上沒有任何觀測錨** —— VRT 的 FY2027 取不到、6412 覆蓋太薄。**代價要明寫：若 AI 電源的重評價同時發生在倍數上，bull 被低估。** ⚠⚠⚠ **而這同時是一個刻意的全距控制**：若 bull 改用 2308 自己的 FY2026 觀測倍數 41.22x，bull 會是 3,335，**全距變成 3,335 ÷ 945 ＝ 3.53 倍，超過「≥3 倍則算術平均嚴重偏移」的門檻**（同 3211 的 10.39 倍問題）。**現在的全距 2,427 ÷ 945 ＝ 2.57 倍，在門檻之內，算術加權可用。** **→ 當 EPS 的離散度已由共識分布提供時，倍數的情境化要節制，否則是把同一個不確定性算兩次。** ⚠ **舊 bull 敘述「倍數向歷史區間下緣修復，但即使 bull 也假設永久折損未完全消失」的框架已不適用** —— 舊 bull 走的是「自身歷史區間」這個錨，而自身歷史 forward PE 分位至今仍未取得（state 原列第一優先缺口），所以那個框架本來就沒有數字支撐。
      錨在 **VRT forward 33.55x 平價** —— 營益率追平則倍數追平，**不給溢價**
      （本檔仍有約六成非 AI 本體拖累混合倍數）。
    tp: 2427
    narrative: 33x 為 VRT 現行 forward 平價，對應價仍低於 52 週高 2,585
  weighted_tp: 1654   # = 0.30x945 + 0.50x1770 + 0.20x2427 = 1,653.9；相對錨定價 1,620 為 +2.1%
  # ⚠ 前值 1374（相對舊錨 1,795 為 -23.5%、相對正確錨價 1,620 為 -15.2%）。變動 +20.4% → 但判 L3 不是 L2。
  # ⚠⚠⚠ 變動要分三段歸因，而三段全是方法與資料的修正，沒有一分來自新的營運消息：
