# 公開研究檔 — 本倉庫不含任何倉位資訊：無成本、無數量、無權重、無 Kelly、無損益、無持倉揭露。
# 未知值一律留 __ 並寫進 gaps，不要填看起來合理的數字。
#
# ⚠⚠ 建檔當下最重要的五件事，寫在最前面：
#   (1) ⚠⚠⚠ **本檔最重要的發現不在營收，在三個獲利層級同時往三個方向走**：
#       **2026 Q2 毛利率 6.12%（年減 0.21pp，↓）；營業利益率 3.75%（年增 0.60pp，↑↑）；
#       淨利率約 2.37%（對 Q1 的 2.35%，幾乎不動，→）。**
#       **而營業利益年增 68%，稅後淨利只年增 30%。**
#       **「稅後淨利 ÷ 營業利益」自去年上半年的約 83.7% 降到今年上半年的約 64.5% ——
#       掉了約 19 個百分點。thesis 問的就是這 19 個百分點去了哪裡。**
#   (2) ⚠⚠⚠ **本檔是本輪第二檔 Q1（盈餘倍數），前一檔是 3533 嘉澤 ——
#       十九檔裡只有兩檔。**
#       **但 X 軸判高的理由必須精確：有代表性的是**營業利益**，不是稅後淨利。**
#       **那個區分本身就是 thesis。**
#   (3) ⚠⚠⚠ **本檔是覆蓋清單第一檔「清單的客戶」——
#       3017／3324（散熱）、3533（連接器）、3665（線材）、6805（樞紐）、2308（電源）
#       賣的東西，最後都裝進它組的機櫃裡。**
#       **而它的法說立刻產生了一個買方一手證詞：「上修資本支出年增三成以上，
#       提前擴充伺服器機櫃、**液冷**及測試產能」。**
#   (4) ⚠⚠⚠ **市營比 0.35 —— 本清單最低，而同日建檔的 3363 上詮是 45.92。**
#       **同一天、同一條 AI 鏈上、相差 131 倍。**
#   (5) ⚠⚠ **比值 0.04 倍日振幅（季線距現價 0.06% ÷ 日振幅 1.59%）——
#       本輪第二極端，僅次於 8299。**
#       **而它揭露了那條規則缺的第四個條件：絕對下界。** 見 cta 註解。
