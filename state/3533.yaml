    AAOI 的 DOCSIS 循環）。三次就是模式不是巧合** ——
    **三個現有 driver 全部只記「AI 資本支出的流量」，而清單正在納入越來越多不由那個流量驅動的標的。**
    建議新增 `server-platform-cycle`，與先前建議的 `datacenter-power-demand`、
    `broadband-access-capex` 一併排程。
    ⚠ `accelerator-roadmap` 經考慮後**刻意不引用**並記錄了理由（本檔跟的是 CPU 平台 roadmap，
    不是互連 roadmap）——**記錄「刻意不引用」與記錄「引用」一樣重要。**
    ｜⚠ **另記一個尚未解決的疑點**：TTM 淨利率推得約 **24.5%**，
