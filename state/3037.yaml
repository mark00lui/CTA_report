    門檻於 2026-08-31 設定。本條是二元的，刻意不設百分比 —— 公司與美系外資都稱本案
    限於含 HDI 的 PCB 段（占營收約 36%），thesis 也建立在這個切割上。切割一旦破裂，
    受影響的是 52% 的 ABF，那不是模型微調而是論點層事件，直接 L3。
    ⚠ 這是四條中唯一沒有數字門檻的一條，理由是它的性質就是二元的；
    數字化的版本見第二條。
- condition: 月營收連兩月 YoY 低於 +15%，且公司未歸因於季節性或客戶排程
  check_by: 2027-02-28
