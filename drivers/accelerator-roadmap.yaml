      ⚠ **該文從頭到尾沒有提到本清單任何一檔**，它是以聯發科視角寫的 FOPLP 產業文。
      它的價值在於提供**座標系**，而非個股消息。
      新增內容：面板格式（510×515 與 600×600，後者有效產能達 300mm 晶圓數倍、降本最高約一成）、
      封裝軌跡（面積 1.2 倍光罩 → 10 倍以上，功耗 100W → 1,000W）、
      時間常數（聯發科投入 7 年、3 年到首項量產、單一產品導入周期 8–9 個月）、
      生態分工（晶片設計公司整合晶圓代工／封測／材料／設備／EDA —— **封測廠是被整合方**）、
      OSAT 競賽（力成 2025-05 已小量出貨，日月光同期才要年底試產、2026 送樣，差約一年；
      但力成 510×515 小於日月光 600×600，時程領先、格式落後）。
