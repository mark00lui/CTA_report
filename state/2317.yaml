    **「賺多少」與「值幾倍」兩者都同意，差異全來自 bear／bull 兩翼。
    一個 3.48 兆市值、22 位分析師覆蓋的標的本來就不容易有資訊優勢；
    而上面那條淨利率路徑，是目前唯一一個可以與街上分歧的著力點，
    因為它是有數字的、可否證的預測。**
    ⚠ **位階整理、價格幾乎貼在還原後季線上（在其下 0.21%）、右側確認無從判定，維持中性。**
    ⚠ **本句原寫「失效價位因太近而不可用」—— 2026-09-12 以官方值與 ATR 重算後該描述不成立：
    還原後 MA240 達 2.96 倍 ATR，是合格的失效價位；不可用的是上方所有位階。**
    ⚠ **「中性」在本檔的意思是「尚無估值判斷」，不是「多空平衡」。**
    三情境與加權目標價未建立。
    ⚠⚠ **技術面（2026-09-12 改用官方值與 ATR）：上方仍然沒有可用的技術條件，
    而下方有了一個。** 價格與除權還原後的季線幾乎重合（相距 **0.21%**，**0.09 倍 ATR**，
    比前一輪以日振幅算的 0.04 倍更極端）；**上方四條均線擠在 0.56 個 ATR 內，
    叢集上緣也只有 0.64 倍 ATR —— 站過整個叢集都不構成右側確認。**
    ✓ **而 `invalidation` 自 235.26 改為還原後 MA240 230.12（2.96 倍 ATR），
    是六條均線中唯一通過雙邊規則的位階。**
    **依 CTA 紀律不得升為偏多（右側未確認），但也沒有跌破任何東西。**
    ⚠ **信心壓在「低」有四個具名理由：**
    (1) ⚠⚠⚠ **thesis 押的那 19 個百分點還沒有解釋** ——
