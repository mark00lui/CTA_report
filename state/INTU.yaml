  source: >
    FY2026（截至 2026-07-31）營業現金流 8.838B、資本支出僅 221M（占營收 1.0%）、
    自由現金流 8.617B；營收 21.448B ⇒ FCF 利潤率 40.2%。每股 FCF 31.50 美元。
    現金與投資 7.2B、總負債 8.34B、企業價值 95.75B ⇒ EV/FCF 11.11x。
    ⚠ 上述 FCF 未扣 SBC。FY2026 起 non-GAAP 納入 SBC，其規模約 1.59B（每股 5.81 美元），
    是真實的股東成本；扣除後 FCF 約 7.03B、殖利率 7.4%。兩個數字都要看。
    ⚠⚠⚠ **2026-09-11 上面兩個數字都被推翻，而錯誤都同方向（讓本檔看起來更便宜）：**
    **(1) SBC 實際是 2,056 百萬不是 1,589 —— 原值把指引的「每股 5.81 美元」當稅前數乘股數，
    而 5.81 是稅後數，低估倍數正好是 (1 − 24% 稅率)。扣 SBC 後的 FCF 應為 6,561 而非 7,030。**
    **(2) 更重要的是 8,617 本身不乾淨。五年 FCF 利潤率 29.33% / 33.66% / 28.82% / 32.52% / **40.18%** ——
    FY2026 高出前四年區間上緣 6.5pp，而營益率只增加 2.6pp，解釋不了 7.7pp 的躍升。**
    **對帳（淨利＋D&A＋SBC＋營運資金−capex 對實際 FCF）：前四年差額 +345／−294／−233／−77，
    FY2026 是 **+1,548**（營收的 7.22pp）—— 前四年最大絕對值的 4.5 倍，
    且 +7.22pp 幾乎正好等於 FCF 率躍升的 7.7pp。**
    **用公司指引的算法獨立驗證：FY2026 新口徑營益 6,844 × 76% ＋ D&A 672 ＋ SBC 2,056 − capex 221
    ＝ 7,708，對實際 8,617 差 **+909** —— 與對帳差額同階，兩者都指向 FY2026 的現金稅負
    遠低於 24% 的長期假設。**
    ⚠ **判為遞延所得稅加回是推論不是事實**（新聞提及 FY2026 Q4 有壓低 GAAP 淨利的稅項，
    遞延性質的稅項會在現金流量表加回而推升營運現金流）——**需 10-K 明細確認，列為首要缺口。**
    **→ 可用於折現法的基期：FY2026 乾淨值 5,652（用於 bear）、
    FY2027 指引推算 6,581（＝ 8,104 × 76% ＋ 672 ＋ 2,020 − 250 − 2,020，用於 base／bull）。**
    **→ 而這一格的修正對估值的影響比折現率錨定大 2.6 倍：基期造成 5.0pp 的隱含成長率差距，
    折現率網格只造成 1.9pp。**
    ⚠ 本格於 2026-08-27 取代原「AI功能貨幣化證據」—— 後者無數字門檻、變動 20% 無從定義，
    不符 schema 的 key_variable 判準，已移入 gaps。
