# 共用驅動因子。這一層存放「多檔標的共用、且不屬於任何單一標的」的變數。
# 規則：一個共用事實只能有一個家。個股 state 用 driver_refs 引用，不複製數值。
id: ai-accelerator-demand
name: AI 加速器實際需求（NVDA／AMD／自研 ASIC）
what_it_is: 加速器供應端每季實際認列的資料中心營收與下一季 guidance，含各家成分與合計
why_shared: >
  這是 hyperscaler-capex 的「實際落地面」。capex guidance 是平台端的支出承諾，
  加速器營收是那筆錢真正變成出貨的部分 — 兩者可以背離，而背離本身就是訊號。
  它同時決定 TSM 的投片、3324 的機櫃附載、6442 的互連埠數，不屬於任何單一標的。
  ⚠ 2026-08-27 修正：本欄原寫「NVDA 與 AMD 不在覆蓋清單內，正因如此它們的數字只能住在這一層」。
  NVDA 已於 2026-08-27 納入覆蓋清單，該前提不再成立 —— 但結論不變。這個變數屬於這一層的理由
  是「它同時驅動三檔硬體端與三檔平台端」，與某一家是否被覆蓋無關。
  不要因為前提失效就把數值搬進 state/NVDA.yaml；NVDA 改以 driver_refs 引用本檔。

current:
  value: 95.7
  unit: USD bn（單季資料中心營收合計；NVDA + AMD，**不含**自研 ASIC）
  as_of: 2026-08-27
  tier: 推論
  source: >
    NVDA Q2 FY27（季末約 2026-07-26，2026-08-26 公布）資料中心 89.0
    + AMD Q2 2026（季末 2026-06-27，2026-08-04 公布）資料中心 6.7。
    兩家季末差約一個月，非嚴格同期；自研 ASIC 無公開揭露故未計入。
    因此本值是**下限**，且列推論而非事實 —— 兩個成分各自是事實，合計的口徑不是。
  yoy: "+116%（NVDA +117%、AMD +107%；合計基期約 44.2 = NVDA 約 41.0 + AMD 3.2）"

components:
  - name: NVIDIA Data Center
    value: 89.0
    as_of: 2026-08-26
    source: NVIDIA Q2 FY27 財報與法說 2026-08-26；+117% YoY、+18% QoQ；毛利率 75.0%
    guidance: >
      Q3 FY27 總營收 108 ±2%（未單獨拆 DC），且明確假設中國資料中心運算營收為零。
      ⚠ 2026-08-31 補入法說會揭露 —— 原記錄只有財報數字，以下三項當時全數漏掉：
      (1) **FY2028 營收成長指引約 +70%**，且明言為供給受限而非需求上限。黃仁勳：
          Even though our demand is much greater than 70%, our supply allows us to
          confidently deliver 70%。對一家不慣給遠期指引的公司，這是異常強的前瞻承諾。
      (2) **毛利率路徑**：Q3 74.0% ±50bp → Q4 觸底 71–72% → FY2028 回到 72–73%
          （FY2028 Q1 漲價後）。CFO Colette Kress 明確歸因於記憶體成本 exceeded our
          prior expectations and are headed even higher into next year。
          ⚠ 這是成本問題不是需求問題 —— 直接決定第二條 falsifier 不觸發。
      (3) **資料中心營收拆解**（公司自 Q1 FY27 起改變分部揭露）：hyperscaler 48.7 +
          ACIE（AI clouds／industrial／enterprise）40.3 = 89.0。ACIE YoY +138%，
          成長快於 hyperscaler —— 需求來源正在分散，對「四大 CSP capex 是唯一上游」
          的隱含假設是一個反例，也是 cross_check 那條 caveat 的量化版本。
  - {name: AMD Data Center, value: 6.7,
     guidance: "管理層稱資料中心於 2026 下半年加速；Q3 分部指引未於本次取得（見 gaps）",
     source: "AMD Q2 2026 財報 2026-08-04；+107% YoY，占總營收 58%；分部營益 2.1（去年同期虧損 0.155）；MI350 出貨、MI400 系列發表",
     as_of: 2026-08-04}
  - {name: 自研 ASIC（TPU／Trainium／MTIA）, value: __, guidance: "__", source: "__", as_of: __}

supply_commitment:   # 2026-08-31 新增 —— 記憶體需求的第一個一手量化證據
  as_of: 2026-08-26
  value: 279
  prior: 119
  unit: USD bn（NVIDIA 對供應商的採購承諾）
  tier: 事實
  source: >
    NVIDIA Q2 FY2027 財報與 CFO Colette Kress 說明（2026-08-26）—— 採購承諾自三個月前的
    119 增至 279（逾一倍），公司明確表示增幅 primarily related to the procurement of memory。
    另揭露總未來承諾約 366（＝供應承諾 279 + 雲端協議 29 + 長期資料中心租賃與股權投資）。
  note: >
    ⚠ 這是「記憶體排擠 capex」主題第一次拿到**一手、量化、且來自公司財務長**的證據。
    notes/2026-08.md 於 2026-08-27 記下該主題已累積三次佐證卻拒絕晉升為 driver，理由是
    第三次為 TrendForce 經二手來源引用、未讀到原始報告，而前兩次是公司自己說的。
    本次補上的正是那個缺口：不是產業機構的推估，是 NVIDIA 自己為鎖定記憶體簽下的
    279 bn 承諾，以及它對自身毛利率約 3pp 的實際壓縮。
    ⚠ 方向要看清楚：對記憶體廠（MU／SNDK）這是需求利多，對加速器廠與其下游是成本利空。
    同一則消息方向相反，是常態不是例外。
  gap: >
    ⚠ 279 中記憶體占多少未揭露，只說 primarily。無法據此推算記憶體的絕對採購金額，
    也就無法與 TrendForce 的「記憶體占 CSP capex 68%」相互驗算。

history:   # 修正的方向與速度比絕對值更有訊息量
  - {as_of: 2026-05, value: 81.0, note: "NVDA Q1 FY27 資料中心 75.2（+92% YoY、+21% QoQ）+ AMD Q1 2026 資料中心 5.8（+57% YoY）"}
  - {as_of: 2026-08, value: 95.7, note: "NVDA 89.0 + AMD 6.7；合計 QoQ +18.1%。首次建立本序列，兩點皆不含 ASIC"}

# 這個 driver 的主要價值不是絕對金額，而是與 hyperscaler-capex 的交叉驗證
cross_check:
  against: hyperscaler-capex
  logic: >
    capex guidance（承諾）持續上修、但加速器營收與 guidance 停滯 → 錢沒有流向加速器，
    可能流向土地廠房電力，硬體鏈的受惠程度低於 capex 金額所暗示的。
    反之加速器營收超前而 capex guidance 未動 → 平台端的 capex 可能即將上修。
  action: 兩者連兩季背離 → 硬體端 L2，並在報告中明寫是哪一邊先動
  status: 未背離
  as_of: 2026-08-27
  finding: >
    方向一致，兩邊都在加速，本季無背離訊號。但成長「速率」不同：
    加速器合計 +116% YoY，四大 CSP capex +77% YoY。若口徑可比，這意味 capex 中
    流向運算的比重正在上升 —— 對硬體端而言是「每一元 capex 的含金量提高」，屬正面。
  caveats: >
    上述比較有兩個口徑問題，未解決前不得當成結論，只能列為觀察：
    (1) 分子涵蓋範圍大於分母。NVDA 的客戶不限於四大 CSP —— 其 AI Clouds／
        Industrial & Enterprise 營收 +138% YoY 至 40.3（含主權、AI-native、企業），
        這些需求不在四大 capex 的分母裡。
    (2) 期間不對齊。capex 是曆年 2026 全年 guidance，加速器是單季；把高速成長中的
        單季年化會低估全年。
    (3) 分母本身已知有誤：hyperscaler-capex 的 Microsoft 成分仍為 190，
        公司 2026-07-29 已揭露曆年 2026 約 175（會計年限口徑，非需求下修），
        合計 725 連帶高估。修正後比值會更偏向加速器。

transmission:
  # ⚠ MU 與 SNDK 於 2026-08-31 補入。此前兩檔在覆蓋清單內卻不在任何 driver 的 transmission，
  # 是一個結構缺口 —— 而 NVIDIA 於 2026-08-26 揭露採購承諾自 119 增至 279 bn、
  # 明言 primarily related to the procurement of memory，等於用一手證據證明了這條路徑存在。
  # 在此之前它只是「看起來應該相關」，沒有可引用的傳導證據，所以沒建。
  - ticker: MU
    direction: '+'
    path: >
      加速器出貨與供應商採購承諾 → HBM 與伺服器 DRAM 需求 → 合約價與毛利率。
      ⚠ 與其他硬體端的傳導性質不同：3324／6442／COHR 是「加速器賣得多，我的零件就賣得多」，
      本檔是「加速器廠為了鎖料，願意用更高的價格簽更長的約」—— 傳導的是**價格**不是數量。
      因此該 driver 上修時，本檔的反應應先出現在合約價與毛利率，而非出貨量。
      ⚠ 反向註記：同一筆記憶體成本對 NVDA 是毛利率壓縮（Q4 觸底 71–72%），對本檔是漲價。
      **方向相反，不可套用同一結論。**
    lag: 領先 1–2 季（合約價先於出貨認列）
    sensitivity: 高（HBM 是本檔 thesis 的核心變數）
    affects: ['HBM進度', '毛利率', '單季營收']
  - ticker: SNDK
    direction: '+'
    path: >
      加速器出貨 → 資料中心儲存需求 → NAND 合約價。
      ⚠ 強度低於 MU：NVIDIA 的 279 bn 採購承諾主要指向 HBM／DRAM，NAND 是間接受惠
      （資料中心建置的儲存層），不在加速器 BOM 的關鍵路徑上。
    lag: 領先 1–2 季
    sensitivity: 中（間接傳導，且本檔無 HBM 對等結構）
    affects: ['資料中心營收成長', '漲價貢獻占季增比重', '毛利率']
  - ticker: '3037'
    direction: '+'
    path: >
      加速器出貨 → 載板投片。⚠ 方向要看清楚：已認列的加速器營收對本檔是同步偏落後指標
      （載板要先做出來），真正領先的是下一季 guidance 與長約 —— 與 TSM 的註記同構。
    lag: 領先 2–3 季
    sensitivity: 高
    affects: ['ABF載板營收占比與成長', '月營收']
  - ticker: COHR
    direction: '+'
    path: >
      加速器出貨 → 機櫃內外互連埠數 → 800G／1.6T 收發器需求。
      ⚠ 本檔在此條傳導上是**供給受限**而非需求受限：管理層明言 FY2027 的競爭地位
      「由產出產能決定，而非市場准入」。該 driver 上修時，本檔的營收上限由自有磷化銦
      產出決定，不由需求決定 —— 這與 3324、6442 的傳導性質不同，不可套用同一個結論。
    lag: 領先 2–3 季
    sensitivity: 中（需求已鎖定，邊際需求變動不改變近期營收）
    affects: ['資料中心營收成長', 'InP產能擴張進度']
  - ticker: NVDA
    direction: '+'
    path: >
      合計加速器需求 → NVDA 的可及市場與定價權。方向為 '+' 但**內含一個反向成分**：
      合計數若主要由自研 ASIC 貢獻，對 NVDA 是替代而非受惠。看合計時務必同時看成分結構。
    lag: 同步（本檔的主要成分就是 NVDA 自己的認列營收）
    sensitivity: 高
    affects: [毛利率, 客戶集中度]
  - ticker: TSM
    direction: '+'
    path: 加速器需求 → GPU/ASIC 投片與 CoWoS 封裝 → 先進製程營收占比與產能利用
    lag: >
      注意方向：NVDA/AMD 已認列的營收落後 TSM 投片約 1–2 季（晶片先做出來才賣得掉），
      因此「已認列營收」對 TSM 是同步偏落後指標；真正領先的是下一季 guidance 與長約。
      引用時務必分清你用的是哪一個。
    sensitivity: 高
    affects: [先進製程營收占比, CoWoS月產能]
  - ticker: '3324'
    direction: '+'
    path: 加速器出貨量 → 伺服器機櫃數 → 液冷附載率與單機價值量
    lag: 領先 2–3 季（散熱晚於晶片）
    sensitivity: 高
    affects: [液冷滲透率, 北美CSP訂單能見度, 產能利用率]
  - ticker: '6442'
    direction: '+'
    path: 加速器出貨量 → 機櫃內外互連埠數 → 光通訊產品需求
    lag: 領先 2–3 季
    sensitivity: 中（單一客戶占比高，傳導不純；族群需求對它不等於訂單）
    affects: [光通訊產品營收占比]
  - ticker: MSFT
    direction: '-'
    path: 加速器採購 → 資產啟用 → 折舊費用 → 營益率
    lag: 落後 2–4 季（折舊隨資產啟用才入帳）
    sensitivity: 中（低於 hyperscaler-capex，因本檔只涵蓋 capex 中的加速器部分）
    affects: [營益率]
  - ticker: GOOG
    direction: '-'
    path: 同上；另因自研 TPU 比重高，外購加速器的傳導強度低於同業
    lag: 落後 2–4 季
    sensitivity: 中
    affects: [資本支出, TPU外部採用進展]
  - ticker: META
    direction: '-'
    path: 同上；Meta 無公有雲直接變現加速器投資，ROI 質疑最強
    lag: 落後 2–4 季
    sensitivity: 中
    affects: [資本支出guidance, 總費用guidance]

# INTU 刻意不列入 transmission：它是 AI 應用端，不在加速器需求鏈上。
# 它在覆蓋清單裡的作用正是與 capex 因子低相關，把這類事件套到它身上會毀掉那個作用。

falsifiers:
  - condition: "加速器合計營收連兩季 QoQ 轉負，且非產能或供應因素"
    check_by: 2027-02-28
    status: 未觸發
    evidence: "2026-08-27：合計 QoQ +18.1%（81.0 → 95.7）。NVDA Q3 指引再 +12% QoQ。距離觸發很遠"
    action: 硬體端全面 L3；平台端視為折舊壓力緩解（方向相反，須分開處理）
  - condition: "任一家明確將 guidance 與『客戶消化庫存／需求不足』連結，而非『供應受限』"
    check_by: 2026-11-30
    status: 未觸發
    evidence: "2026-08-27：NVDA 稱『compute is revenue』並上修至 108；AMD 稱下半年加速。兩家措辭皆為需求側正面，無庫存消化語言"
    action: 最早的轉折訊號，優先度高於金額本身
  - condition: "自研 ASIC 合計占加速器出貨比重超過 30%（外購加速器被實質取代）"
    check_by: 2027-02-28
    status: 未驗證
    evidence: "無公開揭露，目前無法驗證。門檻 30% 於 2026-08-27 設定：低於此比重時外購仍為主流，超過則 ASP 與互連規格的話語權開始移轉"
    action: 對 TSM 中性（都在台積電投片），對加速器 ASP 與 6442 的互連規格是 L2

checkpoints:
  - {date: '2026-11', event: "NVIDIA Q3 FY27 財報（依慣例推估 11 月中下旬）", what_to_watch: "是否達 108 指引、毛利率是否守住 74%、中國是否恢復貢獻、供應受限措辭是否鬆動、Vera Rubin 出貨進度"}
  - {date: '2026-11', event: "AMD Q3 2026 財報（依慣例推估 11 月初）", what_to_watch: "資料中心是否如管理層所稱在下半年加速、MI400 系列客戶分布、客戶集中度"}
  - {date: '2026-10', event: "四大 CSP Q3 財報", what_to_watch: "自研 ASIC 的部署比重是否被主動揭露；capex 是否因加速器需求再上修"}

update_cadence: 每季財報；期間僅有供應鏈查證與第三方出貨估計
