# 公開研究檔 — 本倉庫不含任何倉位資訊：無成本、無數量、無權重、無 Kelly、無損益、無持倉揭露。
# 未知值一律留 __ 並寫進 gaps，不要填看起來合理的數字。
#
# ⚠⚠ 建檔當下最重要的四件事，寫在最前面：
#   (1) ⚠⚠ **本檔迫使我修正一條我昨天才寫定的通則，而修正的理由與本檔無關**：
#       **辛耘同時是 3131 弘塑與 6187 萬潤的同業 —— 把它納入清單，
#       依昨日「清單內的標的不作為估值錨」那條禁令，會同時抽掉兩檔的錨。**
#       **那條禁令有一個壞的尺度性質：覆蓋清單越大，可用的同業越少。**
#       **一條「讓清單變大時自己變得更沒用」的規則，多半是規格寫錯了。** 細化見 notes。
#   (2) ⚠⚠ **本檔的月營收極度平穩（八個月全在 9.71–10.68 億元之間，全距僅 10%），
#       而它的單季淨利率在四季內走過 24.5% → 8.2% → 11.1% → 14.0%（全距 16.3 個百分點）。**
#       **營收幾乎不動而獲利劇烈波動 —— 波動完全來自組合，不是量。**
#       **這是本輪三檔設備商裡最乾淨的一次證明。**
#   (3) ⚠⚠ **本檔是連續七檔以來第一次拿到客戶集中度的真實錨點**：
#       **公開揭露 2024 年對台積電的機台銷貨收入 20.36 億元（2023 年 9.29 億元）。**
#       **前六檔（AXTI、3661、8299、6805、3211、3131）的第四條 falsifier 都因為
#       這個數字取不到而標「未驗證」。**
#   (4) ⚠ **本檔是三檔設備商中最可能被 Y 軸誤判的**：**再生晶圓月產能 21 萬片 → 25 萬片
#       是實質的資本支出，而 capex／營收 未取得。若 > 15% 則本檔應為 Q3 而非 Q4。**
