driver_refs:
- driver: hyperscaler-capex
  direction: '+'
  note: >
    CSP 資本支出 → 資料中心光互連埠數 → 矽光子模組 → **CW 雷射與檢光器磊晶片**。
    一手佐證：Q2 2026 營收 **12.21 億元（年增 121%、季增 35%）**、
    **Datacom 佔營收 80–85%**（主要為矽光子用 CW 雷射）、
    8 月營收 **5.20 億元（年增 180.90%）**、前 8 月累計 **31.47 億元（年增 129.04%）**。
    ⚠ **終端客戶以美國 CSP 為主，但地區營收中國佔 70–80%** ——
    **因為全球約 75% 的資料中心模組產能在中國。**
    **亦即需求源頭與出貨目的地分屬兩地，這是本檔獨有的結構（見 notes）。**
    ⚠⚠ **本檔在本 driver 上的時序位置**：它在 AXTI（基板）之後、收發器族群之前，
    **因此對同一個 capex 訊號的反應早於 COHR／LITE／AAOI／6442，晚於 AXTI。**
- driver: accelerator-roadmap
  direction: '+'
  note: >
    互連規格世代（800G → 1.6T → 3.2T）→ 每埠所需波長數 → **多波長 CW 雷射需求**。
    ⚠ **本檔對本 driver 的曝險是規格導向而非數量導向**：
    **管理層明言「市場上宣稱能做 CW 雷射的同業幾乎都只有單波長能力」，
    而多波長方案在 3.2T 等高速應用中具備差異化、製程難度與單價顯著更高。**
    **亦即規格世代往上走，本檔的單價與護城河一起變厚 —— 這是量以外的一條傳導。**
    ⚠⚠ **但本檔刻意未標 `cpo`，理由見 notes** ——
    **它今天的 CW 雷射需求主要來自可插拔矽光模組，CPO 是額外的上檔而非前提。**
- driver: ai-accelerator-demand
  direction: '+'
  note: >
    加速器出貨 → 收發器掛載量 → 矽光引擎 → CW 雷射。
    ⚠ **敏感度高但當下無法量化** —— 需要「每模組所需 CW 雷射顆數 × 多波長溢價」兩個係數，
    **兩個都未取得**（與 AXTI 同樣的缺口）。**扇出時應明寫「無法量化」而非「無影響」。**

valuation_frame:
  quadrant: Q3
  quadrant_basis: >
    **X 軸（當期盈餘代表性）＝ 低，機制是「成長率與獲利結構同時遠離穩態」。**
    ⚠ **分母沒有壞掉，而且很健康**：Q2 2026 **營業利益率 47%**（季增 +6pp、年增 +20pp）、
    **淨利率 38%**、**毛利率 57%**（季增 +2pp、年增 +14pp）、EPS **4.62 元**。
    **這與同日 AAOI（營業利益從未為正）完全不同。**
    ⚠⚠ **但它落在低代表性，理由有兩個且都指名數值**：
    (a) **成長率遠離穩態**：Q2 營收年增 **121%**、8 月月營收年增 **180.90%**、
        前 8 月累計年增 **129.04%**；
    (b) ⚠⚠ **獲利結構在一年內整個換掉**：毛利率年增 **14pp**、營業利益率年增 **20pp**、
        淨利率年增 **384%**；**且 Q2 EPS 創「39 季新高」——
        意思是過去約十年的獲利水準沒有一季能代表現在。**
    **任何 trailing 或中週期的數字在這條曲線上都是在描述另一家公司。**
    ｜**Y 軸（資本密集度）＝ 高，而且是本清單至今最極端的一次。**
    **近三季 CAPEX 累計近 60 億元**（法說揭露）；**近三季營收約 27.55 億元**
    （Q4 2025 約 6.3 ＋ Q1 2026 的 9.04 ＋ Q2 2026 的 12.21）
    → **capex／營收 ≈ 217.8%，是 15% 門檻的 14.5 倍。**
    以年化口徑計亦達約 **201%**（60 億 ÷ 3 × 4 ＝ 80 億，除以 TTM 營收約 39.76 億元）。
    ⚠⚠ **對照同日的 AAOI 為 128.97%（我當時記為「門檻的 8.6 倍」）—— 本檔是新紀錄。**
    ⚠⚠ **而最重要的一個比率與 AAOI 那檔同型**：
    **折舊約 7,500 萬元／季，占 Q2 營收 12.21 億元僅 6.14%** ——
    **capex 218% 對折舊 6.14%，相差 35 倍**（AAOI 為 129% 對 5.92%，21.8 倍）。
    **這個落差本身就是結論：正在蓋的資產尚未投入服務、尚未開始折舊。**
    **管理層自訂的上限是「折舊占營收 8–12% 以下」—— 那條線目前還沒被碰到。**
    ｜⚠⚠ **結論：低 X ＋ 高 Y ＝ Q3（資產與循環）。**
    **而這是本日第二檔以「資本支出擴建」而非「商品循環」進入 Q3 的標的（第一檔為 AAOI）——
    兩次就不是個案。** 見 excluded 與 notes。
