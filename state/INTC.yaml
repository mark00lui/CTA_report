notes: >
  ⚠⚠⚠ **本檔最重要的一件事，是它讓層級軸在連續十三檔之後第一次真的被跨過 ——
  而原因不是本檔比較特別，是我這次去查了合併資產負債表。**
  **前十三檔的缺口全部是同一個動作沒做，而我在上一輪自己說過要把它變成固定步驟。**
  **這一條應該回填 references 的建檔檢查表。**
  ⚠⚠⚠ **而一查就發現它是本檔最關鍵的數字**：
  **非控制權益 **$15,601M**，占股東權益 $103,143M 的 **15.1%** ——
  Intel 的晶圓廠有相當一部分的經濟利益不屬於母公司股東，
  而公司指引 2027 與 2028 的非控制權益各約 **$1.1B／年**（GAAP）。**
  **亦即 forward PE 60.13 的分母每年要先扣掉約 $1.1B。**
  ⚠ **對照 2317 鴻海**：**我在那一檔發現「營業利益年增 68% 而稅後淨利只年增 30%」，
  三個候選解釋之一就是非控制權益，而我沒拿到數字。本檔拿到了，而它是 15.1%。**
  **兩檔合起來說明：非控制權益不是會計細節，是母公司股東實際拿到多少的問題。**
  ⚠ **四軸全跨（分母／參照／時間／層級）是本輪二十一檔中的第一次。**
  ｜⚠⚠⚠ **本檔是「擴建型 Q3」的第四例，也是最極端的一例 ——
  它擴的不是產能，是一整個還沒有客戶的事業。**
  **Foundry 部門單季虧 **$2.1B**，而全公司單季淨利只有約 **$2.2B**
  （EPS $0.42 × 5.25B 股）—— 產品端賺的約 $4.3B 被吃掉一半。**
  **而外部客戶營收只有 **$293M**，約該部門營收 $5.8B 的 **5%**。**
  ⚠⚠⚠ **但本檔同時揭露了「中週期正常化 EPS」的第三種失效方式，而它是新的。**
  **已知的兩種是：(1) 沒有中週期可正常化（3363 的 TTM EPS 為 -1.18、序列太短；
  AAOI 與 3081 同）；(2) 有完整循環可正常化（2337 旺宏，兩個預設錨都能用）。**
  **本檔是第三種：**有三十年豐富的循環歷史，但那個中週期屬於一家已經不存在的公司。**
  **Intel 的歷史描述的是「壟斷 x86 的 IDM」，而現在的 Intel 是「要變成代工廠的公司」——
  正常化會把答案帶回一家不存在的公司，而那比沒有歷史更危險，
  因為它會產出一個看起來很有根據的數字。**
  ⚠ **這一條應與「Q3 拆成循環型／擴建型」的建議一起寫進 references：
  拆分之後，擴建型的處方裡必須明寫「不要對轉型前的歷史做正常化」。**
  ｜⚠⚠⚠ **本檔與 TSM 是本清單**第二組**「循環引用」與「零和競爭」同時發生的配對**
  （第一組是 3363／3008 的 FAU）。
  **TSM 原本是 `foundry` 因子格內唯一一檔；本檔納入後變成兩檔，
  而兩檔搶的是同一批先進製程訂單 —— Apple 已收到 Intel 18A-P 的初始設計套件評估。**
  ⚠⚠ **但本組比 3363／3008 多一個必須保留的可能性，這一點不可省略**：
  **代工訂單可能是**新增**的（整體晶圓需求擴大）而非**轉移**的。**
  **若是新增，兩檔同向；若是轉移，兩檔零和。**
  **FAU 那一組的市場規模相對固定，轉移的成分高得多；先進製程不是。**
  **在分不清之前不可預設其中一種 —— 這是「零和」這個標記第一次需要附帶條件。**
  ｜⚠⚠⚠ **本檔在 driver 層的位置是清單此前沒有的：它同時在三個位子上，而方向不同。**
  **(a) 賣 CPU 給 CSP（與清單上賣硬體的標的同向）；
  (b) 賣代工產能給 AI 晶片設計商（那是 TSM 的位子）；
  (c) 是 NVDA 在資料中心運算上的競爭者。**
  ⚠⚠ **而更麻煩的是 (c) 與 (b) 在**同一檔內部**方向相反**：
  **加速器需求若完全由 GPU 吃下，對本檔的 DCAI 是排擠；
  但同一筆需求若走向自研 ASIC，本檔的代工那一層反而受惠。**
  **AVGO 那次記下的是「清單內兩檔之間方向相反」；
  本檔是「同一檔內部兩個通道方向相反」—— 那是新的，而且更難處理。**
  ｜⚠⚠ **三把尺的現值要並列著記，因為它們之間的落差就是 thesis**：
  **trailing PE **n/a**（TTM EPS -$2.30）、forward PE **60.13**、
  EV/Sales **9.88 倍**、市值／PPE **4.99 倍**。**
  ⚠ **對照昨日建檔的 2337 旺宏**：**那一檔是三個本益比差 3.7 倍（29.98／13.1／8.1），
  本檔的 trailing PE 根本不存在。**
  **兩檔都是「分母剛穿過零」，但穿過之後的高度完全不同 ——
  旺宏年化後是 8.1 倍，本檔年化後是 60 倍。而那才是估值的全部。**
  **「分母剛轉正」本身不是資訊；轉正之後到哪裡才是。**
  ｜⚠⚠ **技術面完全缺，而本檔還揭露了比值規則的第二個問題**：
  **本檔的日振幅只有 **3.66%** 而 Beta 是 **2.23**（本輪最高）——
  小區間是跳空造成的（當日最高 $103.23 低於昨收 $106.24），不是波動度低。**
  **用單日振幅當比值的分母在本檔會低估真實雜訊，應改用 20 日平均振幅（ATR）。**
  ⚠ **這是 2317 鴻海那條「絕對下界」之後，比值規則第二個需要修的地方：分母的穩健性。**
  **兩條應一起回填 references。**
  ⚠ **並記下本檔的 52 週全距是 **492%**（$24.05 → $142.35）、Beta **2.23**，
  兩者都是本輪二十一檔中最大的 ——
  一檔一年內走過 $24 到 $142 的股票，任何單一日的技術判讀能承載的資訊都很有限。**
  ｜⚠ **代號風險記在最後但優先級不低**：**INTC 是 Intel，INTU 是 Intuit，
  而 INTU 已在覆蓋清單內（標籤為 ai_application ＋ saas，與本檔毫無關係）。**
  **本倉庫第四次遇到代號近似的風險**（前三次：3413／京鼎、3221 台嘉碩／3211 順達、
  Aiptek 天瀚／6531 愛普）。
  **四次之中有三次是在同一週發生的 —— 這個頻率本身說明它不是偶然，
  而建檔前對一次「代號與公司名是否真的對得上」應該是固定步驟。**

event_log:
- date: 2026-09-11
  level: L2
  summary: 手動全量重估（建檔當日）— 建檔時列的四個阻塞有兩個解除（分部營收與營業利益、50 與 200 日均線），主錨 SOTP 因此首次可執行；首次建立三情境，加權目標價 76.25 美元（相對 2026-09-10 收盤 100.32 為 -24.0%）
  delta: >
    ⚠ **建檔當日重估的理由**：**建檔時三情境刻意留空並列了四個具體的阻塞，
    而其中兩個可以用公開資料立刻關掉 —— 而它們一關掉，主錨就能執行。**
    **✓✓ 關掉：#1 的產品端（分部營收與營業利益）、#4（50 與 200 日均線）。
    ✓ 部分關掉：#2（四家同業的 forward 本益比與市值取得，但 Foundry 需要的市值／PPE 沒取得）。
    ❌ 仍開著：#3（非控制權益 156.0 億的口徑，使 PB 有三個讀法差 18%）。**
    ｜⚠⚠⚠ **本次最重要的產出是一個反推，而它不需要我為 Intel Foundry 定價**：
    **現價企業價值 5,476.9 億 − DCAI 2,400 億 − CCG 700 億 ＝ 現價隱含的 Intel Foundry 價值
    約 2,377 億美元；÷ Foundry 的 PPE 約 900 億 ＝ **市值／PPE 2.64 倍**。**
    **而 Intel Foundry 是：年化營收 232 億、年化營業虧損 84 億、外部客戶營收只有 2.93 億。**
    **亦即現價要求市場為這些廠付帳面淨值的 2.64 倍。**
    ⚠ **絕對金額的量級對照（比金額不比倍數，不違反 primary 寫死的禁用）**：
    **2,377 億 ＝ 聯電整個市值 566.1 億的 4.2 倍、GlobalFoundries 252.2 億的 9.4 倍 ——
    而那兩家都在賺錢。**
    ⚠⚠ **極端檢查**：**即使把 DCAI 抬到 3,640 億（＝AMD 的 forward 本益比 45.51）
    並把 CCG 抬到 840 億，現價仍隱含 Foundry 值 997 億 ＝ 市值／PPE 1.11 倍 ＝ 聯電的 1.76 倍。**
    ｜✓✓ **Q2 2026 分部數字取得**：**DCAI 營收 63 億（季增 24%、年增 59%）、
    營業利益 25 億（佔營收 40%）→ 年化 252 億／100 億；
    Intel Foundry 營收 58 億（季增 6%，18A 產出高於目標約 25%、季增超過 50%）、
    營業虧損 21 億（季減少 3.48 億）→ 年化 232 億／-84 億；
    CCG 只取得「營業利益年增 2.9 億」。**
    ⚠⚠⚠ **而 Foundry 那一半嚴格遵守建檔時寫死的禁用**：
    **「那 58 億裡只有 2.93 億是外部的，拿它去乘代工同業的 EV/Sales 會把
    Intel 自己賣給自己的晶圓算成市場營收」—— 因此一律用市值／PPE，不用營收倍數。**
    ⚠ **但要分清兩件事：比「倍數」不行，比「絕對金額」可以 ——
    「現價隱含的 Foundry 價值是聯電整個市值的 4.2 倍」是後者，不違反禁用。**
    ｜⚠⚠⚠ **本次犯了一個規則層的錯並在自行驗證時抓到，而它比本檔的估值更重要。**
    **我先依 6805 那一檔寫下的通則「清單內的標的不作為估值錨」把 TSM 自 primary 與 secondary
    移除，然後在逐行檢查殘留時發現：3583 在同一天（2026-09-10）已經建立了一條更精確的規則 ——
    清單內標的的「市場觀測倍數」可用於序位對照（須明寫日期與「不得因我的判斷而調整」），
    其目標價、應有倍數、情境倍數不可用。而本檔建檔時引用的正是 3583 那條。**
    ⚠⚠⚠ **亦即 6805 的通則是一條較粗的規則，它覆蓋了 3583 較精確的那一條，
    而我當時沒有注意到它覆蓋了什麼。6805 那一檔的實際處置仍然正確
    （3324／3017 是直接同業，而我對它們有完整的判斷值），但它被寫成了通則，而那個通則太寬。**
    **→ 撤回移除。TSM 的市值／PPE 是觀測值，可用，並仍留在 gaps 裡。**
    ⚠ **雙向性檢查的結果**：**state/TSM.yaml 列 Intel Foundry 為同業但「倍數未取得」——
    目前沒有實際的循環引用，只有風險。單向使用可以。**
    ⚠⚠ **連帶動作**：**AAOI 那一輪（本日較早）依同一條過寬的通則移除了 LITE 與 COHR，
    應於 /revalue AAOI 時依三層規則重新檢查**（判斷值禁用／觀測倍數可用／須檢查雙向性 ——
    而 LITE↔COHR 之間確有已記錄的實際循環引用，AAOI 對它們則需個別查雙向性）。
    ⚠ **應回填 references 的三層規則**：
    **(1) 判斷值（目標價、應有倍數、情境倍數）一律禁用 —— 它們是我的判斷，會形成閉環；
    (2) 市場觀測倍數可用，須明寫觀測日期；
    (3) 須檢查雙向性 —— 若 A 用 B 的觀測倍數而 B 也用 A 的，仍構成循環（LITE↔COHR 的實例），
    單向可用；
    (4) 零和配對有額外限制：解讀時須明寫方向，且不可預設訂單是「轉移」還是「新增」。**
    ｜**三情境（SOTP，基準年 FY2027；exit_multiple 記的是 Foundry 的市值／PPE）**：
    **bear 0.25：DCAI 1,600 億（20×）＋ CCG 560 億 ＋ Foundry 450 億（市值／PPE 0.5×）
    → 43（-57.1%）。**
    **base 0.50：DCAI 2,400 億（30×）＋ CCG 700 億 ＋ Foundry 1,080 億（1.2×）→ 73（-27.2%）。**
    ⚠⚠⚠ **base 的寫法刻意特別乾淨：DCAI 與 CCG 用的正是推導現價隱含值時的同一組數字，
    因此 base 與現價的全部差距都落在 Foundry 這一格（現價隱含 2.64 倍，base 取 1.2 倍，
    下調 55%）—— 這使爭點單一而可被反駁。**
    **bull 0.25：DCAI 3,640 億（＝AMD 的 forward 本益比 45.51）＋ CCG 840 億
    ＋ Foundry 1,980 億（2.2×）→ 116（+15.6%）。
    ⚠ 分析師目標價均值 115.78（48 位，Hold）—— 我的 bull 只高 0.2%，
    亦即最樂觀情境幾乎正好等於市場的中性預期。**
    **加權 ＝ 10.75 ＋ 36.5 ＋ 29.0 ＝ 76.25（-24.0%）。機械加權，無人工調整。**
    ⚠⚠ **非控制權益採「扣一次 156.0 億」；不扣的話是 46／76／119、加權 79.25（-21.0%）——
    差 3.0 美元，改變的是幅度不是方向。**
    ｜⚠⚠ **一個必須講清楚的落差**：**營業利益 +44.6 億（營業利益率 7.82%）
    而淨利 -112.9 億，相差 157.5 億美元。本業已經在賺錢，虧損來自營業利益以下。**
    **它直接說明 trailing 本益比對本檔無意義，也驗證了建檔時判 Q3 而非 Q1 是對的。
    那 157.5 億的組成未取得，列 gaps。**
    ｜✓✓ **技術面首次可判定，但失效價位仍留空**：
    **50 日均線 98.83（下方 1.49%，比值 0.41 倍 —— 太近）／
    200 日均線 75.20（下方 25.04% —— 超過 ±20% 上界）。兩條都不合格。**
    ⚠⚠⚠ **本檔是本輪第一檔「兩條均線分別踩到雙邊規則的兩端」的標的 ——
    6805 兩端都太遠、3211 邊緣未達門檻、AAOI 太近到極端，
    而本檔同時有太近的與太遠的。這是那條雙邊規則的第四種形態。**
    **位階自「無法判定」改為「多方，但無可用失效價位」。**
    ⚠ **除權息前置檢查無命中（Intel 已於 2024 年暫停股利）**，
    ⚠⚠ **但有一個功能相近且已量化的東西：52 週股價報酬 +310.48% 對市值變動 +392.0%，
    差額約 20% 即為期間的稀釋幅度（美國政府 4.33 億股、SoftBank 8,696 萬股、
    2026 年 8 月約 150 億美元發行）。這是本輪「每股口徑斷點」的第四種來源，
    而本檔的量化方法最乾淨，應回填 references。**
    ｜**新增第五條 falsifier（2027 年底前 DCAI 單季營業利益率跌破 30%）**——
    ⚠⚠ **它測的是我自己估值裡權重最大的那個假設：DCAI 一格佔 base 企業價值的 57%，
    而「40% 營業利益率可以持續」是我唯一沒有質疑過的數字。**
    ⚠ **並複查既有四條**：**第二條（Foundry 單季外部營收未達 5 億）確認為 bear 的直接觸發條件
    （現值 2.93 億）；第三條（Foundry 營業利益率劣於 -36.2%）本次取得現值，
    而門檻正好等於現值 —— 亦即那一條測的是「不再改善」而不是「變差」。**
    ｜**評級維持中性／信心低，而「為什麼不是偏空」本身是本次的一個方法論結論**：
    **SOTP 三格裡有兩格沒有硬錨（CCG 的營業利益未取得、Foundry 的市值／PPE 沒有同業值），
    而 Foundry 那一格承載了與現價的全部差距；且 48 位分析師共識 Hold／+15.4%，
    我的 bull 只比它高 0.2%。**
    ⚠⚠ **對照本輪三檔數字接近而處置不同的標的：3081 的 -21.6% 對所有假設都穩健 → 偏空；
    AXTI 的 -24.3% 取決於一個未確認的口徑 → 中性；本檔的 -24.0% 取決於兩個沒有硬錨的
    分部倍數 → 中性。判準是「負的來源是判斷還是缺口」—— 應回填 references。**
    ｜⚠ **本次未做到**：**GFS 與 UMC 的 PPE（最高優先）**；**CCG 的分部營收與營業利益**；
    Foundry 佔 PPE 的比例（本次取 85% 是我的假設）；非控制權益的口徑（第二次未關閉）；
    營業利益與淨利之間那 157.5 億的組成；六條均線中的四條；20 日平均振幅。
    報告：reports/2026/09/2026-09-11-INTC-revaluation.md
- date: 2026-09-11
  level: L1
  summary: CTA 評估（規則修正）— 六條均線無一合格，失效價位維持留空
  delta: >
    全清單十九檔 CTA 評估的一部分，觸發者為**規則變更**而非新聞：
    **那條失效價位規則是在 2026-09-10 建檔過程中逐步推導出來的，
    而它本身帶著兩個錯 —— 只取一條均線（季線）、用單日振幅當比值分母。**
    ⚠ **修正後六條均線全算，十九檔中十一檔由「留空」變為可填**；
    並撤回兩檔不合格的既有填值（3661、AAOI）——
    兩檔都是在規則成形之前建的。
    ⚠ 本檔的逐條均線與判定見上方 cta 區塊的註解。
    **三情境仍未建立，本次不動估值面。**
    報告：reports/2026/09/2026-09-11-coverage-cta-ma-rule.md
- date: 2026-09-11
  level: L2
  summary: 新增追蹤標的 —— ⚠⚠⚠ 連續十三檔之後層級軸第一次跨過；非控制權益占權益 15.1%；擴建型 Q3 第四例
  delta: >
    建檔。判 **Q3（資產與循環）**，本輪二十一檔中第五檔落在 Q3，
    **而它是「擴建型」的第四例，也是最極端的一例 —— 它擴的不是產能，
    是一整個還沒有客戶的事業。**
    ⚠⚠⚠ **Y 軸判高且是本清單最明確的一次**：**2026 資本支出指引自 $17B
    上調至超過 $20B，對 TTM 營收 $57.03B ＝ **35.1%**（超過 15% 門檻 2.3 倍），
    而公司明言 2027 將顯著更高；**
    **不動產廠房設備 **$105.74B** 對 TTM 營收 ＝ 1.85 倍，
    且幾乎等於全部股東權益（$103.14B）。**
    ⚠⚠⚠ **X 軸極低，而原因是部門互相抵銷不只是循環位置**：
    **Foundry 單季虧 $2.1B（營業利益率 -36.2%），而全公司單季淨利只有約 $2.2B ——
    產品端賺的約 $4.3B 被吃掉一半。**
    **trailing PE 為 **n/a**（TTM EPS -$2.30）、forward PE **60.13**、
    EV/Sales **9.88 倍**、市值／PPE **4.99 倍**。**
    ｜⚠⚠⚠ **本檔最重要的一件事是層級軸在連續十三檔之後第一次真的被跨過，
    而原因不是本檔特別，是我這次去查了合併資產負債表。**
    **前十三檔的缺口全部是同一個動作沒做。**
    **而一查就發現它是最關鍵的數字：非控制權益 **$15,601M**，
    占股東權益 $103,143M 的 **15.1%**，且公司指引 2027 與 2028 各約 $1.1B／年 ——
    亦即 forward PE 60.13 的分母每年要先扣掉約 $1.1B。**
    ⚠ **對照 2317 鴻海：我在那一檔把非控制權益列為「那 19 個百分點」的候選解釋之一
    卻沒拿到數字；本檔拿到了。**
    **四軸全跨（分母／參照／時間／層級）是本輪二十一檔中的第一次。**
    ｜⚠⚠⚠ **本檔揭露了「中週期正常化 EPS」的第三種失效方式，而它是新的**：
    **不是沒有中週期（3363 那種），是那個中週期屬於一家已經不存在的公司。**
    **Intel 有三十年豐富的循環歷史，但那段歷史描述的是「壟斷 x86 的 IDM」，
    而現在的 Intel 是「要變成代工廠的公司」——
    正常化會產出一個看起來很有根據卻指向錯誤公司的數字，那比沒有歷史更危險。**
    **應與「Q3 拆成循環型／擴建型」一起寫進 references：
    擴建型的處方必須明寫「不要對轉型前的歷史做正常化」。**
    ｜⚠⚠⚠ **本檔與 TSM 是本清單第二組「循環引用 ＋ 零和競爭」同時發生的配對**
    （第一組 3363／3008）。**`foundry` 因子自 1 檔變 2 檔。**
    ⚠⚠ **但本組多一個必須保留的可能性：代工訂單可能是新增的而非轉移的 ——
    若是新增兩檔同向，若是轉移兩檔零和。**
    **FAU 那一組的市場規模相對固定，先進製程不是。**
    **這是「零和」這個標記第一次需要附帶條件。**
    ｜⚠⚠⚠ **本檔在 driver 層同時在三個位子上，而方向不同**：
    **賣 CPU 給 CSP（同向）／賣代工產能給 AI 晶片設計商（TSM 的位子）／
    是 NVDA 在資料中心運算上的競爭者。**
    **而後兩者在**同一檔內部**方向相反：需求走 GPU 則排擠它的 DCAI，
    走自研 ASIC 則利多它的代工。**
    **AVGO 那次是「兩檔之間方向相反」；本檔是「同一檔內部方向相反」—— 新的，而且更難處理。**
    ｜**主錨為 SOTP（產品端盈餘倍數 ＋ Foundry 用重置成本／產能）。**
    ⚠⚠ **Foundry 那一半刻意不用 EV/Sales：那 $5.8B 裡只有 $293M 是外部的，
    其餘是內部轉撥 —— 乘同業 EV/Sales 會把 Intel 自己賣給自己的晶圓算成市場營收。**
    ｜三情境**刻意不建立**：SOTP 兩半都缺輸入（產品端只有成長率、
    Foundry 缺 TSM／GFS／UMC 的市值／PPE 對照）；四家清單外同業倍數全缺；
    PB 有三個讀法差 18%（口徑未查證）；均線完全未取得。
    ｜評級**中性／信心低**。**技術面完全無法判定 —— 50 日與 200 日均線未取得，
    invalidation 與 confirm_trigger 都留空。**
    ⚠⚠ **但本檔揭露了比值規則的第二個問題：日振幅僅 3.66% 而 Beta 2.23（本輪最高），
    小區間是跳空造成的（當日最高 $103.23 低於昨收 $106.24）——
    用單日振幅當分母會低估真實雜訊，應改用 20 日 ATR。**
    **這是 2317 那條「絕對下界」之後第二個需要修的地方：分母的穩健性。**
    ⚠ **52 週全距 492%（$24.05 → $142.35）與 Beta 2.23 都是本輪最大。**
    ｜四條 falsifier，⚠⚠ **其中兩條與 AI 需求完全無關**
    （Foundry 部門營業利益率、14A 時程）——
    **與 2317 一樣有兩條，而 3665 那一檔一條都沒有。**
    ⚠ **第一條的檢驗日期是確定的：下次財報 2026-10-22。**
    ⚠ **第四條錨在公司重申的 14A 2028 時程上，本輪連續第七檔如此。**
    ｜⚠ **代號風險已寫在檔案最上方**：**INTC 是 Intel，INTU 是 Intuit，
    而 INTU 已在覆蓋清單內（ai_application ＋ saas，與本檔毫無關係）。**
    **本倉庫第四次遇到代號近似的風險，而四次中有三次在同一週 ——
    建檔前對一次「代號與公司名是否真的對得上」應該是固定步驟。**

