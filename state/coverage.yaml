      ｜⚠ **一個已寫定的檢驗點**：2345 的月營收每月 10 日前公告，
      **而光通訊那五檔（COHR／LITE／AAOI 為美股，6442／3008 為台股）中只有兩檔有同樣頻率。**
      **2345 的月營收年增率因此可以當成整條光互連鏈的高頻代理變數 ——
      近六個月為 +44.43 → +53.87 → +56.58 → +61.16 → +71.69 → +59.42%。**
      **若它明顯減速而收發器族群的季報仍強，那是庫存在某一層堆積的第一個訊號。**
  - pair: "⚠⚠ 3533 / 其餘 22 檔 — 預期為本清單**相關性最低**的一組，且這是它被納入的理由"
