  test_equipment: {count: 1, pct: 5.3,  note: "3030 — 2026-09-08 新增。檢測與量測設備，是清單中**第一檔賣設備給供應鏈、而非身在供應鏈裡**的標的。⚠ 由此導出一個與其餘十檔不同的傳導：它受惠的是**客戶的資本支出決策**，而非客戶的出貨量 —— 客戶擴產時它先受惠，客戶滿載但不擴產時它不受惠。**這使它在同一條 AI 需求鏈上的時序與其餘標的錯開。** ⚠ 同業致茂 2360 的 PE 為 57.02，而本檔為 21.36（折價 62.5%）—— 折價的具名成分為規模差 14.2 倍、營收成長 +28.2% 對 +61.6%、且**本檔無分析師覆蓋**"}
  osat:           {count: 1, pct: 5.3,  note: "6239 — 2026-09-01 新增。專業封測（OSAT）與 TSM 的晶圓級先進封裝是**不同層級**，不直接競爭 —— TSM 做 CoWoS，6239 做面板級與記憶體封裝。⚠ 本因子真正的價值在於：它是清單中**唯一受惠於量而非價**的 AI 供應鏈曝險，也是唯一在納入當下估值未處於延伸狀態的台股（PB 3.58x 位於三年區間 1.43–4.80 的 64% 處）"}
  fabless:        {count: 1, pct: 5.3,  note: "AVGO — 2026-09-08 新增。⚠ **本標籤存在的理由是防一個具體的誤判**：AVGO 的 D&A／營收為 9.8%，看起來像資本密集，**但那幾乎全是 VMware 併購的無形資產攤銷，不是實體資產折舊**。實際 **capex／營收 TTM 僅 1.40%**（Q3 單季 1.80%）。⚠ 同族群對照：NVDA 2.4%、MRVL 5.0% —— **三家都是無廠，Y 軸在本族群不具區辨力**"}
  infra_software: {count: 1, pct: 5.3,  note: "AVGO — 基礎設施軟體（VMware 為主體），FY2026 Q3 營收 8,752M、占總營收 30%、年增 29%。⚠ **清單中第一個「同一檔內部有兩種完全不同成長性質」的業務組合**：半導體分部年增 127%（其中 AI +221%），軟體分部年增 29%。**它使 AVGO 成為清單第一檔選擇權拆分真的做得出來的標的** —— 年化後 AI 66.8B／非 AI 半導體 16.6B／軟體 35.0B。⚠ **但只完成一半：分部別營益率未取得，還不能給各部分不同倍數**"}
  ai_power:       {count: 1, pct: 5.3,  note: "CEG — 2026-09-08 新增。⚠ **本清單第一檔「賣電給 AI，而不是賣硬體給 AI」的標的，而它帶進來的最重要的東西不是新產業，是新的傳導性質：存量 vs 流量。** 其餘 16 檔中有 15 檔曝險於「AI 資料中心**資本支出**」——那是流量；**本檔曝險的是資料中心的用電量，那是資本支出落成之後的存量。一座已建成的資料中心即使 capex 歸零仍然耗電。** ⚠ **它不免疫** —— 新的 PPA 仍要等新的資料中心蓋起來；**但既有合約的現金流不隨 capex 減速而消失，這是清單上其餘十五檔都沒有的性質。** ⚠⚠ **2026-09-08 補正：建檔當日這句話只說了一半。** CEG 在**需求軸**上確實是分散，**但它在折現率軸上帶進一個清單其餘十六檔都沒有的集中曝險** —— 公用事業是市場公認的「債券替代品」，2026 年 8 月 XLU **-4.78%** 而 S&P500 **+2.62%**（差 **7.40pp**），**公用事業為今年以來 S&P500 唯一下跌的族群**。⚠ **更值得記的是這兩件事同源**：推升殖利率的原因之一正是「**AI 相關企業債券大量發行與公債競爭資金**」（二手轉述，見 notes/2026-09.md）。**同一筆 AI 資本支出，對 CEG 既是需求順風（PPA），又是估值逆風（折現率）—— 這是覆蓋清單第一檔兩個方向同時發生在一檔身上的標的。** 前者是它被納入的理由，後者是它 52 週報酬 -3.09%、距高點 -27.6% 的可能解釋之一。**分散與集中同時上升，這在本清單是第二次**（第一次是 COHR 使 cpo 因子的集中度與可檢驗性同時上升）。 ⚠ **也因此它沒有 driver_refs**：現有三個 driver 記的是資本支出承諾／加速器出貨／平台時程，**沒有一個記的是用電量**。正確做法是新增 `datacenter-power-demand` driver，而非硬掛既有的三個"}
