signal:
  rating: 中性
  conviction: 低
  basis: >
    ⚠ **2026-09-07 全量重估（新方法論適用）：信心自「中」降為「低」，
    而降級的理由是新規則，不是基本面轉壞。**
    加權目標價 434 維持，相對現價 **428.91**（2026-09-04 收盤，前值 417.52）為 **+1.2%**（前 +3.9%）。
    ⚠ **降信心的理由：base 的錨通不過五欄檢查。**
    「10 年 trailing 中位 20.37x、5 年平均 23.6x」——值、口徑、層級都有，
    **但來源與 as-of 都沒有**。依 2026-09-01 新訂的規則，**五欄缺一即不得作為 load-bearing**，
    而它是 base 的唯一錨。本輪嘗試補（macrotrends 回 403）未成功。
    ⚠ **這是新規則第一次真正咬到自己，所以更要照做。** 我在同一份方法論裡寫過
    「條件一旦滿足即執行，不論結果對現有論點有利或不利；若不執行，該理由本身
    將被記為一次校準偏差」。**現在不執行的話，那條規則就只是裝飾。**
    ⚠ **循環性檢查觸發**（base -2.5%、加權 +1.2%）。依新流程：
    ① **基準年位移測試做不到** —— 2028 共識未取得。殘餘度 **1.00**（2027 尚未開始）
       故不觸發降權，但無法排除基準年假象。
    ② 輸入獨立性辯護 —— **其基礎已隨錨的失格而失效**。原辯護是「錨是 16.3x 加上一個
       具名的溢價理由，不是現價」，但 16.3x 由那組不合格的歷史數字換算而來。
       **這正是缺陷 3 所定義的「辯護鏈懸空」，而 TSM 是它的第一個實例。**
    ⚠ **2027 EPS 有兩個值，依規則兩個都記不得擇一**：
    state 採用 **22.00**；法人共識為 **NT$135.48／股**，換算 ADR（×5÷匯率）——
    @32.3 為 **$20.97**、@31.5 為 21.50、@30.5 為 22.21。
    **落差 -4.9%（以 state 匯率 32.3 計），而它完全由匯率假設驅動。**
    對應 base 為 398–422，**本結論對匯率高度敏感**。
    ⚠ **錨寬度算不出來**（未取得 2027 共識高低分布），依新規則信心不得因缺口減少而升等。
    ⚠ **公司行動掃描（新步驟）抓到三件**：(1) 2026 capex guidance 上修至 600–640 億美元
    （state 記的 52–56 **已過期兩代**）；(2) **2,690 億美元擴產計畫**；
    (3) 2026 全年美元營收年增率指引自「超過 30%」上修至「**略高於 40%**」。
    ⚠ 技術面前置檢查：本檔於 **2026-06-11 除息**（在上次重估之前，故不污染當前量價），
    但依缺陷 4，每股指標須註明除權息前後口徑 —— **state 目前未註明，已列 gaps。**
    ｜以下為前次記錄：基本面幾乎無可爭論（Q3 指引 YoY +37%、7 月營收 +44.7% 連 3 月創高、capex 上修至區間高端、N2 與 CoWoS 擴產路徑明確），技術面也是清單中最健康的。不給偏多的理由是估值不是基本面 — 加權目標價 434 相對盤後 424.90 僅 +2.1%，base 情境幾乎等於現價；且收盤仍在 50DMA 之下、52 週已漲 77.3%、距 52 週高 11.3% 未突破。信心中（高於 3324／6442 的低）因資料完整度佳：均線與 52 週區間齊全、當年與次年共識皆有、基準年可用算術驗證
  changes_if: ⚠ 2026-09-07 依新語法補列最優先一條 —— `自身歷史 forward PE 分位（含來源與 as-of）| 有無 | 取得即執行 | 資料商列表算數，但須註明期別 | macrotrends／財報狗／Bloomberg` → **取得後信心才可能回到「中」**；次要 `2028 共識 EPS | 有無 | 取得即執行 | 賣方預估算數 | FactSet` → 位移測試才做得到。｜收盤站穩 50DMA 之上並放量突破 479.00 → 偏多；週收盤跌破 368.22 → 下修；季度毛利率跌破 60% 且管理層歸因於價格而非匯率 → 偏空；2027 capex guidance 出爐（約 2027-01）且維持成長 → 信心升至高
