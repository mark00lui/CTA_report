thesis: "爭點是 1.6T 與 OCS 世代切換能否把 19.7% 的毛利率結構往上推，而非出貨量夠不夠"
thesis_since: 2026-09-10
# ⚠ 只留爭點，前提移入 key_variables 與 notes（LITE 那輪的教訓，AXTI 起沿用）。
#   前提（已確立、不是爭點）：**量是真的** —— FY2025 營收 +125%、2026 前 8 月 +61.86%、
#   近六個月單月年增率介於 +44.43% 到 +71.69% 之間，沒有一個月低於 +44%。
#   ⚠ **為什麼爭點是率不是量**：本檔是 ODM，**毛利率 19.7% 意味著營收每多一塊錢，
#     只有兩毛留在公司**。**量的成長已經被證明，而它能不能轉化成結構性的獲利能力，
#     取決於 1.6T／OCS 是不是比 800G 更值錢的生意 —— 那是還沒被證明的部分。**

