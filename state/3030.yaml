  rank_metrics:      # ⚠ 建檔時事先寫定，供日後 /revalue 定序位用
  - 營收成長率（本檔 TTM +28.2%；致茂 +61.6% —— **本檔明顯落後**）
  - 先進封裝／半導體檢測的營收占比（⚠ 本檔此值未揭露，列 gaps）
