thesis: "爭點是 Q2 的 35.6% 淨利率是專案組合的高點還是新水準"
thesis_since: 2026-09-10
# ⚠ 只留爭點，前提移入 key_variables 與 notes（LITE 那輪的教訓，AXTI 起沿用）。
#   前提（已確立、不是爭點）：**量是真的，而且能見度是公司給的** ——
#   2026 前 8 月累計營收 59.29 億元（年增 51.11%）、環比連續八個月為正、
#   月營收年增率自 6.18% 加速到 103.06%、H1 EPS 11.9 元（年增 53.7%）、
#   管理層明言訂單能見度直達 2027 年 Q2 且產能利用率高。
#   ⚠ **為什麼爭點是率不是量**：**Q2 的營收季增 66.7%，而淨利率同時升了 12.2 個百分點 ——
#   兩者一起發生時，EPS 的季增 153% 有多少來自量、多少來自率，分不出來。**
#   ⚠⚠ **而管理層自己先講了：毛利率受產品組合與個別專案影響，各期間可能波動。**
#   **公司說它會波動，那 35.6% 就不能當成新水準，除非有第二個季度證實。**

