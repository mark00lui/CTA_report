# 這個 driver 的主要價值不是絕對金額，而是與 hyperscaler-capex 的交叉驗證
cross_check:
  against: hyperscaler-capex
  logic: >
    capex guidance（承諾）持續上修、但加速器營收與 guidance 停滯 → 錢沒有流向加速器，
    可能流向土地廠房電力，硬體鏈的受惠程度低於 capex 金額所暗示的。
    反之加速器營收超前而 capex guidance 未動 → 平台端的 capex 可能即將上修。
  action: 兩者連兩季背離 → 硬體端 L2，並在報告中明寫是哪一邊先動
  status: 未背離
  as_of: 2026-08-27
  finding: >
    方向一致，兩邊都在加速，本季無背離訊號。但成長「速率」不同：
    加速器合計 +116% YoY，四大 CSP capex +77% YoY。若口徑可比，這意味 capex 中
    流向運算的比重正在上升 —— 對硬體端而言是「每一元 capex 的含金量提高」，屬正面。
  caveats: >
    ⚠ 2026-09-01 補：第 (1) 條的 caveat 首次拿到**具體實例** —— 沙烏地 HUMAIN（PIF 旗下）的
    AMD MI355X 算力已投產，2027 年起擴至最多 250 MW、2030 年目標最多 1 GW。它既不在四大 CSP
    capex 的分母裡，也不在 NVDA 的營收裡（用的是 AMD）。此前這條 caveat 只有 NVDA 的 ACIE
    分部總數（40.3、+138%），沒有可指認的個案。
    ⚠ 兩個延伸觀察：
    (a) 主權 AI 的資金來源是主權基金而非企業現金流，因此它對 hyperscaler-capex 的 falsifier
        （任兩家 CSP 同季下修 capex）**免疫** —— 共同前提失效時這一塊不會同步縮手。
        這是覆蓋清單 common_premise 之外的一條需求，也是目前唯一被記錄到的一條。
    (b) ⚠ 在供給受限的環境下（NVDA 已明言 FY2028 +70% 為供給上限），新增的主權買家是與平台端
        **競爭同一批產能** —— 對 MSFT／GOOG／META 是邊際負面。但無法量化，僅記錄。
    ⚠ 另記一個計量方式的轉變：本案的規模以 **MW** 表述（250 MW／1 GW），不是 GPU 顆數也不是
    金額。對照同期的 NVIDIA Rubin Ultra（600kW／櫃、800 VDC），**MW 正在成為 AI 算力的共同
    計量單位**。這對 accelerator-roadmap 的 power_architecture 與 coverage.yaml 記錄的
    「電力鏈零曝險」缺口是同一條線索。
    上述比較有兩個口徑問題，未解決前不得當成結論，只能列為觀察：
    (1) 分子涵蓋範圍大於分母。NVDA 的客戶不限於四大 CSP —— 其 AI Clouds／
        Industrial & Enterprise 營收 +138% YoY 至 40.3（含主權、AI-native、企業），
        這些需求不在四大 capex 的分母裡。
    (2) 期間不對齊。capex 是曆年 2026 全年 guidance，加速器是單季；把高速成長中的
        單季年化會低估全年。
    (3) 分母本身已知有誤：hyperscaler-capex 的 Microsoft 成分仍為 190，
        公司 2026-07-29 已揭露曆年 2026 約 175（會計年限口徑，非需求下修），
        合計 725 連帶高估。修正後比值會更偏向加速器。

transmission:
  - ticker: 'AVGO'
    direction: '+'
    path: >
      ⚠⚠ **建立這一條的同時暴露了本 driver 的一個實質口徑缺口，必須在這裡記下。**
      本 driver 的 `current` 明寫口徑為
      「單季資料中心營收合計；NVDA + AMD，**不含**自研 ASIC」。
      **而 AVGO 的 AI 半導體營收正是被排除的那一塊** ——
      **FY2026 Q3 已達 16.7B、Q4 指引 21.7B、年增 221%（AVGO 8-K，2026-09-02）。**
      → **本 driver 的現值因此系統性低估加速器總需求，
      且低估的幅度正在以三位數年增率擴大。**
      ⚠ **這不是 AVGO 的問題，是本 driver 的口徑問題。**
      **應走 `/driver` 檢討是否併入自研 ASIC —— 但併入會改變本檔全部 transmission 的解讀，
      故不在扇出時順手改，須單獨處理。** 已列入 AVGO 的 gaps。
      ⚠ **成分上 AVGO 與 NVDA 在「自研 ASIC 對商用 GPU」這一題上是替代關係**，
      方向雖同為 `+`，但兩者可能此消彼長。見 hyperscaler-capex 的對應條目。
    lag: 領先 1–2 季（AVGO 的認列與 NVDA／AMD 的認列大致同步，略早於整機出貨）
    sensitivity: 高（AI 已占 AVGO 總營收 56.4%）
    affects: ['AI半導體營收與占比']
  - ticker: '6239'
    direction: '+'
    path: >
      加速器出貨 → HBM 與伺服器 DRAM 需求 → 記憶體封測量能。
      ⚠ **傳導性質與 MU／SNDK 完全不同**：MU／SNDK 賺的是記憶體**價格**，
      本檔賺的是封測**服務費、按顆計價** —— 漲價本身進不了本檔的損益，本檔受惠的是**量**。
      故該 driver 上修時，MU／SNDK 先反映在合約價與毛利率，本檔先反映在產能利用率與月營收。
      ⚠ 方向可能相反：若記憶體漲價的機制是**減產挺價**而非需求成長，
      對 MU／SNDK 是利多、對本檔是**利空**（量減）。扇出時必須分開判，不可套用同一結論。
    lag: 領先 2–3 季
    sensitivity: 中（受惠於量，且量的傳導慢於價）
    affects: ['月營收', '毛利率']
  - ticker: '8046'
    direction: '+'
    path: >
      加速器出貨 → 載板投片。⚠ 已認列的加速器營收對本檔是同步偏落後指標（載板要先做出來），
      真正領先的是下一季 guidance 與長約 —— 與 TSM、3037 的註記同構。
    lag: 領先 2–3 季
    sensitivity: 高
    affects: ['IC載板營收占比', '月營收']
  # ⚠ MU 與 SNDK 於 2026-08-31 補入。此前兩檔在覆蓋清單內卻不在任何 driver 的 transmission，
  # 是一個結構缺口 —— 而 NVIDIA 於 2026-08-26 揭露採購承諾自 119 增至 279 bn、
  # 明言 primarily related to the procurement of memory，等於用一手證據證明了這條路徑存在。
  # 在此之前它只是「看起來應該相關」，沒有可引用的傳導證據，所以沒建。
  - ticker: MU
    direction: '+'
    path: >
      加速器出貨與供應商採購承諾 → HBM 與伺服器 DRAM 需求 → 合約價與毛利率。
      ⚠ 與其他硬體端的傳導性質不同：3324／6442／COHR 是「加速器賣得多，我的零件就賣得多」，
      本檔是「加速器廠為了鎖料，願意用更高的價格簽更長的約」—— 傳導的是**價格**不是數量。
      因此該 driver 上修時，本檔的反應應先出現在合約價與毛利率，而非出貨量。
      ⚠ 反向註記：同一筆記憶體成本對 NVDA 是毛利率壓縮（Q4 觸底 71–72%），對本檔是漲價。
      **方向相反，不可套用同一結論。**
    lag: 領先 1–2 季（合約價先於出貨認列）
    sensitivity: 高（HBM 是本檔 thesis 的核心變數）
    affects: ['HBM進度', '毛利率', '單季營收']
  - ticker: SNDK
    direction: '+'
    path: >
      加速器出貨 → 資料中心儲存需求 → NAND 合約價。
      ⚠ 強度低於 MU：NVIDIA 的 279 bn 採購承諾主要指向 HBM／DRAM，NAND 是間接受惠
      （資料中心建置的儲存層），不在加速器 BOM 的關鍵路徑上。
