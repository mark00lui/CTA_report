    **依缺陷 3，兩個都記，不挑一個。**
    GAAP 序列：**5.01(FY23)／11.89(FY24)／7.40(FY25)／10.33(TTM 26Q2)** —— **高低差 2.37 倍**。
    ⚠ **而 FY2023 與 FY2024 的營運現金流是負的（-5,301／-2,464 百萬美元）**，
    FY2025 才轉正為 +4,237 —— **現金流的波動比盈餘還大**，這在公用事業類股是不尋常的。
    合理的解讀是**避險部位的保證金與 mark-to-market 流動**，
    ⚠ **但這個解讀未經證實 —— 損益表的業外／MTM 科目本輪未拆解**，列 gaps。
