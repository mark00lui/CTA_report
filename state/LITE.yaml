    200 日距離超過 ±20% 上界；50 日的比值只算得出一個上界 2.22 倍
    （以當日漲跌幅 5.39% 當振幅的下界），卡在門檻 2 上 → 失效價位維持留空。**
    ⚠ **與 AXTI（上界 2.33）完全相同的形態，本輪第二次，兩檔都因同一個資料源
    不提供日內高低價。而兩次的上界都卡在門檻上不是巧合 ——
    ±20% 與 2 倍在「距離 12–15%、日變動 5–6%」這個常見組合下必然落在邊緣。**
    ✓ **但狀態已改變：建檔時是「均線未取得，無法設定」，現在是
    「均線取得了，但兩條都不合格」—— 那是一個更有資訊量的狀態。**
    ⚠⚠⚠ **技術面前置檢查正式執行，而本檔命中庫藏股 —— 本輪第一次。**
    **本檔不配息（無除權息污染），但 FY2026 庫藏股買回 2.81 億美元
    → 量能訊號標註「受污染」。**
    ⚠⚠ **而它與除權息的差別要記下來：除權息有明確日期與可算的機械偏誤，因此污染均線；
    庫藏股是連續的、買回時點通常不逐日揭露，因此污染量能但不污染均線。**
    ｜**新增第四條 falsifier（capex／營收 超過 15%）**——
    **錨點 FY2026 為 14.97%，距門檻 0.03 個百分點，本輪「最貼著門檻」的一檔。**
    **跨過去象限自 Q4 遷入 Q2，而 Q2 的處方明文警告「純 PE 會系統性高估」，
    而本次的三情境正是用本益比做的 —— 亦即這一條觸發，整套方法就要換，三情境作廢。**
    ⚠ **並複查既有三條**：**第二條（非 GAAP 毛利率連兩季低於 45%）——
    GAAP 的 44.24% 已經低於門檻，驗收時誤用 GAAP 會立刻誤判觸發，口徑必須寫死；
    第三條（FY2028 EPS 共識低於 30 美元）狀態自「未觸發」改為「無法驗證」——
    FY2028 共識根本還沒公布，而在沒有錨點時宣稱「未觸發」是假裝我知道一件我不知道的事
    （本輪第四次做這個處理）。**
    ｜**評級維持中性／信心低。** ⚠ **不是偏空的四個理由**：
    **幅度比本輪其他幾檔小（3081 -21.6%、AXTI -24.3%、INTC -24.0%、3363 -23.9%）；
    26 位分析師共識 Buy、均值 +22.7% 且區間下緣 820 僅低 12.4%；
    穩健性顯示結論不穩；營業利益 +5.362 億與自由現金流 +3.001 億都是正的。**
    ⚠ **不是偏多**：加權低於現價，且建檔時寫的「取得均線之前不得升為偏多」——
    **均線取得了但兩條都不合格，那個限制實質上仍然成立。**
    ⚠ **錨寬度 70.7%（本清單最寬）複查後四個數字皆未變動，信心上限維持。**
    ｜⚠ **本次未做到**：**終端市場拆分（第二次未關閉，而我還差點錯誤地關閉它）**；
    **CPO 的進度與時程（第二次未關閉，而它是 bull 倍數溢價的唯一依據）**；
    **FY2028 的一致預估（基準年，使第三條 falsifier 無法驗證）**；
    69.35 億美元債務清償費用的組成與是否涉及股份結算；
    capex／營收 14.97% 未重查（而門檻距它只有 0.03 個百分點）；
    Fabrinet 的 forward EV-Sales；庫藏股買回的時點分布；日內高低價與其餘四條均線；
    20 日平均振幅。
