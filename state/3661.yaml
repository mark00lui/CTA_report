notes: >
  ⚠⚠ **本檔的當期盈餘代表性是本日九檔中最差的，而原因與其他八檔都不同。**
  **AXTI 是分母趨零（trailing PE 1,141x）、AAOI 是分母為負（EPS -0.79）、
  LITE 是一次性費用扭曲、2345 與 3017 與 3081 是成長率遠離穩態 ——
  而本檔是「分母在同一年之內移動了一個數量級」：
  單月營收 2 月 8.27 億元、8 月 87.76 億元，相差 10.6 倍。**
  **而且毛利率同時朝相反方向走（Q1 的 50.16% 是 NRE 高峰，量產放量必然稀釋它）——
  營收與利潤率反向移動，任何 trailing 數字都同時抓錯兩件事。**
  ｜⚠⚠ **因此本檔估值的核心問題不是「幾倍」，是「哪一年」。**
  **wantgoo 所載市營比 12.02 倍，分母約 280 億元；
  而 2026 年 7、8 兩個月就做了 162.09 億元，年化約 972 億元 → 市營比約 3.5 倍。**
  **同一個市值、同一天，倍數差 3.4 倍。**
  **這一條被寫進 excluded：禁用任何以單一年度營收為分母的倍數，除非明寫是哪一年。**
  ｜⚠⚠ **本檔的月營收曲線把一個具名事件的時點標了出來，這在本清單很少見**：
  **北美超大型 CSP 客戶的 3 奈米 AI 加速器「2026 年 5 月底啟動量產、6 月正式出貨」——
  而年增率正好在 6 月由負轉正（+15.39%），7 月 +181.78%、8 月 +273.61%。**
  **一個專案的量產時點直接對應在月營收上，讓本檔的月營收成為
  「量產爬坡到哪了」的高頻代理變數 —— 而那正是主錨選分母所需要的東西。**
  ｜⚠⚠ **本檔對我在 AXTI 那檔提出的規則補上了另一端，這是本日最有方法論價值的一個發現：**
  **AXTI 那次提出「均線距現價超過 ±20% 時不得作為 invalidation」——
  因為太遠的線不是失效價位，是不同的世界。**
  **本檔顯示了相反的失敗：季線距現價僅 0.30%，而本檔當日振幅就有 3.47%、Beta 1.55。**
  **在這個距離上那條線每天都會被雙向穿越，它測的是雜訊不是趨勢。**
  **建議把規則寫成雙邊的：invalidation 需與標的的日波動幅度相稱 ——
  太遠（> ±20%）不是失效價位，太近（< 約一個日均振幅）也不是。**
  **本日九檔的技術面因此出現了第五種狀態：無法判定，但原因是「太近」而不是「太遠」。**
  ｜⚠ **方法論上本檔還有一件事值得記：check（EV／營業利益）是直接沿用
  `state/AVGO.yaml` 已經建立的發現，而不是我在這裡重新想出來的。**
  **該檔記載「EV/Sales 在 AI 加速器族群幾乎沒有鑑別力 —— 三家全距僅 14.3%，
  而營益率差 3.9 倍；換分母後 EV／營業利益立刻爆開（28.0x／40.1x／124.3x）」。**
  **這是本清單第一次把一檔既有標的的方法論發現，直接用在另一檔的建檔上 ——
  而那正是把這些東西寫進 state 而不是寫進報告的目的。**
  ｜⚠ **本檔與 AVGO 在同一批 AI ASIC 專案上是零和競爭關係，故 AVGO 明文禁用作為估值錨。**
  **`state/AVGO.yaml` 的同業是 NVDA 與 MRVL，並未列入本檔，目前沒有循環引用；
  但若本檔以 AVGO 為錨，就會建立一條單向依賴，而兩檔又互為競爭對手 —— 那是最壞的組合。**
  **這是本日第三組「覆蓋清單內互為競爭」的配對（前兩組：3324／3017、散熱鏈上的 2308）。**
  ｜⚠ **刻意不標 `fabless`**（AVGO 有這個標籤）：
  **AVGO 設計並銷售自己的晶片；本檔依客戶規格設計、由客戶擁有產品。**
  **兩者都是「不自己蓋廠」，但商業模式、營收認列與客戶關係完全不同。**
  **標同一格會讓因子分析把兩種生意當成一種 —— 故另立 `design_service`。**

event_log:
- date: 2026-09-12
  level: L2
  summary: 台股基準年修正連續作業第十二檔 — ⚠⚠⚠ 用恆等式「市營比 ＝ 本益比 × 淨利率」驗出 base 交叉檢查的兩個算術錯誤（市值單位、股數高估 39%），修正後結論反向（市營比 4.50 倍比智原高 18.7%，不是落在旁邊）；base／bull 的 EPS 改用共識，加權目標價 4,713 → 5,416（+14.9%）
  delta: >
    ⚠⚠⚠ **本輪在查共識之前先用一個恆等式驗 base 的交叉檢查，它立刻就破了。**
    **base 原寫「base 的 FY2027 150 元對應營收約 1,200 億元（以 15% 淨利率反推），
    市值 4,500 億元 → 市營比 3.75 倍，落在智原 3035 的 3.79 倍旁邊」。**
    **而市營比 ＝ 市值 ÷ 營收 ＝ (本益比 × 淨利) ÷ 營收 ＝ **本益比 × 淨利率**；
    以本欄自己宣稱的兩個輸入代入：30 × 15% ＝ **4.50 倍**，不是 3.75。
    而 3.75 ＝ 30 × 12.5% ＝ 25 × 15% —— 兩個輸入必有一個不是它宣稱的那個。**
    ｜**底層是兩個算術錯誤**：
    **① 市值單位 —— base 目標價 4,500 是元／股，× 實際股數 0.8621 億股 ＝ 3,879 億元（不是 4,500 億）；**
    **② 股數 —— EPS 150 × 0.8621 億股 ＝ 淨利 129.3 億，÷ 15% ＝ 營收 862 億（不是 1,200 億）；
    反過來 1,200 億 × 15% ＝ 淨利 180 億 → EPS ＝ 208.8（不是 150）。
    state 隱含用了約 1.2 億股，高估 39%。**
    ⚠ **而兩個錯誤在市營比上部分互相抵銷（分子與分母同時被高估），
    所以 3.75 看起來合理、沒有露出破綻 —— 恆等式才驗得出來。**
    **→ 結論反向：base 隱含的市營比 4.50 倍比智原的 3.79 倍高 18.7%，不是「落在旁邊」。
    而那個「落在旁邊」正是 base 取 30 倍的全部辯護，所以 30 倍現在沒有錨。已列缺口。**
    ｜⚠⚠ **同一個股數錯誤使 base 與 bull 的 EPS 都比它們自己的營收 × 利潤率低 28.2%**
    （base 150 對 208.8、bull 200 對 278.4 —— 兩格錯同一個比例）。
    **→ 那不是「判斷保守」，是算錯。已改用 FactSet 的 FY2027 共識中位 183.50 與上緣 221.11
    （17 位分析師，遠高於 §9b② 的 5 位門檻）；目標價 4,500 → 5,505、7,600 → 8,402。**
    ✓ **bear 的 90 維持** —— 它有具名機制（N3 放量但 NRE 占比下降使利潤率結構性下移，
    涵蓋營收與利潤率兩段），且沒有可驗算的內部矛盾。
    **⚠ 但它也是三格裡唯一不可驗算的：它沒有給數字。以 1,200 億營收反推，
    90 元對應淨利率 6.5% —— 那個水準應該寫進 key_assumption。已列缺口。**
    **⚠ 它比共識下緣低 40.5%，而即使最悲觀的分析師仍看 FY2027 成長 +9.0%。**
    ｜**遠期共識（FactSet 17 位，2026-08-22）：FY2026 中位 138.85 → FY2027 **183.50**（+32.2%）
    → FY2028 **248.90**（+35.6%）；FY2027 高 221.11／低 151.30；共識目標價 6,000。**
    ⚠ **FY2029 的四個統計量全部是 301.72 —— 單一分析師，依 §3 不可用為共識。**
    **state 的 FY2026E 約 130 對共識中位 138.85 為 -6.4%。**
    ｜⚠⚠ **§9b(b)：declared primary method（年化市營比）的「哪一年」問題，
    以現價 3,650 與實際股數重算後比 state 記的更嚴重**：
