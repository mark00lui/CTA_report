- date: 2026-09-12
  summary: 手動重估 — 官方收盤與自行除權回溯調整，取得本輪第一個通過雙邊規則的失效價位
  delta: >
    **三個目標價（601／1,570／3,786）、加權 1,882、EPS（24.04／39.24／58.25）、
    倍數（25／40／65）、機率（0.25／0.50／0.25）全部一個字未動。**
