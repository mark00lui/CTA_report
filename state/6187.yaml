    一手佐證：**2026 前 8 月累計營收 59.29 億元新台幣（年增 51.11%）**、
    8 月單月 **11.09 億元（年增 103.06%）**、H1 EPS **11.9 元（年增 53.7%）**；
    法說稱**產能利用率高、聚焦先進封裝與 CoWoS**，並明言**訂單能見度直達 2027 年 Q2**。
    ⚠⚠ **傳導性質與 3131 完全相同，那條規則在本檔再用一次**：
    **設備商的營收是客戶「資本支出」的導數，不是客戶「營收」的導數 ——
    客戶決定擴產才會，而擴產是階梯狀的決策。**
    ⚠ **但本檔比 3131 多了一個可用的東西：管理層直接給了能見度的期限（2027 年 Q2）。**
    **那是一句可以被時間否證的話，扇出時可以拿它當錨，而不是只能等月營收。**
