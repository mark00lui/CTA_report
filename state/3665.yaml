thesis: "爭點是 HPC 平台爬坡後毛利率能否回到 28.77% 之上"
thesis_since: 2026-09-10
# ⚠ 只留爭點，前提移入 key_variables 與 notes（LITE 那輪的教訓，AXTI 起沿用）。
#   前提（已確立、不是爭點）：**轉型已經發生，而且轉折點看得見** ——
#   HPC 佔比自 1Q25 的 27% 提升到 1Q26 的 45%；月營收年增率 4 月觸底 18.54% → 6 月 63.79%；
#   累計年增率 4 月觸底 25.37% → 8 月 40.01%；單季淨利率 Q1 約 10.88% → Q2 約 12.79%。
#   ⚠ **為什麼爭點是毛利率而不是需求**：
#   **管理層把 Q1 的壓力指名為「新世代 HPC 平台初期爬坡」——
#   新產品低產量、前期工程與營運成本高，短期營運槓桿承壓，「並非結構性需求放緩」。**
#   **亦即公司自己主張這是暫時的。而暫時與否，只能用毛利率回不回得去來驗。**
#   ⚠⚠ **且 rack-level 的產品組合（HVDC 電源、高速互連、光學整合）與過去的線束
#   不必然是同一個毛利率結構 —— 回得去、回不去、或回到更高，三種都有可能。**

