    ⚠ **不可把 forward PE 7.32x 讀成便宜** —— 那是市場對「這就是峰值」的定價。
    ⚠ **不可把 MU 的倍數直接套用** —— NAND 與 DRAM 的循環幅度與供給結構不同。
