    ｜⚠⚠⚠ **主錨（成長持續期反推）第一次算得出來，而它給出一個意外的讀數**：
    **終端倍數取 15 倍 → 成長須貢獻 31.03 ÷ 15 ＝ 2.07 倍的盈餘
