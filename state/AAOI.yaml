    ✓ **對所有上市同業都算得出來，取得性已確認。**
    ⚠ **這一項測的正是第 ① 項的領先能不能存活到股東手上。**
  # ⚠⚠ 三項刻意平衡：一項本檔領先（①）、一項本檔墊底（②）、一項測領先能不能存活（③）。
  #   **事後挑指標的自欺在於只挑對自己有利的；本組是先寫下「哪一項會讓我難堪」再開始算。**
  #   三項在寫定的同一時刻都逐項確認過取得途徑（LITE 那輪記下的流程問題，AXTI 起已改掉）。
  methods:
    primary: >
      **分部別 EV/Sales（SOTP）。** ⚠ **這不是精緻化，是不做就會錯**：
      **42% 的營收是 CATV，把 15.04x 的整體倍數套上去等於用 AI 倍數買有線電視設備。**
      作法：資料中心分部對 Innolight／LITE／COHR 的營收倍數定序位；
      CATV 分部對 **HLIT 的 P/S 2.91x** 定序位。分母用營收，因為**盈餘為負**。
