driver_refs:
- driver: hyperscaler-capex
  direction: '+'
  note: >
    CSP 資本支出 → AI 伺服器機櫃數 → 散熱模組（氣冷、水冷板、Manifold、機殼）需求。
    ⚠ **本 driver 的 transmission 早已列著本檔，本次建檔才補上回指，完成雙向引用。**
    一手佐證：2026 前 8 月累計營收 **1,362.30 億元（年增 76.10%）**、
    Q1 營收年增 **110.17%**、Q2 年增 **66%**、Q2 EPS **24.37 元（年增 136.6%）**。
    ⚠⚠ **但本檔的年增率正在單調減速，而其中有很大一部分是基期效應，不是需求轉弱** ——
    **2025 年的營收是在下半年才起飛的**（2025 年 1–8 月月均約 96.7 億元、
    9–12 月月均約 155.6 億元，**+61%**）。
    **因此 2026 下半年的年增率會機械性地大幅下降。**
    **扇出時若用年增率判斷需求方向，在 2026 Q4 會得到錯的結論 —— 要看環比與絕對金額。**
- driver: accelerator-roadmap
  direction: '+'
  note: >
    平台世代與機櫃功率密度 → 氣冷轉水冷的滲透率與單櫃散熱價值量。
    ⚠ **本檔對本 driver 的曝險是直接的**：管理層已把水冷板月產能自 **20 萬套**
    擴到下半年的 **100 萬套**（五倍），Manifold 月產能擴至 **7,000 套**、機殼至 **60 萬套**。
    **GPU 相關營收 2026 年預期超過 50%；ASIC 產品下半年出貨後高毛利液冷占比可望再升。**
    ⚠⚠ **與 3324 的傳導方向相同但兩者是替代關係** ——
    **同一個 driver 對這兩檔是同向的，但它們之間是零和的。**
    **扇出時不可把「液冷滲透率上修」同時當成兩檔的利多而不談份額。**
- driver: ai-accelerator-demand
  direction: '+'
  note: >
    加速器實際出貨 → 機櫃數 → 散熱模組出貨。
    ⚠ **敏感度高但作用點在量而非率**：本檔毛利率的變動主要由**產品組合（水冷 vs 氣冷）**
    決定，而非由加速器出貨量決定。
    **Q2 毛利率 32.57%（季增 +2.8pp、年增 +8.16pp）的來源是組合，不是量。**
    **扇出時把「出貨上修」寫成「毛利率利多」是把兩件事混在一起。**

