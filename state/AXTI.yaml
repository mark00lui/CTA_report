# 公開研究檔 — 本倉庫不含任何倉位資訊：無成本、無數量、無權重、無 Kelly、無損益、無持倉揭露。
# 未知值一律留 __ 並寫進 gaps，不要填看起來合理的數字。
#
# ⚠⚠ 建檔當下最重要的三件事，寫在最前面：
#   (1) **本檔是覆蓋清單第一個「上游基板」節點，而它的兩個客戶 COHR 與 LITE 都已在清單內。**
#       磷化銦基板出貨在時序上**領先**下游收發器數個季度 —— 本檔因此是 6442／3008／COHR／LITE
#       共用的那個光通訊前提的**早期預警**。⚠ 但同一件事的反面是：最上游節點的長鞭效應最強。
#   (2) ⚠⚠ **絕不可把本檔標成 `substrate`。** 清單裡 `substrate` 指的是 3037／8046 的 **ABF 載板**
#       （封裝載板），本檔是**化合物半導體晶圓基板**（InP／GaAs／Ge 單晶）。
#       兩者的客戶、循環、物理都不同。**混在同一格會讓因子分析安靜地說謊。** 另立 `compound_semi`。
#   (3) ⚠⚠ **本檔的第二條失效路徑與 AI 需求完全無關**：產線在中國（北京同美 Tongmei），
#       Q3 指引明文限定於「已取得出口許可或不需許可」的部分；同美科創板 IPO 已於 2026-06-26 撤回
#       轉赴香港，觸發人民幣 3.244 億元（約 4,900 萬美元）的贖回權。**需求全對，這條仍可能單獨失效。**
