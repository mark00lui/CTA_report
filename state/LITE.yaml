  - ⚠⚠ **本檔納入覆蓋清單造成一個必須記下的結構問題：它原本是 COHR 的錨。**
    `state/COHR.yaml` 的三個情境倍數全部掛在 FN 與本檔的 forward PE 上
    （bear 略低於 FN、base 取兩家中點、bull ≈ 本檔）。
    **本檔成為覆蓋標的後，我對它的判斷會直接移動 COHR 的目標價 —— 那是循環引用。**
    **處置：兩檔的錨仍各自獨立（COHR 用同業、本檔用下方的方法組合），
    但每次重估其一時必須檢查另一檔是否連動，並在報告中明寫。已記入 coverage 的 correlation_watch。**
  rank_metrics:   # ⚠ 建檔時事先寫定，供日後 /revalue 定序位用
  - ① 資料中心／AI 相關營收成長率（本檔 FY26 +83.22%、Q4 +109%；⚠ **分部占比未取得**，列 gaps）
  - ② 毛利率（本檔非 GAAP **50.4%**、GAAP 44.24%；COHR 37.50%、FN 11.99% —— **本檔為族群最高**）
  - ③ CPO 料號是否已進入 BOM（⚠ **本檔的 CPO 進度本輪完全未取得**；
    對照 COHR 有第一手時程。**產業放量不等於進入 BOM，這是本族群的共同斷點**）
  methods:
    primary: >
      **EV/Sales（Q4 的主錨之一）** —— trailing **29.08x**（876.4 億 ÷ 30.14 億）；
      **以 FY2027 共識營收 62.8 億計，forward EV/Sales 為 13.96x**。
      ⚠ **兩者差一倍以上，引用時必須指明是哪一個。**
    secondary: >
      **同業 EV/Sales 序位**（軸④參照）：本檔 29.08 對 COHR **8.57**、FN **3.04**。
      ⚠ **本檔是族群最高，且高出一個量級** —— 序位分析的重點因此不是「該折價或溢價」，
      而是「**毛利率 50.4% 對 37.50% 對 11.99% 的差距，撐不撐得起 29.08 對 8.57 的差距**」。
    check: >
      **成長持續期**（軸③時間）—— 管理層公開稱 **2028 年具「40 美元的獲利能力」**。
      **以現價 988.98 計，該值對應 24.7x；若成真，現在的 45.70x forward 就不算離譜。**
      ⚠ **但那是管理層說法不是共識，tier 為假設，不得作為 base 的錨。**
  axes_crossed:
  - 分母（軸①：EV/Sales 看營收，而本檔的盈餘分母為負、本益比無定義 —— **這一軸不是選擇，是必需**）
  - 參照（軸④：同業 EV/Sales 序位，COHR 與 FN 同一時點同一來源）
  - 時間（軸③：trailing EV/Sales 29.08 vs forward 13.96 vs 管理層 2028 年獲利能力）
  excluded: >
    ⚠⚠ **不可用 trailing 本益比 —— 不是「不建議」，是數學上無定義**：GAAP EPS 為 **-92.96**。
    ⚠ **而那個負值的成因是一次性非現金的債務清償費用，不是營運虧損**（營業利益 +5.362 億）。
    **兩件事要一起講：既不能用它算倍數，也不能用它推論營運。**
    ⚠ **不做 forward-DCF** —— Q4 的明文禁令；且本檔成長率遠離穩態（FY2027 共識營收 +108%），
    終值假設會主導結果。
    ⚠ **不用 PB** —— 本檔 PB 由 stockanalysis 記為 9.48（as-of 2026-09-04 口徑），
    但巨額債務清償費用剛剛穿過股東權益，**帳面淨值在本輪不具比較意義**。
    ⚠ **不算 PEG** —— g 遠離穩態（EPS 自負轉正，成長率無定義）。
    ⚠ **管理層的「2028 年 40 美元獲利能力」只可作為 check，不可作為 base 的錨** ——
    tier 為假設，且它是**供應商對自身前景的陳述**，與共識不獨立。
    ⚠⚠ **錨寬度極寬，且是本清單至今最寬的一檔**：
    分析師目標價 **低 820／均 1,148.43／高 1,400（26 位）→ 錨寬度 (1400−820)÷820 ＝ 70.7%**。
    對照 GOOG 39.7%、CEG 5.78%。**依 SKILL.md，錨寬度擴大時信心不得因缺口減少而升等 ——
    本檔建檔即以此壓住信心上限。**
  reviewed: 2026-09-10

