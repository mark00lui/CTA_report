- name: ABF供需與漲價幅度
  value: 15-20
  unit: '%（2026 年 ABF 載板漲價幅度預估）'
  tier: 推論
  source: >
    2026 年 ABF 載板漲價幅度預估 15–20%，公司採滾動式調漲策略。
    上游 T-glass 材料嚴重缺貨，日本供應商新廠預計 2027–2028 才投產。
    ⚠ 供給缺口有**兩個互相矛盾的預估**，2026-08-31 併記，不擇一：
      版本 A：2027 年全球 ABF 供給缺口約 12%
      版本 B：2026／2027／2028 缺口逐年擴大為 8%／27%／35%
    兩者對 2027 的差距是 12% 對 27%，超過一倍。
    ⚠ 且有第三種對立看法：**外資普遍較保守，認為高峰可能出現在 2026 年第 2~3 季，
    因為供需狀況將越來越趨於平衡。** 這與前兩個版本方向相反。
    三種看法並存，正是 2027 EPS 共識分散度達 2.4 倍（21.27–50.49）的來源 ——
    分散度不是估計誤差，是對「循環何時見頂」根本沒有共識。
    ⚠ tier 標推論而非事實：漲價幅度與供給缺口皆為法人／產業預估，非公司揭露。
    ⚠ 這一格與「資本支出」是同一枚硬幣的兩面 —— 缺口造就漲價，漲價引來擴產，
    擴產填補缺口。thesis 問的就是這個循環的時序。
    ⚠ **2026-09-08 併入共識分散度 —— 因為 changes_if 原本就把兩者綁在一起**
    （原文：「2027 共識分散度收斂**且供需缺口的兩個版本擇一被證實** → 信心升至中」）。
    ⚠ **本輪第一次把「分散度」變成一個數字，而它顯示的是分散，不是收斂。**
    2026 EPS 共識（stockanalysis，**as-of 2026-09-08**，19 位，Strong Buy）：
    低 **12.82** ／ 均 **20.12** ／ 高 **24.84** → **錨寬度 = 93.8%，低到高接近兩倍。**
    ⚠ **對照全清單**：3008 為 18.4%、NVDA 為 12.1%、6239 為 8.9% —— **本檔是它們的四到十倍。**
    ⚠ 依 SKILL.md：**錨寬度擴大時，即使缺口數量減少，信心也不得自動升等。**
    本輪確實關掉了兩個缺口（同業倍數、共識分布首次取得），
    **但 93.8% 這個數字同時出現 —— 兩者相抵，信心維持「低」。**
    ⚠ 目標價分布：低 **900.00** ／ 均 **1,257.89** ／ 高 **1,700**。
    ⚠ **2027 與 2028 的共識在付費牆後，而本檔的基準年正是 2027** ——
    故三情境所用的 2027 EPS（21.27／32.71／50.49）**本輪無法以同一來源覆核**，仍為前值。
    **這是本檔目前最不對稱的缺口：有 2026 的完整分布，卻沒有基準年的。**
