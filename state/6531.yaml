    **(a) 規模成長是真的，而且幅度很大** —— 2026 前 8 月累計營收 **65.99 億元
        （年增 109.13%）**、8 月單月年增 **150.82%**、H1 EPS **8.33 元**。
    **(b) 而獲利品質看起來是乾淨的** —— **Q1 毛利率 46%，在營收年增 115% 的同時
        與去年同期持平。** **那說明成長來自量而不是價，也說明產品定價沒有跟著
        記憶體現貨價走 —— 那是客製化與利基型產品的特徵。**
    **(c) 但下一段要等很久** —— **VHM 與 VHMStack 的全面量產時程延伸至 2027–2028。**
        **若 IoTRAM 這一段已經到頂（見 (2)），中間就有一段 18–30 個月的空白，
        而現價是 57.61 倍。thesis 問的正是這個。**
  changes_if: >
    ⚠ 五欄語法（資料項 | 門檻 | 不等號方向 | 計畫值是否算數 | 資料來源）。
    **升為可評級（最高優先）**：`VHM 與 VHMStack 的目標市場規模、單價與預期營收占比 |
      有無 | 取得即執行 | 公司揭露算數，「2027–2028 全面量產」這個時點不算數 |
      法說簡報或 Q&A`
      ＋ `晶豪科 3006 與鈺創 5351 的當期倍數 | 有無 | 取得即執行 | 需同一日期 | 各家報價頁`。
    **補齊排序指標**：`季研發費用率與季營業利益率 | 兩項 | 取得即執行 |
      財報認列算數 | 季報`。
    **⚠⚠ 建檔流程的固定步驟（本輪第十次缺同一個數字）**：
      `淨現金／淨負債 | 有無 | 每次建檔必查 | 查得值算數 | 合併資產負債表`
      → **本檔特別重要：股東權益週轉率僅約 0.69 倍，若帳上有大額現金，
      選擇權拆分的分母要先扣掉它。**
    **偏空**：`2026 Q3 營收 | 30 億元 | < | 月營收合計算數 | 公開資訊觀測站`。
    **偏空**：`單季淨利率 | 26% | < | 財報認列算數 | 季報`。
    **論點確立（thesis 成立方向，即「Q2 只是暫歇」）**：
      `2026 Q3 EPS 的季增率 | 10% | > | 財報認列算數 | 季報`
      —— ⚠ **10% 的選法**：**Q2 的季增是 +1%，而營收季增 +12.6% ——
      要證明那是暫歇，EPS 的季增至少要追上營收的季增量級。**
    **重新分類為 AI 曝險**：`VHMStack 相關營收占比 | 10% | > | 揭露值算數 | 法說`
      → **達標則加上 `ai_capex_hw` 標籤並重估。**
      ⚠ **這條規則寫在前面，是為了讓分類本身可被否證** ——
      **與 3533、8299 兩檔的處理相同，本輪第三次。**

