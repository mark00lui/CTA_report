    **而本檔曝險的是資料中心的用電量，那是資本支出落成之後的存量，不是資本支出本身。
    一座已建成的資料中心即使 capex 歸零仍然耗電。**
    **正確做法是新增 `datacenter-power-demand` driver，而非硬掛既有的三個。** 已列 gaps。
    ⚠ **技術面：一個少見的組合** —— 價格 298.96 高於 50DMA **266.42（+12.21%）**
    與 200DMA **296.36（+0.88%）**，**但 50DMA 較 200DMA 低 10.10%（空頭交叉狀態）**。
    價格重挫後正在修復、剛收復 200DMA，**而收復幅度僅 +0.88%，一天波動就能抹掉 —— 不是站穩**。
    距 52 週高 412.70 為 **-27.6%**，位於 52 週區間的 **38.2%**；52 週報酬 **-3.09%**。
    ⚠ **四條 falsifier 全部有數字門檻且全部未觸發，第一條在六個月內可驗證**
    （FY2026 Adjusted EPS 低於共識下緣 **11.77**，最早驗證點為 2026 Q3 財報約 2026-11 上旬）。
    ⚠ **第一條的門檻取共識下緣而非自訂數字，理由是錨寬度只有 5.78% ——
    在一個如此收斂的共識裡跌破下緣，本身就是強訊號。**
    ⚠ **三情境刻意不建**：不是因為沒有共識（本檔有 22 位分析師，且 FY2027 可取得、
    基準年滾得動 —— 這是它優於 3030／6442／3324 的地方），
    **而是因為基期不乾淨**：TTM 是併購混合期，倍數的水準無法定錨。
    **依 valuation.md，錨拿不到時應明寫而非填一個看起來合理的數字。**
    ⚠ **錨寬度 5.78% 是全清單最窄（前次最窄為 6239 的 8.9%），但不因此升信心** ——
    那是 Adjusted（公司指引）口徑，22 位分析師都照公司指引建模；
    **窄的是對指引的共識，不是對價值的把握。**

