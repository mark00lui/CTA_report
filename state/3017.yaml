    ⚠ 另一來源 stockanalysis 於 2026-09-08 記 73.98，兩者差 4.3%，列 gaps），
    **又大又正、無一次性項目扭曲。**
    ⚠⚠ **但成長率極度遠離穩態**：Q1 2026 營收年增 **110.17%**、Q2 **+66%**、
    Q1 EPS **20.17**（歷史新高）、Q2 EPS **24.37（年增 136.6%）**、
    2026 前 8 月累計營收年增 **76.10%**。
    **且毛利率同時在快速上升**：Q1 **29.77%** → Q2 **32.57%**（季增 +2.8pp、**年增 +8.16pp**）。
