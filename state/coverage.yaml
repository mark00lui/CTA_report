      ⚠⚠ **這對整個 optical 因子都是新資訊，不只對 AAOI**：
      **資料中心光模組的全球量產龍頭，淨利率 31.3%、營收 +134.2%，forward PE 只有 17.70。**
      **對照 LITE 的 forward PE 45.70、AAOI 的 46.90 —— 族群樣本此前全在美股，
