  ai_capex_hw:    {count: 29, pct: 74.4, note: "⚠⚠ **2026-09-11 納入 INTC 英特爾後自 73.7% 升至 74.4%（分子 28 → 29）。** ⚠⚠⚠ **而 INTC 讓這一格出現第三種結構位置，前兩種都還在**：**(1) 賣東西給 AI 資料中心的供應商（27 檔）；(2) 那些供應商的客戶（2317 鴻海，組裝）。** **INTC 是第三種：**同時在三個位子上，而方向不同**ーー(a) 賣 CPU 給 CSP（與第一種同向）；(b) 賣代工產能給 AI 晶片設計商（TSM 的位子）；(c) 是 NVDA 在資料中心運算上的競爭者。** ⚠⚠⚠ **而最麻煩的是 (b) 與 (c) 在**同一檔內部**方向相反**：**加速器需求若完全由 GPU 吃下，對 INTC 的 DCAI 是排擠；但同一筆需求若走向自研 ASIC，INTC 的代工那一層反而受惠。** **AVGO 那次記下的是「清單內兩檔之間方向相反」；INTC 是「同一檔內部兩個通道方向相反」—— 那是新的，而且更難處理：扇出時無法只給這一檔一個 direction。** ⚠ **實務後果**：**這一格的 74.4% 現在同時包含了同一筆錢被算兩次（供應商 ＋ 組裝廠）與同一檔內部自我抵銷（INTC）兩種情形。** **等權因子分布數的是標的數，兩種都看不見 —— 判讀集中度時必須記得。**（歷史沿革 22 段已移入 reports/2026/09/2026-09-11-coverage-note-history.md）"}
