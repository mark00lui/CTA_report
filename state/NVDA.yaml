ticker: NVDA
name: NVIDIA
market: US
factor_tags:
- ai_capex_hw
- accelerator
driver_refs:
- driver: ai-accelerator-demand
  direction: '+'
  note: >
    本檔是這個 driver 的主要成分，也是它的傳導對象 —— 覆蓋清單中唯一「既被研究、又是他檔資料來源」
    的標的。資料中心營收與合計值取 driver 現值，不在本檔複製。方向為 '+' 但內含一個反向成分：
    合計需求若主要由自研 ASIC 貢獻，對 NVDA 是替代而非受惠，見該檔第三條 falsifier（ASIC 占比 >30%）。
- driver: accelerator-roadmap
  direction: '+'
  note: >
    自家平台換代節奏。方向 '+'，但換代爬坡期對毛利率是短空 —— Q3 FY27 毛利率指引由 75.0% 降至
    74.0%，正好是 Vera Rubin 開始出貨的那一季。判讀本檔毛利率下行時，必須先排除「換代爬坡」
    這個暫時性解釋，才能論證它是結構性的定價權問題。這是 thesis 的核心分歧點。
thesis: 需求已不是爭點（DC +117%、Q3 指引 $108B 且完全不含中國）；爭點是毛利率自 75% 下行的斜率與 Rubin 換代的持續性，23x 遠期本益比已明顯折價但未定價成長終結
thesis_since: 2026-08-27
thesis_history:
- {until: 2026-08-27, text: "…19x 遠期本益比已定價成長終結",
   why_changed: "引用的數字錯誤。19.08x 為 NTM 口徑（跨 FY27H2／FY28H1），與任何單一會計年度共識都對不上。FY2027 共識 EPS 實為 9.02，對 209.66 收盤是 23.2x。23.2x 只支持『已明顯折價』，不支持『已定價成長終結』的強論述。見 reports/2026/08/2026-08-27-NVDA-revaluation.md"}
valuation_base_year: FY2027   # 首次設定。滾動至 FY2028 的時點為 Q3 FY27 財報（約 2026-11），屆時 FY28 共識可得

