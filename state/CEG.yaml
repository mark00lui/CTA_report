    ⚠ **對象限的意涵：X 軸（當期盈餘代表性）的證據明確倒向 Q3。**
    建檔時 GAAP 指向 Q3、Adjusted 指向 Q2，**本輪的一手證據強化了 GAAP 那一邊**。
    ⚠ **對估值方法的意涵**：以 GAAP 淨利為分母的任何倍數（含 trailing PE 28.95）
    **都建立在一個 43% 未實現的數字上**。**forward PE 用的是 Adjusted，不受此污染 ——
    這是本輪把主錨自 EV/EBITDA 改為 forward PE 的理由之一。**
