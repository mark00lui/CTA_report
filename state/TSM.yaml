# 公開研究檔範本 — 複製為 state/<ticker>.yaml。
# 本倉庫不含任何倉位資訊：無成本、無張數、無權重、無 Kelly、無損益、無持倉揭露。
# 未知值一律留 __ 並寫進 gaps，不要填看起來合理的數字。
ticker: TSM
name: 台積電 ADR
market: US
factor_tags:
- ai_capex_hw
- foundry
- tw_fx
driver_refs:   # 本檔是覆蓋清單八檔中唯一同時被三個 driver 指向的標的
- driver: hyperscaler-capex
  direction: '+'
  note: capex → GPU/ASIC 投片 → 先進製程與 CoWoS 產能利用。領先 1–2 季。四大 CSP capex 合計住在該 driver，不在本檔複製。
- driver: ai-accelerator-demand
  direction: '+'
  note: 加速器需求 → 投片與封裝。⚠ 方向要看清楚：已「認列」的加速器營收對本檔是同步偏落後指標（晶片先做出來才賣得掉），真正領先的是下一季 guidance 與長約。引用時務必分清用的是哪一個。
- driver: accelerator-roadmap
  direction: '+'
  note: 平台節點與封裝需求 → N2 客戶採用與 CoWoS 規格升級。領先 2–4 季。2026-08 新增路徑：Spectrum-X CPO 由 TSMC COUPE 封裝，使先進封裝需求來源由 GPU 擴及交換器。
thesis: 先進製程與先進封裝的定價權，使 AI 需求週期中的價值捕捉高於歷史代工水準
thesis_since: 2026-08-27
valuation_base_year: 2027   # 首次設定。非預設而是驗證所得：站上 forward PE 19.38 僅在 2027 口徑下對得上（NT$142.13×5÷32.3=$22.00 → 19.0x），2026 口徑為 25.1x 對不上
scenarios:
  # EPS 為 2027 ADR 口徑：共識 NT$142.13/普通股 × 5 股/ADR ÷ TWD/USD 32.3 = $22.00
  bear:
    p: 0.25
    p_basis: 機率由使用者於 2026-08-27 全量重估指定。Q3 毛利率指引 65–67% 已低於 Q2 實績 67.7%，加上台幣為淨負面因子，毛利率短期方向向下
    key_assumption: AI capex 見頂、庫存修正；台幣升值壓縮毛利；地緣風險溢價擴大。EPS 低於共識約 14%
    eps: 19.0
    exit_multiple: 15
    multiple_basis: "錨在歷史 forward 中位（16.3x，見 base）之下 — 對應「毛利率結構性改善被證偽、回到 AI 之前的定價」。⚠ 10 年 trailing 區間下緣 11.15x 換算 forward 約 9x，但那對應 2018–2019 的低成長期，與現在的產品組合不可比，故不採用該極值"
    tp: 285
    narrative: 15x 為歷史區間下緣。對應價 285 低於 200DMA(368) 且遠低於現價 — 需要一次趨勢級修正才成立
  base:
    p: 0.50
    p_basis: Q3 指引已給、7 月營收 +44.7%、capex 上修至區間高端、N2 與 CoWoS 擴產路徑明確，共識達成是最可能路徑
    key_assumption: 2027 共識達成；毛利率維持 6 字頭；N2 與 CoWoS 依既定時程放量
    eps: 22.0
    exit_multiple: 19
    multiple_basis: "錨 A（自身歷史，經 trailing→forward 換算）。10 年 trailing 中位 20.37x、5 年平均 23.6x、10 年區間 11.15–33.10x。依約 25% 的 EPS 年增率換算，歷史 forward 中位 ≈ 20.37/1.25 ≈ 16.3x。現況 forward 19.0x 較之溢價 17%（trailing 口徑則為 28.2x vs 20.37x，溢價 38%）。判斷為【完全合理】：毛利率自歷史的 50% 出頭升至 67.7%，是產品組合與定價權的結構性改變，非循環高點；同樣的 EPS 品質更高，理應給溢價，17% 的幅度不算過分。⚠ 本情境的倍數數值與現價隱含值接近屬結論而非抄襲 — 錨是 16.3x 加上一個具名的溢價理由，不是現價"
    tp: 418
    narrative: 19x = 歷史換算 forward 中位 16.3x + 毛利率結構性改善的溢價；數值接近現價隱含值是結論不是起點
  bull:
    p: 0.25
    p_basis: 需要產能擴張全數轉為營收且定價權不被稀釋（海外廠成本較高會拉低平均毛利），兩者都尚未證實。與 bear 對稱
    key_assumption: 先進製程與先進封裝雙雙定價權（thesis 核心）；N2 產能 CAGR 70% 順利、CoWoS 擴產逾 80% 全數轉為營收
    eps: 24.5
    exit_multiple: 25
    multiple_basis: "錨在賣方定價：街上均值目標 554.45（2026-08 取得）隱含 25.2x，取 25x 未取更高。交叉檢查：25x forward 對應 trailing 約 31x，仍在 10 年 trailing 區間內（上緣 33.10x）"
    tp: 613
    narrative: 25x ≈ 街上均值目標 554.45 隱含的 25.2x，未取更高
  weighted_tp: 434
