key_variables:
- name: 稅後淨利對營業利益的轉換率
  value: 64.5
  unit: '%（2026 H1；去年同期約 83.7%）'
  tier: 推論
  source: >
    ⚠⚠⚠ **這是本檔最重要的一個數字，而它是算出來的不是查到的，所以推算式全部寫出來**：
    **2026 H1：營業利益 **1,705 億元**、稅後淨利 **1,099 億元** → **64.5%**。**
    **2026 Q2：營業利益 **948 億元**、稅後淨利約 **600 億元** → **63.3%**。**
    **去年 H1 反推：營業利益 ＝ 1,705 ÷ 1.65 ＝ 約 **1,033 億元**
    （H1 營業利益年增 65%）；稅後淨利 ＝ 1,099 ÷ 1.27 ＝ 約 **865 億元**
    （H1 稅後淨利年增 27%）→ **83.7%**。**
    ⚠⚠ **亦即這個轉換率一年之內掉了約 19 個百分點。**
    **同一件事的另一個說法：營業利益年增 68%（Q2）／65%（H1），
    而稅後淨利只年增 30%（Q2）／27%（H1）。**
    ⚠⚠⚠ **可能的解釋至少三個，本輪一個都沒查證**：
    **業外損益（轉投資與匯兌）、有效稅率上升、少數股權
    （AI 機櫃的獲利若落在持股未達百分之百的子公司，母公司只認列一部分）。**
