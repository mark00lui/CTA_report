# 公開研究檔 — 本倉庫不含任何倉位資訊：無成本、無數量、無權重、無 Kelly、無損益、無持倉揭露。
# 未知值一律留 __ 並寫進 gaps，不要填看起來合理的數字。
#
# ⚠⚠ 建檔當下最重要的四件事，寫在最前面：
#   (0) ⚠ **建檔時攔下一個來源的英文名錯誤**：**某搜尋摘要把 6531 的英文名寫成 "Aiptek" ——
#       Aiptek 是天瀚科技，不是愛普。6531 是 AP Memory Technology（愛普科技），
#       做的是客製化記憶體 IC 設計。**
#       **產品名（IoTRAM、S-SiCap、VHM、VHMStack）確實是愛普的，故中文標的沒錯、英文名錯。**
#       **兩天之內第三次資料源出錯（前兩次：3221 代號筆誤、6187 的 +9.82% 成長率）。**
#   (1) ⚠⚠ **本檔刻意不標 `ai_capex_hw`，而這是本輪第三次做這個判斷**（前兩次為 3533、8299）：
#       **現在的營收由 IoTRAM 撐（法說明言「IoTRAM 強勁需求推升營收年增 115%」），
#       而給 AI 加速器用的 VHMStack 要到 2027–2028 才全面量產。**
#       **AI 資料中心的當期營收實質上是零 —— 標上去會是為敘事而標，不是為證據而標。**
#   (2) ⚠⚠ **Q2 EPS 季增只有 +1%，而同期營收季增 +12.6%** ——
#       **單季淨利率自約 32.2% 降到約 28.8%。年增 +224% 與季增 +1% 同時為真。**
#       **這就是 thesis：現在這一段的成長已經在季度層面停滯。**
#   (3) ⚠⚠ **本檔是本輪第二檔「均線兩端都過關」的標的，而且比前一檔更好**：
#       **季線距現價 -13.79%，比值 2.55 倍日振幅（5.41%）—— 高於 6187 的 2.03 倍。**
