driver_refs:
- driver: hyperscaler-capex
  direction: '+'
  note: >
    capex → GPU/ASIC 投片 → ABF 載板需求。領先 2–3 季。
    ⚠ 與 3037 同為供給受限，需求上修先反映在漲價與交期而非出貨量 —— 看營收成長率會低估
    傳導強度，要看毛利率。但本檔有一個 3037 沒有的槓桿：**稼動率僅逾八成**，
    量能尚未滿載，故漲價與稼動率提升可同時發生，傳導強度理論上高於 3037。
- driver: ai-accelerator-demand
  direction: '+'
  note: >
    加速器出貨 → 載板投片。領先 2–3 季。方向與 TSM 的註記同構：已認列的加速器營收對本檔是
    同步偏落後指標，真正領先的是下一季 guidance 與長約。
- driver: accelerator-roadmap
  direction: '+'
  note: >
    平台節點與封裝規格 → ABF 載板層數、尺寸與良率要求。領先 3–4 季。
    ⚠ Rubin Ultra 的單 GPU 為 4 顆光罩尺寸晶片、1TB HBM4 跨 16 個 HBM sites，
    載板面積與層數需求大增 —— 但時點在 2027 下半，遠在本檔基準年之外。
