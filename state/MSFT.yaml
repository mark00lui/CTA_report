event_log:
- date: 2026-09-01
  level: L2
  summary: 全量重估。⚠ 象限自 Q1 遷入 Q2（資本密集度跨過門檻），首次補上錨 B（同業）。目標價維持 512，但評級自偏多下修為中性 —— 原因是股價上漲吃掉空間，不是基本面轉壞
  delta: >
    機率沿用前值，**未重評**（使用者未指定）。三情境的 EPS 與倍數全部維持：
    bear 18.5 × 20x = 370／base 19.75 × 26x = 514／bull 21.0 × 31x = 651，加權 512。
    ⚠ **本次是 L2，但觸發的是「象限漂移」這條新門檻，不是目標價變動（變動 0%）。**
    **象限自 Q1（盈餘倍數）遷入 Q2（現金流與企業價值）**：FY2026 資本支出 **115.9B（+79.6%）**、
    含融資租賃約 **175B**，capex／營收約 38%（含租賃約 57%），遠超 15% 門檻；
    自由現金流 67.0B（**-6.5%**）。依 valuation-map，Q2 的處方是 EV/EBITDA 與 P/FCF，
    **純本益比會系統性高估** —— 而我此前對本檔只用自身歷史 PE。
    ⚠ **但遷入 Q2 對本檔的結論是相對利多，這一點必須講清楚否則會被誤讀**：
    平台三檔的現金指標 —— 本檔 P/FCF 56.3x／失真 2.19x／FCF-OCF 轉換 **36.6%**；
    GOOG 77.5x／3.11x／26.2%；META 35.6x／2.02x／31.4%。
    **本檔的轉換率是族群最高**，且是四大 hyperscaler 中唯一被預期 2026 年自由現金流
    仍成長（+5%）的一家。故不因資本密集度調降倍數 ——
    **「維持 26x」是本次的結論，不是沒做事。**
    ⚠ EPS 交叉檢查：現價 507.29 ÷ 遠期本益比 25.68 = **19.75**，與本檔 FY2027 EPS 假設
    完全相同 —— 我用的就是市場的遠期 EPS。這一格沒有獨立判斷，如實記下。
    ⚠ **評級 偏多 → 中性，而下修的原因是股價上漲，不是基本面轉壞。**
    加權 512 相對現價 507.29 僅 +0.9%；設定偏多時空間還有 +3.1%（現價 496.37）。
    **偏多需要「趨勢」與「空間」兩者，現在只剩趨勢。**
    ⚠ **循環性檢查觸發**（加權 +0.9%、base +1.2%）。判定為**結論**：26x 的推導順序可查。
    四條 falsifier 全數維持、未觸發；第四條仍為「未驗證」（年報附註尚未檢視）。
    ⚠ 續存的最大缺口未變：自身歷史「遠期」本益比分位未取得，只有 trailing 平均；
    bull 的 31x 口徑存疑（若「近五年 25–35x」是 trailing，則 31x forward 對應 trailing
    約 36.6x 已高於區間上緣，bull 比表面上更激進）。
- date: 2026-08-31
  level: L1
  summary: 全清單重估 — 更新現價與技術面，三情境與加權目標價未變
  delta: >
    現價 496.37 → 513.53（8/28，+3.5%）。加權目標價 512 不變，但相對現價自 +3.1% 轉為 **-0.3%** —— 上檔歸零。⚠ **循環性檢查觸發**：base 19.75×26 = 514 對現價 513.53 僅差 0.01%，且報價頁遠期本益比恰為 26.00、等於我的 base 倍數。但這是**結論而非產物** —— 26x 於 8/27 由 5 年 trailing 平均 31.26 ÷ 1.18 換算而得，當時現價 487.73、隱含 24.89x，是價格漲上來與模型會合。與 INTU 於 8/27 的情形同構。⚠ **折現率重錨**：8/31 取得可觀測錨（10 年期公債 4.728%，2026-08-28）。原 reverse-DCF 用 r=7/8/9% 無錨；以無風險 4.728% + 股權風險溢酬約 4.5% × beta 約 1.0 計，合理區間應為 **8.5–10%** 而非 7–9%。重算市場隱含永續 FCF 成長率：r=9% 為 7.06%、r=10% 為 8.04% —— 即市場要求的永續成長比我先前結論的 5.1–7.1% **更高**，「自由現金流說它貴」的判斷因此**加強而非減弱**。⚠ 訊號維持偏多但三隻腳只剩兩隻：8/27 給偏多的三個支柱之一是「遠期 24.89x 位於近五年區間下緣」，現在 26.00x 已等於我認定的合理值，該支柱消失。評級跟趨勢走故不改，但若股價再漲而 EPS 未上修，就必須降評。
- date: 2026-08-27
  level: L2
  summary: 重估 — 新增自由現金流為 key_variable 與 falsifier；目標價不變 514／加權 512
  delta: P/FCF 55.02x 是遠期本益比 25.13x 的 2.19 倍 —— 同一家公司兩個指標給相反結論，差額全在 capex（FY26 現金 capex 115.95B、+79.6%；曆年含租賃重分類約 175B）。FY26 FCF 66.99B 較前一年下滑，Q4 單季 -23%。reverse-DCF 顯示市場隱含永續 FCF 成長 5.1%～7.1%（r=7%～9%），即使假設 FCF 正常化回 100B 仍需 4.2%～6.1%。本次未調整倍數 —— 分歧點是「capex 是投資還是消耗」，要 FY2027–28 折舊入帳才知道 —— 但已寫成 falsifier：FY2027 FCF 低於 66.99B 而 Azure cc 成長仍高於 35%。key_variable「Copilot付費席次」換成「自由現金流與FCF殖利率」。訊號維持偏多（趨勢與需求未破壞、falsifier 全未觸發），但信心不升至高，即使黃金交叉完成亦須先看 FY2027 上半年 FCF。現價 487.73 → 496.37
