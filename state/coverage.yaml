    note: >
      **AXTI 已與 COHR 及 LITE 各自簽訂長期供貨合約**，其中 COHR 支付預付款 **2,540 萬美元**
      （另有一筆 **2,230 萬美元**的預付款客戶名稱待確認，LITE 的合約金額未揭露）。
      **三檔在同一條需求鏈上，一個共同的光通訊需求衝擊會同向推動三檔 —— 相關性預期高。**
      ⚠⚠ **但這一組與 LITE／COHR 那一組的性質必須分清楚，否則下一輪一定會犯同樣的錯：**
      **LITE／COHR 是循環引用，因為 COHR 的三個情境倍數直接掛在 LITE 的 forward PE 上 —— 那是借倍數。**
      **AXTI 的副錨借的是 COHR／LITE 的「出貨量與時程」，那是下游事實，不是估值判斷 —— 那是借事實。**
      **借事實可以，借倍數不可以。**
      **判準很簡單：下次 /revalue 若寫出「AXTI 應該值 X 倍，因為 COHR 值 Y 倍」，就是已經越線了。**
      ⚠⚠ **而這一組帶來一個本清單此前沒有的東西：時序上的領先。**
      **基板出貨在下游收發器之前數個季度，所以 AXTI 的 InP 營收可以用來檢驗
      6442／3008／COHR／LITE 共用的那個光通訊前提是否還成立** ——
      **這是清單裡第一個能對既有前提做前瞻檢驗的節點，而不是又一個押同一個前提的人。**
      ⚠ **代價同時寫下：最上游的長鞭效應最強。** 需求轉折時 AXTI 會最早也最劇烈地反映，
      **因此「AXTI 走弱」在早期無法區分是「終端需求轉弱」還是「下游庫存調整」——
      要判斷是哪一個，必須同時看 COHR／LITE 的營收有沒有跟著走。**
      ⚠ **一個已寫定的檢驗點**：COHR 管理層已指引 scale-up 型 CPO 於曆年 2027 下半貢獻營收。
