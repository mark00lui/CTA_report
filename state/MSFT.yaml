driver_refs:
- driver: ai-accelerator-demand
  direction: '-'
  note: >
    加速器採購 → 資產啟用 → 折舊費用 → 營益率。落後 2–4 季，sensitivity 中 ——
    低於 hyperscaler-capex，因該檔只涵蓋 capex 中的加速器部分。
- driver: hyperscaler-capex
  direction: '-'
  note: 四大 CSP capex 合計與各家曆年成分值住在 driver，不複製進本檔。傳導路徑（capex → 折舊費用 → 營益率，落後
    2–4 季，敏感度高）見該檔 transmission。⚠ 該 driver 的 Microsoft 成分仍為 190（標「曆年推估」），與公司
    2026-07-29 揭露的曆年 2026 約 175 不符，合計 725 亦連帶高估 — 需另跑 /driver 修正並扇出，修正時務必註明
    差額為會計年限口徑而非需求下修。
thesis: Azure +43% 與 RPO +84% 證明 capex 正轉為承諾營收；真正風險不是需求而是折舊時點與 15→25 年年限假設，那決定 FY27–28 獲利品質
thesis_since: 2026-08-26
valuation_base_year: FY2027
scenarios:
  bear:
    p: 0.25
    p_basis: 機率由使用者於 2026-08-26 全量重估指定。折舊壓力是確定會發生的事，只是時點與幅度未知；街上已用 FY27 EPS +14%（vs FY26 +22%）標了它。給四分之一，反映「會發生但已被部分定價」
    key_assumption: FY26–27 capex 的折舊在 FY27 下半集中入帳，營益率跌破 46.8%；Azure 隨產能到位回落至 35% 區間；市場對 AI 平台的耐心縮短
    eps: 18.50
    exit_multiple: 20
    multiple_basis: "錨在市場實際付過的價：52 週低 349.20 當時的 forward 倍數即約 20x。這是最強的一種 bear 錨 —— 它證明該價位真的出現過，不需要任何人接受新的敘事"
    tp: 370
    narrative: 折舊先於營收到位；20x 是 52 週低 349.20 當時市場實際付過的倍數
  base:
    p: 0.50
    p_basis: 需求面本季沒有可爭論處，Q1 FY27 指引（Azure +45% cc）還高於共識 41.4%。共識達成是最可能的路徑
    key_assumption: FY27 共識達成；Azure 維持 40%+，營益率大致持平；倍數自 24.89x 小幅修復
    eps: 19.75
    exit_multiple: 26
    multiple_basis: "錨 A（自身歷史，經 trailing→forward 換算）。5 年平均 trailing 31.26x，依約 15–18% 的 EPS 年增率換算 forward ≈ 31.26/1.18 ≈ 26.5x → 取 26x。現況 forward 24.96x 較之折價僅 8%，是清單中偏離歷史最小的一檔。判斷為【部分合理】：折價反映 15→25 年伺服器耐用年限變更後折舊節奏的不確定，但 8% 幅度小且該變更本身不改變現金支出（CFO Hood 明言 useful life 影響之外 2026 capex 預期不變）。⚠ 非現價隱含值 —— 26x 由歷史換算得出，事後檢查才發現與現況接近，這個順序很重要。⚠ 2026-08-27 新增 DCF 交叉檢查，結果與本益比框架【不一致，且本次未予調和】：以 TTM 自由現金流 66.99B 對市值 3.69T 反推，市場隱含的永續自由現金流成長率為 5.1%／6.1%／7.1%（折現率 7%／8%／9%）—— 對一個永續期而言相當進取。若 capex 見頂後 FCF 正常化回到 100B，隱含成長率降為 4.2%／5.2%／6.1%，仍不低。換言之：本益比說 MSFT 相對自身歷史便宜 8%，自由現金流說它需要永續 5–7% 的現金流成長才撐得住。本次不因此調整倍數 —— 兩者的分歧點是「capex 是投資還是消耗」，那要 FY2027–28 折舊入帳後才知道。但這個分歧已寫成 falsifier，不再是隱形的"
    tp: 514
    narrative: 26x = 5 年 trailing 平均 31.26x 換算後的 forward 值，與現況 24.96x 接近屬巧合非抄襲
  bull:
    p: 0.25
    p_basis: 需要 Copilot 席次動能延續與折舊晚於預期同時成立；前者有本季實績（20M→30M）支撐，後者未經驗證。與 bear 對稱
    key_assumption: Copilot 自 6.5% 滲透率繼續複製本季席次跳增；RPO 轉化速度優於折舊累積；年限變更貢獻高於管理層所稱的 minimal
    eps: 21.00
    exit_multiple: 31
    multiple_basis: "⚠ 口徑存疑。原依據為「近五年區間 25–35x 的中段」，但未確認該區間是 trailing 還是 forward。若為 trailing，則 31x forward 對應 trailing 約 36.6x，反而高於區間上緣 —— bull 比表面上更激進。暫維持 31x 並列入 gaps，取得歷史 forward 分位後修正"
    tp: 651
    narrative: 倍數回到近五年區間中段（25–35x），未取上緣。⚠ 該區間的 trailing/forward 口徑待確認
  weighted_tp: 512
