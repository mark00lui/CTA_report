    ｜`非 GAAP 營益率 | 60% | < | 指引不算數，以財報認列為準 | 8-K` → 重評；現況指引約 66%
    ｜`收盤價 | 383.66 (50DMA) | > 且連三個交易日維持在其上 | 盤中價不算數 | 交易所收盤價` → 重評為偏多的必要條件
