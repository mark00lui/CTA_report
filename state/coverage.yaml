      毛利率單季自 20.0% 掉到 13.8% —— 分母被壓縮。**
      **兩者的 trailing PE 都在說謊，方向相反。**
      ⚠ **而 valuation-map 只寫了一半**：原文對 trailing PE 的警告是
      「⚠ 說謊時：循環頂（低 PE 看似便宜）」。
      **建議把那一條補成雙向的：分母被膨脹（循環頂）與被壓縮（轉型谷或一次性衝擊）
      都會讓 trailing PE 說謊，低 PE 與高 PE 各是一個方向。**
      ｜⚠⚠ **而兩檔的處置也互為鏡像，這一點更值得記**：
      **8299 的檢查器要求「用峰值 EPS × 低倍數時必須並列中週期正常化版本」——
      那是 valuation-map 的原文規定。**
      **3211 的檢查器要求「用谷底 EPS × 高倍數時同樣必須並列正常化版本」——
      那是同一條紀律的鏡像，原文沒寫，但邏輯完全對稱。**
      **兩檔一起看，那條規定才是完整的。**
      ｜⚠ **兩檔另有一個共同的性質，而它與業務無關**：
      **兩檔的當期毛利率都是被一件「時間差」的事情推動的 ——
      8299 是低價庫存與現貨價的時間差（一次性的價差利益）；
      3211 是「BBU 某一機種客戶拉貨低於預期」造成的單季空窗（管理層自稱短暫）。**
      **一個被推高、一個被壓低，而兩者都不是議價能力。**
      ｜⚠ **並記下 3211 與覆蓋清單內 2308 台達電的關係**：
      **兩者在 AI 伺服器 BBU 上競爭，已明文禁用 2308 作為 3211 的估值錨。**
      **這是「清單內的標的不作為估值錨」這條通則（於 6805 收斂寫定）的第五次適用，
      也是第二次適用於直接競爭關係（前一次為 AVGO／3661）。**
  - pair: "⚠⚠ 6805 / (3324 ＋ 3017) — 同一個液冷迴路上的相鄰零件，不競爭；而處置與競爭對手相同"
