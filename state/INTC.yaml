driver_refs:
- driver: hyperscaler-capex
  direction: '+'
  note: >
    CSP 資本支出 → **資料中心 CPU 與 AI 加速器的採購**，以及 → **代工訂單**。
    一手佐證：**2026 Q2 的 Data Center & AI 部門營收年增 **59%**
    （三個部門全數成長：Client Computing & Physical AI +13%、DCAI +59%、
    Intel Foundry +31%）。**
    ⚠⚠⚠ **而本檔在本 driver 上的位置是覆蓋清單此前沒有的：它同時在三個不同的位子上。**
    **(a) 賣 CPU 給 CSP —— 與清單上賣硬體的標的同向；**
    **(b) 賣代工產能給 AI 晶片設計商（已知 Microsoft 的 18A 客製晶片、
    Amazon 的 AI fabric 晶片，以及 Broadcom 與 Nvidia 為客戶）—— 那一層是 TSM 的位子；**
    **(c) ⚠ 同時是 NVDA 在資料中心 CPU／加速器上的競爭者。**
    **三個位子的方向不同，扇出時必須分開算。**
    ⚠⚠ **實務後果最重要的一條**：**本 driver 上修對本檔的代工那一層是利多，
    但對 TSM 不必然是利空、也不必然是利多 —— 要看訂單是新增的還是轉移的。**
    **若是轉移（例如 Apple 自 TSMC 移至 Intel 18A），兩檔是零和；
    若是新增（整體晶圓需求擴大），兩檔同向。**
    **這個區分在 driver 層必須保留，不可預設其中一種。**
- driver: accelerator-roadmap
  direction: '+'
  note: >
    製程世代與封裝 → **18A 與 14A 的外部採用**。
    一手佐證：**公司重申 **14A 高量產能於 2028 年**；14A 的進度領先過去同期的舊製程；
    已辨識逾 20 個代工案（涵蓋 18A、Intel 3 與成熟製程），
    潛在生命週期價值逾 **$15B**；Apple 已收到 18A-P 的初始設計套件評估。**
    ⚠⚠⚠ **但本 driver 對本檔的傳導有一個時序必須寫死，否則會把 2027 與 2028 混為一談**：
    **Foundry 的 **2027 損益兩平**靠的是 **18A 的內部採用** ＋ 封裝 ＋ 成熟製程；**
    **真正要賺外部客戶錢的節點是 **14A**，而它要到 **2028** 才高量產。**
    **亦即「2027 損益兩平」與「代工事業成功」是兩件事，差一個製程世代。**
    ⚠ **而公司自己給了損益兩平的門檻：只需要 low- to mid-single-digit billions
    的年度外部營收 —— 對照目前單季 $293M（年化約 $1.17B），那是數倍的差距。**
- driver: ai-accelerator-demand
  direction: '+'
  note: >
    加速器出貨 → 先進製程與先進封裝的產能需求 → 代工訂單。
    ⚠ **敏感度記「中」，而且理由是占比與方向都不純**：
    **本檔的 DCAI 部門年增 59%，但 **Client Computing & Physical AI**（個人電腦）
    仍是另一大塊，其個別營收占比本輪未取得（列 gaps）。**
    ⚠⚠⚠ **而本檔對本 driver 有一個方向相反的部分，必須與 2337 旺宏那條並列著讀**：
    **本檔在資料中心 CPU 與加速器上是 NVDA 的競爭者 ——
    加速器需求若完全由 GPU 吃下，對本檔的 DCAI 是排擠。**
    **但同一筆需求若走向自研 ASIC，本檔的代工那一層反而受惠。**
    **本 driver 對本檔至少有兩個方向相反的通道，淨效果取決於架構走向而非需求總量。**
    ⚠ **這是 AVGO 那次記下的「清單內部方向相反」問題的延伸 ——
    但 AVGO 是兩檔之間方向相反，本檔是**同一檔內部**兩個通道方向相反。**
    **那是新的，而且更難處理。**

valuation_frame:
  quadrant: Q3
  quadrant_basis: >
    ⚠⚠⚠ **X 軸（當期盈餘代表性）＝ 極低，而本檔有三把尺各自給出不同的答案。**
    **TTM：營收 **$57.03B（+7.5%）**、淨利 **-$11.29B**、EPS **-$2.30**
    → **trailing PE 為 n/a**（分母為負，報價頁直接顯示不適用）。**
    **2026 Q2（2026-07-23 公布）：營收 **$16.1B**（超指引中點 $1.8B）、
    EPS **$0.42**（市場預期 $0.21）、非 GAAP 毛利率 **41.8%**（高於指引約 280bps），
    **連續第七季超預期**；Q3 指引為調整後 EPS **$0.38**、營收 **$15.8–16.8B**。**
    **→ forward PE **60.13**（⚠ 交叉檢查：Q2 的 $0.42 年化為 $1.68，
    現價 $100.32 ÷ 1.68 ＝ 59.7 倍，與 60.13 幾乎一致 ——
    亦即 forward PE 實質上就是「Q2／Q3 水準年化」）。**
    **→ EV/Sales **9.88 倍**（EV ＝ 市值 527.13 ＋ 淨負債 20.56 ＋ 非控制權益 15.60
    ＝ **$563.29B**，÷ TTM 營收 57.03）。**
    ⚠⚠⚠ **而分母之所以不具代表性，原因是部門之間互相抵銷，不只是循環位置**：
    **Foundry 部門 2026 Q2 營收 $5.8B、**營業虧損 $2.1B**、營業利益率 **-36.2%**；
    而全公司單季淨利只有約 **$2.2B**（EPS $0.42 × 5.25B 股）。**
    **亦即產品端賺的約 $4.3B，被 Foundry 吃掉一半 ——
    合併後的任何單一盈餘數字都同時描述了兩門性質相反的生意。**
    ｜⚠⚠⚠ **Y 軸（資本密集度）＝ 高，而且是本清單最明確的一次。**
    **2026 資本支出指引自 $17B **上調至超過 $20B**，
    對 TTM 營收 $57.03B ＝ **35.1%** —— 超過 15% 門檻 2.3 倍；
    **而公司明言 2027 年資本支出將顯著高於 2026，絕大多數花在美國。**
    ⚠ **折舊占營收比重未取得（列 gaps）**，但有一個更直接的比率：
    **不動產廠房設備 **$105.74B** 對 TTM 營收 $57.03B ＝ **1.85 倍**，
    且幾乎等於全部股東權益（$103.14B）。**
    **一家固定資產等於全部權益的公司，資本密集度在定義上就是高的。**
    ｜⚠⚠⚠ **結論：極低 X ＋ 高 Y ＝ Q3（資產與循環）。本輪第五檔落在 Q3。**
    **而它是「擴建型」的第四例（前三例 AAOI 128.97%、3081 217.8%、3363 87.8%），
    也是規模最大、最極端的一例 —— 它擴的不是產能，是一整個還沒有客戶的事業。**
    ⚠⚠⚠ **但本檔同時揭露了「中週期正常化」的第三種失效方式，見 methods 與 notes。**
