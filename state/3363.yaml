# 公開研究檔 — 本倉庫不含任何倉位資訊：無成本、無數量、無權重、無 Kelly、無損益、無持倉揭露。
# 未知值一律留 __ 並寫進 gaps，不要填看起來合理的數字。
#
# ⚠⚠ 建檔當下最重要的五件事，寫在最前面：
#   (1) ⚠⚠⚠ **本檔是覆蓋清單成立以來估值最極端的一檔，而兩個比率要一起看才成立**：
#       **市營比 45.92（TTM 營收僅約 17.52 億元，市值 804.58 億元），
#       而本益比是「--」—— 未揭露，因為 TTM EPS 是負的（-1.18 元）。**
#       **前一個紀錄保持者 AXTI 是市營比 35.25、本益比 1,141.03（正但趨零）；
#       本檔的分母已經穿過零。**
#   (2) ⚠⚠⚠ **capex／營收 ＝ 87.8%（15.38 億元 ÷ TTM 營收 17.52 億元），
#       年化後仍約 58.5% —— 遠超過 15% 門檻。**
#       **加上 TTM 盈餘為負 → 低 X ＋ 高 Y ＝ **Q3（資產與循環）**。**
#       ⚠⚠ **而 Q3 的兩個預設錨（PB／重置成本、中週期正常化 EPS）**
#       **有一個完全不能用（股價淨值比 14.13）、另一個沒有東西可正常化（TTM 為負）——
#       這是 3081 之後第二次，而兩次都是「擴建型 Q3」。那不是巧合，見 notes。**
#   (3) ⚠⚠ **本檔是本輪第一次為新標的加上 `cpo` 標籤 ——
#       而 cpo 這一格在此之前連續六次下降（20.0 → 15.4%，分子始終是 4）。**
#       **前五檔光互連相關新增（AXTI、AAOI、2345、3017、3081）全部拒標。**
#       **本檔標上，分子第一次自 4 變 5。**
#   (4) ⚠⚠ **本檔與覆蓋清單內的 3008 大立光同時是「循環引用」與「零和競爭」——
#       這是本清單第一次兩者同時發生在同一組標的上。** 見 notes 與 correlation_watch。
#   (5) ⚠⚠ **本檔的比值是 1.68 倍日振幅 —— 本輪第一個落在 1.21 與 2.03 之間的樣本。**
#       **那個區間此前是空的，而「2 倍」這個門檻正是在空區間裡隨手畫的。** 見 cta 註解。
