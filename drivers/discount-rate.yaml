channels:   # 兩條通道，終點相同（折現率），訊號與 falsifier 不同 —— 分開計數
  inflation:
    chain: AI capex → 原材料／記憶體／3C 價格與雇用成本 → 通膨黏性 → Fed 不降息或升息 → 無風險利率
    occurrences:
      - {date: 2026-08-31, tier: 三手, source: "投資TALK君影片經 Gemini 摘要（notes/2026-08.md 第 1 次）。可查證部分：ECI 12 個月 +3.4%（BLS）"}
      - {date: 2026-08-31, tier: 一手, source: "Warsh Jackson Hole 演說＋7 月 PCE 3.7%／核心 3.3%＋10Y 4.728%（notes/2026-08.md 第 2 次）"}
      - date: 2026-09-16
        tier: 一手
        source: >
          FOMC 聲明與記者會開場聲明。⚠ **本則沒有直接把 AI capex 與通膨連在一起** ——
          聲明說的是「Productivity growth is strong, and capital investment is robust」（成長面），
          通膨歸因是商品價格與「too many categories still posting increases above 3 percent」。
          **所以本則在通膨通道上是「利率路徑上修」的一手證據，不是「AI capex → 通膨」的一手證據。**
    status: 利率路徑上修已成事實；「AI capex → 通膨」這一節仍未被 Fed 官方明說
  crowding_out:
    chain: AI 相關企業發債與表外融資 → 與公債競爭資金 → 期限溢酬與殖利率上行 → 無風險利率
    occurrences:
      - {date: 2026-09-08, tier: 二手, source: "CMoney 對美股類股評論的轉述（notes/2026-09.md）：AI 相關企業債券大量發行與公債競爭資金。依事先門檻不晉升"}
      - date: 2026-09-16
        tier: 二手引述一手（待逐字稿確認）
        source: >
          Yahoo Finance FOMC 實錄（2026-09-16）：Warsh 於記者會問答把殖利率上行歸因於三件事 ——
          「The economy has strengthened」、「Competition for capital」（點名 AI hyperscalers
          「out in the market raising funding」）、地緣政治推升商品價格。
          ⚠⚠ **Fed 目前只發布了開場聲明的 PRELIMINARY 逐字稿（4 頁），問答段尚未發布**；
          本引述的一手確認列為 checkpoints 第一項。使用者提供的中文摘要與之一致
          （「強勁的資本支出導致資本需求增加」）。
    status: >
      ⚠⚠⚠ **事先寫定的門檻已達**：「官員談話明確把 AI 資本支出或 AI 發債列為考量」——
      發言者是 Fed 主席、場合是 FOMC 記者會。**這是本 driver 建檔的直接理由。**
      ⚠ 但 Warsh 講的是「殖利率為何上行」的歸因，不是「政策為何升息」的理由 ——
      升息的理由他講得很清楚：通膨太高太久。兩者不可混讀：**hyperscaler 募資是殖利率的解釋變數，
      不是 FOMC 的反應函數。**

market_reaction_regime:
  as_of: 2026-09-16
  tier: 推論（Yahoo Finance 實錄，二手；未取得收盤值）
  observation: >
    聲明公布（18:19 UTC）：S&P +0.3%、Nasdaq +0.7%、10Y −4bp、2Y −1bp —— 升息一碼**已被定價**。
    記者會中（20:24 UTC）：道瓊 −1.2%、S&P −0.4%、Nasdaq 持平、10Y 站回 5% 以上 ——
    **市場沒有定價的是記者會的鷹派程度**：不把升息定性為風險管理、不給前瞻指引、
    「hard-pressed to describe broad financial conditions as restrictive」。
    ⚠ 族群層（stockanalysis 收盤，判官 2026-09-17 補）：bond-proxy 的反應發生在 **09-15**（XLU −1.20%，10Y 首收 5.00），
    **FOMC 當日 XLU 0.00%、CEG −0.14%** —— 「已定價」的時間點要再往前推一天。XLU 對 SPY 09-11→09-16 全窗差 −1.18pp，對照 8 月的 −7.40pp。
  implication: >
    對本清單的判讀規則：**「升息」本身不是事件，「利率路徑」才是。**
    下一次 FOMC（2026-10-28）無 SEP，市場對「年底再升一碼」的定價會在 10-07 的會議紀要與
    9 月 PCE 之間擺盪 —— 那兩個日期比 FOMC 本身更值得看。

transmission:
  # ⚠⚠⚠ 本 driver 所有傳導對象方向皆為 −。/driver 的規則說「若你發現自己對硬體端和平台端
  #   寫出同方向的結論，先停下來確認那是真的」—— 已確認：**這是折現率通道，不是需求通道。**
  #   折現率上升對每一檔的現金流折現值都是負向，差別只在存續期（久期）與模型裡 r 的權重。
  #   需求側的方向分歧（capex 對硬體端 + 對平台端 −）住在 hyperscaler-capex，不在這裡。
  # ⚠ 傳導對象刻意只列 11 檔：估值模型裡**明確有折現率輸入**的美股 6 檔（CEG／INTU／MSFT／GOOG／META／COHR）
  #   與 Gordon 檢查器需要 r 的台股 5 檔（2308／3037／6239／8046／8299）。其餘 28 檔的折現率曝險
  #   目前不在任何模型參數裡 —— 不是免疫，是**沒有可更新的東西**；建檔時全記 L0（見 event_log）。
  # ⚠ affects 為空的條目是誠實的：那幾檔的 r 住在 valuation_frame 或 gaps（檢查器參數），不是 key_variable。
  #   validate_state 的 affects 對照只擋「指向不存在的名稱」，不擋空清單。
  - ticker: 'CEG'
    direction: '-'
    path: >
      10Y ↑ → 公用事業（市場公認的債券替代品）倍數壓縮 → 本檔對族群的 forward PE 溢價壓縮（數值只住在 state 的該 key_variable，此處不抄）。
      ⚠⚠ **本檔是覆蓋清單中唯一估值直接對標公債殖利率的標的**（state/CEG.yaml 2026-09-08 記錄：
      2026 年 8 月 XLU −4.78% 對 S&P500 +2.62%）。**溢價可能在核能稀缺性完全成立的情況下照樣壓縮 ——
      那不會使 thesis 為假，但會使它不可獲利地為真。**
      ⚠ 同時它是清單上唯一「同一筆 AI capex 既是需求順風（PPA）又是估值逆風（折現率）」的標的。
      ⚠⚠ **建檔當日的實證與「高敏感度」相反（判官 2026-09-17 逐日拆解，價格為 stockanalysis 收盤，tier 事實；歸因為推論）**：
      09-11 → 09-16 三檔 IPP 跌 5–9%，**九成集中在 09-14**（CEG −7.09%／VST −5.16%／TLN −8.38%），當天 10Y 只 +1bp、XLU 只 −1.3% ——
      那是 AI-power 族群因子（候選催化劑：09-13 前沿實驗室減速表態，見 hyperscaler-capex 09-14 event_log），不是 bond-proxy 因子。
      bond-proxy 的壓力存在但小、且在 FOMC 前一天：09-15 XLU −1.20%（10Y 首收 5.00）；**FOMC 當日 CEG −0.14%、XLU 0.00%，都優於 SPY 的 −0.44%。**
      **→ 本檔對本 driver 的彈性目前是「未量測」，對 AI-power 因子的彈性反而有實證** —— 而後者沒有任何 driver 路由（state gaps 的 datacenter-power-demand 缺口這次真的咬人了）。
    lag: 即時（估值倍數，不經財報；落在盤面）
    sensitivity: 中（⚠ 建檔初稿判高，那是斷言不是量測；實證見 path。gaps 第 4 項的迴歸關閉前不升回高）
    affects: ['對同業的forward PE溢價']
  - ticker: 'INTU'
    direction: '-'
    path: >
      10Y ↑ → 錨 C（正向 DCF）的 r ＝ 無風險利率 ＋ beta 0.98 × ERP 網格 → 目標價。
      state/INTU.yaml 現用 r ＝ 4.97%（2026-09-10）＋ 0.98 × 4.0／4.5／5.0% ＝ 8.89／9.38／9.87%。
      ⚠⚠ **rf 來源不一致（判官 2026-09-17 抓到）**：INTU 與 COHR 的 state 都寫「4.97%（10 年期美債 2026-09-10）」，
      而本檔 history 依財政部 CSV 記 09-10 ＝ 4.95、09-11 ＝ 4.96 —— 4.97 應為資料商當日值，來源不同。
      **自本檔起 rf 一律以財政部 CSV 為準**；兩檔下次重估時把 4.97 改為引用本檔，Δrf 依 CSV 為 +5～6bp 而非 +4bp。對結論零影響，但兩處各自漂移正是本檔要防的事。
