- date: 2026-09-11
  level: L2
  summary: 台股基準年修正連續作業第六檔（本檔同日第二次重估）— ⚠⚠⚠ 發現舊 base 的目標價從來沒有用到 EPS（倍數被定義為現價隱含值的固定折扣，兩者恆等）；並發現管理層的 2.5 倍產能是年底水準不是全年平均，EPS 49 → 39.24（券商中位 40.04）；加權目標價 2,219 → 1,882（-15.2%）
  delta: >
    ⚠ **本輪與同日稍早那一輪的分工**：稍早那份（L3）撤回了 capex／營收 217.8%、把訊號改為偏空、
    首次建立三情境（加權 2,219）；**本輪只做它沒有查的一件事 —— 遠期共識。
    而查完之後發現的不是基準年問題，是兩件更基本的事。**
    ｜⚠⚠⚠ **發現一（與共識無關，也是本輪最重要的）：舊 base 的目標價從來沒有用到 EPS。**
    **state 的 base.multiple_basis 開頭做了自我檢查：「先確認不是抄現價：現價隱含的 FY2027 倍數
    ＝ 2,830 ÷ 49 ＝ 57.8 倍，本項取 40 倍，是自隱含值下調 30.8%」。那個檢查問對了問題，
    但答案讓它通過了一個應該被擋下的東西。**
    **`49 × 40 ＝ 1,960` 與 `2,830 × 0.692 ＝ 1,960` 是恆等式 ——
    當倍數被定義為「現價隱含倍數的固定折扣」時，目標價就恆等於「現價的固定折扣」，
    EPS 在等式兩邊完全消去。那個 base 不是 49 × 40，它是 2,830 × 0.692。**
    **→ 這是 valuation.md 禁止的「base ＝ 現價隱含倍數」的一個更難察覺的變形：
    base ＝ 現價隱含倍數 × 固定折扣 → 目標價與價格 1:1 連動，
    模型永遠說不出「這檔明顯錯價」，它只會說「比現價低 30.8%」，而那個 30.8% 是我自己設的。**
    **⚠⚠ 而現有的循環性檢查抓不到它 —— 前者（base ＝ 隱含倍數）會落在現價 ±5% 內被抓到，
    後者距現價 30.8%，看起來像一個有內容的判斷。**
    **診斷方法：把 EPS 改掉，看目標價動不動。本輪把 EPS 自 49 改為 39.24（-19.9%），
    若倍數以「相同折扣」重算（72.1 × 0.692 ＝ 49.9x），目標價回到 1,960 —— 一動不動。**
    **處置：倍數維持 40x，讓目標價隨 EPS 一起動（1,960 → 1,570）——
    因為「維持折扣」等於承認倍數是價格的函數。⚠ 代價：40x 因此沒有任何錨，已列缺口。**
    ｜⚠⚠ **發現二：管理層的「2027 年產能 2.5 倍」是年底水準，不是全年平均。**
    **state 自己的 key_variable 就寫了理由：前端 MOCVD 新增產能「2027 Q2／下半年起貢獻」；
    券商註記亦寫「預期到 2027 年底，MOCVD 產能將較 2026 年增長超過 100%」。
    而營收由年平均產能決定。**
    **改用年平均 2.0 倍：62.4 × 2.0 ＝ 124.8 億 × 32% ÷ 1.01769 億股 ＝ **39.24**（原 49）。**
    **⚠⚠⚠ 而這獨立重現了券商共識：三家（外資 28.8／富邦 40.92／法人 40.04）的中位是 40.04，
    本輪的 39.24 差 **-2.0%** —— 時點修正是從 state 自己的 key_variable 推出來的，
    沒有用到券商的數字。**
    **⚠⚠ 而原本的 49 幾乎等於券商的 FY2028（外資 50.6）—— 模型比街上快了一年，
    與 3008（基準年停在 FY2026、慢街上一年）正好相反，而兩者成因不同：
    3008 是欄位沒滾動，本檔是把年底產能當成全年產能。**
    ⚠ **bull 同步修正**：原 180 億元營收隱含年平均 2.88 倍（等於假設 2027 全年就跑在 2028 的產能上），
    改為 2.5 倍 → EPS 67 → **58.25**，目標價 4,355 → 3,786。
    ⚠ **bear 的 1.6 倍未動** —— 它原本是「水準」論證（前端瓶頸使 2.5 倍達不到），與時點論證獨立。
    **但必須記一件對它的挑戰：最保守的券商（外資 FY2027 28.8）反推的年平均產能只有 1.47 倍，
    低於 bear 的 1.6 倍 —— 亦即 bear 不是最悲觀的情境，街上有人比它更保守。**
    ｜⚠⚠ **通道：本檔是第三種阻塞型態 —— 不是沒有，不是太薄，是過期。**
    **鉅亨 Factset 存在但嚴重過期：最新一篇 ID 6274702（約當 2025-12）為 FY2025 口徑
    （中位 4.16／高 5.05／低 3.95，11 位），目標價 **490** —— 而現價 2,830 是它的 **5.78 倍**。**
    **stockanalysis 回 HTTP 404（不覆蓋本檔）；goodinfo 回 HTTP 403（擋爬蟲）。**
    **✓ 而券商新聞通道可用且很新（三家的 FY2026–FY2028 皆有）——
    forward-estimates.md §2 把它列為「③ 用於離散度，不可當共識」，
    本檔是它升為主要來源的第一個實例（因為前兩條都不可用）。**
    **→ 台股遠期共識的三種阻塞型態現已齊備：不覆蓋（3363）、太薄（6531，2 位）、過期（本檔，9 個月）。**
    **判別「過期」的方法：拿共識目標價對現價比；差距達數倍時，該共識已不是關於這家公司的當前狀態。**
    ｜⚠⚠⚠ **與街上的分歧 100% 在倍數，而這是本輪六檔中最乾淨的一次分解**：
    **FY2027 EPS 39.24 對券商中位 40.04 僅差 -2.0%，而 base 的 40x 對它們的
    79x／90x／100x 低 49%-60% —— 目標價 1,570 對 3,680／4,000。**
    **→ 「我們與市場看法不同」在本檔不是對基本面的不同看法，是對「該付幾倍」的不同看法。
    而兩邊都沒有第一性依據，只是一邊是 40 一邊是 90。**
    ⚠ 券商的倍數是判斷值（應有倍數），依三層規則禁用為錨，此處僅記錄分歧的位置。
    ｜**評級維持偏空（三個口徑都更負：算術 -33.5%、幾何 -45.6%、base -44.5%），
    但 conviction 維持低的最強理由現在是：評級的方向取決於一個沒有錨的參數。**
    ｜⚠⚠ **並修正一個欄位語意錯誤**：`cta.updated` 原記 2026-09-11，
    而 key_ma 明寫「改以 **2026-09-10 收盤** 2,830.00 為錨」——
    **該欄位的語意是價格的日期（build_site 用它算錨齡），已改為 2026-09-10。**
    ⚠ 本輪未能取得 2026-09-11 價格（兩條通道皆失敗），已列缺口。
    ｜⚠ **全距 3,786 ÷ 601 ＝ 6.30 倍**：算術 1,882 對幾何 **1,539**（-45.6%），
    **差 22.3%，是本輪六檔中最大的**（8046 21.1%／6531 15.9%／3008 15.5%／3037 15.1%），
    因為本檔的 bear 特別低（-78.8%）。
    **但 EPS 全距 2.42 倍與倍數全距 2.60 倍相當，屬連續型不確定性，算術加權仍有意義。**
    ｜**`valuation_base_year` 首次建立為 2027（原本根本不存在）。缺口關閉 2 個、新增 5 個。**
    ⚠ **機率 0.25／0.50／0.25 為使用者指定，本輪一個字未動。**
    報告：reports/2026/09/2026-09-11-3081-revaluation-2.md
- date: 2026-09-11
  level: L3
  summary: 手動全量重估（建檔後首次）— ⚠⚠⚠ 定 L3：訊號自中性跨級為偏空，且建檔時作為 thesis 一半的 key_variable（近三季 capex／營收 217.8%）查出是口徑錯誤；另查出建檔時漏記的私募案與股票股利。首次建立三情境，加權目標價 2,219（相對 2026-09-10 收盤 2,830 為 -21.6%）
  delta: >
    ⚠⚠⚠ **本次找到三個我自己的錯，而三個都有共同的形態：我取了支持既有敘事的那一種解讀。**
    ｜**錯一：capex／營收 217.8%「本清單新紀錄」是把公告額當已支出額。**
    **原文為「聯亞在過去三季已『公告』近 60 億元的資本支出」。三個獨立證據都反對 218%：**
    **(a) 管理層明言「相關資本支出與股利發放原則上皆可由自有資金支應」且
    「仍可維持正的自由現金流」—— 與花掉營收 218% 的現金不相容；
    (b) 淨值僅 51.91 億元、總資產約 65.4 億元（由 ROE 10.52% ÷ ROA 8.36% 推得權益乘數約 1.26）
    —— 一家總資產 65 億元的公司不可能三季支出 60 億元；
    (c) 2025 年折舊僅約 3.1 億元且 2026 只是「小幅回升」。**
    ⚠⚠⚠ **而檢驗的材料我建檔時就握在手上**：**我當時寫「capex 218% 對折舊 6.14%，相差 35 倍
    → 正在蓋的資產尚未投入服務」—— 那個解釋在算術上成立，但它不是唯一的解釋，
    另一個是「capex 的口徑錯了」。我只取了支持現有敘事的那一種。**
    **規則：capex／營收 與 折舊／營收 差超過一個量級時，兩種解釋都要查；
    檢查後者最快的方法是看資產負債表的量級，不是找 capex。**
    ⚠ **處置**：**217.8% 撤回，tier 自推論降為缺口。但象限不變** ——
    **即使取保守估計（年度現金 capex 約 10–15 億元），對 TTM 營收 39.77 億元仍是 25–38%，
    遠高於 15% → Y 軸維持高，象限維持 Q3。撤回的是量級宣稱，不是象限判定。**
    ⚠ **連帶：AAOI 的 128.97% 對折舊 5.92%（21.8 倍）是同一形態，
    應於 /revalue AAOI 重查 capex 口徑。**
    ｜**錯二：建檔時漏掉私募增資案 —— 而那是 SKILL 明文要求的獨立步驟。**
    **2026-01-28 董事會決議辦理私募普通股，股數不超過 4,500,000 股（+4.42%），
    限策略性投資人，價格為市價八成；2026-05-27 股東會通過；目前尚未確定對象。**
    **SKILL 明文「公司行動掃描是獨立步驟，不得以新聞搜尋代替」——
    而建檔時我只做了新聞搜尋，因此同時漏掉這個私募案與 2026-07-15 的股票股利。**
    ⚠ **量化而不埋進假設**：**450 萬股全數發行使三情境的 EPS 與目標價各降 4.2%，
    加權自 2,219 降至約 2,126（-24.9%）。已立為新增的第五條 falsifier（門檻 300 萬股）。**
    ｜**錯三：股票股利使季 EPS 加總高估 TTM 5.7%，而這一個原因關閉了建檔時記下的全部四個歧異。**
    **2026-07-15 配現金 3 元 ＋ 股票股利 1 元（股數 +10%）。**
    **推導（用淨利反推，因為淨利不受配股影響）：Q2 淨利 ＝ 4.62 × 1.01769 ＝ 4.702 億元
    （÷ 營收 12.21 ＝ 淨利率 38.5% ✓ 與法說的 38% 一致）；
    法說 H1 EPS 7.75 × 1.01769 ＝ 7.887 億元 → Q1 淨利 3.185 億元 ÷ 3.44 ＝ 0.9259 億股
    ＝ 1.01769 ÷ 1.10 ✓✓✓ —— 除權前的季 EPS 是在 0.92517 億股上算的。**
    **直接加總 11.21，還原後 **10.61**，高估 5.7%，因而低估本益比 5.4%。**
    ⚠⚠ **建檔時記的四個歧異各自的來源因此確定**：11.56 與 11.80 都未還原（偏高）；
    **法說的 7.75 是還原後的 H1，正確**；財報狗／wantgoo 的 8.06 是未還原的季加總（偏高 4.0%）。
    ⚠⚠⚠ **規則：除權息的機械影響要分現金與股票兩種算。現金只汙染均線（< 1%）；
    股票股利汙染兩個地方 —— 均線（1 元即約 9.1%）＋ 季 EPS 加總。
    6805（純現金：均線 ≤0.60%、EPS 無誤差）與本檔（含股票：均線 ≤6.2%、EPS 誤差 5.7%）
    是對照組。後者特別危險，因為加總起來的數字看上去完全正常 ——
    唯一的檢驗方法是用淨利反推而不是用 EPS 相加。**
    ｜⚠⚠⚠ **主錨那個「比同業便宜 23%」的結論也是假的，而假在口徑不對稱。**
    **產能反推算得出來：2027 滿載營收約 156 億元（8 月營收年化 62.4 × 2.5），
    市值 2,880.06 億元 ÷ 156 ＝ 18.5× 市營比，對全新 2455 的 24.12 → 便宜 23%。**
    **但那是用本檔的 forward 比同業的 trailing。同口徑（兩邊都 trailing）：
    本檔 72.4 對 2455 的 24.12 → 本檔貴 3.00 倍。同一對標的、同一天的資料，結論反向。**
    ⚠⚠ **這是本日第三個「口徑不對稱製造假結論」的實例**
    （前兩個為 6805 的 Yahoo「淨利率」實為稅前、同業 trailing PE × 自己 forward EPS）。
    ｜⚠⚠ **同業序位只有兩個可用成員，而離散完全未被 ROE 解釋**：
