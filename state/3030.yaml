- driver: accelerator-roadmap
  direction: '+'
  note: >
    先進封裝規格世代 → 檢測與量測設備的規格門檻與客戶擴產。**領先 4–6 季。**
    本次事件（SEMICON Taiwan 2026）發表的平台鎖定的正是該 driver 記錄的封裝形態 ——
    **Chiplet、WLP、PLP、TGV、C4 Bump、Cu Pillar、TSV**。
    ⚠ **傳導強度必須明確弱於 6239，不可套用同一條 —— 這是本條最重要的註記。**
    6239 是直接服務 AMD／Broadcom 的封測廠；本檔賣的是**檢測設備**，
    客戶是 EMS／PCB／封測廠：**roadmap 定案 → 客戶決定擴產 → 設備招標 → 驗證 → 認列**，
    **中間每一環都可能把變動吸收掉**，故 lag 取 4–6 季而非 6239 的 3–4 季。
    ⚠ 且本檔的半導體應用**營收占比僅約 1 成**（主力仍是 SMT 電路板組裝檢測），
    **即使傳導成立，打到損益的比例也先被這個占比縮小一次。**
    affects：半導體與先進封裝應用占比、月營收。
    ⚠ 候選但本輪未建立的第二條：`ai-accelerator-demand`（實際出貨 → 客戶擴產 → 設備訂單）。
    未建立的理由是傳導路徑與本條高度重疊，**寧可一條說得清楚，不要兩條都含糊**。

