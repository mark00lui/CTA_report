signal:
  rating: 中性
  conviction: 低
  basis: >
    ⚠ **2026-09-01 全量重估（新方法論適用）：加權目標價 1512 維持，但相對現價
    **1,566.70**（8/31 收盤，前值 1,484.98、+5.50%）**由 +1.8% 轉為 -3.5%** ——
    **方向翻轉全部來自股價上漲，模型一個數字都沒動。**
    ⚠ **循環性檢查觸發**：base 1499 對現價為 **-4.3%**、加權為 -3.5%，都在 ±5% 內。
    依新流程 ① **先跑基準年位移測試 —— 但做不到**：FY2028 共識未取得。
    基準年殘餘度為 **1.00**（FY2027 尚未開始）故不觸發降權，
    **但位移測試無法執行，因此無法排除基準年假象**。
    ② 輸入獨立性辯護在本檔**必然失敗且早已自承**：base 的 7x 就是現價隱含值，
    `multiple_basis` 已明寫「**無獨立估值基礎**」，conviction 上限「低」。
    **本檔的 base 貼著現價不是巧合，是設計上的必然 —— 這一點從建檔起就寫著。**
    ⚠ **本輪最重要的實質新資訊：thesis 的爭點被量化了。**
    thesis 說「爭點是 NBM 長約能把價格鎖多久」。現在有數字：
    **10 份協議、8 家客戶、最低預期營收 939 億美元（以底價計）、底價約 0.29 美元／GB、
    FY2027 逾半數 bit 已被覆蓋。**
    ⚠ 底價 0.29 美元／GB **大致等於 2026 Q2 的平均售價** ——
    這代表長約鎖住的是「不再下跌」，**不是鎖住現在的高價**。
    對 bear 是實質保護（下檔有底），對 bull 則是天花板（漲價的部分沒被鎖）。
    ⚠ **同時取得一個方向相反的產業數據**：TrendForce 預估本季 NAND 漲價 **10–15%**，
    較先前的 **70–75% 大幅減速**。第四條 falsifier 的門檻是「連兩季低於 +5%」——
    10–15% **仍未觸發**，但這是它建立以來第一次出現明確的減速訊號。
    ⚠ **公司行動掃描（新步驟）抓到一件 state 完全沒有的事**：
    **本檔與鎧俠（Kioxia）宣布 2032 年前於日本共同投資逾 310 億美元。**
    這屬「重大投資」類，且方向對本檔是**兩面的** —— 產能是自己的（好），
    但同時也是產業供給增加（對循環是壞）。**它不在既有五條 falsifier 的任何一條裡。**
    ⚠ 技術面前置檢查：未發現庫藏股、除權息、處置股或指數成分調整，量價訊號未受污染。
    ｜以下為前次記錄：>
    唯一需要認真辯論的方向是偏空：加權目標價低於現價（今日十一檔中唯一），技術面在 50DMA 之下、
    距高點 -36.3%，且 thesis 的核心機制（漲價）正在減速。但五條 falsifier 沒有一條觸發、距離都不近
    （毛利率 84.6% 對門檻 65%、營收 +51% QoQ 對門檻轉負），FQ1 指引仍是 +15–20% QoQ、資料中心 +437%。
    「機制在減速」與「機制已反轉」之間差了好幾個季度，-2.8% 的模型差距對一檔剛跌 36% 的股票也在
    雜訊範圍內。也絕不是偏多 —— 右側確認完全不成立。信心低有三個具體理由：本檔 2025-02 才分拆、
    沒有獨立循環史（bear 只能借用 WD Flash 分部校準）；FY2028 共識在付費牆內而那是風險兌現的年度；
    下次財報日未公告，最快的驗證點時間未定。
  changes_if: ⚠ 2026-09-01 依新語法補列最優先兩條 —— `FY2028 共識 EPS | 有無 | 取得即執行 | 賣方預估算數 | FactSet 或財報後更新` → 位移測試才做得到、循環性判定才有意義；`NAND 合約價季增率 | +5% | < 連兩季 | 現貨價不算數，以合約價為準 | TrendForce 季度報告` → 第四條 falsifier 的機械判定式。｜收盤站回 1,624.25 並放量突破 2,354.39 → 偏多；NAND 合約價季增率連兩季低於 +5%、或 GAAP 毛利率連兩季低於 65%、或 FQ1 實際營收低於指引下緣 10.30B → 偏空；取得 FY2028 共識或公司揭露 NBM 長約營收覆蓋率 → 信心升至中

