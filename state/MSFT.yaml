signal:
  rating: 中性
  conviction: 中
  basis: >
    ⚠ **2026-09-01 全量重估：評級自「偏多」下修為「中性」，而下修的原因是股價上漲，不是基本面轉壞。**
    加權目標價 512 相對現價 **507.29**（8/31 收盤）僅 **+0.9%**。設定偏多時空間還有 +3.1%
    （現價 496.37），此後價格漲了 2.2%，空間被吃掉。
    **偏多需要「趨勢」與「空間」兩者，現在只剩趨勢。**
    自己的模型說預期報酬約等於零卻繼續標偏多，等於讓評級脫離模型 —— 那是評級失去意義的方式。
    ⚠ **循環性檢查觸發**：加權 512 與 base 514 都落在現價 ±5% 內。判定為**結論**而非產物 ——
    26x 由 5 年平均 trailing 31.26x ÷ 1.18 換算得出，推導完成後才發現與現況 25.68x 接近，
    **這個順序可查、寫在 multiple_basis 裡**。結論是「本檔目前定價大致合理」，那是判斷，不是沒有判斷。
    ⚠ **象限自 Q1 遷入 Q2**（FY2026 capex 115.9B、+79.6%，含租賃約 175B），
    但**本檔位於 Q2 的健康端**：FCF／OCF 轉換率 **36.6%** 為平台三檔最高，且為四大中
    **唯一被預期 2026 年 FCF 仍成長（+5%）**的一家。**遷入 Q2 對本檔是相對利多，不是利空。**
    ⚠ 以下為前次（2026-08-27）的記錄，除評級外仍成立：
    技術面已具備右側確認主要條件，非「基本面轉好但技術面未確認」的情形；基本面同向（Azure 由 +43% 加速至 Q1 FY27 指引 +45% cc、RPO +84% 排除 OpenAI 後仍 +25%、遠期 25.13x 位於近五年區間下緣）。信心僅中有三：加權目標價相對現價只有 +3.1% 空間（現價 496.37）；50/200 黃金交叉尚未完成；⚠ 2026-08-27 新增第三個 —— 自由現金流與本益比給出相反結論。P/FCF 55.02x 是遠期本益比 25.13x 的 2.19 倍，TTM FCF 66.99B 已較前一年下滑，而 CFO 對 FY2027 只承諾「維持為正」。評級維持偏多是因為趨勢與需求都未破壞（falsifier 全未觸發），但這個背離未被解決，故信心不升至高 —— 即使黃金交叉完成也不應直接升等，須先看到 FY2027 上半年的 FCF 走勢
  changes_if: ⚠ 2026-09-01 新增最優先的一條 —— 回到偏多需要「空間」重新出現：價格回落使加權目標價 512 的上檔重回 +5% 以上，且 50DMA 上穿 200DMA。**單有黃金交叉不足以翻多。**｜50DMA 上穿 200DMA → 信心升至高；週收盤跌破 431.10 → 中性；FY27 營益率守住但附註顯示主要由年限變更貢獻 → 中性（獲利品質問題）；Azure cc 連兩季低於 35% 且非產能因素，或跌破 349.20 → 偏空
