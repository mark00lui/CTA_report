# ⚠ COHR Coherent：清單中第一次出現「新增標的同時加深它自己的每一個因子」。
# 它帶的三個標籤全部上升，沒有一個被稀釋：
#   ai_capex_hw  54.5% → 58.3%（歷來最高）
#   optical      18.2% → 25.0%
#   cpo          18.2% → 25.0%
# 前幾次新增至少有一個方向是稀釋的（納入 3008 時 ai_capex_hw 自 60.0% 稀釋回 54.5%）。
# 這次沒有。分母變大帶來的稀釋效果，被它自己的三個標籤全部抵銷。
