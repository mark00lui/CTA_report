  **它同時是分散（一條與 AI 無關的需求）與盲點（三個 driver 沒有一個記它）。**
  ⚠ **而它對因子模型揭露了一個限制**：`factor_tags` 是**標的層級的二元標籤**，
  **表達不了「這檔有 42% 的營收不在 AI 上」**。等權因子分布數的是標的數，不是營收。
  **本檔是清單裡第一次這個限制變得重要 —— 記在 coverage 的 non_ai 那一格。**
  ｜⚠⚠ **取得中際旭創（300308）的倍數，同時關掉了 state/LITE.yaml 記的一條缺口**
  （「缺它使族群樣本完全偏向美股」）。而它帶來的對照非常尖銳：
  **本檔 P/S 15.38x 對它 16.4x —— 幾乎相同，而它淨利率 +31.3%、營收 +134.2%、
  forward PE 17.70；本檔淨利率 -9.57%、營收 +61.85%、forward PE 46.90。**
  ⚠ **但這個對照有四個限制（市場 regime、會計口徑、規模差 11 倍、本檔混合毛利率被 CATV 拉低），
  在分部別毛利率補上之前，它是序位的輸入，不是結論。**
  **把它當武器很容易，當尺才有用。**
  ｜⚠ **共用錨風險**：Fabrinet（FN）已是 COHR 的錨之一，現在也進了本檔的同業。
  **FN 不在覆蓋清單內，所以不構成 LITE／COHR 那種循環引用；
  但它同時錨住兩檔覆蓋標的 —— 我對 FN 的判讀若有偏差，COHR 與本檔會同向偏。**
  **這是「共用錨」，與循環引用不同科但同源，兩者都該記在 correlation_watch。**
  ｜⚠ **本檔刻意不標 `cpo`** —— 產能目標明寫為 800G 與 1.6T 可插拔產品。
  **這是連續第二檔新增光通訊曝險卻不加深 cpo 前提依賴的標的（前一檔為 AXTI）。**
  ⚠ **但不要因此以為它對規格路線免疫**：它在「1.6T 何時放量」上高度敏感，
  **只是在「CPO 對可插拔誰贏」上中性。兩者不是同一件事。**
  ｜⚠ **技術面第一次可判定，這個進展值得記**：
  **LITE 完全沒有均線；AXTI 的均線距現價 -33.6%／-74.2%（無法作為失效價位）；
  本檔 50DMA 距 +8.5%、200DMA 距 -5.5%，兩條都在可用範圍，invalidation 首次填得出數字（101.96）。**
  ⚠ **但 beta 3.78 是本清單最高** ——
  **「均線可用」是說它在合理距離內，不是說它不會被雜訊穿透。這兩件事不可混為一談。**

event_log:
- date: 2026-09-10
  level: L2
  summary: 新增追蹤標的 —— 清單第一檔以資本支出擴建（而非商品循環）進入 Q3 象限；42% 營收為 CATV
  delta: >
    建檔。判 **Q3（資產與循環）**。
    X 軸低且比 AXTI 更徹底：**EPS TTM -0.79、trailing PE n/a —— 分母不是趨零，是為負**；
    **營業利益從未為正**（FY2023 -41.35／FY2024 -70.91／FY2025 -54.60／TTM -67.41），
    ⚠⚠ **且是在營收自 217.65 增至 595.97（+173.8%）的同時自 -41.35 擴大到 -67.41。**
    Y 軸高且不是略高：**capex／營收 TTM = 768.64 ÷ 595.97 = 128.97%，是 15% 門檻的 8.6 倍**
    （門檻在 FY2024 的 20.13% 跨過，之後逐年加速）；
    ⚠⚠ **對照 D&A／營收僅 5.92% —— 這個落差本身就是結論：正在蓋的資產尚未投入服務、
    尚未開始折舊，它開始折舊的那一天損益表會有一次階梯式衝擊。**
    FCF TTM **-9.0045 億**、OCF **-1.3182 億**（營運本身就在燒錢）；
    淨現金 +1.996 億，**但那是募資的快照不是獲利能力的快照 —— TTM 發行新股 13.51 億美元。**
    ｜⚠⚠ **本檔是清單第一檔以擴建而非循環進入 Q3 的標的** ——
    valuation-map 的 Q3 名單全部帶 `cyclical` 標籤，本檔沒有。
    **這是對地圖本身的發現，應回填 references。**
    ｜⚠⚠ **42% 的營收是 CATV（Q2：資料中心 107.7／CATV 80.6／電信 3.4），與 AI 無關。**
    **因此主錨必須是分部別 EV/Sales（SOTP）—— 這不是精緻化，不做就是用 AI 倍數買有線電視設備。**
    方法組合跨**三軸**：分母（營收對帳面資產）、層級（分部／企業／每股三層）、
    參照（同業全部自清單外取，且**刻意兩邊各取**：Innolight 對資料中心、HLIT 對 CATV）。
    ⚠ **副錨用 PB 時直接引用 valuation-map 的警告「在建工程已進分母卻未貢獻獲利時被高估
    （6239 即是）」—— 本檔是那個情況的極端版。**
    ｜⚠⚠ **取得中際旭創（300308）倍數，關掉了 LITE 檔記的一條缺口（族群樣本全偏美股）。**
    對照尖銳：**本檔 P/S 15.38x 對它 16.4x 幾乎相同，而它淨利率 +31.3%、營收 +134.2%、
    forward PE 17.70；本檔淨利率 -9.57%、營收 +61.85%、forward PE 46.90。**
    ⚠ **但已同時寫下該對照的四個限制**（市場 regime／會計口徑／規模差 11 倍／
    本檔混合毛利率被 CATV 拉低）——**在分部別毛利率補上之前它是序位輸入，不是結論。**
    ｜三情境**刻意不建立**：主錨的關鍵輸入缺 **分部別毛利率**（只有混合的 29.8%），
    且 FY2027 共識營收未取得。
    ｜評級**中性／信心低**。⚠⚠ **但技術面的理由與前兩檔不同，這個差別必須寫清楚**：
    **LITE 與 AXTI 是「無法判定」；本檔是「判定了，結果是未確認」——價格在 50DMA 之下 7.9%。**
    **50DMA 117.15 距現價 +8.5%、200DMA 101.96 距 -5.5%，兩條都在可用範圍，
    invalidation 首次填得出數字（101.96），confirm_trigger 也第一次寫得出具體價格。**
    ⚠ **但 beta 3.78 是本清單最高 ——「均線可用」不等於「均線可靠」。**
    ｜錨寬度 **101.8%**（109–220，6 位），本清單第二寬；
    ⚠ 與 AXTI 不同的是**低標比現價高 0.99%，六位分析師的目標價全部在現價之上**。
    ｜四條 falsifier。第一條（Q3 營收低於指引下緣 2.55 億）在 6 個月內可驗證且門檻取自公司自己的話。
    ⚠⚠ **第二條刻意用 GAAP 營業利益而非非 GAAP**：非 GAAP 已於 Q2 轉正（+550 萬），
    **若用非 GAAP，這條 falsifier 一出生就已被「否證」，那不是檢驗是自我恭維。**
    ⚠ **第三條的 15% 門檻也有理由**：公司自己的 Q3 EPS 指引已用 9,280 萬股（+9.3%），
    **10% 的門檻會被公司的指引自動滿足，測不到任何東西。**
    ⚠ **第四條刻意與 AI 需求無關**（CATV 分部年減 20%）——
    **CEG 那一輪教會的事是：一檔標的若只有一條失效模式，通常是我只找到一條。**
    ｜⚠ **本檔刻意不標 `china_ops`**：與 AXTI（產能 100% 在中國）不同，本檔是多基地
    （德州糖城／中國寧波／台灣），**分佈未取得，在不知道比例前標上去會誇大 ——
    誇大與遺漏一樣會讓因子分析說謊。** 已列 gaps。

