key_variables:
- name: AI相關營收占比
  value: >
    約 40%（2026Q1 相關營收占比）。⚠ **但這個數字有一個未解決的口徑衝突，不可直接使用**：
    同一場法說的兩份二手轉述給出不同數字 —— CMoney 記「第一季相關營收佔比就已經衝上約四成」
    且定義為「AI 相關業務（含伺服器電源與液冷）」；豐雲學堂標題則記「AI 營收占比估逾 25%」。
    **兩者可能是不同定義（廣義 AI 相關 vs 資料中心電源）或不同期間（單季實績 vs 全年估計）**，
    本輪未能回溯法說原文釐清。另有法人估全年占比有機會突破五成（**預估，非公司揭露**）。
  unit: '%'
  tier: 推論
  source: >
    ⚠ **兩份皆為媒體對 2026-07-30 法說的二手轉述，無一為公司原始揭露** ——
    依來源階層屬第 5 順位（媒體轉述），**不得單獨支撐 L2 以上的模型變動**。
    CMoney 2026 Q2 財報法說報導；豐雲學堂 2026-08 法說報導（該頁本輪回訪為 404）。
    2026-09-10 取得。
  updated: 2026-09-10
- name: 營益率
  value: 16.70（2026Q2）；15.15（FY2025）；11.33（FY2024）
  unit: '%'
  tier: 推論
  source: >
    FY2024／FY2025 為 S&P Global Market Intelligence 經 stockanalysis 提供（**事實**）：
    FY25 營業利益 84,042／營收 554,885 = 15.15%；FY24 47,734／421,148 = 11.33%。
    ⚠ 2026Q2 的 16.70% 為**本檔自行計算**（媒體轉述之營業利益 306 億元 ÷ 營收 1,832.56 億元），
    分子來自二手來源，故整格標推論而非事實。毛利率 2026Q2 為 35.64%（QoQ -1.36pp、YoY +0.13pp）。
  updated: 2026-09-10
- name: 800VDC量產時程與生態地位
  value: >
    ±400V 架構 **2026 年量產出貨**；800VDC **2027 年第二季開始放量**。
    ⚠ 本檔為 **NVIDIA 明確點名的 800VDC 電源系統元件夥伴**之一
    （另含 Flex Power、Lead Wealth、光寶科 LiteOn、Megmeet）。
  unit: 質性（時程）
  tier: 推論
  source: >
    ⚠ **本格混了兩個證據層級，取較低者標 tier**：
    **生態名單為 NVIDIA 官方揭露（事實）**，住在 drivers/accelerator-roadmap 的
    power_architecture，本檔不複製；
    **但量產時程（±400V 2026、800V 2027Q2）為 2026-07-30 法說之媒體二手轉述（推論）**，
    而時程才是本格 load-bearing 的部分 —— 故整格標推論。2026-09-10 取得。
    ⚠ NVIDIA 明載 800 VDC 資料中心的全面量產與 Kyber 機櫃（600kW／櫃）同步落在 2027，
    **與本檔所稱的 2027Q2 放量在時點上一致** —— 這是兩個獨立來源的相互印證。
  updated: 2026-09-10
- name: 單櫃電源價值量
  value: __
  unit: 新台幣元／櫃 或 美元／kW
  tier: 缺口
  source: >
    ⚠ **無公開揭露，而它正是 thesis 的核心量。** thesis 主張重評價來自「單櫃價值量與營益率
    跳升」，其中營益率可觀測、**價值量目前不可觀測** —— 這是本檔最大的結構空白。
    ⚠ 與 state/3324.yaml 的 `單機液冷價值量` 是**同構的缺口**：兩檔都靠「單機價值量跳升」
    支撐論點，兩檔都拿不到那個數字。
  updated: __
- name: 非AI業務營收成長
  value: __
  unit: '% YoY'
  tier: 缺口
  source: >
    ⚠ **分部別營收與營益率未取得**，僅知基礎建設部門單季獲利年增約 170%（二手轉述）。
    **這一格是主錨（選擇權拆分）的直接輸入** —— 沒有成熟本體的營收與利潤率，
    就無法把本體以成熟倍數計價、反推市場為 AI 那塊付了幾倍。
    ⚠ 這與 coverage.yaml 對 AVGO 記的「選擇權拆分只完成一半：分部別營益率未取得」是同一個洞。
  updated: __
- name: 產品品質事件（VR 18.4kW PSU 電容器）
  value: >
    2026-09-02 傳出台達致客戶信函，指 **VR 18.4 kW 電源供應器**特定批次所用的某些電容器
    「在未施加電壓的情況下長期存放後，可能出現漏電流增大」，進而導致
    「電容器電壓不平衡、過熱，並可能在後續上電過程中引發電容器故障」。
    公司回應：不評論市場傳聞，若供應商零組件出現問題「會盡力協助客戶安排換貨，
    確保客戶需求不受影響，營運亦不受任何影響」。當日股價 **-135 元（-7.24%）收 1,730 元**。
    業界評估為更換電容器供應商即可解決。
    ⚠ **無正式召回、賠償或客戶名單揭露。**
  unit: 質性
  tier: 推論
  source: >
    今周刊 2026-09-02 報導，2026-09-10 取得。
    ⚠ **公司未確認信函存在**（僅稱「不評論市場傳聞」），故即使公司有回應，本格仍為推論而非事實。
    ⚠ **未取得該信函原文，亦未取得任何公開資訊觀測站重大訊息** —— 屬單一二手來源。
    ⚠ **列為 key_variable 而非新聞的理由**：本檔 thesis 建立在「留在 NVIDIA 生態名單內」，
    而品質事件正是那個地位最直接的失效路徑。它可能無足輕重（業界說換料即可），
    也可能不是 —— **現在無法分辨，所以它是變數不是結論。**
  updated: 2026-09-10

