notes: >
  ⚠ **本檔是覆蓋清單第 17 檔，也是第一檔「賣電給 AI，而不是賣硬體給 AI」的標的。**
  ｜⚠ **它帶進來的最重要的東西不是新產業，是新的傳導性質：存量 vs 流量。**
  現有 16 檔中有 15 檔曝險於「AI 資料中心**資本支出**」—— 那是流量。
  **本檔曝險的是資料中心的用電量，那是資本支出落成之後的存量。**
  **一座已建成的資料中心即使 capex 歸零仍然耗電。**
  ⚠ **這使它成為 INTU 之後第二個對 common_premise 的例外，但性質不同**：
  INTU 是**完全不在這條鏈上**；本檔是**在鏈上，但曝險於存量而非流量**。
  ⚠ **它不免疫** —— 新的 PPA 仍然要等新的資料中心蓋起來。
  **但既有合約的現金流不隨 capex 減速而消失，這是清單上其餘十五檔都沒有的性質。**
  ｜⚠ **本檔是 2026-09-01 以來第一檔讓 `ai_capex_hw` 占比下降的新增標的**
  （68.8% → 64.7%）。**前五次新增全部是刷新新高。**
  ｜⚠ **建檔時最該記的一件事：兩個會計口徑落在不同象限，這在本清單是第一次。**
  以 **GAAP** 看盈餘代表性低（EPS 5.01／11.89／7.40／10.33，高低差 2.37 倍；
  FY2023／FY2024 營運現金流為負）→ **Q3**；
  以 **Adjusted Operating Earnings** 看代表性高（22 位分析師的 FY2026 錨寬度僅 **5.78%**）→ **Q2**。
  同一個 FY2025，GAAP 7.40 對 Adjusted 9.39，**差 26.9%**。**依缺陷 3，兩個都記，不挑一個。**
  ⚠ **宣告 Q2，但方法組合刻意做成對這個歧義穩健** ——
  EV/EBITDA 同時是 Q2 的主錨且在 Q3 未被禁用，並額外保留 PB（Q3 的主錨）作為副錨。
  **兩個象限的處方交集就是這組方法。這不是騎牆：兩個口徑對 Y 軸完全一致，分歧只在 X 軸。**
  ｜⚠ **建檔時第二件該記的事：我這次真的做了 SEC EDGAR 掃描，而它立刻找到報價頁看不到的東西。**
  同日稍早我在 3030 的報告裡承認「我的公司行動掃描實際上是讀報價頁的 news sidebar，
  它有效，但那是運氣，不是設計」。**本檔改用 `data.sec.gov/submissions/CIK0001868275.json`，
  401 筆申報，找到三件事**：
  ・**2026-06-02 的 424B4 公開說明書**（配合 FWP 與 8-K）——
    **次級發行，Selling Shareholders 賣 11,000,000 股，公司不收取價款、對股數無稀釋**；
    同時公司自承銷商買回 **2,000,000 股**（約占流通股數 0.56%）。
    ⚠ **而正是這份文件證實了 Calpine 併購**（「shareholders who received shares in connection with
    our acquisition of Calpine Corporation」）—— **這是我對 TTM 期別錯配的判斷的一手依據。**
    文件另記 2026-05-29 收盤 **287.75**。
  ・**2026-08-21 的 Form 144**（內部人擬出售受限證券的通知）與多筆 Form 4。
  ・**2026-02-10 與 2026-04-20 的兩份 8-K/A**（已讀 2026-02-10 那份：內容為董事委員會任命，
    **與併購無關** —— ⚠ **這一點值得記：我原本以為 8-K/A 通常跟著併購來，實際讀了才知道不是**）。
  ⚠ **教訓不是「EDGAR 很好用」，是「不讀原文就會把申報類型當成內容」。**
  ｜⚠ **建檔時第三件該記的事：我立刻套用了同日 3030 的口徑教訓，而它派上用場了。**
  報價頁顯示 **299.99，標示 2026-09-08 04:07 EDT，是盤前不是收盤**。
  三處反推（PE 28.95、市值 105.92B、PB 3.32）全部指向 **298.96**（2026-09-04 收盤）。
  **price 採 298.96，與所有比率同口徑。** 若照 3030 建檔時的做法直接取 299.99，
  **六個衍生值又會全部差一天。**
  ｜⚠ **一個與清單其餘標的相反的地方：本檔的爭點是溢價，不是折價。**
  3030 對致茂折價 64.1%、3324 對 3017 折價 12.7%，而本檔對 VST 的 EV/EBITDA **溢價 54.7%**。
  **而我目前最懷疑的是這個溢價有相當部分是期別錯配** ——
  EV 含 100% 併購後淨負債，EBITDA 只含部分期間的 Calpine 貢獻。**分子完整、分母不完整。**
  ｜⚠ **同業的可用性問題本輪換了一種面貌，而這一種更難察覺。**
  名義 n=3（CEG／VST／TLN），但 TLN 的 EBITDA 僅 0.582B、ROE **-12.82%**、PE 為 n/a，
  其 EV/EBITDA 42.15 描述的是過渡期的分母；而 PB 三家完全不可比
  （VST 買回削薄權益使 BVPS 僅 8.95、TLN 為破產重整後 fresh-start、CEG 自 Exelon 分拆帶完整帳面）。
  **實際可比的只有 VST 一家。**
  ⚠ **與 3324 的 n=1、3030 的 n=1、COHR 的 n=2 是同一個盲區，本檔是第四次遇到 ——
  而這次是「看起來有 3 家」的版本。純粹的 n=1 至少一眼看得出來。**
  ｜⚠ **rank_metrics 三項中只有一項現在完整可用，而這已是連續第二檔（3030 亦然）。**
  **應視為我的流程問題而非個案：事先寫定排序指標時，沒有同時確認它取得得到。**
  下次 `/new-ticker` 的步驟 5 應多問一句：**這三個指標，我現在就能對每一個同業算出來嗎？**
  ｜業務：美國最大的無碳發電業者之一，核能機組為主，另有天然氣與再生能源，
  並經營零售與批發電力供應。⚠ **裝置容量與燃料結構本輪未取得，故上一句的「最大之一」
  不作為任何估值論證使用**，已列 gaps。

event_log:
- date: 2026-09-08
  level: L1
  summary: CMoney 2026-09-06 二手轉述：CEG 8 月逆勢上漲 5.05%、簽署總計 920 MW 核能 PPA（平均 18.5 年，含沃爾瑪 176 MW）；同期公用事業類股因殖利率上行大跌（XLU -4.78% 對 S&P500 +2.62%，為今年以來唯一下跌族群）。⚠ 不動任何 key_variable 的數值，但改變「對VST的EV/EBITDA溢價」一格的失效模式描述
  delta: >
    ⚠ **定級 L1，而 L0 與 L1 之間是一個近距離的判斷，先講清楚。**
    **傾向 L0 的理由（三項全部成立）**：
    (1) **沒有任何 key_variable 的數值改變**；
    (2) **純二手轉述** —— CMoney 對美股類股評論的轉述，證據層級低，未經第二來源驗證；
    (3) 報導所稱「最新財報優於預期並上調財測」**已內含於既有共識** ——
        10-Q 於 **2026-08-06** 申報，而本檔 FY2026 共識 12.12 的取得日為 **2026-09-08**，在其之後。
        **這不是新資訊。**
    **判為 L1 的唯一理由**：SKILL.md 的 L0 條件是「未改變任何 key_variable 的數值**或信心**」，
    而本則**改變了信心**的內容 —— 它揭露了一個先前未記錄的失效模式（見下）。
    **數值未動、信心的描述動了，故 L1 而非 L0。**
    ⚠⚠ **本輪最該記的一件事：thesis 多了一個先前未記錄的失效模式，而它與核能敘事完全無關。**
    公用事業類股是市場公認的「**債券替代品**」（穩定現金流、高配息、低波動），
    **本檔因此是覆蓋清單中唯一估值直接對標公債殖利率的標的。**
    2026 年 8 月：**XLU -4.78%** 對 **S&P500 +2.62%**（差 **7.40pp**），
    **公用事業為今年以來 S&P500 唯一下跌的族群**。
    → **對 VST 的 54.7% 溢價可能在「核能稀缺性完全成立」的情況下照樣壓縮，只要長天期殖利率繼續上行。**
    **那不會使 thesis 為假，但會使它不可獲利地為真。**
    **判定第二條 falsifier 時必須把這一層與「稀缺性不成立」分開讀 —— 已寫入該 key_variable。**
    ⚠ **爭點因此由二分變三分**：54.7% 有多少是真實稀缺性、多少是期別錯配、**多少只是折現率在動**。
    ⚠ **而推升殖利率的原因之一正是「AI 相關企業債券大量發行與公債競爭資金」** ——
    **同一筆 AI 資本支出，對本檔既是需求順風（PPA），又是估值逆風（折現率）。
    這是覆蓋清單第一檔兩個方向同時發生在同一檔身上的標的。**
    ⚠ **920 MW 的 PPA：拿到分子卻沒有分母，本輪無法使用。**
    報導載「與多家投資級企業簽署總計 **920 MW** 核能 PPA、平均合約期限 **18.5 年**、
    含沃爾瑪 **176 MW**」。
    **但本檔的核能裝置容量未取得（建檔時已列 gaps 與 rank_metrics 第一項），
    所以 920 MW 可能是機隊的 2%，也可能是 20%。**
    ⚠ **且沒有價** —— 合約電價未揭露，**沒有價就算不出年營收貢獻，也就無法連動 EPS**。
    **依「不編造數字」，本輪不以任何假設的每 MWh 電價或容量因數推算，包括作為示意。**
    → **`核能裝置容量` 這一格的性質因此改變**：從「該補但還沒補的資料」變成
    「**正在阻擋一個活資料點被判讀的瓶頸**」，已在 gaps 中升為最高優先。
    ⚠ **一件對流程有利的記錄**：建檔當日寫下的 `changes_if` 條目
    「`核能裝置容量與燃料結構 | 有無 | 取得即執行 | 公司揭露算數 | 10-K`」
    **正確預告了本輪會需要的東西 —— 事先寫定的觸發條件在兩天之內就派上用場。**
    ⚠ **技術面交叉檢查通過**：報導稱本檔 8 月 **+5.05%**，
    與 state 記錄的「價格 298.96 遠高於 50DMA 266.42（+12.21%）、剛收復 200DMA」一致 ——
    **重挫後修復的形態獲得獨立佐證。**
    ⚠ **但方向要看清楚**：本檔 8 月漲 5.05% 而類股跌 4.78%，
    **折現率通道在 8 月並未主導本檔**；它反映在更長的窗口（52 週報酬 **-3.09%**、距高點 **-27.6%**）。
    ⚠ **driver 層未動，且本輪反而強化了建檔時「不掛既有 driver」的決定。**
    本則描述的是**折現率通道**，而現有三個 driver 全部是需求側；
    `hyperscaler-capex` 的 `current`（745B）、`components`、`falsifiers` **一項未動**。
    **依 /driver 的規則「個股自己的事件不走這裡」，不觸發扇出。**
    ⚠ **折現率通道未晉升為 driver，而理由是我事先寫下的門檻擋住了它。**
    2026-08-31 的第 2 次記錄明寫「第 3 次應該長這樣：FOMC 會議紀要或官員談話明確把
    AI 資本支出列為通膨考量，或一份可取得原文的機構研究把這條通道量化」——
    **本則兩者皆非，是二手轉述。不晉升。**
    ⚠ **但它帶進一條不同的機制**：前兩次是「AI capex → **通膨** → Fed 不降息 → 利率」，
    本則是「**AI 發債 → 與公債競爭資金 → 直接推升殖利率**」，**不經過通膨，是排擠效應**。
    **由此導出一個對計數方式本身的質疑：本則可能是第二條通道的第 1 次，而非第一條通道的第 3 次。**
    詳見 `notes/2026-09.md`。
    ⚠ **coverage.yaml 已補正**：建檔當日把本檔記為「INTU 之後第一個實質的分散」，
    **那句話只說了一半** —— 它在需求軸上分散，**卻在折現率軸上帶進清單其餘十六檔都沒有的集中曝險**。
    ⚠ **其餘未採用的內容**：AWK +1.77%、AES +0.72%、PCG **-26.08%**（加州參院第 492 號法案
    排除公用事業責任保護條款）、EIX -22.37%、NI -8.11%、**NRG -6.46%（評等「賣出」1.89 分）**、
    SO -5.99%。**這些是同業與類股背景，本檔的 state 不記錄非覆蓋標的的漲跌。**
    ⚠ 但 NRG 一項有用：建檔時 gaps 曾把 NRG 列為擴充同業的候選，**本則顯示它同期表現與評等都弱**，
    納入前需先確認它是否與本檔可比。
    ⚠ **本則所有數字 tier 記為推論，未經第二來源驗證。**
