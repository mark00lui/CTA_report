# 共用驅動因子。這一層存放「多檔標的共用、且不屬於任何單一標的」的變數。
# 規則：一個共用事實只能有一個家。個股 state 用 driver_refs 引用，不複製數值。
id: discount-rate
name: 折現率（美國政策利率與公債殖利率）
what_it_is: >
  美國聯邦資金目標區間、FOMC 中位數利率路徑（SEP）、美債 2Y／10Y／30Y 殖利率，
  以及台幣 10 年期公債殖利率 —— 即覆蓋清單所有估值模型裡「無風險利率」那一項的唯一的家。
why_shared: >
  現有三個 driver（hyperscaler-capex／ai-accelerator-demand／accelerator-roadmap）**全部是需求側**：
  capex → 零組件。沒有一個捕捉「AI capex 本身推升利率 → 折現率上升 → 打到清單每一檔」這條通道。
  ⚠⚠ **它的方向與需求側相反**：同一筆 AI 資本支出，對硬體端是需求利多，對所有標的的折現率是利空。
  這也是為什麼它該獨立成一個 driver 而不是塞進 hyperscaler-capex。
  ⚠ 2026-09-12 起美債 10Y 與台債 10Y 暫置於 state/coverage.yaml 的 shared_macro_inputs，
  並標記為「待遷移」—— 本檔建立後兩個數值遷入此處，coverage.yaml 只留指標。

# ⚠⚠⚠ 建檔理由：notes/README.md 的晉升規則「同一主題出現 3 次以上 → 建 driver」，
#   而 notes 在 2026-08-31 與 2026-09-08 兩度**事先寫定**第 3 次該長什麼樣：
#   「FOMC 會議紀要或官員談話明確把 AI 資本支出或 AI 發債列為政策考量」。
#   2026-09-16 FOMC 記者會，Fed 主席 Warsh 把殖利率上行歸因於三件事，第二件是
#   「資本競爭 —— AI hyperscalers 在市場上募資」。發言者是 Fed 主席、場合是 FOMC 記者會，
#   **門檻達到，且達到的方式正是事先寫定的那一種。** 見 channels 與 event_log。
#
# ⚠ 2026-09-08 的計數疑慮（通膨通道與排擠通道是一件事還是兩件事）在此定案：
#   **一個 driver、兩條 channel、分開計數。** 兩條通道的終點相同（折現率），
#   但可觀測訊號不同（PCE／SEP 對 投資級發行量／期限溢酬），falsifier 也不同。

current:
  value: 5.01
  unit: '%（美國 10 年期公債殖利率，收盤）'
  as_of: 2026-09-16
  tier: 事實
  basis: >
    以 10Y 為 current 的理由：它是覆蓋清單裡實際被代進估值模型的那一項
    （INTU／COHR 的 CAPM、MSFT 的 reverse-DCF 對照、CEG 的債券替代品倍數），
    政策利率只透過它傳導。政策利率與 SEP 路徑列在 components。
  source: >
    美國財政部每日殖利率曲線 CSV（home.treasury.gov，daily_treasury_yield_curve，2026-09-17 取得）。
    2026-09-16：2Y 4.74／10Y 5.01／30Y 5.35。⚠ 10Y 於 2026-09-15 首度收在 5.00，09-16 收 5.01 ——
    是本倉庫記錄期間（2026-08-28 起）第一次站上 5%。
  note: >
    ⚠ 本則事件對 current 的直接影響很小：10Y 自 2026-09-11 的 4.96 到 09-16 的 5.01，**+5bp**。
    真正的資訊在 components 的政策路徑（SEP 中位數 2026 年底 3.8 → 4.1、2027 年底 3.6 → 4.1）
    與 channels 的「Fed 主席點名 hyperscaler 募資」—— 前者改變的是**未來一年的利率水準假設**，
    後者改變的是**這條通道的證據等級**。看 current 的 +5bp 會低估本則。

