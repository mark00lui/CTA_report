# 公開研究檔 — 本倉庫不含任何倉位資訊：無成本、無數量、無權重、無 Kelly、無損益、無持倉揭露。
# 未知值一律留 __ 並寫進 gaps，不要填看起來合理的數字。
#
# ⚠⚠ 建檔當下最重要的四件事，寫在最前面：
#   (1) ⚠⚠ **本檔的客戶有三類，而三類都在覆蓋清單內**：法說自述「前三大客戶集中於半導體
#       先進封裝領域，涵蓋**晶圓代工、封測代工及 HBM** 客戶」——
#       **對應到 TSM、6239、以及 MU／SNDK。這是本清單第一檔「賣設備給清單裡三個不同層」的標的。**
#   (2) ⚠⚠ **Q1 到 Q2 的淨利率掉了 10.6 個百分點，而同期營收還季增 8.1%**：
#       **Q1 淨利率約 29.5% → Q2 約 18.9%（H1 約 24.0%）；Q2 EPS 季減 31% 卻是在營收上升時發生的。**
#       **這就是 thesis。而管理層給的答案（3D 設備毛利率高出 2.5D 許多）要到 2027–2028 才顯著。**
#   (3) ⚠⚠ **月營收兩年都不規則，而且連累計年增率都不是單調的** ——
#       **這是「先看去年那條線的形狀」這個判準的第四種情況，也是最嚴重的一種：
#       月營收與累計都沒有訊號，只有季度有。** 第一條 falsifier 因此用季度營收。
#   (4) ⚠ **本檔的季線距現價 +11.28%，而當日振幅就有 9.30% —— 比值僅 1.21 倍。**
#       **與昨日 3211 的 1.18 倍幾乎相同。兩個樣本都落在這個比值附近，
#       說明那條雙邊規則的「太近」門檻應該用比值表達，而 1.2 倍很可能仍然太緊。**
