driver_refs:
- driver: discount-rate
  direction: '-'
  note: >
    折現率通道，方向 −。本檔模型裡沒有任何參數是 r（倍數由錨 A／錨 B／SOTP 決定），曝險目前不可量化 —— 不是免疫。driver 記了一個不複製數值的檢查器（盈餘殖利率對 10Y 利差：base 20x → 約 0；現價隱含 24.85x → 低於 10Y 約 1pp），待 /cta 決定是否採用。本檔同時是排擠通道的來源之一（Q2 發債 20.3B）。2026-09-17 建立。
    ⚠ **2026-09-18 決定：採用為追蹤指標，不採用進三情境。** 以現價 343.68 重算（10Y 仍為 driver 的
    current 5.01，as of 2026-09-16，未變）：bear 18x → 盈餘殖利率 5.56%，利差 **+0.55pp**；
    base 20x → 5.00%，利差 **−0.01pp**（≈0，倍數本身未動，利差幾乎不變）；
    現價隱含 25.46x → 3.93%，利差 **−1.08pp**（較 09-10 記錄的 −1pp 略深，純因價格上漲，非模型改變）；
    bull 30x → 3.33%，利差 **−1.68pp**。**不改任何情境機率、EPS 或倍數** —— 純粹是把
    「base 倍數在 5% 的 10Y 下約等於零股權溢酬」變成一個每次覆核都能重算的量，
    利差顯著轉正（例如 bear 端的 +0.55pp 大幅擴大）才需要重新評估這條通道是否該對倍數施壓。
- driver: hyperscaler-capex
  direction: '-'
  note: >
    capex → 折舊費用 → 營益率；另受市場對 ROI 耐心的情緒放大。落後 2–4 季。
    Alphabet 的曆年 capex 成分住在該 driver，不在本檔複製 —— 這也是 資本支出 移出 key_variables 的原因。
    ✅ 2026-09-09 結案：前記「該 driver 的 GOOG affects 仍含『資本支出』待修正」**已不成立** ——
    該 driver 早在 2026-08-27 就已改為 [Cloud成長率]，是本檔的註記過時了。本次一併移除。
    ⚠ 2026-09-09 新增：該 driver 的 GOOG affects 已擴充為 [Cloud成長率, TPU外部採用進展]，
    因其 deployment_friction 區塊（Project Braid 廠址延誤）觸及的是 TPU 外售的交付載具，
    而非 Cloud 的成長率數值。
    ⚠ **方向判定須分兩條通道，不可合併**（見 2026-09-09 變更單）：capex **遞延**對「折舊」通道
    一般是利多，**但 Project Braid 的建置成本走 Blackstone 帳、本就不在 Alphabet 帳上，該通道不適用**；
    本則的活通道是「Cloud／TPU 產能」那一條，方向為負。
- driver: ai-accelerator-demand
  direction: '-'
  note: >
    加速器採購 → 資產啟用 → 折舊 → 營益率。落後 2–4 季，sensitivity 中 ——
    自研 TPU 比重高使外購加速器的傳導強度低於同業，但 TPU 出貨量正是該 driver 的缺口，
    等於這條傳導目前無法量化。
