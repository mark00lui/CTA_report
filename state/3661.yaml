driver_refs:
- driver: ai-accelerator-demand
  direction: '+'
  note: >
    加速器實際出貨 → 客製 ASIC 的量產（MP）營收。
    ⚠⚠ **本檔是本清單裡對本 driver 傳導最「顆粒可見」的一檔** ——
    **北美超大型 CSP 客戶的 3 奈米 AI 加速器「於 2026 年 5 月底啟動量產、6 月正式出貨」，
    而該檔的月營收年增率正好在 6 月由負轉正（+15.39%）、7 月 +181.78%、8 月 +273.61%。**
    **一個具名專案的量產時點，直接對應在月營收曲線上 —— 這在本清單很少見。**
    ⚠ **但傳導有一個反向的部分必須同時記**：**量產營收的毛利率低於 NRE。**
    **Q2 營收季增 +82.6% 而稅後淨利只季增 +14.9%。**
    **扇出時若只寫「出貨上修 → 營收利多」而不寫毛利率稀釋，會把一個雙向訊號報成單向。**
- driver: hyperscaler-capex
  direction: '+'
  note: >
    CSP 資本支出 → 自研加速器專案數與量 → 委託設計（NRE）與量產（MP）營收。
    ⚠ **本檔在本 driver 上的曝險有一個與其餘硬體標的不同的性質：它同時吃到承諾與落地兩段，
    但分在不同的損益科目。**
    **capex 承諾階段對應 NRE（高毛利、低營收）；落地階段對應 MP（低毛利、高營收）。**
    **同一個 driver 上修，會先讓該檔的毛利率好看，再讓它的營收好看 —— 而兩者中間隔著數個季度。**
    ⚠⚠ **這也是為什麼該檔的 trailing 數字特別不可讀：它可能正好落在兩段之間。**
- driver: accelerator-roadmap
  direction: '+'
  note: >
    製程世代（N3 → N2）與封裝規格 → 專案的設計難度、NRE 單價與量產晶片單價。
    ⚠ **本檔對本 driver 的曝險是製程節點導向**：目前放量的是 **N3**；
    **N2 專案進度本輪未取得（列 gaps）。**
    ⚠ **另記一個該檔無法控制的環節**：**它是台積電的 VCA 夥伴，
    先進製程與先進封裝的產能配置不由它決定** —— **本 driver 上修時，
    該檔的營收上限有可能由代工產能而非需求決定。**

valuation_frame:
