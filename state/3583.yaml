    而 H1 EPS 9.15 對 H1 2025 的 6.05 是 +51.2%。**
    **→ 獲利的成長幾乎全部來自利潤率，不是營收。而那正是 thesis 問的事 —— thesis 問對了。**
    ｜⚠⚠⚠ **並記一個寫作過程中修掉的自己的錯誤，它本身就是一條規則**：
