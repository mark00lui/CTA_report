    p_basis: 需要 CPO／ELS 在 Q4 就有實質貢獻，而公司目前只給到「預計 2026 年可見到相關應用」。與 bear 對稱
    key_assumption: 產能擴充與 CPO／ELS 於 Q4 開始貢獻；毛利率維持 55%+
    eps: 52.0
    exit_multiple: 48
    multiple_basis: "錨在自身歷史高點：2024 trailing 高點 122.00x、2025 高點 72.97x，換算 forward 等值分別約 88.7x 與 53.0x。取 48x **遠低於兩者** —— 本情境不需要市場付出它 2024 或 2025 付過的價。交叉檢查：同業平均 70.8x（近四季 trailing）換算 forward 約 51.5x，48x 亦低於它。⚠ 前一版只錨在同業平均，現改為自身歷史優先、同業為交叉檢查"
    tp: 2496
    narrative: 48x 仍低於同業平均 70.8x（近四季口徑，不完全可比），未取激進值
  weighted_tp: 1734
  # EPS 全部由 H1 實績 19.07 往下推。刻意不採用兆豐／國票／康和 2026-03 的預估
