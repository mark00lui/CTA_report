thesis: "爭點是水冷板月產能自 20 萬套擴到 100 萬套後，32.57% 的毛利率守不守得住"
thesis_since: 2026-09-10
# ⚠ 只留爭點，前提移入 key_variables 與 notes（LITE 那輪的教訓，AXTI 起沿用）。
#   前提（已確立、不是爭點）：**量是真的** —— 2026 前 8 月累計營收年增 76.10%、
#   Q1 年增 110.17%、Q2 年增 66%、連續四個月環比正成長（158.71 → 176.18 → 185.90 → 194.81）。
#   ⚠ **為什麼爭點是率不是量**：**毛利率自 Q2 2025 到 Q2 2026 上升 8.16 個百分點，
#     那是組合往水冷移動的結果。而五倍的產能擴充是一個賭注 ——
#     滲透率跟得上就是規模效益，跟不上就是折舊與稼動率同時打在毛利率上。**
#     **量已經被證明，率還沒有。**

