  而 8046 為 7.82–726.25（跨 93 倍）、3037 因分母趨零而失效。本檔的獲利未在谷底歸零，錨 A 成立。
  ｜⚠ 但代價是資本支出強度：2026 計畫 400 億元對 2025 的 190 億元，capex／營收約 42%，
  **是覆蓋清單最高**。OSAT 本就設備密集（2025 已達 27%），但自 27% 跳到 42% 是明顯加速。
  而營業現金流與自由現金流**完全未取得** —— 這是建檔時最大的空白，也是 thesis 爭點所在。
  ｜⚠ **2026-09-01 新增：FOPLP 這條腿第一次有了競爭座標，而座標指向兩個相反方向。**
  ┌ (＋) **時程領先約一年** —— 力成 2025-05 已「面板級扇出型封裝開始小量出貨」，
  │      同期日月光才要 2025 下半設備進駐、年底試產、2026 送樣客戶認證（工商時報 2025-05-31）。
  │      這是「全球第一家專業封測廠」說法第一次拿到**非公司來源**的支撐。
  ├ (−) **面板規格落後** —— 力成 510×515mm 對日月光 600×600mm，只有 **73%** 面積，
  │      而產業預期 600×600 成主流。FOPLP 的整個經濟理由就是以更大方形面積攤薄每顆成本
  │      （600×600 有效產能達 300mm 晶圓數倍、降本最高約一成）。
  └ **兩者量級相當，我沒有理由把機率往任一邊推。** 機率是使用者的判斷，本次未動。
  ｜⚠ **另一件本次學到的事，值得單獨記**：促成本次 L2 的報導**從頭到尾沒有提到力成**，
  它是一篇以聯發科視角寫的 FOPLP 產業文。實質內容全部來自「拿它的座標去回查本檔」這個動作 ——
  若只讀那則報導就收工，本次會是 L0。
  **產業報導的價值不在它說了什麼，在它讓你能問出什麼。**
  ｜與 TSM 的關係要分清：TSM 做 CoWoS 等**晶圓級**先進封裝，本檔是專業封測廠（OSAT）的
  **面板級與記憶體封裝**。兩者不直接競爭，是先進封裝的不同層級。
