      ⚠⚠ **但必須直接引用 valuation-map 對 PB 的那條警告：
      「在建工程已進分母卻未貢獻獲利時被高估（6239 即是）」——
      本檔正是那個情況的極端版：capex／營收 128.97% 對 D&A／營收 5.92%。**
      **所以 PB 在這裡不是拿來說「便宜」的，是拿來問「這批資產必須賺多少才撐得起現價」的。**
    check: >
      **每股口徑檢查器。** 營收年增 **61.85%** 對股數年增 **49.26%** → **每股營收成長僅 +8.4%**。
