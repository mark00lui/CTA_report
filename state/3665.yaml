  event: 2026 年 9 月營收公告（Q3 全季即可加總）
  what_to_watch: >
    **Q3 合計是否達 270 億元（第一條 falsifier）**；
    ⚠ **本檔的月營收年增率可讀（轉折點清楚），但 8 月已月減 7.67% ——
    看季度加總比看單月穩**
- date: '2026-11'
  event: Q3 2026 財報與法說
  what_to_watch: >
    ⚠⚠ **季毛利率（第二條 falsifier 門檻 28%；thesis 成立方向的門檻 30% 且需連續兩季）——
    這是本檔最重要的一個數字**；
    **HPC 營收占比（第四條 falsifier 門檻 35%）**；
    **營業利益率**（與毛利率的落差就是爬坡成本的位置）；
    **非 AI 那 55% 的內部組成**；**淨現金／淨負債**（解除層級軸的缺口）；
    **XFS 併購對毛利率的實際貢獻**
- date: '2027-02'
  event: Q4 暨 FY2026 財報
  what_to_watch: 全年 EPS 對 55 元門檻；HPC 占比的全年水準；800 VDC 相關產品是否開始貢獻
- date: '2027-04'
  event: FY2026 年報
  what_to_watch: >
    ⚠ **客戶集中度（本輪未取得，也是本檔沒有乾淨的需求無關 falsifier 的原因之一）**；
    全年 capex；XFS 的商譽與無形資產

gaps:
- question: >
    ⚠⚠ **最高優先 —— Q2 2026 的毛利率未取得，而 thesis 押的就是這個數字。**
    **已知 Q1 為 28.77%（管理層稱受新平台爬坡影響），Q2 的推算淨利率已升至約 12.79%
    （自 Q1 的約 10.88%）—— 但淨利率是四層之後的數字，中間隔著營業費用、業外與稅。**
    **毛利率回升了多少，只有財報能回答。**
  how_to_close: 公開資訊觀測站的合併損益表；財報狗的獲利能力頁
- question: >
    ⚠⚠ **非 AI 那約 55% 的內部組成（電動車／工業／醫療／電器）與各自毛利率全部未取得。**
    **副錨（分部別倍數）因此只有一半 —— HPC 那 45% 有占比但沒有毛利率，
    另外 55% 連占比拆分都沒有。**
    ⚠ **而那 55% 有自己的循環（尤其電動車），現有三個 driver 沒有任何一個記它 ——
    這已是同一個結構問題的第五個實例。**
  how_to_close: 法說簡報的應用別營收頁；年報的部門別資訊附註
- question: >
    ⚠ **四家清單外同業（信邦 3023、Amphenol APH、TE Connectivity TEL、立訊 002475）的
    倍數一家都沒取得，主錨因此沒有清單外的錨。**
    ⚠ **清單內的 3533 嘉澤可用其市場觀測倍數（依 3583 細化後的規則），
    但單一對照點不足以定序位。**
  how_to_close: Goodinfo／財報狗／stockanalysis／東方財富各檔頁面，取同一日期
- question: >
    ⚠ **發行股數有 2.5% 的歧異**：
    **由 Q1 稅後淨利 22.7 億元 ÷ EPS 11.66 元 得約 **1.9468 億股**；
    由市值 3,941.67 億元 ÷ 現價 1,975 得約 **1.99578 億股**。**
    ⚠⚠ **所有推算的淨利率、ROE、股東權益週轉率都建立在這個數字上。**
  how_to_close: 公開資訊觀測站的股本形成；或最新月報的在外流通股數
- question: >
    ⚠ **淨現金／淨負債未取得**，方法組合因此跨不了層級軸 —— 本輪第十一檔。
    ⚠ **而本檔另有一個特別的理由需要它**：**併入 XFS 是一次併購，
    對價的形式（現金／股份／舉債）會直接改變資本結構，而那完全未取得。**
  how_to_close: 公開資訊觀測站的合併資產負債表；併購相關的重大訊息
- question: >
    ⚠ **實際 capex／營收 與折舊占營收比重未取得。**
    Y 軸目前依業務模式（線束與連接器以人力與組裝為主）與股價淨值比 7.62、ROE 約 21.0% 判低。
    ⚠ **但併入 XFS 之後的資產結構變化未取得 —— 光學元件的製造可能比線束重。**
  how_to_close: 合併現金流量表與資產負債表
- question: >
    ⚠⚠ **本檔沒有一條乾淨的「與 AI 需求無關」的 falsifier，而三個可能的候選都沒有錨點**：
    **客戶集中度未取得、關稅與地緣曝險未量化（本檔為 KY 註冊且製造據點分散多國）、
    XFS 併購的整合細節未取得。**
    **與其編一個沒有錨的條件，不如記下這個缺口 —— 而它在本輪多數標的身上是有的。**
  how_to_close: 年報的主要客戶揭露與地區別資訊；併購相關的重大訊息與商譽揭露
- question: >
    ⚠ **XFS 併購對毛利率與光學業務的實際貢獻完全未取得。**
    **法說只有「併入 XFS 光學實力大增」這句方向性的表述 ——
    沒有營收貢獻、沒有毛利率、沒有時程。**
    ⚠ **而它是「銅光雙軌」佈局的光那一軌，管理層看好 HVDC 與光學互連的長期需求。**
  how_to_close: 法說簡報的 XFS 專節；年報的企業合併附註
- question: >
    ⚠ **均線只取得季線（約 2,077.54），月線／半年線／年線與 52 週高低皆未取得。**
    ⚠ **而季線有兩個各自獨立的問題**：**已被跌破（價格在其下 4.94%），
    且比值僅 0.80 倍日振幅 —— 即使站回去也不合格。**
  how_to_close: 取單一來源的日 K 序列自行計算月／季／半年／年線，使價格與均線同源

notes: >
  ⚠⚠ **本檔是本輪十七檔中第一個「數據與敘事互相印證」的案例，而不是其中一方單獨說話 ——
  這是它最值得記的性質。**
  **三個獨立序列同時指向同一個轉折點**：
  **月營收年增率 4 月觸底 18.54% → 6 月高點 63.79%；**
  **累計年增率 4 月觸底 25.37% → 8 月 40.01%；**
  **單季淨利率 Q1 約 10.88% → Q2 約 12.79%。**
  **而管理層說 Q1 是「新世代 HPC 平台初期爬坡」造成的過渡期、「並非結構性需求放緩」。**
  ⚠ **去年基期不規則但幅度溫和（全距約 24%），不足以製造這麼大的轉折 —— 轉折是真的。**
  ⚠ **對照本輪前面的檔案**：**3211 是敘事與季度數字相反（管理層說占比破五成而 Q2 降到
  25–30%）；6531 是只有敘事沒有數據（VHMStack 要到 2027–2028）；
  3583 是只有數據沒有敘事（淨利率四季跳 16.3pp 而公司沒解釋）。**
  **本檔是第一次兩者對得上 —— 而那讓 thesis 可以問得更精確：
  不是「轉折有沒有發生」（已印證），而是「毛利率回升多少」。**
  ｜⚠⚠ **本檔提供了「invalidation 必須用比值不能用絕對百分比」最乾淨的一次證明**：
  **3211 順達的季線距現價也是 +5.19% —— 與本檔完全相同的絕對距離。**
  **但 3211 的日振幅 4.39%（比值 1.18 倍，判偏緊），本檔的日振幅 6.46%
  （比值 0.80 倍，判太近）。**
  **同樣的距離、不同的判定 —— 絕對百分比在這裡會給出相同的答案，而那個答案是錯的。**
  ⚠ **本輪的比值分布現在有八個樣本，填滿 0.008 到 2.55 的區間，而過關的只有兩個
  （6187 的 2.03、6531 的 2.55），且兩個都是「價格在均線之上」的。**
  **三個條件（不太遠、不太近、在正確的一側）現在都有樣本支撐，應正式寫進 references。**
  ｜⚠⚠ **本檔是 3583 那一檔細化後的規則第一次被套用在「新標的撞上舊標的同業」的場景 ——
  而它不必再改，直接用就是了。那正是規則細化的目的。**
  **3533 嘉澤在覆蓋清單內且本檔是它列的同業 —— 用 3533 的市場觀測倍數作序位對照，
  不用它的目標價、應有倍數或情境倍數。**
  ⚠ **而第一個序位觀察就有內容**：**兩檔的市營比幾乎相同（本檔 4.42 對 3533 的 4.72），
  但本益比差了 1.8 倍（約 35.53 對 19.81）—— 差別全在淨利率
  （約 12.2% 對約 24.5%），而毛利率是 28.77%（Q1）對 45.47%（Q2）。**
  **本檔用兩倍的營收換到一半的利潤率。那是商業模式的差異（線束與線材 vs 連接器與插槽），
  不是估值的差異 —— 而序位分析要回答的正是市場該為這個差異付多少。**
  ｜⚠ **本檔標 `ai_capex_hw`，而它與本輪三檔拒標的正好形成對照**：
  **3533、8299、6531 的當期 AI 營收占比接近零（CPU 插槽、NAND 價差、2027–2028 的產品）；
  本檔的 HPC 佔比是 45%，一手揭露且占比夠大。**
  **同一條判準，相反的結論 —— 而那正是這個標籤有意義的原因。**
  ｜⚠⚠ **本檔對 driver 層帶進一個新的層次：機架（rack）。**
  **管理層明言「AI 基礎設施正從以伺服器為核心，逐步轉向機架層級架構」，
  並對應 800 VDC 電源架構推出大電流傳輸與高速資料傳輸方案。**
  **本清單此前的標的多半對應「伺服器內的某個零件」；本檔對應的是「機櫃這個單位」——
  若 driver 的變動是「機櫃數」而非「伺服器台數」，本檔的彈性會大於零件供應商。**
  ｜⚠ **並記下第五次遇到「三個現有 driver 都不解釋某一塊營收」的結構問題**：
  **本檔非 AI 的那約 55%（電動車／工業／醫療／電器）沒有任何 driver 記它。**
  **前四次為 CEG 的用電量、AAOI 的 DOCSIS 循環、3533 的 CPU 平台世代、6805 的摺疊裝置循環。**
  **五次之後，這四個 driver 的建議應該一起排程處理，而不是每次列一條。**
  ｜⚠ **另記一件必須誠實承認的事**：**本檔沒有一條乾淨的「與 AI 需求無關」的 falsifier。**
  **三個可能的候選（客戶集中度、關稅與地緣曝險、XFS 併購整合）都沒有錨點。**
  **與其編一個沒有錨的條件，不如記下這個缺口 —— 而它在本輪多數標的身上是有的。**

