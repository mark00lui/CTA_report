- date: 2026-08-31
  level: L1
  summary: 全清單第二輪重估 — 技術面首次取得、錨自「無獨立估值基礎」升為 A，加權 1,711 → 1,734（+1.3%）
  delta: >
    沿用 3324 於同日打通的 wantgoo 路徑，本檔的兩個長期缺口同時關閉。**估值錨**：取得歷年 trailing 本益比（2026 迄今 109.89／47.78、2025 72.97／25.50、2024 122.00／30.83、2023 32.41／9.20；2023 排除為 AI 前的舊光聖），三年平均約 50.5x；以 2026 共識 46.5 ÷ 近四季 33.80 = +37.6% 換算，歷史平均的 forward 等值為 36.7x。現況 forward 35.05x 折價僅 **4.5%** —— 判定【折價幅度小且大致合理】，與 3324 的「明顯折過頭」不同。base 35x → 36x（前一版的 35x 就是現價隱含值）。bear 與 bull 的錨亦自「推論值」與「同業平均」改為自身歷史。**技術面**：站上六條均線中的五條但低於 MA120(1,773.54)，且 MA120 > MA60，半年線在季線之上、中期下降結構未翻轉；距 52 週高 2,540 為 -35.8%。⚠ **量能是最有訊息量的發現**：8/28 成交量僅為 20 日均量的 **0.49 倍**，價漲量縮 —— 對比同族群同日的 3324（2.91 倍）與 3008（1.84 倍），三檔同屬 AI 光電但量能品質差異極大。confirm_trigger 的「放量站上 MA120」目前放量這一項完全不成立。⚠ **信心度自低升至中**：低的上限來自 valuation.md 對「無獨立估值基礎」的規定，本次錨升級後解除。仍非高：63% 單一客戶集中度未變、CPO 時程仍無自身揭露驗證、RSI 未取得。⚠ **循環性檢查觸發且已說明**：base 1,674 對現價 1,630 為 +2.7%，屬結論非產物 —— 36x 由歷史平均換算而得，兩者接近的原因是歷史錨本身就說本檔接近合理價。同一方法用在 3324 得出「錯價」、用在本檔得出「大致合理」，那才是方法在運作。⚠ 均線為 2026-08-28 收盤口徑，差一交易日不做回補（與 3324 那次的盤中快照可精確回補不同）。機率沿用前值。
