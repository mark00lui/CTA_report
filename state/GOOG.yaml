# 公開研究檔 — 本倉庫不含任何倉位資訊：無成本、無張數、無權重、無 Kelly、無損益、無持倉揭露。
# 未知值一律留 __ 並寫進 gaps，不要填看起來合理的數字。
#
# ⚠ 估值口徑：一律用「正常化 EPS」＝排除股權證券的未實現評價損益（公司損益表科目，非作者損益）。
#   Q2 2026 淨利 $112.1B（+298%）中，其他收入淨利益約 $98B 主要為未實現股權證券利益；
#   Q1 2026 的 $36.9B 利益經公司揭露使稀釋 EPS 增加 $2.35。
#   TTM EPS $19.93 因此嚴重失真 —— 正常化後 H1 約 $5.64、年化約 $11.3。
#   報價頁 trailing PE 17.07 低於 forward PE 25.18，正是這個扭曲的外顯。
ticker: GOOG
name: Alphabet
market: US
factor_tags:
- ai_platform
