notes: >
  ⚠⚠ **本檔建立同時關掉一個長期存在的驗證警告，這件事值得先記**：
  **`drivers/hyperscaler-capex.yaml` 的 transmission 早就列著 3017 卻沒有對應的 state 檔，
  `validate_state.py` 為此警告了很久，而 `state/3324.yaml` 自己也記著這件事。
  本檔補上後，那條警告只剩 AMZN。**
  ｜⚠⚠ **本檔與 3324 是本清單第二組循環引用，而這一次我在建檔前就看見它。**
  **`state/3324.yaml` 的 `methods.secondary`（錨 B）用的正是本檔的 forward PE 26.26x；
  若本檔反過來以 3324 為錨，兩檔就構成閉環。**
  **處置：本檔的錨一律取自覆蓋清單外（健策 3653、建準 2421），
  明文禁用 3324 的倍數；3324 只作為份額此消彼長的觀察對象。**
  ⚠ **對照第一組（LITE／COHR）：那一次是建到一半才發現，而且發現時 COHR 的三個情境倍數
  都已經掛在 LITE 上。這一次的差別不是我變聰明了，是 correlation_watch 裡已經寫著那條教訓。**
  ｜⚠⚠ **而查證錨 B 時發現一個口徑問題，它會回頭影響 3324 的估值，這是本檔最有價值的發現：**
  **3,285 ÷ 26.26 = 隱含 forward EPS 125.1，而台灣法人 2026 年共識 EPS 區間為 87.78–106.8
  （由稅後純益 397.22 億元與推算股數得均值約 101.1）—— 隱含值高出共識上緣 17%。**
  **以同一個 2026 共識口徑重算，本檔的 forward PE 是約 32.5x（於 3,285）而非 26.26x。**
  **對照 3324 自身的 forward 21.80x（同樣用 2026 共識 EPS 57.34）——
  同業溢價是 49% 而不是 3324 檔裡記的 20%。**
  ⚠⚠ **亦即：3324 給自己的折價，是對著一個口徑可能不一致的分母量出來的。**
  ⚠ **但我沒有確認 stockanalysis 的 forward 究竟是 NTM 還是曆年 2026，
  所以這裡只陳述算術與差距，不斷言原因。**
  **且依本倉庫規則（state 變動須有對應報告），本檔不逕行修改 3324 的 state ——
  僅記錄並建議下次 `/revalue 3324` 優先處理。**
  ｜⚠ **rank_metrics 這一次第二度執行「確認不到就換掉」的規則**：
  **曾考慮把「液冷營收占比」列為排序指標（它是 3324 的核心變數），
  但本檔只揭露「GPU 相關營收超過 50%」，並未揭露液冷占比 ——
  一個只有一邊拿得到的指標無法定序位，故換成「資本支出強度」。**
  **改用它還有一個正面理由：液冷是產能競賽，誰先蓋出產能誰吃到訂單，但蓋錯了就是死錢；
  在這樣的族群裡資本支出強度就是市場付錢買的東西，也是懲罰的東西 ——
  這與我在 AXTI 那檔用 Wolfspeed 當參照的理由是同一個。**
  ｜⚠⚠ **EV/Sales 在本檔可用，而在同日的 AAOI 與 2345 被我明文禁用 —— 這個對照要記清楚。**
  **那兩檔禁用的理由是同業毛利率結構橫跨太大（AAOI 的 CATV 對資料中心、
  2345 的 19.7% ODM 對 Arista 的品牌高毛利），分子分母對不齊。**
  **本族群的散熱同業毛利率結構相近（本檔 32.57%），所以它在這裡是合法的。**
  **判準是同業的毛利率離散度，不是方法本身 —— 同一個方法在不同族群可用性可以相反。**
  ｜⚠⚠ **本檔的年增率正在單調減速（111.72% → 54.34%），而環比連續四個月為正 ——
  兩條趨勢方向相反，主因是 2025 下半年的高基期（該期月均較 1–8 月高約 61%）。**
  **這直接決定了 falsifier 的設計：不能用年增率門檻，只能用環比或絕對金額。**
  **這是本日六檔中第一次基期效應強到會讓一個看似合理的 falsifier 變成壞的 falsifier。**
  ｜⚠ **技術面：本檔是本日六檔中唯一價格站在中期均線之上的**（+25.39%），
  **而 invalidation 仍然留空，因為季線距現價 -20.25%，
  剛好越過我在 AXTI 那檔提出的 ±20% 門檻 0.25 個百分點。**
  ⚠⚠ **一條規則被用在離邊界 0.25pp 的地方時，該問的是這個邊界憑什麼是 20% 而不是 25%。**
  **我目前沒有那個依據，所以照規則執行並把疑問記下來 ——
  通融一次，規則就不再是規則。正確的解法是取得月線。**
  ｜⚠ **wantgoo 的市值欄位少一個數量級（載 1,327.225 億元，正確約 13,280 億元），
  這是本日第二次遇到同一來源的同一種錯誤**（前一次為 2345，載 1,102.60 而正確約 11,026 億）
  —— **應視為該來源的系統性單位問題，日後一律自行由市營比或股價 × 股數推算。**

