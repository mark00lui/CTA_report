  8299 是分類軸沒有覆蓋到、6805 的整體市營比被禁用 —— 本檔是第一次處方直接用得上。**
  ⚠ **但它只有一句法說說法，沒有外部估價 —— tier 只能是假設，
  它可以用來界定範圍，不可以用來報一個數字。已設為第四條 falsifier。**
  ｜⚠⚠ **本檔為「先看去年那條線的形狀」這個判準補上了第三種情況，而它是最麻煩的一種**：
  **3081 的基期是平的 → 年增率可以直接讀；**
  **3017／6805／8299 的基期是單調斜的 → 年增率被系統性放大或縮小，改用絕對金額或月增率；**
  **本檔的基期是不規則的，而本檔 2026 年的月營收同樣不規則 ——
  兩年形狀都不規則時，年增率與月增率都不可讀，只有累計或季度有訊號。**
  **實務後果：本檔的第一條 falsifier 因此不用月營收，改用季度的 BBU 占比 ——
  這是本輪十二檔中第一次月營收完全不能當 falsifier 的錨。**
  ｜⚠ **rank_metrics 第五次執行「確認不到就換掉」，但拒絕的理由是新的類型**：
  **前四次都是「同業頻率不對等」（3081 的 IQE 只有半年報、8299 的 SIMO 是美股季報），
  本次是「兩年都不規則」—— 指標本身取得得到，但讀不出訊號。**
  **這兩種失效應該分開記：一種是拿不到，一種是拿到了也沒用。**
  ｜⚠ **本檔是本輪第一檔「均線的距離本身沒有問題」的標的**：
  **季線距現價 +5.19%，且高於一個日振幅 4.39% —— 兩端都不越界。**
