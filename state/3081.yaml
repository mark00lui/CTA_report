# 公開研究檔 — 本倉庫不含任何倉位資訊：無成本、無數量、無權重、無 Kelly、無損益、無持倉揭露。
# 未知值一律留 __ 並寫進 gaps，不要填看起來合理的數字。
#
# ⚠⚠ 建檔當下最重要的四件事，寫在最前面：
#   (1) ⚠⚠ **本檔補上覆蓋清單的第四個供應鏈層級，而清單至此第一次有了完整的一條光互連鏈：**
#       **InP 基板（AXTI）→ 磊晶片與 CW 雷射（本檔）→ 收發器模組（COHR／LITE／AAOI／6442／3008）
#       → 交換器（2345）。** 本檔正好卡在 AXTI 與收發器族群之間。
#   (2) ⚠⚠ **而本檔的法說直接印證了 AXTI 的論點，這是本清單第一次出現「下游用一手說法
#       證實上游」**：法說明言「**InP 基板：4 吋以上大基板供給比重極低，為隱形瓶頸；
#       本公司現多數出貨 3 吋以上**」。**AXTI 的整個 thesis 就是 InP 基板產能，
#       而這句話來自它的客戶那一層，不是來自 AXTI 自己。**
#   (3) ⚠⚠ **capex／營收 約 218%（近三季 capex 近 60 億元 ÷ 近三季營收約 27.55 億元），
#       是 15% 門檻的 14.5 倍 —— 本清單新紀錄**（前一個是同日 AAOI 的 128.97%）。
#       **而同期折舊僅占營收約 6.14% —— 兩者相差 35 倍，正在蓋的資產尚未投入服務。**
#   (4) ⚠⚠ **本檔是本日第二檔「以資本支出擴建而非商品循環進入 Q3」的標的**（第一檔為 AAOI），
#       **而兩檔都遇到同一個問題：Q3 象限的兩個預設主錨（PB、中週期正常化 EPS）都不能用。**
#       **兩次就不是個案 —— valuation-map 的 Q3 格是為商品循環股寫的。**
