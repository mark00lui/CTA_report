# 公開研究檔 — 本倉庫不含任何倉位資訊：無成本、無數量、無權重、無 Kelly、無損益、無持倉揭露。
# 未知值一律留 __ 並寫進 gaps，不要填看起來合理的數字。
#
# ⚠⚠ 建檔當下最重要的五件事，寫在最前面：
#   (0) ⚠⚠ **代號更正**：**指令給的是「3221 順達」，但 3221 是台嘉碩（上櫃，市值約 50.76 億元），
#       順達科技是 3211（上櫃）。名稱明確、代號差一碼，判定為筆誤，依名稱建檔為 3211。**
#       **本倉庫的 valuation-map 已經記過一次同類錯誤（「⚠ 不是 3413，3413 是京鼎——
#       本倉庫犯過這個錯」）—— 這是第二次，故寫在最前面而不是註腳。**
#   (1) ⚠⚠ **本檔是本日十二檔中唯一盈餘在下滑的，而它的本益比是 49.46 倍。**
#       **Q2 EPS 1.35 元（年減 65%）、H1 累計 3.4 元（年減 31%）、TTM 7.41 元。**
#       **對照同日的 8299：本益比 9.55 倍而 EPS 創 40 季新高。**
#       **兩者是同一個陷阱的兩端 —— 而 valuation-map 對 trailing PE 的警告只寫了
#       「循環頂（低 PE 看似便宜）」那一半，本檔是另一半：轉型谷（高 PE 看似昂貴）。**
#   (2) ⚠⚠ **敘事與季度數字互相矛盾，而這就是 thesis**：
#       **管理層說「以 BBU 為核心的非 IT 業務占比今年首度突破整體營收五成」，
#       但 Q2 的實際非 IT 占比降到 25%–30%，且 Q2 的成長來自 IT 產品。**
#   (3) ⚠⚠ **「A7 土地潛值逾百億」超過整個帳面淨值（約 89.6 億元）。**
#       **這使 Q4 象限處方裡「選擇權拆分」那一半第一次真正用得上 —— 本日十二檔中的第一次。**
#   (4) ⚠ **季線距現價 +5.19%，是本日第一檔落在那條雙邊規則「可用中段」而且距離
#       剛好高於一個日振幅（4.39%）的標的。**
ticker: '3211'
name: 順達科技
market: TW
factor_tags:
