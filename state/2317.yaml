notes: >
  ⚠⚠⚠ **本檔最重要的發現不在營收，在三個獲利層級同時往三個方向走。**
  **2026 Q2：毛利率 **6.12%**（年減 0.21pp，↓）；
  營業利益率 **3.75%**（年增 0.60pp，↑↑，歷年同期新高）；
  淨利率約 **2.37%**（對 Q1 的 2.35%，幾乎不動，→）。**
  **而營業利益年增 **68%**，稅後淨利只年增 **30%**。**
  ⚠⚠ **把它算成一個數字**：**「稅後淨利 ÷ 營業利益」自去年 H1 的約 **83.7%**
  降到今年 H1 的約 **64.5%** —— 掉了約 **19 個百分點**。**
  **thesis 問的就是這 19 個百分點去了哪裡，而三個候選解釋
  （業外損益、有效稅率、非控制權益）的意義完全不同 ——
  第三個若屬實，本益比 16.61 的分母就永久性地少了一塊。**
  ⚠ **每一層的方向也各有解釋**：**毛利率下降是因為 AI 機櫃的加值率低於公司平均；
  營業利益率上升是營收年增 41% 而營業費用沒有同比例增加的槓桿效應；
  淨利率不動是因為營業以下把營業層的改善吃掉了。**
  **三個方向不矛盾 —— 它們是同一件事在三個層級上的投影。**
  ｜⚠⚠⚠ **本檔是本輪第二檔 Q1（盈餘倍數），十九檔裡只有兩檔
  （前一檔為 3533 嘉澤）—— Q4 有十一檔、Q3 有三檔。**
  **而 X 軸判高的理由必須精確：有代表性的是**營業利益**，不是稅後淨利。**
  ⚠ **判高的實質理由是「商業模式沒有在改變」**：**AI 機櫃是同一個組裝生意的更多量，
  不是一個不同利潤結構的新生意 —— 淨利率 2.35% → 2.37%、毛利率 6.12%，
  這些量級三十年沒變過。**
  **對照本輪其他標的：3363 是跳線 → FAU（毛利率結構完全不同）、
  6531 是 IoTRAM → VHMStack（產品線整個換掉）。本檔不是那種轉型。**
  ⚠⚠ **而 Q1 的處方（盈餘倍數）在本檔要往上挪一層用：
  PE 的分母被汙染了，EV/EBIT 才是對的尺 —— 那正是層級軸的定義。**
  **這是本輪第一次層級軸不是「因為查不到淨負債而略過」，而是「因為它正好是爭點所以必須做」。**
  ｜⚠⚠⚠ **本檔是覆蓋清單第一檔「清單的客戶」，而它立刻產生了一種新的交叉驗證。**
  **3017／3324（散熱）、3533（連接器）、3665（線材）、6805（樞紐）、2308（電源）
  賣的東西，最後都裝進它組的機櫃裡。**
  **而它的法說說：「上修資本支出年增三成以上，提前擴充伺服器機櫃、**液冷**及測試產能，
  並強化臺灣、美國、墨西哥、越南等全球佈局。」**
  ⚠⚠ **那句「擴充液冷產能」來自買方 —— 而 3324 與 3017 的整個 thesis 就是液冷滲透率。**
  **這是「買賣雙方一手互證」在本清單的第一個實例，
  與此前記過的三種（上下游時序、同一個埠的兩端、同層同業序位）都不同。**
  ⚠ **也因此明文禁用把供應商的倍數當本檔的錨，反之亦然 —— 上下游沒有倍數可比性。**
  ｜⚠⚠⚠ **市營比 0.35 —— 本清單最低，而同日建檔的 3363 上詮是 45.92。**
  **同一天、同一條 AI 鏈上、相差 **131 倍**。**
  **這是「市營比在跨商業模式時完全沒有意義」最好的一次證明 ——
  本檔是薄利多銷的組裝（TTM 淨利率約 2.11%、股東權益週轉率 5.28 倍，兩者都是本清單極端值），
  3363 是還沒有營收的選擇權。**
  ｜⚠⚠⚠ **本檔與 3363 同日建檔，而兩檔正好把「哪一條營收序列有訊息」的兩個極端佔滿了。**
  **本檔：月增率**不可讀**（強烈的消費電子季節性，1–2 月淡、3 月跳 +34.90%），
  但年增率與累計年增率**都可讀**（去年基期溫和不規則，全距約 19.1%；
  累計年增率 2 月觸底 21.63% 後單調上升六個月至 39.73%）。**
  **3363：年增率與累計**都不可讀**（去年基期全距 103%），只有**月增率**可讀。**
  ⚠⚠ **這證明「哪一條序列有訊息」不是標的的屬性，是基期形狀與季節性共同決定的。**
  **判斷順序應該是：先看去年那條線的形狀 → 再看今年有沒有季節性 → 最後才選序列。**
  **本輪此前只做了第一步，應把第二步補進 references。**
  ｜⚠⚠⚠ **本檔揭露了 invalidation 規則缺的第四個條件，這是本輪最有價值的方法論收穫。**
  **本檔的日振幅只有 **1.59%** —— 本輪十九檔中最低（3363 是 7.74%、3665 是 6.46%），
  Beta 0.96 也是最低。**
  **對這樣一檔市值 3.5 兆元的大型股，「2 個日振幅」只需要距離 **3.2%** 就滿足了 ——
  而 3.2% 對任何個股都在單日新聞與盤中雜訊的範圍內。**
  ⚠⚠ **亦即那條規則需要的不只是相對下界（≥2 個日振幅），還要一個**絕對下界**。**
  **現有三個條件是：不太遠（±20%，絕對上界）、不太近（≥2 個日振幅，相對下界）、
  在正確的一側。本檔補上第四個：絕對下界。**
  ⚠ **並記下十個樣本的通過率只有 20%（6187 2.03、6531 2.55）——
  這件事本身應該回填 references：要嘛門檻太嚴，要嘛「季線」對多數標的本來就不是
  好的失效參考。後者更可能，因為本輪只查了季線一條線。**
  ｜⚠ **另記兩件小事**：**(a) 本檔是本輪第一次股數兩路完全對上
  （市值 ÷ 現價 ＝ 140.76 億股；Q2 淨利 ÷ EPS ＝ 140.5 億股，差 0.2%），
  對照 3665 那次差 2.5%；**
  **(b) 月營收為自結，Q1 三個月加總 21,295.90 億元 vs 法說載 21,195 億元，
  差約 0.5% —— 屬自結與查核後的正常差異，但比較時要同源。**

