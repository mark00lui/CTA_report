    **(a) 轉型已經發生，而且幅度很大** —— **HPC 佔比自 1Q25 的 27% 提升到 1Q26 的 45%。**
    **(b) 而轉折點是三個獨立序列同時指出來的** —— **月營收年增率 4 月觸底 18.54%
        → 6 月 63.79%；累計年增率 4 月觸底 25.37% → 8 月 40.01%；
        單季淨利率 Q1 約 10.88% → Q2 約 12.79%。**
        ⚠⚠ **而管理層說 Q1 是「新世代 HPC 平台初期爬坡」造成的過渡期、
        「並非結構性需求放緩」—— 數據與敘事對得上。**
        **這在本輪十七檔裡是第一次。**
    **(c) 但毛利率回升了多少還不知道** —— **淨利率是四層之後的數字，
        中間隔著營業費用、業外與稅。thesis 問的正是毛利率那一層。**
    **(d) ⚠ 而 rack-level 的產品組合不必然是同一個毛利率結構** ——
        **回得去、回不去、或回到更高，三種都有可能，公司只說了「不是結構性需求放緩」，
        沒有說「毛利率會回到原來的水準」。那是兩件不同的事。**
