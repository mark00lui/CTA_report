  how_to_close: 需要 references/state-schema.md 容許「分支式情境」（各分支獨立目標價 ＋ 機率，不取加權），或在報告層以分支呈現並把 weighted_tp 標為僅供對照
- question: ⚠⚠ **偏空與街上共識同向，沒有差異化觀點** —— 加權 -15.2%／base -24.5%／幾何 -26.6%，而街上共識目標價 5,146.39 相對現價 -22.73%。**四個口徑全為負且其中一個是賣方自己的共識。依 valuation.md 的精神，「與市場一致」不是信心的來源 —— 模型說得出「這檔明顯錯價」才是。** **這不是資料缺口，是判斷缺口。**
  how_to_close: 要嘛找到街上沒看到的東西（CPO 的量產時程或單位價值量的具體數字），要嘛承認本檔只是「跟著市場說貴」並把它寫進 signal.basis
- question: ⚠⚠ **beta 的前瞻性** —— 1.18 是 5 年歷史值，而本檔 52 週振幅 3.96 倍（2,020–7,995）且剛經歷 CPO 帶來的重評價。**同 INTU（beta 0.98，一年跌 53%）與 COHR（beta 2.10，一年漲 225%）那兩輪的問題。**
  how_to_close: 以 52 週或 2 年窗口重算 beta；或比較多家資料商的不同窗口值
- question: ⚠⚠ **主錨（錨 A，自身歷史 trailing PE）自 2026-08-31 起未重取，已兩週** —— 區間 11.54–22.58、平均 15.8x 沿用 wantgoo 本益比頁。**而本檔的 base 拆解完全建立在那個 15.8x 上（forward 等值 14.34x ＋ CPO 溢價 9.66x）。**
  how_to_close: wantgoo 本益比頁（需確認是否為 JS 渲染）；或以逐季實際 EPS × 對應期間股價自行重算 trailing PE 序列
- question: ⚠ 自身歷史本益比「五年區間 12–16x」已於 2026-08-27 取得（來源：經濟日報產業分析），但那是 trailing 口徑、只有區間端點、沒有分位分布也沒有逐年序列。bear 取 14x 為區間中值，屬合理推論而非查得的中位數。另仍缺 CPO 貢獻的自下而上估算，用以驗證市場所付的每股約 3,875 元
  how_to_close: Koyfin／GuruFocus／Bloomberg 的歷史 forward PE band；台股另可用 Goodinfo 本益比河流圖或券商看盤軟體
- question: ⚠ 均線（5／20／60／120／240）與 52 週低點未取得，CTA 位階無法完整判定、invalidation 設不出來。與 3324、6442 同一系統性缺口（台股報價頁 JS 動態渲染，WebFetch 無效）
  how_to_close: 改用可輸出靜態資料的來源（券商 API、TWSE 官方檔案），或由使用者提供
- question: CPO 業務的營收貢獻、單位價值量與毛利率結構完全未揭露。目前只知「有首張訂單」與時程，金額規模不明 —— 而股價正在為它定價
  how_to_close: Q3／Q4 法說 Q&A；公司若揭露分部資訊
- question: FAU 光纖陣列模組的切入為市場傳聞而非公司揭露，未經證實
  how_to_close: 法說 Q&A 直接求證；供應鏈查證
- question: ⚠ 2027 共識 EPS 未取得 —— 那是 CPO 第一次進入分母的年度，也是本檔估值唯一該用的基準年。2026 共識已於 2026-08-27 重估時取得（FactSet 17 位，中位 190）
  how_to_close: Q3 財報（約 2026-10）後賣方模型更新。屆時滾動基準年，目標價會大幅跳動且那不是重評價
- question: 客戶集中度未取得。手機鏡頭業務對單一大客戶的依賴程度是本檔的既有風險，但無公開數字
  how_to_close: 年報客戶集中度附註
- question: Q3 2026 財報日未公告
  how_to_close: 公開資訊觀測站

notes: ⚠ 2026-08-27 重估補記：三個月內 FactSet 的 2026 EPS 中位數只動 +2.2%（185.91→190.00），
  目標價卻 +72%（3,030→5,220），隱含倍數自 16.3x 擴張至 27.5x —— 目標價的上升幾乎完全來自
  倍數而非獲利上修。與 3324 同構但幅度差一個量級。而現價 6,915 已超過該目標價 32.5%，
  且該目標價日期為 2026-07-27、早於本週兩根漲停。
  ｜產能承諾（原為 key_variable，因上限 6 個而移出）：2026 年四度購置不動產、累計約 56.49 億元，
  最新一筆為 2026-08-25 的 30.8 億元台中南屯土地廠房。說要做與投錢下去是兩回事，這是可觀測的代理指標。
  ｜Q2 環比是下滑的（Q1 46.63 → Q2 35.72），H1 的 +50% 年增主要由 Q1 貢獻 —— 建檔時沒看出來，
  因為 cnyes 頁面把 Q1 標成「當季」。
  ｜⚠ 本檔看似能填補覆蓋清單 non_ai 為 0.0% 的結構性偏誤 —— 它的營收基礎確實是消費性光學（手機鏡頭），
  與 AI capex 無關。但它填不了，因為**驅動股價的不是營收基礎而是 CPO**：三日 +28.41%、兩根漲停、
  創歷史新高，催化劑全部來自 CPO 首張訂單與為此購置的不動產。
  ｜因此本檔加深的不是 ai_capex_hw，而是 cpo —— 與 6442 光聖形成同題材的第二檔。
  兩者切入點不同（本檔自 FA／PMLA／FAU 光學元件端，6442 為光通訊產品），但共用同一個
  「CPO 是否如期放量」的前提。判讀清單分散度時必須把這一層算進去。
  ｜建檔時點的特殊性要記住：連續兩根漲停期間沒有換手，支撐與壓力都還沒形成，
  技術面的任何判讀在此時都不可靠。加上均線本來就沒取得，本檔的 CTA 是全清單中最弱的一份。

