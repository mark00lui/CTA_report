# 公開研究檔 — 本倉庫不含任何倉位資訊：無成本、無數量、無權重、無 Kelly、無損益、無持倉揭露。
# 未知值一律留 __ 並寫進 gaps，不要填看起來合理的數字。
#
# ⚠⚠ 建檔當下最重要的四件事，寫在最前面：
#   (1) **本檔是覆蓋清單第一檔以「資本支出擴建」而非「商品循環」進入 Q3 象限的標的。**
#       valuation-map 的 Q3 名單（MU／SNDK／3037／8046／6239）**全部帶 cyclical 標籤**。
#       **這是對地圖本身的發現：Q3 可以由擴建到達，不只由循環到達。**
#   (2) ⚠⚠ **營業利益從未為正，而且是在營收增加 173.8% 的同時變得更負**：
#       FY2023 -41.35 → FY2024 -70.91 → FY2025 -54.60 → TTM **-67.41**（百萬美元）。
#       **這與 LITE（一次性費用、營業利益 +5.362 億）和 AXTI（TTM 剛轉正 +3.88）都不同。**
#   (3) ⚠⚠ **42% 的營收是 CATV（有線電視寬頻接取），與 AI 無關。**
#       Q2 2026：資料中心 1.077 億 ／ **CATV 0.806 億** ／ 電信 0.034 億。
#       **整體 EV/Sales 15.04x 是把 AI 倍數套在一個四成是有線電視設備的營收基礎上。**
#       **本檔的主錨因此必須是分部別的，這不是精緻化，是不做就會錯。**
#   (4) ⚠⚠ **在外股數年增 49.26%，自 FY2023 的 3,840 萬增至 8,491 萬（+121.1%）。**
#       **營收年增 61.85% ÷ 股數年增 49.26% → 每股營收成長僅 +8.4%。**
#       **而公司自己的 Q3 EPS 指引用的是 9,280 萬股，比現在還多 9.3% —— 指引本身內含進一步稀釋。**
