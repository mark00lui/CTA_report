equal_weight_factor_mix:
  ai_capex_hw:    {count: 13, pct: 68.4, note: "⚠⚠ **2026-09-10 納入 2308 台達電，自 66.7% 升至 68.4%，刷新歷來最高（第六次）** —— 序列為 58.3% → 61.5% → 64.3% → 66.7% → 68.8% →（CEG／AVGO 稀釋回 64.7%／66.7%）→ **68.4%**。**逾三分之二的覆蓋標的共用同一條需求鏈。** ⚠ **但 2308 在本因子內的傳導性質與其餘十二檔不同，扇出時不可套用同一個強度**：其餘標的受惠於**機櫃出貨台數**，2308 同時受惠於**單櫃功率密度**（54V → ±400V → 800VDC 的換代由功率密度驅動，不由台數驅動）。**這是本因子內第一檔與出貨量部分脫鉤的標的** —— 即使 AI 伺服器出貨量成長減速，只要單櫃功耗續升，這條鏈仍有量。⚠ **也因此它對 hyperscaler-capex 的 sensitivity 記為「中」而非「高」**：capex 金額只打到它一半的曝險，另一半住在 accelerator-roadmap 的 power_architecture。原註：⚠ **2026-09-08 同日再納入 AVGO，自 64.7% 回升至 66.7%。** ⚠⚠ **但 AVGO 在因子層帶進一件此前不存在的事：清單內部第一次出現方向相反的兩檔。** AVGO 的 AI 營收**就是**超大規模業者自研加速器的採購金額（FY2026 Q3 為 16.7B、Q4 指引 21.7B），**若某家 CSP 自研轉外購（改買 NVDA），對 AVGO 是營收減項而對 NVDA 是利多**。此前本因子內十一檔雖深淺不一但方向一致。⚠ **這使「ai_capex_hw 66.7%」第一次不能被讀成「66.7% 同向曝險」。** 原註：⚠ **2026-09-08 納入 CEG 後自 68.8% 降至 64.7% —— 這是連續五次刷新新高之後的第一次下降，也是本清單第一檔真正稀釋這個因子的新增標的。** 原註：TSM + NVDA + MU + SNDK + 3324 + 6442 + COHR + 3037 + 8046 + 6239 + 3030 — 同一條需求鏈。⚠ **2026-09-08 納入 3030 後自 66.7% 升至 68.8%，連五次刷新歷來最高**（58.3% → 61.5% → 64.3% → 66.7% → 68.8%）。**逾三分之二的覆蓋標的共用同一條需求鏈**，任何 common_premise 層級的變動會同時打到十一檔。⚠ **但 3030 的曝險性質與其餘十檔不同，扇出時不可套用同一個傳導強度**：它做的是組裝電路板自動檢測設備（AOI），客戶為 EMS、PCB 與封測廠 —— **對 AI 資本支出的曝險是間接的（經由客戶的設備投資），而非直接出貨給 CSP 或加速器廠**。對照 6239 直接服務 AMD／Broadcom，兩者差一層"}
  ai_platform:    {count: 3, pct: 15.8, note: "MSFT + GOOG + META — 支出方；capex 縮手時它們先反應，硬體端後反應"}
