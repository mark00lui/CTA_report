  那是一條跨象限的規則而不是 Q3 專屬的。**
  **象限決定資產面的方法（本檔資產輕，不做 PB 主錨、不做重置成本），
  循環性質決定時間面的方法（必須正常化）。兩者不衝突。**
  ⚠ **對照本日前三次「象限處方失效」的處理**：**2345 是推翻 Q4 的主錨；
