    ｜⚠ **第十個來源問題（輕微）**：**Yahoo 的摘要文字寫「所有月份年增率均超過 50%」，
    但它自己表格裡的 3 月是 44.43% —— 敘述與數字矛盾，採數字。**
    **本週第十次，而這次是「摘要與自己的表格不符」，又是一種新的形態。**
    ｜**新增第五條 falsifier**（單季推算淨利率未達 12.5%）——
    **bull 情境的全部內容就是毛利率結構上移，本條是它的直接檢驗；
    且刻意用推算淨利率（可由 EPS 與營收直接算出）而非未取得的毛利率。**
