- date: 2026-09-11
  level: L2
  summary: 台股基準年修正連續作業第五檔（本檔同日第二次重估）— ⚠⚠⚠ 第一個「共識輸給自建估計」的實例（2 位分析師的 FY2026 共識被月營收否證 7.2%）；並發現 base 的 35x 內插區間的上下界不同口徑，區間不存在。三個目標價一個字未動
  delta: >
    ⚠ **本輪與同日稍早那一輪的分工**：稍早那份建立了三情境與加權 805（主要發現是 PB 與 ROE 的
    反向關係）；**本輪不重做那件事，只處理它沒有碰的三件 —— `valuation_base_year` 仍不存在、
    遠期共識一條都沒查過、同業倍數的年度歸屬未確認。三個目標價與加權值一個字未動。**
    ｜⚠⚠⚠ **第一個發現：本檔是第一個「共識輸給自建估計」的實例，而且可以量化。**
    **兩條通道的結果：鉅亨 Factset 速報**零筆**（本檔無覆蓋）；stockanalysis 的 FY2026 有
    （營收 101.1 億 +78.36%／EPS 17.90 +131.26%）但**只有 2 位分析師**，FY2027／FY2028 付費牆。**
    **而月營收否證了它：1–8 月累計 65.99 億（+109.13%）、7 月 11.04 億（+145%）、
    8 月 10.31 億（+150.82%）—— 共識隱含 9–12 月需月均 **8.78 億**，
    比 7–8 月實際月均 10.68 億低 **17.8%**，而 8 月的年增率還有 +150.82%。**
    **若後四月僅維持 7–8 月水準：FY2026 營收 108.69 億（比共識高 7.5%）、
    EPS 19.19（比共識高 7.2%）—— 與 state 自建的「約 19」吻合。**
    ⚠⚠⚠ **而這與 8046 的結論方向相反（16 位分析師，state 自建的 23.78 低於共識 42.34 達 43.8%）
    —— 判準是分析師人數，不是原則。建議門檻：分析師數 < 5 時共識僅供對照，以月營收自建為主。**
    **台股有一個美股沒有的仲裁者：月營收是法定、每月公告、與共識完全獨立的觀測值，
    所以「共識對不對」在台股可以每月裁決，不必等財報。**
    ｜⚠⚠⚠ **第二個發現：base 的 35x 完全沒有錨，而這比 state 自己承認的更嚴重。**
    **state 原記「上下界都是觀測值：同業最高 19.79（華邦電）與現價隱含 46.8 倍；
    但 35 這個點是區間內插，不是估值」。**
    **本輪確認那兩個端點不是同一個口徑：19.79 是 **trailing** PE
    （同業倍數快照 as-of 2026-09-10，無年度標註；以華邦電現價 171.50 ÷ TTM EPS 9.05 重算為 18.95x），
    而「現價隱含 46.8x」是 **forward 且是 FY2027**。**
    **華邦電的同年度（FY2027）倍數是 171.50 ÷ FactSet 中位 50.05 ＝ **3.43x** —— 差 5.8 倍。**
    **→ 內插區間的上界與下界不同口徑，「35 落在區間內」這句話沒有內容。
    state 說「35 是區間內插不是估值」，本輪說的是「那個區間根本不存在」。**
    ⚠⚠ **但不得據此把 35x 往 3.43x 調**：FactSet 的華邦電 FY2028 中位 48.73 **低於** FY2027 的 50.05
    —— 共識明確預期記憶體循環在 FY2027 見頂，而「峰值盈餘配低倍數」是循環股的典型定價。
    **華邦電有自有晶圓廠、做商品記憶體；本檔無廠設計、淨利率 28.8%、處於 IoTRAM 放量段。**
    **→ 通則：比較倍數前要先看同業自己的 FY+1→FY+2 成長方向；若為負，
    它的低倍數是循環訊號不是估值訊號。**
    **→ 錨 B 不成立，可用成員數為 0（華邦電結構上不可比，晶豪科 3006 與鈺創 5351 仍無年度標註倍數）。**
    ｜**`valuation_base_year` 首次建立為 2027 —— 它原本根本不存在（不是值為空），
    而三個 key_assumption 都明寫「FY2027 為 …」。內容有基準年而結構沒有，本次只補欄位。**
    ｜⚠⚠ **thesis 的爭點被月營收回答了一半**：thesis 問「Q2 EPS 季增僅 1% 是暫歇還是
    IoTRAM 這一段的頂」，**而 Q2 月均 7.88 億 → Q3 前兩月月均 10.68 億 ＝ **+35.5%**，
    加上 8 月 YoY +150.82% —— 營收面強烈指向「暫歇」。**
    ⚠ **但只答了一半：EPS 的另一半是利潤率，Q3 財報未出（約 2026-11）。thesis 維持不變。**
    **→ 通則：月營收不只能否證共識，也能回答 thesis 的爭點 —— 它的頻率是季報的 3 倍，
    所以「等財報」在台股常常是不必要的；但它只答營收那一半。**
    ｜**錨定價 1,045 → 988（-5.45%）。⚠⚠ 並記一個必須避免再犯的不一致：
    本欄原值 1,045 與同日稍早那份報告對不上 —— 該報告寫「相對 2026-09-10 收盤 1,030」，
    sources 另記 wantgoo 2026-09-11 10:35 盤中 984.00。三個數字互不相同，而 state 取了最高的那一個。
    本輪統一到 2026-09-11 收盤 988.00（單一來源、單一時點）。**
    **beta 首次取得 2.08。52 週區間 313–1,305 ＝ 4.17 倍。**
