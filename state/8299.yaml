    (3) **三家同業（慧榮 SIMO、威剛 3260、宜鼎 5289）的倍數一家都沒取得**，副錨沒有錨。
    (4) ⚠ **技術面仍無法判定，但 2026-09-12 起理由有了正確的分母** ——
