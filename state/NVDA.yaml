- accelerator
driver_refs:
- driver: ai-accelerator-demand
  direction: '+'
  note: >
    本檔是這個 driver 的主要成分，也是它的傳導對象 —— 覆蓋清單中唯一「既被研究、又是他檔資料來源」
    的標的。資料中心營收與合計值取 driver 現值，不在本檔複製。方向為 '+' 但內含一個反向成分：
    合計需求若主要由自研 ASIC 貢獻，對 NVDA 是替代而非受惠，見該檔第三條 falsifier（ASIC 占比 >30%）。
- driver: accelerator-roadmap
  direction: '+'
  note: >
    自家平台換代節奏。方向 '+'，但換代爬坡期對毛利率是短空 —— Q3 FY27 毛利率指引由 75.0% 降至
    74.0%，正好是 Vera Rubin 開始出貨的那一季。判讀本檔毛利率下行時，必須先排除「換代爬坡」
    這個暫時性解釋，才能論證它是結構性的定價權問題。這是 thesis 的核心分歧點。
valuation_frame:   # 2026-09-07 首次宣告
  quadrant: Q4
  quadrant_basis: >
    **低資本密集**（fabless，capex 遠低於 15% 門檻，TTM 營收 302.97B）
    × **當期盈餘代表性低**（TTM EPS 7.91 **+125.3%**、營收 **+83.4%** ——
    成長率遠離穩態，單一年度的 EPS 無法代表常態獲利能力）。
    ⚠ **故為 Q4 而非 Q2**：資本密集度是 fabless 的低，不是 hyperscaler 的高。
    Q4 的處方是 EV/Sales 與成長持續期，**forward PE 單獨無意義** ——
    它會隨基準年滾動而大幅跳動，本輪即出現實例（見 excluded）。
  quadrant_since: 2026-09-07
  peer_group: 加速器
  peers:
  - ⚠ **本清單內無同業，清單外亦無真正可比者**（AMD 的資料中心規模與毛利結構差距過大）。
    這是本檔軸④跨不過去的結構性原因，非疏漏
  rank_metrics:
