notes: >
  ⚠ **本檔是覆蓋清單中第一檔「記憶體曝險是量不是價」的標的，這個區別必須寫清楚。**
  MU 與 SNDK 賺的是記憶體**價格**；本檔賺的是封測**服務費，按顆計價**。
  記憶體漲價對 MU／SNDK 是營收，對本檔的客戶是成本 —— 漲價本身進不了本檔的損益。
  本檔受惠的是量：記憶體廠產能滿載 → 封測需求增。
  ｜⚠ 由此導出一個方向可能相反的情形，已寫入 driver_refs：
  **若記憶體漲價的機制是「減產挺價」而非「需求成長」，對 MU／SNDK 是利多、對本檔是利空。**
  這是 memory 這個因子內部第一次出現方向分歧 —— 此前 MU 與 SNDK 的分歧只是「同向但不等深」。
  ｜⚠ **本檔是五檔台股中唯一未處於延伸狀態的一檔**，這在因子集中度已達 66.7% 的清單裡值得記：
  ┌ 現況 PB 對三年區間：8046 為 16.13x／1.40–16.39（頂部）；3037 為 14.0x／1.51–14.99；
  │                      本檔為 3.58x／1.43–4.80（區間 64% 處）
  ├ 技術位階：3008 為 K9 93.38、對 MA20 乖離 +48.7%；本檔的 MACD 的 DIF 與 MACD **雙雙在零軸之下**，
  │           價格在季線之下，距 52 週高 -28.4%
  └ 52 週振幅：本檔 3.3 倍，8046 為 8.0 倍、3037 為 9.5 倍 —— 本檔最小
  ｜⚠ **也因此本檔是五檔台股中第一檔 PE 可直接當錨的**：三年 trailing 區間 6.34–45.12（跨 7 倍），
  而 8046 為 7.82–726.25（跨 93 倍）、3037 因分母趨零而失效。本檔的獲利未在谷底歸零，錨 A 成立。
  ｜⚠ 但代價是資本支出強度：2026 計畫 400 億元對 2025 的 190 億元，capex／營收約 42%，
  **是覆蓋清單最高**。OSAT 本就設備密集（2025 已達 27%），但自 27% 跳到 42% 是明顯加速。
  而營業現金流與自由現金流**完全未取得** —— 這是建檔時最大的空白，也是 thesis 爭點所在。
  ｜與 TSM 的關係要分清：TSM 做 CoWoS 等**晶圓級**先進封裝，本檔是專業封測廠（OSAT）的
  **面板級與記憶體封裝**。兩者不直接競爭，是先進封裝的不同層級。
