  basis: 基本面有真實亮點（Cloud +82%、營業利益翻三倍、backlog $514B 季增逾 50B），但估值上檔幾乎為零 —— 加權目標價 342 相對盤後 339.70 僅 +0.7%，base 情境等於現價。技術面價格卡在 50DMA 之下屬整理，右側確認未成立。不因 Cloud 亮眼給偏多：那已反映在 25.2x 的正常化本益比裡，真正未定的是 205B capex 的折舊尚未開始顯現
