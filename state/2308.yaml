notes: >
  ⚠ **本檔關閉的是 coverage.yaml 記錄過三次的結構缺口**：「清單十三檔中沒有任何一檔屬電力或電源，
  而 NVIDIA 已點名兩家台廠（台達電、光寶科）」。**但關掉一個缺口的同時加深了兩個集中，兩件事都要寫。**
  ｜⚠ **它與 CEG 的差別是本次最重要的分辨，不可因為都叫「電力」就混為一談**：
  **CEG 賣的是電（曝險於用電量，是 capex 落成之後的存量，一座已建成的資料中心即使 capex 歸零仍然耗電）；
  本檔賣的是電源轉換與配電設備（曝險於機櫃出貨與功率密度，是 capex 的流量）。**
  **CEG 對 capex 減速部分免疫，本檔不免疫。** 故本檔用新標籤 `power_electronics`，不沿用 `ai_power`。
  ｜⚠ **但本檔帶進來的分散不是零** —— coverage.yaml 記過：「即使 AI 伺服器出貨量成長減速，
  只要單櫃功耗續升，這條鏈仍有量。這是清單目前唯一一條**與出貨量部分脫鉤**的 AI 受惠路徑。」
  54V → ±400V → 800VDC 的換代由**功率密度**驅動，不由**機櫃台數**驅動 ——
  這與其餘十二檔 ai_capex_hw 的傳導性質不同。
  ｜⚠ **納入當下的估值位置值得記，因為它與前幾檔台股不同**：本檔**不在延伸狀態，而在回檔狀態** ——
  距 52 週高 -30.6%，收盤低於月／季／半年線，僅年線未破，且近期出現兩次單日重挫
  （2026-09-02 -7.24%、2026-09-10 盤中 -5.85%）。對照 3008 納入當日是連續第二根漲停、
  8046 與 3037 納入時 PB 都在三年區間頂部。**在因子集中度已逾三分之二的清單裡，
  新增標的的估值位置比它的產業更值得記 —— 同一個前提失效時，延伸程度決定回檔幅度。**
  ⚠ **但「已經跌很多」不是便宜**：forward PE 仍 35.17x、P/FCF 約 73x，
  且相對最純同業 Vertiv 僅小幅折價，而本檔營益率與 ROE 都低於它。
  ｜⚠ **一個必須先解決才能估值的問題**：AI 營收占比有 40%／逾 25%／逾 50% 三個並存的數字，
  定義與期間都不一致且全為二手轉述。**在確定「AI 那塊有多大」之前，選擇權拆分做不出來** ——
  這也是本輪不建三情境的原因。

