    eps: 9.27
    exit_multiple: 30
    multiple_basis: "錨 A（自身歷史 forward，AI 期間可比）。近 2 年 forward 平均 34.2x、近 1 年 32.2x；5 年平均 40.2x 因跨越 AI 前後不採用。半導體業 forward 中位 30.36x。現況 23.5x（217.55 ÷ 9.27）較近 2 年平均折價 31%。⚠ **2026-08-31 更正一個實質錯誤**：前一版寫「EPS 成長將自 +106% 大幅減速至約 +14%，折價有理」—— **+14% 對不上任何數字**。FY2027 共識 EPS 9.27 的年增率是 **+94.4%**（61 位分析師，前一年約 4.77）；+106% 則是 Q2 單季**營收** YoY，兩者口徑不同不可並列成一個減速敘事。減速的前提根本不成立，而那正是我用來合理化 31% 折價的一半理由。判斷因此自【部分合理】改為【大部分不合理】：管理層 2026-08-26 另給出 FY2028 營收成長約 +70% 的遠期指引，且明言供給受限而非需求上限（黃仁勳：demand is much greater than 70%），該指引遠高於街上原本模型化的約 +44%。一家剛保證下一年還要成長七成的公司，不該用「成長減速」折價。倍數自 28x 提高至 30x，取**半導體業 forward 中位 30.36x 的整數**，仍低於自身近 1 年的 32.2x 與近 2 年的 34.2x —— 保留的折價對應三項真實負面：毛利率因記憶體成本自 74% 滑至 71–72%、自由現金流 127.01B 顯著低於 TTM 淨利（營運資金被爬坡吃掉）、以及季增金額由 146 降至 118 的增量收斂訊號。⚠ 非現價隱含值（23.5x）"
    tp: 278
    narrative: 30x ＝ 半導體業 forward 中位，仍低於自身近 1 年 32.2x。折價自 31% 收斂但未消除，保留的部分對應毛利率、自由現金流與增量收斂三項負面
