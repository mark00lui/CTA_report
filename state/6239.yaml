  #   可講的只有一句可驗證的話：**現價隱含 1,200 億元資本支出全額兌現、且營收擴至約 1,300 億元
  #   並維持當前營益率**。那是門檻，不是估值 —— 已寫成第五條 falsifier。
  # ⚠ **EV／EBITDA 才是本檔理論上最該用的倍數**（它中和折舊與舉債，正是資本密集 OSAT 的痛點），
