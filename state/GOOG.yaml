    「自身歷史 forward 21.8x」。**方向不隨基準年選擇翻轉，故可以給方向（偏貴）。**
  eps_conflict_status: >
    ⚠ **2026-09-10 部分裁決，但未完全解決。** 市面上 FY2027 EPS 至少有三個並存數字：
    **8.90（某彙整稱共識）／11.51–11.53（Zacks）／13.50（本檔採用）**。
    **裁決依據是可觀測值**：現價 328.38 ÷ 公開的 forward PE 24.36 ＝ **13.48**，
    與本檔的 13.50 相符至小數點後一位；**8.90 與 11.51 都無法與該 forward PE 調和**
