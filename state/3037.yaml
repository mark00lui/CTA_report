    (3) 6 月營收年增率本檔 +51.41% 領先景碩(3189) +34.58%、南電(8046) +27.45%。
    ⚠ 加權 -30.6% 是覆蓋清單十三檔中最大的負向估值差距，相對街上 1,220 更低 43.1%
