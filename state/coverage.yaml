  - pair: "⚠⚠ 3211 / 8299 — 不同產業、無業務往來，但它們是 trailing PE 同一個陷阱的兩端"
    added: 2026-09-10
    note: >
      **兩檔在業務上毫無關係（3211 是電池模組、8299 是 NAND 控制器與儲存模組），
