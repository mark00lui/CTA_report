common_premise: "⚠ **2026-09-10 納入 2308 台達電後：19 檔中有 17 檔共用同一前提 —— AI 資料中心資本支出在未來 8 個季度不會出現實質減速。例外仍是 INTU 與 CEG 兩檔，2308 不構成第三個例外（它曝險於 capex 流量，不免疫）。** ⚠ **但 2308 帶進一個前提內部的新結構，值得與 AVGO 那次並列**：AVGO 那次改變的是**方向一致性**（清單第一次出現同一則消息對兩檔方向相反）；**2308 這次改變的是「什麼東西在驅動它」** —— 其餘 12 檔 ai_capex_hw 受惠於**機櫃出貨台數**，**2308 有一半受惠於單櫃功率密度**（54V → ±400V → 800VDC 由功耗驅動）。**即使 AI 伺服器出貨量成長減速，只要單櫃功耗續升，這條鏈仍有量。** 這使它在共同前提失效時的**受傷順序**與其餘標的不同 —— 不是免疫，是**時序與幅度都不同**。⚠ **不可據此把它讀成避風港**：功率密度續升的前提本身也建立在新機櫃持續出貨上，只是脫鉤的那一半讓它的衰退較淺。原註：⚠ **2026-09-08 納入 AVGO 後再改寫：18 檔中有 16 檔共用同一前提 —— AI 資料中心資本支出在未來 8 個季度不會出現實質減速。 ⚠⚠ **2026-09-08 納入 AVGO 後必須補上一句，因為它改變的不是這個前提的覆蓋率，而是它的內部結構：清單第一次出現「同一則消息對兩檔覆蓋標的方向相反」。** AVGO 的 AI 營收**就是**超大規模業者自研加速器的採購金額（FY2026 Q3 為 16.7B、Q4 指引 21.7B，年增 221%）；**若某家 CSP 自研轉外購（改買 NVDA），對 AVGO 是營收減項而對 NVDA 是利多。** 此前 ai_capex_hw 內的十一檔雖深淺不一但方向一致，**故「66.7% 同因子」此後不可再讀成「66.7% 同向曝險」——共同前提仍然成立，但它失效時清單內部的反應第一次不是齊漲齊跌。**這是本覆蓋清單的單一失效點，個股層分析再深也看不見它。** ⚠ **例外現在有兩檔，而兩檔的性質不同，這個區分比數量重要**：(1) **INTU —— 完全不在這條鏈上**（AI 應用端／SaaS）；(2) **CEG —— 在鏈上，但曝險於「存量」而非「流量」**。其餘 15 檔曝險的是 AI 資料中心的**資本支出**（流量）；CEG 曝險的是資料中心的**用電量**，那是資本支出落成之後的**存量** —— **一座已建成的資料中心即使 capex 歸零仍然耗電。** ⚠ **CEG 不免疫**：新的 PPA 仍要等新的資料中心蓋起來，且驅動它估值溢價（對 VST 的 EV/EBITDA 溢價 54.7%）的正是資料中心敘事。**但既有合約的現金流不隨 capex 減速而消失 —— 這是清單上其餘十五檔都沒有的性質，也是 INTU 之後第一個實質的分散。** ⚠ **3030 是第三種性質，但不構成例外**：它在鏈上、曝險於流量，只是**間接**（賣設備給 EMS／PCB／封測廠，受惠於客戶的資本支出決策而非客戶的出貨量），時序與其餘標的錯開，不可套用同一個傳導強度。⚠ 唯一被記錄到的例外需求是主權 AI（見 drivers/ai-accelerator-demand 的 cross_check）—— 其資金來源為主權基金而非企業現金流，對本前提免疫，但覆蓋清單中沒有任何一檔直接曝險於它。"


# ⚠ 6239 力成：**清單中第一檔「受惠於量而非價」的標的，也是唯一未處於延伸狀態的台股。**
# 它同時加深了 ai_capex_hw（64.3% → 66.7%，連四次刷新新高，三分之二的標的共用同一條需求鏈），
# 但它帶進來的東西與前幾次的加深性質不同，三點值得記：
#
# (1) **memory 因子內部第一次出現方向分歧。** MU／SNDK 賺記憶體**價格**，6239 賺封測
#     **服務費、按顆計價** —— 漲價進不了它的損益，它受惠的是**量**。
#     ⚠ 若記憶體漲價的機制是「減產挺價」而非需求成長，對 MU／SNDK 是利多、對 6239 是**利空**。
#     此前 memory 這一格的警告只是「同向但不等深」，現在是**可能反向**。
#     這是清單中第一次在同一因子內部出現方向相反的兩檔。
#
# (2) **六檔台股中唯一未處於延伸狀態的一檔。** 對照：
#       PB 對三年區間：8046 為 16.13x／1.40–16.39（頂部）、3037 為 14.0x／1.51–14.99（近頂部）、
#                      6239 為 3.58x／1.43–4.80（**64% 處**）
#       技術位階：3008 的 K9 93.38、對 MA20 乖離 +48.7%；6239 的 MACD 之 DIF 與 MACD
#                **雙雙在零軸之下**，價格在季線 297.44 之下，距 52 週高 -28.4%
#       52 週振幅：6239 為 3.3 倍，8046 為 8.0 倍、3037 為 9.5 倍 —— 6239 最小
#     ⚠ 在因子集中度已達 66.7% 的清單裡，新增標的的**估值位置**比它的產業更值得記 ——
#     同一個前提失效時，延伸程度決定回檔幅度。
