    ✓✓ **§9b(c) 通過，且本檔是第一個 bull 高於共識最高值的標的**（+7.4%）——
    而高於上緣同樣需要理由，本欄有：「本情境的全部內容就是毛利率結構上移，
    而第五條 falsifier 正是它的直接檢驗」。**bull 是一個可否證的命題，不是一個樂觀的數字。**
    ｜⚠⚠⚠ **§9b(a) 通過，而本檔把 3081／6805 那個形態講清楚了。**
