  changes_if: >
    ⚠⚠ **2026-09-10 —— 本欄記錄一次校準偏差，這是本次重估最該被看見的一件事。**
    **前一版（2026-09-01）寫定的條件是：「或完成 SOTP → 信心升至高」。
    2026-09-10 SOTP 已完成，該條件已滿足。而我沒有把信心升到高。**
    依紀律「條件一旦滿足即執行，不論結果對現有論點有利或不利；若不執行，必須寫明理由，
    而該理由本身將被記為一次校準偏差」——**故在此記為第 1 次校準偏差，不抹除原條件。**
    **不執行的理由**：該條件寫定時，**錨寬度是完全未知的**。本次首度量測得目標價區間
    **39.7%（340–475）**，而 SKILL.md 的 Guardrail 明訂「錨寬度擴大時，即使缺口數量減少，
    信心也不得自動升等 —— 必須明寫『缺口減少但錨變鬆』這個抵銷關係」。
    **兩條事前寫定的規則在此互相衝突**：個股層的 changes_if 說升等，技能層的 Guardrail 說不得升等。
    **我採技能層**，理由是 changes_if 寫定時缺少錨寬度這個輸入，屬資訊不完整下的條件設定；
    但**這個判斷本身可能是錯的，所以它必須留下痕跡而不是被改掉。**
    ⚠ **本欄已改寫為含錨寬度的版本，使同一個衝突不會再發生一次。**
    ——— 以下為改寫後的現行條件（五欄語法）———
    **信心升至高**：FY2027 EPS 多機構估計之高低區間 | 有無且錨寬度 < 25% | 取得且滿足 |
      查得值算數，單一機構不算數 | 賣方報告／Visible Alpha。
      ⚠ **兩個條件須同時成立**（取得共識分布**且**錨寬度收斂），不再只看缺口是否關掉。
    **偏空**：2027 capex guidance 再度上修 **且** Cloud 成長率同時放緩 | — | 同時成立 |
