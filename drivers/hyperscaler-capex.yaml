event_log:
  - date: 2026-09-09
    summary: >
      Google／Blackstone 合資案 Project Braid 多個廠址延誤，交付準時率 50%（三年前 90%）——
      current 745 不動，新增 deployment_friction 區塊；扇出 12 檔，僅 GOOG 判 L1
    delta: >
      **current 745 與四個 components 全部不動。** 本則不是 capex 金額的變動，
      是**承諾與落地之間的摩擦**第一次拿到量化值，故新增 `deployment_friction` 而非改 current。
      事實（Bloomberg 2026-09-09）：Project Braid（Blackstone 投入 **5B**、目標明年 **500 MW**、
      用途為**向客戶出租 Google 的 AI 處理器**）於三處遇阻 —— 某廠址缺**變壓器**（業界等待期近一年）、
      懷俄明州夏安案因 Google 對開發商 Crusoe **失去交付信心**而收回重辦許可且將縮小規模、
      **德州州長凍結新資料中心審查**。高層現認為如期交付機率 **50%**，三年前為 **90%**（tier 推論，
      單一報導引述消息人士，口徑未區分是該 JV 或業界）。執行長 Benjamin Treynor Sloss 稱
      「各據點以不同速度推進非常常見」，**明年 500 MW 目標仍在軌道上**。
      ⚠ **報導明確指出延誤僅涉本合資案，不涉 Google 自有資料中心** —— 這是本次多數標的判 L0 的主因。
      ⚠ **十倍數字錯誤已擋下**：鉅亨網寫「黑石投入 50 billion 美元」，Bloomberg 與所有英文轉載均為
      **5 billion**，採後者；鉅亨另稱「其他 29 處潛在場址」，英文來源僅稱多元廠址選項無數字，未採用。
      這是本倉庫第五次抓到二手中文來源的問題。
      ⚠ **第三條 falsifier 的 evidence 已更新**：再度明確反向，且本次是**實體事由**而非措辭。
      同時登記一個盲點 —— 該條假設「產能受限」是好消息，但若實體瓶頸持續數季，
      「產能受限」會轉化為訂單流失，而該條看不到那個轉化。**不改門檻**，只記盲點。
      ⚠ **一個誠實的計數疑問**：本則是「承諾與落地脫鉤」這條觀察的第三次出現
      （前兩次為 2026-08-27 Alphabet 的供給限制措辭、2026-08-31 NVDA 的「不是想花多少而是能買到多少」），
      **也是第一次帶數字**。但前兩次的瓶頸是**晶片與記憶體**，本次是**變壓器、許可與土地** ——
      **它們可能是兩條通道，而我一直當成一條在數。** 與 notes/2026-09.md 對折現率通道提出的是同一類問題。
      使用者於 2026-09-09 指定併入本檔而非新建 driver。
    fanout: >
      逐檔定級（12 個傳導對象；扇出的價值在於確認每檔都被檢查過，不在於每檔都產生輸出）：
      **L1 — GOOG（唯一一份變更單）**：報告 reports/2026/09/2026-09-09-GOOG-L1-project-braid-delay.md。
        ⚠ **升級的理由不是延誤本身，而是這個 JV 的用途** —— 它是**向客戶出租 Google AI 處理器**的載具，
        正對應 GOOG 那個一直空著的 key_variable `TPU外部採用進展`（tier 缺口、值為 `__`），
        而該變數是 **bull 情境的主要支柱之一**（key_assumption：TPU 外售形成第二成長曲線）。
        本則首次讓該支柱有了**可觀測的交付狀態**，方向偏負。值仍填不出來（無採用數據），
        但信心方向改變，已超出 L0 的「未改變任何 key_variable 的數值或信心」。
        ⚠ **不升 L2**：機率 0pp、目標價 0%；且延誤不涉第一方、CEO 稱 500 MW 在軌道上、JV 僅 5B。
      **L0 — AVGO**：⚠ 這是本次最需要克制的一檔。TPU 由 AVGO 設計，Google 的 TPU 出租載具延誤，
        機制上對 AVGO 是負向。**但瓶頸在廠房不在晶片** —— AVGO FY2026 Q4 指引 21.7B 已在手，
        且本 driver 的 AVGO 條目明載其時滯最短、賺的是加速器本身。廠址延誤不減少已下的晶片訂單。
        未觸及 `AI半導體營收與占比`。記一行。
      **L0 — TSM／3324／6442／COHR／3037／8046（硬體端，direction +）**：
        ⚠ **方向確實與 driver 的 '+' 相反（輸入是遞延而非上修），但量級與機制都不足以動模型。**
        (1) **量級**：單一 JV 5B／500 MW，對照本檔 current 745B —— 低於千分之七。
        (2) **機制更關鍵**：晶片端本就供給受限（NVDA 明言 FY2028 +70% 是供給上限），
            **在供給受限的市場裡，某一個買家的廠房延後不會減少晶片總出貨，只會讓配額轉給別人。**
            這與 capex 金額下修的傳導完全不同 —— 後者減少總需求，前者只改變去向。
        故本則對硬體端是**時序而非總量**的影響，且時序影響落在單一客戶的單一專案上。
      **L0 — MSFT／META（平台端，direction −）**：兩家對本 JV 無曝險，本則不涉其任何揭露。
        ⚠ 唯一的一般性讀出是「實體交付可能是綁定約束」，而那已是既有觀察（見 why_it_matters），
        未改變任何數值。德州凍結**理論上會擴散到其他業者**，但範圍與期限未揭露，無法量化。
      **L0 — GOOG 的折舊通道（與上方 L1 的理由分開記，因為方向相反）**：
        ⚠ 一般而言 capex 遞延 → 折舊延後 → 近端營益率與 FCF **利多**，方向與本檔對平台端的 '−' 相反。
        **但本則不適用該通道** —— JV 的建置成本走 Blackstone 的 5B，**本來就不在 Alphabet 帳上**
        （報導點明 JV 的動機正是降低 Google 直接投入的成本）。
        故本次對 GOOG 的活通道只有 TPU／Cloud 產能那一條，不是折舊那一條。**寫下來以免下次誤套。**
      **n/a — 3017／AMZN**：在 transmission 內但無 state 檔（刻意保留的真實傳導對象）。
      ⚠ **不在 transmission 但必須記一行 — CEG**：**本則對它是方向相反的利多。**
        變壓器交期近一年、德州因**開發商如何負擔電力成本**而凍結審查 ——
        **這兩件事都是「電力與併網是稀缺資源」的直接佐證，而那正是 CEG thesis 的稀缺性那條腿。**
        ⚠ **但本次不為此在本 driver 新增 CEG 條目**：CEG 曝險的是**用電量（存量）**，
        不是**資本支出（流量）**，硬掛進本檔會讓同一個事實有兩個家。
        CEG.yaml 與 coverage.yaml 已兩度寫明正確做法是新增 `datacenter-power-demand` driver，
        **該缺口本次仍未關**，本則使它的優先度上升。
      **不在 transmission（正確）— MU／SNDK／6239／3030／3008／NVDA／INTU**。
