  # 【錨 B-1 現況同業 trailing，同一來源口徑一致】
  #   超豐 2441 **21.09x**（⚠ **力成的子公司**）／力成 34.55x／京元電 2449 35.5x／日月光 3711 43.79x。
  #   ⚠ 力成該欄的 34.55x 對應 TTM EPS 8.22，是較舊的期別；與同業比較時用它才口徑一致，
  #   但與自身歷史比較時應用 cnyes 的 28.11x。**兩個數字不是矛盾，是不同期別的 TTM。**
  # 【錨 B-2 官股金控投顧同一份報告 —— 這是最乾淨的同業錨，同一套方法、同一時點】
  #   日月光 EPS 14.20 × **42x** = 600／力成 EPS 14.26 × **28x** = 400／京元電 EPS 13.89 × **23.8x** = 330。
  #   **力成被放在中間**，高於京元電、低於日月光。
  # ⚠ **前次的 base 18x 低於超豐的 21.09x，而超豐是力成自己的子公司** ——
  #   那不是判斷偏保守，是一個站不住的位置。這是本次上修的直接理由。
  # ⚠ **錨 A 為何會把我帶偏**：3 年平均 16.5x 涵蓋 2023–24，當時力成是純記憶體封測廠，
  #   沒有 FOPLP、沒有 AI 客戶、沒有 TSV，而且**整個封測族群當時都便宜**。
  #   用它當 base 錨，等於把一個已不存在的產業 regime 搬進來。
  #   這正是 valuation.md 的「把歷史平均當答案」那一節：
  #   **現價偏離歷史區間，通常是因為市場相信有東西變了；歷史倍數只在那個變化是暫時的時候才有效。**
  #   同業全體同步重評價，證明那個變化不是力成獨有、也不是暫時的。
  # 【檢查器 1：Gordon 合理 PB =（ROE−g）／（r−g）】2026E ROE ≈ 12.10 ÷ 80 = **15.1%**。
  #   r=9% g=5% → 2.53x（202）／r=10% g=5% → 2.02x（162）／r=11% g=5% → 1.69x（135）。
  #   ⚠ **base 的隱含 PB 3.25x 高於上表全部 —— 這是唯一一個說 base 仍偏高的方法，不可略過。**
  #   ⚠ **折現率未錨定**：本次未取得台灣 10 年期公債殖利率，依 valuation.md 必須明寫
  #   「本節結論對折現率高度敏感」，讓讀者自己打折。r 每差 1pp，隱含價差約 20–40 元。
  #   ⚠ 另一層保留：Gordon 假設穩定狀態，而本檔正在投入 1,200 億元且產能完全滿載，
  #   在建工程尚未貢獻獲利卻已進入淨值分母 —— **它衡量的是今天的力成，不是資本支出要造出來的力成。**
  # 【檢查器 2：P/S】市值 2,226 億元（284 × 約 7.838 億股）÷ 2026 營收預估 998 億元 = **2.23x**；
  #   base 隱含 2.09x。⚠ 同業 P/S 未取得，本項目前只能自我比較，不構成獨立錨。
