    ⚠⚠⚠ **本檔是 §9b(c) 第一次徹底失敗的實例：原 bull 的 100.0 比 FY2027 共識中位 123.18
    低 18.8% —— 若中位數的分析師是對的，結果會比「最樂觀的情境」還好，那麼 bull 描述的
    不是樂觀而是一個低於中位數的世界。原 base 的 88.0 比共識**最低**的 92.20 還低 4.6%，
    甚至低於共識的 FY2026 中位 92.17 —— 模型落後街上約 1.2 年（§9b⑦）。**
    ⚠⚠ **但本檔的悲觀有管理層自己給的機制**：原料佔 COGS 自 45–50% 升到 65%，
    且 Q1 的 49.55% 毛利率是低價庫存的產物。**單季淨利率實績印證：
    Q1 25.61% → Q2 20.86%，掉 4.75pp 而營收幾乎沒動。**
    ⚠⚠⚠ **所以 base 不換成共識中位（那等於用街上的看法回答 thesis 自己的爭點）。
    改採可獨立驗算的路徑：Q2 2026 的 20.86%（唯一的乾淨季度）× FY2027 共識營收中位
    493.41 億元 ÷ 1.1243 億股 ＝ EPS 91.54，而共識最低是 92.20 —— 差 0.72%。
    → 共識下緣本身就是「利潤率不回升」那一格，兩條完全獨立的路徑在 0.72% 之內會合。**
    **三情境因此是：70.0（自 Q2 再往下）／92.20（Q2 就這樣了）／123.18（街上是對的）。**
    ⚠⚠ **本輪還發現一個新型的雙重計算**：同一個觀察（Q2 季減 17.3%）同時壓低了 EPS
    與倍數 —— SKILL 的「序位只調倍數，不調 EPS」只寫了優勢那一側，這是它的鏡像。
    **成本已量化為加權目標價 6.7%（2,005 對 2,139），標出來讓它是已知的保守幅度。**
    ⚠⚠⚠ **而市場自己站在本模型這一邊**：現價對共識中位只有 12.83x forward、
    對共識下緣是 17.14x，而街上的目標價隱含 22.08x。
    **一家毛利率 45%、淨利率 20%+ 的公司以共識中位計只有 12.83 倍 ——
    市場並沒有在為共識中位付錢。這不改變任何數字，但它改變了風險的形狀。**
