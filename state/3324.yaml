- date: 2026-08-31
  level: L1
  summary: driver 扇出（accelerator-roadmap）— Rubin Ultra 散熱方案缺口部分關閉，目標價不變（加權 1,378）
  delta: >
    ⚠ **本次是對同日稍早扇出判斷的修正**：2026-08-31 稍早處理 Rubin Ultra 規格時，我把本檔判為
    L0，理由是「600kW 早已在 current，且時點在 2027 下半、遠在基準年 2026 之外」。
    使用者指出 Rubin 不只影響半導體、也影響液冷與電力，據此再查後確認**當時判太快**：
    600kW 相對 GB300 的 132–142kW 是 4.2–4.5 倍，那不是延續而是換代，且本檔 gaps 裡
    早就記著「600kW 對應何種散熱方案」是關鍵未知 —— 我上一輪等於跳過了自己標記的問題。
    **新事實**：Kyber 600kW 要求**完全液冷、零風扇**，與現行世代不同（GB300 雖已強制液冷，
    輔助元件仍保留氣冷）；機房端為溫水直接晶片冷卻迴路 + CDU，水系統需按每機櫃位數百 kW 設計。
    **對本檔的判讀**：證據指向 direct-to-chip（冷板）路線**延續**而非改採浸沒 ——
    這是好消息，現有水冷板產品線可延伸，不是供應商結構被換掉。gaps 據此部分關閉。
    ⚠ 但未完全關閉：來源措辭有歧義（complete liquid immersion with zero fans 可能指
    「完全液冷」而非字面浸沒），故不寫成定論。
    ⚠ **模型完全不動，且這是刻意的**：三情境、倍數、加權目標價 1,378 全部不變。
    本日稍早才把 base 自 22x 調高至 24x（錨自 B 升級為 A）；同一天再因一則 2027 下半的
    平台消息二度調高倍數，就是 /revalue 警告的「調高 exit multiple 來維持結論」。
    且 Rubin Ultra 時點在 2027 下半，遠在本檔基準年 2026 之外，EPS 不受影響。
    本則改變的是**對 thesis 的信心**（液冷從選配轉標配 —— 下一代要求零風扇，是最強形式的佐證），
    不是任何可計算的數值。
    ⚠ 順帶：drivers/accelerator-roadmap 的第二條 falsifier（下一代單機櫃功耗低於現行世代 ＝
    散熱需求見頂）在 600kW 對 142kW 之下，不僅未觸發且距離更遠。
    ⚠ 共用事實（散熱方案、800VDC）住在 driver 的 thermal_architecture 與 power_architecture，
    不複製進本檔 —— 一個共用事實只能有一個家。
- date: 2026-08-31
  level: L2
  summary: 手動全量重估 — 技術面首次完整取得，錨自 B 升級為 A，加權目標價 1,289 → 1,378（+6.9%）
  delta: >
    **技術面首次完整取得**，本檔自 2026-08-27 建模以來的最大缺口關閉：MA5/10/20/60/120/240
    為 1,118／1,053／1,034／994.5／1,020／981；MACD 的 DIF 39.26 > MACD 22.47、OSC +16.79；
    K9 79.46 > D9 67.01；成交量 871.8 萬股為 20 日均量 2,995 的 2.91 倍；現股當沖率 31.01%。
    ⚠ wantgoo 的指標算在盤中快照 1,205（量僅全日 37%，前收同為 1,140），均線以
    MAn + (1250−1205)/n 精確回補；MACD 與 KD 非線性無法回補，已標明為 1,205 口徑。
    RSI 四個來源皆無，列入 gaps。
    **位階判讀**：價格站上全部六條均線、收在當日最高、量能 2.91 倍、MACD 柱體擴張 ——
    但距 52 週高 1,305 尚有 4.2%，且 MA120(1,020) 仍高於 MA60(994.5)。
    confirm_trigger 兩項只成立「放量」一項，**部分確認不等於確認**，維持中性。
    這是本檔第一次「差一步」而非「無從判讀」，兩者性質不同。
    **錨自 B 升級為 A**：前一版 base 22x 錨在賣方目標價隱含的 24.9x 打折，並自註「取得
    自身歷史分位後應改錨」；本次取得歷年 trailing 本益比（2026 高低 50.35/26.03、
    2025 63.10/22.94、2024 58.71/27.44），2023 的 26.68/9.56 因液冷占比僅 12% 屬結構性
    改變而排除。三年平均 32–35x trailing，以 2026 共識 EPS 57.34 ÷ 近四季 43.75 = +31.1%
    換算 forward 等值 24.8–26.7x；現況 forward 21.80x 落在下緣之下。
    判斷【部分合理但折過頭】—— 折價有理（液冷競爭、2024–25 含題材泡沫讀數），但同期
    基本面在加速：公司上調 2026 營收成長目標自 +50% 至 +70%、液冷占比目標自 35% 提高至
    55%+、Q1 EPS 12.61 創高 YoY +122.79%、泰國二期產能已開出。
    base 22x → 24x（低於歷史平均換算下緣，不取中值）、bull 30x → 32x（錨在 2026 迄今
    trailing 高點 50.35x 換算的 38.4x，未取該值）、bear 15x 不變但改錨到歷史低點。
    ⚠ **循環性檢查自觸發變為不觸發**：8/27 的 base 1,261 對現價僅 +0.88%，本次 1,376 為
    +10.1%。這正是錨升級的價值 —— 賣方目標價會隨股價漂移，股價自 1,080 漲到 1,250 後
    就把 base 拖到現價旁邊；換成自身歷史區間後 base 不再跟著價格走。
    ⚠ 但誠實說：目標價上調是**方法改變**的結果，不是我對基本面看法變好 ——
    好消息本來就已在 8/27 的模型裡。
    **信心自低升至中**：三個並存缺口關閉兩個（均線、錨 A）。第三個（2027 共識，基準年
    無法自 2026 滾動）未關閉，故不到高。
    **基本面補件**：2026 Q1 營收 85.51 億（YoY +93.6%）、EPS 12.61、毛利率 29.66%、
    淨利率 14.8%；補上 2026-06 月營收 27.18 億（+62.13%），填了 4 月與 7 月之間的洞；
    液冷占比 2024 年 12% → 2025Q3 35% → 2026 公司目標 55%+，使第一條 falsifier 的 45%
    門檻首次有了對照（＝比公司目標少 10pp 以上），但仍需等 2026 年報才能驗證。
    ⚠ 新增疑慮：公司上調營收目標與 FactSet 最近一次調查（EPS 58.08 → 57.34，**下修**）
    的日期先後未確認。公司在上調目標而賣方同時在下修 EPS，這個組合值得追查 ——
    與 3037 的情形同構（該檔 2026 共識 18.96 與 H1 實績 11.73 矛盾）。
    機率沿用前值 0.25/0.50/0.25，未重評。
