driver_refs:
- driver: hyperscaler-capex
  direction: '+'
  note: >
    capex → 資料中心內外光互連埠數 → 收發器與光元件需求。領先 2–3 季。
    ⚠ 本檔的傳導強度高於 6442：FY2027 已售罄且長約含 take-or-pay 最低量，
    意味 capex 的短期波動不會立即反映在營收上，反而會先反映在「訂單能見度」與
    「客戶是否行使最低量」這兩件事上。看錯地方會誤判時序。
- driver: ai-accelerator-demand
  direction: '+'
  note: >
    加速器出貨 → 機櫃內外互連埠數 → 800G／1.6T 收發器需求。領先 2–3 季。
    本檔在此條傳導上是**供給受限**而非需求受限 —— 管理層明言 FY2027 的競爭地位
    「由產出產能決定，而非市場准入」。因此該 driver 上修時，本檔的營收上限
    由自有 InP 產出決定，不由需求決定。
- driver: accelerator-roadmap
  direction: '+'
  note: >
    互連規格世代 → CPO 導入時點 → 產品組合與毛利結構。領先 3–4 季。
    ⚠ 本檔是覆蓋清單中**唯一能提供第一手 CPO 時程**的標的（初期營收 2026 年 12 月當季、
    scale-up 於曆年 2027 下半）。6442 與 3008 的 CPO 論點都缺乏可交叉驗證的外部座標，
    本檔補上了這一格 —— 這是納入它的主要研究價值，見 notes。
thesis: 需求已鎖定不是爭點（FY2027 售罄、訂單延伸至曆年 2028、長約含 take-or-pay），瓶頸在自有 InP 產能；爭點是管理層宣稱的 18 個月投資回收期能否轉為自由現金流
thesis_since: 2026-08-27
valuation_base_year: 2027   # FY 截至 2027-06。非預設而是驗證所得：現價 294.37 ÷ FY2027 共識 EPS 9.41 = 31.28x，與報價頁遠期本益比 31.30 對得上
