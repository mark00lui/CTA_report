driver_refs:
- driver: hyperscaler-capex
  direction: '+'
  note: >
    CSP 資本支出 → AI 資料中心機櫃 → **BBU（電池備援模組）**。
    一手佐證：管理層稱「AI 資料中心持續擴建驅動下，以 BBU 為核心的非 IT 業務占比
    **今年首度突破整體營收五成**」；2026-07-29 法說稱「**BBU 需求強勁，下半年營收雙位數成長，
    毛利率重回正軌**」。
    ⚠⚠ **但本 driver 的扇出必須連同一個矛盾一起讀，否則會把敘事當成事實**：
    **Q2 2026 的非 IT 產品營收占比實際上降到 25%–30%，而 Q2 的營收成長來自 IT 產品。**
    **管理層的說法與該季的數字方向相反 —— 這是本檔的 thesis 本身。**
    ⚠ **且 Q2 利潤率收縮的原因由管理層自己指名為「BBU 某一機種客戶拉貨低於預期」——
    亦即 BBU 這條線目前是塊狀的、由單一機種主導，不是一條平滑的成長曲線。**
    **扇出時不可把 driver 上修直接換算成該檔的營收或毛利率。**
- driver: ai-accelerator-demand
  direction: '+'
  note: >
    加速器出貨 → 機櫃數 → 每櫃的 BBU 數量。
    ⚠ **敏感度記「中」而非「高」，理由是占比**：**非 IT 占比在 Q2 僅 25%–30%，
    另外七成仍是 IT（筆電等）電池模組，不受本 driver 影響。**
    ⚠⚠ **而本檔對本 driver 有一個與其餘硬體標的不同的性質：BBU 的單位價值取決於機櫃功率，
    不取決於加速器顆數。** **同一批加速器裝進不同功率密度的機櫃，BBU 的需求量差很多 ——
    真正的傳導變數住在 `accelerator-roadmap`（功率密度）而不是本 driver（出貨量）。**
    **本檔刻意不引用 `accelerator-roadmap`，理由見 notes：其產品規格與機櫃功率的對應關係
    本輪完全未取得，引用它會是一個我無法驗證的宣稱。**

valuation_frame:
  quadrant: Q4
  quadrant_basis: >
    **X 軸（當期盈餘代表性）＝ 低，而本檔的方向與本日其餘十一檔相反：分母被壓縮而不是被膨脹。**
    **Q2 2026 EPS **1.35 元**（季減 34%、**年減 65%**）；H1 累計 **3.4 元**（**年減 31%**）；
    TTM EPS **7.41 元**（對照 2026 Q1 當時的近四季 9.92 元）。**
    **毛利率單季自 Q1 的 **20.0%** 下滑到 Q2 的 **13.8%**（H1 為 16.9%）。**
    ⚠⚠ **而管理層自己把 Q2 的利潤率收縮指名為「BBU 某一機種客戶拉貨低於預期的短暫衝擊」——
    亦即公司自己也認為當期盈餘不具代表性。**
    ⚠ **加上業務組合正在轉型中**（非 IT 占比 Q2 為 25%–30%，管理層預估全年首破五成），
    **當期分母描述的是轉型的中途，兩端都不是。**
    ｜**Y 軸（資本密集度）＝ 低。** ⚠ **實際 capex／營收 與折舊占營收比重皆未取得（列 gaps）。**
    判低的依據是業務模式：**電池模組設計與組裝，電芯外購。**
    佐證：股東權益週轉率約 **1.66 倍**（TTM 營收約 149.0 億元 ÷ 淨值約 89.6 億元）。
    ⚠⚠ **但這一格有一個必須單獨講的東西：A7 土地。**
    **管理層於 2026-05 法說稱「A7 土地潛值逾百億」，而本檔的帳面淨值僅約 89.6 億元 ——
    亦即那塊土地的宣稱潛在價值超過整個帳面淨值，也接近市值 566.3 億元的兩成。**
    **它是一筆不在營運損益裡、也不在帳面價值裡反映的資產。**
    ⚠ **但它不改變 Y 軸的判定**：**Y 軸量的是營運的資本密集度（capex／營收），
    而 A7 是歷史遺留資產不是營運資本支出。土地不會讓組裝業務變成資本密集。**
    ｜⚠⚠ **結論：低 X ＋ 低 Y ＝ Q4（營收與選擇權）。**
    **而這是本日十二檔中第一次 Q4 的預設處方不但適用、還是「選擇權拆分」那一半適用。**
    **valuation-map 對 Q4 的主錨寫的是「EV/Sales、**選擇權拆分**」——
    本檔的 A7 土地正是一個不貢獻營收的價值主體，與 3008 被記為
    「價值主體是尚未貢獻營收的 CPO 選擇權」同型，只是這裡的選擇權是土地不是產品。**
    ⚠ **對照本日前十一檔：2345 我推翻了 Q4 的主錨、AAOI 與 3081 的 Q3 兩個主錨都不能用、
    8299 是分類軸沒有覆蓋到、6805 的整體市營比被禁用 —— 本檔是第一次處方直接用得上。**
