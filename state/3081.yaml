    而本檔是相反的極端：帳面價值相對股價小到已經失去解析度。**
    **56 倍的 PB 不是「貴」的訊息，是「這把尺量不到東西」的訊息。**
    ｜**禁用中週期正常化 EPS** —— **Q2 EPS 創 39 季新高**，
    **用過去約十年的獲利水準去正常化，等於用一家產品類別已經改變的公司的舊身分去估它。**
    **那不是保守，是套錯框架。**
    ｜⚠⚠ **兩者合起來的意思是：本檔雖然判在 Q3，但 Q3 的處方對它幾乎全部失效。**
