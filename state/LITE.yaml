# 公開研究檔 — 本倉庫不含任何倉位資訊：無成本、無數量、無權重、無 Kelly、無損益、無持倉揭露。
# 未知值一律留 __ 並寫進 gaps，不要填看起來合理的數字。
#
# ⚠⚠ 建檔當下最重要的一件事，寫在最前面，因為它同時修正了本倉庫既有的一個錯誤判讀：
#   **本檔 FY2026 的 GAAP 淨損 -69.35 億美元是「一次性、非現金的債務清償費用」，
#     不是營運虧損。同期營業利益為 +5.362 億美元、非 GAAP 毛利率 50.4%。**
#   ⚠ 而 state/COHR.yaml 於 2026-09-07／09-10 兩度把本檔描述為
#     「虧損公司」「其 forward PE 建立在虧轉盈的預估上」「虧損公司的高轉換率是算術不是品質」——
#     **那個前提是錯的，已於同日一併更正 COHR 檔。**
#   **教訓：把 GAAP 淨損直接讀成營運惡化，是本輪第一次犯，而它影響的是另一檔的 base 錨。**
