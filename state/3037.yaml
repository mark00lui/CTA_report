    但同日 8/28 外資逆勢買超 367.3 萬股 —— 外資與散戶對本案的判讀相反，這個分歧本身是資訊。
    ⚠ 本格刻意不寫進 thesis：公司與外資都稱限於 36% 的 PCB 段，把三天前的事件當成論點
    會過度加權；但它是第一條 falsifier，且是本檔目前最可能改變一切的單一變數。
