    「若輸入取得但同業離散過大，退路是什麼」。沒有退路的主錨是一個還沒被檢驗的希望。**
    ｜⚠⚠ **禁用整體市營比／EV-Sales 作為主錨**（建檔時即禁用，維持）——
    **本檔是兩門生意（AI 伺服器 55.7%、消費電子約 44.3%），倍數結構完全不同。**
    **整體市營比（錨定價下為 9.38）套上去等於用液冷的倍數買轉軸、或反過來。**
    ｜⚠⚠ **禁用 3324 與 3017 的倍數作為任何一個情境的錨** —— 它們在覆蓋清單內。見 notes。
    ｜⚠⚠⚠ **2026-09-11 新增：禁用 PB ÷ 每點 ROE 用於盈餘趨零的同業。**
    **三步判準第一步說「盈餘趨零 → 改用 PB 或 PS」，但那個退路不完整 ——
    PB ÷ 每點 ROE 的分母也是 ROE，所以對盈餘趨零的同業同樣爆掉：
    新日興的 PB 僅 2.44（便宜）卻算出 1.435（看似很貴）；兆利的 PB 僅 0.93 卻算出 2.325。
    兩個數字都只是分母趨零的產物。這類同業只能用絕對 PB 或絕對 PS 比，
    而那只回答「資產值多少」，回答不了「盈餘值多少」。**
    ｜⚠⚠⚠ **2026-09-11 新增：禁用中週期正常化。** 理由是本輪建立的判準④ ——
    **年度 EPS 序列嚴格單調遞增（FY2021 9.29 → 9.33 → 10.18 → 17.90 → FY2025 31.00，
    沒有任何下折年），年複合成長率 FY2021→FY2025 為 35.2%、FY2022→FY2025 為 49.2%。**
    **TTM 46.75 ÷ 五年平均 15.54 ＝ 3.01 倍，而那個倍數反映的是成長不是循環位置。**
    ｜⚠ **禁用 forward-DCF** —— Q4 象限處方明文。成長持續期只做 reverse。
    ｜⚠ **禁用 PEG** —— valuation-map 明列「PE ＋ PEG」是**假的**交錯驗證。
    ｜⚠ **禁用「自身歷史 PE 分位」作為唯一錨** —— 軸④的典型失效；
    **且本檔的營收組合在一年內自 19.2% 翻到 55.7%，與更早期的自身不是同一門生意。**
    ｜⚠ **禁用 PB 與資產法** —— 股價淨值比 **17.97**，價值不在資產負債表上。
    ｜⚠ **禁用把月營收年增率的減速直接讀成動能轉弱** ——
    **去年那條線是往上斜且後段加速的（2025 年 7、8 月自約 9 億跳到 11.6–11.8 億）。**
    ｜⚠⚠ **2026-09-11 新增：禁用 Yahoo 基本資料的「淨利率」欄位當稅後淨利率。**
    **它列 2026 Q2 淨利率 28.76%，而營益率是 27.90% —— 稅後高於營業，在沒有大額業外時不合理。
    由 EPS 反推：Q2 稅後淨利 12.39 × 0.685539 億股 ＝ 8.494 億元 ÷ 營收 37.39 億元 ＝ 22.72%；
    H1 同樣算法為 17.66 ÷ 79.22 ＝ 22.29% ✓ 一致。
    22.72 ÷ 28.76 ＝ 0.79，恰與約 20% 稅率相符 → 該欄位實為稅前純益率。
    直接拿它當稅後淨利率會高估 27%。**
  reviewed: 2026-09-12

thesis: "爭點是 55.7% 的伺服器營收占比是結構性台階還是專案週期的高點"
thesis_since: 2026-09-10
# ⚠ 只留爭點，前提移入 key_variables 與 notes（LITE 那輪的教訓，AXTI 起沿用）。
#   前提（已確立、不是爭點）：**轉型已經發生** ——
#   AI 伺服器相關應用占比自去年同期 19.2% 拉升到 55.7%，正式成為最大營收來源；
#   H1 2026 稅後純益 17.66 億元（年增 +157%）、EPS 25.77 元；
#   2026 前 8 月累計營收 108.12 億元（年增 49.81%）。
#   ⚠ **為什麼爭點是「台階還是高點」**：
#   **Q2 營收季減 10.08%，管理層的解釋是「手機與伺服器新舊產品交替」——
#   亦即這是一門按專案計的生意，營收天生是塊狀的。**
#   **55.7% 可能是新的基準線，也可能是某一批專案同時出貨的峰值。**
#   **而液冷快接頭產能已逼近滿載，代表這個占比短期內沒有向上的空間 ——
#   下一個變動只能是向下或靠擴產。**

