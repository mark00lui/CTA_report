    本檔 PB 24.61／ROE **54.6%**（三家最高）→ **0.451**，落在兩者中間。**
    **→ 參照軸給得出有界讀數，只是給不出點估計（兩端差 7.3 倍，而現價明顯靠建準那一端）。**
    ⚠ **這是本輪第一次「錨不能用」的結論被後續資料推翻，原因很具體：
