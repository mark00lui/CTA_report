ticker: 3008
name: 大立光
market: TW
factor_tags:
- optical
- cpo
- consumer_optics
thesis: 三日 +28% 定價的是 2027 年中才放量、當前營收為零的 CPO；核心鏡頭 7 月已轉年減，爭點是新舊引擎能否接上
thesis_since: 2026-08-27
valuation_base_year: 2026   # ⚠ 該年 EPS 共識 190 元裡不含任何 CPO 貢獻，而本檔的一切都關於 CPO —— 模型結構與論點對不上。2027 共識查無，滾動時點為 Q3 財報（約 2026-10）

scenarios:
  # ⚠ 本檔的分歧幾乎全部由倍數承載：17x 到 45x 是 2.6 倍，而 EPS 區間只有 ±9%。
  # 這不是刻意放大，是基準年不含 CPO 的必然後果 —— CPO 的價值進不了 2026 的 EPS，
  # 就只能塞進倍數。結果是本模型對倍數假設極度敏感，可靠度低於清單其他標的。
  # 在 2027 共識出來之前，本檔的估值只能做到這個精度。
  bear:
    p: 0.25
    p_basis: 機率由使用者於 2026-08-27 全量重估指定。7 月單月營收已年減 10.66%（達第二條 falsifier 的單月門檻），且 Q2 EPS 環比自 46.63 降至 35.72
    key_assumption: CPO 試產或驗證遞延；核心鏡頭年減擴大。倍數回到 CPO 題材發酵前的水準
    eps: 175.24
    exit_multiple: 17
    multiple_basis: "最強的一種 bear 錨 —— 市場實際付過的價：2026-04-22 為 16.3x、2026-06-09 為 16.8x，即 CPO 題材發酵前的定價。這不是推論，是三個月前的事實"
    tp: 2980
    narrative: 17x 不是我設的，是市場三個月前實際付的價（2026-04-22 為 16.3x、06-09 為 16.8x）。CPO 若證偽，回到那裡有前例
  base:
    p: 0.50
    p_basis: CPO 首張訂單、規格文件、7 月送樣與今年四度購地都是已發生的動作；但 CPO 於 2026 年內不貢獻營收，故 EPS 用共識中位
    key_assumption: 共識達成；CPO 依指引推進但尚未貢獻營收；倍數維持現況
    eps: 190.00
    exit_multiple: 36.4
    multiple_basis: "⚠ 無獨立估值基礎（依 references/valuation.md，signal.conviction 上限為低，本檔已符合）。錨 A 自身歷史失效且不可得：一是台股報價頁 JS 渲染取不到分位，二是更根本的——本檔正自手機鏡頭切入 CPO，歷史區間描述的是另一個商業模式。錨 B 同業平均 106.14x 明顯是題材股拉高的結果，直接使用等於把族群的樂觀當基準。錨 C reverse-DCF 是本檔最該用的方法：現價 6,915 對不含 CPO 貢獻的 base EPS 190.0 為 36.4x，而 bear 情境證明市場三個月前只願付 17x —— 兩者的差額即市場對 CPO 的隱含定價，約每股 3,700 元。把那個數字算出來，比爭論 36.4x 貴不貴有意義得多。⚠ 尚未完成 CPO 貢獻的獨立估算，故 base 仍採市場定價"
    tp: 6915
    narrative: 36.4x 為現價隱含值，非獨立判斷。市場對 CPO 的隱含定價約每股 3,700 元（36.4x 與題材前 17x 的差額）
  bull:
    p: 0.25
    p_basis: 需要 CPO 如期 Q3 試產且 FAU 獲證實。與 bear 對稱
    key_assumption: CPO 如期 Q3 試產、FAU 獲證實，2027 放量能見度提高；倍數再擴張以反映尚未入帳的 CPO
    eps: 208.64
    exit_multiple: 45
    multiple_basis: "⚠ 三情境中唯一「比街上樂觀」之處：45x 高於街上目標隱含的 27.5x。理由是街上目標價停在 2026-07-27、未反映其後的兩根漲停 —— 依 valuation.md，用過期的賣方目標價當保守參照是已知的自欺模式，此處方向相反但同源。這是本模型最脆弱的假設"
    tp: 9390
    narrative: ⚠ 45x 高於街上目標隱含的 27.5x，是三情境中唯一「比街上樂觀」之處。理由是街上目標價停在 2026-07-27、未反映本週兩根漲停 —— 但這也是本模型最脆弱的假設
  weighted_tp: 6550

