    (b) 伺服器那一半 —— 液冷快接頭的終端架構集中。**
    **兩邊都是「單一客戶或單一架構」的曝險，而需求全對時這條仍可能單獨發生。**
    **CEG 那一輪教會的事是：一檔標的若只有一條失效模式，通常是我只找到一條。**

