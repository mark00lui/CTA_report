    **季線距現價僅 0.02%、當日振幅 2.64%（距離約日振幅的 1/132）；
    昨天 3661 是 0.30% 對 3.47%（約 1/12）。兩次就是模式不是巧合。**
    **我在 AXTI 那檔提出的規則現在應正式寫成雙邊的：invalidation 需與日波動幅度相稱 ——
    太遠（> ±20%）不是失效價位，太近（< 約一個日均振幅）也不是。**
    ⚠ **本檔的 invalidation 留空而 3661 有填**：那一檔加上「連續三日」還救得回來，
    **本檔只差 0.02%，三日內雙向穿越好幾次是常態。**
    ｜⚠ **本檔是本日第一檔在建檔時就主動套用「先看去年那條線的形狀」判準的**
    （昨天由 3017／3081／3661 三檔一起得出）：
    **2025 年 1–3 月往上斜、4 月後持平，故 2026 年 1–3 月的年增率被放大過，
    第一條 falsifier 因此改用月增率。判準寫下來的隔天就用上了。**
    ｜⚠ **另記一件與昨天結論相反的事：wantgoo 的市值本次完全正確**
    （4,611.3 億元 ÷ 2,085 ＝ 2.2116 億股，乘回本益比與股淨比都對得起來）。
    **本日前三檔都少一個數量級、3661 是股數口徑差約 6% ——
