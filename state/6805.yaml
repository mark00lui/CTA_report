    **`multiple_basis` 寫「先確認不是抄現價：現價隱含 2,190 ÷ 72 ＝ 30.4 倍，取 26 倍，
    是自隱含值下調 14.5%」—— 而 72 × 26 ＝ 1,872 與 2,190 × 0.8548 ＝ 1,872 是恆等式，
    EPS 完全消去。**
