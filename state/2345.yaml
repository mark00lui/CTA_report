#       超大型 CSP，FY2025 營收 **+125%**、2026 前 8 月累計 **+61.86%**。
#       ⚠ **與同日建檔的 3533（我拒絕標這個因子）對照著看**：那裡是「看起來像但證據不支持」，
#       **這裡是證據支持。同一個標籤，兩個相反的判斷，理由都寫在各自的檔案裡。**
#   (2) ⚠⚠ **判 Q4 而非 Q1，理由不是盈餘有問題，是成長率遠離穩態。**
#       EPS 序列 FY2025 **47.13** → 2026 共識 **73.8**（Factset），營收兩年內近三倍。
#       **valuation-map 對 NVDA 的處理正是同一個道理：資產輕（Q4 而非 Q2），
