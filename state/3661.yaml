    ⚠ **分母沒有趨零也沒有為負**：TTM EPS 約 **66.06 元**（由本益比 59.11 × 現價 3,905 反推）、
    Q1 2026 EPS **17.55 元**、Q2 **20.01 元**。
    ⚠⚠ **它落在極低代表性，是因為分母在同一年之內移動了一個數量級**：
    **月營收年增率 1 月 -56.07 → 2 月 -77.08 → 3 月 -46.57 → 4 月 -32.31 → 5 月 -33.45
    → 6 月 +15.39 → 7 月 +181.78 → 8 月 +273.61%；
    累計年增率自 -67.11% 翻正到 +13.58%。**
    **單月營收 2 月為 8.27 億元、8 月為 87.76 億元 —— 相差 10.6 倍。**
    ⚠⚠ **而毛利率同時在反向移動**：Q1 2026 毛利率 **50.16%**（單季歷史新高，
    季增 +7.86pp、**年增 +27pp**），**但那是 NRE 高峰的產物**；
    **Q2 營收季增 +82.6% 而稅後淨利只季增 +14.9% —— 淨利率自約 34.8% 壓到約 21.4%。**
    **亦即營收與利潤率正在朝相反方向走，任何 trailing 數字都同時抓錯兩件事。**
    ｜**Y 軸（資本密集度）＝ 低（依業務模式判定），但這一格有一個必須寫明的保留。**
    ⚠ **實際 capex／營收 未取得（列 gaps）。** 判低的依據是業務模式：
    **無廠 IC 設計服務，主要資產是人與 IP，晶圓製造與封測皆委外。**
    ⚠⚠ **但保留在這裡**：**每股淨值 678.47 元、股淨比 5.76 —— 淨值相對股價並不薄；
    以推算股數估，股東權益週轉率僅約 0.56 倍**（對照同日 2345 的 5.07 倍）。
    **這代表資產負債表比「無廠」這個標籤所暗示的重得多，
    合理的解釋是量產業務需要大額的晶圓預付款與存貨。**
    ⚠⚠ **亦即：valuation-map 的 Y 軸用 capex／營收 衡量，
    但對本檔而言真正的資本密集來源可能是營運資金而不是資本支出。**
    **量產放量會吃掉大量營運資金，即使 capex 很低。這一點在 /revalue 時必須單獨查。**
    ｜⚠⚠ **結論：低 X ＋ 低 Y ＝ Q4（營收與選擇權），與同為無廠的 AVGO 一致。**
    **而 `state/AVGO.yaml` 已經記載 Q4 的預設主錨（EV/Sales）在這個族群失效
    —— 本檔失效得更徹底，理由見 methods。**
