  direction: '+'
  note: >
    capex → 資料中心內外光互連埠數 → 收發器與光元件需求。領先 2–3 季。
    ⚠ 同上，transmission 尚未回指本檔，須於下次 `/driver` 補上。

valuation_frame:   # 2026-09-10 建檔時宣告
  quadrant: Q4
  quadrant_basis: >
    **低盈餘代表性 × 資本密集度在門檻上（判準逐項指名數值）。**
    ・**X 軸（盈餘代表性）＝ 低，且是最極端的一種**：
      **GAAP EPS 為 -92.96，分母為負，任何本益比在 trailing 口徑下直接無定義。**
      營收軌跡 1,713（FY22）→ 1,767 → 1,359 → 1,645 → **3,014（FY26，+83.22%）**，
      **且 Q4 FY26 單季 +109%**；營業利益自 FY25 的 **-192.2** 轉為 FY26 的 **+536.2**。
      **成長率與利潤率都遠離穩態，且剛經歷一次符號翻轉。**
    ・⚠⚠ **Y 軸（資本密集度）＝ 恰好卡在門檻上，這一格必須寫清楚，不可四捨五入帶過**：
      **capex／營收 ＝ 451.3 ÷ 3,014 ＝ 14.97%**，
      **距 valuation-map 的 15% 門檻只差 0.03 個百分點。**
      FY2025 為 231 ÷ 1,645 ＝ **14.04%**，同樣貼線。
      其餘判準指向低資本密集：**D&A／營收 8.78%**（264.5 ÷ 3,014）、
      **淨現金 +10.7 億美元**（市值 887.1 億 − EV 876.4 億）、
      **自由現金流 +3.001 億且自 FY25 的 -1.047 億轉正**（FCF 利潤率 9.96%）。
      **綜合判 Y ＝ 低，但這是「低的那一側，且離線只有 0.03pp」——
      下一輪 capex 若再增，本檔會落入 Q3，屆時整套方法要換。這是必須每輪重問的一格。**
    → **低代表性 × 低資本密集 ＝ Q4 營收與選擇權象限。**
    ⚠ **與 COHR 同象限，而這是應該的** —— 兩者是直接同業、同一條需求鏈、同樣的
    「獲利尚在正常化途中 + 價值有一部分在尚未貢獻營收的新產品上」結構。
    **若兩檔被判進不同象限，那才需要解釋。**
  quadrant_since: 2026-09-10
  peer_group: 光通訊／CPO
  peers:
  - COHR Coherent — ⚠ **覆蓋清單內的直接同業**。as-of 2026-09-09：
