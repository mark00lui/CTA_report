  改為 10.20 後 bear 才誠實，但代價是模型的整個下檔被壓縮。
  **根本原因是基準年：2026 已過三分之二，能出錯的空間所剩無幾。
  真正的下檔在 2027（1,200 億元資本支出的折舊全額入帳的第一年），而 2027 共識未取得。
