    **直接加總（1.08 ＋ 2.07 ＋ 3.44 ＋ 4.62 ＝ 11.21）高估 5.7%；
    還原至 1.01769 億股後為 **10.61**（＝ TTM 淨利 10.80 億元 ÷ 1.01769 億股）。**
    **推導：Q2 淨利 ＝ 4.62 × 1.01769 ＝ 4.702 億元（÷ 營收 12.21 ＝ 淨利率 38.5% ✓ 與法說一致）；
    法說 H1 EPS 7.75 × 1.01769 ＝ 7.887 億元 → Q1 淨利 3.185 億元 ÷ 3.44 ＝ 0.9259 億股
    ＝ 1.01769 ÷ 1.10 ✓✓✓**
    ⚠⚠ **而這一個原因同時關閉了建檔時記下的全部四個 TTM EPS 歧異**：
    **11.56 與 11.80 都是未還原的（偏高）；法說的 7.75 是還原後的 H1（正確）；
    財報狗／wantgoo 的 8.06 是未還原的季加總（偏高 4.0%）。**
    ⚠⚠⚠ **規則：股票股利汙染兩個地方 —— 均線，以及季 EPS 加總。現金股利只汙染均線且程度小
    一個數量級（6805 配現金 12.5 元，均線偏誤 ≤0.60%、EPS 加總無誤差；本檔配股票 1 元，
    均線偏誤 ≤6.2%、EPS 加總誤差 5.7%）。**
    **季 EPS 加總的誤差沒有任何外觀異常 —— 唯一的檢驗方法是用淨利（股數無關）反推。**
    ｜⚠⚠⚠ **2026-09-11 新增第三項：禁用「自己的 forward 倍數對同業的 trailing 倍數」。**
    **本檔實測：不對稱口徑（本檔 2027 滿載市營比 18.5 對 2455 的 trailing 24.12）→ 便宜 23%；
    同口徑（兩邊都 trailing：72.4 對 24.12）→ 貴 3.00 倍。同一對標的，結論反向。**
    **這是本日第三個「口徑不對稱製造假結論」的實例（前兩個為 6805 的 Yahoo「淨利率」實為稅前、
    以及同業 trailing PE × 自己 forward EPS 會把成長算兩次）。**
    ｜⚠⚠ **禁用 PB** —— 股價淨值比 **55.48**、每股淨值僅 **51.01 元**。
    **本檔是 valuation-map 對 PB 的警告的相反極端：帳面價值相對股價小到已經失去解析度。
    55 倍的 PB 不是「貴」的訊息，是「這把尺量不到東西」的訊息。**
    ｜⚠⚠⚠ **禁用中週期正常化 EPS，而 2026-09-11 確認兩種失效原因同時命中，且性質不同**：
    **(a) 算術失效 —— FY2022–FY2025 四年中有兩年虧損（FY2023 -2.31、FY2024 -0.59），
    四年平均 1.343 元沒有經濟意義；一個跨越零的序列，算術平均不代表任何「常態」。
    (b) 經濟失效 —— Q2 EPS 創 39 季新高，歷史屬於一家產能規模與產品類別都不同的公司。**
    **把兩種分開記是有用的：(a) 可以換方法補救（用營收或淨值正常化），(b) 不能。**
    ⚠ **參考值：TTM（還原）10.61 ÷ 四年平均 1.343 ＝ 7.90 倍，仍是本輪最極端
    （原記 8.37 倍；震盪組第二名為 8299 的 6.93 倍）。**
    ｜⚠ **禁用 DCF** —— Q3 處方明文；且 capex 現值未知使自由現金流無法估。
    ｜⚠ **禁用 PEG** —— Q3 處方明文；且成長率遠離穩態。
    ｜⚠ **禁用 trailing PE 單獨作結論** —— **266.7x**，分母是一個剛剛改變的東西。
  reviewed: 2026-09-11

thesis: "爭點是 2.5 倍自我擴產之後，57% 的毛利率還撐不撐得住多波長的溢價"
thesis_since: 2026-09-10
# ⚠ 只留爭點，前提移入 key_variables 與 notes（LITE 那輪的教訓，AXTI 起沿用）。
#   前提（已確立、不是爭點）：**量是真的，而且沒有基期助力** ——
#   月營收年增率單調上升（3 月 +89.35% → 8 月 +180.90%），
#   **而 2025 年同期每月都在 1.81–1.85 億元之間、幾乎是平的，所以加速不是基期造成的。**
#   ⚠ **為什麼爭點是率不是量**：**本檔自己就是新供給的主要來源。**
#   **2027 產能 2.5 倍意味著市場上多波長 CW 雷射的供給主要由它自己增加 ——
#   若需求跟得上，是規模效益；若跟不上，壓價的人就是它自己。**

