# 公開研究檔 — 本倉庫不含任何倉位資訊：無成本、無數量、無權重、無 Kelly、無損益、無持倉揭露。
# 未知值一律留 __ 並寫進 gaps，不要填看起來合理的數字。
#
# ⚠⚠ 建檔當下最重要的五件事，寫在最前面：
#   (0) ⚠⚠⚠ **代號風險先寫在最上面：INTC 是 Intel，INTU 是 Intuit，而 INTU 已在覆蓋清單內。**
#       **兩者差一個字母，且同為美股科技股。本倉庫第四次遇到代號近似的風險**
#       （前三次：3413／京鼎、3221 台嘉碩／3211 順達、Aiptek 天瀚／6531 愛普）。
#   (1) ⚠⚠⚠ **本檔是連續十三檔之後第一次真的跨過層級軸，而原因是我這次去查了合併資產負債表。**
#       **而一查就發現它是本檔最關鍵的數字：非控制權益 **$15.60B**，
#       占股東權益 $103.14B 的 **15.1%** ——
#       亦即 Intel 的晶圓廠有相當一部分的經濟利益不屬於母公司股東。**
#       **公司並指引 2027 與 2028 的非控制權益各約 **$1.1B／年**（GAAP）。**
#   (2) ⚠⚠⚠ **Foundry 部門單季虧 $2.1B，而全公司單季淨利只有約 $2.2B
#       （EPS $0.42 × 5.25B 股）—— 產品端賺的約 $4.3B，被 Foundry 吃掉一半。**
#       **而 Foundry 的外部客戶營收只有 **$293M**，約該部門營收 $5.8B 的 **5%**。**
#   (3) ⚠⚠⚠ **trailing PE 是 n/a（TTM EPS -$2.30），forward PE 是 60.13，
#       而 EV/Sales 是 9.88 倍。三把尺，而它們之間的落差就是 thesis。**
#   (4) ⚠⚠⚠ **本檔是「擴建型 Q3」的第四例，也是最極端的一例；**
#       **但它同時揭露了「中週期正常化」的**第三種失效方式**：
#       不是沒有中週期，是那個中週期屬於一家已經不存在的公司。** 見 notes。
