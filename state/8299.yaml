thesis: "爭點是 65.31% 毛利率有多少來自存貨與現貨價的時間差，而非議價能力"
thesis_since: 2026-09-10
# ⚠ 只留爭點，前提移入 key_variables 與 notes（LITE 那輪的教訓，AXTI 起沿用）。
#   前提（已確立、不是爭點）：**營收與獲利的規模是真的** ——
#   2026 前 8 月累計營收 1,642.93 億元（年增 278.99%）、環比連續八個月為正、
#   Q2 四項全部創單季歷史新高、近四季 EPS 218.14 元創 40 季新高。
#   ⚠ **為什麼爭點是「來源」而不是「會不會降」**：
#   **毛利年增 752.8% 遠高於營收年增 279.5% —— 獲利的增幅主要來自率而不是量。**
#   **而一個模組與控制器廠的毛利率一年內移動 36.25 個百分點，
#   絕大部分只能是存貨與現貨價的時間差。**
#   **時間差會結束，而它會不會結束不是爭點 —— 它有多少、還剩多久，才是。**

