thesis: "爭點是 Q2 EPS 季增僅 1% 是暫歇還是 IoTRAM 這一段的頂"
thesis_since: 2026-09-10
# ⚠ 只留爭點，前提移入 key_variables 與 notes（LITE 那輪的教訓，AXTI 起沿用）。
#   前提（已確立、不是爭點）：**規模成長是真的** ——
#   2026 前 8 月累計營收 65.99 億元（年增 109.13%）、8 月單月年增 150.82%、
#   H1 EPS 8.33 元、Q1 毛利率 46% 與去年同期持平。
#   ⚠ **為什麼爭點是季增而不是年增**：
#   **Q2 的營收季增 +12.6% 而 EPS 只季增 +1% —— 單季淨利率自約 32.2% 降到約 28.8%。**
#   **年增 +224% 描述的是一年前的低基期，季增 +1% 描述的是現在。**
#   ⚠⚠ **而這件事之所以重要，是因為下一段要等很久**：
#   **VHM 與 VHMStack 的全面量產時程延伸至 2027–2028。**
#   **若 IoTRAM 這一段已經到頂，中間就有一段 18–30 個月的空白，而現價是 57.61 倍。**

