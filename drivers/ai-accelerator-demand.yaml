event_log:
  - date: 2026-08-31
    summary: NVIDIA Q2 FY27 法說補入：FY2028 營收指引 +70%（供給受限）、毛利率路徑、採購承諾 119 → 279 bn（主要為記憶體）
    delta: >
      current 95.7 不動（同一季，無新季度數據）。新增 supply_commitment 區塊並補齊 NVIDIA 成分的法說揭露 —— 原記錄只有財報數字，FY2028 指引、毛利率路徑、資料中心拆解三項當時全數漏掉。⚠ 第二條 falsifier 的判定關鍵：毛利率下滑是**成本問題不是需求問題**（CFO 明確歸因記憶體成本），且黃仁勳明言 demand is much greater than 70%、是供給受限 —— 措辭為需求側正面，故不觸發。第一條（合計營收連兩季 QoQ 轉負）因 FY2028 +70% 指引而更加遙遠。第三條（自研 ASIC 占比逾 30%）仍無揭露，但本次取得的 hyperscaler 48.7 / ACIE 40.3 拆解是另一個切面，不可代用。⚠ 結構修正：MU 與 SNDK 補入 transmission 並在 state 補上 driver_refs 完成雙向引用 —— 兩檔此前在覆蓋清單內卻不在任何 driver 的 transmission，是結構缺口；促成的一手證據正是 279 bn 採購承諾證明了「加速器需求 → 記憶體」這條路徑存在。⚠ 記憶體主題的證據等級因此升級：notes/2026-08.md 於 2026-08-27 拒絕晉升為 driver 的理由是第三次佐證為二手引用，本次補上的是 NVIDIA 財務長的一手量化揭露。
    fanout: >
      逐檔定級（扇出的價值在於確認每檔都被檢查過，不在於每檔都產生輸出）：
      **L1 — MU**：值不變但信心提高。NVIDIA 的 279 bn 採購承諾與 CFO 對記憶體成本的說明，
        是本檔漲價循環第一個來自下游客戶財務長的一手量化證據。已出變更單。
      **L0 — TSM／3324／6442／COHR／3037（硬體端，direction +）**：2027 capex 1.3 兆與
        NVDA FY2028 +70% 都是對既有 base case 的**確認**而非改變，未觸及任何 key_variable 的
        數值或信心門檻。依定級規則屬 L0，記一行不出報告。
      **L0 — MSFT／GOOG／META（平台端，direction −）**：2027 capex 較 2026 增約 63% 意味更大的
        折舊負擔，方向為負且與硬體端相反 —— 但這已在三檔各自的 thesis 內
        （MSFT 的折舊年限、GOOG 的 205 bn 折舊未入帳、META 的費用剪刀差），未改變任何數值。
        ⚠ 另有一個尚未量化的新角度：NVDA 明言供給受限而非需求受限，意味平台端的 capex
        可能不是「想花多少」而是「能買到多少」—— 若成立，capex guidance 的資訊量會下降。
        本次不改模型，列為觀察。
      **L0 — SNDK**：間接受惠（NAND 屬資料中心儲存層，不在加速器 BOM 關鍵路徑），
        強度低於 MU，與 coverage.yaml 對 memory 因子「同向但不等深」的註記一致。
      **⚠ 不在此處理 — NVDA**：FY2028 +70% 指引、毛利率路徑、279 bn 承諾、資料中心拆解
        （hyperscaler 48.7 + ACIE 40.3）全部是本檔自身的重大新資訊，且會改變 EPS 假設。
        依 /driver 規則「個股自己的事件不走這裡」，**需另走 /cta NVDA 或 /revalue NVDA**。
        本次僅更新共用層，未動 state/NVDA.yaml 的情境或訊號。
      **n/a — 3017／AMZN**：在 transmission 內但無 state 檔（刻意保留的真實傳導對象）。
      **不在 transmission — INTU（正確）／3008（⚠ 見下）**。
      ⚠ 扇出時發現的結構問題：3008 帶 cpo 標籤且其 thesis 完全建立在 CPO 時程上，
      但它不在 accelerator-roadmap 的 transmission 內，而 6442、COHR 都在。
      本次未修正 —— 因為促成的證據不是這則消息，硬改會讓變更失去可追溯性。列為待辦。
