      的舊雙鴻，**依 valuation.md 屬結構性改變，不可用**。
    ・thesis 明寫「**滲透率與單機價值量決定重評價幅度**」——
      ⚠ **而單機價值量至今為 `__`**，即 thesis 的兩個決定因子只有一個有數字。
    ・⚠ **capex／營收未取得**，資本密集度是推論而非證據，列 gaps。
    ⚠ **Q4 的處方中「選擇權拆分」對本檔不適用** —— 液冷已在營收裡（占比目標 55%+），
    不是尚未貢獻營收的業務線。實際可用的是 EV/Sales 與滲透率×價值量的自下而上推算。
  quadrant_since: 2026-09-08
  peer_group: 散熱
  peers:
  - 奇鋐 3017 — 現價 3,285.00／trailing PE **46.23**／**forward PE 26.26**／市值 **1.34T**／TTM EPS 73.98(+147.5%)／TTM 營收 184.87B(**+99.0%**)／Strong Buy 目標 3,916.41（stockanalysis，**as-of 2026-09-08 13:30 CST**）
  - ⚠ **同業只有這一家。n=1 時「族群中位數」就是該同業本身**，valuation-map 第三部分規則 1 無法發揮作用 —— 與 COHR 的 n=2 盲區同類，記於此
