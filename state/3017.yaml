    2026 下半年的年增率會機械性大幅下降 —— 用年增率設門檻會測到基期效應而不是需求。**
    **這是本日六檔中第一次基期效應強到會讓一個看似合理的 falsifier 變成壞的。**
    ⚠ 第二條門檻設 28% 而非 30%，**因為 Q1 的 29.77% 就已經在 30% 之下，設 30% 是壞門檻**。
    ⚠ 第三條錨在管理層自己的話（H2 優於 H1）但要求 1.15 倍，**因為「優於」太容易滿足**。
    ⚠ 第四條刻意與 AI 需求無關（水冷板月產能未達 100 萬套），
    **測的是產能落地的執行力 —— 而 thesis 兩邊都押在這個五倍擴充上。**
    ｜⚠ **wantgoo 市值欄位少一個數量級（載 1,327.225 億元，正確約 13,280 億元）——
    本日第二次遇到同一來源的同一種錯誤**（前一次為 2345），
    **應視為系統性單位問題，日後一律自行推算。**

