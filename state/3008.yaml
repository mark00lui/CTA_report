    bull **8,962** 對街上高 **9,000**（差 0.4%）。
    **bear 2,018 低於街上低 2,330 約 13%，是本模型唯一比街上悲觀的地方** ——
    而它 ≈ **52 週低 2,020**，是市場過去一年實際成交過的價位。
    ⚠ **bear 倍數自 14x 下修至 12x**（接近自身歷史 2023–2025 區間下緣 11.54x）：
