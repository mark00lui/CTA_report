notes: 本檔是覆蓋清單八檔中唯一同時被三個 driver 指向的標的（hyperscaler-capex 的支出承諾、
  ai-accelerator-demand 的實際出貨、accelerator-roadmap 的平台時程與封裝規格），傳導路徑最密集。
  common_premise 失效時它會同時從三個方向被打到，而個股層分析看不見這一點 —— 任何 L2 以上變動
  都要同步檢查覆蓋層，不能只看個股邏輯。
  ｜tw_fx 是本檔獨有的風險因子（3324／6442 雖同標 tw_fx，但營收與成本同幣別，敏感度遠低）。
  TSMC 營收以美元計、成本以台幣計 —— 台幣升值壓縮台幣計價的毛利率。對持有 ADR 的美元投資人
  雖另有換算利益，但兩者不對等，毛利率衝擊通常主導，淨效果為負。不要因為「台幣升值對美元
  投資人有利」就把方向搞反，那是只算了換算沒算營運。
  ｜2026-08-27 移除三行可推論持倉的文字：原 gaps 兩行指涉一個存有配置比重的私有檔案與一項尺寸紀律門檻，
  原 notes 一行陳述本標的在某組合中的相對規模排序。三者皆不含數字，故 check_public.py 掃不到 ——
  FORBIDDEN_KEYS 只比對欄位名，BLOCK_PATTERNS 的比重規則需要緊鄰數字。這是「正則比對不是理解」的實例。
  此處刻意不複述原文：既然目的是讓當前版本乾淨，就不該為了說明而再產生一份副本。
  歷史不動（該文字已隨 4a614e2 推上 origin/main）。詳見 reports/2026/08/2026-08-27-TSM-revaluation.md。
