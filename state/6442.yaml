  how_to_close: 公開資訊觀測站月營收公告
- question: A 客戶占比是否仍為 63%？該數字來自 2025 合併財報、已逾半年未更新，而它是本檔最大的單一風險。法說的「歐美市場 >95%」是地域不是客戶，兩者不可互相代用
  how_to_close: 年報／季報客戶集中度附註
notes: 單一客戶占比 63% 是本檔最大的非對稱風險 — 論點對了但客戶砍單，股價仍會受重擊。這個風險與論點本身相互獨立，訊號評級的信心度應據此下調。
  ｜2026-08-27 補充：這個風險因本次事件而「強化」而非緩解。CPO 產業放量後，本檔能否進入五家供應鏈同樣繫於客戶關係，
  等於同一個集中度風險同時決定了現有營收與新產品的機會 —— 兩者不獨立，不可視為兩條分散的路徑。
