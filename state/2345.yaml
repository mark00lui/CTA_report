#   (3) ⚠⚠ **但這是一檔「象限的預設主錨是錯的」的 Q4 標的。**
#       Q4 主錨是 EV/Sales，**而本檔毛利率只有 19.7%**（ODM）；
#       valuation-map 對 EV/Sales 的警告正是「**不同毛利率的公司不可比**」。
#       **故刻意把 Q4 的副錨（成長持續期）升為主錨，並說明為什麼。**
#   (4) ⚠ **兩個資料來源錯誤已交叉驗證並記錄**：Yahoo 的當日漲跌符號錯誤（本日第二次）、
#       wantgoo 的市值少一位數。**兩者都不是無關緊要的顯示問題，見 cta 與 gaps。**
