7 年底每股淨值 108.20 ＝ PB 6.33x，高 22%，亦即偏寬鬆 → 一致的倍數是 16.3x、目標價 559。** ⚠⚠ **base 的 20x 落在它們之間（中點 20.9x），而這是事後觀察不是它的來源 —— 20x 的來源是沿用。本輪刻意不動它，理由是「兩個錨方向相反時，把 base 移向任何一邊都等於偷偷選了一個錨」。** ⚠⚠⚠ **而要解它必須先處理一個更基本的不一致：valuation-map 把本檔判為 Q3（循環股），而 Q3 的處方是「資產與循環」而非「盈餘倍數」—— 亦即象限處方支持 Gordon 那一邊，與宣告的主錨（錨 B）不一致。** ⚠ **對照同日重估的 8046（同族群、同一條 Gordon 公式）：它的 FY2027 ROE 41.2% → Gordon 6.03x 對 base 6.00x，誤差 0.5%，被驗證；本檔 ROE 36.0% → 高 22%，未被驗證。ROE 只差 5.4pp，而 Gordon 的分子是 ROE − g（g = 5%），故分子差 14%。** ⚠ **共同脆弱點：兩檔的 r 都是 11% 且無可觀測錨。本檔敏感度 r 11% → 5.17x、r 12% → 4.43x、r 13% → 3.88x —— r 越高，「base 偏寬鬆」的判定越強，方向已知。** ⚠ **每股淨值改用實際值重建**：2026Q2 實際 **77.90**（state 記 71.39，低 8.4%）＋ H2'26 約 6.01 − 除息 2.00 ＝ 2026 年底 81.91；＋ FY2027 34.24 − 2027 除息 7.96（歷史平均配發率 42%）＝ **2027 年底 108.20**（state 原估約 115，低 5.9%）。"
