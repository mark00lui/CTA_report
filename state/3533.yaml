    **發現的正是「美股樣本的倍數水準明顯高於 A 股龍頭」。本族群是否也有同樣偏差，取得之前不知道。**
  how_to_close: 各家報價頁（stockanalysis／Goodinfo／東方財富）
- question: >
    ⚠ **AI 相關產品（QDS ＋ SOCAMM）的合計營收占比與毛利率未單獨揭露。**
    已知 QDS 約 1%（下半年估 2–3%）、ASP 每 set 20–30 美元、**毛利率低於公司平均**；
    SOCAMM 剛量產但無數字。
    ⚠⚠ **這一項直接決定 factor_tags** —— 已寫定規則：
    **合計占比 > 15% 則加上 `ai_capex_hw` 並重估。取不到就無法執行那條規則。**
  how_to_close: 季度法說的產品別揭露；直接於法說 Q&A 詢問兩者合計占比
- question: >
    ⚠ **現金增資與第三次無擔保可轉債的定價、時點與轉換價未取得。**
    已知上限為普通股 130 萬股（**佔在外股數 1.16%**）與 CB 3 萬張。
    **轉換價未知，故 CB 的潛在稀釋無法計算 ——** 第五條 falsifier 的分母因此只有一半。
  how_to_close: 公開資訊觀測站的重大訊息與發行辦法；股東會議事錄
- question: >
    ⚠ **越南廠二期的投資金額與時程未取得。** 已知宿舍擴建中、二期廠房規劃中、
    越南廠逾 70% 產能鎖定伺服器產品。
    **它是 capex 缺口（第一項）的主要成因，兩者要一起補。**
  how_to_close: 法說簡報的產能規劃頁；重大訊息的投資公告
- question: >
    ⚠ **現價來源有小幅衝突**：Yahoo 記 1,575.50（13:30）、wantgoo 記 1,580.00（12:41），
    差 0.29%（盤中時間差，可接受）。
    ⚠⚠ **但 Yahoo 同時把當日漲跌顯示為「+50.00（+3.08%）」，符號有誤** ——
    以開 1,610／高 1,620／低 1,575／昨收 1,625 判定當日為**跌** 49.50 元（-3.05%）。
    **已交叉驗證後不採其符號，記在這裡以免日後翻查時被同一個錯誤誤導。**
  how_to_close: 收盤後取正式收盤價與漲跌幅

notes: >
  ⚠⚠ **本檔最該先記住的是它為什麼不標 `ai_capex_hw`，因為那是本日四檔中最容易被質疑的一個判斷。**
  伺服器佔 Q2 營收 **55.36%**（年增 **+71%**），看起來就是 AI 曝險。
  **但那主要是一般用途伺服器的 CPU 插槽 —— 動能來自 Intel Oak Stream 與 AMD Venice 的
  平台世代切換（管理層估 2026 Q4 或 2027 初放量），而不是 AI 加速器的建置。**
  **直接與 AI 相關的 QDS 目前佔營收約 1%（下半年估 2–3%），SOCAMM 剛量產，
  而管理層自己說 GPU／AI 晶片專案的「採用與導入時間不確定」。**
  **標上 `ai_capex_hw` 會讓因子模型說一句我沒有證據的話 ——
  這與 AXTI 不標 `substrate`（同名不同物）、AAOI 不標 `china_ops`（多基地、比例未知）是同一種紀律。**
  ⚠⚠ **而為了讓這個分類本身可以被否證，已在 `changes_if` 寫定一條規則：
  QDS ＋ SOCAMM 合計營收占比 > 15% 則加上 `ai_capex_hw` 並重估。
  規則寫在前面，就不必留給日後的我自由心證。**
  ｜⚠⚠ **本檔是本日建立的四檔中唯一象限落在 Q1 的，也是唯一 trailing PE 可以直接當工具用的。**
  對照：AXTI trailing PE **1,141.03**（分母趨零）、AAOI EPS **-0.79**（分母為負）、
  LITE GAAP 亦為負。**本檔 TTM EPS 82.02、Q2 營業利益率 21.97%、FY2025 配息 35 元。**
  ⚠ **但象限判定的 Y 軸完全未取得，這是本日四檔中證據最薄的一個判定。** 見 gaps 第一項。
  ｜⚠⚠ **估值的對照值得完整寫下來，因為它是本檔被納入的主要理由**：
  **本益比 19.81（Yahoo 同日載同業平均 47.44）、以法人共識 2026 EPS 95 元計為 16.58x forward。**
  **對照本日另三檔：AAOI EV/Sales 15.04x 且營業利益從未為正、
  AXTI EV/Sales 32.73x 且 trailing PE 1,141x、LITE EV/Sales 29.08x。**
  ⚠⚠ **但「便宜」在這裡是待解釋的現象，不是結論。**
  **至少有三個理由可以解釋 19.81 倍**：(a) 總營收年增僅 **17.7%** ——
  伺服器 +71% 的同時桌機 -14%、筆電 -14%、嘉基 -19%，**組合在改善但規模沒跟上**；
  (b) **毛利率正在轉折向下**（49.55% → 45.47%），且改善要等 2026 Q4 或 2027 初；
  (c) **伺服器曝險主要是 CPU 平台而非 AI 加速器。**
  **在這三點被逐一檢驗之前，把低本益比讀成錯價是搶答。**
  ｜⚠⚠ **本檔是「三個現有 driver 都不解釋它」的第三個實例，這已經是模式不是巧合。**
  **CEG：沒有一個 driver 記用電量。AAOI：沒有一個 driver 記 DOCSIS 升級循環。
  本檔：沒有一個 driver 記 CPU 平台世代切換。**
  **三個現有 driver 全部只記「AI 資本支出的流量」，而清單正在納入越來越多不由那個流量驅動的標的。**
  **處置建議：新增 `server-platform-cycle` driver（本檔），
  並與先前建議的 `datacenter-power-demand`（CEG）、`broadband-access-capex`（AAOI）一併排程。**
  ｜⚠ **技術面的狀態要與本日另三檔分開講，因為同一個「中性」有三種來源**：
  **AXTI／LITE 是「無法判定」（均線取不到或距現價 -33.6%／-74.2%）；
  AAOI 是「判定了，結果是未確認」（價格在 50DMA 之下 7.9%）；
  本檔是「判定了，結果是已經跌破」（價格在季線之下 17.14%）。**
  **三種狀態、同一個評級，不可用同一句話帶過。**
  ⚠ 而 **Beta（近半年）1.28 是本日四檔中最低的**（AAOI 3.78、AXTI 1.92、LITE 1.54）——
  **均線在這個 beta 下的訊噪比也是本日最好的，可惜半年線與年線沒取得。**
  ｜⚠ **月營收是台股標的相對美股的一個真實優勢，本檔的第一條 falsifier 就建立在它上面**：
  **每月 10 日前公告，9 月營收約 2026-10-10 就會揭曉 —— 一個月內可驗證。**
  **本日另三檔（LITE／AXTI／AAOI）最快的可驗證點都要等到季報。**

event_log:
