- driver: hyperscaler-capex
  direction: '+'
  note: >
    CSP 資本支出 → AI 加速器建置 → 高頻寬記憶體的規格與採用。
    ⚠ **敏感度記「低」，而且理由是時程不是幅度**：**同上，VHMStack 要到 2027–2028。**
    ⚠⚠ **而本檔與覆蓋清單內三檔記憶體相關標的的關係要分清楚，否則會誤判**：
    **MU 與 SNDK 是有廠的記憶體製造商（賣位元）；8299 群聯是控制器與模組廠（賺價差）；
    本檔是無廠的客製化記憶體 IC 設計（賣設計與規格）。**
    **三種商業模式完全不同 —— 同一則記憶體漲價的消息，對三者的方向與幅度都不一樣，
    扇出時不可套用同一個結論。**

